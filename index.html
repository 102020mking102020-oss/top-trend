يم يعتمد على سلطة الملن دون أي مساعدة .\n(ٕ) نالت المرأة في بالد اليمن المديم حمولها االجتماعية والسياسية .\n(ٕ) ظهور الممالن اليمنية المديمة ، ونظام الحكم السابد ."],[65,"شهدت منطقة الشرق األقصى القديم (شرق وجنوب شرق قارة آسيا) قيام حضارات\nعريقة كما يتضح من الخريطة التالية :\n أسهمت الحضارات المديمة بالشرق األلصى من بينها الحضارة الهندية والحضارة الصينية بإنجازاتها في\nمجاالت مختلفة .\n كان لحضارات الشرق األلصى المديم تؤثير متبادل بينها وبين الحضارة المصرية المديمة ما النتائج؟\nمما ساهم في إثراء التراث الحضاري اإلنساني المشترن .\n دلل : تشابهت بعض عوامل قيام حضارات الشرق األدنى القديم والحضارات القديمة\nبالشرق األقصى ؟ حيث :\nٔ) توافر المياه العذبة من األنهار والتربة الخصبة مما ساعد على ليام الزراعة .\nٕ) توافر الموارد .\nٖ) اعتدال المناخ الذي ساعد على استمرار السكان .\nالعامل المشترك بين الحضارة الهندية القديمة والصينية القديمة نشأتهما حول ضفاف األنهار\nوفيما يلى نتعرف الحضارة الهندية القديمة والحضارة الصينية القديمة بالتفصيل :"],[66,"أوالي : احلضارَ اهلهديُ القدميُ\nنشأتها :\nنشؤت الحضارة الهندية المديمة على طول وادى «نهر السند »\nفي شمال غرب الهند وباكستان الحاليتين حيث :\nبدأت كمرى زراعية صؽيرة ،\nكبيرا من السكان .\nثم اتحدت معيا لتشكل مدنا كبرى ضمت عدديا\nمالمح الحضارة الهندية القديمة :\nٔ - الحياة االجتماعية :\n دلل : تعددت طبقات المجتمع فى الهند قديميا كباقى حضارات العالم ؟\nكانت طبمات المجتمع تمسم بنا ًء على المهنة أو الوراثة إلى أربع طبمات :\n- أعالها الكهنة والعلماء .\n- أدناها الخدم والعمال .\n دلل : تمتعت المرأة في بدايات الحضارة الهندية ببعض الحقوق ؟\nحيث :\nٔ) سجلت مساهماتها فى الحوارات الفلسفية .\nٕ) شاركت في الطموس الدينية .\n غير أن هذه المكانة بدأت تتراجع في الفترات الالحقة .\nٕ - الحياة الدينية :\n دلل : تعددت العبادات الوضعية في الحضارة الهندية القديمة ؟\nحيث :\nٔ) لدَّس الهنود معبودات متعددة مستوحاة من الظواهر الطبيعية ، ولدسوا نهر السند وروافده .\nٕ) تُعد الهند مهديا للكثير من العبادات الوضعية التى أثرت بشكل كبير على الحياة\n- البوذية .\nاالجتماعية والفكرية للسكان ، مثل - : الهندوسية .\n اعتقد الهنود القدماء فى وجود حياة أخرى بعد الموت .\nحيث :"],[67,"ٖ - الحياة االقتصادية :\nالزراعة :\n كانت الحرفة الربيسية في الهند لدي ًما .\n- الشعير .\n من أهم المحاصيل الزراعية - : الممح .\nالصناعة :\nحيث برع الهنود فى :\n دلل : برع الهنود في الكثير من الصناعات ؟\nاستخدام المعادن في صناعة األدوات ، والحلى ، واألسلحة .\nصناعة المنسوجات المطنية .\nصناعة الخزف .\nالتجارة :\n استخدم الهنود في تجارتهم األوزان الحجرية المكعبة بم تفسر؟ لتحديد أوزان السلع .\n استخدم الهنود في تجارتهم األختام بم تفسر؟ للداللة على منشؤ السلع المعدة للتجارة .\n دلل : اهتم سكان الهند قديماً بإقامة عالقات تجارية واسعة مع المناطق المجاورة؟\nحيث نشطت التجارة لدي ًما بين الهند وعديد من المناطك ، مثل :\n-  بالد العراق المديم .\n- حضارات بالد اليمن المديم .\n- بالد فارس .\nٗ - العمارة والفنون :\n دلل : اهتم الهنود القدماء بتخطيط المدن والطرق ؟\nٔ) مناطك محددة للسكن .\nٕ) أماكن لألسواق التجارية بم تفسر؟ لممارسة األنشطة االلتصادية .\nٖ) مناطك إللامة شعابرهم الدينية (وهذا يدل على ارتباط العمارة بالدين) .\n دلل : برع الهنود في فن النحت ؟\nحيث نحتوا على الكهوف مثل «كهوف أجانتا » .\nحيث كانوا يخصصون :"],[68,"٘ - الحياة العلمية :\n دلل : تُعد الهند أحد مراكز العلم والثقافة في العصور القديمة؟\nحيث :\n برع العلماء الهنود فى علم الفلك دلل؟ ساهموا في دراسة حركة األرض والكواكب .\n برع العلماء الهنود فى علم الطب دلل؟\nأجروا عمليات جراحية دليمة .\nاستخدموا األعشاب والمواد الطبيعية في العالج .\nالتدريب األول\nسٔ : اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) ساهم العلماء الهنود فى دراسة حركة األرض والكواكب من خالل اهتمامهم بعلم . ......\n(الهندسة - الفلن - الطب - الحساب )\n(ٕ) كانت الحرفة الربيسية فى الحضارة الهندية المديمة . ......\n(الصناعة - الزراعة - التجارة - النمل )\nسٕ : ما تقييمك لمصداقية كل عبارة من العبارات اآلتية ؟ مع ذكر السبب في الحالتين :\n(ٔ) شهدت منطمة الشرق األلصى المديم لمارة آسيا ليام حضارات عريمة .\n(ٕ) ارتبطت نشؤة الحضارة الهندية بمولعها على نهر السند .\n(ٖ) خال المجتمع الهندى لدي ًما من التمسيم الطبمى .\n(ٗ) برع الهنود المدماء في استخدام المعادن .\n(ه) اهتم الهنود المدماء باستخدام وسابل مختلفة لتنظيم التجارة .\n( )ٙ لدس الهنود المدماء العديد من المعبودات .\n( )7 برع الهنود المدماء في فن النحت .\nسٖ : أيد باألدلة التاريخية صحة كل عبارة من العبارات التالية :\n(ٔ) تمتعت المرأة فى بدايات الحضارة الهندية ببعض الحموق .\n(ٕ) اهتم الهنود المدماء بالعمارة .\n(ٖ) برع علماء الهند لدي ًما في علم الطب ."],[69,"ثانييا : احلضارَ الصيهيُ القدميُ\nنشأتها :\n نشؤت الحضارة الصينية في وادي نهر « هوانج هو » وتُعد\nمن ألدم الحضارات التي عرفها اإلنسان .\n كان يحكم الصين فى معظم تاريخها أسر لوية تدعى « السالالت الحاكمة» .\nحيث :\n دلل : كان ألسرة «تشين» أثر واضح على الحضارة الصينية؟\nاستطاعت أسرة «تشين» أن تإسس الدولة الصينية حيث لامت بتوحيد الدويالت المتنازعة على الحكم تحت\nسلطة مركزية واحدة .\nمالمح الحضارة الصينية القديمة\nٔ - الحياة االجتماعية :\n كانت األسرة فى المجتمع الصينى القديم هي وحدة البناء األساسية للمجتمع دلل؟\nحيث : اهتموا بتربية األطفال على عدة ليم منها :\n- احترام الكبار .\n- الطاعة والوالء لألسرة والمجتمع .\nحرمت المرأة في المجتمع الصيني قديميا من حقوقها دلل؟\nحيث :\nالتصر دورها على تربية األطفال وإدارة شبون المنزل .\nلم يكن لها الحك فى الميراث أو تولى المناصب الحكومية .\nٕ - الحياة الدينية :\n تنوعت المعتقدات الدينية لدى الصينيين قديميا .\n كان هناك تواصل ديني بين الحضارة الصينية والهندية ما النتائج؟\nأدى إلى دخول العبادة البوذية إلى الصين عن طريق الهند ."],[70,"ٖ - الحياة االقتصادية :\nالزراعة :\n كانت الزراعة أساس االقتصاد الصينى القديم .\n اهتم الصينيون القدماء بالزراعة دلل؟ حيث قاموا بـ :\nاستصالح األراضي .  من أشهر المحاصيل الزراعية :\nشك الترع والمنوات لتنظيم الرى . - القمح .\n- األرز .\n اهتم الصينيون القدماء بتربية دودة القز بم تفسر؟ إلنتاج خيوط الحرير التي اشتهرت بها\nالصين في العالم المديم .\nالصناعة :\n دلل : اشتهر الصينيون القدماء بنشاطهم الصناعي ؟ حيث اشتهر الصينيون القدماء بـ :\n- صناعة الخزف .\n- صناعة المالبس من الحرير .\n- صناعة األدوات البرونزية المختلفة .\nالتجارة\n بم تفسر : ازدهر التبادل التجاري بين الصين ودول العالم القديم ؟ بسبب :\nٔ) ظهور العمالت المعدنية .\nٕ) «طريك الحرير» الذي كان يربط الصين ببالد وسط آسيا وأوروبا والذي ساعد في تنشيط حركة\nالتجارة وتبادل المنتجات واألفكار بين الصين ودول العالم المديم .\n دلل : مثل طريق الحرير أهمية كبيرة عند الصينين القدماء ؟ اإلجابة النقطة رقم (ٕ)\nٗ - العمارة والفنون :\n دلل : كان الصينيون القدماء يهتمون بحماية حدودهم؟ حيث :\nاهتم الصينيون القدماء بتخطيط المدن بشكل دقيق .\nكانت المدن محاطة بأسوار كبيرة لحمايتها من الهجمات ، ومنها : سور الصين العظيم ."],[71,"سور الصين العظيم -:\n من أعظم اإلنجازات المعمارية في الحضارة الصينية .\n من ضمن الموالع المسجلة على لابمة اليونسكو للتراث العالمي .\n بم تفسر : قيام الصينيون ببناء سور الصين العظيم؟\nلحماية الحدود الشمالية للصين من األعداء .\n دلل : برع الصينيون فى كل ألوان الفنون ؟ حيث برعوا في :\n- الموسيمى .\n- الرسم .\n- كتابة الشعر .\n- النحت .\n- الفنون المتالية مثل : الكونػ فو .\n٘ - الحياة الفكرية والعلمية :\n حقق الصينيون القدماء تقدميا فى عديد من المجاالت الفكرية والعلمية دلل؟ حيث في :\nالفلسفة : وضعوا لواعد أخاللية عملية منظمة للسلون اإلنساني .\nالرياضيات : استخدموا جدول الضرب .\nالطب : ابتكروا طرليا متنوعة للعالج مثل الوخز باإلبر والعالج باألعشاب الطبية .\n سبق الصينيون حضارات العالم القديم فى اختراع عديد من االبتكارات المهمة دلل؟\nحيث كان لهم الفضل في اختراع :\n- فن الطباعة .\n- البوصلة .\n- الورق الذي اخترعه العالم «تساى لون » .\n- البارود .\nالتدريب الثاني\nسٔ : دلل على صحة كل عبارة من العبارات اآلتية :\nبدورا مه ًما فى تاريخ الحضارة الصينية المديمة .\n(ٔ) لامت أسرة «تشين »\n(ٕ) حرمت المرأة فى الحضارة الصينية لدي ًما من بعض حمولها .\n(ٖ) تؤثرت الحياة الدينية فى الحضارة الصينية بالمعتمدات الهندية .\n(ٗ) اهتمام الصينيين المدماء بالزراعة .\n(ه) اهتم الصينيون المدماء بحماية حدودهم .\n( )ٙ سبك الصينيون حضارات العالم المديم فى اختراع عديد من االبتكارات المهمة ."],[72,"سٔ : أكمل العبارات اآلتية بما يناسبها :\n(ٔ) من العبادات الوضعية فى الهند لدي ًما ............... و . .............\n(ٕ) من أهم المحاصيل التى لام الهنود المدماء بزراعتها . .............\n(ٖ) نشؤت الحضارة الصينية فى وادى . ............. .\n(ٗ) كانت وحدة البناء األساسية للمجتمع فى الصين لدي ًما تتمثل فى . ............. .\n(ه) اهتم الصينيون المدماء بتربية دودة المز إلنتاج . ............. .\nسٕ : اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) شهدت منطمة الشرق األلصى المديم ليام حضارات عريمة مثل . ............. .\n(الحضارة الهندية المديمة - الحضارة الفينيمية - حضارات بالد اليمن - حضارات بالد الرافدين )\n(ٕ) نشؤت الحضارة الهندية في البداية . ............ .\n(مدن كبرى - ممالن موحدة - لرى زراعية صؽيرة - إمبراطورية )\n(ٖ) كانت أعلى الطبمات في المجتمع الهندى المديم تضم .. .............\n( الكهنة والخدم - الكهنة والعلماء - العمال والخدم - العلماء والفالحين)\n(ٗ) العامل المشترن بين الحضارة الهندية المديمة والصينية المديمة نشؤتهما . ............. .\n(فوق المناطك المرتفعة - فى شمال المارة اآلسيوية - في مناطك األودية الجافة - حول ضفاف األنهار )\n(ه) من المعتمدات الدينية التي دخلت إلى الصين عن طريك الهند لدي ًما . ............. .\n(الديانة اليهودية - الديانة المسيحية - العبادة البوذية - العبادة الهندوسية )\n( )ٙ كان أساس االلتصاد الصينى حرفة . .............\n( الزراعة - الصناعة - الرعى - الصيد )\nتؤثيرا فى تبادل األفكار بين الصين ودول العالم المديم؟ . ...\n( )7 أى من األنشطة االلتصادية اآلتية كانت األكثر\n( الصيد - التجارة - الزراعة - الصناعة )\n( )8 لامت المنظمة الموضح شعارها فى الصورة الممابلة بتسجيل أحد الموالع األثرية التي كانت ترتبط\nبالحماية فى الحضارة الصينية المديمة والتي كانت تمع في جهاتها . ............. .\n(الشرلية - الؽربية - الجنوبية - الشمالية )\n( )9 سبك الصينيون حضارات العالم المديم فى جميع ما يلى ويخرج عنها . ............. .\n( البارود - فن الطباعة - البوصلة - العالج باألعشاب )\n(ٓٔ) من إنجازات العالم الصينى «تساى لون » اختراع . ............. .\n( الطباعة - البوصلة - الورق - البارود)"],[73,"سٖ : اكتب كلمة (صواب ) أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٕ) كان يتم تمسيم طبمات المجتمع فى الهند لدي ًما بنا ًء على المهنة والوراثة .\n(ٖ) االعتماد فى وجود حياة أخرى بعد الموت إحدى خصابص الحياة الدينية عند الهنود المدماء ( .\n(ٗ) حرص الهنود المدماء أثناء تخطيط مدنهم على تخصيص مناطك إللامة شعابرهم الدينية .\n(ه) برع الصينيون في فن النحت ومنها «كهوف أجانتا » .\n( )ٙ كانت الهند أحد مراكز العلم والثمافة في العصور المديمة .\n( )7 لام الهنود لدي ًما بإجراء العمليات الجراحية الدليمة .\n( )8 حكم الصين فى معظم تاريخها أسر لوية تدعى السالالت الحاكمة .\n( )9 ارتبط ازدهار التجارة الصينية بعدة عوامل منها ظهور العمالت المعدنية .\n(ٓٔ) ساهم طريك البخور فى زيادة تبادل المنتجات واألفكاربين الصين ودول العالم المديم .\n(ٕٔ) كانت المدن في بالد الصين لدي ًما محاطة بؤسوار كبيرة لحمايتها .\n(ٖٔ) الكونػ فو من أشهر الفنون المتالية في الهند لدي ًما .\n(ٗٔ) تشابهت الحضارة الهندية مع الحضارات الصينية في استخدام األعشاب في العالج .\nسٗ : صوب ما تحته خط :\n(ٔ) أثرت الديانات السماوية بشكل كبير على الحياة االجتماعية والفكرية للسكان في الحضارة الهندية المديمة .\n(ٕ) كانت الصناعة الحرفة الربيسية فى الحضارة الهندية المديمة .\n(ٖ) كان طريك الحرير يربط الصين ببالد وسط آسيا وإفريميا .\n(ٗ) من ابتكارات الهنود المدماء في مجال الطب الوخز باإلبر .\nس٘ : اكتب ما تشير إليه كل عبارة مما يلى :\n(ٔ) أحد أنهار لارة آسيا لامت على طول واديه الحضارة الهندية .\n(ٕ) بناء هندسى يُعد من أعظم اإلنجازات المعمارية فى حضارة بالد الصين المديم .\nس :ٙ اذكر عمليا واحديا لكل من :\n(ٔ) أسرة «تشين» .\n(ٕ) العالم تساى لون ."],[74,"س :ٚ بم تفسر ... ؟\n(ٔ) استخدم الهنود المدماء األختام في نشاطهم التجاري .\n(ٕ) أهمية طريك الحرير عند الصينيين المدماء .\n(ٖ) ليام الصينيين المدماء ببناء سور الصين العظيم .\nس :ٛ ما النتائج التي ترتبت على ... ؟\n(ٔ) التواصل الديني بين الحضارتين الهندية المديمة والصينية المديمة .\n(ٕ) إدران المجتمع الصينى المديم أن األسرة هى وحدة البناء األساسية في المجتمع .\nس :ٜ دلل على صحة كل عبارة من العبارات اآلتية :\n(ٔ) كان المجتمع الهندى المديم مجتمعا طبمييا .\n(ٕ) اهتم سكان الهند المديم بإلامة عاللات تجارية واسعة ، مع المناطك والحضارات األخرى .\n(ٖ) كان تخطيط الطرق والمدن موضع اهتمام الهنود لدي ًما .\n(ٗ) برع الهنود المدماء في فن النحت .\n(ه) أبدع الهنود المدماء في عديد من العلوم .\n( )ٙ عمل الصينيون لدي ًما على توسيع رلعة األراضى الزراعية .\n( )7 برع الصينيون المدماء في العمارة .\n( )8 تميزت الحضارة الصينية المديمة بالبراعة في كل ألوان الفنون\n( )9 تمدم الصينيون المدماء في عديد من المجاالت العلمية .\nسٓٔ : ما تقييمك لمصداقية كل عبارة من العبارات اآلتية؟ مع ذكر السبب في الحالتين :\n(ٔ) ارتبطت بعض المعبودات فى الحضارة الهندية المديمة بالظواهر الطبيعية .\n(ٕ) تؤثر المجتمع الهندى المديم بالعبادات الوضعية .\n(ٖ) التصر استخدام الهنود المدماء للمعادن على صناعة ال ُحلى .\n(ٗ) كانت الصناعة عند الصينيون المدماء متدهورة\n(ه) التصر التمسيم الطبمى فى الحضارة الهندية المديمة على أساس النشاط االلتصادي وحده .\nسٕٔ : ما العالقة بين ... ؟\n(ٔ) األوزان الحجرية المكعبة ، والحضارة الهندية المديمة .\n(ٕ) العمارة في الحضارة الهندية المديمة ، والحياة الدينية .\n(ٖ) منظمة اليونسكو ، وسور الصين العظيم ."],[75," كانت لارة آسيا مهديا لواحدة من أعظم الحضارات اإلنسانية التى أثرت فى العالم بإنجازاتها العلمية\nوالثمافية وهى الحضارة اإلسالمية .\n نشؤت الحضارة اإلسالمية مع ليام الرسول صلى الله عليه وسلم بتؤسيس الدولة اإلسالمية فى «المدينة» لتنمو هذه\nالحضارة وتتسع لتشمل مناطك كثيرة من العالم من بعده في عصور الخالفة اإلسالمية .\nكما يتضح من الخط الزمني والخريطة التالية :\n دلل : برع الصينيون فى كل ألوان الفنون ؟ حيث برعوا في :\nالحظ : من الخريطة السابقة :\n امتدت الدولة اإلسالمية إلى وسط آسيا وشمال إفريقيا ثم وصلت إلى األندلس\nوأجزاء أخرى من أوروبا .\n بداية ظهور اإلسالم كان في شبه الجزيرة العربية في القرن الـ ٚ م بقارة آسيا ."],[76,"أوالي : العصز الهبىي\n أحدث ظهور اإلسالم في شبه الجزيرة العربية فى القرن السابع الميالدى تحوالت\nجذرية في حياة العرب والعالم دلل؟ حيث أصبح العرب أمة واحدة متماسكة بعد أن كانوا لبابل متفرلة\nفمد أسس النبي ملسو هيلع هللا ىلص مجتمعيا جديديا في المدينة لاب ًما على العدل والشورى والتسامح والمحبة ، وكان هذا\nالمجتمع النواة لحضارة عظيمة امتد تؤثيرها إلى العالم أجمع .\nعوامل قيام وازدهار الحضارة اإلسالمية :\nقامت الحضارة اإلسالمية على مجموعة من العوامل التي ساعدت على ازدهارها واستمرارها\nلعدة قرون ، منها :\nٔ - الدين اإلسالمي :\n- المرآن الكريم .\nحيث ارتكزت الحضارة اإلسالمية على :\n- ترسيخ عميدة التوحيد .\nسنة النبي دمحم .\nٕ - القيم واألخالق :\n دلل : تمثل القيم واألخالق إحدى عوامل قيام وازدهار الحضارة اإلسالمية ؟\n ما العالقة بين : القيم واألخالق وبناء المجتمع اإلسالمي؟\nحيث :\nجاء اإلسالم بميم عظيمة ، مثل : اإلخاء والعدل والمساواة ، والرحمة ، وتشجيع طلب العلم ولد ساعدت هذه الميم\nفي بناء مجتمع لوى ومتعاون ومتماسن يسعى للمعرفة والتمدم .\nٖ - االنفتاح على الحضارات األخرى :\nمن خالل اندماج ثمافات الشعوب المختلفة عربية وغير عربية ما النتائج ؟ فظهرت إبداعات في شتى مجاالت\nالعلوم والفنون واآلداب .\nٗ - اللغة العربية :\n دلل : تُعد اللغة العربية إحدى عوامل قيام وازدهار الحضارة اإلسالمية ؟\nحيث ساعدت على :\nتوحيد الشعوب التي دخلت في اإلسالم .\nنشر العلم والمعرفة والتبادل الثمافي بين المسلمين ."],[77,"ما المقصود بالخالفة اإلسالمية ؟ نظام حكم ظهر في الدولة اإلسالمية بعد وفاة الرسول\nحيث يتولى الخليفة إدارة الدولة وقيادتها .\nٔ - الخالفة الراشدة( عصر الخلفاء الراشدين)\n بعد وفاة النبي محمد صلى الله عليه وسلم تولى أبو بكر الصديق الخالفة وكان أول الخلفاء الراشدين ثم\nجاء بعده ثالثة من الخلفاء وهم :\nالخليفة عمر بن الخطاب .\nالخليفة عثمان بن عفان .\nالخليفة على بن أبي طالب .\n حرص الخلفاء الراشدين على اتباع منهج سنة النبي اهلل فى الحكم والعدل ونشر\nاإلسالم .\n دلل : تعددت إنجازات الدولة اإلسالمية في عهد الخالفة اإلسالمية؟حيث كان من أهمها :\nٔ) المضاء على حركة الردّة .\nٕ) جمع المرآن الكريم في مصحف واحد .\nٖ) وضع أسس اإلدارة والحكم في الدولة اإلسالمية .\nٗ) نشر اإلسالم خارج شبه الجزيرة العربية .\n بعد انتهاء عصر الخلفاء الراشدين : بدأ عصر الخالفة األموية .\nٕ - الخالفة األموية :\nتولى معاوية بن أبى سفيان الحكم وأسس الدولة األموية وجعل « دمشق» عاصمة لها .\nحيث كان من أهمها :\n دلل : تعددت إنجازات الدولة األموية؟\nٕ) سن العملة اإلسالمية .\nٖ) استكمال الفتوحات اإلسالمية .\nسقوطها : مع ضعف الخلفاء في أواخر العصر األموي ما النتائج؟ سقطت الدولة األموية\nوتولى العباسيين الحكم بعدهم ."],[78,"ٖ - الخالفة العباسية :\nقام العباسيون بنقل عاصمة الخالفة إلى بغداد .\n دلل : تميزت فترة الخالفة العباسية باالزدهار العلمي والحضاري؟\nحيث :\nٕ) إنشاء بيت الحكمة والمكتبات .\nٖ) التمدم الكبير فى العلوم والفنون واآلداب ونشاط حركة الترجمة التي أثرت في الفكر اإلسالمي .\nبسبب :\n بم تفسر : سقوط الخالفة العباسية؟\nضعف الخلفاء العباسيين فى العصر العباسي الثانى وهزيمتهم على يد المؽول .\nالتدريب األول\nسٔ : اكتب كلمة (صواب ) أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٔ) ظهر اإلسالم بشبه الجزيرة العربية خالل المرن السابع الميالدى .\n(ٕ) انؽلمت الحضارة اإلسالمية على نفسها .\n(ٖ) ظهر نظام الخالفة بعد وفاة النبي .\n(ٗ) يُعد معاوية بن أبي سفيان أول الخلفاء العباسيين .\n(٘) حرص الخلفاء الراشدين على اتباع منهج سنة النبي ملسو هيلع هللا ىلص في الحكم .\nسٕ : دلل على صحة كل عبارة مما يأتي :\n(ٔ) كان لظهور اإلسالم ً\n(ٕ) تُعد اللؽة العربية أحد عوامل ليام وازدهار الحضارة اإلسالمية .\nسٖ : ما العالقة بين : الميم واألخالق ، وبناء المجتمع اإلسالمي ؟\nسٗ : ما المقصود بـ : الخالفة اإلسالمية ؟"],[79,"ٔ - الحياة السياسية :\nفي عهد الرسول صلى الله عليه وسلم :\nحيث :\n دلل : وضع الرسول صلى الله عليه وسلم أساس الدولة اإلسالمية بالمدينة؟\nأسس الرسول صلى الله عليه وسلم في \"المدينة\" أول مجتمع سياسی منظم لابم على مبادئ اإلسالم .\nووضع الرسول صلى الله عليه وسلم أول دستور مكتوب وهو «صحيفة المدينة » .\n بم تفسر : وضع الرسول صلى الله عليه وسلم أول دستور مكتوب في حياة العرب؟\nبهدف :\nتنظيم العاللة بين المسلمين وغيرهم من سكان المدينة .\nفي عصر الخالفة الراشدة :\nكان اختيار الخليفة قائميا على الشورى .\nفي العصر األموي :\n ما العالقة بين : معاوية بن أبي سفيان ونظام الحكم في الدولة اإلسالمية؟حيث :\nلام معاوية بن أبى سفيان بتؽيير نظام الحكم من اختيار الخليفة المابم على الشورى إلى نظام الوراثة ووالية\nالعهد ولد استمر هذا النظام بالدولة العباسية .\nٕ - الحياة االجتماعية :\n عمل اإلسالم على تنظيم شبون األسرة والمجتمع وحفظ حموق جميع الفبات .\n فرض اإلسالم الزكاة بم تفسر؟\nلرعاية الفمراء وتوفير احتياجاتهم مما حمك التوازن بين طبمات المجتمع .\n كان للمرأة مكانة كبيرة في المجتمع اإلسالمي دلل ؟\nحيث :\nتعددت أدوارها فى المجتمع فإلى جانب دورها كؤم كانت تموم ببعض األعمال مثل :\nالمشاركة في المعارن لتضميد الجرحى وسمى المحاربين .\nالتجارة والطب والفمه ."],[80,"ٖ - الحياة االقتصادية :\n دلل : قامت الحياة االقتصادية على مبادئ اإلسالم؟\nحيث :\nلامت على مبادئ اإلسالم مثل العدل وتحريم الؽش والتكافل مما أدى إلى التمدم في المجاالت .\nالزراعة :\n دلل : اهتم المسلمون بالزراعة في الدولة اإلسالمية؟\nحيث :\nاهتم المسلمون ببناء الجسور والسدود على األنهار ومجارى السيول ، مثل : سد معاوية بالمدينة .\nأنشؤ العباسيون لنوات للرى بين نهري دجلة والفرات .\nالصناعة :\n دلل : عرف المسلمون صناعات متعددة؟\n- الورق .\nحيث عرفوا :\n- النسيج والزجاج (الذي تميزت بزخارف إسالمية جميلة)\nالتجارة :\n بم تفسر : ازدهرت التجارة في الدولة اإلسالمية ؟\nبسبب :\nازدهار الزراعة والصناعة . اهتمام المسلمين بإلامة األسواق واالستراحات واألساطيل التجارية وإصالح الطرق التجارية .  اشتهر التجار المسلمون بالصدق واألمانة وتمسكهم بمبادئ اإلسالم السمحة في البيع\nوالشراء .\nٗ - الحياة الفكرية والعلمية :\n دلل : ازدهرت الحياة الفكرية والعلمية في الدولة اإلسالمية ؟\nبسبب :\nٔ) اهتم المسلمون بالعلم والعلماء .\nٕ) برزت العلوم الطبيعية (كالرياضيات والفلن والطب والكيمياء) .\nٖ) برزت العلوم الدينية (كالفمه والتفسير والحديث) .\nٗ) أُنشبت المدارس والمكتبات ومراكز العلم مثل بيت الحكمة في بؽداد الذى أسسه الخليفة العباسي\nهارون الرشيد .\n٘) لاموا بترجمة كتب اليونانيين والفرس لكنهم لم يكتفوا بالترجمة بل أضافوا إليها وطوروا ما فيها ."],[81,"٘ - العمارة والفنون :\n دلل : تعددت مميزات العمارة اإلسالمية ؟ حيث تميزت العمارة اإلسالمية بـ :\nٔ) استخدام المباب والمآذن .\nٕ) استخدام الخط العربي في الزخرفة .\n ترن المسلمون بصمتهم الفنية في بالد كثيرة مثل :\nاألندلس (إسبانيا والبرتؽال حالييا) ، وتركيا والهند وغيرها .\n ازدهرت فنون النسيج والنمش على الخشب والمعادن .\nتواصل الحضارة اإلسالمية مع الحضارات األخرى :\n دلل : انتشرت الحضارة اإلسالمية فى قارتي آسيا وأوروبا بعدة طرق؟\nحيث انتشرت عن طريق :\nٔ) التجار المسلمين .\nٕ) التوسعات والرحالت االستكشافية للعلماء المسلمين .\nٖ) انتشار اختراعات المسلمين في أنحاء لارتي آسيا وأوروبا .\nٗ) نشاط حركة الترجمة دلل؟ حيث تُرجمت كثير من كتب العلماء المسلمين فى مجال الطب والرياضيات\nوالفلن وغيرها إلى اللؽة الالتينية ، فكانت هي األساس فى ليام النهضة األوروبية الحديثة .\n ما العالقة بين : العلماء المسلمين والنهضة األوروبية الحديثة؟ حيث :\nترجمت كثير من كتب العلماء المسلمين فى مجال الطب والرياضيات والفلن وغيرها إلى اللؽة الالتينية\nوكانت هى األساس فى ليام النهضة األوروبية الحديثة .\nالتدريب الثاني\nسٔ : حدد صحة أو خطأ كل عبارة من العبارات اآلتية ، مع ذكر السبب في الحالتين :\n(ٕ) تعددت أدوار المرأة في المجتمع اإلسالمي .\n(ٖ) اهتم المسلمون بالعلوم الدينية دون غيرها .\n(ٗ) اهتم الخليفة العباسي هارون الرشيد بالحياة العلمية والفكرية ."],[82,"سٔ : أكمل العبارات اآلتية بكلمات مناسبة :\n(ٔ) اشتهر التجار المسلمون بـ . ......................\n(ٕ) من العلوم الدينية التي برزت في الحضارة اإلسالمية . ........\n(ٖ) ترن المسلمون بصمتهم الفنية في بالد األندلس التي لامت على األراضى الحالية لدولتى . ......\nسٕ : اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) تم وضع أول دستور مكتوب في الدولة اإلسالمية على يد . ........\nالرسول ملسو هيلع هللا ىلص - أبى بكر الصديك - معاويه بن أبى سفيان - هارون الرشيد)\n(ٕ) عاصمة الدولة اإلسالمية التي صدرت منها األوامر للجيوش اإلسالمية لنشر اإلسالم خارج شبه\nالجزيرة العربية ألول مرة هي . ........\n(المدينة - مكة - دمشك - بؽداد )\n(ٖ) صدرت أوامر تعريب الدواوين في الدولة اإلسالمية من . ..........\n(مكة - المدينة - دمشك - بؽداد )\n(ٗ) عندما كانت عاصمة الخالفة اإلسالمية بؽداد كان النظام المتبع فى اختيار الخلفاء . . ........\n( االنتخاب - الوراثة - الشورى - الترشيح )\n(٘) تشابهت فترة حكم الخالفة الراشدة مع فترة حكم الدولة األموية فى ( . ........ . االهتمام بالفتوحات\nاإلسالمية - مواجهة حركات الردة - ازدهار حركة الترجمة - استخدام عمالت إسالمية )\n( )ٙ حدد أي مما يلى يعد أحد المظاهر التي ميزت عصر الخالفة العباسية .. ........\n( سن العملة اإلسالمية - جمع المرآن الكريم في مصحف واحد - إنشاء بيت الحكمة - تعريب الدواوين )\n( )7 أي من الفترات التاريخية التى مرت بها الخالفة اإلسالمية التالية انتهت نتيجة تعرض البالد للؽزو\nالخارجي ( . ...... الخالفة الراشدة - الدولة األموية - العصر العباسي األول - العصر العباسي الثاني )\n( )8 أى من األحداث التالية تمت فى عهد خالفة معاوية بن أبي سفيان ؟ . ..........\n(نمل العاصمة إلى بؽداد - ظهور نظام والية العهد - نشاط حركة الترجمة - إنشاء أول دستور مكتوب )\n( )9 أنشؤ المسلمون لنوات للرى بين نهري دجلة والفرات في . .........\n( عهد الرسول هللا - عصر الخلفاء الراشدين - عصر الخالفة األموية - عصر الخالفة العباسية )\n(ٓٔ) النشاط االلتصادى الذى ساهم فى انتشار الحضارة اإلسالمية في آسيا وأوروبا هو . .....\n(الزراعة - الصناعة – التجارة - الرعى )"],[83,"سٗ : اكتب كلمة (صواب) أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٔ) كانت لارة آسيا مهديا لواحدة من أعظم الحضارات اإلنسانية وهى الحضارة اإلسالمية ( .\n(ٕ) ارتكزت الحضارة اإلسالمية على المرآن الكريم وسنة النبي هللا وترسيخ عميدة التوحيد ( .\n(ٖ) لام الخلفاء الراشدين بنشر اإلسالم خارج شبه الجزيرة العربية .\n(ٗ) تم وضع أسس لواعد اإلدارة والحكم فى الدولة اإلسالمية خالل عصر الخلفاء الراشدين (.\n(ه) انتملت عاصمة الدولة اإلسالمية إلى بؽداد في عصر الخالفة األموية .\n( )7 مثل ضعف الخلفاء عامالي مشتركيا في سموط كل من الخالفتين األموية والعباسية .\n( )8 حفظ اإلسالم حموق جميع الفبات في المجتمع .\n( يُ )9 عد الفمه من العلوم الطبيعية التي برزت في الدولة اإلسالمية .\n(ٓٔ) لام المسلمون بترجمة مإلفات اليونان والفرس واستفادوا منها وطوروها .\nس٘ : صوب ما تحته خط :\n(ٔ) تم جمع المرآن الكريم فى مصحف واحد في عهد الرسول صلى الله عليه وسلم .\n(ٕ) لام المسلمون بتعريب الدواوين فى عصر الخلفاء الراشدين .\n(ٖ) كان نظام الحكم فى عصر الدولة األموية لابما على نظام الشورى .\n(ٗ) كانت مدينة دمشك مركزا ً عالمييا للعلم والثمافة وجاء إليها العلماء من كل مكان في\nعصرالخالفة العباسية .\nس :ٙ اكتب ما تشير إليه كل عبارة من العبارات اآلتية :\n(ٔ) نظام حكم ظهر فى الدولة اإلسالمية بعد وفاة الرسول هللا يتولى صاحبه إدارة الدولة\nاإلسالمية ولياداتها .\n(ٕ) سد أُليم على يد أول خلفاء الدولة األموية بالمدينة .\n(ٖ) علوم برع فيها المسلمون ومنها الرياضيات والطب والفلن والكيمياء .\nس :ٚ رتب األحداث التاريخية اآلتية من القديم إلى الحديث :\n(ٔ) ( ).... إنشاء سد معاوية .\n( ).... وضع صحيفة المدينة .\n( )... إنشاء بيت الحكمة .\n( )... جمع المرآن في مصحف واحد .\n(ٕ) ( )....... نشاط حركة الترجمة .\n( )....... سموط الخالفة األموية .\n( )....... نشؤة نظام الخالفة .\n( )...... اتخاذ دمشك عاصمة للدولة اإلسالمية ."],[84,"س :ٛ من هو ... ؟\n(ٔ) وضع صحيفة المدينة .\n(ٕ) أول الخلفاء الراشدين .\n(ٖ) الخليفة األموي الذي جعل نظام الحكم في الدولة اإلسالمية وراثييا .\n(ٗ) الخليفة العباسي الذي أسس بيت الحكمة .\nس :ٜ ما المقصود بـ : الخالفة اإلسالمية ؟\nسٓٔ : بم تفسر ... ؟\n(ٕ) سموط الخالفة العباسية .\n(ٖ) وضع الرسول ملسو هيلع هللا ىلص أول دستور مكتوب في حياة العرب .\nظهور اإلسالم فى المرن السابع الميالدى (بالنسبة لحياة العرب في شبه الجزيرة العربية ) ؟\nسٕٔ : ماذا كان يحدث إذا ... ؟\n(ٕ) لم يتم وضع صحيفة المدينة .\n(ٖ) كان الخلفاء في العصر العباسي الثاني يتصفون بالموة .\nسٖٔ : دلل على صحة كل عبارة من العبارات اآلتية :\n(ٔ) تمثل الميم واألخالق إحدى عوامل ليام وازدهار الحضارة اإلسالمية .\n(ٕ) وضع الرسول صلى الله عليه وسلم له لواعد الدولة اإلسالمية بالمدينة .\n(ٖ) تعددت إنجازات الدولة اإلسالمية فى فترة حكم الخالفة الراشدة .\n(ٗ) حظيت المرأة بمكانة كبيرة في المجتمع اإلسالمي .\n(ه) تميزت فترة الخالفة العباسية باالزدهار العلمي والحضاري .\n( )ٙ اهتمام المسلمين بالزراعة في الدولة اإلسالمية .\n( )7 لام المسلمون بعدة إجراءات لتحميك ازدهار التجارة في الدولة اإلسالمية .\n( )8 انتشرت الحضارة اإلسالمية فى لارتي آسيا وأوروبا من خالل عدة طرق .\nٔ) معاوية بن أبي سفيان ونظام الحكم في الدولة اإلسالمية .\nٕ) الزكاة والمجتمع اإلسالمي ."],[85,"سٔ : اكتب كلمة (صواب ) أوكلمة (خطأ) أمام العبارة غيرالصحيحة مع تصويب الخطأ :\nٔ - ارتبطت موالع الحضارات المديمة في لارة آسيا بوجود الصحاري .\nٕ - تؤسست أول مملكة موحدة في بالد العراق المديم في عهد سرجون األول .\nٖ - تُعد تشريعات حمورابي أول لانون مدون في العصر السومري .\nٗ - كانت فينيميا مكونة من مدينة واحدة مركزية تحكم بالي المدن .\nه - لامت عاللات تجارية بين حضارة اليمن والحضارة المصرية المديمة .\n- ٙ كانت الصناعة هي أساس التصاد الحضارة الصينية المديمة .\n- 7 اهتم الهنود لدي ًما بتخطيط المدن والطرق .\n- 8 عُرف نظام الخالفة في الدولة اإلسالمية لبل وفاة الرسول (صلى الله عليه وسلم) .\nسٕ : اختر اإلجابة الصحيحة مما بين القوسين :\nٔ - أحد أشهر ملون الحضارة اآلشورية . ..............\n)اإلسكندر الممدوني - سرجون الثاني - حمورابي - أور نمو(\nٕ - أول من استمر على الشريط الساحلي شرق البحر المتوسط هم .. ..............\n(السومريون - الفينيميون - األكاديون – البابليون)\nٖ - كانت عاصمة حضارة معين هي مدينة ) . .............. لرناو - عدن - ظفار – لنؤ(\nٗ - نجح األحباش في السيطرة على بالد اليمن بعد هزيمتهم للملن . ..............\n( سيف بن ذي يزن - ذي نواس - بيبي الثاني – حمورابي(\nه - ظهرت النمود اإلسالمية ألول مرة في عهد .. ..............\n)الرسول (صلى الله عليه وسلم) - الخلفاء الراشدين - الدولة األموية - الدولة العباسية)\nسٖ : أكمل العبارات التالية بما يناسبها من كلمات :\nٔ - تؤسست أول حكومة مركزية لبالد العراق المديم خالل عصر . ..............\nشيّد سور الصين لحماية حدود الصين من جهة . .............."],[86,"سبَؤ هي الملكة . ..............\nٖ - أشهر ملكات َ\nٗ - نشؤت حضارة الصين المديمة في وادي نهر . ..............\nه - نشؤت الحضارة الهندية على طول نهر . ..............\nالردَّة في عهد الخلفاء . ..............\n- ٙ تم المضاء على حركة ّ\nسٗ : ما المقصود بكل مما يلي ... ؟\nٔ - بالد الرافدين .\nٕ - الكتابة المسمارية .\nٖ – الزلورات .\nٗ - خط المسند .\nس٘ : فسر العبارات التالية :\nٔ - كان للسومريين دور بارز في نهضة حضارة بالد العراق المديم .\nٕ - ليام الزراعة في بالد العراق المديم .\nٖ - ليام الحضارات المديمة في بالد اليمن المديم .\nٗ - أهمية اللؽة العربية في الحضارة اإلسالمية ..\nس :ٙ ما النتائج المترتبة على ... ؟\nٔ - اختراع الكتابة المسمارية .\nٕ - انهيار سد مؤرب ..\nٖ - ترجمة مإلفات العلماء المسلمين في أوروبا .\nس :ٚ دلل على صحة كل عبارة مما يلي :\nٔ - تواصل المصريون المدماء حضارييا مع حضارة فينيميا .\nٕ - حظيت المرأة بمكانة كبيرة في المجتمع اليمني المديم\nٖ - كانت بالد الهند أحد مراكز العلم والثمافة في العصور المديمة .\nٗ - اهتم الخليفة هارون الرشيد بالعلم .."],[88," خلق اهلل (سبحانه وتعالى ) األرض بنظم بيئية متنوعة تعمل بتوازن دقيق ، وتعد الغابات\nمن أهم هذه النظم .\n تختلف نظم الغابات في قارتي آسيا وأوروبا من حيث أنواعها وتوزيعها وخصائصها\nبم تفسر ؟\n- الموقع الجغرافي .\nبسبب اختالف :\n- العوامل الطبيعية األخرى .\n– المناخ .\nومن الخريطة السابقة نجد أن أهم نظم الغابات في القارتين هي :\n(ٔ) نظام الغابات المدارية المطيرة .\n(ٕ) نظام الغابات الموسمية .\n(ٖ) نظام غابات البحر المتوسط .\n(ٗ) نظام الغابات النفضية .\n(٘) نظام الغابات الصنوبرية(المخروطية ) .\n بم تفسر : اختفاء الغابات المدارية المطيرة والغابات الموسمية من قارة أوروبا ؟ بسبب :\nعدم توافر الظروف المناخية المالئمة لنموهما حيث يقع معظم قارة أوروبا فى المنطقة\nالمعتدلة الشمالية ."],[89,"أوالي : نظام الغابات املداريُ املطريَ\nمن الخريطة السابقة يتضح ما يلي :\n*الموقع الفلكي :\n*الموقع الجغرافي :\n ينتشر نظام الغابات المدارية المطيرة بقارة آسيا في :\n- جزر إندونيسيا .\nجزر جنوب شرق آسيا مثل :\nالساحل الؽربي للهند .\nبعض األماكن األخرى (مثل : السواحل الشرلية لخليج البنؽال) .\n- جزر الفلبين .\n يختفى نظام الغابات المدارية المطيرة من قارة أوروبا بسبب موقعها الفلكي .\n*األهمية ( : للغابات المدارية أهمية بيئية كبيرة)\nتقوم الغابات المدارية المطيرة بدور مهم في تنظيم المناخ بم تفسر ؟ لألسباب التالية :\nٔ) تموم األشجار بامتصاص كميات كبيرة من ثاني أكسيد الكربون مما يسهم في تمليل االحتباس الحراري .\nٕ) يساهم بخار الماء المتصاعد من األشجار فى تكوين السحب وسموط األمطار ."],[90,"*األخطار :\n بم تفسر : تتعرض الغابات المدارية للتدهور؟\nبسبب :\nاألنشطة البشرية مثل الصناعة غير المستدامة مما يإدى إلى تدهورها .\nثانياً : نظام غابات البحز املتىسط\nمن الخريطة السابقة يتضح ما يلي :\n*الموقع الجغرافي :\n* ينتشر نظام غابات البحر المتوسط حول سواحل البحر المتوسط في :\n- غرب لارة آسيا .\n- جنوب وجنوب غرب لارة أوروبا .\nثالجاً : نظام الغابات املىمسيُ\n*الموقع الفلكي :\n* يوجد نظام الؽابات الموسمية فى بعض المناطك بمارة آسيا بين دابرتى عرض ٘ ٖ٘، شماال ً .\n*الموقع الجغرافي :\n حيث ينتشر في - : بعض المناطك الداخلية بجنوب وجنوب شرق آسيا .\n يختفى نظام الغابات الموسمية من قارة أوروبا بسبب موقعها الفلكي .\n- الهند ."],[91,"*الخصائص المناخية :\n شتاءي : يتسم بـ :\nدرجات حرارة تكون معتدلة إلى دافبة .\nالمناخ جاف بم تفسر؟\nبسبب الرياح الموسمية الشتوية الجافة المادمة من اليابس اآلسيوي .\n صيفيا : يتسم بـ :\nدرجات حرارة مرتفعة .\nسموط األمطار الؽزيرة بم تفسر ؟\nبسبب الرياح الموسمية الصيفية المحملة ببخار الماء المادمة من المحيط الهندي .\n*الخصائص النباتية :\n تتميز أشجار نظام الغابات الموسمية بأنها :\nكثيفة وضخمة ولكن غير متشابكة ما النتائج ؟ مما يساعد على وصول ضوء الشمس إلى األرض .\nذات أوراق عريضة وخضراء ولكنها تذبل وتسمط في فصل الشتاء بم تفسر ؟ بسبب الجفاف .\n من أهم أشجاره :\n- الخيزران (البامبو) .\n*الحيوانات :\n دلل : تتنوع الحياة الحيوانية في نظام الغابات الموسمية؟\nحيث يعيش فى نظام الغابات الموسمية أنواع كثيرة من :\nالحيوانات مثل :\n- الفيلة .\nالزواحف مثل :\n- األفاعي .\nالطيور مثل :\n- أبو منجل .\n- النمور .\n- الساج ."],[92,"*التربة :\n بم تفسر : صالحية تربة الغابات الموسمية للزراعة؟\nألنها :\nٔ) تتكون بصورة ربيسية من الرواسب الطينية .\nٕ) تتميز بـالمدرة على االحتفاظ بالمياه .\nٖ) أكثر خصوبة من تربة نظام الؽابات المدارية المطيرة .\n- معلومة إثرائية -\nتتسم تربة الغابات المدارية بأنها غنية بأكسيد الحديد وفقيرة فى األمالح المعدنية القابلة\nللذوبان مما جعلها أقل خصوبة .\n*األهمية االقتصادية :\n بم تفسر : أهمية أشجار الغابات الموسمية للصناعة والزراعة؟ ألنها :\nٔ) تُعد مصدرا ً لألخشاب الصلبة مثل أشجار الخيزران والساج التي تستخدم فى صناعة السفن .\nٕ) تستخدم التربة بنظام الؽابات الموسمية في الزراعة .\nالتدريب األول\nسٔ : اكتب كلمة (صواب ) أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٕ) ينتشر نظام الؽابات الموسمية فى بعض المناطك الداخلية بجنوب وجنوب شرق آسيا .\n(ٖ) تهب الرياح الموسمية الصيفية على نظام الؽابات الموسمية بمارة آسيا لادمة من المحيط األطلنطي .\n(ه) تنتشر غابات البحر المتوسط في شمال لارة أوروبا .\nسٕ : دلل على صحة العبارة اآلتية : تتنوع الحياة الحيوانية بنظام الؽابات الموسمية .\nسٖ : بم تفسر :\n(ٕ) يتسم مناخ نظام الؽابات الموسمية بالجفاف شتاء ."],[93,"رابعاً : نظام الغابات الهفضيُ\n* الموقع الفلكي والجغرافي :\nقارة آسيا :\n* ينتشر بين دابرتى عرض ٖ٘ ٘ٓ ، شماال ً في مناطك ، مثل :\n- اليابان .\n- كوريا .\n- شرق الصين .\n- إلليم منشوريا شمال شرق الصين .\nقارة أوروبا :\n* يوجد بين دابرتي عرض ٓٗ ٙٓ ، شماال ً في نطاق عرضى يمتد من غرب المارة إلى شرلها .\n*الخصائص المناخية :\nيتسم مناخ نظام الغابات النفضية بـ :\n• شتاء : بارد لد تصل فيه درجات الحرارة إلى ما دون الصفر المبوى وتسمط فيه الثلوج .\n• صيف : معتدل تسمط فيه األمطار ."],[94,"*الخصائص النباتية :\nأشجاره تنفض أورالها فى فصلي الشتاء والخريف بم تفسر؟ لشدة البرودة ، لذلن عُرف هذا النظام\nباسم الؽابات النفضية ، من أهم أشجاره : الزان .\n بم تفسر : تسمية الغابات النفضية بهذا االسم؟ ألنها :\nأشجارها تنفض أورالها فى فصلي الشتاء والخريف .\n*الحيوانات :\nيعيش بنظام الؽابات النفضية الكثير من الحيوانات التي تتسم بتكيفها\nمع البيبة بطرق مختلفة ، حيث نجد - : السناجب .\n- الدب األسود اآلسيوي .\n* التربة :\nيتسم نظام الؽابات النفضية بالتربة الطينية .\n بم تفسر : زيادة خصوبة التربة بنظام الغابات النفضية ؟\nبسبب :\nحرارة الصيف التي تساعد على تحلل األوراق والمواد العضوية مما يزيد خصوبة التربة .\n* بعض األخطار :\nمما أدى إلى تنالص أعدادها مثل الدب األسود األسيوي . .\nٕ) تم إزالة مساحات كبيرة من أشجار الؽابات النفضية لتحل محلها الزراعة .\n*األهمية االقتصادية :\n بم تفسر : ألشجار الغابات النفضية أهمية اقتصادية ؟\nألن :\nٔ) تُستخدم مساحات كبيرة من هذا النظام في زراعة الممح والتفاح والكتان .\nٕ) تدخل أشجار الزان في صناعة األثاث .\n ما العالقة بين : النشاط الزراعى ، ومساحة الغابات النفضية؟ حيث :\nتم إزالة مساحات كبيرة من أشجار الؽابات النفضية لخصوبة تربتها لتحل محلها زراعة الممح والتفاح\nوالكتان ."],[95,"خامساً : نظام الغابات الصهىبزيُ (املخزوطيُ)\n*الموقع الفلكي والجغرافي :\nينتشر في قارتي آسيا وأوروبا :\nشماال من ألصى شرق سيبيريا في آسيا وحتى شمال غرب\nما بين دابرتي عرض ٓ٘ 7ٓ ،\nأوروبا .\nيوجد فى مساحات متناثرة بالمرب من السالسل الجبلية في وسط لارتي آسيا وأوروبا .\n*الخصائص المناخية :\nيتسم مناخ الغابات الصنوبرية بـ :\nالشتاء : شتاء طويل لارس البرودة ، تنخفض فيه درجات الحرارة دون الصفر المبوى وتتسالط\nفيه الثلوج .\nالصيف : صيف لصير وبارد ، وتتسالط فيه األمطار .\n*الخصائص النباتية :\n تنمو األشجار دابمة الخضرة ذات الشكل المخروطي ، واألوراق المدببة\nالمؽطاة بطبمة من الشمع ما النتائج؟\nمما يساعد على التخلص من الثلوج المتسالطة عليها .\n من أشهر أشجاره * : الصنوبر .\n* الشربين .\n*الحيوانات :\nتكثر في نظام الغابات الصنوبرية الحيوانات البرية دلل؟ خاصة :\nالحيوانات ذات الفرو السمين مثل الدب المطبي .\nالطيور مثل نمار الخشب .\nالثدييات مثل الرنة .\nالحشرات مثل البعوض الذي ينتشر صيفا ً بم تفسر؟\nبسبب انتشار المستنمعات الناتجة عن ذوبان الجليد ."],[96,"*التربة :\nتتسم التربة بــأنها :\nٔ) تربة رمادية اللون لليلة السمن\nٕ) منخفضة الخصوبة بم تفسر؟ بسبب ، للة المواد العضوية واألمالح ، حيث يعمل انخفاض درجات\nالحرارة على بطء تحلل المواد العضوية وتعفنها فوق سطح التربة .\n ما العالقة بين : درجات الحرارة ، وخصوبة تربة نظام الغابات المخروطية؟ حيث :\nيعمل انخفاض درجات الحرارة على بطء تحلل المواد العضوية وتعفنها فوق سطح التربة فؤصبحت تربة\nنظام الؽابات المخروطية تربة رمادية اللون لليلة السمن ومنخفضة الخصوبة .\n*بعض األخطار :\nيتعرض نظام الغابات الصنوبرية إلى عواصف(خطر طبيعي) ما النتائج؟ مما أدى إلى :\nالتالع األشجار وتكسيرها ، كما حدث في دولتي - : السويد .\n- الصين .\n* األهمية االقتصادية :\nتدخل أشجار الصنوبر والشربين في صناعة الورق بم تفسر ؟ بسبب ليونة أخشابها .\nأكد فهمك :\n ما النتائج : خصوبة التربة فى نظام الغابات النفضية ؟ ترتب على ذلك :\nإزالة مساحات كبيرة من أشجارها لتحل محلها زراعة الممح والتفاح والكتان\n ما النتائج : انخفاض درجات الحرارة في نظام الغابات الصنوبرية ؟ ترتب على ذلك :\nبطء تحلل المواد العضوية وتعفنها فوق سطح التربة لتصبح رمادية اللون لليلة السمن ومنخفضة\nالخصوبة .\nالتدريب الثاني\nسٔ : بم تفسر ... ؟\n(ٔ) أهمية أشجار الصنوبر والشربين بالنسبة للصناعة .\n(ٕ) انتشار البعوض فى فصل الصيف بالؽابات الصنوبرية .\nسٕ : دلل على صحة العبارة اآلتية : األشجار الزان أهمية التصادية .\nسٖ : ما العالقة بين : درجات الحرارة ، وتربة الؽابات المخروطية ؟"],[97,"سٔ : أمامك خريطة لقارة آسيا اكتب مدلول األرقام التي عليها :\n(ٔ) مسطح مابي . ............\n(ٕ) مسطح مابي .. ............\n(ٖ) مسطح مابي . ............ .\n(ٗ) دابرة عرض . ............ .\n(ه) نظام الؽابات . ............ .\n( )7 نظام غابات .. ............\n( )8 نظام الؽابات . . ............\n( )9 نظام الؽابات . ............\nسٕ : استعن بخريطة قارة أوروبا التى أمامك ،\nواكتب الرقم المناسب أمام كل مما يلي :\n(ٔ) نظام غابات البحر المتوسط . ............ .\n(ٕ) نظام الؽابات النفضية . .................\n(ٖ) نظام الؽابات الصنوبرية . ............ .\n(ٗ) البحـ ـر األسـود . ...................\n(٘) بحر الشمال . ......................\nسٖ : أكمل العبارات اآلتية بكلمات مناسبة :\n(ٕ) ينتشر نظام الؽابات المدارية المطيرة بالجزر الوالعة بالمرب من سواحل (ه) يتميز مناخ نظام الؽابات الموسمية بانخفاض درجات الحرارة شتاء .\n( )7 تتسم أشجار نظام الؽابات الموسمية بؤنها كثيفة وضخمة وغير متشابكة .\n( ي )8 نتشر نظام الؽابات النفضية بمارة أوروبا فى نطاق عرضى من غرب المارة إلى شرلها (.\n( )9 تسمط األمطار بنظام الؽابات النفضية صيفيا وتسمط الثلوج شتاء .\nالتربة .\nالمتسالطة عليها .\nس٘ : صوب ما تحته خط :\n(ٔ) فصل المطر الربيسي بمنطمة جنوب وجنوب شرق آسيا فصل الخريف .\n(ٕ) أشجار الساج الضخمة من أشجار نظام الؽابات النفضية .\n(ٖ) ينمو بنظام الؽابات النفضية أشجار ذات ليمة التصادية مثل الشربين .\n(ٗ) ينتشر نظام الؽابات النفضية في الهند بمارة آسيا .\n(ه) تنتشر المستنمعات الناتجة عن ذوبان الجليد بفصل الصيف فى نظام الؽابات الموسمية ."],[100,"س :ٙ بم تفسر ... ؟\n(ٕ) تدهور نظام الؽابات المدارية المطيرة في لارة آسيا .\n(ٗ) استخدام أشجار نظام الؽابات الموسمية في صناعة السفن .\n(ه) تسمية نظام الؽابات النفضية بهذا االسم .\n( )7 إزالة مساحات كبيرة من الؽابات النفضية بمارتي آسيا وأوروبا .\n( )8 عدم تراكم الثلوج على أشجار الؽابات الصنوبرية .\n( )9 تتسم التربة فى نظام الؽابات الصنوبرية بانخفاض خصوبتها .\nس :ٚ ما النتائج المترتبة على ... ؟\nس :ٛ دلل على صحة كل عبارة من العبارات اآلتية :\nدورا مهما في تنظيم المناخ .\n(ٕ) يتميز نظام الؽابات الموسمية بتنوع الحياة الحيوانية .\n(ٖ) تتنوع نظم الؽابات بمارة آسيا بشكل أكثر من لارة أوروبا .\nس :ٜ ما العالقة بين ... ؟\n(ٕ) مناخ سيبيريا ، وتربة نظام الؽابات الصنوبرية .\nسٓٔ : ما تقييمك لمصداقية كل عبارة من العبارات اآلتية ... ؟ مع ذكر السبب في الحالتين :\n(ٕ) تسمط أوراق أشجار نظام الؽابات الموسمية شتاء .\n(ٖ) تتميز ترية نظام الؽابات الموسمية بصالحيتها للزراعة .\n(ٗ) يظهر نظام الؽابات النفضية فى لارة آسيا ويختفى من لارة أوروبا .\n(ه) ينتشر نظام الؽابات الصنوبرية فى المناطك الحارة من جنوب آسيا ."],[101,"تتميز قارتا آسيا وأوروبا بتنوع بيئى كبير في نظم الحشائش والصحارى التى تسهم\nبدور مهم فى تشكيل الحياة الطبيعية واالقتصادية في القارتين .\nومن الخريطة السابقة ، نجد أن نظم الحشائش ونظم الصحارى فى قارتي آسيا وأوروبا\nهي :\nالنظم الصحراوية\nنظم الحشائش\nٔ) نظام الحشائش الحارة (السافانا ) .\nٔ) نظام الصحارى الحارة .\nٕ) نظام الحشائش المعتدلة (اإلستبس) .\nٕ) نظام الصحارى المعتدلة .\nٖ) نظام الحشائش الباردة (التندرا ) .\nٖ) نظام الصحارى الباردة .\n بم تفسر : اختفاء الحشائش الحارة والصحاري الحارة من قارة أوروبا ؟\nبسبب ولوع معظم لارة أوروبا فى المنطمة المعتدلة الشمالية ."],[102,"أوالي : نظم احلشائش\nٔ - نظام الحشائش الحارة (السافانا) :\n*الموقع الجغرافي :\nي  متد نظام الحشابش الحارة (السافانا ) بمارة آسيا في :\n- الهند .\n- باكستان .\nي  ختفى نظام الحشابش الحارة (السافانا ) من لارة أوروبا بم تفسر؟ بسبب مولعها الفلكي .\n*الخصائص النباتية :\n تختلف الخصابص النباتية لنظام السافانا في لارة آسيا عن مثيله فى لارة إفريميا دلل؟ حيث نجدها\nأكثر طوال ً وكثافة ويرجع ذلن إلى أن كمية األمطار التي تسمط في آسيا أكبر من إفريميا .\n بم تفسر : تختلف الخصائص النباتية لنظام السافانا في قارة آسيا عن مثيله فى قارة\nإفريقيا ؟ ألن كمية األمطار التي تسمط في آسيا أكبر من إفريميا ."],[103,"*الحيوانات :\nيقل تنوع الحيوانات التى تعيش فى نظام السافانا بقارة آسيا عن الموجودة بقارة إفريقيا\nدلل؟ حيث نجد به :\n*المخاطر التي تتعرض لها :\n دلل : يتعرض نظام السافانا فى قارة آسيا لعديد من المخاطر؟\nأهمها :\n(ٔ) النمو العمراني الكبير ( . خطر بشري)\n(ٕ) التؽيرات المناخية ( . خطر طبيعي)\n(ٖ) التحول إلى زراعة المحاصيل ( . خطر بشري)\n(ٗ) الحرابك (البشرية والطبيعية) .\n(٘) الرعي الجابر ( . خطر بشري)\nٕ - نظام الحشائش المعتدلة (اإلستبس ) :"],[104,"*الموقع الجغرافي :\nي  متد نظام الحشابش المعتدلة فى العروض المعتدلة بمارتي آسيا وأوروبا من البحر األسود\nغربا ً إلى شمال شرق الصين شرليا ً .\n وبذلن يُعد أكبر نظام إستبس من حيث المساحة عالمييا .\n*أهمية نظام الحشائش المعتدلة (اإلستبس) :\nلنظام حشائش اإلستبس فى قارتي آسيا وأوروبا أهمية تاريخية كبيرة دلل؟\nحيث يمر به طريك الحرير الذي يُعد واحديا من أهم طرق التجارة والسفر في الماضي .\n*المخاطر التي تتعرض لها :\n دلل : يتعرض نظام حشائش االستبس لعديد من المخاطر؟\nحيث : يتعرض نظام حشائش اإلستبس لعديد من المخاطر منها :\nٔ) تنالص مساحات كبيرة من حشابش اإلستبس .\nٕ) تعرض عديد من الحيوانات به لخطر االنمراض مثل :\nالجمل البرى ذو السنامين .\nالجاموس البرى في آسيا .\nٖ - نظام الحشائش الباردة (التندرا) :"],[105,"*الموقع الجغرافي :\n ينتشر في : ألصى شمال لارتي آسيا وأوروبا داخل المنطمة المطبية الشمالية .\n يظهر على - : فوق هضبة التبت .\n- المنحدرات الجبلية شاهمة االرتفاع .\n* الخصائص المناخية :\nيتسم مناخ نظام الحشائش الباردة :\nشتاء : طويل شديد البرودة حيث تنخفض فيه درجات الحرارة إلى ما دون الصفر المبوى مع\nتسالط الثلوج .\nصيفيا : ال يزيد درجة الحرارة به عن ٕٔ درجة مبوية وسموط كميات لليلة من األمطار .\n*الخصائص النباتية :\n* رغم قسوة الظروف المناخية ينمو فى نظام الحشائش الباردة :\nبعض الطحالب\nالحشابش .\nخالل فترة ذوبان الجليد .\nاألشجار الصؽيرة .\n بم تفسر : تُعد جذور نباتات نظام الحشائش الباردة سطحية وقصيرة ؟\nألن الجليد يذوب في الطبمة السطحية فمط من التربة ، بينما تبمى الطبمات السفلية متجمدة بشكل دابم\nمما ال يسمح لجذور النباتات بالتعمك فيها .\n*الحيوانات :\nتتميز الحيوانات فى نظام الحشائش الباردة بقدرتها على التكيف مع الظروف الباردة\nالقاسية ، ومن أشهرها :\n- الطيور مثل : طائر الترمجان .\n- الحيوانات مثل : الذئاب و الدببة القطبية ."],[106,"*التربة :\n ما النتائج : انخفاض درجات الحرارة طوال العام بنظام الحشائش الباردة ؟أدى إلى :\nتجمد التربة معظم العام .\nتراكم المواد العضوية غير المتحللة بالتربة وإبطاء عملية التحلل .\n بم تفسر : تصبح الطبقة السطحية من التربة رطبة صيفاً؟ بسبب نتيجة ذوبان الجليد .\n*المخاطر التي تتعرض لها :\n دلل : يتعرض نظام الحشائش الباردة (التندرا) لعديد من المخاطر؟\nمن أهمها :\nتلويث البيبة .\nتهديد الحياة البرية .\n بم تفسر : تلويث البيئة وتهديد الحياة البرية في الحشائش الباردة (التندرا) ؟\nبسبب قيام السكان ( رغم قلة عددهم) بتغيير المناظر الطبيعية فى هذا النظام لقيامهم\nبعديد من األنشطة منها :\nتطوير منتجعات التزلج على الجليد . - التعدين .\nبناء المساكن . - الصيد .\n- إنشاء الطرق .\nالتدريب األول\nسٔ : اكتب كلمة ( صواب ) أوكلمة (خطأ ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٔ) يختفى نظام حشابش السافانا من لارة آسيا .\n(ٕ) يمر طريك الحرير بنظام الحشابش المعتدلة بمارتي آسيا وأوروبا .\n(ٖ) يمتد نظام الحشابش المعتدلة بمارتي آسيا وأوروبا من البحر المتوسط غربيا\nإلى شمال شرق الصين شرليا .\n(ٗ) يعد طابر الترمجان من الطيور التى تعيش بنظام حشابش التندرا .\n(ه) تتسم تربة نظام الحشابش الباردة بتجمدها معظم العام .\nسٕ : بم تفسر ... ؟\n(ٔ) تُعد أشجار نظام حشابش السافانا بمارة آسيا أكثر طوال ً وكثافة عن مثيلتها بمارة إفريميا .\n(ٕ) لصر جذور نباتات نظام حشابش التندرا ."],[107,"ثانييا : الهظم الصحزاويُ\nتنقسم إلى :\n- نظام الصحارى الحارة .\n- نظام الصحارى المعتدلة .\n- نظام الصحاري الباردة .\nٔ - نظام الصحاري الحارة :\n ينتشر غرب قارة آسيا بشكل رئيسي في :\n• جنوب إيران .\n• أجزاء من باكستان .\n• شبه الجزيرة العربية .\n• أجزاء من الهند .\n يختفى هذا النظام من قارة أوروبا بم تفسر ؟\nنظرا لمولعها الفلكى ألن معظم لارة أوروبا يمع في المنطمة المناخية المعتدلة الشمالية .\nٕ - نظام الصحاري المعتدلة :\n*الموقع :\nشماال .\nي  متد بين دابرتى عرض ٖ٘ ٗ8 ،\n يوجد في :\nقارة آسيا : بشكل ربيسى كما في صحراء جوبي - : منؽوليا .\nقارة أوروبا : فى مساحة صؽيرة من شرق المارة (شمال بحر لزوين) .\n- شمال الصين ."],[108,"*الخصائص المناخية :\n تمل به األمطار ويتشابه فى ذلن مع النظام الصحراوى الحار .\n تسمط به كمية لليلة من الثلوج في فصل الشتاء ويختلف في ذلن مع النظام الصحراوى الحار .\n بم تفسر : قلة سقوط األمطار فى نظام الصحارى المعتدلة ؟\nبسبب ولوعه خلف سالسل جبلية تمنع وصول األمطار الموسمية إليه .\n*الخصائص النباتية :\n النباتات في هذا النظام :\nلليلة ومتناثرة ولصيرة ويوجد فوق أورالها غطاء شمعي بم تفسر ؟ للحفاظ على رطوبتها .\nجذورها طويلة بم تفسر ؟ حتى تصل إلى المياه الجوفية .\n ينتشربه - : أشجار مثل : السدر .\n- حشابش صحراوية مثل : الشيح .\n*الحيوانات :\nيعيش فيه عديد من :\nالحيوانات مثل : الؽزالن .\nالزواحف مثل : السحالي .\nالحشرات مثل : العناكب .\n*التربة :\n بم تفسر : يصعب استغالل تربة نظام الصحاري المعتدلة في الزراعة ؟ أو\n بم تفسر : تحتاج تربة نظام الصحارى المعتدلة إلى مجهود كبير لزراعتها؟\nألنها تربة خشنة ورملية ولليلة المواد العضوية والعناصر الؽذابية وتحتاج إلى مجهود كبير\nلزراعتها ."],[109,"ٖ - نظام الصحاري الباردة :\n*الموقع :\nيمع بالمرب من المطب الشمالي في ألصى شمال لارتي آسيا وأوروبا .\n*الخصائص المناخية :\n يتسم مناخ نظام الصحاري الباردة بـ :\n صيف لصير ومعتدل البرودة .\n شتاء طويل شديد البرودة .\n تكاد تكون الصحارى الباردة خالية من السكان بم تفسر؟ بسبب لسوة المناخ .\n*الخصائص النباتية :\nيتعذر نمو النباتات بجميع أنواعها في نظام الصحارى الباردة بم تفسر؟ بسبب :\n االنخفاض الشديد فى درجات الحرارة معظم السنة .\n لد تنمو بعض الطحالب خالل فصل الصيف المصير .\n*الحيوانات :\nيعيش فيه عدد قليل جديا من : الحيوانات مثل : الرنة .\n*التربة :\nمتجمدة معظم العام ما النتائج؟ لذلن تعد بيبة غير مالبمة لنمو النباتات .\nالتدريب الثاني\nسٔ : بم تفسر ... ؟\n(ٔ) عدم وصول األمطار الموسمية إلى نظام الصحارى المعتدلة .\n(ٕ) تحتاج تربة نظام الصحارى المعتدلة إلى مجهود كبير لزراعتها .\nسٕ : ما العالقة بين : انخفاض درجات الحرارة ، ونمو النباتات بنظام الصحاري الباردة ؟"],[110,"سٔ : أمامك خريطة لقارة آسيا ، اكتب مدلول\nاألرقام التي عليها :\n(ٔ) مدار . ..................\n(ٕ) مسطح مابي . ..................\n(ٖ) خليج . ..................\n(ٗ) المحيط . ..................\n(ه) نظام حشابش . .................. .\n( )ٙ نظام حشابش . .................. .\n( )7 نظام الصحارى . .................. .\n( )8 نظام الصحارى . .................. .\n( )9 نظام حشابش . .................. .\n(ٓٔ) نظام الصحارى . ..................\nسٕ : استعن بخريطة قارة أوروبا المقابلة ،\nواكتب الرقم المناسب أمام كل مما يلى :\n(ٔ) نظام حشابش التنـدرا . ..................\n(ٕ) نظام حشابش اإلستبس . ..................\n(ٖ) البـحر األسـود . ..................\n(ٗ) المحيط األطلنطى . .................. .\n(ه) البـحر المتوسط . ..................\nسٖ : أكمل العبارات اآلتية بما يناسبها :\n(ٔ) يختفى من لارة أوروبا نظام الحشابش . .................. .\n(ٕ) من الطيور التي تعيش بنظام الحشابش الحارة بمارة آسيا . .................. .\n(ٖ) يمع نظام حشابش اإلستبس بمارتي آسيا وأوروبا في العروض . .................. .\n(ٗ) يظهر نظام حشابش التندرا بمارة آسيا على . .................. .\n(ه) تتميز الحيوانات التي تعيش بنظام حشابش التندرا بمدرتها على التكيف مع الظروف . .......... .\n( ي )ٙ ختفى نظام الصحارى الحارة من لارة . ..................."],[111,"سٗ : اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) أى من األخطار التالية التى يتعرض لها نظام الس تي آسيا وأوروبا ( .\n(ٗ) لنظام حشابش اإلستبس فى لارتي آسيا وأوروبا أهمية تاريخية كبيرة .\n(ه) ينتشر نظام الحشابش المعتدلة داخل المنطمة المطبية الشمالية بمارة أوروبا .\n( )ٙ تصل درجات الحرارة بنظام التندرا في فصل الشتاء إلى ما دون الصفر المبوى .\n( )7 تنمو األشجار الصؽيرة بنظام الحشابش الباردة خالل فترة ذوبان الجليد .\n( ي )8 عيش طابر الترمجان فى األجزاء الشمالية لمارتي آسيا وأوروبا .\n( ي )9 تواجد نظام الصحارى المعتدلة بمساحة صؽيرة شرق لارة أوروبا .\n(ٓٔ) يختلف نظام الصحارى المعتدلة عن نظام الصحارى الباردة فى الخصابص النباتية ( .\n(ٕٔ) يعيش حيوان الرنة فى نظام الصحاري الحارة .\nس :ٙ بم تفسر ... ؟\n(ٔ) اختالف الخصابص النباتية لنظام السافانا فى لارة آسيا عن لارة إفريميا .\n(ٕ) جذور النباتات بنظام الحشابش الباردة سطحية ولصيرة .\n(ٖ) للة سموط األمطار فى نظام الصحارى المعتدلة .\n(ٗ) يصعب استؽالل تربة نظام الصحارى المعتدلة في الزراعة .\n(ه) عدم مالبمة تربة نظام الصحارى الباردة لنمو النباتات بها .\nس :ٚ ما النتائج المترتبة على ... ؟\n(ٔ) سموط األمطار بكميات كبيرة على نظام حشابش السافانا بآسيا عن نظيره في إفريميا .\n(ٕ) تجمد الطبمة السفلية معظم العام بتربة نظام الحشابش الباردة .\n(ٖ) ولوع نظام الصحارى المعتدلة خلف السالسل الجبلية العالية (بالنسبة للمناخ) .\nس :ٛ ما العالقة بين ... ؟\n(ٔ) انخفاض درجة الحرارة والتربة فى نظام الحشابش الباردة .\n(ٕ) األنشطة االلتصادية ، وتدهور نظام التندرا البيبي ."],[113,"س :ٜ دلل على صحة كل عبارة مما يلى :\n(ٔ) تختفى بعض نظم الحشابش ونظم الصحارى من لارة أوروبا .\n(ٕ) تتنوع الحيوانات التى تعيش فى نظام الحشابش الحارة بمارة آسيا .\n(ٖ) تواجه حشابش السافانا عديد من األخطار البشرية .\n(ٗ) لنظام حشابش اإلستبس فى لارتي آسيا وأوروبا أهمية تاريخية كبيرة .\n(ه) يتعرض نظام الحشابش المعتدلة لعديد من التهديدات .\nسٓٔ : ما تقييمك لمصداقية كل عبارة من العبارات التالية . ؟ مع ذكر السبب في الحالتين :\n(ٔ) يختفى نظام الصحارى الحارة من لارة آسيا .\n(ٕ) تتسم أشجار نظام الصحارى المعتدلة بجذورها الطويلة .\n(ٖ) تحافظ نباتات الصحاري المعتدلة على رطوبتها .\n(ٗ) يكاد يخلو نظام الصحارى الباردة من السكان .\n* المولع الجؽرافي .\n* الخصابص المناخية .\nسٕٔ : حدد أوجه التشابه واالختالف بين :\nالتوزيع الجؽرافى لنظام السافانا ، ونظام الصحاري الحارة في لارة آسيا .\nسٖٔ : ما مقترحاتك لـ : الحفاظ على الحيوانات الموجودة بنظام الحشابش المعتدلة ( اإلستبس ) من\nخطر االنمراض ؟"],[114,"أنواع النظم البيئية المائية :\nوهب اهلل - سبحانه وتعالى - قارتي آسيا وأوروبا عديداً من النظم البيئية المائية سواء\nالعذبة أو المالحة والتي :\n تتسم بتنوعها البيولوجى إذ يعيش فيها عدد كبير من الكابنات الحية .\n تسهم ثرواتها الطبيعية فى دعم استدامة الحياة والحفاظ على البيبة وتواجه هذه النظم عديد من\nالتهديدات المتزايدة .\nالنظم البيئية المائية :\nتنقسم إلى :\nالنظم البيئية للمياه المالحة\nالنظم البيئية للمياه العذبة\nٔ) نظم األراضي الرطبة العذبة .\nٔ) النظم البحرية .\nٕ) النظم البحيرية العذبة .\nٕ) نظم الشعاب المرجانية .\nٖ) النظم النهرية .\nٖ) نظام المانجروف ."],[115,"أوال : الهظم البيئيُ للمياه العذبُ\nتتعدد النظم البيئية للمياه العذبة فى قارتي آسيا وأوروبا ، منها :\nٔ - النظم النهرية :\nتتميز أنهار قارة آسيا بأنها أكثر فى التنوع البيولوجى من أنهار قارة أوروبا بم تفسر ؟\nيرجع ذلك إلى :\n تنوع المناخ .\n اتساع البيبات المابية الدافبة التى تُعد موطنا ً لعديد من الكابنات .\n دلل : تمثل أنهار آسيا موطناً للتنوع البيولوجي ؟\nحيث يعيش بها عدد من الحيوانات مثل :\n- السالحف المابية العذبة .\n- الدالفين النهرية .\n- التماسيح .\nيُ  عد نهر ميكونج فى آسيا ثالث أنهار العالم من حيث التنوع البيولوجي .\nيُ  عد نهر الدانوب فى أوروبا مركزا ً ربيسييا للحفاظ على التنوع البيولوجي خاصة في\nمحمية دلتا الدانوب .\n دلل : تواجه الكائنات الحية في أنهار قارتي آسيا وأوروبا عدة تهديدات ؟\nحيث تواجه :\nٔ) بناء السدود ومحطات توليد الطالة .\nٕ) الصيد الجابر .\nٖ) التلوث الناتج عن الصرف الصحى والزراعي والصناعي .\nٗ) التؽيرات المناخية وتؤثيرها على فترات الفيضان والجفاف .\nوقد أدى ذلك إلى تدهور بعض األنهار ، مثل :\nنهر «هوانج هو» في الصين . نهر «السين » فى فرنسا .  ما النتائج : تأثر النظم النهرية بقارتي آسيا وأرووبا بالتغيرات المناخية ؟\nمما أدى إلى : التؤثير على فترات الفيضان والجفاف مما أدى إلى تدهور بعض األنهار ، مثل :\n- نهر «السين » فى فرنسا .\n- نهر «هوانج هو» في الصين ."],[116,"ٕ - النظم البحيرية العذبة :\nتضم قارتا آسيا وأوروبا عدديا كبيريا من البحيرات العذبة التى تختلف في مساحتها\nوتنوعها البيولوجي .\n دلل : تتعدد مصادر المياه التي تصل إلى نظم البحيرات العذبة بقارتي آسيا وأوروبا ؟\nحيث تحصل هذه البحيرات على المياه من :\nاألنهار التي تصب فيها أو األمطار أو المياه الجوفية أو ذوبان الجليد .\n* أهميتها :\n دلل : للنظم البحيرات العذبة بقارتي آسيا وأوروبا أهمية بيئية ؟ حيث :\nتساهم بدور مهم فى الحفاظ على التوزان البيبى فى المناطك المجاورة لها .\n*من أشهر البحيرات العذبة بقارتي آسيا وأوروبا :\n- بحيرة الدوجا (فى قارة أوروبا) .\n- بحيرة بيكال في( قارة آسيا ) .\n بم تفسر : إدراج منظمة اليونسكو بحيرة بيكال على قائمة التراث العالمي ؟ أو\n بم تفسر : تعد بحيرة بيكال من أشهر البحيرات العذبة في العالم ؟ ألنها :\nٔ) أعمك بحيرة في العالم .\nٕ) من أكبر الخزانات الطبيعية للمياه العذبة على سطح األرض .\nٖ) واحدة من أنمى البحيرات فى العالم ويُطلك عليها« لإلإة سيبيريا » .\nٗ) تتميز بتنوعها البيولوجى الكبيردلل؟ حيث تضم آالف األنواع من الكابنات الحية لذا أدرجتها\nمنظمة اليونسكو على لابمة التراث العالمي .\n بم تفسر : يُطلق على بحيرة بيكال « لؤلؤة سيبيريا »؟\nألنها من أنقى البحيرات .\n بم تفسر : تعد بحيرة الدوجا من أهم البحيرات العذبة في أوروبا ؟ ألنها :\n- أكبر بحيرة عذبة في المارة .\n- تتميز بتنوعها البيولوجى .\nمحطة ربيسية للطيور المهاجرة .  بم تفسر : تعاني بحيرة الدوجا من التدهور؟\nبسبب - : التلوث .\n- الصيد الجابر ."],[117,"ٖ - نظم األراضى الرطبة العذبة :\nتتوزع فى قارتي آسيا وأوروبا كما يلي :\nقارة آسيا :\nتُعد أولى قارات العالم من حيث مساحة األراضى الرطبة العذبة دلل ؟\nحيث تنتشر في :\n- شمال سيبيريا .\nجنوب شرق آسيا . إلليم منشوريا شمال شرق الصين . قارة أوروبا :\n دلل : يظهر نظام األراضي الرطبة العذبة في قارة أوروبا؟\nحيث تتركز في :\nشمال المارة خاصة فى الدول اإلسكندنافية (السويد ، فنلندا ، النرويج ) . - دلتا نهر الدانوب .\n- تظهر بصورة ألل في : وسط المارة .\n دلل : تتعرض األراضي الرطبة العذبة في قارتي آسيا وأوروبا للعديد من التهديدات؟\nحيث تتعرض لـ - : التجفيف .\n- تصريف مياهها ألغراض الزراعة .\n ماذا يحدث إذا : تدهورت األراضي الرطبة العذبة في قارتي آسيا وأوروبا؟\nستموم بإطالق كميات كبيرة من الؽازات المسببة لالحتباس الحرارى مما يإثر سلبيا على المناخ\nالعالمى .\nالتدريب األول\nسٔ : بم تفسر ... ؟\n(ٔ) تتميز أنهار لارة آسيا بالتنوع البيولوجى أكثر من أنهار لارة أوروبا .\n(ٕ) تعتبر بحيرة بيكال من أشهر البحيرات العذبة في العالم .\n(ٖ) تعرض نظم األراضى الرطبة العذبة بمارتي آسيا وأوروبا للتدهور .\nسٕ : ماالنتائج : تعرض نظام األراضى الرطبة العذبة بمارتي آسيا وأوروبا لعديد من التهديدات ؟\nسٖ : دلل على صحة كل عبارة مما يأتى :\n(ٔ) تواجه الكابنات الحية فى األنهار بمارتي آسيا وأوروبا عديد من التهديدات البشرية .\n(ٕ) تتعدد مصادر المياه التى تصل إلى البحيرات العذبة بمارتي آسيا وأوروبا .\n(ٖ) للنظم البحيرية العذبة بمارتي آسيا وأوروبا أهمية بيبية ."],[118,"ثانييا : الهظم البيئيُ للمياه املاحلُ\nٔ - النظم البحرية :\nتضم قارتي آسيا وأوروبا مجموعة متنوعة من البحار والخلجان بعضها :\nمفتوح ومتصل بالمحيط\nشبه مغلق يتصل بالمحيط بممر مائى ضيق\nمثل :\nمثل :\n(خليج البنغال - بحر العرب - بحر الشمال) .\n( الخليج العربي - البحر المتوسط)\n دلل : يتأثر التنوع البيولوجي في البحار بعديد من العوامل ؟\nأهمها :\nٔ) درجات الحرارة .\nٕ) كمية المياه التي تلميها األنهار في البحار .\nٖ) نسبة الملوحة .\nٗ) مدى اتصالها بالمحيط فالبحار المفتوحة أكثر ثرا ًء فى التنوع البيولوجى من البحار شبه المؽلمة .\n* من أمثلة النظم البحرية فى قارتي آسيا وأوروبا :\nٔ - البحر المتوسط :\nيتسم بتنوع بيولوجي كبير بم تفسر ؟ بسبب\nكثرة األنهار العذبة التى تصب فيه ، خاصة في الجزء الؽربي منه .\nيتعرض البحر المتوسط للتلوث بم تفسر ؟ بسبب :\n- مياه الصرف .\n- النفايات البالستيكية ( . خاصة مع ضيك اتصاله بالمحيط األطلنطي)\nمما يشكل تهديديا كبيريا للكائنات البحرية التي تعيش به .\nٕ - خليج البنغال :\n دلل : لخليج البنغال أهمية كبيرة بالنسبة للنظم البيئية البحرية المدارية في العالم ؟\nألنه :\nٔ) يعد أكبر خليج في العالم ، وواحدا من أهم النظم البيبية البحرية المدارية .\nٕ) يعيش فيه عديد من الثدييات البحرية .\nٖ) يحتوى على ثروة سمكية هابلة ."],[119,"ٕ - نظم الشعاب المرجانية :\n تنمو الشعاب المرجانية على سواحل المناطق المدارية\nبين دائرتي عرض ٖٓ شماال وجنوبيا ، ما النتائج؟ لذلك :\nتختفى من لارة أوروبا بسبب مولعها الفلكي .\nتظهر بمارة آسيا في :\nسواحل جنوب وجنوب شرق المارة وتعرف هذه المنطمة باسم «مثلث المرجان» ، الذي يعد من أغنى مناطك العالم بالحياة البحرية .\n- بحر العرب .\n- الخليج العربي .\n- البحر األحمر .\n تتعرض الشعاب المرجانية للتدهور خاصة فى مناطق التجمعات السكانية .\nمعلومة إثرائية :\nتإكد التمارير الدولية على أن ارتفاع درجات حرارة المياه بممدار ٘ ٔ, درجة مبوية خالل المرن الحالى\nما النتائج؟ سوف يإدى إلى خسارة كبيرة لمناطك الشعاب المرجانية في العالم ، ويصاحبه اختفاء\nعدد كبير من الكابنات الحية المرتبطة بها .\nٖ - نظام المانجروف :\n* يوجد في لارة آسيا نحو نصف مساحة المانجروف في العالم .\n* تنتشر أشجار المانجروف بكثافة عالية وارتفاعات كبيرة في :\n سواحل جنوب وجنوب شرق المارة .\n مناطك متفرلة على سواحل الخليج العربي وخليج عُمان والبحر األحمر .\n* يختفي نظام المانجروف تما ًما من سواحل لارة أوروبا بسبب مولعها الفلكي .\nالتدريب الثاني\nسٔ : بم تفسر يُ : عد البحر المتوسط من البحار التي تتعرض للتلوث ؟\nسٕ : دلل ي : تؤثر التنوع البيولوجى فى البحار بعديد من العوامل .\nسٖ : حدد : المناطك التي ينتشر بها نظم الشعاب المرجانية بمارة آسيا ."],[120,"األخطار التي تتعرض لها النظم البيئية فى قارتي آسيا وأوروبا :\n تتعرض النظم البيئية فى قارتي آسيا وأوروبا للتدهور ما النتائج؟ مما يؤدى إلى :\nزيادة األزمات المناخية والصحية والؽذابية ويهدد مستمبل األجيال المادمة .\n تعد قارة آسيا من أكثر قارات العالم تعرضيا للكوارث الطبيعية وتُعد الفيضانات واألعاصير\nاألكثر حدوئيا .\n* من األخطار التي تتعرض لها النظم البيئية بقارتي آسيا وأوروبا :\nأخطار بشرية :\nٕ) التلوث بؤنواعه المختلفة .\nأخطار طبيعية :\nٔ - األعاصير المدارية :\nوهي ظاهرة مناخية متطرفة تنتج عن دوامات هوائية\nتتحرك بسرعة شديدة من سطح المحيط إلى اليابس .\n* تُعد مناطك جنوب وجنوب شرق ، وشرق لارة آسيا من أكثر المناطك التي تتعرض دورييا لعديد من\nاألعاصير المدارية المدمرة وتُعرف باسم «التيفون» .\nالتأثيرات السلبية لألعاصير المدارية :\n ما النتائج : حدوث األعاصير المدارية بقارة آسيا؟\nترتب على ذلك :\nسقوط األمطار الغزيرة المصاحبة لإلعصار في حدوث فيضانات عنيفة مما يؤدى إلى :\nٔ) تدمير العديد من النظم البيبية .\nٕ) تدهور التربة والتالع األشجار .\nٖ) تدمير موابل الحيوانات وفمدان التنوع البيولوجي .\nٗ) تدمير البنية الطبيعية للشعاب المرجانية .\n ما العالقة بين : األعاصير المدارية ، والفيضانات؟\nحيث :\nيصاحب حدوث األعاصير المدارية سموط أمطار غزيرة تتسبب فى حدوث فيضانات عنيفة .\nتعد الفيضانات واألعاصير األكثر حدوثاً وتعد آسيا أكبر قارة تعرضاً للكوارث الطبيعية ."],[121,"ٕ - االنهيارات الجليدية :\nوهي حركة سريعة لمساحات كبيرة من الجليد تنحدر\nمن المناطق المرتفعة إلى المناطق المنخفضة .\n* أماكنها :\n* تحدث االنهيارات الجليدية بوضوح في مناطك :\n- جبال الهيمااليا في وسط آسيا .\nجبال األلب في أوروبا . * التأثيرات السلبية لالنهيارات الجليدية :\n ما النتائج : حدوث االنهيارات الجليدية بقارتي آسيا وأوروبا؟\nترتب على ذلك :\nتصل سرعة االنهيارات الجليدية إلى أكثر من ٖٓٓ كم / ساعة مما يؤدى إلى :\nٕ) نفوق أعداد كبيرة من الحيوانات البرية .\nٖ) تدمير البنية التحتية .\nجهود قارتي آسيا وأوروبا للتصدى لألخطار البيئية :\nتسعى قارتا آسيا وأوروبا لحماية النظم البيئية واستعادتها ( لحالتها الطبيعية ) من خالل\nعدة إجراءات ، منها :\nعلى المستوى األوروبى :\n دلل : قامت أوروبا بالعديد من من اإلجراءات للتصدي لألخطار البيئية؟حيث قامت بـ :\nٔ) تطوير أنظمة معالجة مياه الصرف الصحى والحد من تلوث النظم البحرية .\nٕ) توليع اتفالية «برشلونة » بم تفسر؟ لحماية البيبة البحرية والساحلية .\nٖ) إطالق عدة مبادرات تحت عنوان « االتفاق األخضر األوروبى » بم تفسر؟ بهدف استعادة\nالتنوع البيولوجي وخفض انبعاثات ثاني أكسيد الكربون .\nٗ) إصدار لانون عام ٕٕٗٓم بم تفسر؟ الستعادة النظم البيبية البرية والمابية من خالل إعادة\nاألنهار لوضعها الطبيعي .\n٘) زراعة ٖ مليارات شجرة بحلول عام ٖٕٓٓم ."],[122,"على المستوى اآلسيوي :\n دلل : قامت بعض دول قارة آسيا بمبادرات ناجحة فى مجال إصالح النظم البيئية ؟\nحيث قامت بـ :\nٔ) السعودية : تبنت مبادرات إصالح األراضى المتدهورة وإعادة الحياة البرية .\nٕ) الهند : لامت بجهود إلعادة تؤهيل « نهر الجانج » لتمليل مستوى التلوث وإعادة حماية\nالتنوع البيولوجي\nٖ) الصين : أطلمت مبادرة « شان شوى » التى تضمنت ٘ 7 مشروعيا إلصالح النظم البيبية .\n- معلومة إثرائية\nاعتمدت الجمعية العامة لألمم المتحدة عديدا من المرارات الخاصة بالمياه ، وأعلنت العمد الدولى للعمل\n«الماء من أجل الحياة» خالل العمد من ( ٕ٘ٓٓم ٕٓٔ٘( - م) وأيضيا «الماء من أجل التنمية\nالمستدامة خالل العمد من ( ٕٓٔ8 م ٕٕٓ8 - م) ، وذلن بهدف النهوض بالتنمية المستدامة واإلدارة\nالمتكاملة للموارد المابية لتحميك أهداف التنمية المستدامة لعام ٖٕٓٓم .\n* يتعلك الهدف ٗٔ من أهداف التنمية المستدامة لألمم المتحدة لعام ٖٕٓٓم بالحفاظ على المحيطات\nوالبحار والموارد البحرية واستخدامها على نحو مستدام .\nالتدريب الثالث\nسٔ : اكتب ما تشير إليه كل عبارة من العبارات التالية :\n(ٔ) ظاهرة مناخية متطرفة تنتج عن دوامات هوابية تتحرن بسرعة شديدة من سطح المحيط إلى\nاليابس .\n(ٕ) حركة سريعة لمساحات كبيرة من الجليد تنحدر من المناطك المرتفعة إلى المناطك المنخفضة .\n(ٖ) جبال تمع بوسط آسيا وتعد أحد المناطك التي تحدث بها انهيارات جليدية .\n(ٗ) مبادرة أطلمتها الصين وتضمنت ٘ 7 مشروعيا إلصالح النظم البيبية .\nسٕ : ما األثر الناتج عن ... ؟\n(ٔ) تعرض النظم البيبية فى لارتي آسيا وأوروبا للتدهور .\n(ٕ) تعرض منطمة جنوب وجنوب شرق وشرق آسيا لألعاصير المدارية .\n(ٖ) حدوث االنهيارات الجليدية .\nسٖ : دلل على صحة العبارتين التاليتين :\n(ٔ) تتعرض النظم البيبية بمارتي آسيا وأوروبا لتهديدات بشرية .\n(ٕ) لامت دولتي السعودية والهند بمبادرات ناجحة فى مجال إصالح النظم البيبية ."],[123,"سٔ : أمامك خريطة لقارتي آسيا وأوروبا اكتب ما تدل عليه األرقام التالية :\n(ٔ) بحيرة . .............\n(ٕ) بحيرة . ............. .\n(ٖ) نهـر . .............\n(ٗ) نهـر . .............\n(ه) نهـر . .............\n( )ٙ نهـر . .............\n( )7 بحر . .............\n( )8 بحر . .............\n( )9 البحر . .............\n(ٓٔ) البحر . ............. .\nسٕ : أكمل العبارات اآلتية بما يناسبها :\n(ٔ) تتعدد النظم البيبية للمياه العذبة فى لارتي آسيا وأوروبا ومنها النظم النهرية ........ و .........\n(ٕ) تحصل البحيرات العذبة على المياه من األنهار التي تصب بها أو .. ..... أو ...........\n(ٖ) تتعرض الشعاب المرجانية للتدهور خاصة في مناطك . ............. .\n(ٗ) ينتمى نظام المانجروف للنظم البيبية للمياه . ............. .\nسٖ : اختر اإلجابة الصحيحة من بين البدائل التالية :\n(ٔ) يُعد ثالث أنهار العالم من حيث التن
