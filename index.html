ٔ) أثر النشاط الزراعى بالسلب على مساحة نظم األراضى الرطبة العذبة في لارتي\nآسيا وأوروبا .\n(ٖٔ) يُطلك على سواحل جنوب وجنوب شرق آسيا التي تنمو بها الشعاب المرجانية اسم مثلث\nالمرجان ."],[125,"(ٗٔ) تتحرن األعاصير المدارية بسرعة شديدة من سطح المحيط إلى اليابس .\n(٘ٔ) تساهم األعاصير المدارية فى الحفاظ على الموابل البحرية .\nس٘ : اكتب ما تشير إليه كل عبارة مما يأتي :\n(ٔ) أحد بحيرات لارة آسيا وتُعد من أكبر الخزانات الطبيعية للمياه العذبة على سطح األرض\nومن أنمى بحيرات العالم .\n(ٕ) لارة تُعد األولى من بين لارات العالم من حيث مساحة األراضي الرطبة العذبة .\n(ٖ) أعاصير مدارية مدمرة تتعرض لها منطمة جنوب وجنوب شرق وشرق لارة آسيا بشكل دوري .\nس :ٙ بم تفسر ... ؟\n(ٔ) تحتوى أنهار لارة آسيا على تنوع بيولوجى يفوق أنهار لارة أوروبا .\n(ٕ) تعرض الكابنات الحية في األنهار بمارتي آسيا وأوروبا لعدة تهديدات بشرية وطبيعية .\n(ٖ) أهمية نظم البحيرات العذبة بمارتي آسيا وأوروبا .\n(ٗ) تُعد بحيرة بيكال من الموالع التى لامت منظمة اليونسكو بإدراجها على لابمة التراث العالمي .\n(٘) تعد بحيرة الدوجا من أهم البحيرات العذبة في لارة أوروبا .\n(ٔ) تعرض بحيرة الدوجا لعدة تهديدات .\n( ي )7 تميز البحر المتوسط بتنوع بيولوچی کبير\n( )8 تواجه الكابنات البحرية بالبحر المتوسط عديد من التهديدات .\n( )9 تختفى نظم الشعاب المرجانية من لارة أوروبا .\n(ٓٔ) إطالق المارة األوروبية عدة مبادرات تحت عنوان «االتفاق األخضر األوروبى» .\nس :ٚ ما النتائج المترتبة على ... ؟\n(ٔ) تعرض النظم النهرية بمارتي آسيا وأوروبا لعديد من التهديدات .\n(ٕ) تدهور األراضى الرطبة العذبة في لارتي آسيا وأوروبا .\n(ٖ) تعرض شرق لارة آسيا لألعاصير المدارية ( بالنسبة للنظم البيبية ) .\n(ٗ) حدوث االنهيارات الجليدية بمارتي آسيا وأوروبا ."],[126,"س :ٛ دلل على صحة كل عبارة من العبارات اآلتية :\n(ٔ) تمثل أنهار لارة آسيا موطنا للتنوع البيولوجي .\n(ٖ) تنتشر نظم األراضي الرطبة العذبة بمارة آسيا .\n(ٗ) تتعرض األراضى الرطبة العذبة فى لارتي آسيا وأوروبا لعديد من التهديدات .\n(ه) لامت بعض الدول اآلسيوية بعدة مبادرات لحماية النظم البيبية .\nس :ٜ حدد :\n(ٕ) العوامل التى تإثر فى التنوع البيولوجي في البحار\n(ٖ) اإلجراءات التي لامت بها لارة أوروبا لحماية النظم البيبية واستعادتها .\nسٓٔ : قارن بين : األعاصير المدارية ، واالنهيارات الجليدية ، من حيث :\n* المفهوم .\n* اآلثار السلبية الناتجة عنها .\n(ٔ) تعتبر شمال أوروبا ألل المناطك التي يظهر بها نظم األراضي الرطبة العذبة .\n(ٕ) تعرض النظم البيبية بمارتي آسيا وأوروبا للتدهور له أثار سلبية متعددة .\nسٕٔ : ما العالقة بين ... ؟\n(ٔ) األعاصير المدارية ، والفيضانات .\n(ٕ) األراضى الرطبة العذبة ، واالحتباس الحرارى ."],[127,"سٔ : الحظ الخريطة التالية ، ثم أجب :\nرلم (ٔ) هو . ............\nٕ - غابات . ............\nٖ - نظام . ............ .\nٗ - نظام الحشابش السابد في\nالمنطمة رلم (ٗ) هو . ............ .\n٘ - بحيرة . ............\n- ٙ خليج . ............\nسٕ : اكتب كلمة (صواب ) أوكلمة (خطأ) أمام العبارة غيرالصحيحة مع تصويب الخطأ :\nٕ ي - ختفي نظام الؽابات الموسمية في لارة أوروبا .\nٖ - مناخ الؽابات النفضية بارد شتاء ، معتدل صيفيا .\nٗ - تتميز أوراق أشجار الؽابات الصنوبرية بشكلها المدبب وغطابها الشمعي .\nه - تنتشر حيوانات الرنة في نظام حشابش اإلستبس .\n- ٙ تواجه النُّظم البيبية المابية في آسيا وأوروبا تهديدات متزايدة رغم ثرواتها الطبيعية .\n-7 تتسم أنهار أوروبا بتنوع بيولوجي أكبر من أنهار آسيا نتيجة تنوع المناخ .\nسٖ : اختر اإلجابة الصحيحة مما بين القوسين :\nٔ ي - ظهر في شبه الجزيرة العربية نظام ( . ............ السافانا ـ اإلستبس ـ التندرا - الصحاري)\nٕ ي - عيش طابر أبو منجل في نظام الؽابات . ............ .\n(المدارية - النفضية - الموسمية - الصنوبرية)\nٖ - أحد النظم البحرية المالحة في لارة أوروبا .. ............\n(بحر العرب - البحر األحمر - بحر الصين - بحر الشمال)\nٗ - أكبر البحيرات العذبة في أوروبا هي بحيرة ( . ............ . بيكال - الدوجا - فيكتوريا - تنجانيما)"],[128,"سٗ : أكمل العبارات التالية بما يناسبها من كلمات :\nٕ) تُعرف األعاصير المدارية المدمرة في آسيا باسم . ............ .\nٖ) توجد صحراء جوبي في دولتي . ............ و . ............\nٗ) أكبر مساحة من األراضي الرطبة في العالم توجد في لارة . ............ .\n٘) تختفي من لارة أوروبا نظم مابية منها نظام الشعاب المرجانية ونظام . ............\nس٘ : فسر العبارات التالية :\nٕ - تسمية نظام الؽابات النفضية بهذا االسم .\nٖ - انتشار البعوض في الؽابات الصنوبرية صيفيا .\nٗ - تراكم كميات كبيرة من المواد العضوية غير المتحللة في تربة التندرا .\nه - وجود جذور عميمة لبعض أشجار الصحاري المعتدلة .\nس :ٙ ما النتائج المترتبة على ... ؟\nٔ - غزارة األمطار في السافانا اآلسيوية .\nٕ – هبوب األعاصير المدارية على بعض المناطك في آسيا .\nٖ - التركيبة الخشنة والرملية لتربة الصحاري المعتدلة .\nٗ - تميز بحيرة بيكال بتنوعها البيولوجي الكبير .\nس :ٚ دلل على صحة كل عبارة مما يلي :\nٕ - تتسم تربة الؽابات النفضية بالخصوبة .\nٖ - تتعدد الجهود في آسيا الستعادة النظم البيبية .\nٗ - كان لبعض األنشطة البشرية أثر سلبي على األنهار في لارتي آسيا وأوروبا ."],[130," تُعد بالد اليونان من أقدم البالد التي ظهرت فيها الحضارات بقارة أوروبا والتي\nاشتهرت بإنجازتها في :\n- الفلسفة .\n- العلوم .\n- الفنون .\n كان لحضارة بالد اليونان دوريا كبيريا فى تشكيل الفكر األوروبي ، كما أثرت في تاريخ\nالبشرية .\nيتضح من الخريطة السابقة أن :\nبالد اليونان لها موقع جغرافي متميز دلل؟ حيث تمع فى جنوب شرق لارة أوروبا ، وتطل على\nعدد من البحار المهمة ، مثل :\nالبحر المتوسط . بحر إيجه . - البحر األيوني ."],[131," بم تفسر : أهمية الموقع الجغرافي المتميز لبالد اليونان القديم ؟\nحيث كان للموقع الجغرافي المتميز لبالد اليونان دور مهم في :\nٔ) ازدهار التجارة البحرية مما ساعد على سهولة التواصل مع الحضارات األخرى في مصر وفينيميا .\nٕ) جعل اليونان بمثابة البوابة الشرلية ألوروبا التي انتملت من خاللها إنجازات حضارات الشرق المديم\nإلى المارة األوروبية مما أثرى ثمافتهم وساهم في تطورها العلمى والفكرى .\n بم تفسر : تُعد اليونان من أهم الحضارات القديمة بالنسبة ألوروبا ؟ ألن الحضارة اليونانية :\nٔ) كانت بمثابة البوابة الشرلية ألوروبا التي انتملت من خاللها إنجازات حضارات الشرق المديم\nإلى أوروبا .\nٕ) اشتهرت بإنجازتها في الفلسفة والفنون والعلوم والفنون .\nٖ) كان لها دور كبير في تشكيل الفكر األوروبي .\n بم تفسر : ازدهار التجارة البحرية في بالد اليونان قديماً ؟\nبسبب :\nمولع بالد اليونان الجؽرافي المتميز في جنوب شرق لارة أوروبا ، وإشرافها على عدد من البحار\nالمهمة .\n ما النتائج : انتقال إنجازات حضارات الشرق القديم إلى أوروبا عبر بالد اليونان ؟\nأدى إلى - :\nثراء ثمافتها . - المساهمة في تطورها العلمى والفكرى .\nوفيما يلى نتعرف حضارات بالد اليونان القديم بشيء من التفصيل -:\nحضارات بالد اليونان القديمة :\nشهدت بالد اليونان قيام عدة حضارات قديمة تأثرت بالحضارة المصرية وأثرت فيها ، ومن\nأهمها :\n- حضارة كريت .\n- حضارة إسبرطة .\n- حضارة أثينا ."],[132,"ٔ - حضارة كريت :\n نشؤت في جزيرة كريت .\n ازدهرت حضارتها بفضل التجارة البحرية .\n دلل : حدث تواصل حضاري بين الحضارة المصرية وحضارة كريت؟\nحيث :\nألامت حضارة كريت عاللات تجارية وثمافية مع مصر خاصة خالل عصرى الدولة الوسطى والحديثة\nدلل ؟ حيث استوردت من مصر البردى والعاج والذهب .\nٕ - حضارة إسبرطة :\nساد بحضارة إسبرطة نظام عسكرى صارم دلل ؟ حيث كان األطفال يخضعون لتربية لاسية\nمنذ والدتهم بهدف إعداد جيش لوی دابم االستعداد للحرب .\nٖ - حضارة أثينا :\n تميزت حضارة أثينا بتنوع مصادر دخلها بين الزراعة والصناعة والتجارة بم تفسر؟\nبسبب موقعها الجغرافي .\n ما النتائج : تنوع مصادر الدخل في اقتصاد حضارة أثينا؟\nترتب على ذلك : المساعدة على تحميك التوازن بين طبمات المجتمع .\n*ضعف المدن اليونانية :\n بم تفسر : ضعف المدن اليونانية؟\nبسبب الصراعات فيما بينها .\nترتب على ذلك -:\n ما النتائج : الصراعات بين المدن اليونانية؟\nنجاح الملن فيليب الثاني الممدوني في توحيد معظم هذه المدن ، مما مهد الطريك البنه اإلسكندر األكبر\nلنشر الحضارة اليونانية فى أنحاء مختلفة من العالم .\n*مالمح الحضارات اليونانية :\n- الحياة السياسية .\n- الحياة الفكرية والعلمية .\n- العمارة والفنون .\n- الحياة االقتصادية ."],[133,"ٔ - الحياة السياسية :\nشهدت الحياة السياسية فى اليونان أنظمة متعددة للحكم دلل؟\nبدأت بنظام دويالت المدن\nثم النظام األرستقراطي\nحيث :\nثم النظام الديمقراطي .\n*نظام دويالت المدن :\nفي البداية ظهرت دويالت المدن دلل؟ حيث كانت كل مدينة مستملة لها حاكم (ملن) .\n دلل : تعددت مهام حاكم المدينة بنظام دويالت المدن ببالد اليونان ؟ حيث :\nيمود الجيش . يشرف على وضع الموانين بمساعدة مجلس من األعيان . *النظام األرستقراطي :\nمع مرور الوقت تراجعت سلطة الملوك (فى أثينا) لصالح األرستقراطيين (كبار مالك\nاألراضي ) الذين احتكروا الحكم «النظام األرستقراطي » ما النتائج ؟ مما أدى إلى تصاعد\nالمطالب الشعبية بالمشاركة في الحكم وتحميك العدل ونتيجة لذلن نشؤ في أثينا نظام جديد\nعُرف بـ «الديمقراطية » .\n*النظام الديمقراطي :\n دلل : قام النظام الديمقراطى على عدة مبادئ ؟ منها :\nالديمقراطية ؟\nٔ) مشاركة المواطنين في الحكم والتعبير عن رأيهم في الموانين والمرارات .\nٕ) اختيار المادة بالتصويت بدال ً من الوراثة .\nيختار فيه الشعب من\nيحكمه ويشارك في\nٖ) استمالل المضاء لضمان العدالة للجميع .\nهي نظام حكم\nوضع القوانين من خالل\nالتصويت .\nٕ - الحياة االقتصادية :\n*الزراعة :\nلم تعتمد بالد اليونان على الزراعة فقط بم تفسر؟ بسبب للة األراضى الزراعية ."],[134,"*التجارة :\n بم تفسر : تعد بالد اليونان من أغنى الحضارات اقتصادياً في عصرها ؟ ألن :\nاعتمدت بالد اليونان على التجارة مع المدن األخرى ، ما النتائج ؟ ولد ساعد ذلن على ازدهار المدن\nاليونانية ، مما جعل اليونان من أغنى الحضارات في عصرها .\n*الصناعة :\nبرع اليونانيون في الصناعة خاصة في :\n• صناعة السفن .\n• صناعة األسلحة .\n• صناعة الفخار .\nٖ - الحياة الفكرية والعلمية :\n* شهدت الحضارة اليونانية القديمة ازدهاريا كبيريا في الثقافة والعلوم :\nٔ) الفلسفة كانت من أبرز إنجازات الحضارة اليونانية دلل؟ حيث :\nظهر فالسفة عظماء ، مثل ( : سمراط - أفالطون – أرسطو) .\nسا مهما للفكر الؽربي الحميا .\nكانت الفلسفة اليونانية أسا ً\nٕ) األدب\nحيث :\nازدهر األدب اليوناني دلل؟\nأبدع اليونانيون في كتابة - : المسرحيات .\nٖ) العلوم\n- الشعر .\nبرع اليونانيون في العديد من مجاالت العلوم دلل؟ حيث برعوا في :\n- علم الرياضيات .\n- علم الفلن .\nعلم الطب ، ومن أبرز علمابهم «أبمراط» . ٗ - العمارة والفنون :\nتميزت فنون العمارة والنحت عند اليونانيين بالجمال والدقة والتوازن دلل؟ حيث في :\nٔ) فن العمارة : اشتهروا ببناء المعابد الضخمة مثل :\nمعبد البارثينون في أثينا الذى تميزبؤعمدته الضخمة وزخارفه الجميلة .\nٕ) فن النحت : أتمنوا نحت التماثيل وأظهروا التفاصيل الوالعية بدلة عالية ."],[135,"التدريب األول\nسٔ : اكتب كلمة (صواب) أوكلمة (خطأ ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٔ) تُعد اليونان من ألدم البالد التي ظهرت فيها الحضارات بمارة أوروبا .\n(ٕ) ساد في حضارة أثينا نظام عسكرى صارم .\n(ٖ) ظهرت دويالت المدن فى بداية أنظمة الحكم اليوناني .\n(ٗ) خالل فترة حكم دويالت المدن تولى حاكم كل مدينة ببالد اليونان لدي ًما مهمة اإلشراف على وضع\nالموانين بمساعدة مجلس من األعيان .\n(ه) كان النشاط الزراعى هو العامل الربيسى فى ازدهار المدن اليونانية المديمة .\n( )ٙ تميزت فنون العمارة والنحت عند اليونانيين بالجمال والدلة والتوازن .\n( )7 معبد البارثينون في كريت من أشهر المعابد اليونانية المديمة .\nسٕ : حدد األثر الناتج عن :\n(ٕ) ضعف المدن اليونانية المديمة بسبب الصراع فيما بينهم .\nسٖ : دلل على صحة كل عبارة من العبارات اآلتية :\n(ٔ) ألامت حضارة كريت عاللات تجارية مع مصر خاصة فى عصرى الدولة الوسطى والحديثة .\n(ٕ) لام النظام الديممراطى بؤثينا على عديد من المبادئ .\n(ٖ) كانت الفلسفة من أبرز إنجازات الحضارة اليونانية المديمة .\n(ٗ) براعة اليونانيين المدماء في فن النحت .\nنسبه\nابن الملن فيليب الثاني الممدوني الذي وحد معظم المدن اليونانية .\nتعليمه\nتلمى تعليمه على يد الفيلسوف أرسطو .\nمبكرا ، فتولى الحكم وهو في العشرين من عمره بعد وفاة والده\nتوليه الحكم أظهر مهارته الميادية\nأهم أعماله\n دلل : أثبت اإلسكندر براعتها العسكرية بعد وفاة والده ؟\nحيث :\nواصل سياسة والده فى تموية الجيش وتوسيع نفوذه حيث لام بميادة حملة عسكرية\nضد الفرس حتى وصل إلى مصر ودخلها .\n ما نتائج : الحملة العسكرية التي قادها اإلسكندر ضد الفرس ؟\nٔ) دخول جيش اإلسكندر مصر عام ٕٖٖ ق . م .\nٕ) استسلم له الحاكم الفارسي دون لتال .\nأدى إلى :"],[136,"* قدوم اإلسكندر األكبر إلى مصر :\n*رحب المصريون بقدوم اإلسكندر األكبر إلى مصر بم تفسر ؟\nمحررا لهم من حكم الفرس الظالم .\nألن المصريين اعتبروا اإلسكندر\n*سياسة اإلسكندر األكبر في مصر :\n*أعاد اإلسكندر تنظيم نظام الحكم في مصر دلل ؟\nحيث قام بـ :\nٔ) تمسيم البالد إلى لسمين تحت حكم حاكمين مصريين .\nٕ) تعيين حكام يونانيين للمناطك الحدودية .\nوكان الهدف من ذلك : تفادى استغالل أى حاكم للنفوذ والقوة .\n*بناء مدينة اإلسكندرية :\nاختار اإلسكندر األكبر موقعيا استراتيجييا عند قرية « راقودة»\nلتأسيس مدينة اإلسكندرية .\n بم تفسر : تأسيس اإلسكندر لمدينة اإلسكندرية ؟\nجسرا يربط بين الحضارتين المصرية واليونانية .\nلكي تكون مركزا للثمافة اليونانية وتصبح فيما بعد\n ما العالقة بين : بناء مدينة اإلسكندرية ، والحضارة اليونانية ؟\nجسرا يربط بين\nحيث تم تؤسيس مدينة اإلسكندرية لتكون مركزا للثمافة اليونانية وتصبح فيما بعد\nالحضارتين المصرية واليونانية .\n*وفاة اإلسكندر األكبر :\nتوفى اإلسكندر األكبر تاركيا إمبراطورية تم تقسيمها بين قواده بم تفسر؟\nبسبب عدم وجود وريث له .\n ما النتائج : وفاة اإلسكندر دون أن يكون له وريث ؟ تربت على ذلك :\nتمسيم إمبراطوريته بين لواده فكانت مصر من نصيب المابد بطلميوس بن الجوس (بطلميوس (األول)\nومن هنا بدأ عصر جديد في مصر هو عصر دولة البطالمة ."],[137," أصبحت مصرتحت حكم البطالمة ، الذى استمر حكمهم لها قرابة ثالثة قرون .\n اعتمد البطالمة في حكمهم لمصر على النظام الملكي الوراثى .\nأشهر ملوك دولة البطالمة في مصر\nٔ - بطلميوس األول :\n استطاع توطيد دعابم حكمه فى مصر ، والتخلص من جميع منافسيه .\n أعلن استمالل مصر عن إمبراطورية اإلسكندر .\nٕ - بطلميوس الثاني :\n كان محبيا للثقافة دلل؟ حيث أكمل بناء مكتبة اإلسكندرية .\nٖ - بطلميوس الثالث :\n ما العالقة بين : بطلميوس الثالث و علم الفلك عند المصريين ؟\nحيث أجرى الملن بطلميوس الثالث إصال ًحا في التمويم المصرى بإضافة\nيوم كل أربع سنوات ، مما جعل السنة المصرية تتوافك مع السنة الشمسية .\n اهتم بالمعابد وتعزيز العاللات مع رجال الدين (الكهنة) .\nٗ - كليوباترا السابعة :\n آخر ملون البطالمة .\n عُرفت بشخصيتها الموية وطموحها الكبير وبراعتها فى شبون الحكم والسياسة .\n بم تفسر : سقوط دولة البطالمة في مصر؟\nبسبب هزيمة كليوباترا في معركة أكتيوم البحرية عام ٖٔ ق . م .\nوانتهت حياتها بعد المعركة ."],[138,"التواصل بين الحضارة المصرية القديمة والحضارة اليونانية القديمة :\nقامت عالقات مميزة بين الحضارتين اليونانية والمصرية القديمة بدأت بالتبادل التجارى دلل؟\nحيث :\nاستوردت مصر من اليونان منتجات مثل : الفخار والزيوت واألخشاب . - صدرت مصر لليونان الذهب واألحجار الكريمة .\n دلل : زادت العالقات بين الحضارتين اليونانية والمصرية فى عصر الدولة الحديثة ؟\nحيث ازدهرت العاللات بين الحضارتين فى عصر الدولة الحديثة وخاصة خالل حكم الملن تحتمس\nصورا لسكان كريت وهم يمدمون الهدايا لملون مصر .\nالثالث حيث تظهر النموش المصرية\n دلل : تأثرت الحضارة اليونانية بالحضارة المصرية في الكثير من المجاالت ؟\nحيث كان من هذه المجاالت : الفن والعمارة والعلوم والفلسفة و األدب .\n دلل : تأثرت الحضارة اليونانية بالحضارة المصرية في الفن والعمارة ؟\nحيث تؤثر اليونانيون باألسلوب المصرى فى نحت التماثيل بالولفة المستميمة ،\nواستلهموا تصميم األعمدة ذات التيجان من المعابد المصرية .\n دلل : تأثر العلماء والفالسفة اليونانيين بالحضارة المصرية ؟\nحيث زار العلماء والفالسفة اليونانيون مصر مثل : فيثاغورس وأفالطون\nوتعلموا من الكهنة المصريين .\n دلل : تأثر األدب اليوناني بالحضارة المصرية ؟\nحيث تؤثر األدب اليوناني ببعض األساطير المصرية المديمة .\nخالل العصر البطلمى لمصر :\nوالحكم في مصر .\n دلل : اهتم البطالمة بالحياة الدينية عند المصريين ؟\nٔ) احترم البطالمة المعبودات المصرية ولاموا ببناء المعابد لكسب تؤييد المصريين .\nٕ) ظهرت معبودات تحمل مالمح مشتركة بين الثمافتين المصرية واليونانية\nمثل عبادة سيرابيس وفى نفس الولت حافظ المصريون على ديانتهم التمليدية ."],[139,"سٔ : أكمل العبارات اآلتية بكلمات مناسبة :\n(ٔ) اشتهرت الحضارة اليونانية بإنجازاتها فى العلوم و ............. و .. .............\n(ٕ) شهدت بالد اليونان ليام عدة حضارات لديمة تؤثرت بالحضارة المصرية وأثرت فيها ومن أهمها .\n. .............\n(ٖ) من أشهر فالسفة اليونان سمراط و ............. و ... .............\nجسرا يربط بين الحضارتين المصرية واليونانية هي .. .............\n(ٗ) مدينة اتخذت\n(ه) ولع اختيار اإلسكندر األكبر إللامة مدينة اإلسكندرية على لرية . .............\n( )ٙ اهتم الملن بطلميوس الثالث بالمعابد وتعزيز العاللات مع . ............. .\n( )7 استوردت مصر من بالد اليونان الفخارو ............. و .. .............\nسٕ : اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) تمع بالد اليونان بمارة أوروبا فى . ...........\n(ٕ) استوردت حضارة كريت من مصر لدي ًما خالل عصر الدولة الوسطى عدة منتجات من أهمها ...\n(األخشاب - الزيوت - البردى - الفخار )\n(ٖ) أى من حضارات بالد اليونان التالية كان األطفال يخضعون فيها لتربية عسكرية لاسية منذ\nوالدتهم ؟ . حضارة . ...........\n(إسبرطة - كريت - ممدونيا - أثينا )\n(ٗ) استطاع فيليب الثانى ملن ممدونيا السيطرة على معظم بالد اليونان لدي ًما ولد ساعده على ذلن ...\n(تحالفه مع مدينة إسبرطة - الصراعات بين المدن اليونانية - انشؽال أثينا بتطبيك الديممراطية - لوة\nالطبمة األرستمراطية )\n(ه) تمثل نظام الحكم الذي ظهر فى بداية الحياة السياسية ببالد اليونان فى .. ...........\n(نظام دويالت المدن - النظام اإلمبراطوري - النظام األرستمراطي - النظام الديممراطي )\n( )ٙ ظهر مفهوم الديممراطية لدي ًما فى حضارة ( .. ........... إسبرطة - أثينا - كريت - ممدونيا )\n( )7 تميزت الديممراطية التى شهدتها بالد اليونان لديما بـ . ...........\n(استمالل المضاء - فرض الموانين والمرارات - احتكار الحكم - النظام العسكرى الصارم )\n( )8 رغم تنوع األنشطة االلتصادية فى بالد اليونان إال أنها اعتمدت على نشاط . ........... .\n(الزراعة - الصناعة - التجارة - الصيد )"],[140,"( )9 من أشهر المعابد اليونانية معبد البارثينون الذى أليم فى مدينة .. ...........\n( أثينا - إسبرطة - اإلسكندرية - كريت )\n(ٓٔ) من أشهر العلماء اليونانيون في علم الطب . ........... .\n( فيثاغورس - أبمراط - أفالطون - أرسطو )\n(بطلميوس األول - فيليب الثانى - اإلسكندر األكبر - بطلميوس الثانى )\n(ٕٔ) تم استكمال بناء مكتبة اإلسكندرية في عهد . . ...........\n( بطلميوس األول - بطلميوس الثانى - بطلميوس الثالث - كليوباترا السابعة )\n(ٖٔ) من فالسفة بالد اليونان المديم الذين زاروا مصر .. ...........\n(سمراط - أفالطون - فيثاغورس - أبمراط )\n(ٗٔ) صدرت مصر إلى بالد اليونان لدي ًما . ........... .\n(الفخار - الزيوت - األخشاب - الذهب )\nسٖ : اكتب كلمة (صواب ) أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٔ) أسهمت إنجازات حضارة بالد اليونان فى تشكيل الفكر األوروبى .\n(ٕ) تميز التصاد أثينا بتعدد مصادر الدخل مما حمك التوازن بين طبمات المجتمع .\n(ٖ) برع اليونانيون فى صناعة الفخار واألسلحة .\n(ٗ) أبدع اليونانيون المدماء فى كتابة الشعر والمسرحيات .\nسا مهم للفكر الؽربي الحميا .\n(ه) تُعد الفلسفة اليونانية أسا ً\n( )ٙ تلمى اإلسكندر األكبر تعليمه على يد الفيلسوف سمراط .\n( )7 أنشبت مدينة اإلسكندرية لتكون مركزا للثمافة اليونانية .\n( )8 استمر حكم البطالمة لمصر ثالثة لرون معتمديا على النظام الديممراطي .\n( )9 استلهم المصريين المدماء تصميم األعمدة ذات التيجان من المعابد اليونانية .\n(ٕٔ) تُعد عبادة سيرابيس من المالمح المشتركة بين الثمافتين المصرية والفينيمية ."],[141,"سٗ : من هو ... ؟\n(ٔ) ملن ممدونيا الذى لام بتوحيد معظم المدن اليونانية المديمة .\n(ٕ) دخل مصر عام ٕٖٖ ق . م بعد أن استسلم له الحاكم الفارسي دون لتال .\n(ٖ) كان أول حاكم لمصر في العصر البطلمي واستطاع التخلص من جميع منافسيه .\n(ٗ) الملن البطلمى الذى لام بإضافة يوم إلى كل أربع سنوات في التمويم المصرى .\n(ه) آخر حكام البطالمة انتهت حياتها بهزيمة كبيرة بعد معركة أكتيوم البحرية عام ٖٔ ق . م .\nس٘ : رتب األحداث التاريخية التالية من األقدم لألحدث :\n( )....( )۱ إتمام بناء مكتبة اإلسكندرية .\n( )... نشؤة حضارة كريت .\n( )... وفاة اإلسكندر األكبر وتمسيم إمبراطوريته .\n( )... توحيد فيليب الممدوني للمدن اليونانية .\n( )....( )۲ بدء حكم البطالمة لمصر .\n( ).... معركة أكتيوم البحرية .\n( )..... دخول اإلسكندر األكبر مصر .\n( ).... سموط مدينة إسبرطة على يد ملن ممدونيا .\n( )......( )۳ جعل السنة المصرية تتوافك مع السنة الشمسية .\n( )...... إعالن استمالل مصر عن إمبراطورية اإلسكندر األكبر .\n( )..... توحيد مدن بالد اليونان ألول مرة .\n( )..... تؤسيس مدينة اإلسكندرية .\nس :ٙ بم تفسر ... ؟\n(ٔ) تُعد الحضارة اليونانية من أهم الحضارات المديمة بالنسبة لمارة أوروبا .\n(ٕ) أهمية المولع الجؽرافي لبالد اليونان المديم .\n(ٖ) سيادة النظام العسكرى الصارم بحضارة إسبرطة .\n(ٗ) تُعد بالد اليونان أغنى الحضارات التصادييا في عصرها .\n(ه) ترحيب المصريين بمدوم اإلسكندر األكبر لمصر .\n( )ٙ ليام اإلسكندر األكبر بإعادة تنظيم الحكم في مصر .\n( )7 تؤسيس اإلسكندر األكبر مدينة اإلسكندرية .\n( )8 تمسيم إمبراطورية اإلسكندر األكبر بعد وفاته .\n( )9 سموط دولة البطالمة في مصر ."],[142,"س :ٚ ما األثر الناتج عن ... ؟\n(ٔ) انتمال إنجازات حضارات الشرق المديم إلى المارة األوروبية عبر بالد اليونان .\n(ٕ) تنوع مصادر الدخل في حضارة أثينا .\n(ٖ) ضعف المدن اليونانية المديمة مع مرور الزمن .\n(ٗ) تراجع سلطة الملون لصالح األرستمراطيين في أثينا .\n(٘) اعتماد اليونانيين على التجارة فى نشاطهم االلتصادي .\n( )ٙ وفاة اإلسكندر األكبر دون أن يكون له وريث ًا .\nس :ٛ دلل على صحة كل عبارة من العبارات اآلتية :\n(ٔ) كان هنان تواصل حضاري بين الحضارة المصرية المديمة وحضارة كريت .\n(ٕ) شهدت الحياة السياسية في بالد اليونان المديمة ظهور أنظمة متعددة للحكم .\n(ٖ) تعددت مهام حاكم المدينة بنظام دويالت المدن فى بالد اليونان المديمة .\n(ٗ) كانت فنون العمارة والنحت فى الحضارات اليونانية تتميز بالجمال والدلة والتوازن .\n(ه) تعددت أعمال الملن البطلمي بطلميوس الثالث في مصر .\n( )ٙ ازدهار األدب اليوناني لدي ًما .\n( )7 بدأت العاللات بين الحضارة المصرية المديمة والحضارة اليونانية بالنشاط التجاري .\nس :ٜ وضح : األسس التي لام عليها النظام الديممراطي في حضارة أثينا .\nسٓٔ : ما المقصود بـ : الديممراطية ؟\n(ٔ) تميز المضاء باالستمالل في النظام الديممراطي بؤثينا .\n(ٕ) تشابهت سياسة اإلسكندر األكبر أثناء توليه حكم بالد اليونان مع سياسة والده .\n(ٖ) اعتمدت بالد اليونان على الزراعة بشكل ربيسي .\n(ٗ) لسم اإلسكندر األكبر نظام الحكم في مصر إلى ثالث ألسام .\n(ه) لام البطالمة ببناء المعابد أثناء حكمهم لمصر .\n( )ٙ أهمل الملن بطلميوس الثانى أثناء حكمه لمصر الحياة الثمافية .\nسٕٔ : حدد العالقة بين :\n(ٔ) مدينة أثينا ، والحكم الديممراطى باليونان المديمة .\n(ٕ) لرية رالودة ، ومدينة اإلسكندرية .\n(ٖ) بناء مدينة اإلسكندرية ، والحضارة اليونانية ."],[143,"من الخريطة السابقة يتضح أن : روما تقع على البحر المتوسط .\n ما النتائج : الموقع الجغرافي لروما على البحر المتوسط؟ ترتب على ذلك :\nأن أصبحت روما نمطة التماء بين أوروبا وشمال إفريميا والشرق األدنى ، مما جعلها مركزا ً للحضارة\nوالتفاعل الثمافي والتجاري .\nروما وتوسعاتها :\nتحولت روما من مجرد مدينة صؽيرة على ساحل البحر المتوسط إلى إمبراطورية عظيمة .\n دلل : قامت روما بالسيطرة على الدول والمناطق المطلة البحر المتوسط من خالل عدة\nحروب ؟ حيث خاضت حروبيا عديدة لتوسيع نفوذها فتمكنت من :\nفرض سيطرتها على معظم إيطاليا بحلول المرن الثالث ق . م .\nالتوجه خارج شبه الجزيرة اإليطالية والسيطرة على :\n- ممدونيا .\n- جزر البحر المتوسط بعد هزيمتها لمرطاج .\n- سوريا .\nمصر (آخر الدول التي ضمها الرومان عام ٖٓ ق . م عمب معركة أكتيوم البحرية) . وبذلك سيطرت روما على البحر المتوسط حتى أصبح يعرف بالبحيرة الرومانية"],[144,"*مالمح الحضارة الرومانية :\nٔ - الحياة السياسية :\nشهدت الحياة السياسية في روما أنظمة عديدة للحكم دلل؟ تمثلت في :\n- النظام الملكي .\n- النظام الجمهوري .\n- النظام اإلمبراطوري .\n* النظام الملكي : بدأ الحكم في روما ملكييا .\n* النظام الجمهوري :\nتحول نظام الحكم في روما إلى النظام الجمهوري بم تفسر؟ بسبب زيادة اعتراضات\nالشعب على انفراد الحاكم بالسلطة ، ولد اعتمد هذا النظام على مبدأ توزيع السلطة .\n* النظام اإلمبراطوري :\n بم تفسر : ظهور النظام اإلمبراطوري في روما قديماً؟ بسبب :\nٔ) اتساع حدود الدولة .\nٕ) سيطرة أوكتافيوس على الحكم ، بدأ العصر اإلمبراطوري حيث أصبح أوكتافيوس أول إمبراطور\nرومانى .\n دلل : اهتم اإلمبراطور أكتافيوس بتنظيم الشئون الداخلية لإلمبراطورية الرومانية؟\nحيث قام بوضع نظام جديد قائم على :\nٔ) إعادة تنظيم الجيش .\nٕ) نشر السالم في أنحاء اإلمبراطورية الرومانية .\nٖ) االهتمام بتحميك االستمرار الداخلي وتحميك العدالة االجتماعية للمواطنين الرومان .\nٗ) االهتمام بتشييد المباني العامة .\nمما جعل روما مركزاً حضارييا متقدميا ."],[145,"ٕ - الحياة االقتصادية :\nالزراعة :\n كانت الزراعة مهمة في روما حيث زرعت محاصيل منها : الممح والشعير .\n مع مرور الزمن تدهورت الزراعة في روما بم تفسر؟\nألن األراضى الزراعية تعرضت للدمار بسبب الحروب .\n ما النتائج : تدهور الزراعة في روما؟\nمما أدى إلى اضطرار روما الستيراد الممح من بعض الدول لتؤمين احتياجاتها الؽذابية وكانت مصر\nمن أهم هذه الدول لتؤمين احتياجاتها الؽذابية .\nالصناعة :\n دلل : تنوعت الصناعات في الحضارة الرومانية قديماً؟\nحيث تنوعت بها الصناعات ، مثل :\n- صناعة األسلحة .\n- صناعة المجوهرات .\n- صناعة الزجاج .\n- صناعة المنسوجات .\n- صناعة الفخار .\nالتجارة :\nٔ) كان االلتصاد الرومانى يعتمد بشكل كبير على التجارة .\nٕ) ازدهرت التجارة البحرية عبر البحر المتوسط .\nٖ) استخدمت روما العمالت المعدنية على نطاق واسع ما النتائج؟ مما عزز األنشطة التجارية\nداخل اإلمبراطورية وخارجها .\nٖ - الحياة الفكرية والعلمية :\nٕ) ازدهر في روما األدب مثل الشعر والمسرح .\nٖ) أنشؤ الرومان المكتبات العامة بم تفسر؟ لنشر الثمافة ."],[146,"ٗ - العمارة والفنون :\n برع الرومان في العمارة والنحت دلل ؟ حيث أنشبوا مدرجات ، مثل مدرجات الكولوسيوم .\n دمجوا بين الطرازين المصرى واليوناني في\nمعبد السرابيوم باإلسكندرية .\n تؤثر الفن الجنابزى للرومان بالفن المصرى دلل؟\nفي زخرفة التوابيت بالرموز الدينية .\nالتواصل الحضاري بين مصر وروما :\nمرت العالقات بين مصر فى عصر البطالمة وروما بمراحل مختلفة :\nالمرحلة األولى « : عالقات ودية وتجارية »\nبدأت العاللات بين البطالمة والرومان منذ عهد بطلميوس الثانى وكانت عاللات ودية تجارية ، دلل؟\nحيث زودت مصر روما بالممح ولت أزمتها .\nالمرحلة الثانية « : تدخل وفرض الحماية »\nمع مرور الولت ، أصبحت روما تنظر إلى مصر كمصدر التصادي مهم ما النتائج؟ فبدأت تتدخل في\nشبون مصر الداخلية وفرضت حمايتها على البطالمة .\n بم تفسر : تدخل روما في شئون مصر الداخلية وفرضت حمايتها على البطالمة؟\nألن مصر كانت تمثل مصدر التصادي مهم لروما .\nالمرحلة الثالثة « : التدخل بالقوة العسكرية »\nأخذت العاللات شكالي جديديا وهو التدخل بالموة العسكرية عندما سيطرت روما على مصر عام ٖٓ ق . م\nعمب معركة أكتيوم البحرية وأصبحت مصروالية رومانية .\n ما النتائج : معركة أكتيوم البحرية ٖٔق . م؟\nٔ) هزيمة البطالمة .\nٕ) سموط دولة البطالمة في مصر .\nٖ) أصبحت مصروالية رومانية ."],[147,"التدريب األول\nسٔ : اكتب كلمة ( صواب) أوكلمة (خطأ ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٔ) تحول نظام الحكم فى روما من النظام الجمهورى إلى النظام الملكي الذي اعتمد على مبدأ توزيع\nالسلطة .\n(ٖ) كانت بداية العاللات بين البطالمة والرومان ودية تجارية .\n(ٗ) يُعد معبد السرابيوم بروما دليل على دمج الرومان بين الطرازين المصرى واليوناني ( .\nسٕ : بم تفسر ... ؟\n(ٔ) أهمية مولع روما .\n(ٕ) عُرف البحر المتوسط فى بعض الفترات التاريخية بالبحيرة الرومانية .\n(ٖ) استيراد روما للممح من مصر .\nسٖ : ما النتائج التي ترتبت على : معركة أكتيوم البحرية ؟\nسٗ : دلل على صحة كل عبارة من العبارات اآلتية :\n(ٔ) تنوعت الصناعة فى اإلمبراطورية الرومانية المديمة .\n(ٕ) اهتمام الدولة الرومانية لدي ًما بالحياة الفكرية والعلمية\n(ٖ) تؤثر الفن الجنابزى للرومان لدي ًما بالفن المصرى .\nس٘ : وضح : مالمح النظام الجديد الذى وضعه أوكتافيوس لإلمبراطورية الرومانية .\nٔ - اإلمبراطور أوكتافيوس «أغسطس» :\nأدرك أوكتافيوس أهمية موقع مصر باعتبارها أهم واليات اإلمبراطورية الرومانية ، دلل؟\nحيث :\nٔ) حرص على إبماء مصر : تحت سيطرته المباشرة .\nٕ) نشر لوات رومانية بمصر بم تفسر؟ لمنع أى تمرد ضد الحكم الروماني .\nٖ) حرص على أن تكون لمصر عملة محلية خاصة بها ."],[148,"ٕ - اإلمبراطور تراجان :\n بم تفسر : تعرض مصر فى عهده لمجاعة؟ نتيجة انخفاض منسوب النيل .\n ما النتائج : تعرض مصر فى عهده لمجاعة؟ فؤعاد إلى مصر بعض الممح الذي كان\nمخزنا ً في روما .\n قام بإعادة حفر قناة سيزوستريس التي كانت تربط بين نهر النيل والبحر األحمر\nوسميت بـ «قناة تراجان » .\nٖ - اإلمبراطور دقلديانوس :\n تولى الحكم بعد فترة فوضى وأزمات عسكرية والتصادية .\n لام بإصالحات كبيرة فى الجيش واإلدارة والضرابب .\n اضطهد المسيحيين بشدة فى أواخر حكمه دلل؟ حيث أصدر مرسوما يمضى بـ :\n- حرق الكتب الممدسة .\n- هدم الكنابس .\n- إعدام كل من يتبع المسيحية .\n وعرفت هذه الفترة باسم «عصر الشهداء » وقد اتخذت الكنيسة فى مصر من\nعام ٗ ٕٛ م بداية للتقويم القبطى لتخليد تاريخ شهدائهم .\n بم تفسر : تسمية عهد اإلمبراطور دقلديانوس بعصر الشهداء ؟\nألنه قام باضطهاد المسيحيين بشدة في أواخر حكمه حيث :\nأصدر مرسوما ً بحرق الكتب الممدسة وهدم الكنابس . - إعدام كل من يتبع المسيحية .\nٗ - اإلمبراطور قسطنطين األول :\nأول إمبراطور روماني يعتنق المسيحية ويعترف بها رسمييا .\nقام بـ :\n إصدار مرسوم ميالن عام ۳۱۳ م ماالنتائج؟ والذى منح الحرية الدينية للمسيحيين بعد لرون\nمن االضطهاد .\n إنشاء مدينة « المسطنطينية » (إسطنبول حالييا ) عام ٖٖٓ م ، وجعلها عاصمة جديدة\nلإلمبراطورية إلى جانب العاصمة المديمة روما ."],[149,"دخول المسيحية مصر\n دخلت المسيحية مصر فى منتصف المرن األول الميالدى على\nيد المديس مرلس الذى نشر تعاليم المسيحية باإلسكندرية .\n ألبل المصريون على اعتناق المسيحية بم تفسر ؟\nلمبادبها السمحة وألنهم وجدوا فيها خالصا من ظلم الرومان .\n تعرض المسيحيون األوابل لالضطهاد من الرومان بم تفسر ؟\nبسبب تمسكهم بعميدتهم .\nأسس القديس مرقس :\n- أول كنيسة باإلسكندرية .\nمدرسة اإلسكندرية الالهوتية «الدينية» . الرهبنة وظهور األديرة في مصر\n نشؤت الرهبنة فى مصر منذ المرن الثالث الميالدى على يد المديس أنطونيوس الذى اتجه إلى\nالصحراء الشرلية ليعيش حياة تعتمد على الزهد والعبادة .\n ظهرت األديرة وانتشرت الرهبنة من مصر إلى كل دول العالم .\n أصبحت األديرة مراكز روحية وثقافية دلل؟\nحيث ساهمت فى نشر التعاليم المسيحية ، والرهبنة في أوروبا مما جعلها جز ًءا أساسييا من التراث\nالمسيحى العالمي .\nما المقصود بـ الرهبنة ؟ أسلوب حياة يقوم على ترك متاع الدنيا والعيش في أماكن\nمنعزلة ، بهدف الزهد والتقشف ، وقضاء الوقت في الصالة والتأمل والتقرب من اهلل .\nالرهبنة نوعان :\nرهبنة فردية : ويُعد األنبا أنطونيوس أول من مارسها .\nرهبنة جماعية : أى مجموعة من الرهبان يعيشون فى مكان واحد (دير) يحاط بسور لكل\nمنهم صومعة للمكان الذي يتعبد فيه ، ويُعد األنبا باخوم أول من أسس هذا النوع من الرهبنة ."],[150,"بعض المالمح الحضارية للحقبة القبطية في مصر\nاللغة القبطية :\nظهورها : بعد انتشار المسيحية استخدم المصريون« اللؽة المبطية » .\nشكلها : كتبت بحروف يونانية مع إضافة رموز مستمدة من الخط الديموطيمى .\nاستخدامها : ولد استخدموها في الكتابات الدينية .\nالفن القبطى المصرى :\n تؤثر الفن المبطى بالفن المصرى واليوناني المديم .\n لكنه أصبح أكثر ارتباطا ً بالمسيحية بعد أن أصبحت دينا رسمييا .\n من أبرز أنواع الفن القبطى :\nٔ - الفن الشعبى :\nركز على تصوير الطبيعة ومشاهد من الحياة اليومية دلل؟ حيث ظهر فى المنسوجات والرسوم التي\nتصور الفالحين وهم يمطفون العنب .\nٕ - الفن الديني :\nظهر فى األديرة والكنابس ، وركز على تصوير مشاهد دينية من الكتاب الممدس ، مثل : صور\nالمديسين والشهداء ، كما ظهر في الزخارف الخشبية والمنسوجات والجداريات .\nالتدريب الثاني\nسٔ : اكتب ما تشير إليه كل عبارة من العبارات اآلتية :\nاستخدامها في الكتابات الدينية .\n(ٕ) من أنواع الفن المبطى الذى ركز على تصوير الطبيعة ومشاهد من الحياة اليومية .\n(ٖ) من أنواع الفن المبطى الذى ركز على تصوير مشاهد دينية من الكتاب الممدس .\nسٖ : بم تفسر ... ؟\n(ٔ) تسمية عهد اإلمبراطور دللديانوس بعصر الشهداء .\n(ٕ) إلبال المصريين على اعتناق المسيحية في عصر الرومان .\n(ٖ) لألديرة بمصر أهمية كبيرة ."],[151,"سٔ : أكمل العبارات اآلتية بكلمات مناسبة :\n(ٔ) بعد سيطرة روما على مصر أصبح البحر المتوسط يُعرف بـ . .........\n(ٕ) ظهر النظام الجمهورى بروما معتمديا على مبدأ . ......... .\n(ٖ) من أهم المحاصيل التي كانت تزرعها روما . ............... و .................\n(ٗ) تم إنشاء أول كنيسة باإلسكندرية على يد المديس . ......... .\nسٕ : اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) بدأ نظام الحكم في روما بالنظام ( . ........... الملكي - الجمهوري - اإلمبراطوري - الديممراطي )\n(ٕ) بدأ العصر اإلمبراطوري للدولة الرومانية فى عهد اإلمبراطور .. ......... .\n(تراجان - دللديانوس - لسطنطين اأ مبراطور دللديانوس باسم عصر . .......\nسٗ : ما المقصود بكل مما يلي ... ؟\nٕ - الرهبنة .\nٔ - الديممراطية .\nس٘ : بم تفسر ..... ؟\nٔ - ضعف المدن اليونانية .\nٕ - ترحيب المصريين باإلسكندر األكبر ..\nٖ - نشر أوكتافيوس لوات رومانية في مصر ..\nٗ - تسمية أواخر عهد اإلمبراطور دللديانوس بعصر الشهداء .\nه - إصدار اإلمبراطور لسطنطين األول مرسوم ميالن .\nالسؤال السادس : ما النتائج المترتبة على ... ؟\nٕ - الصراعات بين المدن اليونانية المديمة .\nٖ - تؤسيس اإلسكندر األكبر مدنا على الطراز اليوناني .\nٗ - وفاة اإلسكندر األكبر بدون وجود وريث اإلمبراطوريته .\nه - المجاعة التي تعرضت لها مصر في عهد اإلمبراطور تراجان .\nالسؤال السابع : دلل على كل عبارة مما يلي :\nٔ - كانت بالد اليونان بمثابة البوابة الشرلية ألوروبا .\nٕ - شهدت الحياة السياسية في بالد اليونان أنظمة متعددة للحكم ..\nٖ - كان هنان تواصل حضاري بين مصر وبالد اليونان المديم ."]],[[1,"........................................................................................"],[2,"الوحدة األولى\nالمالمح الطبيعية والحضارية لقارات العالم الجديد\nالدرس األول\nموقع ومظاهر سطح قارات العالم الجديد\nالدرس الثاني\nالحضارات القديمة في األمريكتين\nالدرس الثالث\nالكشوف الجغرافية لقارات العالم الجديد\nتدريبات عامة على الوحدة\nالوحدة الثانية\nمصر في عصر ممحمد علي وخلفائه\nالدرس األول\nتولية محمد علي حكم مصر\nالدرس الثاني\nمحمد علي وبناء الدولة الحديثةفي مصر\nالدرس الثالث\nمصر في عصر خلفاء محمد علي\nتدريبات عامة على الوحدة\nالوحدة الثالثة\nالنظم البيئية في قارات العالم الجديد\nالدرس األول\nنظم الغابات والحشائش في قارات العالم الجديد\nالدرس الثاني\nالنظم البيئية والصحراوية في قارات العالم الجديد\nالدرس الثالث\nالتغير المناخي وتأثيره على النظم البيئية\nتدريبات عامة على الوحدة\nالوحدة الرابعة\nالحركة الوطنية في مواجهة االحتالل البريطاني\nالدرس األول\nالثورة العرابية وبداية االحتالل البريطاني لمصر\nالدرس الثاني\nكفاح الحركة الوطنية وبناء الوعي الوطني\nتدريبات عامة على الوحدة"],[4," تمهيد\nتضم قارات العالم الجديد :\n- قارة أمريكا الشمالية .\n- قارة أمريكا الجنوبية .\n- القارة القطبية الجنوبية ( أنتاركتيكا) .\n- قارة أستراليا .\nتعلمنا فيما سبق أن :\n المولع (فلكى - جغرافى ) وتنوع مظاهر السطح من العوامل األساسية التي أثرت في خصابص\nالمارات المختلفة (نظم بيبية – أنشطة سكانية .)...\n هذا العام ، سيتم دراسة األمريكتين وأستراليا بم تفسر؟ ألنها لارات مؤهولة بالسكان ولن يتم دراسة\nالمارة المطبية الجنوبية ألنها متجمدة غير مؤهولة بالسكان .\nولذلك سنتعرف موقع ومظاهر سطح قارات العالم الجديد بشيء من التفصيل -:"],[5,"أوالي : مشاحة قارات العامل اجلديد\nقارة أمريكا الشمالية\n ثالث لارات العالم مساحة بعد\nلارتي آسيا وإفريميا .\n رابع لارات العالم مساحة .\nقارة أمريكا الجنوبية\n خامس لارات العالم مساحة .\nالقارة القطبية\nالجنوبية (أنتاركتيكا)  تمع ألصى جنوب الكرة األرضية .\nقارة أستراليا\n سابع (أصغر) لارات العالم\nمساحة .\nثاىي ًا : املوقع الفلكي واجلغرايف لكارات العامل اجلديد\n*الموقع الفلكي :\n تمتد بين :\n•دائرتي عرض ۷ ٖٓ : و ٖ ۸ شمال ا ،\nوبذلن تمع في النصف الشمالي للكرة األرضية .\nوبذلن تمع في النصف الغربي للكرة األرضية .\n يمر بها : دائرتين عرض رئيسيتين هما :\nالدابرة المطبية الشمالية ( في الشمال) .\nمدار السرطان (في الجنوب ) .\n*الموقع الجغرافي :\nيحدها :\nشماالي : المحيط القطبي الشمالى .\nشرقاً : المحيط األطلنطى .\nجنوب وجنوب شرق - : البحر الكاريبي .\nأمريكا الجنوبية . غرباً : المحيط الهادي ."],[6,"*الموقع الفلكي :\n تمتد بين :\nوبذلن يمع معظمها في النصف الجنوبي\nللكرة األرضية .\nخطي طول ۹ٖ٘ : و ٔ ۸ غرباا ،\nوبذلن تمع في النصف الغربي للكرة األرضية .\n يمر بها : دائرتين عرض رئيسيتين هما :\nدابرة الستواء (في الشمال) .\nمدار الجدى (في الوسط) .\n*الموقع الجغرافي : يحدها :\nشماالي - : أمريكا الشمالية .\nالبحر الكاريبي . شرقاً : المحيط األطلنطي .\nغربيا : المحيط الهادي .\nمما سبق نجد أن :\nهناك تشابه بين موقع قارتى أمريكا الشمالية وأمريكا الجنوبية دلل؟ حيث :\nيتشابهان فى الحدود الشرلية والغربية حيث يحدهما من :\n الشرق : المحيط األطلنطي الذي يفصلهما عن لارتى أوروبا وإفريميا .\n الغرب : المحيط الهادى الذى يفصلهما عن لارتي آسيا و أستراليا .\n تمعان في النصف الغربي من الكرة األرضية ."],[7,"*الموقع الفلكي :\n تمتد بين :\nدابرتي عرض ٔٓ : و ٗٗ جنوباا وبذلن تمع في النصف الجنوبي للكرة األرضية .\nأى أن قارة أستراليا تقع في النصف الجنوبي والشرقي من الكرة األرضية .\n يمر بها : دائرة عرض رئيسية هي :\nمدار الجدى (في الوسط) .\n*الموقع الجغرافي : تظهرقارة أستراليا على شكل جزيرة كبيرة دلل ؟\nحيث يحيط بها المياه من جميع الجهات ، فيحدها :\nشماالي : بحر آرافورا .\n- بحر تيمور .\nشرقاً : المحيط الهادي .\nجنوبيا : المحيط الهندي .\nغرباً : المحيط الهندي ."],[8,"ثالج ًا : أينية املوقع الفلكي واجلغرايف لكارات العامل اجلديد\n-1 األهمية االستراتيجية :\n بم تفسر : لموقع قارات العالم الجديد أهمية استراتيجية ؟\nبسبب : تيسير (تسهيل)التجارة العالمية عن طريك لناة بنما .\n*قناة بنما :\n تُعد بنما من أهم الممرات المائية فى العالم بم تفسر؟\nألنها : تربط بين المحيطين األطلنطى والهادي ؛ مما ساعد على اختصار آلف الكيلومترات التي\nكانت تمطعها السفن .\n حفرت الوليات المتحدة لناة مابية في دولة بنما في جنوب لارة أمريكا الشمالية ،\n أهميتها : وأدى حفرهـا إلى اختصار المسافة التي تبحرها السفن بين الساحلين الشرلى والغربى\nللوليات المتحدة ، والتي كانت ستضطر إلى اللتفاف حول لارة أمريكا الجنوبية .\n تُعد لناة بنما مع لناة السويس أهم ممرين مابيين اصطناعيين استراتيجيين في العالم .\n-2 األهمية االقتصادية :\n بم تفسر : لموقع قارات العالم الجديد أهمية اقتصادية ؟\nبسبب :\nٔ) المولع الفلكي لألمريكتين ما النتائج؟ الذي أدى إلى تنوع النظم البيبية بهما .\nٕ) امتالن األمريكتين (الشمالية والجنوبية) :\n• كميات كبيرة من مصادر الطالة األحفورية .\n• مساحات كبيرة من األراضى الزراعية .\nٖ) امتالن لارات العالم الجديد احتياطيات كبيرة من بعض المعادن مثل :\nاليورانيوم والحديد في أستراليا .\n دلل : تمتلك قارة أستراليا احتياطات كبيرة من بعض المعادن؟\nحيث : تمتلن أستراليا كميات من اليورانيوم والحديد ."],[9,"-3 األهمية الحضارية :\n دلل : لموقع قارات العالم الجديد أهمية حضارية ؟\nحيث :\nا\nمركزا للتماء الثمافات األوروبية\nٔ) تعد لارات العالم الجديد\nواإلفريمية واآلسيوية ؛بم تفسر؟ نتيجة لكثرة الهجرات إليها .\nٕ) ظهرت عديد من الحضارات المديمة فى لارات العالم الجديد ،\nمثل :\nحضارة المايا . - حضارة اإلنكا .\nفي األمريكتين .\nالتدريب األول\nس :1 اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) تعد لارة أمريكا الشمالية أصغر مساحةا من لارة . .........\n(أفريميا - أستراليا - أمريكا الجنوبية – أنتاركتيكا)\n(ٕ) يفصل األمريكتين عن لارتي آسيا وأستراليا المحيط . ......... .\n( المطبي الشمالي - الهندى - األطلنطى - الهادي )\n(ٖ) تمع لارة أمريكا الجنوبية بؤكملها في نصف الكرة األرضية . ..........\n( الشمالي - الشرلي - الجنوبي - الغربي )\nس :2 اكتب كلمة (صواب ) أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٔ) تربط لناة بنما بين المحيط األطلنطى والمحيط الهندي .\n(ٕ) تمع لارة أنتاركتيكا في الركن الجنوبي الشرق من الكرة األرضية بينما تمع لارة أستراليا في ألصى\nجنوبها .\n(ٖ) من الحضارات المديمة التى ظهرت فى لارات العالم الجديد حضارة المايا .\nس :3 بم تفسر ... ؟\n(ٔ) تعد لارات العالم الجديد مركزا ا للتماء عديد مـن الثمافات .\n(ٕ) األهمية الستراتيجية لمولع لارات العالم الجديد .\nس :4 ما النتائج المترتبة على : المولع الفلكي لألمريكتين (بالنسبة لألهمية اللتصادية ) ؟\nس :5 دلل على صحة العبارة اآلتية : تمتلن لارة أستراليا احتياطات كبيرة من بعض المعادن؟\nس :6 حدد أوجه التشابه بين كل من : لارتى أمريكا الشمالية وأمريكا الجنوبية من حيث المولع\nالجغرافي ."],[10,"رابعاً : مظاير سطح قارات العامل اجلديد\n* تتنوع مظاهر السطح بقارة أمريكا الشمالية ، وتشمل :\n-1 الجبال : أهمها :\n جبال األبالش : تمع شرق المارة .\n سالسل جبال روكي : تمع غرب المارة .\n يشتهر كالهما بـ :\nغناهما بالمعادن .\nأنهما مركزان للسياحة .\n-2 الهضاب : بها عدة هضاب أهمها :\n هضبة المكسيك : جنوب القارة .\n هضبة لبرادور :\nموقعها : تمتد شمال شرق القارة .\nخصائصها :\nتجرى بها أنهار صغيرة كثيرة الشاللت ما النتائج؟\nمما ترتب عليه استخدامها في توليد الطالة الكهرومابية .\n-3 السهول :\n*السهول الفيضية : تشغل مساحة كبيرة من المارة ، ومن أهمها :\nالسهول الوسطى : موقعها : تمتد بين جبال األبالش شرلاا وجبال روكى غرباا .\nخصائصها :\nيجرى بها نهر المسيسبي وروافده الذي يُعد من أطول أنهار المارة ويصب في خليج المكسين ."],[11,"*السهول الساحلية :\nوجه المقارنة\nسهول المحيط الهادي\nسهول المحيط األطلنطى\nموقعها :\nتمتد على طول السواحل الغربية للمارة .\nتمتد على طول السواحل الشرلية للمارة .\nتتسم بـ :\nخصائصها : تتسم معظم أجزابها بالضيك بم تفسر؟\nأنها أكثر اتساعاا .\nبسبب : التراب سالسل الجبال الغربية من\nكثرة الخلجان بها ما النتائج؟ التي\nالساحل .\nساعدت على إنشاء الكثير من الموانا\nالطبيعية .\n-4 الجزر :\nتنتشر كثير من الجزر فى لارة أمريكا الشمالية ، مثل :\n*جزيرة جرينالند أكبر جزر المارة مساحة .\nتتنوع مظاهر السطح فى قارة أمريكا الجنوبية ، وتشمل :\n-1 الجبال : أهمها :\n*سالسل جبال اإلنديز :\n موقعها : تمتد في الجزء الغربي من المارة .\n خصائصها : تتميز بأنها :\nتعد مخزناا عالمياا للنحاس والمصدير .\n-2 الهضاب :\n هضبة جيانا : شمال المارة .\n هضبة بتاجونيا : جنوب المارة .\n هضبة البرازيل :\nموقعها : شرق المارة .\nخصائصها : تتميز بأنها :\n• أكبر هضاب المارة مساحة .\n• تعد المصدر الربيسى لعديد من الثروات المعدنية في البرازيل ."],[12,"-3 السهول :\nتتمثل في :\n*السهول الفيضية : تشغل مساحة كبيرة من المارة ، ومنها :\n سهول البمباس : وتجري بها أنهار( باراجوای و بارانا ولبالتا) .\n سهول األمازون :\nخصائصها : تتميزبأنها :\nٔ) من أوسع السهول الفيضية في العالم .\nٕ) يجرى بها نهر األمازون الذي ينبع من جبال اإلنديز غرباا ، ويصب في المحيط األطلنطى شرلاا .\nٖ) تكثر بها المستنمعات والبرن مما يإدي إلى صعوبة استغاللها وللة أهميتها .\nٗ) تغطيها مساحات كبيرة من الغابات المدارية المطيرة .\n*السهول الساحلية :\nوجه المقارنة\nسهول المحيط الهادي\nسهول المحيط األطلنطى\nموقعها :\nتمتد على طول السواحل الغربية للمارة .\nتمتد على طول السواحل الشرلية للمارة .\nخصائصها :\nتتسم بؤنها شديدة الضيك بم تفسر؟\nتتسم بـ :\nاتساعها وانبساطها .\nبسبب : التراب سالسل جبال اإلنديز من\nساحل المحيط الهادى .\nانتشار المستنمعات بها .\nكثرة الموانا الطبيعية بها .\n-4 الجزر : تنتشر كثير من الجزر فى لارة أمريكا الجنوبية ، مثل - : جزر فوكالند في المحيط األطلنطي .\nتتعدد مظاهر السطح فى قارة أستراليا ، كما يلى :\n-1 الجبال : أهمها :\nالجبال يوجد في أستراليا عديد من السالسل الجبلية ، ومن أهمها :"],[13,"*جبال الحاجز الكبير :\nموقعها : تمتد شرق المارة .\nخصائصها • : تسمط عليها األمطار ما النتائج ؟ نتيجة لذلن :\n- تكسو الغابات مساحات كبيرة منها .\n- تنبع منها األنهار الكبرى بؤستراليا .\nتعد منطمة جذب سياحى لممارسة رياضة التزلج وتسلك الجبال . -2 الهضاب :\n*هضبة غرب أستراليا :\n• تشغل نحو ثلثي مساحة المارة\nلذلن يسودها المظهر الهضبي .\n• يغلب عليها الطابع الصحراوي .\n-3 السهول :\n*السهول الفيضية :\n• توجد بالقارة مساحات محدودة من السهول الفيضية بم تفسر ؟\nبسبب :\nللة األنهار الدابمة بالمارة ، فمعظم أنهارها موسمية الجريان .\n• أهم أنهار القارة : نهرى مري ودرالنج ويصبان معا ا في الخليج األسترالي الكبير .\n*السهول الساحلية :\n تمتد السهول الساحلية في شكل شريطي حول المارة .\n خصائصها : تتسم بؤنها ضيمة من ناحية الشرق بم تفسر ؟\nبسبب : التراب جبال الحاجز الكبير من ساحل المحيط الهادي .\n-4 الجزر :\n*تعد جزيرة تسمانيا من أشهر جزر قارة أستراليا بم تفسر ؟ ألنها تتميز بجمالها الطبيعي وتنوع\nتضاريسها ."],[14,"التدريب الثاني\nس :1 أكمل العبارات اآلتية بكلمات مناسبة :\n(ٔ) يجرى نهر المسيسبي وروافده بمارة . .......................\n(ٕ) تعد أكبر هضاب لارة أمريكا الجنوبية من حيث المساحة هضبة . .......................\n(ٖ) تغطى سهول األمازون مساحات كبيرة من الغابات . ....................... .\n(ٗ) يصب نهرى مرى ودار لنج فى . ....................... .\n(٘) من أشهر جزر لارة أستراليا وتتميز بتنوع تضاريسها جزيرة . ....................... .\nس :2 صوب ما تحته خط في العبارات اآلتية :\n(ٔ) تمع هضبة المكسين في شمال شرق لارة أمريكا الشمالية .\n(ٕ) تمتد السهول الوسطى بمارة أمريكا الشمالية من جبال اإلنديز شرلاا إلى جبال روكى غرباا .\n(ٖ) تنتشر كثير من الجزر فى لارة أمريكا الجنوبية منها جزيرة جرينالند فى المحيط األطلنطى .\n(ٗ) توجد فى لارة أمريكا الجنوبية عديد من السالسل الجبلية من أهمها جبال الحاجز الكبير .\nس :3 بم تفسر ... ؟\n(ٔ) سهولة إنشاء الموانا الطبيعية بالسواحل الشرلية لمارة أمريكا الشمالية .\n(ٕ) صغر مساحات السهول الفيضية بمارة أستراليا .\nس :4 ما العالقة بين ... ؟\n(ٔ) هضبة لبرادور ، والطالة المتجددة .\n(ٕ) جبال اإلنديز واإلنتاج المعدنى .\nس :5 ما تقييمك لمصداقية العبارة اآلتية ، مع ذكر السبب في الحالتين :\nتتشابه السهول الساحلية المطلة على المحيط الهادى فى لارتى أمريكا الجنوبية وأستراليا ؟"],[15,"س :1 أمامك خريطة للعالم اكتب ما تدل عليه األرقام اآلتية :\nٔ) المحيط . ...................\nٕ) المحيط . ..................\nٖ) المحيط . ...................\nٗ) المحيط . .......... بية)\nٖ) تعد هضبة لبرادور من أهم هضاب لارة ..........\n( أمريكا الشمالية - أمريكا الجنوبية – أستراليا – أنتاركتيكا )\nٗ) يجرى بالسهول الوسطى فى لارة أمريكا الشمالية نهر ...........\n( األمازون - مرى - دارلنج - المسيسبي )\n٘) تتسم السهول الساحلية الشرلية لمارتي أمريكا الشمالية وأمريكا الجنوبية بالسمات اآلتية ويخرج\nعنها . ........\n(كثرة الموانا الطبيعية - انتشار المستنمعات - اتساعها ممارنة بالسواحل الغربية - امتداد الجبال على\nطول سواحلها )\n( )ٙ تمتد جبال اإلنديز بمارة أمريكا الجنوبية في جهتها ..........\n( الشمالية - الشرلية - الجنوبية - الغربية )\n( )۷ المظهر التضاريسي الذي يشغل نحو ثلثى مساحة لارة أستراليا هو . ........\n( جبال الحاجز الكبير - هضبة غرب أستراليا - السهول الفيضية - السهول الساحلية )\n( ي )۸ صب نهرا مرى ودار لنج بمارة أستراليا في . ........\n( المحيط الهادى - بحر المرجان - بحر آرافورا - الخليج األسترالي الكبير )\n( األطلنطى - الهادى – الهندى – المطبي الشمالي )\n(ٓٔ) تحتل لارة أمريكا الشمالية المرتبة الثالثة عالميا من حيث المساحة بعد لارتى .............\n( آسيا وأمريكا الجنوبية - إفريميا وأوروبا - آسيا وإفريميا - أوروبا وأستراليا )\n( أمريكا الشمالية - أمريكا الجنوبية - أستراليا - أنتاركتيكا ) .\n(ٕٔ) إحدى لارات العالم الجديد وتمع في النصف الغربي من الكرة األرضية هي لارة .....\n( أمريكا الشمالية - أوروبا - أنتاركتيكا - أستراليا )\n(ٖٔ) يحد لارتى أمريكا الشمالية وأمريكا الجنوبية من جهة الغرب ...........\n( المحيط الهادى - المحيط األطلنطى - البحر الكاريبي - المحيط المطبي الشمالي )\n(ٗٔ) يفصل المحيط األطلنطى لارتى أمريكا الشمالية وأمريكا الجنوبية عن لارتي ...........\n( أوروبا وآسيا - أستراليا وآسيا - أوروبا وإفريميا - إفريميا وأستراليا )\n(٘ٔ) يحد لارة أستراليا من الجنوب والغرب ...........\n( بحر تيمور - المحيط الهادى - المحيط الهندي - بحر آرافورا )"],[18,"( تنوع نظمها البيبية - امتالكها الطالة األحفورية - احتواء أراضيها على المعادن - وجود لناة بنما )\nس :3 اكتب كلمة ( صواب ) أوكلمة (خطأ) ، مع التصويب :\n(ٔ) يعد المولع الجغرافي وتنوع مظاهر السطح من العوامل األساسية التي أثرت في خصابص\nلارات العالم الجديد\n(ٕ) تعد لارة أمريكا الشمالية أكبر لارات العالم الجديد من حيث المساحة .\n(ٕ) تعد لارة أمريكا الجنوبية رابع لارات العالم من حيث المساحة .\n(ٔ) تمع لارة أمريكا الجنوبية فى النصف الشرق من الكرة األرضية .\n(٘) تمع جميع أراضى لارة أمريكا الجنوبية فى النصف الشمالي من الكرة األرضية .\n(ٔ) يعد البحر الكاريبي حدا مشتركا بين األمريكتين .\n( ي )۷ حد لارة أستراليا من الشمال المحيط الهندي .\n( )۸ تمتلن األمريكتين مساحات كبيرة من األراضى الزراعية\n(ٔ) توجد كميات لليلة من مصادر الطالة األحفورية في األمريكتين .\n(ٓٔ) ظهرت عديد من الحضارات المديمة في لارات العالم الجديد .\nالشمالية\nٕٔ) توجد هضبة لبرادور جنوب لارة أمريكا الشمالية .\nٖٔ) تستخدم هضبة لبرادور بطريمة غير مباشرة فى توليد الطالة المتجددة .\nٗٔ) يصب نهر المسيسبي في خليج المكسين .\n٘ٔ) تتسم السهول الساحلية الشرلية لألمريكتين بالضيك\n)ٔ۷ تتسم مظاهر السطح بمارة أمريكا الجنوبية بتنوعها\n)ٔ۸ تمتد هضبة البرازيل فى شرق لارة أمريكا الشمالية\nي )ٔ۹ صب نهر األمازون في المحيط الهادي\nٕٓ) تكسو الغابات مساحات كبيرة من جبال الحاجز الكبير بمارة أستراليا\nٕٔ) تكثر األنهار دابمة الجريان في لارة أستراليا\nٕٕ) تمتد السهول الساحلية فى شكل شريطى حول لارة أستراليا .\nٖٕ) تتميز جزيرة تسمانيا بجمالها الطبيعى وتنوع تضاريسها ."],[19,"س :4 اكتب ما تشير إليه كل عبارة مما يأتي :\nٔ) هضبة تمتد فى شمال شرق لارة أمريكا الشمالية وتجرى بها أنهار صغيرة وكثيرة الشاللت .\nٕ) سهول فيضية تمتد بين جبال األبالش شرلاا وجبال روكى غربا .\nٖ) أكبر جزر لارة أمريكا الشمالية مساحة .\n٘) أكبر هضاب أمريكا الجنوبية مساحة وتعد المصدر الربيسى لعديد من الثروات المعدنية .\n)ٙ ظاهرة تضاريسية بمارة أمريكا الجنوبية تغطى الغابات المدارية المطيرة مساحات كبيرة منها .\n)۷ إحدى لارات العالم الجديد وتتسم معظم أنهارها بؤنها موسمية الجريان .\n)۸ إحدى لارات العالم الجديد وتمع ألصى جنوب الكرة األرضية .\n)۹ لارة تمع فى الركن الجنوبي الشرق من الكرة األرضية وتعد جزيرة كبيرة .\nٓٔ) ممر مالحى ساعد على اختصار المسافات التي تمطعها السفن بين المحيطين األطلنطى والهادى .\nس :5 بم تفسر ... ؟\nٔ) تعد لناة بنما من أهم الممرات المابية بالعالم .\nٕ) تنوع النظم البيبية باألمريكتين .\nٖ) األهمية الحضارية لمولع لارات العالم الجديد .\nٗ) تمتلن جبال األبالش وجبال روكى أهمية التصادية .\n٘) لهضبة لبرادور بؤمريكا الشمالية أهمية التصادية\n)ٙ ضيك السهول الساحلية للمحيط الهادى باألمريكتين .\n)۷ تنبع األنهار الكبرى بمارة أستراليا من جبال الحاجز الكبير .\n)۸ للة السهول الفيضية فى لارة أستراليا .\n)۹ شهرة جزيرة تسمانيا .\nس :6 ما النتائج المترتبة على ... ؟\nٔ) المولع الفلكي لمارة أستراليا (بالنسبة لخريطة العالم) .\nٕ) المولع الفلكي لألمريكتين ( بالنسبة لألهمية اللتصادية) .\nٖ) كثرة الهجرات المارات العالم الجديد .\nٗ) كثرة الشاللت على هضبة لبرادور .\n٘) كثرة الخلجان على طول السواحل الشرلية لمارة أمريكا الشمالية .\n)ٙ سموط األمطار على جبال الحاجز الكبير بؤستراليا .\n)۷ التراب جبال الحاجز الكبير من ساحل المحيط الهادى ."],[20,"س :7 دلل على صحة كل عبارة من العبارات اآلتية :\nٔ) تتشابه لارتا أمريكا الشمالية وأمريكا الجنوبية في بعض الحدود .\nٕ) تعد لارة أستراليا جزيرة كبيرة .\nٖ) لمولع لارة أمريكا الشمالية أهمية استراتيجية .\nٗ) لمولع لارات العالم الجديد أهمية التصادية .\n٘) ظهرت فى األمريكتين بعض الحضارات المديمة .\n)ٙ اتساع السهول الوسطى في لارة أمريكا الشمالية .\n)۷ تتعدد خصابص سهول األمازون\n)۸ تتشابه السهول الساحلية للمحيط الهادى باألمريكتين .\n)۹ لجبال وهضاب لارة أمريكا الجنوبية أهمية التصادية\nٓٔ) تتميز لارات العالم الجديد بكثرة الجزر .\nس :9 ما العالقة بين ... ؟\nٔ) لناة بنما ، والتجارة بمارات العالم الجديد\nٕ) المولع الفلكي لألمريكتين ، وأهميتهما اللتصادية .\nٖ) الجبال الشرلية بمارة أمريكا الشمالية ، واألنشطة اللتصادية فيها .\nٗ) هضبة لبرادور في لارة أمريكا الشمالية ، والطالة الكهرومابية بها .\n٘) جبال الحاجز الكبير ، وأنهار لارة أستراليا .\nس :10 ماذا يحدث إذا ... ؟\nٔ) لم تضم هضبة لبرادور أنهار صغيرة\nٕ) التربت الجبال بصورة كبيرة من ساحل المحيط األطلنطى بمارة أمريكا الشمالية .\nس :11 قارن بين :\n(ٔ) لارة أمريكا الشمالية ، ولارة أمريكا الجنوبية ، من حيث : أهم الهضاب .\n(ٕ) جبال األبالش ، وجبال اإلنديز من حيث : المولع .\n(ٖ) نهر األمازون ، ونهر المسيسبي ، من حيث :\nالمارة التي يجرى بها كل منهما ـ أهم الجزر التابعة لهما ـ األهمية اللتصادة ـ مصب كل منهما .\nس :12 عدد وجه الشبه بين :\nالسهول الساحلية الشرلية لمارة أستراليا والسهول الساحلية الغربية لألمريكتين ."],[21,"أسئلة الكتاب المدرسي\nالحظ خريطة قارتى أمريكا الشمالية والجنوبية ثم اكتب مدلول األرقام الموقعة عليها :\nٔ) جبال ....................\n(ٕ) هضبة ..................\n(ٖ) نهر ....................\n(ٗ) المحيط ..................\n(٘) جبال ....................\n( )ٙ هضبة ...................\n( )۷ خليج ...................\n( )۸ لناة ....................\n( )۹ المحيط ...................\nصوب ما تحته خط :\nٔ) تُعد لارة أستراليا ثالث لارات العالم من حيث المساحة .\nٕ) تمع هضبة المكسين فى شمال شرق أمريكا الشمالية .\nٖ) يصب نهر المسيسبي في المحيط الهادي .\nٗ) تمتد جبال اإلنديز على طول الساحل الشرلى لمارة أستراليا .\nما النتائج المترتبة على :\nالتراب سالسل الجبال الغربية من سواحل المحيط الهادى فى لارة أمريكا الشمالية ؟\nماذا يحدث إذا :\nلم تُحفر لناة بنما ؟\nبم تفسر ... ؟\nٔ - األهمية اللتصادية لهضبة البرازيل\nٕ - إنشاء الكثير من الموانا الطبيعية على السواحل الشرلية لمارة أمريكا الشمالية .\nدلل على صحة كل عبارة مما يلى :\nٔ ي - غلب المظهر الهضبي على سطح لارة أستراليا .\nٕ – تتميز جبال األبالش بؤهميتها اللتصادية الكبيرة ."],[22," نشأت عديد من الحضارات القديمة فى األمريكتين قبل وصول األوروبيين بعدة قرون في\nبيئات طبيعية متنوعة ما النتائج؟ مما ساعد على : تنوع أنشطتها االقتصادية وأساليب\nحياتها .\nأوالي : بعض حضارات األمريكتني\nنشأت في األمريكتين عدة حضارات ، منها :\n حضارة المايا .\n حضارة اإلنكا .\n نشأتها :\nنشؤت فى ألصى جنوب أمريكا الشمالية في اليابس الضيك الذي يصل بين األمريكتين ويفصل بين\nخليج المكسين والبحر الكاريبي من جهة الشرق ، والمحيط الهادي من جهة الغرب .\n أهم مالمح حضارة المايا :"],[23,"-1 الحياة السياسية :\n تكونت من :\nعدد من المدن المستملة ، وكانت تتحالف فيما بينها عند الحاجة .\n كان لكل مدينة :\nجيشها الخاص . ملن يجمع بين السلطتين السياسية والدينية ، وكان يُنظر إليه باعتباره ممثل اآللهة على األرض .  نظام الحكم :\nاعتمد على الوراثة .\nكان يساعد الملن مجلس مكون من - : النبالء .\n- الكهنة .\n- كبار المادة العسكريين .\n-2 الحياة االقتصادية :\n* الزراعة :\n اعتمدت حضارة المايا فى البداية على الزراعة المتنملة ثم الزراعة المستمرة\nما النتائج ؟ مما أدى إلى ظهور المرى .\n* التجارة :\n زاد اهتمام شعب المايا بالتجارة ، دلل؟ فؤنشبوا طرلاا وسط الغابات ولنوات\nمابية بم تفسر؟ لتسهيل حركة التبادل التجاري .\n* الصناعة :\n مارسوا الحرف اليدوية مثل : الفخار والنسيج .\n-3 الحياة الدينية :\n* تعدد اآللهة :\n دلل : اتسمت الحياة الدينية عند شعـب المايا بتعدد اآللهة ؟\nا\nفمثال كان لديهم :\nدروا محدداا في حياتهم اليومية ،\nحيث اعتمدوا أن لكل إله ا\nإله للشمس . إله للمطر . * أماكن الدفن :\n دلل : اختلفت طرق دفن الموتى عند شعب المايا ؟\nحيث :\nالملوك والكهنة :\nعامة الناس :\nعند وفاتهم كانوا يُدفنون في أهرامات مع مجوهراتهم وأدواتهم بم تفسر؟ لستخدامها في الحياة األخرى .\nعند وفاتهم كانوا يُدفنون تحت منازلهم مع ممتلكاتهم الشخصية ."],[24,"-4 الحياة الثقافية والعلمية :\n* الكتابة :\n استخدم شعب المايا الكتابة التصويرية التي تشبه\nالكتابة الهيروغليفية عند المصريين المدماء دلل؟ حيث :\n كانت تتكون من مجموعة من الرموز .\nدونون األحداث المهمة على جدران المعابد .\n كانوا يُ ّ\n* الفلك :\n تميزت حضارة المايا بالتقدم فى علم الفلك دلل؟ حيث :\nرصدوا حركة النجوم والكواكب . سموا السنة إلى ٘ ي ٖٙ و اما مثل المصريين .\nطوروا نظا اما دليماا للتمويم؛ فم َّ -5 العمارة والفنون :\n*العمارة :\n ازدهرت العمارة فى حضارة المايا دلل؟ حيث :\nٔ) شيدوا أهرامات ضخمة ، تشبه األهرامات المصرية ، لكنها ألل ضخامة ودلة ، وبنوا فولها المعابد .\nلصورا ضخمة يعيش فيها الملون والكهنة .\nٕ) شيدوا\nا\nٖ) شيدوا المراصد الفلكية بم تفسر؟ لرصد حركة النجوم والكواكب .\n*الفنون :\n ازدهرت الفنون في حضارة المايا دلل؟ حيث :\nاهتموا بالزخرفة بالنموش . ازدهر عندهم فن النحت فصنعوا منحوتات من الحجر والطين .  أشهر آثارهم :\n- هرم كوكولكان فى المكسيك (ما زال موجوديا حتى اليوم ) ."],[25,"التدريب األول\nس :1 اختر اإلجابة الصحيحة مما بين القوسين :\nٔ) اعتمد نظام الحكم في حضارة المايا على . ........\n(الديممراطية - الوراثة - النتخاب - الشورى )\nٕ) تشابهت الكتابة التصويرية لشعب المايا مع الكتابة ........ عند المصريين المدماء .\n( الهيراطيمية - الديموطيمية - المبطية - الهيروغليفية )\nٖ) لسم شعب المايا السنة إلى ٘ ي ٖٙ و اما نتيجة تمدمهم الملحوظ فى علم . .........\n(الهندسة - الفلن - الحساب - الكيمياء )\nٗ) شيَّد شعب المايا المعابد الخاصة بهم فوق . ........\n(المصور الملكية - جدران المراصد - األهرامات الضخمة - المنوات المابية )\nس :2 اكتب كلمة (صواب) أوكلمة (خطأ) ، مع التصويب :\nٔ) حظى ملن المايا بمكانة ممدسة لدى شعبه ؛ ألنه كان يجمع بين السلطتين السياسية والدينية (\nٕ) التصرت الحياة اللتصادية لحضارة المايا طوال تاريخها على الزراعة المتنملة فمط .\nٖ) اعتمد شعب المايا بفكرة الحياة األخرى البعث والخلود بعد الموت .\nس :3 بم تفسر ... ؟\nٔ) تزويد ممابر ملون حضارة المايا باألدوات والمجوهرات الخاصة .\nٕ) اهتمام شعب المايا بإنشاء طرق وسط الغابات ولنوات مابية .\nس :4 ما النتائج التي ترتبت على ... ؟\nنشؤة حضارات األمريكتين المديمة في بيبات طبيعية متنوعة . س :5 ما العالقة بين ... ؟\n- المظهر المعمارى لحضارة المايا والحضارة المصرية المديمة ."],[26," نشأتها : نشؤت فى غرب لارة أمريكا الجنوبية في المنطمة المطلة\nعلى المحيط الهادي وتُعد من أعرق الحضارات .\n مالمح حضارة اإلنكا :\n-1 الحياة السياسية :\n*نظام الحكم :\n كان وراثياا داخل األسرة الحاكمة .\n اتسمت حضارة اإلنكا بنظام حكم مركزى لوى ما النتائج ؟ نتج عن ذلك :\nجعلها ألوى اإلمبراطوريات في أمريكا الجنوبية . - الستمرار والتوسع .\n-2 الحياة االقتصادية :\n* الزراعة :\n امتلن شعب اإلنكا خبرة كبيرة فى مجال الزراعة ؛ ما النتائج؟ فنجحوا في إنتاج محاصيل متنوعة .\n بنوا مخازن لتخزين الحبوب ؛ بم تفسر؟ ضماناا لتوفير الغذاء في أولات الشدة .\n تغلبوا على طبيعة بالدهم الجبلية ؛ ما النتائج؟ فبرعوا في زراعة المدرجات .\n شموا المنوات بم تفسر؟ لجلب المياه من المناطك المرتفعة إلى األراضى الزراعية .\nجسورا معلمة مصنوعة من ألياف النباتات ؛ بم تفسر؟ لتسهيل التنمل .\n ألاموا\nا\n* تربية الحيوانات :\nاهتموا بتربية الحيوانات ، خاصةا حيوان الالما الذي استخدموه في النمل .\n* الصناعة :\n دلل : اهتم شعب اإلنكا بالصناعة ؟ حيث :\n أبدع شعب اإلنكا في صناعة األواني الفخارية والمعدنية خاصة (النحاسية والذهبية ) بم تفسر؟\nلتوافر الذهب لديهم بكثرة .\n برعوا في نسج المطن .\n* التجارة : اعتمدوا في المعامالت التجارية على نظام الممايضة ."],[27,"-3 الحياة الدينية :\n* تعدد اآللهة :\n اتسمت الحياة الدينية عند اإلنكا بتعدد اآللهة التي ارتبطت بالطبيعة .\n كان أهم اآللهة لديهم إله الشمس ، وكان حكام اإلنكا يعدون أنفسهم أبناءه ما النتائج؟\nمما منحهم مكانة ممدسة .\n* التحنيط :\n اشتهر شعب اإلنكا بحفظ أجساد موتاهم عن طريك «التحنيط» بم تفسر؟\nإيمانا ا منهم بالحياة بعد الموت؛ مثل المصريين المدماء .\n لكن التحنيط لديهم لم يبلغ درجة البراعة التي عُرف بها المصريون المدماء .\n-4 الحياة الثقافية والعلمية :\n* الكتابة :\n لم يعرف شعب اإلنكا الكتابة التمليدية بمفهومها المعروف .\n كانوا يتحدثون لغة الكيتشوا التى انتملت شفهيا ا من جيل إلى جيل ،\nول يزال ماليين األشخاص يتحدثونها حتى اليوم .\n* العلوم :\nالرياضيات :\nالفلك :\n- برع شعب اإلنكا فى علم الرياضيات ، دلل؟ حيث\nطور حضارتهم تمويما ا دليماا مثل المايا ، لكنهم\n- لم ت ُ ّ\nاستخدموا نظاما ا رياض ايا لتوثيك المعلومات يعرف عرفوا األولات المثلى للزراعة والطموس الدينية؛\nاعتماداا على مالحظة الشمس والممر والنجوم .\nبـ «الكيبو» .\nمعلومة إثرائية :\nالكيبو : وسيلة استخدمها شعب اإلنكا للتسجيل والعد قبل معرفتهم الكتابة ، وتتكون من\nمجموعة من الحبال الملونة المعقودة بطرق مختلفة حيث يدل عدد العقد على الرقم ، ويدل\nموضع العقدة على قيمة الرقم ."],[28,"-5 العمارة والفنون :\n برعت حضارة اإلنكا فى فن العمارة والهندسة دلل؟ حيث :\nولصورا مستخدمين ا\nكتال ضخمة من الحجارة التي نُحتت بدلة عالية .\nٔ) شيدوا معابد\nا\nٕ) ل تزال بعض المبانى موجودة حتى اليوم شاهدةا على تمدمهم الهندسي ، مثل :\nمدينة « ماتشو بيتشو» األثرية بدولة بيرو .\nٖ) اهتموا ببناء الجسور وشك الطرق وتسويتها بم تفسر؟ لتيسير التصال بين أجزاء إمبراطوريتهم .\nثانياً : أوجه الشبه بين الحضارات القديمة في األمريكتين والحضارة المصرية\nالقديمة :\nرغم المسافات الشاسعة بين الحضارة المصرية المديمة والحضارات المديمة التي نشؤت في األمريكتين\n(المايا ، واإلنكا) ، فإنه يوجد تشابه فى عديد من الجوانب بينهما ، وهو ما يعكس لدرة هذه الشعوب على\nالوصول إلى مستوى حضارى متمدم بوسابل متماربة رغم اختالف البيبات .\nويتضح ذلك فيما يلى : * العمارة الضخمة :\nبرعت جميعها في بناء منشآت ضخمة ، مثل األهرامات والمعابد .\n* الكتابة التصويرية :\nطورت نظم كتابة تعتمد على الرموز بم تفسر؟ لتسجيل تاريخها وعلومها كما حدث في المايا\nوالحضارة المصرية المديمة .\n* االهتمام بعلم الفلك :\nوضعت هذه الحضارات تماويم دليمة بم تفسر؟ لتنظيم حياتها الزراعية وإلامة احتفالتها الدينية .\n* المعتقدات الدينية :\n آمنت بتعدد اآللهة المرتبطة بالطبيعة وتمديس الشمس .\n اعتبرت الحاكم وسيطا ا بين السماء واألرض .\n آمنت بالبعث والخلود والهتمام بالتحنيط ؛ كما في الحضارة المصرية وحضارة اإلنكا ."],[29,"التدريب الثاني\nس :1 أكمل العبارات اآلتية بالكلمات المناسبة :\nٔ) اعتمد شعب اإلنكا فى تعامالتهم التجارية على نظام . ................\nٕ) لتجاوز طبيعة بالدهم الجبلية ، برع شعب اإلنكا في زراعة . ................ .\nٖ) نال حكام اإلنكا مكانة ممدسة باعتبارهم أبناء إله . ................ .\nٗ) تشابهت حضارة المايا مع الحضارة المصرية المديمة في العتماد على الكتابة . ................\nس :2 اكتب ما تشير إليه كل عبارة من العبارات اآلتية :\nٔ) لغة شعب اإلنكا التي انتملت شفهيا وما زال الماليين يتحدثونها اليوم .\nٕ) مدينة أثرية في بيرو تعد شاهداا على تمدم اإلنكا الهندسي والمعماري .\nٖ) معتمد ديني مشترن بين حضارة اإلنكا والحضارة المصرية دفعهم لحفظ أجساد الموتى .\nس :3 دلل على صحة العبارات اآلتية :\nٔ) استعد شعب اإلنكا جيداا ألولات الجفاف وللة الغذاء .\n...................................................................................................................\nٕ) تغلبت حضارة اإلنكا على وعورة بيبتها الجبلية لتسهيل الحركة .\n...................................................................................................................\nٖ) براعة حضارة اإلنكا في العمارة .\n...................................................................................................................\nٗ) تشابهت حضارة المصريين المدماء مع حضارات األمريكتين في علم الفلن .\n..................................................................................................................."],[30,"س :1 اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) نشؤت حضارة المايا بمارة أمريكا الشمالية في ألصى ( ...... الشمال – الجنوب – الشرق – الغرب)\n(ٕ) تميزت حضارة المايا بمولعها على عدة مسطحات مابية منها . ............\n(المحيط الهندى – خليج المكسين – بحر تيمور – خليج هدسن)\n(ٖ) ظهرت المرى فى حضارة المايا نتيجة لمعرفة شعبها ...........\n(الزراعة المتنملة – الزراعة المستمرة – التجارة الداخلية – الصناعة )\n(ٗ) كان الملون والكهنة فى حضارة المايا يدفنون في ...................\n(المنازل – المصور – المعابد – األهرامات )\n(٘) ليام شعب المايا بتطوير نظا اما دليماا للتمويم يدل على براعتهم في ...................\n( العمارة – التجارة – الفنون – الفلن )\n( )ٙ نشؤت حضارة اإلنكا بمارة أمريكا الجنوبية بجبهتها . .........\n(الشرلية – الغربية – الجنوبية – الشمالية )\n( )۷ المادة الخام التي اعتمد عليها شعب اإلنكا فى صناعة الجسور المعلمة هي ...................\n( المعادن – األخشاب – األحجار – ألياف النباتات )\n( )۸ المادة الخام التي تميزت حضارة اإلنكا بوفرتها واستخدموها في صناعة األوانى هي . .........\n(الحديد – النحاس – الذهب – الفضة )\n( ي )۹ عد نظام «الكيبو» ا\nدليال على براعة حضارة اإلنكا في ...................\n( الرياضيات – الفلن – العمارة – الفنون )\n(ٓٔ) جميع ما يلى من أوجه التشابه بين الحضارات المديمة فى األمريكتين والحضارة المصرية المديمة\nويخرج عن ذلن معرفة ( . ............ اإليمان بتعدد اآللهة – العتماد فى البعث والخلود – وجود حكومة\nمركزية موحدة – الهتمام بعلم الفلن )\nس :2 اكتب كلمة ( صواب ) أوكلمة (خطأ) ، مع التصويب :\n(ٔ) توافر الذهب بكثرة لدى شعب اإلنكا .\n(ٕ) أهمل شعب اإلنكا صناعه نسج المطن .\n(ٖ) تميزت حضارة اإلنكا بتعدد اآللهة المرتبطة بالطبيعة .\n(ٗ) كان اإلله األهم لدى حضارة اإلنكا إله المطر .\n(ه) اشتهرت حضارة اإلنكا بحفظ جثث الموتى عن طريك التحنيط .\n( )ٙ لم يعرف شعب اإلنكا الكتابة التمليدية بمفهومها المعروف .\n( ي )۷ تحدث ماليين األشخاص لغة الكيتشوا حتى اليوم ."],[31,"( )۸ نجحت حضارة اإلنكا فى تطوير تمويما دليماا مثل المايا .\n( )۹ اعتمدت حضارة اإلنكا فى معرفة أولات الزراعة والطموس الدينية على مالحظة الشمس\nوالممر والنجوم .\n(ٓٔ) اهتمت حضارة اإلنكا بتشييد المعابد والمصور مستخدمة حجارة ضخمة منحوتة بدلة عالية ( .\n(ٕٔ) كانت المدن المستملة فى حضارة المايا تتحالف فيما بينها عند الحاجة\n(ٖٔ) كان لكل لرية فى حضارة المايا جيشها الخاص بها .\n(ٗٔ) اعتمد نظام الحكم فى حضارة المايا على الوراثة .\n(٘ٔ) مارس شعب المايا الحرف اليدوية مثل الفخار والنسيج .\n( )ٔ۷ استخدم شعب المايا الكتابة التصويرية وكانوا يدونون األحداث المهمة على جدران المعابد (.\n( )ٔ۸ تميزت حضارة المايا بالتمدم فى علم الفلن فرصدوا حركة النجوم والكواكب .\n( )ٔ۹ أنشؤت حضارة المايا أهرامات ألل ضخامة ودلة من األهرامات المصرية .\n(ٕٔ) ازدهر فن النحت فى حضارة المايا فصنعوا منحوتات من الحجر والطين .\nس :3 أكمل العبارات اآلتية بكلمات مناسبة :\n(ٔ) نشؤت في األمريكتين عدة حضارات منها حضارة .................... و ...................\n(ٕ) تكونت حضارة المايا من عدد من ...................\n(ٖ) كان الملن فى حضارة المايا يجمع بين السلطتين .................. و ...................\n(ٗ) تؤلف المجلس الذى كان يساعد الملن فى حضارة المايا من كبار المادة العسكريين ...................\n(٘) اهتم شعب المايا بالتجارة فؤنشؤوا طرلاا وسط ................... ولنوات ...................\n( )ٙ اعتمد شعب المايا بتعدد اآللهة فكان لديهم إلـه ................... وإله ...................\n( )۷ تشابهت األهرامات في حضارة المايا مع ...................\n( )۸ عاش الملون والكهنة في حضارة المايا في ...................\n( )۹ كان الحكم فى حضارة اإلنكا ...................\n(ٓٔ) أنشؤ شعب اإلنكا الجسور المعلمة لتسهيل ...................\nس :4 اكتب ما تشير إليه كل عبارة من العبارات اآلتية :\n(ٔ) حيوان لام شعب اإلنكا بتربيته واستخدامه فى النمل .\n(ٕ) لغة كان يتحدثها شعب اإلنكا وانتملت شفهيا من جيل إلى جيل .\n(ٖ) مدينة أثرية شاهدة حتى اليوم على التمدم الهندسي لحضارة اإلنكا"],[32,"(ٗ) زراعة عرفها شعب المايا فى بداية حضارتهم .\n(٘) كتابة استخدمها شعب حضارة المايا وتشابهت مع الكتابة الهيروغليفية عند المصريين المدماء .\n( )ٙ من أشهر آثار حضارة المايا التي ما زالت موجودة حتى اليوم بدولة المكسين .\nس :5 بم تفسر ... ؟\n(ٔ) بناء شعب اإلنكا مخازن لتخزين الحبوب .\n(ٕ) ليام شعب اإلنكا بشك المنوات المابية .\n(ٖ) اهتمام شعب اإلنكا بحفظ أجساد موتاهم عن طريك التحنيط .\n(ٗ) وجود ماليين األشخاص يتحدثون لغة الكيتشو حتى اليوم .\n(٘) عرف شعب اإلنكا األولات المثلى للزراعة والطموس الدينية .\n( )ٙ اهتمام شعب اإلنكا ببناء الجسور وشك الطرق وتسويتها\n( )۷ ليام الحضارات المديمة فى األمريكتين والحضارة المصرية المديمة بوضع تماويم دليمة .\n( )۸ عدم وجود حكومة مركزية موحدة عند حضارة المايا .\n( )۹ أهمية الكتابة التصويرية فى حضارة المايا .\n(ٓٔ) إنشاء شعب المايا طرلاا وسط الغابات ولنوات مابية .\nس :6 ما النتائج التي ترتبت على ... ؟\n(ٔ) تميز حضارة اإلنكا بنظام حكم مركزى لوى .\n(ٕ) اعتبار حكام اإلنكا أنفسهم أبناء إله الشمس .\n(ٖ) معرفة شعب المايا الزراعة المستمرة .\n(ٗ) نشؤة عديد من الحضارات المديمة فى األمريكتين في بيبات طبيعية متنوعة .\nس :7 دلل على صحة كل عبارة من العبارات اآلتية :\n(ٔ) امتلن شعب اإلنكا خبرة كبيرة في مجال الزراعة .\n(ٕ) اهتم شعب اإلنكا بتربية الحيوان .\n(ٖ) استطاع شعب اإلنكا التغلب على الطبيعة الجبلية ببالدهم .\n(ٗ) ظهرت براعة شعب اإلنكا فى بعض الصناعات .\n(ه) تمدمت حضارة اإلنكا فى علم الرياضيات\n( )ٙ براعة حضارة اإلنكا فى فن العمارة .\n( )۷ تشابه ك َّل من الحضارات المديمة فى األمريكتين والحضارة المصرية المديمة فى العمارة الضخمة .\n( )۸ كان للملن فى حضارة المايا مكانة ممدسة\n( )۹ مرت الزراعة بحضارة المايا بعدة مراحل ."],[33,"(ٓٔ) زيادة اهتمام حضارة المايا بالتجارة\n(ٕٔ) تميزت حضارة المايا بالتمدم فى علم الفلن .\n(ٖٔ) ازدهرت العمارة فى حضارة المايا .\n(ٗٔ) ازدهر فن النحت عند شعب المايا .\nس :8 حدد أوجه الشبه بين كل من :\n(ٔ) المعتمدات الدينية عند بعض الحضارات المديمة فى األمريكتين ، والحضارة المصرية المديمة .\n(ٕ) الكتابة التصويرية فى حضارة المايا والحضارة المصرية المديمة .\nس :9 ما تقييمك لمصداقية كل عبارة مما يأتى ... ؟مع ذكر السبب في الحالتين :\n(ٔ) ارتبطت الصناعات التعدينية عند اإلنكا بالثروات الطبيعية في بالدهم .\n(ٕ) بلغ التحنيط فى حضارة اإلنكا نفس درجة البراعة لدى المصريين المدماء .\nأسئلة الكتاب المدرسى\nس :1 اكتب كلمة ( صواب ) أوكلمة (خطأ) ، مع التصويب :\n(ٔ) استخدمت حضارة اإلنكا نظام الكتابة التمليدي لتوثيك األحداث .\n(ٕ) نشؤت حضارة المايا في أمريكا الجنوبية .\n(ٖ) اشتركت الحضارة المصرية المديم وحضارة المايا في استخدام الكتابة التصويرية (.\n(ٗ) اتسمت حضارة المايا بنظام حكم مركزى لوى .\nس :2 بم تفسر ... ؟\n(ٔ) اهتمام حضارة اإلنكا ببناء الجسور المعلمة .\n(ٕ) اهتمام حضارة اإلنكا بحفظ أجساد موتاهم عن طريك التحنيط .\nس :3 ما النتائج المترتبة على :\nاهتمام حضارة المايا بعلم الفلن ؟"],[34,"ما مالمقصود بـ : الكشوف الجغرافية :\nرحالت بحرية قام بها األوروبيون بدأت في القرن الخامس عشر الميالدي؛ الكتشاف طُرُق\nبحرية جديدة ومناطق كانت مجهولة لهم من العالم .\n بدأت أوروبا حركة كبرى من الكشوف الجغرافية شملت مناطق لم تكن معروفة\nبالنسبة إليهم .\n دلل : أسهمت عدة عوامل في نجاح الكشوف الجغرافية ؟ حيث تمثلت في :\nا\nعامال مه اما في نجاح الكشوف الجغرافية .\nٔ) التمدم في علوم الرياضيات والفلن والجغرافيا كان\nتطور السفن واألدوات المالحية بم تفسر؟ أسهم في تحديد التجاهات والموالع بدلة .\nٕ) ُّ\n ما النتائج : التقدم العلمى لألوروبيين في علوم الرياضيات والفلك والجغرافيا في بداية\nالقرن الـ 15 م بالنسبة للكشوف الجغرافية؟ ترتب على ذلك :\nٔ) أصبح هذا التمدم عامالا مه اما فى نجاح الكشوف الجغرافية .\nٕ) ساعد كل ذلن المستكشفين على الميام برحالت بحرية عديدة .\nأوالي : دوافع الكصوف اجلغرافية -:\nوتمثلت أهم دوافع أوروبا للكشوف الجغرافية فيما يلي :\n-1 الدوافع السياسية :\n دلل : وجود دوافع سياسية لدى دول أوروبا للقيام بالكشوف الجغرافية بالعالم الجديد؟\nحيث :\nٔ) تنافست بعض الدول األوروبية ، مثل : البرتغال وإسبانيا بم تفسر؟ من أجل التوسع وفرض\nنفوذها خارج حدودها وتكوين إمبراطوريات استعمارية خارج المارة األوروبية .\nٕ) أصبحت لوة الدولة مرتبطة بما تملكه من مستعمرات خارج حدودها ."],[35,")2 الدوافع االقتصادية :\n دلل : تعددت الدوافع االقتصادية للكشوف الجغرافية ؟ حيث تمثلت في :\nٔ) البحث عن طرق تجارية جديدة غير الطرق المعروفة بم تفسر؟ بهدف : لوصول إلى\nالهند وشرق آسيا دون المرور عبر طريك الحرير البري أو األراضي التي كانت خاضعة لسيطرة\nالعثمانيين والممالين بم تفسر؟ لتجنُّب دفع رسوم مرور التجارة .\nٕ) البحث عن المعادن والسلع الثمينة دلل؟ حيث سعت الدول األوروبية إلى :\n زيادة ثرواتها من المعادن النفيسة ، خاصةا الذهب والفضة ، بم تفسر؟ لستخدامها في ِّ\nسن\nالنمود .\n الحصول على السلع الثمينة ، مثل : التوابل والحرير .\n ما النتائج : مرور األوروبيين بالطرق التجارية التقليدية التابعة للعثمانيين والمماليك ؟\nترتب على ذلك :\nدفع األوروبيين رسوم مرور للتجارة . سعى الدول األوروبية إلى البحث عن طرق تجارية جديدة للوصول إلى الهند وشرق آسيا دون المرور عبر الطرق التجارية التابعة للعثمانيين والممالين .\n ما العالقة بين : الموارد االقتصادية والكشوف الجغرافية األوروبية؟\nحيث : من الدوافع اللتصادية للكشوف الجغرافية األوروبية السيطرة على الموارد اللتصادية\nكالمعادن النفيسة مثل الذهب والفضة والحصول على السلع الثمينة مثل الحرير والتوابل .\nثاىييا : اكتصاف العامل اجلديد -:"],[36,"نستنتج من الخريطة السابقة أن :\n رحالت الكشوف الجغرافية انطلمت من لارة أوروبا .\n كريستوفر كولومبس يعد أول رحالة حول العالم وخالل رحلته :\nعبر المحيط األطلنطى للوصول إلى لارات العالم الجديد .\nوصل إلى لارة أمريكا الشمالية .\n(أ) كريستوفر كولومبوس ( : مستكشف إيطالي)\n دلل : بدأت رحالت كريستوفر كولومبوس اعتماديا على أساس علمى «جغرافي»؟\nحيث : انطلك من فكرة كروية األرض ورأى أن اإلبحار غرباا يمكن أن يإدي إلى آسيا بشكل أسرع و\nألصر وألنع ملون إسبانيا بتمويل رحلته .\n* اكتشافاته :\n دلل : نجحت رحالت كريستوفر كولومبوس فى الوصول إلى مناطق خارج القارة\nاألوروبية ؟\nحيث :\nٔ) وصل إلى ُج ُزر البهاما بالمرب من الساحل الجنوبي الشرلي لمارة أمريكا الشمالية بعد رحلة\nمليبة بالصعوبات ، ، واعتمد أنها جزء من آسيا .\nٕ) وتابع بعد ذلن رحالته في البحر الكاريبي ، من دون أن يدرن أنه وصل إلى لارة جديدة .\n(ب) أميريجو فسبوتشي ( : مستكشف إيطالي)\n* اكتشافاته :\n دلل : تعددت إنجازات أميريجو فسبوتشى االستكشافية؟\nحيث :\nٔ) شارن في عديد من الرحالت الستكشافية إلى السواحل الشرلية لمارة أمريكا الجنوبية وأجزاء من\nأمريكا الشمالية .\nصل إلى أن األراضي المكتشفة ليست جز اءا من لارة آسيا كما اعتمد كريستوفر كولومبوس ، بل\nٕ) تو ّ\nتُمثّل عال اما جديداا ولارةا مستملة .\n بم تفسر : أطلق الجغرافيون األوروبيون اسم «أمريكا» على القارتين الجديدتين؟\nوتمديرا لجهوده وإسهاماته الجغرافية .\nنسبةا إلي أميريجو فسبوتشى\nا"],[37,"(ج) ماجالن :\n(مستكشف برتغالي)\n انطلق في رحلته بتمويل من إسبانيا .\n* اكتشافاته :\nعبر المحيط األطلنطي ، وصل إلى مضيك في ألصى جنوب لارة أمريكا الجنوبية ، ع ُِرف لحماا باسم\n«مضيك ماجالن» ، ومن خالله دخل المحيط الهادي .\n ما النتائج : عبور ماجالن المضيق الواقع بأقصى جنوب أمريكا الجنوبية؟ أدى ذلك إلى :\nاكتشاف طريك بحرى يصل بين المحيط الهادى والمحيط األطلنطى . - تسمية المضيك باسمه .\n- الوصول إلى جزر الفلبين .\n بم تفسر : أطلق ماجالن على المحيط الهادي هذا االسم؟\nألن أمواجه بدت له هادبة أثناء الرحلة ممارنةا بالمحيط األطلنطي .\n*وبعد وفاته :،\nأكمل رفاقه الرحلة وعادوا إلى إسبانيا عام 1522 م .\n بم تفسر : تعد رحلة ماجالن ورفاقه إنجازا علمييا كبيريا؟\n بم تفسر : أهمية رحلة ماجالن ورفاقه فى تاريخ الكشوف الجغرافية؟\nألنها أول رحلة بحرية حول العالم لدمت دليالا عملياا على كروية األرض .\n دلل : لعب الهولنديين دور فى الكشوف الجغرافية للعالم الجديد؟ حيث :\nتعود أولى الرحالت األوروبية الموثَّمة إلى لارة أستراليا في المرن السابع عشر الميالدي إلى\nالبحارة الهولنديين وتوالت بعد ذلن رحالت المستكشفين األوروبيين .\nجيمس كوك ( : مستكشف بريطاني)\n* اكتشافاته :\n دلل : مهدت حركة الكشوف الجغرافية البريطانية الطريق لالستيطان األوروبي ألستراليا؟\n بم تفسر ُ : تعد رحالت جيمس كوك من أهم الرحالت االستكشافية؟\nحيث :\n وصل جيمس كون إلى الساحل الشرلي ألستراليا عام ٓ ٔ۷۷ م .\n رسم خرابط تفصيلية للساحل الشرلي ألستراليا ، وأعلن تبعيته لبريطانيا ما النتائج؟ مما م َّهد\nلبدء الستيطان األوروبي في أستراليا ."],[38,"التدريب األول\nس :1 أكمل العبارات اآلتية بكلمات مناسبة :\nٔ) الدولتان اللتان تنافستا فى بداية الكشوف الجغرافية لتكوين إمبراطوريات استعمارية هما ....... و . .....\nٕ) سعى األوروبيون للوصول إلى الهند دون المرور باألراضى الخاضعة لسيطرة الممالين و . .......\nٖ) يعد كريستوفر كولومبوس مستكشف جغرافى ذات أصول . ..............\nٗ) المستكشف الجغرافى الذى شارن فى عدد من الرحالت الستكشافية للسواحل الشرلية ألمريكا\nالجنوبية وأجزاء من أمريكا الشمالية . ......................\n٘) تميزت رحالت المستكشف جيمس كون برسم خرابط تفصيلية للساحل الشرلى لمارة . .........\nس :2 أى من المستكشفين األوروبيين قام بكل عمل من األعمال اآلتية ... ؟\nٔ) انطلمت رحلته بتمويل من إسبانيا واستطاع اكتشاف جزر البهاما .\nٕ) وصل إلى مضيك فى ألصى جنوب أمريكا الجنوبية وعُرف باسمه .\nٖ) توصل إلى أن األراضى المكتشفة ليست جز اءا من آسيا وإنما عال اما جديداا ولارة مستملة .\nٗ) وصل إلى الساحل الشرلى ألستراليا عام ٓ ٔ۷۷ م وأعلن تبعيتها لبريطانيا .\nس :3 بم تفسر ... ؟\nٔ) سعت الدول األوروبية إلى زيادة ثرواتها من المعادن النفيسة خاصة الذهب والفضة .\nٕ) تسمية المستكشف ماجالن المحيط الهادي بهذا السم .\nٖ) أطلك الجغرافيون األوروبيون اسم «أمريكا » على المارتين الجديدتين .\nس :4 دلل على صحة كل عبارة من العبارات اآلتية :\nٔ) ساهم التمدم العلمى فى إنجاح رحالت المستكشفين األوروبيين الجغرافية؟\nٕ) اختالف رحلة ماجالن ورفاله عن بالى رحالت المستكشفين؟\nٖ) تعد هولندا صاحبة السبك التوثيمى في استكشاف لارة أستراليا؟\nس :5 ما المقصود بـ : الكشوف الجغرافية :"],[39,"ثالجاً : دور العلناء املشلنني يف الكصوف اجلغرافية للعامل اجلديد\n دلل : استفاد األوربيون من العلماء والرحالة المسلمين خالل قيامهم بالكشوف الجغرافية\nللعالم الجديد؟\nحيث استفاد األوروبيون من :\nٔ) مإلَّفات الجغرافيين والرحالة المسلمين في الجغرافيا والفلن والمالحة البحرية ، مثل : أحمد بن ماجد .\nٕ) تؤكيدالعلماء المسلمين على كروية األرض؛ ما النتائج؟ األمر الذي ش َّجع كريستوفر كولومبوس\nعلى التفكير في الوصول إلى الهند بالتجاه غربا ا .\nطورها العلماء المسلمون .\nٖ) الخرابط وأدوات المالحة (مثل : البوصلة واإلسطرلب) التي َّ\n ما النتائج : تطوير العلماء المسلمين للخرائط واألدوات المالحية بالنسبة لألوروبيون؟\n دلل : كان للخرائط وأوات المالحة التي طوَّرها العلماء المسلمون دور مهم في الكشوف\nالجغرافية للعالم الجديد؟ حيث أسهمت في :\nٔ) تحسين المالحة البحرية .\nٕ) تمكن األوروبيون من عبور المحيطات والوصول إلى الهند .\nٖ) الميام بالكشوف الجغرافية الكبرى التي شهدها العالم في العصر الحديث .\nمعلومة إثرائية :\nأحمد بن ماجد : يُعد من أشهر المالحين العرب المسلمين ، حيث وضع قواعد دقيقة للمالحة\nاعتمدت على النجوم والرياح والتيارات البحرية ، وألَّف العديد من الكتب؛ مما أسهم في\nتقدُم المالحة البحرية األوروبية .\nرابعاً : ىتائج الكصوف اجلغرافية\nشكَّلت رحالت المستكشفين األوروبيين إلى العالم الجديد نقطة تحوُل مهمة في تاريخ\nالبشرية ."],[40,"-1 نتائج سياسية :\n دلل : كان للكشوف الجغرافية نتائج سياسية؟ حيث أدت إلى :\nٔ) تنافُس الدول األوروبية للسيطرة على األراضي المكتَشَفة .\nٕ) تكوين المستعمرات في األمريكتين .\nمما تسبَّب في حروب عديدة ، خاصةً بين إنجلترا وإسبانيا وفرنسا .\n بم تفسر : حدوث حروب عديدة من بين دول أوروبا بعد اكتشاف األمريكتين؟\nبسبب : تنافس الدول األوروبية خاصة إنجلترا وإسبانيا وفرنسا للسيطرة على األراضى المكتشفة\nوتكوين المستعمرات في األمريكتين .\n-2 نتائج اقتصادية :\n دلل : كان للكشوف الجغرافية نتائج اقتصادية إيجابية للدول األوروبية؟ حيث أدت إلى :\nٔ) تحول المحيط األطلنطى من حاجز مابى إلى طريك ربيسي للتجارة العالمية .\nٕ) تدفمت كميات كبيرة من الذهب والفضة إلى أوروبا خاصة إسبانيا وإنجلترا .\nمصدرا لعديد من المواد الخام مثل : المطن والسكر ، وسوق لتصريف\nٖ) أصبحت األمريكتان\nا\nالمنتجات األوروبية ما النتائج؟ مما أدى إلى ازدهار التجارة .\n-3 نتائج علمية :\n ما العالقة بين : الكشوف الجغرافية األوروبية ، وتطور العلوم المختلفة؟\n دلل : كان للكشوف الجغرافية تطورات علمية؟ حيث أسهمت في :\nتطورا ملحو ا\nظا خاصة بعد تمديم أدلة عملية على كروية األرض .\nٔ) تطور علم الجغرافيا\nا\nٕ) رسم خرابط أكثر دلة .\nالتعرف أنواع جديدة من النباتات والحيوانات .\nصا لدراسة البيبات المختلفة وشعوب المناطك المكتَشفة .\nٗ) وفرت للعلماء فر ا\n بم تفسر : أهمية الكشوف الجغرافية بالنسبة للدراسات السكانية والطبيعية لقارات العالم\nالجديد؟\nألنها أسهمت في :\nٔ) التعرف على أنواع جديدة من النباتات والحيوانات ووفرت فرضاا للعلماء لدراسة البيبات\nالمختلفة «جانب طبيعى» .\nٕ) دراسة شعوب المناطك المكتشفة «جانب سكانى» ."],[41,"-4 نتائج اجتماعية :\n دلل : كان للكشوف الجغرافية تأثيرات اجتماعية ؟ حيث :\nٔ) صاحبت الكشوف الجغرافية هجرات كبيرة من أوروبا إلى العالم الجديد .\nٕ) كان للكشوف الجغرافية آثار سلبية على :\n األفارلة الذي تم استغاللهم في تجارة الرليك .\n والسكان األصليين في لارات العالم الجديد الذي تم إبادتهم .\n ما النتائج : تدفق الهجرات األوروبية إلى قارات العالم الجديد بعد اكتشافها من الناحية\nالثقافية؟\nأدى ذلك إلى :\n- نمل األوروبيين ثمافتهم وأنماط حياتهم إلى المناطك المكتشفة وأسهموا في نشر مظاهرالتطور فيها .\nخامشيا : الكصوف اجلغرافية وجتارة الرقيل :\n دلل : اختلفت غاية األوروبيين من الكشوف الجغرافية فى بدايتها عما انتهت إليه؟\n دلل : تغيرت االهتمامات التجارية لألوروبيين بعد اكتشاف العالم الجديد ؟ حيث :\nفي بداية الكشوف الجغرافية :\n كان اهتمام البرتغال وإسبانيا ُمنصبيّا على الحصول على الذهب والتوابل والسلع التجارية .\nبعد اكتشاف األمريكتين :\n أصبح الرقيق اإلفريقي هو السلعة األهم ومحط أنظار األوربيين بعد اكتشاف األمريكتين\nبم تفسر؟ للعمل في المزارع والمناجم بالمستعمرات األوروبية باألمريكتين ، ولذلن نُملت أعداد\nلسرا في هذه المستعمرات .\nكبيرة من األفارلة للعمل\nا\n بم تفسر : ظهور تجارة الرقيق بعد الكشوف الجغرافية لألمريكتين؟\nللعمل في المزارع والمناجم بالمستعمرات األوروبية باألمريكتين ، ولذلن نُملت أعداد كبيرة من األفارلة\nلسرا في هذه المستعمرات .\nللعمل\nا\n دلل : استغلت القوى األوروبية الصراعات واالنقسامات الداخلية في المجتمعات اإلفريقية\nلخدمة مصالحها ؟\nحيث :\nمنعت قيام وحدات سياسية قوية بم تفسر؟ لضمان استمرار استغالل البشر والستفادة من\nالعمالة الرخيصة في المستعمرات ."],[42," بم تفسر : كانت تجارة الرقيق عمليا استغاللييا قاسييا؟\nألنه : تسبَّب في حدوث دمار التصادي واجتماعي للمارة اإلفريمية .\n دلل : كان للكشوف الجغرافية فى قارات العالم الجديد آثار مدمرة سلبية على القارة\nاإلفريقية؟\nحيث أدت إلى :\nا\nعمال استغالليا لاسيا تسبب في حدوث دمار التصادی و اجتماعى للمارة\nظهور تجارة الرليك الذى كان\nاإلفريمية .\nتذكر أن : تجارة الرقيق : هي عملية بيع وشراء البشر كعبيد ، واستغاللهم في العمل\nاإلجباري ، وحرمانهم من حريتهم وحقوقهم .\nتأثير الكشوف الجغرافية على السكان األصليين في قارات العالم الجديد -:\nعند وصول األوروبيين إلى األمريكتين وأستراليا ، تعرَّض السكان األصليون آلثار سلبية عديدة ،\nدلل؟\nحيث كان من أهمها :\n تعرُضهم لإلبادة -: مثلما فعل األوروبيون ضد الهنود الحمر في أمريكا الشمالية .\n وفاة أعداد كثيرة منهم -: بم تفسر؟ نتيجة انتشار أمراض وأوببة وافدة جاءت مع األوروبيين\nكالجدري واإلنفلونزا ولم تكن لديهم مناعة طبيعية ضدها .\n احتالل أراضيهم وتهجيرهم منها وتراجع حضاراتهم -: بم تفسر؟ نتيجة السيطرة األوروبية\nألن األوروبيين رأوا هذه الحضارات أدنى منهم .\n تعرُضهم للتمييز واالستغالل -: دلل؟ حيث استُغلوا للعمل في ظروف عمل شالة في المزارع\nوالمناجم .\n تأثُر ثقافاتهم وعاداتهم المحلية -: بانتشار الثمافة األوروبية في المناطك ال ُمستع َمرة .\n دلل : كانت الكشوف الجغرافية سالحيا ذو حدين ؟\nحيث :\nحممت الكشوف الجغرافية مكاسب كبيرة للدول األوروبية ، لكنها تسببت في معاناة كثير من الشعوب\nاألخرى مثل الشعوب اإلفريمية والسكان األصليون للعالم الجديد .\n ما النتائج : شعور األوروبيين بتفوقهم الحضارى على السكان األصليين؟ ترتب على ذلك :\nٔ) احتالل أراضيهم وتهجيرهم منها .\nٕ) تراجع حضارة السكان األصليين بسبب السيطرة األوروبية ."],[43,"التدريب الثاني\nس :1 اكتب ما تشير إليه كل عبارة من العبارات اآلتية :\nٔ) نظرية جغرافية أكدها العلماء المسلمون وكانت الدافع وراء إبحار كريستوفر كولومبوس نحو الغرب\nللوصول للهند .\nٕ) لارة تدفمت إليها كميات كبيرة من الذهب والفضة بعد الكشوف الجغرافية لألمريكتين مما أدى\nلزدهار التصادها .\nٖ) شعوب تعرضت لإلبادة واحتالل أراضيها بعد وصول األوروبيين إلى أمريكا الشمالية .\nٗ) أمراض وافدة نملها األوروبيين للعالم الجديد مما تسبب في وفاة أعداد كبيرة من السكان األصليين\nلعدم امتالكهم مناعة طبيعية ضدها .\nس :2 ما تقييمك لمصداقية كل عبارة مما يلى ... ؟ مع ذكر السبب في الحالتين :\nٔ) عجزت حركة الكشوف الجغرافية عن دفع عجلة البحث العلمي .\nٕ) كان للكشوف الجغرافية األوروبية تؤثير متباين على كل من لارة أوروبا ولارة إفريميا .\nس :3 ما النتائج التي ترتبت على :\nالكشوف الجغرافية للعالم الجديد من الناحية الجتماعية ؟\nس :4 ما العالقة بين ... ؟\nٔ) العلماء المسلمين ، والكشوف الجغرافية لمارات العالم الجديد .\nٕ) الكشوف الجغرافية ، والحروب األوروبية في العصر الحديث .\nس :5 دلل على صحة العبارة :\nتؤثيرا ثمافياا على السكان األصليين .\nكان للهجرات األوروبية إلى لارات العالم الجديد\nا"],[44,"س 1 أمامك خريطة للعالم ، اكتب ما تدل عليه األرقام التالية :\nٔ) جزر وصل إليها أول مستكشف أوروبي . ........ :\nٕ) المستكشف البريطاني الذي وصل إلى المنطمة المشار\nإليها برلم (ٕ) . ................... :\nٖ) مضيك . ................... :\nٗ) الجزر التي وصل إليها المستكشف\nالبرتغالي ماجالن . ................... :\n٘) الدولة التي لامت بتمويل رحلة كريستوفر كولومبوس\nالستكشافية . ................... :\n)ٙ مستكشف أوروبي أطلك اسمه على المارة المشار\nلها برلم ( . ................... :)ٙ\nس 2 اختر اإلجابة الصحيحة مما بين القوسين :\nٔ) أي مما يلي كان ممثالا سياسيا ا ألوروبا للميام بالكشوف الجغرافية؟ ..........\n(البحث عن طرق تجارية جديدة - الحصول على المعادن
