رجاء العالم .\nت 01065626600/"],[31,"التواصل الثقافي بين مصر وفينيقيا :\n* كانت مدينة جبيل بمثابة منطقة مصرية حيث :\n)1 كان يسكن بها جالية مصرية من التجار الذين تمكنوا من نشر\nالثمافة المصرية هنان(ارتبط انتشار الثمافة المصرية بحرفة التجارة) .\nشعارا ذا طابع\n)2 كان حكامها يكتبون أسماءهم بالهيروغليفية واتخذوا\nمصرى اإلمارتهم .\nالكتابة الهيروغليفية أقدم\nكتابة استخدمت فيها\nالصور .\nالكتابة الفينيقية أول\nكتابة استخدمت فيها\nالحروف .\n-1 العمارة :\nبرع الفينيقيون فى فن العمارة وزخرفتها ، ومن أمثلة ذلك -:\n القالع والحصون واألسوار : التي تُعد من أعظم ما عرفه العالم المديم (الدليل على ذلن الصعوبة التي\nوجدها الملن البابلي نبوخذ نصر الثانى فى احتبلل فينيميا فى المرن الـ 6 ق . م بسبب أسوار مدنها\nالمنيعة) .\n القصور ، مثل : بمايا لصر ضخم زينت أعمدته بالفضة عُثر عليه في مدينة أوغاريت (. وبذلن تفولت\nأوغاريت عن بالي المدن في العمارة الملكية وظهرت فيها استخدامات جديدة للمعادن) .\n المعابد ، ولد أظهرت بماياها مدى تمكن المهندسين من فنهم ولدرتهم على استخدام كتل ضخمة من\nاألحجار وذلن بسبب تطور وازدهار العلوم والفنون .\n-2 الفنون\n* تفوق الفينيميون في فن النمش والنحت وظهر هذا واض ًحا فيما\nعُثر عليه من توابيت رابعة النموش .\n* أتمن الفينيميون فن صناعة الحلى وصنعوا العمود والخواتم\nواأللراط واألساور من الذهب والفضة واألحجار الثمينة .\nت 01065626600/"],[32,"- الخصائص الرئيسة لحضارة فينيقيا :\n مثلت أولى الحضارات البحرية فى العصور التاريخية المديمة .\n ساهمت في نشر الوعى والثمافة في شتى أنحاء العالم من خبلل األبجدية الفينيمية التي اخترعتها .\nأشهر المدن والمستوطنات الفينيقية وما يميز كل منها عن األخرى :\n صيدا : زعيمة المدن الفينيمية .\n صور : اكتسبت مناعة من الؽزو الخارجي إلحاطتها بسور عظيم .\n أوغاريت : نالت شهرة في الفن والعمران .\n جبيل : ألدم المدن الفينيمية وأوثمها صلة بمصر المديمة .\n لرطاجة : مستوطنة فينيمية أسست بالمرب من مدينة تونس واختلفت عن معظم المدن الفينيمية في\nنظامها السياسي وتدل آثارها المتبمية على اهتمامها باألساطيل الحربية .\nوجه الشبه بين الدويالت السومرية بالعراق والمدن الفينيقية :\nلم تستطع أى منها تكوين وحدة سياسية واحدة فكان لكل دويلة سومرية أو مدينة فينيمية حكومة مستملة\nبذاتها .\nانتهاء الحكم الوطني الفينيقيا :\nاحتل اإلسكندر األكبر فينيميا عام 332 ق . م لتتولى بعد ذلن عدة دول فى حكم فينيميا كان آخرها الرومان\nحتى جاء الفتح العربي اإلسبلمي 634 م .\nأوجه االرتباط بين الطبيعة الجغرافية لفينيقيا واألنشطة االقتصادية المختلفة :\n-1 النشاط البحرى :\nكان لوجود الفينيميين على ساحل محدد تحيط به الجبال من الشرق األثر األكبر في توجههم نحو البحر طلبيا للرزق واستيطانهم مناطك جديدة وتؤسيس مستعمرات فينيمية فى حوض البحر المتوسط .\nسيطروا على تجارة العالم البحرية كما احتكروا الموافل التجارية بين آسيا وأفريميا والبحر المتوسط . -2 النشاط الزراعي : حيث استطاع الفينيميون تحويل سفوح جبال لبنان إلى مصاطب صالحة للزراعة\nواستؽلوا كل المساحات التي يمكن زراعتها .\n-3 النشاط الصناعى : استخرجوا الصبؽة الحمراء من بعض الموالع التي تعيش فى البحر واستخدموها\nفي الثياب المزخرفة .\nت 01065626600/"],[33,"ابتكارات الفينيقيين فى مجال الصناعة وفن العمارة :\n-1 في مجال الصناعة :\nالثياب المزخرفة بالصبؽة الحمراء التي استخرجوها من بعض الموالع التي تعيش في البحر . استخدامهم للفضة فى تزيين األعمدة كما في مدينة أوغاريت -2 في فن العمارة :\nظهرت براعة الفينيميين فى بناء المبلع والحصون ( وهى لمة العمارة الفينيمية ) حيث تعد أعظم ما عرفه\nالعالم المديم ، كذلن المصور والمعابد الضخمة والتي أظهرت بماياها مدى تمكن المهندسين من فنهم\nولدرتهم على استخدام كتل ضخمة من األحجار .\n- أهداف التوسعات المصرية فى بالد فينيقيا قديما :\nلم يسعى المصريون المدماء للسيطرة على فينيميا طمعا فى ثرواتها بل لحماية األمن المومى المصرى\nلتكون خط الدفاع األول عن مصر خاصة في عصر الدولة الحديثة .\n- وجه االرتباط بين بعض األنشطة االقتصادية (الزراعة) والمعتقدات الدينية عند الفينيقيين :\nلدس الفينيميون اإلله بعل وزوجته عشتار باعتبارهما آلهة للخصب والنماء اللذان أصلحا األرض ، كما\nلدس الفينيميون اإلله أدونيس الذي يمثل الموة المتجددة فى الشمس بعد هزيمة الشتاء .\n- أهمية التواصل الحضارى فى تطور الحضارة اإلنسانية فى النواحى العلمية والثقافية :\nحيث اخترع الفينيميون أول أبجدية عرفها العالم في المرن الـ 14 ق . م والتي التبسوها من الكتابة المصرية\nالمديمة ثم أخذها اإلغريك بعد أن عدلوا فيها وأورثوها للرومان الذين نشروها فى بالى األلطار األوروبية\nومنها خرجت األبجدية األوروبية الحديثة مما ساهم في نشر الوعى والثمافة في شتى أرجاء العالم .\n- أمثلة للتواصل بين الحضارة المصرية القديمة والحضارة الفينيقية في بعض المجاالت :\nالتواصل االلتصادي : حرصت مصر على فتح أسواق فى فينيميا لبيع منتجاتها واالستيراد منها .\nالتواصل الثمافى : كانت مدينة جبيل بمثابة منطمة مصرية يسكن بها جالية مصرية من التجار الذين تمكنوا\nشعارا ذا طابع\nمن نشر الثمافة المصرية هنان وكان حكامها يكتبون أسمابهم بالهيروغليفية واتخذوا\nمصرى إلمارتهم .\nالتواصل الديني : تؤثر الفينيميون بؤفكار المصريين المدماء ومعتمداتهم وظهر ذلن في عادات الدفن\nوتؤثرهم بفكرة االعتماد في البعث والخلود والصراع بين الخير والشر مثل لصة اإلله بعل والتى تشبه لصة\nإيزيس وأوزوريس مع ست عند المصريين المدماء .\nت 01065626600/"],[49," ساعد المولع الجؽرافي لببلد اليونان « اإلغريك » على نشؤة الحضارة اإلغريمية ، ولربها من منبع\nحضارات الشرق المديم ( مصر ، فينيميا ، ببلد العراق ) على التواصل مع هذه الحضارات ونشرها في\nكافة أنحاء أوروبا .\n وكانت جزيرتى كريت ولبرص المعبر الربيسى لهذا التواصل الحضاري ألنهم كانوا األلرب لحضارات\nالشرق فنشؤت بهما ألدم حضارات المنطمة والتي انتملت إلى بالي ببلد اليونان فكان لها األثر األكبر فى\nليام الحضارات الؽربية بعد ذلن .\n كانت ببلد اليونان المعلم واالستاذ لحضارات الؽرب بسبب تواصلها مع ببلد الشرق .\nاإلغريق :\nهم سكان بالد اليونان وكريت وقبرص والمناطق المجاورة الذين أسسوا حضارة\nكبيرة في بالد اليونان بدءيا من القرن الثامن قبل الميالد .\nأوالي : أهم حضارات بالد اليونان «اإلغريق»\nت 01065626600/"],[50,"نشؤت داخل إلليم أتيكا وتميزت بتنوعها الجؽرافي ، والذي أدى إلى اختبلف نشاط السكان واختبلف\nمستوياتهم االجتماعية وعُرفت بنظامها الديممراطى وتعد فكرة الديممراطية أهم ما لدمته أثينا لئلنسانية .\n* نشؤت باندماج عدد من المرى الصؽيرة .\n دلل : أثر النظام العسكري الصارم في إسبرطة على حياتهم االجتماعية؟\nحيث عُرفت بنظامها العسكرى الصارم (الذي تشابه مع مدينة آشور) الذي طبك في كافة نواحى الحياة من\nأجل إعداد مواطنين ألن كل ملوكها كانوا يحملون لادرين على المتال ولد انعكس هذا النظام العسكرى فى\nالتربية على كافة مجاالت الحياة االجتماعية ، والسياسية والثمافية والفكرية .\nارتبطت بالحضارة المصرية المديمة وتؤثرت بها ويرجع ذلن إلى مولعهم الجؽرافي وتشابهت مع مدينة جبيل بببلد فينيميا .\nسميت بالحضارة المينوية ، لمب «مينوس» ألن ملوكها كانوا يحملون لمب مينوس مثل لمب فرعون في الحضارة المصرية المديمة .\nثانياً : مظاهر حضارة بالد اليونان «اإلغريق»\n* إسبرطة :\nلامت الحياة السياسية فيها على النظام العسكرى الصارم ومن خبلله سيطرت إسبرطة على ببلد اإلغريك\nلمدة 200 عام حتى سمطت فى المرن الـ 4 ق . م على يد «الممدونيين» .\nت 01065626600/"],[51,"تكون نظام الحكم فيها من :\n-1 الملكان :\n* ينتخبان مدى الحياة من أكبر أسرتين في المدينة أي اختيارهم كان لابم على\nالثراء المادي .\n* سلطاتهما :\nإعبلن الحرب وليادة الجيش . رباسة الهيبة المضابية وتمدم المواكب الدينية . -2 مجلس الشيوخ\n(يشبه مجلس النواب\nحالياً)\nعضوا يُنتخبون مدى الحياة من المواطنين الذين بلؽوا سن\n* يتكون من 28 :\nعضوا .\nالـ 60 عا ًما باإلضافة إلى الملكين فيكون عدد أعضابه 30\n*سلطته : تشريع الموانين ومنالشتها .\n-3 الجمعية الشعبية\n* دورها : التصويت بالرفض أو المبول على الموانين التي يعرضها مجلس\nالشيوخ (أي تمثل فصل الختام في اعتماد المرارات والموانين) .\n-4 الرقباء الشعبيون\n*يتكونون من 5 : أعضاء يتم انتخابهم سنوييا(يتصف بالتجدد المستمر)\n* دورهم :\nممارسة سلطات تنفيذية ولضابية(أي مسبولين عن تطبيك العدالة ) . مرالبة السلون واألخبلق وحفظ األمن(التواجد الميداني) . يساهموا في صنع المرارات . -5 الجيش\nكان محور الحياة في إسبرطة ويلتحك به كل من بلػ سن الـ 20 عاما\nويظل جندييا فى الجيش حتى سن الـ 60 عاما .\n-2 أثينا :\nمرنظام الحكم فيها بعدة مراحل ، هي :\n)1 النظام الملكي\n)2 النظام األرستقراطي\nوفيه : امتلن األرستمراطيون كافة الموارد االلتصادية فى المدينة مما أدى\nإلى زيادة الفمر داخل المجتمع وليام سكانها بالثورة ضد هذا النظام ، لذلن\nاضطر الحكام إلى تمديم بعض الحلول لترضيتهم وهو ما أدى إلى تطور\nنظام الحكم إلى النظام الديممراطي .\n)3 النظام الديمقراطي\nتوصلت إليه أثينا من خبلل تنفيذ إصبلحات وإصدار عدة تشريعات لام بها\nحكامها خاصة سولون وبركليس (أي نتيجة توجهات السلطة الحاكمة)\nت 01065626600/"],[52,"-1 سولون ( 593 : 594 ق . م) :\n لام بوضع عدة تشريعات وإصبلحات (مثل حمورابي) ، منها :\nتشجيع العمل واإلنتاج . توفير فرص عمل للعامة (لتحميك مصلحة الفرد والمجتمع ولدعم االستمرار السياسي) . إسماط الديون(وجاء ذلن ضد الطبمة االرستمراطية) . تحديد حد ألصى للمصروفات على الحفبلت .  تخلى سولون عن حكم أثينا بعد أن أخذ عهديا على األثينيين بااللتزام بتطبيك إصبلحاته لمدة عشر\nسنوات (ولوتم تطبيك هذه االصبلحات ستمل الواردات وتزيد الصادرات) وسافر لمصر ليطلع على\nحضارتها ويستفيد من إنجازاتها .\n-2 بركليس ( 428 : 467 ق . م) :\n بلؽت الديممراطية ذروتها في عهده .\n انضم إلى العامة رغم كونه من أسرة غنية ولام بالعديد من اإلصبلحات .\n ركز في إصبلحاته على االرتماء بمستوى الميم واألخبلق حيث كان مإمنيا بؤن\nالتربية االجتماعية السليمة هي السبيل الرتماء شعب أثينا .\nعلى الرغم من تلك اإلصالحات إال أن الديمقراطية في أثينا كان لها عيوبها ومميزاتها :\nمميزاتها\nعيوبها\nلم تكن الديمقراطية في أثينا كاملة\nأتاحت الديمقراطية حرية الفكر واإلبداع\nبسبب : التصار الحموق االنتخابية والتشريعية\nعلى األحرار فمط وال يجوز للعبيد أو األجانب\nاالشتران فيها حرمان النساء من مباشرة حمولهن\nالسياسية والتشريعية .\nمما أدى إلى : تفوق أثينا فى الفنون واآلداب\nوالعمارة وظهور الفبلسفة . والمفكرين حتى\nأصبحت رابدة ببلد اليونان في المرنين . الخامس\nوالرابع لبل الميبلد في كافة المجاالت .\nتوضيح\nتوجد عالقة بين الحرية والتطور الفكري اإلبداعى حيث :\nقال ول ديورانت : إذا ما أمن اإلنسان من الخوف تحررت في نفسه دوافع التطلع وعوامل اإلبداع ، فهى\nعبللة ارتباطية وهى وجهين لعملة واحدة تمثل خاصية من خصابص اإلنسان فاإلبداع يمثل لئلنسان هدفه\nاألول لذلن تسعى الحرية إلى تحميك هذا الهدف الذى يضمن لئلنسان تحميك سعادته ورفاهيته فبل إبداع\nبدون حرية .\nت 01065626600/"],[53,"-3 مقدونيا ( : تسيطر على ببلد اليونان نتيجة للحروب الداخلية)\nقامت الحروب بين أثينا وإسبرطة عام 441 ق . م ( حروب البيلوبونيز) التي جائت\nفي وقت وصول الديمقراطية إلى ذروتها مما أدى إلى :\nضعف المدن اليونانية إلى أن تمكن فيليب الثانى المقدونى من فرض حكمه بالموة على ببلد اليونان\nكلها ، وحاول إلناعهم بتوحيد الصف تحت رايته لمواجهة الفرس .\nوبعد ... وفاة الملك فيليب الثانى تولى الحكم ابنه اإلسكندر ، وكان عمره 20 عا ًما وخبلل حكمه سعى\nإلى تحميك مبدأ(العالم وطن واحد) فحارب الفرس في آسيا الصؽرى وهزمهم ثم اتجه نحو الشرق\nللسيطرة على بالي الواليات الفارسية ( مثل سوريا ومصر) ليكون إمبراطورية يونانية (مقدونية) وبذلن\nوصل ألصى اتساع للحضارة اإلغريمية على يد اإلسكندر األكبر (ملك مقدوني) .\nالتواصل السياسي بين مصر وبالد اليونان :\nفي فترة حكم األسرة الفرعونية الـ : 26 توطدت العبللات بين مصر واليونان حيث عمل اليونانيون\nكجنود مرتزلة في الجيش المصرى .\nفي عام 332 ق . م تمكن اإلسكندر األكبر المقدوني : من االستيبلء على مصر وعمل على مزج\nالحضارة المصرية المديمة بالحضارة اليونانية فيما عُرف باسم «الحضارة الهيلينستية » .\nمما سبق نستنتج أن :\n تشابهت عوامل سموط إسبرطة أثينا مع عوامل سموط أور ولجش .\n ظهر مفهوم عالمية الحضارة اإلنسانية في عهد اإلسكندر األكبر .\n حممت مصر مكاسب من التواصل الحضاري خبلل العصر المتؤخر في المجاالت االلتصادية والعسكرية .\nساعدت الطبيعة الجغرافية لبالد اليونان من حيث الموقع البحرى ، والتضاريس (الطبيعة\nالجبلية) ، والمناخ على التنوع فى النواحى االقتصادية ، والتي تمثلت في :\n-1 الزراعة :\n* لام اليونانيون بزراعة أراضى الوديان والسهول والتي تبلػ :20 فمط من المساحة الكلية (أي تمثل\nمساحة صؽيرة وبذلن تتشابه مع الزراعة في ببلد فينيميا) وانمسمت األراضي الزراعية إلى :\n- إلطاعات كبيرة .\n- أراض للمراعى .\n- أراض لؤلفراد (تتشابه مع ببلد العراق في الملكية الزراعية) .\nت 01065626600/"],[54,"-2 تربية الحيوان :\nاهتم اليونانيون بالثروة الحيوانية لحاجاتهم للحومها وأصوافها وألبانها .\n-3 الصناعة :\nبرع اليونانيون في صناعة :\nالسفن ( لطبيعة الببلد الجؽرافية مثل ببلد فينيميا) .\n- زيت الزيتون .\n- األواني الفخارية .\n- النبيذ .\n-4 التجارة :\nتُعد أهم األنشطة االقتصادية والمورد االساسي لالقتصاد فمد تحولت موانا ببلد اليونان إلى\nمحطات تجارية لتبادل السلع بين اليونان وببلد الشرق فقامت اليونان بـ :\nتصدير الرخام والمعادن والنبيذ والزيوت . استيراد األلمشة والحبوب من مصر وسوريا . التواصل االقتصادي بين مصر وبالد اليونان :\nأثناء العصر المتأخر لمصر الفرعونية :\n اشتؽل بعض اليونانيين فى مصر بالتجارة وأسسوا فيما بعد مدينة خاصة بهم على الطراز اإلغريمي\nسميت بـ «نمراطيس » بمحافظة البحيرة حاليا .\n وفد الصناع اليونانيون إلى مصر حيث ارتمت صناعة الزجاج واألوانى الفخارية بها ، كما وفد إليها\nالفنانون .\nمما سبق نستنتج أن :\n أن أكثر المحاصيل اليت تحمك فابض في اليونان هي الكروم والزيتون .\n تتفك مدينة إثينا مع ألرب الحضارات في الشرق من حيث النشاط االلتصادي وباألخص التجاري نتيجة\nلمولعها الجؽرافي .\n السبب الربيسي الستيراد اليونانيين للحبوب من الشرق تؤثرهم بالظروف الطبيعية .\n دلل : كانت الظروف الجغرافية لبالد اليونان القديم المحدد األساسي لألنشطة االقتصادية؟\nحيث استؽل اليونانيون :\nجميع المساحات التي يمكن زراعتها من أراضى الوديان والسهول والتي بلؽت :20 فمط من المساحة الكلية لليونان .\nالطبيعة الجبلية في استخراج الرخام والمعادن وتصديرهما . الطبيعة البحرية فى نشاطهم التجارى فتحولت موانا اليونان إلى محطات تجارية لتبادل السلع كما برعوا في صناعة السفن .\nت 01065626600/"],[55,"* بالرغم من اختالف النظم السياسية واالجتماعية بين المدن اليونانية إال أن القاسم\nالمشترك بينها كان فى الحياة الدينية ، حيث :\n آمنوا بموى الطبيعة وزعموا أن لكل منها إلها يوجهها .\n اعتمدوا أن اآللهة أُسرة تُميم فوق لمة جبل األوليمبوس وجعلوها على\nصورة بشر وبذلن تشابهوا مع الحضارة الفينمية .\n* ومن أهم هذه اآللهة : اإلله زيوس (كبير اآللهة اليونانية) .\n* عرفوا الطموس الدينية المتعددة واستعانوا بالموسيمى كعنصر مهم فى أدابها ، ومن هذه الطموس :\n- األناشيد والمرابين .\nالمواكب الجنابزية . * االعتماد في السحر .\nالتواصل الديني بين مصر وبالد اليونان :\nتأثر اإلغريق بالديانة المصرية القديمة دلل؟ حيث أصبحت عبادة اإللهة إيزيس عبادة شابعة في ببلد\nاإلغريك ، لذلن ... عندما جاء اإلسكندر األكبر إلى مصر ، لام بـ :\n- اتخاذ األلماب الفرعونية .\n- تمديم المرابين للمعبودات المصرية .\nاتخاذ شعار لرنى الكبش الممدس لئلله آمون رمزا ً له ( . لتحميك أهداف سياسية) تعددت جوانب الحياة الفكرية ، أهمها :\n-1 الفلسفة :\n* تُعد الفلسفة اليونانية من أعظم ما تركه اليونانيون للفكر اإلنسانى\nحيث أعملوا عمولهم في تحليل مشكبلت الحياة والتعرف على أسرار الكون .\nمن أشهر فالسفة اليونان :\n)1 سقراط\n- لامت فلسفته على إعمال العمل في كل شيء .\n)2 أفالطون - اتسمت مدرسته بالطابع العلمي في التفكير وهو أكثر من تؤثر بالعلوم الطبيعية .\n)3 أرسطو\nأسس مدرسة تعتمد على الفكر التاريخي وعلم األحياء . - أطلك عليه العرب «المعلم األول » ألنه بحث في كثير من العلوم بجانب الفلسفة .\nتدين بالد اليونان في إعمال العقل وتحليل المشكالت إلى اإلسهامات الحضارية لمدينة أثينا .\nت 01065626600/"],[56,"-2 األدب :\n* تميز التراث األدبى اليونانى بالثراء والتنوع ويُعد الشعر أهم ما يمثله ، وقد انقسم إلى :\nشعر المالحم\nمثل ملحمة اإللياذة واألوديسة للشاعر الشهير « هوميروس » صاحب الفضل في نشر\nالتراث الثمافى البطولى لليونان لديما ً الخاصة باألعمال العسكرية .\nالشعر الغنائي الذي يتضمن شعر الحماس والؽزل والرثاء ، ومن أشهر شعرابه «أرخيلوخس» .\n ما الدروس المستفادة : من تأليف هوميروس ملحمة اإللياذة واألوديسة؟\nضرورة تسجيل األحداث التاريخية لتكون مصدرا ً نستمى منه المعلومات السياسية والحضارية .\n-3 التاريخ :\n* تطورت الكتابة التاريخية من شعر المالحم المعتمد على األسطورة إلى الكتابة التاريخية المعتمدة\nعلى الحقائق وتحليلها و من أشهر مؤرخى اليونان الذين كتبوا تاريخ اإلغريق :\nهيرودوت\nبوليبيوس\nاسترابون\n الذي لمب بـ «أبو التاريخ » .\n أحد أعظم المإرخين في المرن الـ 2 ق . م .\nكثيرا عن مصر خاصة في العصر البطلمي .\n كتب\n أشهر ما كتبه كتاب « فى التاريخ العام» .\n زار مصر بين عامى 20 : 25 ق . م .\n أشهر مإلفاته كتاب «الجؽرافيا » الذي يتكون من 17 جز ًءا ، وتحدث عن مصر\nفى الجزء الـ 17 منه .\nمما سبق نستنتج :\n أفاد شعر المبلحم فى ببلد اليونان كل من التاريخ واألدب .\n تشابه كل من استرابون وبوليبيوس في اهتمامه بالحضارة المصرية .\n حدد أوجه النقد لـ : الكتابات التاريخية للمؤرخين اإلغريق؟\n- تعتمد على األساطير .\n- تفتمد إلى المصدالية الكاملة .\nكانت الكتابات :\n- تميل إلى المبالؽة والخيال .\n-4 العلوم :\n* استمد اليونانيون الكثير من أصول العلم من الحضارة المصرية المديمة دلل؟ حيث نجحوا فى تحويل\nالكثير من تجارب وخبرات المصريين المدماء إلى نظريات علمية .\n* تمدمت العلوم فى العصر الذهبي ألثينا خاصة فى مجال الطب حيث توصلوا إلى أن :\n المخ هو المتحكم فى كل أعضاء الجسم وهو مركز اإلحساس .\n الملب هو الذي يضخ الدم في الشرايين .\n*من أشهر األطباء اليونانيين (اإلغريق) : أبو قراط الذى لقب بـ «أبو الطب » .\nت 01065626600/"],[57,"التواصل الثقافي بين مصر وبالد اليونان :\n* حرص كثير من مفكرى اإلغريك وعلماإهم على زيارة مصر وااللتماء بالكهنة العلماء المصريين\nواالطبلع على مكتبات المعابد المصرية لينملوا العلوم المصرية إلى ببلد اليونان .\nعاش الفنان اليونانى «فى خياله » لريبيا من اآللهة يتؤمل عالمهم العلوى وما فيه من ليم ومثل ، ولد عبر\nمظهرا بديعييا انتشر فى :\nعنها في أعماله الفنية التى لم تكرس للمعابد فمط ، بل أصبحت\nأفاريزاألبنية (شريط زخرفي بارز يُشكّل أعلى جدران المباني) . - المبلعب .\n- داخل البيوت .\n- المسارح .\n- تيجان األعمدة .\nجوانب الحياة الفنية تمثلت في :\n-1 العمارة :\n تُعد المعابد من أهم مظاهر النشاط المعمارى اليوناني ، وتطورت من البساطة إلى مستوى رفيع من الفن .\n من أشهر المعابد : معبد البارثنون الذى ألامه الزعيم بركليس على لمة األكروبول لعبادة «اإللهة أثينا »\nعام 447 ق . م ، ويُعد لمة تطور العمارة اليونانية .\n-2 النحت :\nبرع اليونانيون المدماء فى فن النحت ، ويُعد فيدياس «عميد النحاتين » فى اليونان ومن أشهر أعماله\nتمثال زيوس الذي يُعد من عجابب الدنيا السبع مثل حدابك بابل المعلمة بالعراق .\nالتواصل الفنى بين مصر وبالد اليونان :\nيرجع الفن اليونانى (اإلغريقى ) إلى أصول شرقية دلل؟ حيث انتمل الفن من حضارات الشرق\nلهم صبلت لوية بحضارات الشرق المديم ( مصر وسوريا) .\nت 01065626600/"],[58,"* ظهر تأثر الفن اليونانى بالفن المصرى القديم في مجال العمارة دلل؟\n( )1 لصر الملن مينوس .\n( )2 معبد البارثنون : بؤثينا وما به من أعمدة دورية ذات أصول مصرية .\nوهكذا كان الفن المصرى بمثابة الماعدة التى لام عليها الفن اليوناني .\n«معبد البارثنون»\nاستخدم لعبادة ثبلثة أديان ففى عهد المسيحية استبدلت العذراء أثينا آلهة الحكمة والموة والحرب عند\nاإلغريك بالعذراء مريم وأصبح البارثنون في أواخر المرن الخامس الميبلدي أول كنيسة مسيحية بيزنطية\nثم أصبح كاتدرابية كاثوليكية تحت النفوذ الفرنسى ثم أصبح مسجدا تحت الحكم اإلسبلمي التركي عام\n1458 م وهو اآلن متحف مفتوح للدارسين والمستمتعين بالفنون .\n(األلعاب األوليمبية )\n* ألام اليونانيون فى مدينة «أوليمبيا » مباريات رياضية واسعة النطاق تشترن فيها كل المدن اليونانية\nلذلن أطلك عليها «األلعاب األوليمبية » ، وكانت أول دورة لؤللعاب األوليمبية عام 776 ق . م ، ولد\nاكتسبت هذه األلعاب أهمية تاريخية مع مرور الولت (جانب روحي وترفيهي) .\n* استمرت األلعاب األوليمبية لمدة تزيد على 1000 عام ، حتى أولفها أحد األباطرة الرومان ، ثم ظهرت\nمرة أخرى فى نهاية المرن الـ 19 م لتشترن فيها كافة ببلد العالم .\n* شهدت ببلد اليونان نوعا ً ما من الوحدة لبل تولي فيليب الممدوني الحكم من خبلل األلعاب الرياضية .\n دلل : ارتبط اليونانيين بجبل أوليمبوس كان له دافع روحي وترفيهي؟\nالدافع الروحى : كان اليونانيون يعتمدون أن أسرة اآللهة تميم فوق لمة جبل األوليمبوس وأهم هذه\nاآللهة «زيوس» الذي يعد كبير اآللهة .\nالدافع الترفيهى : كانت تمام في مدينة أوليمبيا مباريات رياضية واسعة النطاق تشترن فيها كل المدن\nاليونانية ومن اسم تلن المدينة سميت تلن المباريات باأللعاب األوليمبية .\nت 01065626600/"],[59,"- أهم العوامل التي ساعدت على نشأة الحضارة اإلغريقية وتنوع األنشطة االقتصادية بها :\n• المولع الجؽرافي لببلد اإلغريك والمرب من منبع حضارات الشرق المديم ساعد على التواصل الحضارى\nمعها وااللتباس منها ثم نشرها فى أوروبا فلعبت دور الوسيط الحضاري .\n• الطبيعة التضاريسية والمناخ المتنوع ساهما فى تنوع األنشطة االلتصادية لببلد اليونان .\n- أهم مالمح الحضارة اليونانية القديمة :\n وجود تنوع حضارى فى أكثر من منطمة (أثينا ، إسبرطة ، ممدونيا ، إلخ .)...\n التؤثر بالحضارات المجاورة وخاصة الشرلية في كافة الجوانب .\n التفرد بمعرفة الفلسفة وهى أعظم ما تركه اليونانيون للفكر اإلنساني .\n كونها أولى الحضارات التي عرفت األنشطة الرياضية المنظمة في أعمال جماعية تضم مناطك متعددة في\nعُرف باأللعاب األولمبية .\n التفوق في العلوم الطبيعية والعمارة والذى ظهر من خبلل األعمال اإلبداعية لئلغريك .\n- أهم حضارات بالد اليونان (اإلغريق) :\nسميت\n حضارة كريت : وهى ألدم حضارات اإلغريك وارتبطت بالحضارة المصرية المديمة وتؤثرت بها و ُ\nبالحضارة المينوية ألن كل ملوكها كانوا يحملون لمب مينوس .\n حضارة إسبرطة : والتى عُرفت بنظامها العسكرى الصارم .\n حضارة أثينا : التي عُرفت بنظامها الديممراطى فكانت رابدة الفكر والثمافة فى ببلد اليونان نتيجة حرية\nالفكر واإلبداع .\n- أهم الجوانب اإليجابية والجوانب السلبية للنظام السياسي في إسبرطة :\nتمثلت الجوانب اإليجابية في :\n الموة العسكرية التي مكنتها من السيطرة على ببلد اإلغريك لمدة 200 عام .\n آليات إصدار الموانين والتشريعات ، حيث كان هنان :\nسلطة تشريعية لسن الموانين . جمعية شعبية للتصويت على لوانين مجلس الشيوخ بالرفض أو المبول . تمثلت الجوانب السلبية في :\nعدم تطبيك مبدأ الفصل بين السلطات حيث جمع الملكان بين بعض مهام السلطة التنفيذية( إعبلن الحرب\nوليادة الجيش ) والتشريعية (من خبلل مشاركتهما في عضوية مجلس الشيوخ ورباسة الهيبة المضابية) .\nت 01065626600/"],[60,"مراحل تطور النظام السياسي في أثينا :\nبدأت أثينا بالنظام الملكى ثم النظام األرستمراطى الذى أدى إلى زيادة الفمر فى المجتمع وليام سكانها\nبالثورة (الحران الشعبي ) ضد هذا النظام مما أدى إلى تطوير نظام الحكم ليتحول إلى النظام الديممراطى\nالذى توصلت إليه من خبلل إصبلحات وإصدار عدة تشريعات لام بها حكامها .\nاألثر اإليجابى إلصالحات كل من سولون وبركليس :\n عمل سولون من خبلل ( سلطة التشريع ) على تحسين الحياة االجتماعية للمواطنين من خبلل\nتشجيعه على العمل واإلنتاج وتوفير فرص عمل للعامة وإسماط الديون .\n بلؽت الديممراطية فى أثينا ذروتها أثناء عهد بركليس .\n- أوجه القصور فى ديمقراطية أثينا :\n التصار الحموق االنتخابية والتشريعية على األحرار فمط .\n حرمان النساء من حمولهن السياسية والتشريعية .\n- القواسم المشتركة بين الحضارتين اإلغريقية والفينيقية في النواحى الدينية :\n- تمديس مظاهر ولوى الطبيعة .\n- تصوير اآللهة في صور بشرية .\n- أشهر الفالسفة في بالد اإلغريق :\n سمراط الذي لامت فلسفته على إعمال العمل في كل شيء .\n أفبلطون الذى اتسمت مدرسته بالطابع العلمي في التفكير .\n أرسطو الذى أسس مدرسة تعتمد على الفكر التاريخي وعلم األحياء .\nالقواسم المشتركة بين المدن اليونانية رغم اختالفها سياسييا :\nحيث اشتركت جميع المدن اإلغريمية في :\n النواحي الدينية : حيث اعتمد اإلغريك أن اآللهة أسرة واحدة تميم فوق جبل األوليمبوس وجعلوها\nعلى صورة بشرية .\n األلعاب األوليمبية : التي مثلت أهمية تاريخية ً\nرمزا للوحدة اإلغريمية .\n- أمثلة للتواصل الحضارى بين مصر وبالد اليونان :\nالتواصل السياسي :\n توطدت العبللات بين مصر واليونان فى فترة حكم األسرة الفرعونية الـ .26\n استولى اإلسكندر األكبر على مصر عام 332 ق . م وعمل على مزج الحضارة المصرية المديمة\nبالحضارة اليونانية فيما عُرف بالحضارة الهيلينستية .\nت 01065626600/"],[61,"التواصل االلتصادي :\n اشتؽل بعض اليونانيين بمصر فى العصر المتؤخر بالتجارة وأسسوا فيها مدينة «نمراطيس» .\n وفد الصناع اليونانيون إلى مصر حيث ارتمت صناعة الزجاج واألوانى الفخارية .\nالتواصل الديني :\n تؤثر اإلغريك بالديانة المصرية المديمة وعبدوا اإللهة إيزيس .\nالتواصل الثمافي :\n حرص كثير من مفكرى اإلغريك وعلماإهم على زيارة مصر لنمل العلوم المصرية إلى ببلد\nاليونان .\nالتواصل الفنى :\nي  رجع الفن اليونانى إلى أصول شرلية حيث انتمل من حضارات الشرق إلى ببلد اليونان وظهر تؤثر\nالفن اليوناني بالفن المصرى المديم في مجال العمارة .\nأهم القيم التي سادت الحضارة اليونانية القديمة :\n االنضباط المجتمعى : وظهر ذلن من خبلل دور الرلباء الشعبيين الذين كانوا يرالبون السلون\nواألخبلق ويحفظون األمن في إسبرطة .\n التربية االجتماعية : وظهر ذلن من خبلل إصبلحات بركليس الذى كان مإمنا ً بؤن التربية\nاالجتماعية السليمة هي السبيل الرتماء شعب أثينا .\n الحرية : وظهر ذلن من خبلل حرية الفكر واإلبداع التي تبناها أهل أثينا .\n إعمال العمل : وذلن من خبلل الفلسفة التى توصل إليها اليونانيون وأكد الفبلسفة على إعمال العمل\nفى تحليل مشكبلت الحياة والتعرف على أسرار الكون .\nت 01065626600/"],[69,"اإلسكندر األكبر\n جعل اإلسكندر مصر هدفيا ً له بعد االنتصارات التي حممها على الفرس في\nآسيا الصؽرى وسوريا وفلسطين الستكمال إخضاع الواليات الفارسية لحكمه ،\nلتكوين إمبراطورية ممدونية فتمدم بجيشه إلى مصر ونجح في السيطرة عليها دون لتال عام 332 ق . م .\n لمب اإلسكندر بـ «اإلسكندر األكبر» ألنه كان من أكبر الفاتحين وحمك انتصارات مبهرة .\n أولى الخطوات لئلسكندر لتحميك حلمه (العالم وطن واحد) باالستيبلء على آسيا الصؽري .\nي  رجع ترحيب المصريين بمدوم اإلسكندر لرغبتهم في تؽيير األوضاع السياسية للببلد .\n ترجع انتصارات اإلسكندر على الفرس بسبب ضعف لواتهم العسكرية ومهارة اإلسكندر العسكرية .\nاإلسكندر األكبر في مصر (سياسته) :\n* سعى اإلسكندر األكبر إلى إرضاء الشعب المصرى من أجل تثبيت حكمه فمام بـ :\n إظهار والءه للمعبودات المصرية ، وعلى رأسها «آمون» .\n معاملة المصريين معاملة حسنة .\n اإلبماء على النظم اإلدارية المصرية .\nت 01065626600/"],[70,"بناء مدينة اإلسكندرية :\nولع اختيار اإلسكندر على لرية مصرية لديمة تُسمى\n«رالودة » تمابلها جزيرة صؽيرة في البحر تُسمى\n«فاروس » إللامة مدينة جديدة هي اإلسكندرية ألدم\nالمدن الساحلية بمصر ويرجع سبب االختيار\nلهذا المكان للطبيعة الجؽرافية .\nفسر : بناء مدينة اإلسكندرية؟\nلكي :\n)1 تحمل اسمه مثل عدة مدن أخرى أسسها .\nمركزا لنشر الحضارة اإلغريمية في العالم .\n)2 تكون\n)3 تكون لاعدة بحرية؛ لتدعيم سيطرته على البحر المتوسط .\nتوسعات اإلسكندر األكبر :\n غادر اإلسكندر مصر عام 331 ق . م بعد تخطيطه لمدينة اإلسكندرية متج ًها إلى الشرق لمحاربة\nالفرس (في عمر دارهم) فانتصر عليهم فى العراق وإيران واستولى على أمبلكهم .\n توغل اإلسكندر فى المارة اآلسيوية حتى وصل لحدود الهند مكونيا إمبراطورية عظيمة ، هي :\n«اإلمبراطورية الممدونية» .\nي  تضح من خط سير حمبلت اإلسكندر أن المدينة التي خرجت عن كونها أحد أهدافه التوسعية لرطاجة .\nوفاة اإلسكندر وتقسيم إمبراطوريته\nتوفى اإلسكندر عام 323 ق . م تاركا ً وراءه مملكة كبيرة مترامية األطراف ، ولم يكن له وريثيا للعرش\nوترتب على ذلن أن اجتمع لادة جيش اإلسكندر في بابل فيما عُرف بـ «مإتمر بابل » عام 323 ق . م .\nنتائج : عقد مؤتمر بابل بالعراق؟\nتماسم لادة اإلسكندر اإلمبراطورية الممدونية فيما بينهم كالتالي :\n( )1 مصر : من نصيب بطلميوس بن الجوس (أسس بها دولة البطالمة ) فتؽير الوضع السياسي لمصر .\n( )2 سوريا والعراق : من نصيب سليولس (أسس بها دولة السليوليين) .\n( )3 ببلد ممدونيا : من نصيب أنتيجونس .\nوبذلك سقط مبدأ اإلسكندر األكبر بعقد مؤتمر بابل وهو أن العالم واطن واحد .\nأصبحت مصر دولة مركزية بعد مؤتمر بابل بعد أن كانت مجرد والية تابعة للحضارة اإلغريقية .\nت 01065626600/"],[71,"المراحل التاريخية لدولة البطالمة في مصر تتمثل في :\nالمرحلة األولى ( مرحلة القوة واالزدهار ) ويتمثل ملوكها في :\n-1 بطلميوس األول ( ۳۲۳ ق . م 284 : ق . م ) :\nي  نتمى إلى إحدى العاببلت الممدونية النبيلة .\n دخل في حروب كثيرة لتوطيد حكمه فى مصرحتى أعلن نفسه ملكيا عام 305 ق . م .\n أظهر والبه للمعبودات المصرية وتمديم المرابين لآللهة (أول أعماله بمصر) .\n كون إمبراطورية بطلمية مركزها مصر .\n وضع أسس النظم اإلدارية والمالية فى مصر لتؤسيس دولة لوية ولُمب بـ «المنمذ » .\n االختبلف بين اإلسكندر وبطلميوس األول في تطوير النظم المالية واإلدارية .\n-2 بطلميوس الثاني ( 284 ق . م 246 : ق . م) :\n تولى العرش بعد وفاة والده بطلميوس األول .\n زادت في عهده اهمية موانا مصر الشرلية .\n ظهر في عهده أول اهتمام بالمجال الحيوي الجنوبي خبلل حكم البطالمة .\n دلل : سار الملك بطلميوس الثانى على نهج أبيه في أمور الحكم؟\nحيث :\n أحدث نهضة كبيرة فى شتى المجاالت االلتصادية والثمافية .\n شهد عهده توج ًها نحو شبه الجزيرة العربية والبحر األحمر وأفريميا (مثل حتشبسوت)\nلتحميك أهداف التصادية وعسكرية وسياسية فؤصبحت مصرإمبراطورية كبيرة في عهده .\n-3 بطلميوس الثالث ( 246 ق . م 221 : ق . م) :\n تولى العرش بعد وفاة والده بطلميوس الثانى .\n كان محبا للعلم والثمافة .\n تمتع بصفات حميدة حتى لمب بـ «الخيّر أو الصالح» ألنه أمر بإسماط الضرابب المفروضة على\nاألهالى وفتح صوامع الؽبلل الحكومية لهم أثناءانخفاض منسوب فيضان النيل(أزمة التصادية) .\n كان ألرب الملون لملوب الشعب المصري .\nت 01065626600/"],[72,"المرحلة الثانية ( مرحلة الضعف واالنهيار ) وأشهر ملوكها :\n-1 بطلميوس الرابع ( 221 ق . م ۲۰5 : ق . م)\n* يُعد عهده بداية لمرحلة تدهورحكم البطالمة .\n-2 بطلميوس الخامس( ۲۰۳ ق . م ۱۸۰ : ق . م)\n كان بطلميوس الخامس ً\nطفبل لم يتجاوز السابعة عند وفاة والده بطلميوس الرابع ،\n وانفرد أجاثوكليس بالوصاية عليه وأدار الببلد بما يحمك مصالحه الشخصية مما ترتب\nعليه انهيار الببلد سياسييا والتصادييا وفمد معظم أمبلكها الخارجية(تشابهوا مع ملون الدولة\nاآلشورية) .\n-3 كليوباترا السابعة(آخر ملوك البطالمة) :\n تولت العرش مع أخيها بطلميوس الثالث عشر الذى غرق أثناء حرب اإلسكندرية .\n أجلسها يوليوس ليصربجوار أخيها األصؽر بطلميوس الرابع عشر على عرش مصر ولكنها سرعان\nما تخلصت من أخيها ، لتجلس ً\nبدال منه ابنها من زوجها يوليوس ليصر وبذلن تشابهت كليوباترا مع\nأجاثوكليس في رغبتهم في تحميك مصالح شخصية .\n ما العالقة بين : طوحات كليوباترا وانتهاء دولة البطالمة؟\nحيث :\nكانت تخطط لتصبح ملكة على روما فتحالفت مع ماركوس أنطونيوس (بعد وفاة يوليوس ليصر ) ، ولكنه\nانتحر بعد هزيمته ( على يد المابد الروماني أكتافيوس ) فى معركة أكتيوم البحرية عام 31 ق . م ، وعندما\nعلمت كليوباترا بانتهاء الحكم البطلمى انتحرت عام 30 ق . م وبذلن أصبحت مصر تحت الحكم الروماني .\nالحضارة الهيلينستية ( : والتواصل الحضاري بين مصر واليونان)\nكان اإلسكندريهدف إلى تكوين حضارة جديدة تجمع بين مزايا الحضارات الشرلية العريمة والحضارات\nاليونانية وسميت بـ (الحضارة الهيلينستية ) ، ولتحميك ذلن عمل على :\n)1 فتح أبواب الشرق على مصراعيها أمام اليونانيين لئللامة به .\n)2 ألام بعض المدن الجديدة كاإلسكندرية في مصر وغيرها لتصبح مراكز لنمو تلن الحضارة الجديدة ،\nولتعمل على نشرها في كل مكان .\n)3 استفادت الحضارة الهيلينستية من حضارات ببلدنا العريمة واستمرت هذه الحضارة خبلل عصر\nالبطالمة .\nت 01065626600/"],[73,"وفيما يلي نتعرف أهم جوانب الحضارة الهيلينستية في مصر :\n دلل : يعتبر الحكم البطلمي امتداداً للحكم الفرعوني في بعض الجوانب؟\nحيث :\nحكم البطالمة مصر من خبلل الحكم الملكي الذي ورثوه عن الملون الفراعنة والذي يموم على أن الملن له :\n الحك في تملن كل شيء في مصر .\n كل السلطات التشريعية والتنفيذية والمضابية والدينية .\nوكان يساعد الملن في الحكم :\n- كبير المضاة .\n- وزير المالية .\n طبق البطالمة نظام االحتكار على الحياة االقتصادية ( الزراعة والصناعة والتجارة )\nبم تفسر؟ بهدف إلامة التصاد لوى يجعل الدولة لوية مما يساعدها على التؤثير فى سياسات العالم لذلن\nسيطرت الدولة على جميع نواحي الحياة االلتصادية كما يلي :\n-1 الزراعة :\n اهتم البطالمة بالزراعة باعتبارها الركيزة األولى لالقتصاد المصرى فعملوا على\nالنهوض بها من خالل :\n)1 إصبلح نظم الرى وشك المنوات وإلامة الجسور .\n)2 استصبلح مساحات كبيرة من األراضى الزراعية(ألن الزراعة هي عماد االلتصاد)\n)3 استخدام وسابل الرى الحديثة ، مثل : السالية والطنبور .\n)4 اتباع نظام الدورة الزراعية للحفاظ على جودة األرض وخصوبتها (ليحمك مفهوم التنمية المستدامة)\n)5 االهتمام بزراعة المحاصيل (الممح ، الذرة ، الشعير) .\n)6 استمدام أنواع جديدة من الفواكه وخاصة (العنب ، التين ، الرمان المشمش) .\nمما سبق نستنتج أن :\nي  عد العامل االساسي لنجاح البطالمة في زيادة مساحة األراضي الزراعية هو إدخال وسابل ري\nحديثة .\n هدفت سياسة البطالمة من االهتمام بالزراعة في الممام األول إلى بناء الموة الذاتية للدولة خارجيا ً\nوداخلياً .\nت 01065626600/"],[74,"قسمت األرض الزراعية بمصر فى عصر البطالمة إلى خمسة أنواع هي :\nأراضي الملك\nحيث آلت أراضى ملون الفراعنة إلى ملون البطالمة باعتبارهم ورثة الفراعنة .\nاألراضى المقدسة\nاألراضي التي يمنحها الملون للمعابد ، وتنمسم إلى نوعين :\n- أراضى مخصصة لئلنفاق على المعابد .\n- أراضى مخصصة للكهنة .\nأراضي اإلقطاعات األراضي التي منحها البطالمة للجنود المرتزلة من اإلغريك الذين اعتمد البطالمة\nعليهم في تكوين جيشهم (لكفابتهم العسكرية) .\nالعسكرية\nأراضى الهبات\nاألراضى التى يمنحها البطالمة لكبار موظفيهم .\nأراضى المدن\nاألراضي التي تُخصصها الدولة للمدن التي تتمتع بوضع المدينة اليونانية وهى :\n- نمراطيس .\n- اإلسكندرية .\n- بطلميس .\nمما سبق نستنتج أن :\n حرص البطالمة على ربط الممدونيين واإلغريك بمصر من خبلل منحهم مساحات من األراضي .\n تعتبر مدينة اإلسكندرية أكثر المدن التي أليمت على الطراز اإلغريمي .\n-2 الصناعة :\n كانت مصر منذ القدم موطنيا للعديد من الصناعات وازدهرت الصناعة بسبب\nمهارة المصريين وبراعة اإلغريق من أهمها :\n-1 صناعة الزيوت .\n-2 صناعة الفخار والزجاج .\n-3 صناعة التعدين ولطع األحجار .\n-4 صناعة الجلود .\n-5 صناعة المنسوجات .\n-6 صناعة الورق من نبات البردى .\nأدى اهتمام البطالمة بالصناعة إلى ازدهار حركة التجارة الخارجية .\n-3 التجارة :\n ازدهرت التجارة في عصر البطالمة بسبب :\nمولع مصر الجؽرافي في للب العالم المديم . - ازدهار النشاط الزراعي والصناعي .\nت 01065626600/"],[75," اهتم البطالمة بالنواحى التجارية حيث عملوا على :\n)1 إنشاء الموانا على ساحلى البحرين األحمر والمتوسط .\n)2 إلامة الترسانات لبناء السفن .\n)3 بناء المنارات إلرشاد السفن الهتمامهم بااللتصاد ، مثل : منارة اإلسكندرية .\n)4 تنظيم شبون الجمارن .\n)5 سن العملة لتسهيل التبادل التجاري .\n انقسمت التجارة فى عصر البطالمة إلى نوعين هما :\n( )۱ التجارة الداخلية : سيطرت عليها الدولة عن طريك :\nإحكام رلابتها على األسواق . التدخل في تحديد األسعار وخاصة السلع التي تخضع لسياسة االحتكارمن خبلل تحديد ليمة المنتجات . ( )۲ التجارة الخارجية : انتعشت نتيجة إلنشاء البطالمة :\nعدة موانا على البحرين األحمر والمتوسط وأصبحت اإلسكندرية أكبر الموانا في العالم المديم .\nمما سبق نستنتج أن :\n حاول البطالمة إلامة دولة لوية لادرة على التؤثيرفي سياسات العالم المديم عن طريك السيطرة\nعلى االلتصاد .\n زادت صادرات مصر إلى أوروبا في عهد البطالمة نتيجة إنشاء موانا مصر الشمالية .\n* أراد البطالمة إقامة دولة تقوم على أسس شرقية مع إضفاء الصبغة اليونانية عليها\nفعملوا على :\n)1 الظهور أمام رعاياهم من المصريين فى مظهر الحكام الوطنيين .\n)2 فتح أبواب الببلد على مصراعيها أمام األجانب خاصة الممدونيين واإلغريك ، وذلن من أجل :\nاالعتماد عليهم كؤعوان مخلصين فى تكوين دولة بطلمية حديثة . - االستفادة من توافر رإوس األموال لديهم والخبرات بؤحدث األساليب االلتصادية ونظم التجارة العصرية .\nت 01065626600/"],[76,"* تعددت طبقات المجتمع المصرى فى عصر البطالمة حيث انقسمت إلى :\n)1 المقدونيين\nواليونانيين\nشجعهم البطالمة على االستمرار فى مصر واختصوهم بالوظابف العليا وأغدلوا\nعليهم المنح والهبات .\n)2 يهود اإلسكندرية كونوا جالية كبيرة فى اإلسكندرية ، وكان لهم وضع اجتماعي مميز بسبب\nنشاطهم االلتصادي حيث اشتؽلوا بالتجارة واألعمال المصرفية واإللراض .\n)3 المصريين\nأهل الببلد واألغلبية الساحمة وعماد االلتصاد باعتبارهم األيدي العاملة .\nولكن ... كيف عامل اليونانيون المصريين ؟\nكان اليونانيون يعاملون المصريين معاملة تتسم بالتعالي والتفرلة العنصرية ، ولد تؽير الوضع ً\nلليبل منذ\nعهد الملن بطلميوس الرابع دلل؟ حيث أخذت الدولة تفسح المجال للمصريين لتولى وظابف أعلى وألبل\nالمصريون على تعلم اللؽة اليونانية من أجل تحسين وضعهم االجتماعي وتشكلت منهم فبتين هما :\n( )1 المحاربين : ومن هنا بدأت ثمة البطالمة في الكفاءة العسكرية للمصريين .\n( )2 الموظفين : حيث بدأ المصريون يشؽلون بعض الوظابف في الجهاز اإلدارى .\nالتواصل االجتماعي بين المصريين والبطالمة :\nتؤثر البطالمة اليونانيون بالكثير من مظاهر الحياة المصرية ، فتعلموا اللؽة المصرية وعبدوا اآللهة\nالمصرية واتخذوا أسماء مصرية .\n* أدرك البطالمة أهمية العقيدة الدينية عند المصريين لذلك ...\n* اتسمت سياستهم الدينية بالتسامح الديني واحترام الديانة المصرية دلل؟ حيث :\n)1 لام بطلميوس األول بـ :\nتمديم المرابين لآللهة المصرية فور دخوله مصر ( كما فعل اإلسكندر األكبر) . إعادة تماثيل اآللهة المصرية التى استولى عليها الفرس أثناء احتبللهم مصر . )2 أنشؤ البطالمة العديد من المعابد فى صعيد مصروبُنيت على الطراز المصرى ، وصوروا فيها أنفسهم\nبمبلبس الملون الفراعنة يمدمون المرابين لآللهة المصرية (كل ذلن من أجل تحميك االستمرار السياسي)\nومن هذه المعابد والتى ال تزال شامخة حتى اآلن :\n- معابد فيلة .\n- معبد إدفو .\nت 01065626600/"],[77," اهتم البطالمة بالعلم مما جعل اإلسكندرية تحتل مركز الصدارة وتتفوق على أثينا .\n لام البطالمة بإنشاء دار العلم (جامعة اإلسكندرية) ومكتبة اإلسكندرية\nكبيرا في جذب العلماء والدارسين من شتى أرجاء العالم في مختلف العلوم\nأثرا\nوكان إلنشاءهما ً\nومن هذه العلوم :\nالفلك\nتمدم علم الفلن على يد العالم الرياضي أريستارخوس وهو أول من لام بدراسات نسبية\nألحجام الشمس والممر واألرض .\nالرياضيات من أشهر علماء الرياضيات بدار العلم باإلسكندرية :\n إلليدس : واضع كتاب «األصول» في الهندسة الرياضية .\n أرشميدس : صاحب لانون الطفو .\nالطب\nبرع علماء اإلسكندرية فى التشريح والجراحة ، ومن أشهر العلماء في هذا المجال : هيروفيلوس الذى اكتشف الدورة الدموية واستخدم أداة لمياس سرعة النبض .\n- ساعد وجود حديمة الحيوان التي ألامها بطلميوس الثانى على تطور علم الحيوان .\nالجغرافيا\nكبيرا من جامعة اإلسكندرية بفضل تشجيع البطالمة حيث توصل\nشهدت الجؽرافيا اهتما ًما\nعلمابها للكثير من الحمابك والمبادئ العلمية الجؽرافية ، منها :\n- نظرية دوران األرض حول الشمس .\nالتاريخ\n- لياس محيط الكرة األرضية .\nالعالقة بين : البطالمة والتعرف على التاريخ المصري القديم ؟\nحيث :\nتمكن المإرخ المصرى مانيتون من كتابة تاريخ مصر المديم باللؽة اليونانية حيث لسم\nتاريخ مصر الفرعونية إلى 30 أسرة وهو التمسيم المتبع في عصرنا الراهن .\nاألدب\nكبيرا ولد أُطلك على األدب اليونانى فى عصر البطالمة\nارا ً\nشهد األدب ازده ً «األدب السكندرى» وذلن بسبب ضخامة التراث الثمافي في اإلسكندرية .\n- من أشهر اإلنجازات األدبية : نشر مبلحم « هوميروس » ، وتاريخ « هيرودوت » .\nيرجع الفضل للبطالمة فى الحفاظ على التاريخ السياسي والعسكرى لإلغريق من خالل\nنشر اإلنجازات األدبية والثقافية لإلغريق .\nتوضيح التمييز العنصرى : له عدة أنواع منها معاملة اإلنسان بطريمة غير البمة ألسباب متعددة منها\nأضراره على المجتمع :\nاالختبلف العرلي أو الديني .\nيعمل على تفكين الروابط االجتماعية بين أفراده ي . ولد حالة من عدم االستمرار واالضطهاد والخوف ي .. جعل\nمشاعر الحمد والكراهية هى المسيطرة بين األفراد . . احتمالية حدوث نزاعات داخلية بين أفراد المجتمع .\nت 01065626600/"],[78,"- أسباب اهتمام اإلسكندر األكبر بضم مصر :\n استكمال إخضاع الواليات الفارسية لحكمه بعد انتصاراته على الفرس في آسيا الصؽرى وسورياوفلسطين .\n تكوين إمبراطورية ممدونية .\n- أساليب اإلسكندر األكبر إلرضاء وجذب الشعب المصرى لصفه :\n إظهار والءه للمعبودات المصرية وعلى رأسها آمون (استؽبلل الوازع الديني) .\n معاملة المصريين معاملة حسنة (حيث استوعب الدرس من خطؤ الفرس ) .\n اإلبماء على النظم اإلدارية المصرية (لضمان استمرار األوضاع في مصر ) .\n- أسباب اختيار اإلسكندر لموقع مدينة اإلسكندرية :\nاختار اإلسكندر مولعها على البحر المتوسط لسهولة االتصال مع ببلد اإلغريك موطنه األصلى باإلضافة\nإلى اعتدال المناخ .\n- دوافع اإلسكندر إلنشاء مدينة اإلسكندرية :\n الرغبة في تخليد اسمه كما حدث فى إنشاء عدة مدن أخرى أسسها .\n تكون مركزا لنشر الحضارة اإلغريمية فى العالم ( هدف ثمافى حضارى ) تحت شعار العالم وطن واحد\nوبذلن يكون أول من طبك فكرة العولمة .\n تكون لاعدة بحرية ( هدف عسكرى ) يدعم بها سيطرته على البحر المتوسط .\n- العالقة بين مؤتمر بابل واألوضاع السياسية لمصر :\nنتج عن مإتمر بابل عام 323 ق . م تماسم اإلمبراطورية الممدونية فكانت مصر من نصيب بطلميوس بن\nالجوس الذي أسس دولة البطالمة فتحولت مصر من مجرد والية إغريمية إلى دولة بطلمية (مركز للحكم) .\n- أهم المظاهر الحضارية التى تميزت بها الحضارة الهيلينستية في مصر :\n مثلت تلن الحضارة مزيج يجمع ما بين مزايا الحضارات الشرلية والؽربية\n تميزت تلن الحضارة بالتسامح الدينى وظهر ذلن من خبلل سياستهم الدينية نحو المصريين واحترام\nالديانة المصرية المديمة .\n أسهمت تلن الحضارة فى تطوير عدة علوم مثل الفلن والرياضيات والطب والجؽرافيا .\n- أوجه الشبه واالختالف بين كل من اإلسكندر األكبر وبطلميوس األول :\nي  تمثل وجه الشبه في : إظهار االحترام للمعبودات المصرية ( مما يعنى إدراكهما ألهمية العميدة في\nحياة المصريين) .\nي  تمثل وجه االختبلف في ( : عبللتهما بالنظم المالية واإلدارية بمصر) حيث أبمى اإلسكندر عليها بينما\nوضع بطلميوس األول أسس جديدة للنظم المالية واإلدارية في مصر .\nت 01065626600/"],[79,"- العالقة بين طموح الملكة كليوباترا السابعة ونهاية الدولة البطلمية :\nكانت كليوباترا السابعة تخطط لتصبح ملكة على روما فتحالفت مع ماركوس أنطونيوس والذى انتحر بعد\nهزيمته على يد المابد الرومانى أكتافيوس فى معركة أكتيوم البحرية عام 31 ق . م وبعدها انتحرت\nكليوباترا عام 30 ق . م وتحولت مصر لوالية رومانية (تؽير الوضع السياسى لمصر من دولة بطلمية\nمستملة إلى مجرد والية رومانية) .\n- أهمية دور البطالمة األوائل فى تكوين إمبراطورية بطلمية في مصر :\n أكدت سياسة البطالمة األوابل على لوة دولتهم االلتصادية والعسكرية .\n توجد عبللة بين توسع دولة البطالمة وموارد مصر االلتصادية ، حيث طبك البطالمة نظام االحتكار على\nالحياة االلتصادية بهدف إلامة التصاد لوى يجعل الدولة لوية مما يساعدها على التؤثير فى سياسات\nالعالم وبالتالي توسعها .\n تشابهت أوضاع مصر المزدهرة التصادييا والمستمرة سياسييا خبلل عهدى بطلميوس األول والثانى .\nأهم ابتكارات البطالمة فى مجال الزراعة في مصر :\n استخدام وسابل رى حديثة مثل السالية والطنبور .\n اتباع نظام الدورة الزراعية للحفاظ على جودة األرض استدامة الموارد) .\n استمدام أنواع جديدة من الفواكه مثل : العنب - الرمان - التين - المشمش ) .\n- الهرم االجتماعى بمصر فى عصر البطالمة :\nتعددت الطبمات في المجتمع المصرى فى عصر البطالمة المابم على (التمييز العنصرى ) فمد احتل لمة\nالهرم الممدونيون واليونانيون الذين احتكروا الوظابف العليا ، بينما احتل يهود اإلسكندرية الطبمة الوسطى\nحيث كان لهم وضع اجتماعي خاص نتيجة عملهم بالتجارة واألعمال المصرفية واإللراض بينما احتل\nالمصريون لاعدة الهرم وتمت معاملتهم معاملة تتسم بالتعالى .\n- الدور الثقافى والعلمى لمدينة اإلسكندرية فى العصر البطلمي :\n مثلت مركز إشعاع حضارى لنشر الحضارة الهيلينستية .\n كانت محط أنظار كثير من حكام العالم من أثينا وغيرها ليؤتوا إليها لزيارتها .\n تفولت على أثينا كمركز ثمافى وعلمى بسبب تشجيع البطالمة للعلماء والمفكرين بها .\n كانت جامعة اإلسكندرية ملتمى للعلماء والدارسين الذين أبهروا العالم بإنجازاتهم العلمية المتفردة والتى\nيمتد أثرها حتى اليوم .\n ساهم مانيتون في الحفاظ على اإلرث التاريخى للحضارة المصرية المديمة من خبلل كتابته لتاريخ مصر\nالمديم باللؽة اليونانية .\nكبيرا وهو ما عرف باألدب السكندرى ، مثل إعادة نشر مبلحم هوميروس وتاريخ\nازدهارا\n شهد األدب\nهيرودوت .\nت 01065626600/"],[88,"نشأة روما وتوسعاتها :\nتأسست روما عام 753 ق . م ودخلت فى حروب عديدة من أجل تكوين إمبراطورية\nعظيمة ، من أهم هذ الحروب :\n)1 حروبها مع جيرانها في شبه الجزيرة اإليطالية .\n)2 حروبها مع مدينة قرطاجة :\nوالتي استمرت حوالى 100 عام ( 146 : 264 ق . م) فيما عُرف\nبـ «الحروب البونية » ، والتي سعت إليها روما للسيطرة على غرب البحر المتوسط ، والتي انتهت\nبهزيمة لرطاجة ، لتسيطر روما على شمال غرب أفريميا .\n)3 حروبها مع مقدونيا ، نتج عنها :\n تدخل روما في شبون اليونان .\n تحويل ممدونيا إلى والية رومانية عام 148 ق . م ، ومن بعدها كل ببلد اليونان عام 146 ق . م .\n)4 حروبها في الشرق ، حيث :\n استطاعت روما مد نفوذها إلى سوريا وتحويلها لوالية رومانية عام 64 ق . م .\n سيطرت روما على مصر وجعلتها والية رومانية عام 30 ق . م .\nوبسقوط سوريا ومصر فى أيدى الرومان أصبح البحر المتوسط بحيرة رومانية تحيط به\nأراضى اإلمبراطورية الرومانية من كل الجهات وأصبحت روما سيدة العالم القديم بال منازع .\nت 01065626600/"],[89,"مما سبق نستنتج أن :\n دخلت روما الحروب البونية لتحميك أهداف سياسية والتصادية .\n تشابهت روما ولرطاجة في نظام الحكم السابد .\n بسموط لرطاجة سمطت آخر حضارة ببلد فينيميا .\n زاد نفوذ روما في العالم المديم حتى أصبحت هي الموى العظمى .\n تمكنت روما من السيطرة الكاملة على البحر المتوسط بسموط دولة البطالمة .\n سيطرت روما على شمال غرب أفريميا خبلل الحكم اإلمبراطوري .\n استطاعت روما أن تكون دولة كبيرة في للب لارات العالم المديم بعد معركة أكتيوم البحرية .\n تعتبر الحضارة الرومانية مصبا ً للنهر الحضاري في العالم المديم .\nمظاهر الحضارة الرومانية ( والتواصل الحضاري بين مصر وبالد الرومان)\nكانت روما هي عاصمة الدولة التى نشأت فى إيطاليا وقد مرت بثالث أنظمة\nسياسية للحكم ، وهي : النظام الملكي - النظام الجمهوري - النظام اإلمبراطوري .\n-1 النظام الملكى ( 153 ق . م ۵۱۰ : ق . م)\nنظام قائم على فرد واحد يجمع فى يده كل السلطات ويحكم مدى الحياة ويورث\nالحكم لمن بعده تكون من :\nالملك\n تتركز بيده السلطة العليا فى الشبون الدينية والمضابية والسياسية والعسكرية .\nي  حكم مدى الحياة ، وعمب وفاته يتم اختيار نابب له ليحكم روما لمدة خمسة أيام\nفمط لحين اختيار الملن الجديد .\nمجلس الشيوخ\nي  تكون من 300 عضو من األرستمراطيين .\nسا استشارييا للملن .\nيُ  عد مجل ً\nجمعية األحياء\nي  مثل أعضابها أحياء روما التى كانت ممسمة إلى 30 حى ، ثم اندمجت هذه\nاألحياء لتصبح 3 أحياء .\n تُعد بمثابة مجلس شعبى يجتمع أعضاإه بؤمر من الملن لمنالشة األمور التي تهم\nالشعب .\n(السناتو)\n(سلطة\nاستشارية)\nت 01065626600/"],[90,"نهاية النظام الملكي :\nلرر األرستمراطيون الثورة من أجل تحميك طوحاتهم في السلطة على الملن «تاركوينوس » وسلب\nسلطاته وتوزيعها عليهم بسبب :\n( )2 تعديه على التماليد الرومانية .\n( )1 عدم إحساسه بمعاناة شعبه .\nونتج عن ذلك : إسماط النظام الملكى عام 510 ق . م ، وإعبلن األرستمراطيين النظام الجمهوري وبذلن\nأصبحت السلطة الفعلية في يد األرستمراطيون .\n-2 النظام الجمهورى ( ۵۱۰ ق . م ۲۷ : ق . م) :\nنظام حكم يقوم على أساس تقسيم السلطات وتوزيعها بين هيئات متعددةتكون من\n)1 القنصالن\nهما اثنان من الحكام يُنتخبان سنوييا لمدة عام واحد ويتم اختيارهما باالنتخاب\nالمباشر بواسطة الشعب .\n)2 مجلس الشيوخ ي  تكون من 300 عضو من األرستمراطيين .\nي  موم بإدارة شبون الببلد السياسية والتشريعية وااللتصادية والعسكرية .\n(السناتو)\n اختلف وضعهم عن النظام الملكي في امتبلكهم سلطة اتخاذ المرار .\n)3 جمعية القبائل\nتطورا للجمعية الشعبية .\n تُعد\n كانت تنعمد بنا ًء على دعوة أحد نمباء العامة .\n)4 نقباء العامة\nهم همزة الوصل بين الدولة والعامة (أفراد المجتمع) ، ومهمتهم هي :\n(دور الوسيط)\n نمل مشاكل العامة لحكام المدينة .\n إببلغ العامة بؤوامر الحكومة فكانوا جزء من السلطة التنفيذية .\nديمقراطية روما :\n بم تفسر : فشل القانون الروماني في تحقيق العدالة االجتماعية\nخالل الععصر الجمهوري ؟\nحيث :\n* لم يكن النظام الجمهورى فى روما ديممراطييا بمعنى الكلمة ، فبالرغم\nمن منح النظام الجمهورى للعامة حموليا كفلت لهم المساواة لانونا ً\nمع األشراف إال أنها كانت مساواة شكلية حيث كان العامة يميلون\nالديكتاتورية؟\nتركيز السلطات في يد فرد\nواحد دون االستناد إلى\nلوانين معينة ويخضع له\nالمحكومون بدافع الخوف .\nالنتخاب مرشحين ينتمون ألسر من األشراف وبالتالي استولى األشراف\nعلى جميع المناصب ولم يكن للعامة نصيب منها وبذلن ظل نظا ًما أرستمراطييا .\nيرجع عدم اكتمال الديمقراطية في روما قديماً إلى فقدان العامة للثقة في أنفسهم .\nت 01065626600/"],[91,"-3 النظام اإلمبراطوري ( : عصر اإلمبراطورية الرومانية ) :\n* بدأ بعد سيطرة القائد أكتافيوس على مصر عام 30 ق . م ، وقد منحه مجلس الشيوخ\nلقب « أغسطس » عام 27 ق . م ، وأصبح بذلك أول إمبراطور روماني .\n* أدرك أكتافيوس أن أمن روما القومى يكمن في :\n)1 إنهاء االنمسامات بين المادة العسكريين الرومان والتفافهم حوله .\n)2 إعادة األمن في ربوع اإلمبراطورية الرومانية .\n)3 المحافظة على أمبلن اإلمبراطورية الرومانية في الشمال والشرق .\n)4 تحميك العدالة االجتماعية للمواطنين الرومان .\nمما سبق نستنتج أن :\n الماسم المشترن بين النظام الجمهوري واإلمبراطوري هو انتهاج الفكر التوسعي .\nي  عد العامل المشترن بين أنظمة الحكم الثبلثة سيطرة النببلء على السلطة التنفيذية .\n ساهم حفاظ أكتافيوس على مكتسبات العصر الجمهوري بعد انفراده بحكم روما في تحميك األمن المومي .\nانقسام اإلمبراطورية الرومانية :\nتم تقسيم اإلمبراطورية عام 395 م إلى قسمين كبيرين ، هما :\nاإلمبراطورية الرومانية الغربية\nاإلمبراطورية الرومانية الشرقية\n(الدولة البيزنطية)\nالقسطنطينية\nعاصمتها\nروما\nسقوطها\nسمطت على يد البربر عام 476 م وبذلن\nانتهت آخر حضارات العالم المديم .\nانتهت باستيبلء السلطان العثماني دمحم\nالثاني على مدينة المسطنطينية\nعام 1453 م أي بعد سموط روما بمدة\nتمرب من األلف عام .\nنعمت إيطاليا بأراضى زراعية واسعة وموارد طبيعية وبشرية كبيرة جعلت االقتصاد\nالروماني قائميا على الزراعة والتجارة إلى جانب الصناعة ، يتضح ذلك فيما يلى :\nت 01065626600/"],[92,"-1 الزراعة :\n كانت الزراعة أساس الحياة في روما مثل مصر ، وكان يعمل بها جميع أفراد األسرة وعبيدها .\n كانت الملكية الفردية لابمة فى روما منذ ألدم العصور ، ولد امتلكت الطبمة األرستمراطية مساحات\nواسعة من األراضى الزراعية ، وعمل عند هذه الطبمة أعداد كبيرة من العبيد (وبذلن اختلفت عن\nالملكية الزراعية في مصر وتشابهت مع ببلد اليونان) .\nكان من أهم المحاصيل الزراعية عند الرومان :\nالممح (أهم المحاصيل) بعد أن سيطرت روما على مصرأصبحت مصر مخزن الممح الدابم لئلمبراطورية الرومانية .\n- الزيتون .\n- البمول .\n- الفاكهة خاصة الكروم (العنب) .\n-2 تربية الحيوان :\nلام الرومان بتربية الخنازير ، واألبمار واألغنام من أجل ألبانها ، وأصوافها وجلودها .\n-3 الصناعة :\nكانت أقل أهمية من الزراعة ، وتمثلت الصناعات الكبيرة في :\n)1 الصناعات التعدينية ( : المابمة على المعادن المستخرجة من المناجم) ، مثل :\nصناعة األدوات . صناعة األسلحة من الحديد والرصاص والمصدير . صناعة العملة والمجوهرات من الذهب والفضة . )2 الصناعات الحجرية : المابمة على األحجار المستخرجة من المحاجر لبناء المشروعات المختلفة .\n)3 الصناعات الفخارية : بواسطة مصانع صؽيرة للفخار إلى جانب الصناعات اليدوية .\n)4 صناعات أخرى ، مثل - : صناعة النسيج .\n- صناعة الطوب .\nالصباغة . - النجارة .\n-4 التجارة :\n في العصر الملكي : كانت التجارة لاصرة على تبادل البضابع والسلع بين األلاليم الرومانية .\n في العصر اإلمبراطوري : ازداد النشاط التجاري على يد أغسطس (أكتافيوس) ، بسبب :\n)1 هيمنة اإلدارة المركزية في روما على اإلمبراطورية في الداخل والخارج .\n)2 فتح أسواق جديدة في أفريميا وإسبانيا (جنوب غرب أوروبا) .\n)3 إعطاء الفرصة لمرطاجة لممارسة نشاطها التجاري من جديد(لبلستفادة من خبرات لرطاجة البحرية) .\n)4 تمدم السفن التجارية الرومانية بشكل كبير عن السفن اليونانية .\n)5 تؤمين المبلحة البحرية بفضل لوة األسطول الروماني .\nت 01065626600/"],[93,"وهكذا ... أصبح البحر المتوسط طريما ً داخلييا للربط بين الواليات الرومانية وتحمك ذلن خبلل الحكم\nاإلمبراطوري بسموط دولة البطالمة .\nولد ... استخدم الرومان نموديا خاصة بهم لتسهيل المعامبلت التجارية كانت تُصنع\nمن الفضة أو الذهب أو البرونز .\nمما سبق نستنتج أن :\nي  رجع ازدياد النشاط التجاري في عصر اإلمبراطورية الرومانية إلى االستفادة من خبرات الفينيمين .\n أصبحت التجارة فى البحر المتوسط في جميع اتجاهاته تجارة داخلية بالنسبة للرومان خبلل العصر\nاإلمبراطوري ويدل ذلن على اتساع أراضي اإلمبراطورية الرومانية .\n ساهمت الصناعات المعدنية في دعم االلتصاد واألمن االستراتيجي الروماني وارتبط بها ازدهار\nالتجارة الداخلية والخارجية .\n دلل : تأثر النشاط التجاري في روما قديماً بالنظام السياسي؟\nحيث :\nحيث كانت التجارة فى العصر الملكى لاصرة على تبادل البضابع والسلع بين األلاليم الرومانية داخل إيطاليا\nبينما زادت ونشطت في العصر اإلمبراطوري على يد أغسطس خاصة بعد أن أصبح البحر المتوسط طريميا\nداخلييا للربط بين الواليات الرومانية .\n)1 األشراف\nانقسم المجتمع فى روما إلى عدة طبقات هي :\nهم الطبمة الثرية ومنهم الفرسان ( كبار رجال الجيش ) حيث :\n امتلكوا السلطة والمال واألراضى الزراعية الشاسعة .\n لهم كافة الحموق السياسية .\n)2 التجار والحرفيون\nكبيرا من المجتمع الروماني .\n شكلوا جزءا\n عاشوا حياة التصادية صعبة حيث تضرروا من كثرة حروب روما .\n أكثر العصور استمرارا ً لهذه الطبمة هو العصر اإلمبراطوري .\n)3 العامة والمزارعون\nدخلوا في صراع سلمى ضد األشراف «األرستمراطيين » بهدف الحصول\nعلى حمولهم السياسية واالجتماعية ، واشتركوا في ذلن مع طبمة التجار ،\nوالحرفيين وحمموا إنجازات كبيرة .\n)4 العبيد\n هم أسرى الحرب الذين فمدوا كافة حمولهم االجتماعية والسياسية ، ولد\nشكلوا أزمة حميمية داخل المجتمع الروماني نتيجة للسياسة الخارجية لروما\n جاء أول ظهور للعبيد ذو األصول الشرلية خبلل العصر الجمهوري .\nت 01065626600/"],[94," دلل : أثر الحروب البونية على األوضاع االجتماعية واالقتصادية لروما؟ حيث :\nاجتماعييا : معاناة المجتمع الرومانى من هذه الحروب خاصة التجار والحرفيون والعبيد الذين عاشوا حياة التصادية صعبة نتيجة طول مدة الحرب والتي استمرت لمدة مابة عام .\n- التصادييا : فتح أسواق جديدة بعد انتصار روما على لرطاجة وسيطرتها على شمال غرب أفريميا .\n تعددت معبودات الرومان ، وكان من أهمها :\n المعبود جوبيتر : كبير المعبودات عند الرومان والذى يمثل السماء الصافية .\n عبادة األباطرة ، مثل : أغسطس ، تيبريوس والتي سمطت بعد انتشار الديانة المسيحية وبذلن\nظهر تؤثير السياسة على المعتمدات الدينية خبلل العصر اإلمبراطوري .\nصا أو\n لم يكن للكهنة طبمة مميزة عن غيرهم من الطبمات االجتماعية ولم تتطلب وظيفتهم إعداديا خا ً\nتمرينا ً وممارسة وهو دليل على مدى ارتباط الدين بالدولة .\nالتواصل الدينى بين مصر وبالد الرومان :\n* تأثر الرومان باإلغريق (الذين تأثروا بالحضارة المصرية القديمة ) فانتقلت إلى روما\n، الكثير من معتقدات اإلغريق الدينية وكذلك المصرية مثل :\n عبادة بعض المعبودات المصرية المديمة فمد تسامح الرومان مع المعبودات األجنبية\nوألاموا لها المعابد الدينية ، مثل :\n اإلله سرابيس (المعبود المصرى اإلغريمي) .\n اإللهة إيزيس (المعبودة المصرية العالمية ) واإلله أوزوريس .\n عبادة بعض األباطرة الرومان نتيجة تؤثرهم بظاهرة تمديس الفراعنة في مصر المديمة وانتهت بعد ذلن\nهذه العبادة بعد انتشار المسيحية (ديانة سماوية) .\nاستخدم الرومان اللغة الالتينية لغة رسمية للدولة ومن ثم انتشرت في بقية أنحاء\nالدولة الرومانية .\nت 01065626600/"],[95,"-1 الشعر :\n* ازدهر الشعر خاصة فى العصر اإلمبراطوري خالل عهد أغسطس دلل؟\nحيث ظهر فى عهده «فرجيل » أعظم شعراء الرومان الذى خلد لصة تؤسيس روما .\n-2 التاريخ :\nكان هنان بعض المإرخين من أصل رومانى تم تصنيفهم ضمن مإرخى اليونان ألنهم كتبوا التاريخ\nباليونانية ، مثل « : استرابون» و من أشهر المؤرخين :\nإينوس : لمب بؤبى التاريخ الروماني ، كتب حوليات (مإلفات تاريخية) لملون روما وحكامها .\nكاتو الرقيب : تميز عن بالي مإرخي الرومان المدماء وذلن لـ :\n أول مإرخ روماني كتب بالنثر البلتيني .\n من مإلفاته المهمة فى التاريخ «األصول » ويتحدث عن تؤسيس مدينة روما .\nتشابهت إسهامات كل من الشاعر فرجيل والمؤرخ كاتو الرقيب في تأريخهم\nاألحداث هامة للحضارة الرومانية تتعلق بالعصر الملكي .\nتتمثل في :\n-1 العمارة :\n بلؽت العمارة عند الرومان درجة كبيرة من اإلتمان حتى أصبحت أهم مظهر فنى للدولة الرومانية والتي\nكانت مزي ًجا من العمارة اليونانية والمصرية وتدل البمايا األثرية على مدى التفاعل الحضاري بين\nالحضارات .\n أنشؤ الرومان أكثر المدن روعة فى التاريخ وهى مدينة روما التي تميزت بالعديد من المنشآت الضخمة\nكالمعابد والمصور والحمامات وألواس النصر .\n المنشآت المعمارية في روما ومن أمثلتها :\n مبنى الكوليسيوم .\n البانثينون الرومانى والذى يظهر فيه التؤثر بالعمارة اليونانية .\nت 01065626600/"],[96,"-2 النحت :\n تميز بالوالعية الشديدة وابتعد عن المبالؽة والخيال خاصة فى نحت التماثيل الشخصية ، مثل :\n- تمثال بومبي .\n- رأس ليصر ( من حجر البازلت) .\n تفوق الرومان فى النموش البارزة على الجدران واألعمدة واستخدمت كزخارف وزينة ، مثل :\n نموش عمود تراجان .\n زخارف الصلصال المحروق على جدران المعابد التى تجلى فى نحتها دلة العمل والتعبير عن الشعور .\n النموش الموجودة على ألواس النصر( من روابع النحت الرومانى ) التى كانت تمام تخليديا\nالنتصارات المادة العظام واألباطرة وأجملها : لوس اإلمبراطور تيتوس .\n-3 التصوير (الرسم) :\n انتمل فن التصوير اإلغريمى إلى اإلمبراطورية الرومانية بانتمال الرسامين اإلغريك إلى روما عاصمة\nاإلمبراطورية .\nانتشارا عند الرومان وذلن لـ :\n ازدهر فن التصوير المديم وازداد\nحاجة المسكن الروماني إلى تجميل حوابطه من الداخل ، فمد استخدم النببلء الرومان المصورين اإلغريك\nفى تزيين جدران لصورهم بالرسوم الملونة لتنمل الطبيعة والحياة من خارج المسكن إلى داخله كما اهتموا\nبزخرفة أرضيات الحجرات بلوحات من الفسيفساء الملون التي تحمل مناظر معبرة .\nالتواصل الفنى بين مصر وبالد الرومان :\n ألام الرومان باإلسكندرية العديد من المنشآت المعمارية التي تؤثرت بالحضارة اإلغريمية والمصرية مثل :\n- البوابات .\n- المسارح .\n- المعابد .\n تؤثر النحت الرومانى بالنحت المصرى والدليل على ذلن العثور على تمثال روماني من الرخام يعود\nللمرن الثانى الميبلدى منحوت على هيبة مصرية .\nت 01065626600/"],[97,"- أهم مقومات نشأة الحضارة الرومانية :\n الموة العسكرية لروما : والتي مكنتها من السيطرة على معظم الحضارات المديمة لتستفيد من\nإنجازاتها وتضيف عليها .\n توافر الموارد الطبيعية : كاألراضى الزراعية الواسعة والمعادن المستخرجة من المناجم والتي\nساعدتها على ازدهار النشاط الزراعي والصناعي .\n المولع الجؽرافي المتميز : بين لارات العالم المديم الذي ساعدها على ازدهار النشاط التجاري .\n- أهم األحداث التاريخية للحضارة الرومانية :\n تؤسست روما عام 753 ق . م ثم دخلت حروب مع جيرانها فى شبه الجزيرة اإليطالية .\n الحروب البونية 146 : 264 ق . م أول الحروب الخارجية لروما مع لرطاجة للسيطرة على غرب\nالبحر المتوسط .\n حروب روما مع ممدونيا حتى تحولت إلى والية رومانية عام 148 ق . م .\n حروب روما في الشرق حتى سيطرت على سوريا عام 64 ق . م ثم مصر عام 30 ق . م .\n- أوجه النقد لنظام الحكم الملكي في روما :\n ساد الحكم الفردي المطلك بالوراثة .\n عدم األخذ بمبدأ الفصل بين السلطات .\n- أسباب نهاية النظام الملكي في روما :\nتسببت الطموحات الشخصية لؤلرستمراطيين فى لرارهم بالثورة على الملن تاركونيوس وسلب سلطاته\nوتوزيعها عليهم وذلن بسبب عدم إحساسه بمعاناة الشعب وتعديه على التماليد الرومانية .\n- العامل الرئيسى لتطور نظام الحكم في روما :\nلعب األرستمراطيون الدور األبرز في تؽيير نظام الحكم في روما من النظام الملكى إلى النظام الجمهورى ،\nكما منح مجلس الشيوخ المكون من األرستمراطيين لمب أغسطس ألكتافيوس عام 27 ق . م وبذلن تحول\nالحكم إلى النظام اإلمبراطوري .\n- أسباب عدم اكتمال الديمقراطية فى روما خالل العصر الجمهورى :\nميل العامة النتخاب مرشحين ينتمون ألسر من األشراف وبالتالى سيطر األشراف على جميع المناصب ولم\nيكن للعامة نصيب منها وبذلن ظل نظا ًما أرستمراطييا .\n- مظاهر اهتمام أكتافيوس (أغسطس) باألمن القومى لروما :\n توحيد الصف من خبلل إنهاء االنمسامات بين المادة العسكريين\n نشر األمن والمحافظة على أمبلن اإلمبراطورية الرومانية ( مكاسب العصر الجمهورى) .\n تحميك العدالة االجتماعية للمواطنين الرومان .\nت 01065626600/"],[98,"- أهم المظاهر الحضارية لروما قديميا :\n انتعاش الحياة االلتصادية بسبب امتبلن إيطاليا لمساحات واسعة من األراضى الزراعية بجانب تنوع\nالموارد الطبيعية والبشرية مما جعل االلتصاد الرومانى لاب ًما على الزراعة والتجارة إلى جانب\nالصناعة .\n التؤثر المباشر والكبير بالحضارة المصرية واإلغريمية فى الجوانب الثمافية والعلمية والفنية من خبلل\nالمزج الحضاري .\n ازدهار الفن المعمارى وتنوع مظاهره .\n تعدد معبودات الرومان بداية من المعبودات الوضعية حتى عبادة األباطرة .\n- العالقة بين العصر اإلمبراطورى وازدهار التجارة الخارجية لروما :\nازداد النشاط التجارى على يد أغسطس بسبب هيمنة اإلدارة المركزية على اإلمبراطورية الرومانية فى\nالداخل والخارج ، تؤمين المبلحة البحرية ، فتح أسواق جديدة في أفريميا وإسبانيا ( الجنوب والؽرب ) ،\nإعطاء الفرصة لمرطاجة لممارسة نشاطها التجاري باإلضافة لتمدم صناعة السفن التجارية الرومانية عن\nالسفن اليونانية .\n- العالقة بين السياسة الخارجية لروما والطبقات االجتماعية :\n عانى التجار والحرفيون وعاشوا حياة التصادية صعبة وتضرروا من كثرة حروب روما .\n شكل العبيد وهم أسرى الحروب لاعدة الهرم االجتماعى ألنهم فمدوا كافة حمولهم االجتماعية\nوالسياسية وشكلوا أزمة حميمية داخل المجتمع الروماني .\n- تأثر الحياة الدينية عند الرومان بالعقيدة المصرية القديمة :\n• عبد الرومان بعض المعبودات المصرية المديمة مثل اإلله (سرابيس ) المعبود المصرى اإلغريمى\nوعبادة اإللهة إيزيس المصرية واإلله أوزوريس ، كما انتشرت عبادة بعض األباطرة الرومان نتيجة تؤثرهم\nبظاهرة تمديس الفراعنة في مصر المديمة .\n- العالقة بين العمارة الرومانية والحضارات القديمة األخرى .:\n• كانت العمارة الرومانية على درجة كبيرة من اإلتمان حتى أصبحت أهم مظهر فنى للدولة الرومانية كما\nكانت مزي ًجا من العمارة المصرية واليونانية وهو ما يدل على التفاعل الحضاري بين الحضارات مثل مدينة\nروما وما بها من منشآت ضخمة كالمعابد والمصور والحمامات وألواس النصر .\nت 01065626600/"],[106,"* تمتعت مصربمركز خاص عن بقية الواليات الرومانية ، بسبب (: أسباب اقتصاديةواستراتيجية)\n أهمية مولعها الجؽرافى فى ملتمى لارات العالم المديم والمتحكم في طرق التجارة آنذان .\n إمدادها لروما بالممح البلزم إلطعام سكانها حيث كانت مصر مخزن الممح الدابم لئلمبراطورية .\nأحوال مصر تحت الحكم الروماني : تمثلت في :\n* كان النظام السياسي المتبع فى اإلمبراطورية الرومانية يقضى بأن يحكم الواليات\nقنصل سابق ، ولكن نظريا ألهمية مصر االقتصادية والجغرافية قرر اإلمبراطور«أغسطس» :\n أن يكون حاكم مصر :\n تابعيا له ويتلمى األوامر منه مباشرة من مدينة روما .\n من طبمة الفرسان الموالية له (كبار رجال الجيش) .\n ذو كفاءة إدارية ومالية وخبرة عسكرية .\n حظر على أى شخص من أعضاء السناتو دخول مصر إال بإذن من اإلمبراطور مباشرة .\n*التقسيم اإلدارى لمصر :\n* غيرت التقسيم اإلداري لمصر من أجل السيطرة واالستقرار ولتحقيق مصالح اقتصادية\nوسياسية وقسمت مصر إدارييا إلى ثالثة أقسام يرأس كل منها حاكم روماني ، وهي :\n( )۱ مصر السفلى\nتشمل\nالوجه البحرى .\n( )۲ مصر الوسطى\nتشمل\nالقسم الشمالى من الوجه القبلى .\n( )۳ مصر العليا\nتشمل\nالقسم الجنوبي من الوجه القبلى .\nكانت مصر بالنسبة للرومان مورد اقتصادى كبير ينعش الخزانة الرومانية بالمال والغالل\nلذلك حاول الرومان النهوض بالمجاالت االقتصادية فى مصر لالنتفاع بمواردها وخبرات\nالمصريين ، ويتضح ذلك فيما يلى :\nت 01065626600/"],[107,"-1 الزراعة : اهتم بها الرومان فقاموا بـ :\n)1 حفر ترع جديدة وتطهير الترع المديمة .\n)2 زيادة المحاصيل الزراعية ، خاصة الممح .\n)3 ضبط مياه النيل .\n)4 زيادة محاصيل الفواكه والخضراوات ونبات البردى ونباتات الزينة .\n-2 الصناعة :\nاهتم الرومان بالصناعات وخاصة التى أتقنها المصريون منذ أيام الفراعنة ، ومن أهمها :\n)1 صناعة ورق البردى الذى كانت مصر مصدره الوحيد في العالم (التصر وجودها في مصر) .\n)2 صناعة النسيج من الكتان ويُعد من أجود أنواع األلمشة آنذان والمنسوجات الصوفية .\n)3 صناعة األوانى الفخارية واألدوات المنزلية .\n)4 صناعة الزيوت والعطور والعمالير الطبية .\n)5 صناعة الحلى الذهبية والفضية وتصنيع المعادن .\n)6 الصناعات الزجاجية والخشبية (ارتمت وازدهرت بسبب تشجيع الدولة للصناعة) .\nهادريان يتحدث عن مدينة اإلسكندرية( ۱۷ ام ۱۳۸ : م)\nزار اإلمبراطور الرومانى هادريان اإلسكندرية فى المرن الـ 2 م ، وتحدث عنها ً\nلاببل : إنها مدينة غنية\nتتمتع بالثراء والرخاء ، ال يوجد بها عاطل عن العمل فهنان من يعمل فى صناعة الزجاج وآخرون فى\nصناعة البردى أو النسيج أو أى حرفة أخرى ، الكل يعمل حتى أصحاب العاهات من العجزة والعميان ،\nوحتى الذين فمدوا أيديهم ال يمضون حياتهم عاطلين .\nالمؤرخ استرابون\nزار مصر فى أوابل العصر الرومانى ولد ذكر أن صانعى الزجاج باإلسكندرية كانت لديهم أسرار خاصة\nبهذه الصناعة ، كما أن تربة مصر كانت تحتوى على مادة معينة تصلح بوجه خاص لصناعة الزجاج\nمتعدد األلوان» وهذا يدل على كفاءة واتمان الصانع .\nت 01065626600/"],[108,"-3 التجارة : انقسمت فى مصر تحت الحكم الروماني إلى نوعين هما :\n( )۱ التجارة الداخلية :\n اهتم بها الرومان فماموا بتحسين الطرق وتمهيدها .\n مارسها سكان مصر فى عهد الرومان بكل حرية .\n تُعد أكثر الفبات المصرية التي استفادت من النشاط االلتصادي للرومان التجار .\n دلل : تناقضت سياسة الرومان مع البطالمة في التجارة الداخلية في مصر؟\nحيث مارس سكان مصر التجارة الداخلية بكل حرية في عصر الرومان بينما كان البطالمة يتبعون نظام\nاالحتكار من خبلل مرالبة األسواق والتدخل في تحديد األسعار .\n( )۲ التجارة الخارجية :\n أشرف عليها الرومان إشرافيا كامبل حيث كانت اإلدارة الرومانية ترسل ممثلين لها مع السفن التجارية\nفي البحرين المتوسط األحمر ومثلت اإلسكندرية أهم المراكز االلتصادية خبلل حكم الرومان .\n أعاد الرومان حفر المناة التى تصل بين النيل والبحر األحمر لتنشيط التجارة .\nوقد استفاد الرومان من هذه الموارد عن طريق فرض الضرائب\nالضرائب :\nكانت أهم ما سعى إليه الرومان فى مصر ولذلك وضعوا نظام ضرائب في منتهى\nالدقة (لم يسمع عنه فى العالم القديم كله ) حتى يتمكنوا من تحصيل أية مبالغ من\nاألهالى للدولة حيث :\n( )1 استخدموا نظام اإلحصاء السكانى (التعداد السكاني) الذى يحدد أعداد السكان وأعمالهم وأنواعهم .\n( )2 فرضوا على سكان مصر أكثر من 200 نوع من الضرابب .\n( )3 استحدثوا نظام الخدمات اإللزامية ، وهى أعمال تُفرض على األهالي بدون ممابل .\nمما سبق نستنتج أن :\n لامت سياسة الرومان المالية وااللتصادية في مصر على مبدأ هو استؽبلل أكبر لدر من الموارد\nالمتاحة .\n نجح الرومان في استنزاف موارد مصر من خبلل إعداد لواعد بيانات سكانية .\n وضع الرومان لنظام الضرابب في منتهى الدلة يدل على استؽبلل الرومان للمصريين .\n نستنتج من دراسة أحوال مصر االلتصادية في ظل حكم الرومان وفرة ممومات النهضة االلتصادية .\n اختلف حكم الرومان لمصر عن الحكم البطلمي في عمل حصر للموارد البشرية .\nت 01065626600/"],[109,"انقسم المجتمع فى مصر تحت الحكم الرومانى إلى عدة طبقات ، هي :\n)1 الرومان\nتكونت من :\n الوالى : كان على رأس الهرم االجتماعى ، ويميم فى اإلسكندرية\nويساعده حكام المديريات .\n الجنود الرومان : جنود الحاميات الرومانية الذين عاشوا فى مصر\nوتضم الفرسان والمشاة وأكثر رموز الحكم الروماني انتشاراً .\n المواطنون الرومان : الذين لدموا إلى مصر للتجارة نظرا لثرابهم\nواستثمار أموالهم ولد تمتعوا بكافة االمتيازات المالية والمانونية في\nمصر .\n)2 إغريق المدن األربعة\n شكلوا الطبمة الوسطى ولد تمتعوا ببعض االمتيازات أهمها عدم دفع\nضريبة الرأس (الجزية) امتياز التصادي ومالي .\n سكنوا المدن األربعة ، وهي :\nنمراطيس ، واإلسكندرية ، وبطلميس ، وأنطينوبوليس .\n)3 اإلغريق في الريف\n انتشروا في عواصم األلاليم .\n عملوا فى التجارة واألعمال المصرفية وشؽلوا المناصب العامة في\nالدولة .\n)4 اليهود\n اشوا في أحياء مخصصة لهم ، مثل ( : الحى الرابع باإلسكندرية) .\n كانوا أصحاب رإوس أموال ويعملون فى التجارة والبنون والمراباة .\n)5 المصريون\nي  مصد بهم كل من كان يعيش فى أنحاء مصر وليس من الفبات السابمة .\n. فرضت عليهم كافة األعباء الضريبية .\n ليست لهم حموق لانونية .\nالمصرى\nمما سبق نستنتج أن :\nيُ  عد الحكم الروماني امتداد للحكم البطلمي وظهر ذلن في احتفاظ اإلسكندرية بدورها السياسي واتبعوا\nأيضا ً سياسة التفرلة العنصرية .\n تعد اإلسكندرية أكثر المدن تنوعا ً في أجناس سكانها .\n من تحليل الطبمات االجتماعية بمصر في عصر البطالمة والرومان تراجع مكانة سكان اليونان .\n اختلف ترتيب اليهود في الالهرم االجتماعي خبلل عصري البطالمة والرومان ولكن اتفموا في ممارسة\nاألعمال المالية وسكنوا اإلسكندرية ألنها ميناء تجاري هام .\nت 01065626600/"],[110,"كان ال يُسمح ألى أحد من فئة سكانية أن يرقى إلى الفئة األعلى إال بقانون\nيصدر من اإلمبراطور نفسه وهذا يدل على استمرار تدني أوضاع المصريين وإذا تم إلغاء\nالقانون سيؤدي إلى قلة خزينة الموارد الرومانية .\nتمثلت في :\n-1 عبادة األباطرة :\n اعتبر المصريون اإلمبراطور هو الوريث الشرعى للملن الفرعونى والبطلمى حيث استبدلوا عبادة الملون\nالبطالمة بعبادة األباطرة الرومان .\n ظهر التؤثير الحضاري الفرعوني على كل من البطالمة والرومان من خبلل تمديس الملون واألباطرة .\nهادريان في زيارة لمصر\nألام اإلمبراطور الرومانى هادريان « 117 م 138 : م» معبدا لئلله السكندرى «سرابيس » المعبود(تسامح\nديني) المصرى اإلغريمي كما زار مصر ولام برحلة إلى الصعيد عن طريك نهر النيل ووصل إلى األلصر ،\nوأثناء عودته غرق صديمه أنطينوس فى النيل فحزن عليه اإلمبراطور وأمر بتشييد مدينة فى مكان\nالحادث تحمل اسمه ، وهي مدينة « أنطينوبوليس » وهى مدينة الشيخ عبادة اآلن تجاه مدينة ملوى\nبمحافظة المنيا .\n-2 الديانة المسيحية :\nكانت أهم متؽير دينى فى المرون الثبلثة األولى الميبلدية .\nولكن ... كيف ظهرت المسيحية ؟ وكيف دخلت مصر ؟\n* ظهورها :\nولد السيد المسيح (عليه السبلم) فى بيت لحم بفلسطين في عهد اإلمبراطور الرومانى\nأكتافيوس«أغسطس» وأخذ يبشر لئليمان باهلل الواحد والمحبة والسبلم واإلخاء والتسامح .\n* دخولها مصر :\n دخلت المسيحية مصر على يد المديس مرلس فى منتصف المرن األول الميبلدي في عهد اإلمبراطور\nالرومانى نيرون ( 54 م 68 : م) .\n ألبل المصريون على اعتناق المسيحية ألنهم وجدوا فيها مبادئ سامية وخبلصا ً لهم من والعهم\nالمضطرب والمهر والذل الذى عانوا منه تحت الحكم الروماني .\nت 01065626600/"],[111,"االضطهاد الروماني للمسيحيين\n تعرض السيد المسيح (عليه السالم) وأتباعه لالضطهاد الروماني بم تفسر؟ ألن :\n مبادئ المسيحية تخالف الوثنية .\n المسيحيون رفضوا تمديس صورا صور األباطرة الرومان .\n نشأت الرهبنة المسيحية في مصر وانتشرت األديرة بسبب محاوالت المسيحيين\nاالبتعاد عن بطش السلطة الحاكمة .\nوقد .... . اختلف موقف األباطرة الرومان من المسيحية كالتالي :\nاإلمبراطور نيرون ( 54 م )568 : بلػ االضطهاد للمسيحية في عهده إلى حد كبير .\nاإلمبراطور دقلديانوس\n( 284 م 305 : م)\nاإلمبراطور قسطنطين\nاإلمبراطور ثيؤدوسيوس األول\n( ۳۷۸ م 395 : م)\n لام بإصدار مرسوم يمضى بـ :\nحرق الكتب الممدسة . هدم الكنابس . إعدام من يتبع التعاليم المسيحية .  سمى عصره بعصر الشهداء بسبب ما تعرض له المصريين من\nحركة اضطهاد .\n لذلن اتخذت الكنيسة المبطية فى مصر من عام 284 م بداية\nللتمويم المبطى تخليدا ً لتاريخ شهدابها .\n األلباط كلمة تطلك على المصريين جميعيا .\nلام بإصدار مرسوم ميبلن عام 313 م ( مرسوم التسامح مع\nالمسيحيين) والذي أعطى الحرية الدينية للمسيحيين وأصبحوا\nيمارسوا شعابرهم في العلن .\nلام بإصدار مرسو ًما بإلؽاء الوثنية واالعتراف بالمسيحية ديانة\nرسمية للدولة .\n دلل : تناقض موقف الرومان من الحياة الدينية للمصريين وفقاً لمصالحهم؟ حيث :\nتسامحوا مع المعتمدات والمعبودات المصرية المديمة والبطلمية ولكن مع اعتناق المصريين للمسيحية بدأ\nاالضطهاد الروماني لرفضهم تمديس صور األباطرة الرومان .\n*خالل العصر الرومانى ظلت اإلسكندرية مركزا للعلم ، دلل؟ حيث :\nازدهر بها الكثير من العلوم خاصة :\nالطب ، فمد احتفظت اإلسكندرية بشهرتها ومكانتها في علم الطب . الجؽرافيا . التاريخ . الميكانيكا . الهندسة . الفلسفة \"تحليل مشكبلت الحياة\" ، ومن أشهر فبلسفتها « أفلوطين » وهو مصرى من أسيوط عاش في المرن الـ 3 م .\nت 01065626600/"],[112," اقتصرت الدراسات األدبية على نشر وشرح األعمال األدبية القديمة .\n استمرت اإلسكندرية في عصر الرومان من أعظم موانئ البحر المتوسط وأعرقها حضارة .\n قامت المدرسة المسيحية باإلسكندرية بدور فعال فى إثراء الحياة الثقافية وانتشر األدب\nالقبطي الذي اتخذ شكل مواعظ تتعلق باألمور الدينية ، مثل :\nلصص المديسين . - شرح الكتاب الممدس .\nكان الؽرض منها الحث على الفضابل ومكارم األخبلق .\nتراجم (سير ) شهداء األلباط . ولكن ... لم يدم ازدهار منشآت اإلسكندرية الثقافية والعلمية طويال دلل؟ حيث\nلام الرومان بتدمير المدينة عدة مرات بما فيها دار العلم والمكتبة نتيجة لميام ثورات واضطرابات بها .\nاشتملت األديرة فى مصر على مراكز علمية ممتازة لعلوم الكنيسة ، وقام الرهبان بها\nبدور فعال في نسخ المخطوطات ومن أهمها الكتاب المقدس وقوانين الكنيسة وغيرها .\nالتواصل الثقافى بين مصر وبالد الرومان :\nلام الرومان بتعديل تمويمهم المديم الذى كان يمسم السنة إلى عشرة أشهر ليصبح كالتمويم المصرى الذى\nشهرا ألنه التمويم األهم الذى يعتمد على السنة الشمسية التي تتكون من ي 365 وما\nيتكون من اثنى عشر\nوربع اليوم وبذلن استفاد الرومان من التراث العلمى للمصريين المدماء خاصة فى مجالى الفلن والطب .\n دلل : كان االضطهاد الروماني للمسيحيين سبباً في ازدهار الحياة الثقافية في\nمصر؟\nحيث : انتشر األدب المبطي الذي اتخذ شكل مواعظ تتعلك باألمور الدينية ، مثل :\n- لصص المديسين .\n- تراجم (سير) شهداء األلباط .\n دلل : أثرت األوضاع السياسية على الحياة الثقافية باإلسكندرية أثناء الحكم\nالروماني؟ حيث : نتج عن ليام الثورات واالضطرابات في مدينة اإلسكندرية ليام الرومان بتدميرها عدة\nمرات بما فيها دار العلم والمكتبة .\nت 01065626600/"],[113,"خبلل العصر الرومانى ظلت الفنون مزدهرة فى مصر والدليل على ذلن ما عثر عليه فى مدينة اإلسكندرية\nوال يزال معروضيا حتى اآلن بالمتحف اليونانى الرومانى ، ولد انمسمت الفنون إلى لسمين ربيسيين هما :\nفن الطبقة الحاكمة يتمثل في :\n تماثيل األباطرة الرومان والنموش التي زينت بها جدران التوابيت الحجرية .\nالفن الشعبي يتمثل في :\n آالف التماثيل الصؽيرة واألوانى الفخارية والحجرية والمعدنية التي تزخر بها المتاحف .\n استخدام الفسيفساء وهذا دليل على تؤثرالمصريين بالحضارة الرومانية والذى كُثر فى األرضيات\nبوجه خاص ، وكانت تمثل صور أشخاص وحيوانات منها الحميمي ومنها الخيالي .\nوقد ... ظهر نوع جديد من الفن بعد ظهور المسيحية هو :\nالفن القبطى : فن عبر عن الديانة (المسيحية) في إطار الموروث من الفن المصرى\nوالشرقي ويدل على تنوع مظاهر الثقافة و العمارة المصرية .\nتمثل في الكنابس واألديرة المديمة ولد ظهر فيها تؤثر الفنان المبطى بخصابص الفن المصرى المديم في\nالتصوير والرسم التشكيلي والنحت والعمارة وال تزال اآلثار المبطية بالية حتى اليوم ، ومن أمثلة هذه\nاآلثار في مصر :\nالكنيسة المعلقة\nتمع في حي مصر المديمة بمحافظة الماهرة .\nالمتحف القبطى\nيمع داخل أسوار حصن بابليون ويتسم بالطابع المبطى الممزوج بالتماليد\nالمصرية المديمة والهيلينستية والبيزنطية واإلسبلمية .\nالدير المحرق\nيُعرف باسم دير السيدة العذراء مريم بؤسيوط .\nدير األنبا أنطونيوس\nيمع بالمرب من مدينة الزعفرانة بمحافظة البحر األحمر .\nأديرة وادي النطرون\nهي أربعة أديرة تمع بالمرب من دلتا مصر ومنها دير األنبا بيشوى .\nت 01065626600/"],[114,"سقوط الحكم الروماني في مصر\nبالرغم من محاوالت اإلصالح التي حدثت في عهد الرومان إال أن الحكم الروماني في\nمصر اتسم بالفساد بصفة عامة وظهر ذلك في :\n)1 استبداد الحكام وظلمهم واستنزافهم لموارد مصر االلتصادية .\n)2 النظام اإللطاعي فمد اعتبروا أرض مصر كلها ملكيا لئلمبراطور يمنح لطعيا منها للممربين منه أو\nللمحاربين أو لؽيرهم .\n)3 فداحة وتعدد الضرابب المفروضة على المصريين واستخدام العنف في وسابل جمعها .\n)4 اعتبار المصريين طبمة ألل تعمل في سبيل إرضاء الطوابف المميزة وعلى رأسهم الرومان واإلغريك .\nلذلك ... لاوم المصريون الرومان ودافعوا عن حرياتهم وتمثل ذلن في :\n ليامهم بثورات ضدهم .\n هجرة المرى وترن الحمول إلهمال الزراعة كوسيلة سلمية لمحاربة الرومان(الممامة السلبية) .\nوقد ... استمر هذا الوضع حتى جاء الفتح العربى اإلسالمي عام 641 م .\nالفتح العربي اإلسالمي لمصر 641 م :\nعصرا جديديا تحت الحكم اإلسبلمي\n* تم فتح مصر على يد المابد عمرو بن العاص وبهذا الفتح دخلت مصر\nالذي تميز بالتسامح الديني واحترام األديان ولد ظهر ذلن فى ليام عمرو بن العاص بإصدار :\n خطاب أمان للبابا بنيامين الذى كان مختبنيا بؤديرة وادى النطرون وصعيد مصر لمدة 13 عا ًما من\nاالضطهاد الروماني ( البيزنطى ) فعاد البابا للنشاط الديني .\n أمر باسترداد جميع الكنابس التي استولى عليها الروم خاصة في اإلسكندرية .\nوبذلك سبق عمرو بن العاص العالم في ترسيخ حقوق المواطنة .\nأوصى رسول اهلل له بأهل مصر خيريا حيث قال :\n«إذا فتحتم مصر فاستوصوا بالمبط خيرا » .\n«إذا فتح هللا عليكم مصر فاتخذوا منها جنديا كثيفيا فذلن الجند خير أجناد األرض ، ألنهم في رباط إلى يوم\nالميامة» .\nيقول المؤرخ الغربي «إيدرس بل» :\n«إن تاريخ مصر الرومانى لصة محزنة من لصص االستؽبلل الذي يدل على لصر النظر وينتهى حت ًما\nباالنهيار االلتصادي واالجتماعى» .\nت 01065626600/"],[115,"- أسباب اهتمام الرومان بحكم مصر :\n االستفادة من مولع مصر المتميز فى ملتمى لارات العالم المديم المتحكم في طرق التجارة آنذان .\n تحميك األمن الؽذابى لروما من خبلل إمداد مصر لروما بالممح البلزم إلطعام سكانها لتصبح مصر\nمخزن الممح الدابم لئلمبراطورية الرومانية .\n- اختالف آليات تعيين رأس السلطة الحاكمة بالواليات أثناء الحكم الروماني :\nكان النظام السياسي المتبع في اإلمبراطورية الرومانية يمضى بؤن يحكم الواليات لنصل سابك ولكن نظرا\nألهمية مصر االلتصادية والجؽرافية لرر أغسطس أن يكون حاكم مصر تابعيا له ويتلمى األوامر منه\nمباشرة من طبمة الفرسان الموالين له من ذوى الكفاءة اإلدارية والمالية والعسكرية .\nأوجه االختالف بين التجارة الداخلية والخارجية فى ظل حكم الرومان لمصر : اهتم الرومان بالتجارة الداخلية فماموا بتحسين الطرق وتمهيدها ومارس سكان مصر التجارة بكل حرية ، عكس\nكامبل شكل من أشكال االحتكار حيث كانت اإلدارة\nالتجارة الخارجية التي أشرف عليها الرومان إشرافيا\nالرومانية ترسل ممثلين لها مع السفن التجارية فى البحرين األحمر والمتوسط .\n- أهم مظاهر الحياة االجتماعية وأهم التغيرات فى مصر خالل العصر الروماني :\n كان المجتمع المصرى مجتمعيا طبمييا أثناء الحكم الروماني .\n كان ال يسمح ألى أحد من فبة سكانية أن يرلى إلى فبة أعلى إال بإذن من اإلمبراطور .\n تراجعت مكانة اإلغريك بعد أن كانوا فى لمة الهرم االجتماعى خبلل حكم البطالمة .\n احتل الرومان بطوابفهم المختلفة لمة الهرم االجتماعى ممثلة فى (الوالى - الجنود - المواطنون\nالرومان) .\n تمتع اإلغريك ببعض االمتيازات المالية مثل عدم دفع ضريبة الرأس (الجزية) .\n تراجعت مكانة اليهود عن مكانتهم أيام البطالمة لكنهم احتفظوا بنشاطهم المالي .\n ظل المصريون يمثلون لاعدة الهرم والفبة األكثر تعرضيا للظلم واالضطهاد وليست لهم حموق لانونية .\n- أهم المتغيرات الدينية بمصر أثناء الحكم الروماني :\n انتشرت عبادة األباطرة فمد اعتبر المصريون اإلمبراطور هو الوريث الشرعى للملن الفرعونى والبطلمي\nحيث استبدلوا عبادة الملون البطالمة بعبادة األباطرة الرومان .\n ظهرت المسيحية فى المرون الثبلثة األولى الميبلدية بفلسطين .\nصا لهم من والعهم\n ألبل المصريون على اعتناق المسيحية ألنهم وجدوا فيها مبادئ سامية وخبل ً\nالمضطرب والمهر والذل الذي عانوا منه تحت الحكم الروماني .\n لام اإلمبراطور ثيإدوسيوس األول باالعتراف بالمسيحية كديانة رسمية للدولة .\nعصرا جديديا من التسامح الديني واحترام\n تم الفتح العربي اإلسبلمى لمصر عام 641 م ودخلت مصر\nاألديان .\nت 01065626600/"],[116,"- أسباب االضطهاد الروماني للمسيحيين :\n• تعرض السيد المسيح وأتباعه لبلضطهاد الرومانى ألن مبادئ المسيحية تخالف الوثنية وألن المسيحيين\nرفضوا تمديس صورة األباطرة الرومان ومن هنا نشؤت الرهبنة المسيحية فى مصر بسبب محاوالت\nالمسيحيين االبتعاد عن بطش السلطة الحاكمة .\n- التباين فى مواقف األباطرة الرومان من المسيحية :\n بلػ االضطهاد للمسيحية في عهد اإلمبراطور نيرون درجة كبيرة ثم وصل االضطهاد ذروته فى عهد\nاإلمبراطور دللديانوس الذي سمى عصره بعصر الشهداء بسبب ما تعرض له المصريون من اضطهاد .\n كان أول انتصار للمسيحية فى عهد اإلمبراطور لسطنطين حيث أصدر مرسوم ميبلن 313 م والذي\nأعطى الحرية الدينية للمسيحيين (السماح بإعبلن شعابرهم الدينية ) ثم تحولت المسيحية إلى دين\nرسمى للدولة على يد اإلمبراطور ثيودوسيوس األول الذي ألؽى الوثنية .\n- تأثر الفن خالل العصر الرومانى فى مصر بالحياة االجتماعية :\nانمسم الفن الروماني إلى لسمين ربيسيين هما فن الطبمة الحاكمة الذى يتمثل فى األباطرة الرومان\nوالنموش التي زينت بها جدران التوابيت الحجرية والفن الشعبى الذى يتمثل فى آالف التماثيل الصؽيرة\nواألوانى الفخارية والحجرية والمعدنية .\n- مظاهر التواصل الثقافى بين مصر والرومان :\nلام الرومان بتعديل تمويمهم المديم ليصبح كالتمويم المصرى الذى يعتمد على السنة الشمسية .\n- أسباب كراهية المصريين للحكم الروماني في مصر :\nاتسم الحكم الروماني لمصر بالفساد سواء في استبداد الحكام والنظام اإللطاعي وفداحة الضرابب والتفرلة\nالعنصرية ضد المصريين مما كان له أكبر األثر فى مماومة المصريين للرومان سواء بالثورات أو\nالمماومة السلمية التي أضعفت الحكم الروماني لمصر .\n- عظمة وسماحة الفتح اإلسالمى لمصر .:\nعصرا جديديا تميز بالتسامح واحترام األديان فمد أصدر عمرو بن العاص\nدخلت مصر تحت الحكم اإلسبلمى\nخطاب أمان للبابا بنيامين وأمر باسترداد جميع الكنابس التي استولى عليها الرومان خاصة في\nاإلسكندرية .\nت 01065626600/"]]];
var sm=null,hist=[],busy=false,ac=null,IX={},LQ="",SYS="أنت \"مستر علي\"، مدرس دراسات اجتماعية وتاريخ وجغرافيا في سلسلة الخديوي، ودود وشاطر ومرح بخفة، وبتنادي الطالب \"يا بطل\"، وبتتكلم بعامية مصرية مبسطة بصيغة المتكلم. مصدرك الوحيد هو مقاطع المذكرة المرفقة لصف الطالب الحالي، وهي نص مستخرج آليًا من ملف PDF وقد تظهر فيه حروف خاطئة أو ناقصة، فاستنتج الكلمة الصحيحة من السياق دون تغيير المعنى. القواعد: (1) جاوب فقط بما في المقاطع. لو الإجابة غير موجودة فيها قل بصراحة إنك لم تجدها في مذكرة هذا الصف ولا تجب من خارجها ولا تخترع تاريخًا أو اسمًا. (2) اذكر رقم الصفحة بين قوسين بعد المعلومة المهمة مثل (ص 12). (3) عند طلب الشرح اشرح بإبداع: ابدأ بحكاية قصيرة أو تشبيه من حياة طالب مصري، ثم خطوات بإيموجي، وحيلة حفظ، وجدول بسيط إن وجدت مقارنة، واختم بـ خلاصة الامتحان في 3 نقاط. الحكاية والتشبيه للتوضيح فقط، أما الحقائق والتواريخ والأسماء فمن المذكرة فقط. (4) عند سؤال بم تفسر أو علل أو دلل: إجابة نموذجية مختصرة بنقاط. (5) عند طلب اختبار اسأل سؤالًا واحدًا وصحح إجابة الطالب. (6) لو سأل عن الإضافي أو المواعيد أو سعر الحصة أو فلوس الدرس أو الحجز أو الاشتراك أو أي أمر إداري، قله يكلم مستر محمد مساعد مستر علي على 01277831441 واتساب أو اتصال، ولا تذكر أي موعد أو سعر. (7) لو سأل إنت إنسان ولا لأ قل إنك مدرس افتراضي بالذكاء الاصطناعي. صاحب السلسلة الأستاذ علي صابر علي جبر.";
function nz(s){return s.replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/لا/g,'ال').replace(/[^\u0621-\u064Aa-z0-9\s]/gi,' ')}
var STP=['ما','من','ماذا','هو','هي','في','على','عن','اشرح','لي','بم','تفسر','التي','الذي','هذا','كيف','لماذا','مع','بين','اشرحلي','خطوه','درس','الدرس'];
function stm(q){return nz(q).split(/\s+/).map(function(w){return w.replace(/^(وال|بال|فال|كال|لل|ال)/,'').replace(/(ات|ون|ين|ان|ها|ه|ي)$/,'')}).filter(function(w){return w.length>1&&STP.indexOf(w)<0})}
function find(g,q,k){if(!IX[g])IX[g]=KB[g].map(function(p){return nz(p[1])});var S=stm(q).filter(function(w,i,a){return a.indexOf(w)==i}).slice(0,10),N=IX[g].length;
var R=S.map(function(w){return new RegExp(w.replace(/ق/g,'[قلمكن]'),'g')}),C=IX[g].map(function(t){return R.map(function(r){return(t.match(r)||[]).length})}),
W=R.map(function(r,j){var d=C.filter(function(c){return c[j]>0}).length;return Math.log(1+N/(d+1))});
return C.map(function(c,i){var s=0;c.forEach(function(n,j){s+=W[j]*Math.min(n,3)});return[s,i]}).filter(function(x){return x[0]>0}).sort(function(a,b){return b[0]-a[0]}).slice(0,k).map(function(x){return KB[g][x[1]]})}
if(window.claude&&claude.use)claude.use('sample').then(function(s){if(s){sm=s;$('ai').hidden=false}}).catch(function(){});
if(AI_ENDPOINT)$('ai').hidden=false;
function add(c,t){var d=document.createElement('div');d.className=c;d.textContent=t;$('log').appendChild(d);$('log').scrollTop=1e9;return d}
function tg(){var p=$('pn');p.hidden=!p.hidden;if(!p.hidden&&!$('log').children.length)add('bot','أهلًا يا بطل! أنا مستر علي 👋 اختار صفك من فوق وأنا هجاوبك من مذكرته بس. اسألني عن أي حاجة، أو اطلب شرح إبداعي أو تقريب للمعلومة.')}
function ln(){return cu>=0&&cl>=0?U[cu].L[cl].n:G[gr].n}
function qb(i){var n=ln();[function(){ask('اشرحلي «'+n+'» خطوة خطوة من المذكرة',n)},function(){ask('اشرحلي «'+n+'» بطريقة إبداعية ممتعة تثبت في دماغي',n)},function(){ask('قرّب لي آخر معلومة شرحتها بتشبيه من حياتي اليومية',LQ||n)},function(){ask('اسألني سؤال امتحان واحد من «'+n+'» وانتظر إجابتي',n)}][i]()}
function ask(t,q){t=(t||$('in').value).trim();if(!t||busy||!(sm||AI_ENDPOINT))return;$('in').value='';if(!q)LQ=t;add('me',t);var b=add('bot','...');busy=true;
var hs=find(gr,q||t,4),ctx=hs.map(function(h){return'[صفحة '+h[0]+']\n'+h[1].slice(0,2200)}).join('\n\n'),pg=hs.map(function(h){return h[0]}).join('، ');
var prior=hist.slice(-6);if(prior.length&&prior[0].role=='assistant')prior.shift();
var g=G[gr].n+(cu>=0&&cl>=0?' - الدرس المفتوح: '+U[cu].L[cl].n:'');
var p=sm?sm(prior.concat([{role:'user',content:SYS+'\n\nالصف: '+g+'\n\nمقاطع المذكرة:\n'+(ctx||'(لا توجد مقاطع مطابقة)')+'\n\nرسالة الطالب: '+t}]),{onText:function(r){b.textContent=r.text;$('log').scrollTop=1e9},cache:false}).then(function(r){return r.text}):
fetch(AI_ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({grade:g,context:ctx,messages:prior.concat([{role:'user',content:t}])})}).then(function(r){return r.json()}).then(function(j){if(j.error)throw j;return j.text});
p.then(function(x){b.textContent=x+(hs.length?'\n\n📄 صفحات المذكرة: '+pg:'');hist.push({role:'user',content:t},{role:'assistant',content:x})}).catch(function(e){b.textContent=e&&e.code=='not_granted'?'لازم توافق على استخدام المدرس الأول.':e&&e.code=='rate_limited'?'استنى شوية وجرّب تاني.':'حصلت مشكلة في الاتصال، جرّب تاني.'}).then(function(){busy=false})}
</script>
