تؽبلل العوامل\nالجؽرافية - ضعف الحامية الرومانية )\n(ٗ) أصبح الساحل الجنوبي للبحر المتوسط بؤكمله تحت سيطرة المسلمين في . ................ .\n( عهد الرسول ملسو هيلع هللا ىلص - - عصر الخلفاء الراشدين - عصر الدولة األموية - عصر الدولة العباسية\nس :2 دلل تاريخييا على صحة كل عبارة مما يأتي :\nكبيرا في فتح طرابلس .\nدورا\nا\n(ٔ) لعبت الظروف الطبيعية ا\n(ٕ) ساهم اإلسبلم فى تؽيير بعض العادات السيبة التى كانت منتشرة في المجتمع اإلفريمي"],[137,"امتحان على الدرس األول\nس ( :1 أ) اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) أحكم المسلمون سيطرتهم على شمال إفريميا منذ . ..................\n( عهد الرسول ملسو هيلع هللا ىلص - عصر الخلفاء الراشدين - عصر الدولة األموية - عصر الدولة العباسية)\n( الصومال - موريتانيا - مالي - مصر )\n(ٖ) تحولت العديد من الموانا والمراكز التجارية إلى مراكز ثمافية لنشر اإلسبلم بإفريميا مثل مدينة\n(زنجبار - تمبكتو - كانو – سبيطلة)\n............ بنيجيريا (حاليا) .\n(ب) من هو ... ؟\n(ٔ) الخليفة الذى بدأ في عهده الفتح اإلسبلمي لمارة إفريميا .\n(ٕ) خليفة أرسل البنابين إلى الساحل الشرلى اإلفريمى ليساهموا في بناء المدن هنان .\n(ٖ) المابد المسلم الذي استطاع فتح مصر .\n(ج) ما النتائج التي ترتبت على : أمانة التجار المسلمين وحسن معامبلتهم في إفريميا ؟\nس (:1 أ) اكتب كلمة (صواب ) أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٔ) عبرت جيوش المسلمين مضيك باب المندب لفتح شمال إفريميا ونشر اإلسبلم بها .\n(ٕ) تشابه مولف أهل مصر وأهل برلة من الفتح اإلسبلمي .\n(ٖ) أول المحطات التي وصل إليها اإلسبلم خارج شبه الجزيرة العربية هي مصر .\n(ٗ) فر العديد من بني أمية إلى السودان ومناطك أخرى داخل إفريميا بعد ليام الدولة العباسية .\n(ه) ساهم اإلسبلم فى منع التفرلة العنصرية بإفريميا .\n(ب) رتب األحداث التاريخية اآلتية من األقدم إلى األحدث :\n- فتح مصر .\n- هجرة المسلمين األوابل إلى الحبشة .\n- فتح طرابلس .\n- إحكام سيطرة المسلمين على ببلد المؽرب .\n(ج) دلل على صحة العبارة التالية : تنوعت أساليب انتشار اإلسبلم في إفريميا ."],[138,"* تحرص مصر دائميا على توطيد عالقتها السياسية والثقافية والعلمية واالقتصادية بالقارة\nاإلفريقية منذ أقدم العصور التاريخية .\nالعصور الوسطى ؟\n*دلل : ارتبطت مصر مع الدول والممالك اإلفريقية خالل\nالعصور الوسطى بعالقات سياسية ، وثقافية وعلمية ،\nواقتصادية قوية بم تفسر ؟\nبسبب :\nالفترة الزمنية التي\nامتدت من القرن الخامس\nحتى القرن الخامس عشر\nالميالدي .\nٕ) تؤثيرها الفكري والثمافي وااللتصادي .\nٖ) تركز السلطة السياسية والدينية للعالم اإلسبلمى فيها خبلل تلن الفترة دلل؟ حيث تولت مصر\nمسبولية حماية الحرمين الشريفين واألماكن الممدسة في ظل حكم الخبلفة العباسية .\nوسنتعرف على أبعاد العالقات المصرية اإلفريقية بشيء من التفصيل ، فيما يلي :\nأوالي : العالقات السياسيُ\n*ما النتائج : دخول اإلسالم إلى إفريقيا ؟ نتج عنه :\nتحول الحياة المبلية المابمة على الحروب والعصبية إلى نظام الدولة .\n*ما العالقة بين : الخالفة العباسية و العالقات السياسية المصرية اإلفريقية ؟\nحيث :\nكان التخاذ الماهرة مركزا للخبلفة العباسية (في الفترة التي تلت سموط الخبلفة في بؽداد بالعراق) ، وكونها\nممرا ا لحكم سبلطين الممالين أثر كبير في توطيد العبللات السياسية بين مصر والدول اإلسبلمية فى إفريميا .\n*بم تفسر : حرص كثير من حكام الدول اإلسالمية بإفريقيا على الحصول على تأييد مصر\nالسياسى؟\nلبلعتراف بشرعيتهم في حكم الببلد التي تولوا إدارة شبونها ."],[139,"• حرص حكام الدول اإلفريقية على االستفادة من الخبرات السياسية والعسكرية المصرية\nدلل ؟ حيث حرص حكام ببلد الحبشة على االستفادة من الخبرات الحربية المصرية فاستعانوا ببعض\nالممالين لتعليمهم فنون الحرب وتصنيع األسلحة والرمى بالسهام والرماح والضرب بالسيف .\n* ساهم المماليك فى تطوير الجوانب اإلدارية بالحبشة دلل؟ حيث نظم الممالين طرق\nجباية(جمع) األموال وأنشؤوا ديوانا خاصا بذلن ، ووضعوا الموانين التي تساعد على حماية أموال الدولة .\nالتدريب األول\nأكمل ما يأتي بالكلمات المناسبة :\n(ٔ) ساعد دخول اإلسبلم إلى إفريميا التحول من الحياة المبلية إلى نظام . ................. .\n(ٔ) تولت حماية الحرمين الشريفين واألماكن الممدسة فى ظل حكم العباسيين دولة . ....................\nدلل تاريخييا على صحة كل عبارة مما يأتي :\n(ٔ) حرص حكام الحبشة على االستفادة من الخبرات الحربية المصرية خبلل العصور الوسطى .\n(ٕ) ساهم الممالين فى تطوير الجوانب اإلدارية بببلد الحبشة .\nما المقصود بـ : العصور الوسطى ؟\nثانياً : العالقات الجكافيُ والعلميُ\nكانت المؤثرات الدينية من أبرز النواحي الثقافية التي ربطت الدول اإلفريقية بمصر ،\n*دلل : ظهر التأثير الديني لمصر على إفريقيا منذ القدم؟ حيث :\nفي عصر المصريين القدماء\nانتشرت عبادة بعض اآللهة المصرية فى حضارات السودان ، مثل عبادة الكوشيين لآللهة رع وآمون\nوأوزوريس وإيزيس .\nبعد انتشار المسيحية\n احتفظت مصر بمكانتها الدينية والثقافية بعد انتشار المسيحية دلل؟ حيث : كانت الكنيسة\nالحبشية (اإلثيوبية ) تابعة للكنيسة المصرية دلل؟ حيث كان يتم تعيين مطران مصرى من لبل بطريرن\nاإلسكندرية ليكون مسبوال ا عن الكنيسة الحبشية ."],[140," اكتسب معظم المطارنة المصريين مكانة رفيعة تلى مكانة ملك الحبشة ، دلل؟\nكثيرا ما كان يلجؤ ملون الحبشة الستشارتهم في شبونهم الدينية والسياسية .\nحيث\nا\n كان حاكم مصر يسند إلى مبعوثين الكنيسة المصرية بببلد الحبشة مهمة اإلشراف على مصالح المسلمين\nالدينية هنان .\n وبذلن كان لمصر دور مهم فى تنظيم الكنيسة بالحبشة ورعايتها وتشكيل تماليدها االحتفالية والتعبدية .\nبعد انتشار اإلسالم :\n ظلت مصر المنارة التى تشع نور العلم والثقافة والدين على العالم من خالل مؤسساتها\nالدينية والعلمية دلل؟ حيث لامت مصر بدور حضارى فى المحافظة على األدب العربى والتراث\nالثمافى اإلسبلمى وإيصاله للشعوب اإلسبلمية وخاصة في إفريميا .\n كان أداء فريضة الحج عامال مهما من عوامل قيام العالقات الثقافية بين مصر والدول\nاإلسالمية بإفريقيا دلل ؟ حيث كان حجاج الدول اإلفريمية يمرون عبر مصر لببلد الحرمين ،\nفيتعرفوا على أهلها وينهلوا من علومها الدينية .\nعصر المماليك :\nشهدت مصر حركة علمية وأدبية مزدهرة فى فترة العصور الوسطى خالل القرن التاسع\nالهجري / الخامس عشر الميالدى ما النتائج ؟ أسهمت بشكل واضح في :\nتشكيل فكر وثمافة الدول اإلسبلمية بإفريميا . انتشار اإلسبلم بشكل أوسع في إفريميا . ظهور نهضة ثمافية كبيرة في الببلد اإلفريمية .  دلل : تقدمت الحركة العلمية واألدبية في مصر خالل القرن التاسع الهجري؟\nأو دلل : لعب المماليك دوراً بارزاً في تشكيل فكر وثقافة الدول اإلسالمية اإلفريقية؟\nحيث :\nاهتم المماليك ببناء المدارس والمساجد والكتاتيب التي لصدها كثير من طبلب العلم والعلماء من مختلف\nأنحاء إفريميا ، والدليل على ذلن الموسوعات األدبية وكتب التاريخ والمإلفات العديدة فى العلوم الدينية\nاإلسبلمية وساهمت في تشكيل فكر وثمافة الدولة اإلسبلمية بإفريميا ."],[141,"دور األزهر الشريف في انتشار اإلسالم في إفريقيا :\nقام األزهر الشريف بدور مهم عبر تاريخه الطويل في الحفاظ على الهوية اإلسالمية دلل؟ ،\nحيث يُعد من أهم المإسسات العلمية الدينية التي لدمت العلوم والمعرفة إلى الدول اإلسبلمية بإفريميا .\nكان الطالب األفارقة يفدون إلى األزهر الشريف بم تفسر؟ للدراسة الدينية والعلمية .\n دلل : يُعد من أهم المؤسسات العلمية الدينية التي قدمت العلوم والمعرفة إلى الدول\nاإلسالمية بإفريقيا ؟ حيث :\nكبيرا بهم فمد وفر لهم األزهر\nكان الطبلب األفارلة يفدون إلى مصر للدراسة الدينية والعلمية فيجدون ترحيباا\nا\nصصت لهم أرولة\nإلامة مستمرة في أرولته وأعطى لهم الرواتب بم تفسر؟ ليتفرغوا لطلب العلم ولد ُخ َّ\nرواق المؽاربة . باألزهر ، مثل - : رواق الجبرتية .\nأروقة األزهر :\nما المقصود بـ : أروقة األزهر الشريف؟ أماكن للدراسة واإلعاشة\nالكاملة بالمجان (طعام وإقامة وكسوة ومرتبات وخدمات كثيرة) تخصص للطالب\nالدارسين باألزهر تكريميا وراحة لهم وتقسم حسب مناطق الطالب الوافدين .\n دلل : تعددت أروقة الطالب األفارقة باألزهر الشريف؟\nحيث :\nرواق الجبرتية : الذى ُخصص للطبلب الوافدين من ببلد الحبشة وسواحل البحر األحمر . رواق المغاربة : الذي يضم طبلب شمال إفريميا وببلد المؽرب العربي .  ما النتائج : عودة الطالب األفارقة الذين تعلموا في األزهر إلى بالدهم؟ أدى إلى :\nأقاموا المدارس والمساجد ، وحلقات العلم والتدريس وحاولوا االقتداء باألزهر الشريف في\nأساليب التدريس وتلقى العلم ."],[142,"ثالجا : العالقات االقتصاديُ\nساهمت العالقات السياسية والثقافية بين مصر والدول اإلفريقية خالل العصور الوسطى في\nتعزيز دور مصر كمركز اقتصادى مهم ، وخاصة في مجال التجارة دلل؟ ، حيث :\nٔ) مرت الطرق التجارية بالصحراء الكبرى التي ربطت بين مصر ودول شمال وغرب إفريميا من جانب\nودول جنوب الصحراء الكبرى والساحل الؽربى اإلفريمى من جانب آخر وصوال إلى وسط إفريميا .\nٕ) كانت مصر الوسيط الوحيد في استيراد سلع الشرق ونملها إلفريميا ، فمد حمل التجار المصريون\nمصنوعات من أنواع رالية إلى الدول اإلفريمية نالت إعجاب ملوكهم ، مثل : األوانى النحاسية ،\nوالمصنوعات الحديدية والفضية والذهبية ، وأدوات الزينة ، ومصنوعات الزجاج .\n*دلل : تعددت واردات مصر من الدول اإلفريقية خالل العصور الوسطى؟حيث :\nكانت مصر تستورد من إفريميا العديد من المنتجات مثل : العاج ، وريش النعام ، والصمػ ، وبعض الجلود .\nمظاهر عمق العالقات االقتصادية بين مصر ودول إفريقيا في العصور الوسطى\nٔ) وجود جاليات مصرية كبيرة في المدن التجارية اإلفريمية سواء كان هإالء المصريون من الفمهاء أو\nالعلماء أو التجار .\nٕ) تفضيل ملون وحكام الدول اإلفريمية للمنتجات المصرية بم تفسر؟ ألنها اشتهرت بالجودة والدلة الفنية ،\nمثل : األلمشة والمنسوجات ، والسجاد والتحف ، والكتب ، وغيرها من المنتجات الميمة .\nٖ) وجود العديد من السجبلت التجارية والوثابك األثرية التى تشير إلى التبادل التجارى بين مصر ودول\nإفريميا في تلن الفترة ، فمد وجدت أوان فخارية وزجاجية وعمبلت تاريخية مصرية في مناطك من الساحل\nالؽربي اإلفريمي .\nالتدريب الثاني\nدلل تاريخييا على صحة العبارتين التاليتين :\n(ٔ) يُعد األزهر من أهم المإسسات الدينية التي لدمت العلوم إلى الدول اإلسبلمية بإفريميا .\n(ٕ) تعددت واردات مصر من الدول اإلفريمية خبلل العصور الوسطى ."],[143,"س :1 أكمل العبارات اآلتية بما يناسبها :\n(ٔ) ارتبطت مصر مع الدول والممالن اإلفريمية خبلل العصور الوسطى بعبللات سياسية ......... و . .........\n(ٕ) ساعد دخول اإلسبلم في لارة إفريميا على تحول الحياة ...................... . المابمة على الحروب\nوالعصبية إلى نظام . ........................\n(ٖ) كانت المإثرات ...................... من أبرز النواحى الثمافية التي ربطت الدول اإلفريمية بمصر .\n(ٗ) في عهد المصريين المدماء انتشرت عبادة بعض اآللهة المصرية في حضارة . ......................\n(ه) بعد انتشار المسيحية كانت الكنيسة الحبشية اإلثيوبية تابعة للكنيسة . ...................... .\n( )ٙ من الواردات المصرية اإلفريمية خبلل العصور الوسطى . ......................\nس :2 اختر اإلجابة الصحيحة مما بين القوسين :\n( تمبكتو - الماهرة - سبيطلة - اإلسكندرية )\n(ٕ) حرص حكام الحبشة على االستفادة من الخبرات الحربية المصرية بشكل واضح خبلل . . ..........\n(عهد النبي ملسو هيلع هللا ىلص - عصر الخلفاء الراشدين - عصر الدولة األموية - عصر دولة الممالين )\n(ٕ) تم تخصيص أرولة باألزهر للوافدين من الخارج مثل رواق الجبرتية للطبلب الوافدين من . ..........\n(ببلد المؽرب - ببلد الحبشة - سواحل البحر المتوسط - سواحل المحيط األطلنطي )\n(ٗ) من المنتجات المصرية التي اشتهرت بالجودة والدلة فى العصور الوسطى وكان ملون وحكام الدول\n(الصمػ - األلمشة - العاج - الجلود )\nاإلفريمية يفضلونها . .......... .\nس :3 اكتب كلمة (صواب) أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٔ) اتخذ سبلطين الممالين فى مصر مدينة اإلسكندرية ممرا لحكمهم .\n(ٕ) تولت مصر مسبولية حماية الحرمين الشريفين واألماكن الممدسة في ظل حكم الخبلفة األموية (.\n(ٕ) ساهم الممالين فى تطوير الجوانب اإلدارية بالحبشة .\n(ٗ) أثر األزهر الشريف على أساليب التدريس وتلمى العلم في المدارس والمساجد اإلفريمية .\n(ه) توطدت العبللات االلتصادية في العصور الوسطى بين مصر ودول شمال وغرب إفريميا .\n( )ٙ كانت مصر الوسيط الوحيد في استيراد سلع الشرق خبلل العصور الوسطى ونملها إلفريميا ( ."],[144,"( )۷ كانت المصنوعات الذهبية وأدوات الزينة إحدى واردات مصر من الدول اإلفريمية .\n( )٨ وجدت عمبلت تاريخية مصرية فى مناطك من الساحل الؽربي اإلفريمى تعود للعصور الوسطى (.\nس :4 بم تفسر ... ؟\n(ٔ) حرص الكثير من حكام الدول اإلسبلمية بإفريميا على تؤييد سبلطين الممالين لهم سياسياا .\n(ٕ) ظهور نهضة ثمافية كبيرة فى الببلد اإلفريمية في العصور الوسطى .\n(ٖ) لجوء ملون الحبشة بعد انتشار المسيحية فى مصر إلى المطارنة المصريين في الكثير من األحوال .\nس :5 ما العالقة بين ... ؟\n(ٔ) الدولة المملوكية فى مصر ، وتشكيل فكر وثمافة الدول اإلسبلمية بإفريميا خبلل العصور الوسطى .\n(ٕ) أداء فريضة الحج ، والعبللات الثمافية والعلمية المصرية اإلفريمية خبلل العصور الوسطى .\nس :6 دلل تاريخييا على صحة كل عبارة من العبارات اآلتية :\n(ٔ) وفرت أرولة األزهر بيبة مبلبمة ساعدت الطبلب الوافدين على تحصيل العلوم .\n(ٕ) احتفظت مصر بمكانتها الثمافية والدينية بعد انتشار المسيحية بها .\n(ٖ) كانت العبللات االلتصادية بين مصر والدول اإلفريمية لوية خبلل العصور الوسطى .\nأسئلــة للتميز ؟\nس :1 اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) ارتبطت مصر مع الدول والممالن اإلفريمية خبلل العصور الوسطى بعبللات متنوعة نتيجة عدة عوامل\nيخرج عنها . ...................\n( مولعها الجؽرافي المتميز - مركزها السياسي والديني -\nوجود أهم األماكن الممدسة بها - دورها الفكري والثمافي )\n(ٕ) انتملت مسبولية حماية الحرمين الشريفين في ظل الخبلفة العباسية إلى مصر بعد أن كانت هذه المسبولية\nعلى عاتك مركز الخبلفة في ( . ................... العراق - إفريمية - المؽرب - النوبة )\nما تقييمك لمصداقية العبارة التالية : تؤثر ملون الحبشة بالممالين فى طريمة جمع الضرابب ؟"],[145,"امتحان على الدرس الثاني\nس ( :1 أ) اكتب كلمة (صواب ) أوكلمة (خطأ) أمام العبارة غير الصحيحة مع التصويب :\n(ٔ) كانت مصر تستورد من إفريميا خبلل العصور الوسطى مصنوعات الزجاج .\n(ٕ) تم اتخاذ الماهرة مركزا للخبلفة األموية بعد سموط مدينة بؽداد .\n(ٖ) استفاد حكام الحبشة من الممالين التصادياا وعسكريا .\n(ٗ) كانت مصر بمثابة معبر انتمل منه األدب العربي والتراث الثمافى اإلسبلمي إلى المارة اإلفريمية (.\n(ب) بم تفسر :\nوفود الطبلب األفارلة إلى األزهر الشريف ؟\nس ( :2 أ) أكمل العبارات اآلتية بكلمات مناسبة :\n(ٔ) كانت الجاليات المصرية فى المدن التجارية اإلفريمية في العصور الوسطى تضم الفمهاء\n................................ و . ................................\n(ٕ) كان لمصر بعد انتشار اإلسبلم بها دور حضارى فى المحافظة على ................... و . ..................\n(ٖ) اتخذت العبللات المصرية اإلفريمية عدة أبعاد منها العبللات ................... والعبللات\n.................. والعبللات . .....................\n(ٗ) تؤثر ملون ..................... بالممالين فى وضع الموانين لحماية أموال الدولة .\n(ب) ما المقصود بـ ... ؟\n(ٔ) العصور الوسطى .\n(ٕ) أرولة األزهر الشريف .\n(ج) دلل على صحة العبارة التالية :\nتفضيل ملون وحكام الدول اإلفريمية فى العصور الوسطى المنتجات المصرية ."],[146,"س :1 اكتب كلمة (صواب) أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع تصويب الخطأ :\nٔ) دخل المسلمون األوابل إلى ببلد الحبشة عن طريك المحيط الهندي .\nٕ) انتشر اإلسبلم في غرب إفريميا أوال ثم انتمل إلى شرق المارة .\nٖ) اعتمد انتشار اإلسبلم في إفريميا على الوسابل السلمية .\nٗ) فر العديد من حكام الدولة األموية إلى السودان بعد ليام الدولة المملوكية .\n٘) نجح عبد هللا بن أبى السرح في فتح طرابلس ومصر .\n)ٙ أحد التؤثيرات السياسية لئلسبلم على الدول اإلفريمية التحول إلى نظام الدولة ( .\n)۷ حرص المصريون على االستفادة من الخبرات الحربية ألهل الحبشة .\n)٨ ساعد األزهر الشريف الطبلب األفارلة على التفرغ لطلب العلم .\nس :2 اختر اإلجابة الصحيحة مما بين القوسين :\nٔ) أولى المحطات اإلفريمية التي وصل إليها اإلسبلم هي . ...............\n( الحبشة - مصر - برلة - المؽرب(\nٕ) حرص المسلمون على تموية الروابط األسرية مع الشعوب اإلفريمية من خبلل .... ........\n( الدعاة - الهجرات المتعددة – التجار - الزواج والمصاهرة)\nٖ) أولى الدول اإلفريمية التي فتحها المسلمون هي . ................\n)الصومال - مصر - كينيا – تنزانيا)\nٗ) أصبحت الماهرة مركزا للسلطة السياسية اإلسبلمية في ظل الخبلفة . ................ .\n(الراشدة - األموية - العثمانية - العباسية )\n٘) انتملت التجارة من مصر نحو وسط إفريميا عبر . ................ .\n(خليج السويس - الخليج العربي - الصحراء الكبرى - المحيط األطلنطي(\n)ٙ إحدى السلع التي كانت تؤتى إلى مصر من إفريميا ... ............... .\n(األوانى النحاسية - المصنوعات الذهبية - ريش النعام - أدوات الزينة )"],[147,"س :3 أكمل العبارات التالية بما يناسبها من كلمات :\nٔ) ربطت لناة خليج أمير المإمنين بين البحر األحمرو .. ................\nٕ) المدينة التي تحولت إلى مركز ثمافى إسبلمى فى نيجيريا هي . ................ .\nٖ) األفراد الذين تلموا العلوم الدينية التى تإهلهم لنشر اإلسبلم بالطرق السلمية هم . ................ .\nس :4 بم تفسر ... ؟\nٔ) أهمية شبه جزيرة سيناء فى نشر اإلسبلم في إفريميا .\nٕ) ساهم التجار المسلمين في نشر اإلسبلم بإفريميا .\nٖ) اتجاه عمرو بن العاص لفتح برلة .\nٗ) أثرت فريضة الحج فى تنشيط العبللات الثمافية بين مصر والدول اإلسبلمية اإلفريمية .\nس :5 ما النتائج التي ترتبت على ... ؟\nٔ) هجرة العرب المسلمين للبحث عن المعادن واألحجار الكريمة في إفريميا .\nٕ) ارتباط الدين اإلسبلمي باللؽة العربية .\nٖ) دراسة طبلب من إفريميا في األزهر الشريف والمدارس المصرية .\nس :6 دلل على صحة أو خطأ كل عبارة فيما يلى . ؟\nٔ) ساهم الخليفة عبد الملن بن مروان فى نشر مظاهر الحضارة اإلسبلمية في الساحل اإلفريمي .\nٕ) لام اإلسبلم بتنظيم عادات الزواج بين المبابل اإلفريمية .\nٖ) المكانة المرمولة للمطارنة المصريين في ببلد الحبشة .\nٗ) كان للفتح اإلسبلمي تؤثير إيجابي على حياة الشعوب اإلفريمية .\nس :7 أجب عما يلى :\nٔ) ما وجه التشابه بين : الجامع األزهر الشريف ، وجامع سنكوري في تمبكتو ؟\nٕ) وضح كيف تكونت الممالن اإلسبلمية بإفريميا ."]],[[1,"........................................................................................"],[2,"الوحدة األولى\nالمالمح الطبيعية لقارتي آسيا وأوروبا\nالدرس األول\nموقع ومظاهر السطح بقارتي آسيا وأوروبا\nالدرس الثاني\nالمعادن ومصادر الطاقة في قارتي آسيا وأوروبا\nتدريبات عامة على الوحدة\nالوحدة الثانية\nالحضارات القديمة في قارة آسيا وعالقتها بمصر\nالدرس األول\nنماذج للحضارات القديمة بالشرق األدنى\nالدرس الثاني\nنماذج لحضارات بالد اليمن القديم\nالدرس الثالث\nنماذج للحضارات القديمة بالشرق األقصى\nالدرس الرابع\nالحضارة اإلسالمية\nتدريبات عامة على الوحدة\nالوحدة الثالثة\nالنظم البيئية قارتي آسيا وأوروبا\nالدرس األول\nنظم الغابات في قارتي آسيا وأوروبا\nالدرس الثاني\nنظم الحشائش و الصحاري في قارتي آسيا وأوروبا\nالدرس الثالث\nالنظم البيئية المائية في قارتي آسيا وأوروبا\nتدريبات عامة على الوحدة\nالوحدة الرابعة\nالحضارات القديمة في قارة أوروبا وعالقتها بمصر\nالدرس األول\nالحضارة اليونانية\nالدرس الثاني\nالحضارة الرومانية\nتدريبات عامة على الوحدة"],[4," تمهيد :\n تعرفنا في العام السابق على إحدى قارات العالم القديم وهى قارتنا إفريقيا وتتبعنا\nعالقتها بوطننا الحبيب مصر عبر التاريخ ، وفي هذا العام سوف نستكمل معا التعرف على\nباقى قارات العالم القديم ، وهما قارتي آسيا وأوروبا .\n يُطلق على القارتين (آسيا وأوروبا ) مصطلح « أوراسيا » بم تفسر ؟\nوذلك ألن قارة أوروبا تبدو كأنها امتداد طبيعى لقارة آسيا من جهة الغرب ، ويظهر ذلك\nمن خالل الخريطة اآلتية :\nمساحة قارتي آسيا وأوروبا :"],[5,"أوالي : مىقع قارَ آسيا وأهميته\nأوالي : الموقع الفلكي :\n تمتد بين دائرتى عرض ۱۰ ( : جنوبيا ۸۱ : شماليا )\nوخطى طول ٕٙ ( : شرقيا ۱۷۰ : غربيا ) .\nونستنتج من ذلك :\nلارة آسيا تمع فى النصف الشمالي للكرة األرضية فيما عدا بعض الجزر اإلندونيسية الوالعة جنوب\nدابرة االستواء .\nلارة آسيا أكبر لارات العالم من حيث االمتداد الفلكي .\nتمر بمارة آسيا ثالث دوابر عرض ربيسية وهي :\n( دابرة االستواء - مدار السرطان - الدابرة المطبية الشمالية) ."],[6,"ثانياً : الموقع الجغرافي :\nمن خالل الخريطة السابقة نجد أن :\nقارة آسيا يحدها :\nشماالي : المحيط القطبي الشمالي .\nشرقاً : المحيط الهادي .\nجنوبيا : المحيط الهندي .\nغرباً : تتنوع الحدود دلل؟ كما يلي :\n حدود مائية : على البحر األحمر والبحر المتوسط والبحر األسود .\n حدود برية : يتمثل معظمها فى جبال أورال التي تفصلها عن قارة أوروبا .\nتقترب قارة آسيا من :\nخد بالك :\n قارة إفريقيا عند مضيك باب المندب .\nقارة آسيا يحدها\n قارة أوروبا عند مضيمى البسفور والدردنيل .\nثالث محيطات وهم\n قارة أمريكا الشمالية عند مضيق بيرنج .\nالقطبي الشمالي\n قارة أستراليا عند بحرتيمور .\nوالهادي والهندي .\nثالثاً : أهمية موقع قارة آسيا :\nٔ - األهمية استراتيجية :\nلموقع قارة آسيا أهمية استراتيجية بم تفسر؟ ألنها :\n تطل على مسطحات مابية مهمة .\n تشرف على ممرات مالحية ذات أهمية استراتيجية كبيرة ، مثل :\nمضيك باب المندب . - مضيك هرمز ."],[7,"ٕ - األهمية االقتصادية :\nموقعها الجغرافي ما النتائج؟\nموقعها الفلكي ما النتائج؟\nمعبرا ربيسيا لطرق التجارة البرية منذ\nالذي جعلها\nالذي أدى إلى حدوث تنوع كبير فى مناخها وبالتالى\nالعصور مثل : طريك الحريروطريك التوابل .\nتنوع النباتات الطبيعية والحيوانات والمحاصيل\nالزراعية .\nأضف إلى معلوماتك :\n طريق الحرير : طريك تجاري لديم كان الممر الربيسى لتجارة الحرير من الصين إلى أوروبا ويتؤلف\nمن طريمين أحدهما برى واآلخر بحرى .\n طريق التوابل : طريك تجاري لديم بين جنوب شرق آسيا ولارة أوروبا .\nٖ - األهمية الحضارية :\nلموقع قارة آسيا أهمية حضارية بم تفسر؟ بسبب ليام عديد من الحضارات العريمة بها مثل :\n- حضارات بالد الرافدين .\n- حضارة فينيميا .\n- حضارات بالد اليمن .\n- الحضارة الهندية .\n- الحضارة الصينية .\n- الحضارة اإلسالمية ."],[8,"ٗ - األهمية الدينية :\nلموقع قارة آسيا أهمية دينية بم تفسر؟ ألنها :\nٔ) مهد للديانات السماوية (اليهودية والمسيحية واإلسالمية) .\nٕ) تضم العديد من الموالع الممدسة ذات األهمية الكبيرة ، مثل :\n- الكعبة المشرفة بالسعودية .\n- المسجد األلصى .\n- مسجد لبة الصخرة .\n- كنيسة المهد بفلسطين .\nالتدريب األول\nسٔ : استعن بخريطة قارة آسيا المقابلة ، واكتب ما تدل عليه األرقام الموقعة عليها :\nٔ) دابرة . .....................\nٕ) المحيط . ..................\nٖ) المحيط . .................. .\nٗ) البحر . .................. .\n٘) مضيك . ..................\n)ٙ البحر . ....................\n)7 جبال . ....................\n)8 مضيك . ..................\n)9 لارة . ....................\nٓٔ) مضيك . ................. .\nسٖ : اكتب كلمة (صواب ) أوكلمة ( خطأ ) أمام العبارة غير الصحيحة ، مع التصويب :\nٔ) تعد لارة آسيا أكبر لارات العالم من حيث المساحة .\nٕ) تحتل لارة أوروبا المرتبة الثانية بين لارات العالم من حيث المساحة .\nٖ) تمع بعض الجزر اإلندونيسية بمارة آسيا جنوب دابرة االستواء .\nسٗ : دلل على صحة كل عبارة مما يأتي :\nٔ) المولع لارة آسيا أهمية استراتيجية .\nٕ) نشؤت عديد من الحضارات في لارة آسيا .\nٖ) األهمية الدينية لمولع لارة آسيا .\nس٘ : بم تفسر ي : طلك على لارتي آسيا وأوروبا مصطلح أوراسيا؟\nس :ٙ ما النتائج المترتبة على : تمتع لارة آسيا بؤكبر امتداد فلكي في العالم؟"],[9,"ثانياً : مىقع قارَ أوروبا وأهميته\nالموقع الفلكي لقارة أوروبا :\n من خالل الخريطة السابقة نجد أن : قارة أوروبا تمتد بين :\nشماال (أي أنها تمتد بؤكملها في النصف الشمالي للكرة األرضية) .\n يمر بقارة أوروبا :\n دابرة عرض ربيسية هي الدابرة المطبية الشمالية .\n خط الطول الربيسي وهو خط جرينتش .\n ما النتائج على : الموقع الفلكي لقارة أوروبا بالنسبة لدوائر العرض؟\nترتب على ذلك : وقوع معظم القارة فى المنطقة المناخية المعتدلة الشمالية من الكرة\nاألرضية ."],[10,"الموقع الجغرافي لقارة أوروبا :\nمن خالل الخريطة السابقة نجد أن :\n قارة أوروبا يحدها :\nشماالي : المحيط المطبي الشمالي .\nغرباً : المحيط األطلنطى .\nجنوباً : البحر المتوسط والبحر األسود .\nشرقاً : لارة آسيا .\n قارة أوروبا تقترب من قارة إفريقيا عند مضيق جبل طارق .\n تحيط المسطحات المائية بقارة أوروبا من ثالث جهات دلل؟\nشماالي : المحيط المطبي الشمالي .\nغرباً : المحيط األطلنطى .\nجنوباً : البحر المتوسط والبحر األسود .\nأهمية موقع قارة أوروبا :\n- االستراتيجية .\n- االقتصادية .\n- الحضارية .\nٔ - األهمية االستراتيجية :\nلموقع قارة أوروبا أهمية استراتيجية بم تفسر؟ ألنها :\n تطل على مسطحات مابية مهمة .\n تشرف على ممرات مالحية ذات أهمية استراتيجية كبيرة ، مثل :\n- مضيك جبل طارق .\n- مضيك البسفور .\n- مضيك الدردنيل .\nٕ - األهمية االقتصادية :\nلموقع قارة أوروبا أهمية اقتصادية بم تفسر؟ بسبب :\n موقعها الجغرافي ماالنتائج؟ ساعد على سهولة التواصل االلتصادى بينها وبين بالى لارات العالم .\n موقعها الفلكي ماالنتائج؟ الذي ساعد على تنوع مناخها ."],[11,"ٖ - األهمية الحضارية :\nلموقع قارة أوروبا أهمية حضارية بم تفسر؟ بسبب نشؤة عديد من الحضارات ، مثل :\nالحضارة اليونانية المديمة .\nالحضارة الرومانية المديمة .\nالحضارة الؽربية الحديثة التي شهدت الثورة العلمية والصناعية .\nتوضيح : بالرغم من اتصال يابس قارتي آسيا وأوروبا إال أن مصر لها دور كبير في التواصل\nوالتجارة بين دول القارتين منذ القدم بم تفسر؟ بسبب موقعها المتميز وإشرافها على\nممرين هامين هما البحر األحمر والمتوسط ومرورهما جزء كبير من تجارة القارتين وزادت\nأهمية ذلك الموقع بعد شق قناة السويس ."],[12,"التدريب الثاني\nسٔ : استعن بخريطة قارة أوروبا المقابلة ، واكتب ما تدل عليه األرقام الموقعة عليها :\n)ٔ( المحيط . ......................\n)ٕ( المحيط . ......................\n)ٖ( البحر . ......................\n)ٗ( البحر . ......................\n)٘( مضيك . ......................\n) (ٙ مضيك . ......................\n) (7 لارة . ......................\n) (8 مضيك . ......................\nسٕ : اكتب كلمة (صواب) أوكلمة (خطأ) ، مع ذكر السبب في الحالتين :\nٔ) تمع لارة أوروبا بؤكملها في النصف الجنوبي من الكرة األرضية .\nٕ) تحيط المسطحات المابية بمارة أوروبا من جميع الجهات .\nٖ) يمثل مولع لارة أوروبا الجؽرافي أهمية التصادية كبيرة .\nٗ) تستؤثر لارة أوروبا باإلشراف الكامل على سواحل البحر األسود .\nسٖ : دلل على صحة كل عبارة مما يأتي :\nٔ) تتمتع لارة أوروبا بمولع استراتيجي مهم .\n..................................................................................................................\nٕ) لامت عديد من الحضارات في لارة أوروبا .\n..................................................................................................................\nسٗ : حدد األثر الناتج عن : المولع الفلكي لمارة أوروبا بالنسبة لدوابر العرض .\n.................................................................................................................."],[13,"ثالجاً : مظاهز السطح بقارَ آسيا\n نستنتج من الخريطة السابقة تنوع مظاهر السطح في قارتي آسيا دلل؟\nحيث تشغل السالسل الجبلية والهضاب أكثر من نصف مساحتها .\nٔ - الجبال :\n توجد في لارة آسيا سالسل جبلية ضخمة وشاهمة االرتفاع وعظيمة االمتداد مثل :\nجبال الهيمااليا ، التى تُعد أعلى وأضخم السالسل الجبلية في العالم ،، وتوجد بها لمة إفرست أعلى لمة\nجبلية في العالم ( 88ٗ8 م) .\n تُعد لارة آسيا األعلى بين لارات العالم ، من حيث متوسط االرتفاع ، إذ يبلػ متوسط ارتفاع سطحها\nنحو ٓ 78 مترا وتضم ٕٗ لمة جبلية من بين أعلى ٖٓلمة في العالم ."],[14,"ٕ - الهضاب :\nتضم قارة آسيا العديد من الهضاب المرتفعة في :\nهضبة التبت : وسط المارة (أعلى هضاب العالم ما النتائج؟ لذا تُعرف باسم سمف العالم) .\nهضبة الدكن : جنوب المارة ( تشؽل معظم الجزء الجنوبي من الهند) .\nهضبة شبه الجزيرة العربية : غرب المارة .\nٖ - السهول :\nتتنوع السهول في لارة آسيا ما بين (سهول فيضية وساحلية)\nالسهول الفيضية : التي كونتها األنهارومنها :\n شماالي : سهول سيبيريا ويجرى فيها عدة أنهار مثل أوب وينسي ولينا (التي تتجمد مياهها شتا ًء) .\n شرقاً : سهل الصين ويجرى فيه عدة أنهار ، أشهرها :\nاليانجتسي (أطول أنهار آسيا والثالث عالميا ً)\nسهول منشوريا ويجرى فيه نهر أمور .\n غرباً : سهول نهري دجلة والفرات .\n جنوباً : سهول نهر السند .\nالسهول الساحلية :\nتأتي قارة آسيا في المرتبة األولى بين قارات العالم من حيث طول سواحلها بم تفسر؟\n- اتساع مساحتها .\n- كثرة الخلجان .\n- األذرع المابية بها .\n تتميز السهول الساحلية بالقارة كالتالي :\nي  ختلف اتساع هذه السهول من منطمة ألخرى بم تفسر؟\nتبعيا اللتراب أو ابتعاد المرتفعات من المسطحات المابية .\nي  وجد بالمرب من سواحل لارة آسيا عدد كبير من الجزر مثل : جزيرة سيريالنكا في جنوب الهند .\nي  وجد العديد من الجزر المتجاورة وتسمى باألرخبيل مثل : أرخبيل اليابان وأرخبيل إندونيسيا .\nالساحلية في لارة آسيا ."],[15,"رابعاً : مظاهز السطح بقارَ آوروبا\n نستنتج من الخريطة السابقة تنوع مظاهر السطح في قارتي آوروبا دلل؟\n الجزء الشمالي ي : تكون من السهول المتسعة التي تنتشر بها بعض التالل والهضاب لليلة االرتفاع .\n الجزء الجنوبي : تسوده السالسل الجبلية العالية .\nأهم الجبال في قارة أوروبا :\nتمتد بها عديد من السالسل الجبلية مثل :\nجبال البرانس بين فرنسا وإسبانيا .\nجبال األلب الدينارية في شبه جزيرة البلمان .\nي  وجد بها لمة مون بالن أعلى لمة جبلية بالمارة ويبلػ ارتفاعها عن ٓٓ ٗ8 م ."],[16,"أهم الهضاب في قارة أوروبا :\nيوجد بها عدد قليل من الهضاب مختلفة المساحة منها :\n- هضبة فرنسا الوسطى : في فرنسا .\nهضبة الميزيتا : في إسبانيا . السهول في قارة أوروبا :\nالسهول الفيضية : التي كونتها األنهارومنها :\n السهل األوروبي العظيم (أكبر السهول الفيضية بالمارة) حيث تجرى فيه عديد من األنهار مثل :\n- نهر الدانوب .\n- نهر الفولجا (أطول أنهار المارة) .\n أهميتها : ولد ساعدت هذه السهول على سهولة االتصال بين أجزاء المارة وتحميك التنمية الزراعية بها .\nالسهول الساحلية :\nتتميز سواحلها بكثرة التعاريج ما النتائج؟ مما ساعد على إنشاء العديد من الموانا الطبيعية .\nخد بالك :\n يختلف اتساع السهول الساحلية بقارتي آسيا وأوروبا من منطقة ألخرى ، بم تفسر؟\nي  رجع ذلن تبعا ً اللتراب أو ابتعاد المرتفعات عن المسطحات المابية .\n تواجه السهول الساحلية في قارتي آسيا وأوروبا عدة تهديدات دلل؟\nحيث تتعرض لعديد من التهديدات أهمها :\n- التؽيرات المناخية .\n- االستؽالل المفرط .\n- التلوث .\n دلل : تنفرد قارة آسيا بسمات تضاريسية ال توجد فى قارات أخرى؟\nٔ) يوجد بها أعلى وأضخم السالسل الجبلية بالعالم (جبال الهيمااليا) .\nٕ) يوجد بها أعلى لمة جبلية بالعالم (لمة إفرست) .\nٖ) يوجد بها أعلى هضاب العالم ( هضبة التبت) .\nٗ) تحتل المرتبة األولى بين لارات العالم من حيث طول سواحلها .\nحيث :"],[17,"سٔ : استعن بالخريطة المقابلة ، واكتب ما تدل عليه األرقام الموقعة عليها :\nٔ) الدابرة . .........................\nٕ) خط طول ربيسي . ....................\nٖ) المحيط . .........................\nٗ) بحر . .........................\n٘) البحر . .........................\n)ٙ أرخبيل . .........................\n)7 األرخبيل . .........................\n)8 جزيرة . .........................\n)9 هضبة . .........................\nٓٔ) هضبة . .........................\nٖٔ) نهر . .........................\nٕٔ) نهر . .........................\nٗٔ) نهر . .........................\nسٕ : أكمل العبارات اآلتية بما يناسبها :\nٔ) المارة التي تحتل المرتبة األولى بين لارات العالم من حيث المساحة هي . ....... ٔ) تنمسم لارات العالم المديم آسيا وأوروبا وأستراليا .\n)ٕ( مولع طريك الحرير وطريك التوابل عزز األهمية االلتصادية لمولع لارة آسيا منذ المدم .\n)ٖ( أدى المولع الفلكي لمارة آسيا إلى تنوع مناخها الطبيعي .\n)ٗ( نشؤت بمارة آسيا عديد من الحضارات العريمة مثل الحضارة الصينية والحضارة اليونانية .\n)٘( تمتد لارة أوروبا بؤكملها في النصف الكرة األرضية الشمالي .\n) (7 تشؽل السالسل الجبلية والهضاب أكثر من نصف مساحة لارة آسيا .\n) ي (8 سود الجزء الشمالي في لارة أوروبا السالسل الجبلية المرتفعة .\n) (9 تعد لمة مون بالن أعلى لمة جبلية في العالم وتمع بمارة آسيا .\n)ٓٔ( توجد بمارة أوروبا عدد لليل من الهضاب ومنها هضبة الميزيتا بدولة فرنسا ."],[19,")ٕٔ( يعد السهل األوروبي العظيم أكبر السهول الفيضية في أوروبا .\n)ٖٔ( تؤتي لارة آسيا في المرتبة الثانية بين لارات العالم من حيث طول سواحلها .\n)ٗٔ( تتميز السهول الساحلية في لارة أوروبا بكثرة التعاريج مما ساعدها على ليام الموانا الطبيعية ) (.\nس٘ : اكتب ما تشير إليه كل عبارة مما يأتي :\nٔ) أكبر لارات العالم من حيث االمتداد الفلكي .\nٕ) المضيك الذي يفصل بين لارة آسيا ولارة أمريكا الشمالية .\nٖ) مجموعة من الجزر المتجاورة .\nٗ) أعلى لمة جبلية في العالم و يبلػ ارتفاعها 88ٗ8 م .\nس :ٙ بم تفسر :\nٔ) تعرف كل من لارتي آسيا وأوروبا بـ أوراسيا .\nٕ) األهمية االستراتيجية لمولع لارة آسيا .\nٖ) مولع لارة آسيا أهمية التصادية كبيرة .\nٗ) للمولع الجؽرافي لمارة أوروبا أهمية التصادية .\n٘) لمولع لارة أوروبا أهمية استراتيجية .\n)ٙ تعرف هضبة التبت بسمف العالم .\n)7 تعد لارة آسيا أكبر لارات العالم من حيث طول سواحلها .\n)8 ليام عديد من الموانا الطبيعية في لارة أوروبا .\nس :ٚ ما النتائج المترتبة على :\nٔ) المولع الفلكي لمارة آسيا .\nٕ) إشراف لارة أوروبا على مضايك مهمة ."],[20,"س :ٛ دلل على صحة كل عبارة من العبارات التالية :\nٕ) لمولع لارة آسيا أهمية دينية .\nٖ) كانت لارة آسيا موطنا ً لعديد من الحضارات المديمة .\nٗ) تعددت الحضارات في لارة أوروبا .\n٘) تتعرض السهول الساحلية في لارتي آسيا وأوروبا للعديد من المخاطر .\nس :ٜ قارن بين :\nٔ) األهمية االلتصادية لمولع لارة آسيا ومولع لارة أوروبا .\nٕ) الجبال في لارة آسيا ، ولارة أوروبا .\nٖ) هضاب لارة آسيا ، وهضاب لارة أوروبا .\nٗ) السهول الفيضية في لارتي آسيا وأوروبا .\nسٓٔ : ماذا يحدث إذا \" : اتسمت السهول الساحلية لمارة أوروبا باالستمامة\"؟\nٔ) يصعب االستفادة من األنهار التي تجري في شمال لارة آسيا طوال العام .\nٕ) للسهول الفيضية بمارة أوروبا أهمية التصادية كبيرة .\nٖ) جميع السهول الساحلية في لارتي آسيا متسعة .\nٗ) يوجد بالمرب من سواحل لارة آسيا عدد كبير من الجزر .\nسٕٔ : وضح أوجه الشبه بين :\nٕ) السهول الساحلية في لارتي آسيا وأوروبا ."],[21,"تتمتع قارتا آسيا وأوروبا بثروة كبيرة من المعادن ، ومصادر الطاقة األحفورية ومصادر الطاقة\nالمتجددة .\nأوالي : املعادن يف قارتي آسيا وأوروبا\nأهمية النشاط التعديني ؟ من المصادر المهمة للدخل القومى فى بعض دول قارتي آسيا\nوأوروبا ، ويعتمد عليها العديد من الصناعات ومن أهم هذه المعادن :\nالمعادن األساسية ومعادن\nالمعادن الخفيفة\nالمعادن االستراتيجية\nالصناعات الحديدية\nوالنووية\nمثل (الحديد – الكروم –\nمثل (التيتانيوم – البوكسيت) مثل (اليورانيوم)\nالنحاس – المنجنيز – النيكل)\nوالخريطة التالية توضح توزيع هذه المعادن في بعض المناطق بقارتي آسيا وأوروبا وأهم\nالدول المنتجة :\n• من أهم هذه المعادن :"],[22,"ٔ - المعادن األساسية ومعادن الصناعات الحديدية :\nٔ - الحديد :\n أهميته : يستخدم في صناعة الصلب ووسائل النقل .\n إنتاجه في كل من آسيا وأوروبا وأهم الدول المنتجة لكل منهم :\nوجه المقارنة\nأهم الدول\nقارة أوروبا\nقارة آسيا\nتعد الصين أولى دول المارة إنتا ًجا ، وعلى\nالرغم من ذلن تستورد كميات\nيؤتي معظم إنتاج أوروبا من روسيا\nضخمة بم تفسر؟ لتؽطية استهالكها .\nاإلنتاج العالمي\nتنتج أكثر من ثلثي اإلنتاج العالمي .\nتنتج نحو ٘ :ٙ, من اإلنتاج العالمي .\nٕ - المنجنيز :\n أهميته : يدخل في صناعة الصلب وبطاريات السيارات الكهربائية .\n إنتاجه في كل من آسيا وأوروبا وأهم الدول المنتجة لكل منهم :\nوجه المقارنة\nقارة أوروبا\nقارة آسيا\nأهم الدول\nيؤتي معظم إنتاج آسيا من دولتى الصين\nوالهند .\nيؤتى معظم إنتاجها من أوكرانيا .\nاإلنتاج العالمي\nتنتج لارة آسيا نحو ٘ ٖٔ, من اإلنتاج\nالعالمي .\nتنتج لارة أوروبا ٕ : من اإلنتاج العالمي .\nٖ - الكروم :\n أهميته : يدخل في صناعة الحديد والصلب وصناعة الطوب الحرارى .\n إنتاجه في كل من آسيا وأوروبا وأهم الدول المنتجة لكل منهم :\nوجه المقارنة\nأهم الدول\nاإلنتاج العالمي\nقارة أوروبا\nقارة آسيا\nيؤتى معظم إنتاجها من دولتي الهند وتركيا . تعد فنلندا أولى الدول األوروبية إنتا ًجا له\n٘ :ٙ, من اإلنتاج العالمي .\nأكثر من ثلث اإلنتاج العالمي ."],[23,"ٗ - النيكل :\n أهميته : يعد أحد المواد الخام الحرجة دلل؟\nحيث يدخل في صناعة محركات الطابرات وبطاريات السيارات الكهربابية .\n إنتاجه في كل من آسيا وأوروبا وأهم الدول المنتجة لكل منهم :\nوجه المقارنة\nقارة أوروبا\nقارة آسيا\nأهم الدول\nتعد إندونيسيا أولى دول المارة .\nتعد روسيا أولى دول المارة إنتا ًجا له .\nاإلنتاج العالمي\nنحو ثلثى اإلنتاج العالمي .\nويمترب من ٓٔ : من اإلنتاج العالمي .\nما المقصود بالمواد الخام الحرجة ؟ هي مواد خام محدودة الوجود ذات أهمية اقتصادية\nكبيرة ، حيث تدخل في إنتاج الطاقة النظيفة .\n٘ - النحاس :\n أهميته : يدخل فى الصناعات الكهربائية واإللكترونية وصناعة األسالك .\n إنتاجه في كل من آسيا وأوروبا وأهم الدول المنتجة لكل منهم :\nقارة آسيا\nوجه المقارنة\nقارة أوروبا\nأهم الدول\nتعد الصين أولى دول المارة إنتا ًجا له .\nأكثر من نصف اإلنتاج من دولة روسيا .\nاإلنتاج العالمي\nأكثر من خمس اإلنتاج .\nنحو ٓٔ : من اإلنتاج العالمي .\nالتدريب األول\nسٔ : أكمل العبارات اآلتية بما يناسبها من كلمات :\nٔ) يؤتى معظم إنتاج أوروبا من الحديد من دولة . ..........................\nٕ) تعد دولة .......................... أولى دول لارة آسيا فى إنتاج النيكل .\nٖ) تعتبر دولتا الهند وتركيا من أكثر الدول اآلسيوية في إنتاج . ..........................\nسٕ : دلل على صحة العبارات اآلتية :\nٕ) للمنجنيز أهمية التصادية .\nٔ) يعد النيكل من المواد الخام الحرجة ."],[24,"ٕ - المعادن الخفيفة :\nٔ - البوكسيت :\n أهميته ي : عتبر الخام األساسي إلنتاج وصناعة األلومنيوم الذي يدخل في العديد من الصناعات .\n يتركز معظم إنتاج العالم منه فى المناطق المدارية ما النتائج؟ لذلك يقل إنتاجه في\nقارة أوروبا .\n قلةإنتاج البوكسيت في قارة أوروبا بم تفسر؟ بسبب عدم توافر المناخ المالبم (المداري) الالزم\nلتكوين خام البوكسيت في لارة أوروبا حيث تمع معظم أراضيها في المنطمة المناخية المعتدلة الشمالية .\n إنتاجه : في كل من آسيا وأوروبا وأهم الدول المنتجة لكل منهم :\nوجه المقارنة\nقارة أوروبا\nقارة آسيا\nأهم الدول\nتعد الصين أولى دول المارة إنتا ًجا له .\nيؤتى معظم إنتاج المارة من دولة روسيا .\nاإلنتاج العالمي\nوتؤتى لارة آسيا فى المركز األول عالمييا\nفى إنتاجه ، حيث تنتج ُخمسي إنتاج العالم .\n٘ :ٕ, من اإلنتاج العالمي .\nٕ - التيتانيوم :\n أهميته : يُستخدم في صنع هياكل الطائرات والصواريخ واألجهزة الطبية بم تفسر ؟\nألنه يتميز بخفة وزنه وصالبته العالية ، ومماومته الكبيرة للتآكل .\n إنتاجه في كل من آسيا وأوروبا وأهم الدول المنتجة لكل منهم :\nوجه المقارنة\nقارة أوروبا\nقارة آسيا\nأهم الدول\nمعظم إنتاج المارة من دولة الصين .\nمعظم إنتاجها من دولتي النرويج وأوكرانيا .\nاإلنتاج العالمي\nوتؤتى لارة آسيا فى المركز األول عالمييا\nفى إنتاجه ، حيث تنتج ُخمسي إنتاج العالم .\n٘ % من اإلنتاج العالمي ."],[25,"ٖ - المعادن االستراتيجية والنووية :\nاليورانيوم :\n أهميته ي : ستخدم في الصناعات النووية (كمصدر للطالة النووية) .\n إنتاجه في كل من آسيا وأوروبا وأهم الدول المنتجة لكل منهم :\nوجه المقارنة\nقارة أوروبا\nقارة آسيا\nأهم الدول\nتعد كازاخستان أولى دول المارة إنتا ًجا له .\nيؤتى معظم إنتاجه من دولة روسيا .\nاإلنتاج العالمي\nيزيد على نصف اإلنتاج العالمي .\n: ٙ من اإلنتاج العالمي .\nمما سبق نستنتج ارتفاع إنتاج المعادن الخام فى آسيا عن أوروبا ، بم تفسر؟ وذلك بسبب :\nٔ) اتساع مساحة آسيا ممارنة بؤوروبا .\nٕ) تنوع الصخورالموجودة بمارة آسيا .\nٖ) تعرض مساحات كبيرة من لارة آسيا إلى حركات باطنية ممارنة بمارة أوروبا .\nٗ) نفاد كميات كبيرة من الخامات المعدنية األوروبية بم تفسر ؟ بسبب طول فترة االستخراج التي بدأت مع\nالثورة الصناعية (في منتصف المرن الــ .)ٔ8\n تحتل الصين المركز األول آسيوييا فى إنتاج عديد من المعادن منها (الحديد - النحاس - التيتانيوم -\nالبوكسيت)\n تحتل روسيا المركز األول أوروبييا فى إنتاج عديد من المعادن منها (الحديد - النحاس - البوكسيت\n- النيكل - اليورانيوم ) .\nالتدريب الثاني\n(أ) اكتب كلمة (صواب ) أوكلمة (خطأ ) أمام العبارة غير الصحيحة ، مع التصويب :\nٔ) تعد النرويج أولى دول لارة أوروبا في إنتاج البوكسيت .\nٕ) يرتفع إنتاج المعادن في لارة أوروبا عن لارة آسيا .\nٖ) تعد الصين أولى دول لارة آسيا في إنتاج التيتانيوم .\n(ب) بم تفسر ... ؟\nٔ) للة إنتاج البوكسيت في لارة أوروبا .\nٕ) تتم صناعة هياكل الطابرات والصواريخ من التيتانيوم .\nٖ) نفاد كميات كبيرة من الخامات المعدنية األوروبية ."],[26,"ثانياً : مصادر الطاقُ يف قارتي آسيا وأوروبا\nيعتمد قيام النهضة االقتصادية فى العالم على الطاقة ، وتتوفر فى قارتي آسيا وأوروبا\nمصادر متعددة تتمثل في : الطاقة األحفورية والمتجددة .\nالطاقة األحفورية\nالفحم – البترول – الغاز الطبيعي\nالطاقة المتجددة\nالطاقة الشمسية – الطاقة الكهرومائية - طاقة الرياح\nالحظ خريطة توزيع الفحم والبترول والغاز الطبيعى فى قارتي آسيا وأوروبا .\nأوالي : مصادر الطاقة األحفورية في قارتي آسيا وأوروبا :\nالطاقة األحفورية : هي الطاقة الناتجة عن حرق مواد ذات أصل حيواني أو نباتى\nتستخرج من باطن األرض ، وينتج عن حرقها كميات كبيرة من ثاني أكسيد الكربون ، لذا\nتسبب تلوث البيئة مثل ( : الفحم – البترول – الغاز الطبيعي) ."],[27,"أ - الفحم :\nظل الفحم حتى بداية القرن الماضى (القرن الـٕٓ)\nالمصدر الرئيسى للطاقة فى العالم دلل؟\nحيث كان يشكل ثلثى الطالة المستخدمة في العالم ، ولد تراجعت نسبته تدريجيا ً حتى وصلت إلى ربع الطالة\nالمستخدمة عام ٖٕٕٓم ، ومن المتولع أن تنخفض هذه النسبة في المستمبل .\nإنتاجه في كل من آسيا وأوروبا وأهم الدول المنتجة لكل منهم :\nوجه المقارنة\nقارة أوروبا\nقارة آسيا\nأهم الدول\nتؤتى الصين فى المرتبة األولى ، حيث تنتج\nنحو نصف اإلنتاج العالمي .\nتعد روسيا أولى الدول األوروبية فى اإلنتاج .\nاإلنتاج العالمي\nتنتج حالييّا٘ % 7 من اإلنتاج العالمي .\nنحو : ٙ من اإلنتاج العالمي .\n بم تفسر : ارتفاع إنتاج قارة آسيا من الفحم ؟\nبسبب :\nٔ) توافر كميات كبير من الفحم في المارة .\nٕ) االعتماد على الفحم كمصدر ربيسى للطالة المستخدمة في عديد من الصناعات خاصة صناعة الصلب .\nٕ - البترول :\nأهميته :\nٔ) يعد مادة خا ًما للصناعات البتروكيماوية الحديثة والصناعات المعدنية .\nٕ) يستخدم بصورة أساسية فى توليد الكهرباء وفي وسابل النمل .\nٖ) يإثر بشكل كبير فى االلتصاد العالمى والعاللات الدولية .\nإنتاجه في كل من آسيا وأوروبا وأهم الدول المنتجة لكل منهم :\nوجه المقارنة\nقارة أوروبا\nقارة آسيا\nأهم الدول\nتتصدر السعودية دول المارة فى اإلنتاج .\nاإلنتاج العالمي\nوتنتج لارة آسيا نحو ُخمسى اإلنتاج العالمي . ولد بلػ إنتاج لارة أوروبا نحو ُخمس\nاإلنتاج العالمي .\nتؤتى روسيا في المركز األول بين دول\nالمارة في إنتاجه ."],[28,"ٖ - الغاز الطبيعى :\nأهميته :\nسا لوييّا للبترول بم تفسر؟ بسبب :\nمصدر مهم للطالة ويعد مناف ً\n- سهولة استخراجه .\n- تكلفته المنخفضة .\n- للة تلويثه للبيبة .\n- رخص ثمنه .\nإنتاجه في كل من آسيا وأوروبا وأهم الدول المنتجة لكل منهم :\nوجه المقارنة\nأهم الدول\nقارة أوروبا\nقارة آسيا\nيؤتي معظم اإلنتاج من دولة إيران ، تليها الصين . تعد دولة النرويج أهم دول المارة فى\nإنتاجه .\nاإلنتاج العالمي تعد لارة آسيا أولى لارات العالمفي إنتاجه حيث\nتنتج نحو ثلث اإلنتاج العالمي .\nتنتج لارة أوروبا نحو خمس اإلنتاج\nالعالمي .\nالتدريب الثالث\n( أ ) اختر اإلجابة الصحيحة مما بين األقواس :\nٔ) تعد دولة .................. أولى دول لارة آسيا في إنتاج الفحم ( . الهند - الصين - السعودية - إيران )\nٕ) أحد مصادر الطالة الذى يإثر بشكل كبير فى االلتصاد العالمى والعاللات الدولية . ................\n(الفحم - الؽاز الطبيعى - البترول - طالة الرياح )\nٖ) تؤتى دولة في المرتبة األولى فى إنتاج الؽاز الطبيعي في لارة آسيا . .............\n(الصين - إيران - السعودية - اإلمارات )\n(ب) اكتب كلمة (صواب ) أوكلمة (خطأ ) أمام العبارة غير الصحيحة ، مع التصويب :\nٔ) يدخل الفحم فى صناعة الصلب .\nٕ) تؤتى أوكرانيا فى ممدمة الدول األوروبية فى إنتاج البترول .\nٖ) يعد الؽاز الطبيعى أحد مصادر الطالة المتجددة .\n(جـ) بم تفسر ... ؟\nٕ) ارتفاع إنتاج لارة آسيا من الفحم ."],[29,"ثانياً : مصادر الطاقة المتجددة في قارتي آسيا وأوروبا :\n• تحظى الطاقة المتجددة باهتمام كبير ومتزايد فى العالم\nخالل العقود األخيرةبم تفسر؟ وذلك لعدة أسباب منها :\nٔ) أنها طالة نظيفة غير ملوثة للبيبة .\nٕ) تنتج عن مصادر متجددة غير لابلة للنفاد .\nٖ) أنها متوفرة في معظم مناطك العالم .\nكبيرابحلول عام ٕٓ٘ٓم .\nٗ) زيادة االعتماد عليها ينتج عنه انخفاض انبعاثات ثانى أكسيد الكربون انخفاضيا\nمن خالل الخريطة السابقة نستنتج :\nتعددت مصادر الطاقة المتجددة فى قارتي آسيا وأوروبا ، ومن أهمها :\nأ - الطاقة الكهرومائية :\nوجه المقارنة\nقارة آسيا\nقارة أوروبا\nأهم الدول\nتعد الصين أولى دول المارة إنتا ًجا لها .\nتعد روسيا أكبر الدول األوروبية .\nاإلنتاج العالمي\nوتنتج لارة آسيا نحو نصف الطالة\nالكهرومابية عالمييّا بم تفسر؟ بسبب كثرة\nاألمطار واألنهار في المارة ."],[30,"ب - طاقة الرياح :\nوجه المقارنة\nقارة أوروبا\nقارة آسيا\nأهم الدول\nتعد الصين أولى الدول المنتجة عالميا ً .\nتحتل ألمانيا المركز األول فى إنتاجها .\nاإلنتاج العالمي\nنحو نصف إنتاج طالة الرياح عالمييا .\nنحو ربع اإلنتاج العالمي .\nج - الطاقة الشمسية :\nوجه المقارنة\nقارة أوروبا\nقارة آسيا\nأهم الدول\nتعد الصين أولى الدول المنتجة عالميا ً .\nتحتل ألمانيا المركز األول فى إنتاجها .\nاإلنتاج العالمي\nنحو ثلثي اإلنتاج عالمييا .\nنحوخمس اإلنتاج العالمي .\nمشكالت التعدين في قارتي آسيا وأوروبا وطرق مواجهتها :\nٔ) يؤدى الهشاط التعديين إىل انبعاث كنيات كبرية مو غازثانى أكصيد الكربوى ما النتائج؟ مما يتسبب في\nٕ) التؽيرات المناخية .\nٖ) تصتخدم مواد كينيائية ضارة يف التعديو الصطحي والباطين ما النتائج؟ مما يتسبب في اختالط المواد بمياه\nاألمطار ، وتنتمل إلى األنهاروالمياه الجوفية .\nٗ) االرتفاع الكبري فى تكاليف اإلنتاج ، دلل ؟ حيث تعانى أوروبا ارتفاع تكاليف العمالة ممارنة بآسيا ، إلى جانب\nارتفاع تكلفة استخراج الموارد المعدنية من المناطك النابية .\n٘) ضعف التكهولوجيا املصتخدمة يف التعديو دلل ؟ حيث تفتمر بعض مناطك لارة آسيا إلى التكنولوجيا الحديثة\nوتدريب العمالة فى مجال التعدين ممارنة بالتمدم التكنولوجي في لارة أوروبا .\n)ٙ اشتهساف العديد مو املوارد املعدنية مو دول غرب أوروبا مجل فرنصا وبريطانيا بم تفسر؟\nبسبب االستخدام غير المستدام لها ، وطول فترة التعدين .\nأكد فهمك :\nأثرت الحرب الروسية - األوكرانية بشكل كبير على استخراج الحديد والمنجنيز من مناجم\nأوكرانيا ، وذلك بسبب ارتفاع تكاليف التشغيل وتعرض العديد من مناطق التعدين للقصف ."],[31,"طرق مواجهة مشكالت التعدين فى قارتي آسيا وأوروبا :\nقامت القارتان بالعديد من المحاوالت لمواجهة مشكالت التعدين ومنها :\nٔ) إطالق العديد من مبادرات استدامة الموارد المعدنية وذلن من خالل :\nاالتجاه نحو إعادة تدوير المعادن .\nالبحث عن بدابل للموارد النادرة وتمليل االعتماد عليها .\nاستخدام التمنيات الحديثة بم تفسر؟ لتمليل التؤثيرات السلبية للتعدين على البيبة .\nالتوسع فى استخدام الطالة المتجددة في المناجم الخضراء .\nٕ) إصدار عدة لوانين لحماية البيبة من اآلثار السلبية للتعدين مثل «لانون المواد الخام الحرجة » الذي أصدره\nاالتحاد األوروبى بم تفسر؟ لضمان استدامة الموارد المعدنية لألجيال المادمة .\nما المقصود بالمناجم الخضراء ؟هي مناجم يستخدم فيها أساليب تعدين حديثة وصديقة\nللبيئة ؛ لتقليل التلوث البيئي وتحقيق االستخدام األمثل والمستدام للموارد الطبيعية .\nالتدريب الرابع\nسٔ : بم تفسر ... ؟\n)ٔ(ارتفاع إنتاج لارة آسيا من الفحم .\n(ٕ) يعتبر البترول من أهم مصادر الطالة األحفورية في العالم .\n(ٖ) توسع العالم في استخدام الؽاز الطبيعي كبديل للبترول .\n(ٗ) اتجاه العالم إلى استخدام الطالة المتجددة خالل العمود األخيرة .\n(٘) تنتج آسيا نحو نصف إنتاج الطالة الكهرومابية عالميا ً .\nسٕ : وضح :\n)ٔ(اثنين من المشكالت التي تواجه التعدين في لارتي آسيا وأوروبا .\n(ٕ) إحدى المحاوالت التي لامت بها آسيا وأوروبا لمواجهة مشكالت التعدين ."],[32,"سٔ : استعن بخريطة قارة آسيا المقابلة ، وأجب عن مدلول األرقام :\n)ٔ( من أهم الدول المارية المنتجة لمعدن الكروم . ............\n)ٕ( أولى دول المارة المنتجة لمعدن النيكل . ............ .\n)ٖ( الدولة التي تتصدر إنتاج البترول بآسيا . ............ .\n)ٗ( أولى دول لارة آسيا إنتاجا ً لليورانيوم . ............ .\n)٘( أكثر دول لارة آسيا إنتاجا ً للنحاس والبوكسيت .. ............\nسٕ : استعن بخريطة قارة أوروبا المقابلة ، وأجب عما يأتي بكتابة الرقم المناسب :\n)ٔ(أهم دول المارة إنتاجا ً للمنجنيز . ............ .\n)ٕ(الدولة التي تتصدر إنتاج الكروم بمارة أوروبا . ..... ....... .\n)ٖ(أولى دول أوروبا في إنتاج الفحم .. ............\n)ٗ(أولى الدول األوروبية إنتاجا ً للطالة الشمسية وطالة الرياح معا ً . ............ .\n)٘(أهم دول أوروبا إنتاجا ً لمصدر الطالة المنافس الموي للبترول . ............ .\nسٖ : أكمل العبارات اآلتية بما يناسبها :\n)ٔ( من أهم الدول المنتجة للكروم بمارة آسيا دولتي ................ و ................\n)ٕ( تفتمد كميات كبيرة من الخامات المعدنية بمارة أوروبا كما حدث في دولتي ............... و ...............\n)ٖ( أولى الدول اآلسيوية إنتاجا ً للطالة الكهرومابية . .................\nسٗ : اختر اإلجابة الصحيحة مما بين القوسين :\n)ٔ( تنتج لارة آسيا أكثر من ثلثي اإلنتاج العالمي من معدن . .............\n(المنجنيز - البوكسيت - ا لارة آسيا إنتاجا ً للمنجنيز .\n)ٖ( يعد معدن الكروم أحد المعادن االستراتيجية والنووية .\n)ٗ( تحتل روسيا المركز األول في إنتاج معدن النيكل على مستوى لارة أوروبا .\n)٘( يتميز معدن اليورانيوم بشدة صالبته رغم خفة وزنه ."],[34,") ي (ٙ زيد إنتاج لارة أوروبا عن نصف اإلنتاج العالمي من اليورانيوم .\n) ي (7 رتفع إنتاج المعادن الخام في لارة أوروبا عنه في لارة آسيا .\n) (8 تنتج الصين نحو نصف اإلنتاج العالمي من الفحم .\n) ي (9 رتبط ارتفاع إنتاج الفحم بمارة آسيا بصناعة الصلب .\n)ٓٔ( إنتاج الطالة األحفورية سيسهم في انخفاض انبعاثات ثاني أكسيد الكربون انخفاضا ً\nكبيرا ً بحلول عام ٕٓ٘ٓ م .\n)ٕٔ( تتحمك الطالات األحفورية خالل العمود األخيرة تزايدا ً متزايدا ً النتشارها في معظم دول العالم (.\n)ٖٔ( تعد دولة إندونيسيا من أكثر الدول التي تمتلن المادة الخام التي تدخل في الصناعات النووية (.\n)ٗٔ( تتجه دول أوروبا وآسيا إلعادة تدوير المعادن والبحث عن بدابل للموارد النادرة .\n)٘ٔ( تسهم تكلفة العمالة األوروبية التي تدخل في التعدين ممارنة بالعمالة اآلسيوية .\nاألرض .\nس :ٙ اكتب أهمية كل معدن مما يلي :\n)ٔ(المنجنيز . ................................................................................................\n)ٕ(اليورانيوم . ................................................................................................\n)ٖ(البوكسيت . ................................................................................................\nس :ٚ اكتب ما تدل عليه كل عبارة من العبارات اآلتية :\n)ٔ( مواد خام محدودة الوجود ذات أهمية التصادية كبيرة تدخل في إنتاج الطالة النظيفة .\n)ٕ( مصدر طالة أحفوري يإثر بشكل كبير في االلتصاد العالمي والعاللات الدولية .\n)ٖ( طالة نظيفة غير ملوثة للبيبة تنتج من مصادر غير لابلة للنفاد .\nس :ٛ بم تفسر ... ؟\n)ٔ( يمتلن خام التيتانيوم خصابص فريدة تجعله يدخل في هياكل الطابرات والصواريخ واألجهزة الكهربابية .\n)ٕ( ارتفاع إنتاج المعادن الخام في لارة آسيا عنه في لارة أوروبا .\n)ٖ( يعد الؽاز الطبيعي بديالي لويا ً للبترول ."],[35,")ٗ( حظيت الطالة المتجددة باهتمام كبير عالميا ً خالل العمود األخيرة .\n)٘( استنزاف الموارد المعدنية في دولتي فرنسا وبريطانيا .\n) (ٙ استخدام التمنيات الحديثة لمواجهة مشكالت التعدين .\n) (7 اتجاه دول لارتي آسيا وأوروبا نحو بناء المناجم الخضراء .\n) (8 إصدار لانون المواد الخام الحرجة .\nس :ٜ ما النتائج المترتبة على ... ؟\n)ٔ( النشاط التعديني على البيبة .\n)ٕ( ارتفاع استهالن دولة الصين من معدن الحديد .\n)ٖ( زيادة االعتماد على مصادر الطالة المتجددة .\nسٓٔ : دلل على صحة كل عبارة من العبارات اآلتية :\n)ٔ( للنشاط التعديني أهمية التصادية في بعض دول لارتي آسيا وأوروبا .\n)ٕ( لمعدن اليورانيوم أهمية استراتيجية .\n)ٖ( تعد الصين أهم دول العالم في إنتاج المعادن .\n)ٗ( تراجعت األهمية االلتصادية للفحم كؤحد مصادر الطالة األحفورية .\n)٘( للبترول أهمية التصادية كبرى .\n)ٔ( النيكل وصناعة الطابرات والسيارات .\n)ٕ( الثورة الصناعية ، واالحتياطي المعدني في لارة أوروبا .\n)ٖ( النشاط التعديني ، والتؽيرات المناخية .\n)ٗ( مساحة لارة آسيا ، وإنتاجها من المعادن .\n)٘( االلتصاد األوروبي ، ومشكالت التعدين .\n) (ٙ المناطك النابية داخل لارتي آسيا وأوروبا ، والتعدين .\n) (7 عمليات التعدين ، وتلوث مصادر المياه ."],[36,"سٔ : اكتب ما تشير إليه األرقام الموقعة على الخريطة :\nٔ – هضبة . ................\nٕ - نمطة التراب لارتي أوروبا\nوإفريميا . ..............\nٖ - مضيك . ..............\nٗ - أرخبيل . ..............\nه - نهر . ..............\n- ٙ أولى الدول اآلسيوية إنتاجا ً\nللنحاس . ..............\n-7 إحدى الدول المنتجة للطالة الكهرومابية . .............. .\nسٕ : اكتب كلمة (صواب ) أوكلمة (خطأ) أمام العبارة غيرالصحيحة مع تصويب الخطأ :\nٔ - تتشابه الحدود الشمالية لمارتي آسيا وأوروبا .\nٕ - أعلى لمة جبلية في العالم هي لمة جبل مون بالن .\nٖ - تُعد دولة إندونيسيا أولى الدول اآلسيوية إنتاجا للبترول .\nٗ - تُعد كازاخستان أولى دول لارة آسيا في إنتاج اليورانيوم .\nسٖ : اختر اإلجابة الصحيحة مما بين القوسين :\nٔ ي - فصل بين لارتي آسيا وأستراليا بحر ( . ......... لزوين - تيمور - الصين - العرب )\nٕ - دابرة العرض الربيسية المارة في لارة أوروبا . ......\n(دابرة االستواء - الدابرة المطبية الشمالية - مدار السرطان - الدابرة المطبية الجنوبية)\nٖ - أي من المعادن التالية يدخل في صناعة هياكل الطابرات والصواريخ؟ . ......\n(الكروم - البوكسيت - اليورانيوم - التيتانيوم)\nسٗ : أكمل العبارات التالية بما يناسبها من كلمات :\nٔ - تؤتي لارة أوروبا من حيث المساحة بين لارات العالم في المرتبة . ...... .\nٕ يُ - طلك اسم سمف العالم على هضبة . ...... .\nٖ - أولى الدول األوروبية إنتا ًجا لطالة الرياح والشمس . ...... ."],[37,"س٘ : ما المقصود بكل ما يلي ... ؟\nٔ - المناجم الخضراء .\nٕ - مواد خام حرجة .\nس :ٙ فسر العبارات التالية :\nٔ - األهمية اإلستراتيجية لمولع لارة آسيا ..\nٕ ي - ختلف اتساع مساحة السهول الساحلية في لارة آسيا ..\nٖ يُ - عد البترول أحد أهم مصادر الطالة األحفورية في العالم ..\nٗ - تزايد االهتمام العالمي بالطالة المتجددة .\nس :ٚ ما النتائج المترتبة على ... ؟\nٔ - امتداد السهول الفيضية في لارة أوروبا ..\nٕ - كثرة تعاريج سواحل لارة أوروبا ..\nس :ٛ دلل على صحة كل عبارة مما يلي :\nٔ - تمتلن لارة أوروبا مولعيا مميزا بين لارات العالم .\nٕ - تختلف مسميات جبال األلب من دولة ألخرى ..\nٖ ي - وجد عديد من السهول الفيضية في لارة آسيا .\nس :ٜ أجب عما يلي :\nٔ - ماذا يحدث إذا تشابهت السهول الساحلية بمارتي آسيا وأوروبا؟ ..\nٕ - حدد أوجه التشابه بين لارتي آسيا وأوروبا من حيث المولع ..\nٖ - لارن بين دولتي الصين وروسيا من حيث أهم المعادن التي تنتجها كل منهما .."],[39,"موقع بعض الحضارات التي نشأت في آسيا وعوامل قيامها :\nنشأت على أرض قارة آسيا عدة حضارات ساهمت فى تشكيل التاريخ اإلنسانى من خالل\nما قدمته للبشرية من إنجازات حضارية فى مختلف المجاالت كما يتضح في الخريطة\nالتالية :\nعوامل قيام الحضارات القديمة في قارة آسيا :\n بم تفسر : قيام الحضارات القديمة بقارة آسيا ؟ ج / بسبب مجموعة من العوامل وهي :\nٔ - الموقع\nارتبط مولع معظم الحضارات المديمة بمارة آسيا بتوافر المياه العذبة والتربة الخصبة\nما النتائج؟ مما ساعد على ليام الزراعة وازدهارها .\nمثل : حضارة الصين – حضارة بالد السند – حضارة بالد العراق المديم .\nٕ - التضاريس\nكان للتضاريس المتنوعة دوريا مهما في قيام الحضارات دلل؟\n• حماية هذه الحضارات من الؽزو الخارجي .\n• توفير الموارد الطبيعية الالزمة لها .\nٖ - المناخ\nكان للمناخ دوريا مهما في قيام الحضارات دلل؟ حيث ساعد اعتدال المناخ\nعلى استمرار السكان واستؽاللهم للموارد المتاحة ."],[40,"أوالي : حضارات بالد العزاق القديم\n تُعد حضارات بالد العراق القديم إحدى أقدم الحضارات التي ظهرت في قارة آسيا .\n بم تفسر : سُمّيت حضارات بالد العراق القديم بحضارات(بالد الرافدين)؟\nألنها حضارات نشؤت في السهول الفيضية الوالعة بين نهري دجلة والفرات .\n دلل : لعب نهرا دجلة والفرات دوراً مهماً في حياة سكان بالدالرافدين؟\nحيث استفاد سكان بالد الرافدين من نهرى دجلة والفرات في :\nٔ) توفير المياه العذبة لميام الزراعة .\nٕ) التجارة ونمل البضابع بين مدن بالد الرافدين والمناطك المجاورة في شمال سوريا .\nأهم الحضارات القديمة في بالد العراق القديم :\n دلل : تعدد الحضارات األسيوية التي قامت على ضفاف نهري دجلة والفرات؟\nالحضارة السومرية\nالحضارة البابلية األولى\nالحضارة األكادية\nالحضارة اآلشورية"],[41,"وفيما يلي سنتعرف أهم الحضارات القديمة في بالد العراق القديمة :\n نشأتها :\nيُعد السومريون من أوابل الشعوب التي سكنت جنوب بالد العراق المديم على ضفاف نهر الفرات .\nأسس السومريون عدة مدن مثل ( : سومر – أور - لجش) وكانت كل مدينة بمثابة دويلة مستملة ، لكل\nمنها حاكمها ومعبودها ولوانينها الخاصة .\n من أشهر ملوكها : الملك (أورنمو) .\n عاصمتها : مدينة أور .\n ما النتائج : حدوث تنازع بين المدن السومرية؟ أدى إلى :\nضعف المدن السومرية وليام الملن سرجون األول بالسيطرة على المدن السومرية المتنازعة و توحيدها ،\nوبذلن تؤسست أول مملكة موحدة في بالد العراق المديم .\n نشأتها ( : ما النتائج : هجرة األكديون من شبه الجزيرة العربية إلى العراق )\nاستمر األكاديون فى وسط بالد العراق المديم بعد هجرتهم من شبه الجزيرة العربية .\n من أشهر ملوكها : الملك سرجون األول .\n عاصمتها : مدينة أكاد .\n بم تفسر : يُعد الملك سرجون األول نقطة تحول في تارخ بالد العراق القديم؟ أو\n بم تفسر : يُعد الملك سرجون األول من أشهر ملوك الدولة األكادية؟\nألنه استطاع السيطرة على المدن السومرية و توحيدها ، وبذلن تؤسست أول مملكة موحدة في بالد العراق .\n نشأتها : استمر البابليون فى وسط بالد العراق المديم .\n من أشهر ملوكها : الملك حمورابي .\n بم تفسر : يُعد الملك حمورابي من أشهر ملوك الدولة البابلية األولى؟\nإنشاء إمبراطورية واسعة .\nوضع مجموعة من الموانين عرفت باسم (تشريعات حمورابي ) .\n عاصمتها : مدينة بابل .\nألنه قام بـ :"],[42," نشأتها : استمر اآلشوريون فى شمال بالد العراق المديم .\n من أشهر ملوكها : الملك سرجون الثانى الذى اشتهر بإنجازاته الحربية .\n عاصمتها : مدينة آشور .\nما النتائج : اتبع اآلشوريون سياسة العنف ضد الشعوب التي احتلوها؟\nمما أدى إلى : حدوث ثورات متكررة ضدهم أضعفت دولتهم .\nمالمح حضارات بالد العراق القديم :\nٔ - الحياة السياسية :\n كان نظام الحكم فى حضارات بالد العراق المديم ملكييا وراثيا .\n عرفت حضارات بالد العراق القديم نظام (دولة المدينة) دلل؟ حيث :\nكانت كل مدينة مستملة .\nكان لكل مدينة حاكم يجمع بين السلطتين السياسية والدينية .\n أصبح للعراق المديم حكومة مركزية بعد توحيدها على يد األكاديين .\nٕ - الحياة الدينية :\n آمن سكان بالد العراق القديم بفكرة :\nتعدد المعبودات دلل؟ حيث لدسوا لوى الطبيعة .\nالبعث والخلود ما النتائج؟ فوضعوا الطعام والشراب في لبور موتاهم .\n من أشهر معبوداتهم : عشتار .\nٖ - الحياة االجتماعية :\n كانت األسرة نواة النظام االجتماعي في بالد العراق المديم .\n انمسم المجتمع في بالد العراق المديم إلى عدة طبمات على رأسها الطبمة العليا المكونة من :\nالملن ورجال الحكم والكهنة .\nتمتع الكاتب بمكانة اجتماعية مرمولة .\n مع نمو المجتمع ظهرت الحاجة إلى لوانين بم تفسر؟ لتنظيم العاللات والتعامالت بين الناس ."],[43,"بدأت بقوانين الملك أورنمو ثم ظهرت بعد ذلك عدة قوانين منها تشريعات الملك حمورابي :\n بم تفسر : قيام الملك أورنمو بإصدار أول قانون مدون في العصر السومري؟ بهدف :\nٔ) تحميك العدالة االجتماعية وحماية الضعفاء .\nٕ) تنظيم المعامالت التجارية .\n بم تفسر : أهمية تشريعات حمورابي لبالد العراق القديم؟\nألنها : نظمت جوانب الحياة ، كما كفلت حموق المرأة .\nٗ - الحياة االقتصادية :\nالزراعة :\n قامت حضارات بالد العراق القديم على الزراعة بم تفسر؟ لتوافر المياه والتربة الخصبة .\nدلل : اهتم سكان بالد الرافدين بالزراعة؟ ، وذلك من خالل :\nتنظيم شبون الزراعة والرى ، فؤلاموا السدود .\nتطوير أدوات حرث األرض وبذر البذور .\n تنوعت المحاصيل الزراعية عندهم ، ومنها القمح والشعير كما عرفوا زراعة النخيل .\nالصناعة :\nدلل : برع العراقيون القدماء في الصناعة؟ حيث :\nٔ) استخدموا المعادن كالنحاس والذهب والفضة والبرونزبم تفسر؟ لصناعة األدوات الزراعية ،\nوال ُحلى ، واألسلحة ، وغيرها .\nٕ) برعوا في صناعة الخزف واألدوات المنزلية .\nالتجارة :\n أقامت حضارات بالد العراق القديم عالقات تجارية واسعة مع البالد المجاورة دلل؟\n- مصر .\n- بالد فارس (إيران حالييا) .\n- الهند .\n- بالد الشام .\n اعتمد العراقيون على المقايضة فى التبادل التجارى ، ثم استخدموا فيما بعد الذهب\nوالفضة كنقود معدنية ."],[44,"٘ - الحياة الفكرية والعلمية :\n اخترع السومريون الكتابة المسمارية ما النتائج؟\nساعد على :\nتدوين األحداث ونملها عبر األجيال .\nترن إرثيا أدبييا متنوعيا من األساطيروالمصص والشعر .\n برع العراقيون القدماء في علم الفلك دلل؟ ، حيث :\nرصدوا حركة الكواكب والنجوم .\nوضعوا تمويما شمسييا ولمرييا .\n العلوم مثل ( : علم الحساب - علم الهندسة - علم الطب) .\nما المقصود به الكتابة المسمارية ؟ رموز تشبه رءوس المسامير ، وكانت تُكتب باستخدام\nأداة خشبية مدببة تشبه القلم على ألواح من الطين .\n-ٙ العمارة والفنون :\nبلغ الفن فى حضارات بالد العراق القديم درجة عالية من الرقى والتنوع دلل؟\nحيث ظهر ذلك فى :\n التماثيل واألختام والمنحوتات الجدارية وبناء المصور والبوابات والمعابد واألسوار و الزلورات .\nكثيرا من التماثيل بدلة ومهارة عالية مثل : تمثال الثور المجنح .\n لاموا بنحت\n برع سكان بالد العراق القديم في (فن العمارة) دلل؟\nحيث لاموا بتشييد الزلورات بم تفسر؟ ، وذلك لـ :\n- إلامة الشعابر الدينية .\n- تتويج الملن .\n- تكون مكانا لتلمي العلم .\n برع سكان بالد العراق القديم في (فن النحت) دلل؟\nكثيرا من التماثيل بدلة ومهارة عالية مثل : تمثال الثور المجنح .\nحيث لاموا بنحت\n( الزقورة : هرم مدرج يُبنى عليه معبد من الطوب الطيني )"],[45,"التواصل الحضارى بين الحضارة المصرية القديمة وحضارات بالد العراق القديم :\nما النتائج : العالقات التجارية بين الحضارتين؟ أسهمت فى تعميق التبادل الثقافي بينهما .\nومن مظاهر التواصل الحضاري بينهما ما يلي :\n تأثر المصريون القدماء بحضارة بالد العراق القديم دلل ؟\nحيث نمل المصريون عنهم استخدام األختام ونحت الحيوانات المجنحة وعبادة المعبودة عشتار .\n تأثرت حضارات بالد العراق القديم بالمصريين القدماء دلل ؟ حيث :\nٔ) تؤثروا بفكرة تعدد المعبودات ، والبعث والخلود عند المصريين المدماء ( . تؤثر ديني)\nٕ) نملوا عن المصريين صناعة الخزف وزخارفه ( . تؤثر التصادي)\nٖ) بناء الزلورات على شكل الهرم المدرج (تؤثرهم بالمصريين في فن العمارة) ( . تؤثر هندسي ومعماري)\nالتدريب األول\nسٔ : اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) تؤسست أول مملكة موحدة ببالد العراق المديم في عصر الحضارة . .........\n( األكادية - اآلشورية - البابلية األولى - السومرية )\n(ٕ) يُعد الملن حمورابي من أشهر ملون الحضارة (. ....... السومرية - اآلشورية - البابلية األولى - األكادية )\n(ٖ) من أشهر ملون الحضارة اآلشورية واشتهر بإنجازاته الحربية . ......... .\n( حمورابي - سرجون الثانى - أورنمو - سرجون األول )\n(ٗ) أولى الموانين المدونة بحضارات بالد العراق المديم أصدرها . ......... .\n( سرجون الثانى - حمورابي - أورنمو - سرجون األول )\nسٕ : اكتب كلمة (صواب ) أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٔ) كان نظام الحكم فى بالد العراق المديم نظاما ملكييا وراثيا ً .\n(ٕ) آمن سكان بالد العراق المديم بفكرة تعدد المعبودات .\n(ٖ) كان المجتمع فى بالد العراق المديم يتكون من طبمة واحدة .\n(ٗ) وضع الملن حمورابي تشريعات لتنظيم الحياة العامة للمجتمع العرالي المديم .\n(ه) التصر اعتماد العراليين المدماء على نظام الممايضة في التبادل التجاري .\n( يُ )ٙ عد تمثال الثور المجنح ً\nدليال على براعة فن النحت في حضارة العراق المديم .\nسٖ : دلل :\n(ٔ) اهتم سكان حضارات بالد الرافدين بالزراعة .\n(ٕ) لامت حضارات بالد العراق المديم بعاللات تجارية مع الحضارات المجاورة .\nكبيرا .\nتطورا\n(ٖ) شهدت الحياة الفكرية والعلمية بحضارات بالد العراق المديم\nسٗ : ما النتائج : سياسة العنف التي اتبعها ملون اآلشوريين مع الشعوب التي احتلوها ؟\nس٘ : ما المقصود بـ : الكتابة المسمارية ؟"],[46,"ثانييا : حضارَ فيهيقيا .\n قامت على أرض بالد الشام (سوريا - لبنان - األردن - فلسطين ) عدة حضارات منذ القدم .\n كان الفينيقيون أول من استقروا على الشريط الساحلى شرق البحر المتوسط .\nمالمح الحضارة الفينيقية :\nٔ - الحياة السياسية :\n بم تفسر : لم تعرف فينيقيا الوحدة السياسية أونظام الدولة الموحدة؟\nألنها كانت مكونة من عدة مدن ، وكانت :\nكل مدينة تمثل مملكة مستملة .  من تلك المدن - : مدينة جبيل .\nكل مدينة لها حاكم خاص بها يحكمها بالوراثة . - مدينة بيروت .\n- مدينة أوغاريت .\nٕ - الحياة الدينية :\n آمن الفينيميون بفكرة تعدد المعبودات واتخذوا معبوداتهم من لوى الطبيعة .\n جسد الفينيميون معبوداتهم فى صورة بشرية ، وشيدوا لها المعابد .\n من أشهر معبوداتهم : بعل .\nٖ - الحياة االجتماعية :\nكان المجتمع الفينيمى ممس ًما لطبمات مثل المجتمعين المصرى المديم والعرالي المديم ."],[47,"ٗ - الحياة االقتصادية :\nالزراعة :\nدلل : استغل الفينيقيون المناطق السهلية والجبلية في الزراعة؟ حيث :\nٔ) لام الفينيميون بزراعة المناطك السهلية ، وزرعوا العنب والتين والزيتون .\nٕ) لام الفينيميون بتحويل سفوح جبال لبنان إلى مصاطب زراعية .\nالصناعة :\n دلل : تفوق الفينيقيون في كثير من الصناعات ؟ حيث :\nٔ) اشتهروا بصناعة - : األصباغ من الكابنات البحرية .\n- المالبس من الحرير والمطن والكتان .\nٕ) برعوا في صناعة - : الزجاج الملون .\n- السفن من أخشاب األرز .\n ما العالقة بين : استقرار الفينيقيين على ساحل البحر المتوسط ، والصناعة .\nحيث كان الستمرار الفينيميين على ساحل البحر المتوسط دور فى شهرتهم بصناعة األصباغ المستخرجة من\nالكابنات البحرية والسفن من أخشاب األرز .\nالتجارة :\n سيطر الفينيميون على التجارة البحرية في البحر المتوسط .\n لد اشتهر الفينيميون بالمالحة وأسسوا مراكز تجارية لهم مثل : لرطاج .\n استخدم الفينيميون الممايضة فى التبادل التجارى ، ثم سكت (طبعت) النمود من الذهب .\n٘ - الحياة الفكرية والعلمية :\nما العالقة بين : الفينيقيين ، واألبجدية األوروبية الحديثة؟\nحيث ابتكر الفينيميون حروفيا أبجدية مكونة من ٕٕ حرفيا ، وتعد من ألدم األبجديات في\nالتاريخ ، ولد انتملت إلى اإلغريك (اليونانيين) ، ثم انتشرت فى أوروبا ، لتصبح أساس األبجدية الحديثة .\nاهتم الفينيقيون بالعديد من العلوم مثل :\n علم الفلك وعلم الحساب بم تفسر؟ لمساعدتهم فى المالحة البحرية والتجارة .\n علم الجغرافيا ولد ساهموا في تطويره من خالل رحالتهم البحرية ما النتائج؟ أدى إلى اكتشاف مناطك\nجديدة ."],[48,"ما النتائج : اهتمام الفينيقيون بالمالحة البحرية ؟\nترتب على ذلك :\n اكتشاف مناطك جديدة ساهمت في تطوير علم الجؽرافيا .\n تؤسيس مراكز تجارية لهم على سواحل البحر المتوسط مثل : لرطاج .\n-ٙ العمارة والفنون :\nبرع الفينيقيون في فن العمارة دلل؟\nبرع الفينيقيون في فن النحت دلل؟\nحيث شيدوا العديد من المعابد والمصور والمالع\nحيث اشتهروا بنحت التماثيل الصؽيرة من العاج\nوالحصون ، كما بنوا األسوار حول المدن ، بم تفسر؟\nوالحجر والخشب .\nلحمايتها من األعداء .\nالتواصل بين الحضارة المصرية القديمة والحضارة الفينيقية :\nدلل : تأثرالفينيقيون بمظاهر الحضارة المصرية القديمة من الناحية الدينية ؟ حيث :\nتؤثروا بالمعتمدات الدينية عند المصريين كالبعث والخلود .\nدلل : تأثرالفينيقيون بمظاهر الحضارة المصرية القديمة من الناحية االقتصادية ؟\nحيث :\nٔ) نملوا عن المصريين المدماء صناعة الخزف والفخار .\nٕ) استورد المصريون المدماء من فينيميا أخشاب األرز بم تفسر؟\nالستخدامها في صناعة السفن وتوابيت الملون .\nٖ) استعان الملن المصرى نخاو الثانى بالبحارة الفينيميين للدوران حول إفريميا .\nدلل : امتدت سيادة مصر إلى بالد الشام في عصر الدولة الحديثة ؟ حيث :\nٔ) حكم المصريون المدماء بالد الشام فى فترات متمطعة خاصة في عصر الدولة الحديثة وكان المصريون\nيديرون الحكم فى بالد الشام من خالل تعيين حكام محليين أوفياء لمصر ويحكمون باسمها .\nٕ) ولد اهتم المصريون بإنشاء المعابد والمراكز والحاميات العسكرية هنان .\nنهاية حضارات بالد العراق القديم وفينيقيا :\nتعاقب على حكم بالد العراق القديم وفينيقيا كل من :"],[49,"ٔ - الفرس :\nلاموا بؽزو بالد العراق المديم وبالد الشام في حوالى المرن السادس لبل الميالد ما النتائج؟\nمما أدى إلى بماء هذه المناطك تحت حكمهم لفترات طويلة .\nٕ - مجئ اإلسكندر األكبر المقدوني :\nما النتائج : اتجه اإلسكندر األكبر بجيشه نحو الشام وبالد العراق القديم ؟\nجاء من بالد اإلغريق (اليونان) ونجح في :\nهزيمة الفرس وضم هذه المناطك(العراق وفينيميا) إلى إمبراطوريته الواسعة .\nٖ - السلوقيون :\nما النتائج : وفاة اإلسكندر األكبر ؟\nمما أدى إلى :\nٔ) انمسمت إمبراطورية اإلسكندر بين لواده عامٖٕٖ ق . م .\nٕ) كانت بالد العراق المديم وبالد الشام من نصيب لابده سلولس الذي أسس الدولة السلولية في العراق\nوبالد الشام التي استمرت حوالي لرن ونصف .\nٗ - الفرس والروم :\nما النتائج : ضعف الدولة السلوقية ؟\nمما أدى إلى :\nٔ) استولى الفرس مرة أخرى على العراق .\nٕ) استولى الروم على بالد الشام .\n٘ - فتح العرب المسلمين :\nظلت بالد العراق وفينيميا تحت االحتالل حتى فتحها العرب المسلمون .\n دلل : تعرض بالد العراق القديم وفينيقيا للغزوات المتكررة منذ القرن الـ ٙ ق . م؟ حيث :\nٔ) غزا الفرس بالد العراق والشام .\nٕ) نجح اإلسكندر األكبر الممدونى فى هزيمة الفرس والسيطرة على الدولتين .\nٖ) بعد وفاة اإلسكندر عام ٖٕٖ ق . م كانت الدولتان من نصيب لابده سلولس الذي أسس الدولة السلولية\nواستمرت حوالي لرن ونصف .\nٗ) استولى الفرس على العراق مرة أخرى والروم على بالد الشام بعد نجاحهم في هزيمة السلوليين وظلوا\nتحت االحتالل حتى فتحهما العرب المسلمون ."],[50,"سٔ : أكمل العبارات اآلتية بكلمات مناسبة :\n(ٔ) من الحضارات المديمة التى ظهرت فى لارة آسيا حضارة الهند و ............ و . ............\n(ٕ) عرفت حضارات بالد العراق المديم نظام دولة المدينة وكان حاكمها يجمع بين السلطتين .\n............ و . ............\n(ٖ) عرفت الكتابة فى العراق لدي ًما باسم الكتابة .. ............\n(ٗ) مثلت نواة النظام االجتماعى فى بالد العراق المديم . ............ .\n(ه) لامت على أرض بالد الشام العديد من الحضارات المديمة ومنها ... ............\n( )ٙ تمثل ألدم أبجدية فى التاريخ األبجدية . ............ .\nسٕ : اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) ألدم الحضارات فى بالد العراق المديم الحضارة . ..........\n(السومرية - البابلية األولى - اآلشورية - األكادية )\n(ٕ) من أشهر ملون الحضارة األكادية الملن . ............ .\n( حمورابي - أور نمو - سرجون األول - سرجون الثاني )\n(ٖ) أول الحضارات التي لامت بنمل بالد العراق المديم من نظام الدويالت المستملة إلى نظام المملكة الموحدة\nالحضارة . ............ .\n(السومرية - األكادية - البابلية األولى - اآلشورية )\n(ٗ) كان يُمثل إحدى فبات الطبمة العليا في العراق المديم ( . ......... التجار - الكهنة - الصناع - المزارعين )\n(ه) وضع التمويم الشمسى والممرى من إنجازات العراليين المدماء في علم . ............\n( الحساب - الهندسة – الفلن - الجؽرافيا )\n( )ٙ تدل الصورة الممابلة على تمدم العراليين المدماء في علم . . ............\n(العمارة - النحت - الهندسة - الحساب )\n( )7 من أوابل الشعوب التى استمرت على الشريط الساحلى شرق البحر المتوسط . ............ .\n(اآلشوريين - الفينيميين - األكاديين - البابليين )\n( )8 استعان الملن نخاو للدوران حول إفريميا ببحارة ( . ............ فينيميين - آشوريين - بابليين - سومريين )\n( )9 نمل العراليون المدماء عن الحضارة المصرية المديمة . ............ .\n( األختام - نحت الحيوانات المجنحة - عبادة عشتار - بناء الزلورات على شكل الهرم المدرج )\n( الزراعة - التجارة - الصناعة - الرعى )"],[51,"(اإلغريك - الفرس - الروم - الفينيميين )\n(ٕٔ) انتهى حكم السلوليين لبالد الشام على يد ( . ............ . الفرس - اإلغريك - الروم - العراليين )\n(ٖٔ) واجه العرب المسلمون عند فتح بالد العراق . ............ .\n(الروم - الفرس - اإلغريك - السلوليين )\nسٖ : اكتب كلمة (صواب ) أوكلمة (خطأ) ، مع التصويب :\n(ٔ) تعد توافر المياه العذبة من أهم عوامل ليام معظم الحضارات المديمة بمارة آسيا .\n(ٕ) اآلشوريين أول الشعوب التي سكنت جنوب بالد العراق المديم على ضفاف نهر الفرات .\n(ٖ) تمكنت الحضارة األكادية من السيطرة على المدن السومرية المتنازعة .\n(ٗ) كان حكم بالد العراق المديم حك ًما ملكييا وراثيا .\n(ه) انتملت عبادة المعبودة عشتار من بالد العراق المديم إلى الحضارة المصرية المديمة .\n( )ٙ اشتهر الملن سرجون الثاني بإنجازاته الحربية .\n( )7 أصبح لبالد العراق المديم حكومة مركزية موحدة ألول مرة خالل عصر الدولة البابلية األولى (.\n( )8 كانت سلطة الحكم في العراق المديم فى يد بعض أفراد الطبمة العليا من المجتمع .\n( )9 كان المجتمع العرالي المديم يتكون من عدة طبمات .\n(ٓٔ) تمتع الكاتب بمكانة مرمولة بالمجتمع العرالي المديم .\n(ٕٔ) أسهمت العاللات التجارية بين بالد العراق المديم والمصريين المدماء في تعميك التبادل الثمافي\nفيما بينهم .\n(ٖٔ) بني الفينيميون األسوار حول المدن لحمايتها من األعداء .\n(ٗٔ) كانت بالد العراق المديم همزة وصل ثمافي بين الفينيميين وبالى المارة األوروبية .\n(٘ٔ) استخدام الفينيميون سفوح جبال لبنان في الزراعة .\n( )ٔ7 جسد الفينيميون معبوداتهم في صورة بشرية .\nسٗ : صوب ما تحته خط :\n(ٔ) اتخذ السومريون من مدينة آشور عاصمة لهم .\n(ٕ) من أشهر المعبودات عند العراليين المدماء بعل .\n(ٖ) استطاع الملن نخاو الثانى هزيمة الفرس واالستيالء على فينيميا .\n(ٗ) استولى الروم على العراق بعد هزيمة الدولة السلولية ."],[52,"س٘ : لمن تنسب األعمال التاريخية اآلتية ... ؟\n(ٔ) استطاع السيطرة على المدن السومرية المتنازعة فيما بينها وتوحيدها .\n(ٕ) أحد ملون الحضارة البابلية األولى ولام بوضع مجموعة من الموانين عرفت باسمه لتنظيم مختلف جوانب\nالحياة .\n(ٖ) أسمط حكم الفرس على بالد الشام وجعلها جزء من إمبراطوريته اإلغريمية .\n(ٗ) أسس دولة ببالد العراق المديم وبالد الشام بعد وفاة اإلسكندر األكبر الممدوني .\nس :ٙ اكتب ما تشير إليه كل عبارة من العبارات اآلتية :\n(ٔ) شعوب هاجرت من شبه الجزيرة العربية واستمروا في وسط بالد العراق واتخذوا من مدينة أكاد عاصمة\nلهم .\n(ٕ) كتابة ابتكرها السومريون كانت تكتب باستخدام أداة خشبية مديبة تشبه الملم على ألواح من الطين .\n(ٖ) مكان يتوج فيه الملن وتمام به الشعابر الدينية عند العراليين المدماء .\n(ٗ) نظام اعتمدت عليه بالد العراق المديم فى التبادل التجارى لبل استخدام النمود .\n(ه) أول وسيلة تبادل تجارى استخدمتها الشعوب التي سكنت على الساحل الشرلي للبحر المتوسط .\n( )ٙ مركز تجارى أسسه الفينيميون على ساحل البحر المتوسط .\n( )7 المادة الخام الربيسية التى تستخدم في صناعة السفن والتى جلبها المصريون من بالد فينيميا .\n( )8 الدولة التي حكمت بالد العراق المديم والشام بعد وفاة اإلسكندر األكبر .\nس :ٚ رتب األحداث التالية من األقدم إلى األحدث :\n(ٔ) ( )..... سيطرة اإلسكندر األكبر على بالد الشام .\n( )..... إرسال الملن نخاو الثاني رحلة للدوران حول إفريميا .\n( )...... فتح العرب المسلمون للشام والعراق .\n(ٕ) ( )...... إصدار تشريعات حمورابي .\n( )...... إصدار لانون الملن أور نمو .\n( )...... تؤسيس الدولة السلولية .\n( )...... سيطرة الفرس على العراق .\n( )..... توحيد بالد العراق في مملكة موحدة .\nس :ٛ بم تفسر ... ؟\n(ٔ) ليام الحضارات المديمة بمارة آسيا .\n(ٕ) تُعد التضاريس أحد عوامل نشؤة الحضارات المديمة بمارة آسيا .\n(ٖ) عرفت حضارات بالد العراق المديم بحضارات بالد الرافدين ."],[53,"(ٗ) يُعد الملن سرجون األول من أشهر ملون الحضارة األكادية .\n(ه) أهمية تشريعات \"حمورابي \" لبالد العراق المديم .\n( )ٙ كان للزلورات أهمية خاصة في بالد العراق المديم .\n( )7 وضع العراليون الطعام والشراب في لبور موتاهم .\n( )8 اهتم الفينيميون بعلم الفلن والحساب .\n( )9 استورد المصريون المدماء من الفينيميين أخشاب األرز .\nس :ٜ ما النتائج التي ترتبت على ... ؟\n(ٔ) حدوث تنازع بين المدن السومرية .\n(ٕ) اختراع السومريين للكتابة المسمارية .\n(ٖ) هجرة األكاديين من شبه الجزيرة العربية إلى بالد العراق المديم .\n(ٗ) اتباع اآلشوريين سياسة العنف ضد الشعوب التي احتلوها .\n(ه) رغبة الفينيميين فى  ؟\n(ٔ) حضارة بالد الرافدين ، ونهري دجلة والفرات .\n(ٕ) الحياة الدينية فى بالد العراق المديم والمصريين المدماء .\n(ٖ) فينيميا ، واألبجدية األوروبية الحديثة .\n(ٗ) الملن نخاو الثاني ، وفينيميا .\n(ه) استمرار الفينيميين على ساحل البحر المتوسط ، والصناعات التي اشتهروا بها ."],[55,"بالد اليمن القديم :\nيتضح من الخريطة السابقة أن :\nأرض بالد اليمن القديم (جنوب شبه الجزيرة العربية ) قد شهدت نشأة عديد من الحضارات\nالتي ازدهرت بفضل موقعها الجغرافي المتميز .\n دلل : ساهم الموقع الجغرافي لبالد اليمن القديم في تواصلها مع عديد من الحضارات ؟\nحيث ساهم في تواصلها مع :\nٔ) حضارات شمال إفريميا مثل الحضارة المصرية المديمة .\nٕ) حضارات شرق إفريميا مثل حضارة أكسيوم .\nٖ) ارتباطها بعاللات تجارية وثمافية مع حضارات شرق آسيا في الهند والصين .\nعوامل قيام حضارات بالد اليمن القديم منها :\nٔ) الموقع الجغرافي المتميز .\nٕ) المناخ المعتدل ."],[56,"ٔ - الموقع الجغرافي :\n دلل : ساعد الموقع الجغرافي لبالد اليمن على نشأة حضاراتها؟\n ما العالقة بين : الموقع الجغرافي لبالد اليمن القديم و طرق التجارة العالمية ؟\nحيث : تمكنت بفضل إشرافها على البحر األحمر والمحيط الهندى ، وتحكمها فى مضيك باب المندب من\nالسيطرة على طرق التجارة المديمة .\nٕ - المناخ المعتدل :\n دلل : ساعد المناخ المعتدل لبالد اليمن على نشأة حضاراتها؟\nحيث :\nساعد اعتدال المناخ فوق المرتفعات على استمرار السكان ما النتائج؟ مما وفر بيبة مناسبة لميام حضارة\nمزدهرة في جنوب شبه الجزيرة العربية .\nحضارات بالد اليمن القديم قامت في بالد اليمن عدة حضارات منها :\n بم تفسر : اشتهرت حضارة معين بالنشاط الزراعي ؟\nألن حضارة معين نشؤت في منطمة الجوف التي تعد من أخصب مناطك اليمن وأكثرها صالحية للزراعة .\n اتخذت من مدينة قرناو عاصمة لها .\n اشتهرت بالتجارة والزراعة ."],[57," تمكنت من السيطرة على مناطك حضارة معين .\n اتخذت من مدينة مؤرب عاصمة لها .\n اهتمت بالزراعة وشيدت السدود مثل سد مؤرب .\n ازدهرت بها التجارة .\n من أشهر حكامها « : الملكة بلميس » التي ورد ذكرها فى المرآن الكريم ، والتي عاصرت زمن النبي\nسليمان (عليه السالم) وآمنت به .\n ضعفت مملكة سبأ بم تفسر؟ بسبب :\nٔ) انهيار سد مؤرب .\nٕ) تحول طرق التجارة من البر إلى البحر ما النتائج؟ مما مهد الطريك أمام مملكة حمير للسيطرة\nعلى جميع المناطك التابعة لسبؤ .\nح ْميَريون هم أحد فروع السببيين وتمكنوا من السيطرة على المناطك التابعة لسبؤ .\n ال ِ\n نملوا عاصمة المملكة إلى مدينة ريدان (ظفار حالييا) .\n تميزوا بالتوسع العسكرى الكبير دلل؟ حيث :\nٔ) سيطروا على معظم مناطك اليمن المديم .\nٕ) دخلوا في صراعات مع األحباش والفرس أدت إلى سقوط مملكة حمير .\nأكد فهمك :\n دلل : تعددت العواصم فى الحضارات المختلفة التي قامت ببالد اليمن القديم؟\nحيث كانت :\nٔ) مدينة لرناو عاصمة لحضارة معين .\nٕ) مدينة مؤرب عاصمة لحضارة سبؤ .\nٖ) مدينة ريدان عاصمة لحضارة حمير ."],[58,"التدريب األول\nسٔ : اكتب كلمة (صواب ) أوكلمة (خطأ) ، مع التصويب :\n(ٔ) تُعد الحضارة المصرية المديمة إحدى الحضارات اإلفريمية التي تواصلت معها بالد اليمن المديم (.\n(ٕ) ارتبطت بالد اليمن المديم بعاللات تجارية مع حضارات غرب آسيا في الهند والصين .\n(ٖ) اتخذ ملون حمير مدينة مؤرب عاصمة لهم .\n(ٗ) كان الحميريون أحد أفرع أهل سبؤ .\nسٕ : اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) كانت عاصمة حضارة معين مدينة . ...........\n(ٕ) تُعد الملكة «بلميس » أحد أشهر ملون حضارة . ...........\n(لرناو - ظفار - مؤرب - ريدان )\n(حضرموت - معين - سبؤ - حمير )\n(ٖ) كانت مدينة ريدان « ظفار حاليا ً » عاصمة مملكة سمطت نتيجة الصراع مع . ...........\n(الفرس واألحباش - األحباش ومعين - معين وسبؤ - سبؤ والفرس )\nسٖ : بم تفسر ... ؟\n(ٔ) اشتهرت مملكة معين بحرفة الزراعة .\n(ٕ) نجحت مملكة ِح ْميَر فى السيطرة على جميع المناطك التابعة لحضارة سبؤ .\nسٗ : أيد صحة كل عبارة مما يأتي :\n(ٕ) تعددت العوامل التي ساعدت على ليام حضارات بالد اليمن المديم .\nمالمح حضارات بالد اليمن القديم :\nٔ - الحياة السياسية :\n دلل : تطور نظام الحكم في حضارة بالد اليمن القديم مع مرور الوقت؟ حيث :\nٔ) عاش اليمنيون منذ المدم فى لبابل مستملة ، وكان لكل لبيلة «شيخ» يدير شبونها .\nٕ) مع نشؤة الممالن اليمنية المديمة ، أصبح نظام الحكم ملكييّا وراثيّا ، وكان يساعد الملن في إدارة الدولة\n«مجلس عام» .\nٖ) احتفظت بعض المبابل بحمها فى إدارة شبونها المحلية ضمن مناطك نفوذها ."],[59,"ٕ - الحياة الدينية :\n دلل : عرفت الحضارة الحميرية العباردات غير السماوية والديانات السماوية؟حيث عرفت :\nٔ) العباردات غير السماوية : تعددت المعبودات وكان أبرزها عبادة النجوم والكواكب فشيدوا لها المعابد .\nٕ) يعتقدون في الحياة بعد الموت .\nٖ) الديانات السماوية : اعتنموا اليهودية والمسيحية ، ثم دخلوا في اإلسالم .\nٖ - الحياة االجتماعية :\n احترم المجتمع اليمنى الميم األسرية ، واهتم الوالدان بتربية األبناء .\n اعتمد اليمنيون فى صناعة مالبسهم على - : الصوف .\n- الكتان .\n تميزت حضارة معين بتطبيق العدل في حياتهم االجتماعية دلل؟\nحيث قاموا بالتنظيم العادل لـ :\n- الضرابب .\n- الميراث .\n- العمود .\n- المعامالت التجارية .\n حظيت المرأة بمكانة مرموقة في المجتمع اليمنى دلل؟ حيث :\nٔ) امتلكت حك :\n- وراثة العرش .\n- اختيار الزوج .\nٕ) وصلت إلى أرفع المناصب السياسية مثل ملكة سبؤ « بلميس » .\nٗ - الحياة االقتصادية :\nالزراعة :\n ازدهرت الزراعة فى بالد اليمن القديم بم تفسر؟ بسبب :\n- المناخ المناسب .\nالتربة الخصبة .  اهتم سكان بالد اليمن القديم بالزراعة دلل؟\nحيث اهتم اليمنيون بـ :\nٔ) زراعة الخضراوات والفواكه والحبوب فى السهول وعلى المدرجات الجبلية .\nٕ) إلامة مشروعات الرى .\nٖ) وضع لانون لتنظيم الضرابب الزراعية .\nٗ) تربية الحيوانات ."],[60,"الصناعة :\nدلل : اشتهر سكان بالد اليمن القديم بالعديد من الصناعات ؟\nحيث اشتهرت بالد اليمن القديم بصناعة :\nٔ) األوانى المعدنية والفخارية .\nٕ) األلمشة الحريرية والصوفية والجلود .\nٖ) األسلحة كالسيوف والخناجر .\nالتجارة :\n ما النتائج : الموقع الجغرافي لبالد اليمن بالنسبة لطرق التجارة قديماً؟ مما أدى إلى :\nٔ) أصبحت التجارة النشاط الربيسى فى بالد اليمن المديم وذلن بفضل مولعها على طرق التجارة .\nٕ) أنشؤوا الموانا مثل : ميناء عدن .\nٖ) تحكم اليمنيون في مضيك باب المندب وسيطروا على طرق التجارة لديما ً مثل : طريك البخور .\nٗ) فرضوا ضرابب على البضابع المارة بؤراضيهم .\n من أشهر المنتجات التي صدروها :\n- البخور .\n- اللُبان .\n- العطور .\n٘ - الحياة الفكرية والعلمية :\n دلل : عرف اليمنيون الكتابة منذ القدم ؟ حيث :\nاستخدم اليمنيون األبجدية الحميرية المعروفة بـ « : الخط المسند » وهي تتكون\nمن ٕ9 حرفيا ، ولد عُثر على نموش لهذه الكتابة على جدران المباني والمعابد األثرية .\n برع اليمنيون القدماء في :\n- علم الهندسة .\n دلل : برع اليمنيون في علم الفلك ؟ حيث :\nوضعوا التمويم السببى الذى اعتمدوا عليه فى تحديد الفصول الزراعية . - استخدموا حركة النجوم في تحديد االتجاهات وتوجيه تجارتهم البرية والبحرية .\n- علم الفلك ."],[61,"-ٙ العمارة والفنون :\n دلل : برع اليمنيون في العمارة وهندسة البناء ؟ حيث شيدوا :\n- الحصون .\n- المعابد .\n- القالع .\nالسدود والحواجز المائية ، وأبرزها سد مؤرب . القصور المزخرفة : التى تميزت بروعة التصميم والزخارف دلل؟ حيث كانت تطعم األبواب والجدران واألسمف بالعاج والذهب والفضة واألحجار الكريمة .\n بم تفسر : أهمية سد مأرب ؟\nألنه :\nٔ) يعد من أعظم اإلنجازات الهندسية في العالم المديم .\nٕ) ساهم فى رى مساحات واسعة من األراضى الزراعية .\nالتواصل بين حضارات بالد اليمن القديم والحضارة المصرية القديمة :\n دلل : كانت هناك عالقات تجارية بين حضارات بالد اليمن القديم والحضارة المصرية؟\nحيث عثر على نموش فى أحد المعابد توضح أن دولة معين كانت :\nتصدر لمصر البخور وال ُم َّر بم تفسر؟ الذى كان يستخدم فى الطموس الدينية والتحنيط .\nتستورد من مصر الكتان والذهب .\nنهاية حضارات بالد اليمن القديم :\nٔ - الغزو الحبشي :\nظلت حمير دولة مستملة لوية حتى تولى الملن «ذونواس» الحكم وأثناء حكمه لام باضطهاد المسيحيين من\nأهل اليمن .\nما النتائج : قيام الملك ذو نواس باضطهاد المسيحيين من أهل اليمن؟ ترتب على ذلك :\nوصلت أخبارهم لملن الحبشة (مملكة أكسيوم) ، الذي خرج لليمن ما النتائج؟ وقد ترتب على ذلك :\n- نجاح ملن الحبشة فى هزيمة «ذونواس» .\n- سيطر ملن الحبشة على بالد اليمن المديم .\nٕ - الغزو الفارسي :\nطلب أهل اليمن بميادة األمير «سيف بن ذى يزن »المساعدة من الفرس لتخليصهم من حكم األحباش\nما النتائج؟ وقد ترتب على غزو الفرس لبالد اليمن :\nنجاح الفرس في هزيمة األحباش . - سيطرة الفرس على حكم اليمن الذي استمر حتى ظهور اإلسالم ."],[62,"سٔ : أكمل العبارات اآلتية بما يناسبها :\n(ٔ) ساهم المولع المتميز لحضارات بالد اليمن المديم فى التواصل بينها وبين حضارات شمال إفريميا مثل ....\n(ٕ) من الحضارات التي لامت ببالد اليمن المديم حضارة معين و ........... و . ...............\n(ٖ) لام أهل بالد اليمن المديم بزراعة الخضراوات والفواكه فى السهول وعلى . ...........\n(ٗ) أنشؤ اليمنيون المدماء عدة موانا أشهرها ميناء . ........... .\n(ه)
