\n(ٕ) شهدت الببلد نهضة زراعية فى عصر الدولة الوسطى .\n(ٖ) كانت إثيت تاوى مدينة مثالية لوجود ممر الحكم بها .\n(ٗ) نجح الملن سنوسرت الثالث في تؤمين حدود مصر .\n(٘) اهتمام الملن أمنمحات الثالث بالنشاط التعديني .\n( )ٙ لم يحترم الهكسوس الديانة المصرية المديمة .\n( )۷ تعددت األدوار الوطنية التي لام بها حكام طيبة خبلل األسرتين الحادية عشرة والسابعة عشرة .\nس :11 ماذا كان يحدث إذا لم ي : ستطع الملن أحمس األول المضاء على خطر الهكسوس ؟\nس « :12 ضعف البالد واضطراب أحوالها يؤدى إلى طمع األعداء فيها فاحرص على\nالمحافظة على حدود الوطن والدفاع عنه» .\nفي ضوء العبارة السابقة ، حدد :\n(ٔ) العاصمة التي اتخذها الهكسوس لهم .\n(ٕ) الملن الذي استطاع صد خطرهم على مصر .\n(ٖ) كيف أساء الهكسوس للمصريين .\n«تعدد المنتجات المتبادلة بين مصر وبعض حضارات إفريقيا فى عصر الدولة الوسطى»\nفي ضوء العبارة حدد :\nٔ) اثنين من المنتجات المتبادلة .\nٕ) إحدى المناطك التى شهدت هذا التبادل التجاري ."],[68,"امتحاي عمى الدرس الثاىي\nس ( :1 أ) صوب ما تحته خط :\n(ٔ) أرسل الملن منتوحتب الثانى بعثة تجارية لببلد فينيميا عبر الصحراء .\n(ٕ) يعد الملن سنوسرت الثالث مإسس األسرة الثانية عشرة .\n(ٖ) كانت مدينة إثيت تاوى عاصمة الدولة الوسطى فى عصر الملن منتوحتب الثاني .\n(ٗ) تعد الملكة إياح حتب آخر حكام األسرة الثانية عشرة .\n(ب) «يُعد عصر الدولة الوسطى من أزهى فترات التاريخ المصرى القديم . فى ضوء\nالعبارة ، أجب عما يأتي :\n(ٔ) ما الدليل على البراعة اإلدارية للملن أمنمحات األول ؟\n(ٕ) ما سبب إلامة الملن أمنمحات الثالث لسد البلهون ؟\n(جـ) دلل على صحة العبارة التالية : تعددت األدوار الوطنية التي لامت بها الملكة إياح حتب .\nس ( :2 أ) اختر اإلجابة الصحيحة مما بين القوسين :\n(الشرق - الشمال - الؽرب - الجنوب )\n(ٕ) استولى الهكسوس على مدينة . .........\n(« من - نفر» - طيبة - أواريس - نبتة )\n(ٖ) أى من ملون الدولة الوسطى ساهمت إحدى أعماله فى زيادة حركة التجارة بين مصر وجيرانها ؟ .........\n(منتوحتب الثانى سنوسرت الثالث - أمنمحات الثالث - أمنمحات األول )\nسبِن نفرو بناء هرم والدها في منطمة ( . ....... هوارة - دهشور - سمارة - أبي صير )\n(ٗ) استكملت الملكة ُ\n(ه) أي من ملون الدولة الوسطى يتشابه مع الملن مينا في إعادة توحيد الببلد ؟ . ...........\nس ِبن نفرو - الملن سنوسرت الثالث - الملن أمنمحات الثالث )\n( الملن منتوحتب الثانى - الملكة ُ\n(ب) حدد األثر الناتج عن : ضعف ملون الدولة الوسطى بعد الملن أمنمحات الثالث .\n(جـ) في عهد مَن بُنيت كل منشأة من المنشآت اآلتية ... ؟\n(ٔ) الهرم المدرج .\n(ٕ) حصنى سمنة ولمنة .\n(ٖ) معابد الشمس المكشوفة في أبي صير .\n(ٗ) مماييس النيل عند الجندل الثاني ."],[69,"عرفنا فى الدرس السابق أن الملك أحمس األول استطاع طرد الهكسوس والقضاء على\nخطرهم وإعادة األمن واالستقرار إلى أرجاء البالد ووجه اهتمامه إلى تنظيم البالد ، ليبدأ\nعصريا جديديا هو عصر الدولة الحديثة والتي أُطلق عليها العديد من المسميات ،\nمثل : عصر المجد الحربي .،\n عصر الدولة الحديثة سمى بـ (عصر المجد الحربي أوعصر بناة اإلمبراطورية) بم تفسر؟\nألن ملون الدولة الحديثة استطاعوا تكوين إمبراطورية عظيمة امتدت بين لارتي آسيا وإفريميا\nمن نهر الفرات فى الشمال الشرلى إلى الجندل الرابع جنوباا .\n يشمل 3 أسرات ( من األسرة الثامنة عشرة حتى األسرة العشرين .)20:18\nأيه خصائص عصز الدولة احلديثة\nٔ) وجىد جيش قىى بم تفسر؟\nحيث تم تطوير الجيش مما حافظ على النظام واالستمرار الداخلي\nلمصر ، وحماها من األخطار والتهديدات الخارجية .\nٕ) تكىين إمرباطىرية عظيمة دلل ؟\nحيث امتدت بين لارتي آسيا وإفريميا\n( من نهر الفرات فى الشمال الشرلى إلى الجندل الرابع جنوباا) .\nٖ) االجتاه حنى اجلنىب دلل؟\nحيث تم إرسال العديد من الحمبلت العسكرية والرحبلت التجارية\nنحو إفريميا .\nٗ) االسدهار احلضارى حيث تطورت جميع المجاالت وأصبحت مصر فى مركز حضارى متمدم ما النتائج؟\nمما أدى إلى وجود تؤثير متبادل بينها وبين الحضارات األخرى ."],[70,"٘) الثىرة الدينية التي لام بها الملن إخناتون «أمنحتب الرابع » الذي دعا إلى عبادة إله واحد هو آتون\nورمزله بمرص الشمس .\nما املقصىد بـ إمرباطىرية ؟ دولة كبيرة تسيطر على مناطق وشعوب مختلفة تحت قيادة مركزية\nقوية وتتشكل هذه الدولة عبر الفتوحات أو التحالفات وتضم ثقافات متعددة .\nأشهر ملوك عصر الدولة الحديثة :\n الملن أحمس األول «مؤسس الدولة احلديثة» وحلمة الوصل مع عصر االضمحبلل الثاني .\nحرا لوياا\n كانت فترة حكمه بداية تاريخ جديد لمصر دلل ؟ حيث أصبحت فيها مصر بل ادا ا\nعاشت خبللها فترة من االستمبلل والرخاء .\n أهم أعماله :\nٔ) اختذ من مدينة طيبة عاصمة للبالد .\nٕ) اهتم بتأمني احلدود اجلنىبية ملصز دلل ؟ حيث توجه نحو الجنوب بم تفسر؟ للمضاء على حركات التمرد\nوإعادة األمن ( بعد أن طرد الهكسوس من مصر) .\nٖ) قام حبملة على فينيقيا بم تفسر؟ لبسط نفوذه عليها وبذلن مهد لتكوين اإلمبراطورية المصرية .\nٗ) اهتم بالبناء والتعمري دلل ؟ حيث لام بإصبلح ما تهدم من معابد أثناء فترة احتبلل الهكسوس .\nوبذلك لم يكن عهد أحمس األول كفاحاً مسلحيا فقط دلل؟ حيث كانت تتخلله فترات\nسلم وهدوء واهتم بالبناء والتعمير وإصالح ما تهدم من معابد .\n كانت مصر عندما تولى الحكم بلدا ا مستمرة داخليا ا .\n دلل : قيام الملك تحتمس األول بتغيير الطريقة الملكية في الدفن؟\nحيث فضل أن يدفن فى مكان خفى فاختار له مهندسه إنينى وادى الملون ليدفن فيه ."],[71,"أهم أعماله :\nٔ) اتجه نحو الجنوب حتى أصبحت مدينة « نبتة » ضمن حدود مصر .\nٕ) نظم المنطمة من « نبتة » إلى شمال إدفو وجعلها وحدة إدارية واحدة يحكمها موظف\nأطلك عليه «االبن الملكى لكوش » وانتشرت في هذه المنطمة الثمافة المصرية .\nٖ) اتجه نحو آسيا حتى وصل إلى نهر الفرات .\nوبذلن بسط نفوذه فى الجنوب والشرق وبدأ في تعمير الببلد وساد الرخاء في عهده .\nٗ) اهتم بالعمران وتشييد المباني فعمل على تطوير معبد الكرنن بم تفسر ؟\nليكون المعبد الربيسي لمدينة طيبة .\n بم تفسر : تعتبر من أشهر الملكات في مصر القديمة ؟\nلما لامت به من أعمال فى عصر الدولة الحديثة فمد تميزت بإنجازاتها السياسية وااللتصادية والثمافية\nوالعمرانية خبلل فترة حكمها .\nأهم أعماله :\nيعد من أعظم ملوك مصر فى مجالى الحرب واإلدارة ففى :\nمجال الحرب\n دلل : يعد الملك تحتمس الثالث من أعظم ملوك مصر فى مجالى الحرب ؟حيث :\nٔ) لاد ستة عشر حملة عسكرية في آسيا بم تفسر؟ لتوطيد النفوذ المصرى بها .\nٕ) بنى أسطوال ا حربياا لو ايا استطاع أن يبسط به سيطرته على الكثير من جزر البحر المتوسط وساحل فينيميا .\nٖ) اهتم بالتوسع فى إفريميا دلل؟ حيث شن حملته السابعة عشر على ببلد كوش وانتصر فيها .\nوبذلن ألام إمبراطورية كبيرة امتدت إلى ما وراء الجندل الرابع بالسودان .\nخدبالك : أقصي اتساع لإلمبراطورية المصرية في جهة الجنوب جاء على يده وأظهر براعة\nعسكرية بر ًا وبحراً ومن أشهر المعارك التي خاضها وأظهرت براعته فى التخطيط\nالحربي معركة مجدو ."],[72,"معركة مجدو\n أطرافها : الملن تحتمس الثالث ضد أمراء آسيا بميادة أمير لادش .\n أسبابها : خروج أمراء آسيا على الحكم المصرى .\n أحداثها : عسكر أمراء آسيا في مدينة مجدو بفلسطين فخرج إليهم\nالملن تحتمس الثالث بجيشه وحاصرهم .\n نتائجها : استسبلم أمراء آسيا للملن تحتمس الثالث .\nمجال اإلدارة\n دلل : لم يقتصر مجد الملك تحتمس الثالث على المجال العسكرى؟\nحيث :\nٔ) اهتم بؤمور الببلد الداخلية .\nٕ) ألام المعابد والمسبلت .\nٖ) اتبع سياسات سلمية مع أمراء آسيا للحفاظ على اإلمبراطورية المصرية دلل ؟ حيث قام بـ :\n تمريب أمراء آسيا منه وثبتهم في وظابفهم .\n أحضر أبناء أمراء آسيا إلى مصر بم تفسر؟\nلتعليمهم العادات والتماليد المصرية ليؽرس في نفوسهم حب مصر حتى إذا ما عادوا إلى ببلدهم وتولوا\nالحكم يصبحوا من أتباعه المخلصين لكي يحمك لمصر أمنها المومي .\nصؽيرا في السن .\nتولى عرش مصر خلفاا للملن «إخناتون» وكان ما يزال\nا\nأهم أعماله :\nٔ) أعاد مدينة طيبة عاصمة للببلد .\nٕ) أعاد لعبادة اإلله آمون مكانتها وغير اسمه من توت عنخ أتون إلى توت عنخ آمون .\nٖ) أهتم بالعمران دلل؟ حيث :\n أمر بإصبلح المعابد التي أغلمت أو تضررت خبلل فترة حكم إخناتون .\n شيد معابد فى جهات مختلفة بمصر وشمال السودان .\n بنى بعض اإلضافات المعمارية باسمه في معبدى األلصر والكرنن ."],[73," بم تفسر : شهرة الملك توت عنخ آمون ؟\nحيث احتوت على كنوز أثرية ال مثيل لها تعبر عن تمدم الفنون في مصر المديمة .\nالملك رمسيس الثانى من أشهر «ملوك الدولة الحديثة» .\nسمي عصره بعصر اإلمبراطورية الثانية بم تفسر؟ حيث وصلت مصر في عهده لممة مجدها .\nأهم أعماله :\n دلل : اهتم الملك رمسيس الثاني بشئون البالد الداخلية ؟\nٔ) أكمل ما بدأه والده الملن سيتى األول من مبان مثل «معبد أبيدوس » وكان ذلن أول أعماله .\nٕ) أمر بنحت معبدين في منطمة أبو سمبل أحدهما له واآلخر لزوجته نفرتارى .\nٖ) ألام العديد من المسبلت .\n دلل : اهتم الملك رمسيس الثاني بشئون البالد الخارجية ؟\nحيث عمل على استعادة مصر لسيادتها على ببلد الشام وبعض جزر البحر المتوسط ، ومن أشهر المعارن التي\nخاضها من أجل ذلن معركة لادش .\nمعركة قادش\nأطرافها :\nالملك رمسيس الثاني ضد ملك الحيثيين .\nأسبابها :\nتزايد نفوذ الحيثيين في ببلد الشام ، وتحالف ملكهم مع أمراء المدن السورية ضد مصر .\nأحداثها :\nخرج الملن رمسيس الثانى لمواجهة الحيثيين وانطلك بحيشه نحو سوريا مخترلا شبه\nجزيرة سيناء وفلسطين حتى التمى بهم .\nنتائجها :\nٔ) انتصار الملن رمسيس الثانى وهزيمة جيش الحيثيين .\nٕ) اضطرار ملن الحيثيين إلى طلب الصلح فوافك الملن رمسيس الثاني ،\nٖ) أبرمت أول معاهدة سبلم دولية مسجلة فى التاريخ .\n ما النتائج : معاهدة السالم بين رمسيس الثاني والحيثيين ؟ نصت على :\n تعهد كل منهما بعدم االعتداء على اآلخر .\n مساعدة كل منهما لآلخر في حال تعرضه لهجوم من دولة أخرى .\nوبذلك : استعادت مصر سيادتها على بالد الشام وبعض جزر البحر المتوسط ."],[74," بم تفسر : يُعتبر الملك رمسيس الثانى ملك الحرب والسالم ؟ حيث :\nملك الحرب : حيث انتصر على الحيثيين فى ببلد الشام وهزمهم في معركة لادش .\nملك السالم : ألنه عمد مع الحيثيين أول معاهدة سبلم في التاريخ .\n أهم أعماله :\n بم تفسر أو دلل : يُعد المؤسس الحقيقى لألسرة العشرين؟ حيث :\nٔ) هزم شعوب البحر المتوسط .\nٕ) تصدى لليبيين الذين هاجموا حدود مصر الؽربية .\nٖ) اهتم بشبون الببلد الداخلية وإصبلح اإلدارة .\nٗ) أعاد تنظيم الجيش .\n٘) نظم البعثات التجارية خاصة إلى ببلد بونت .\n)ٙ اهتم ببناء وتشييد المعابد والتماثيل الضخمة .\nضعف ونهاية الدولة الحديثة بم تفسر ؟\nٔ) تولى الحكم ملون ضعاف بعد انتهاء حكم الملن رمسيس الثالث فضعفت الببلد .\nٕ) تدخل كهنة اإلله آمون بطيبة في شبون الحكم .\nوقد أدى ذلك إلى انتهاء عصر الدولة الحديثة ليبدأ العصر المتأخر .\nالتدريب األول\nس :1 بم تفسر ... ؟\n(ٔ) ليام الملن أحمس األول بإرسال حملة إلى جنوب مصر .\n(ٕ) تعتبر الملكة حتشبسوت من أشهر ملكات مصر المديمة .\n(ٖ) إحضار الملن تحتمس الثالث أبناء األمراء اآلسيويين إلى مصر .\n(ٗ) شهرة الملن توت عنخ آمون .\n(ه) سمى عصر الملن رمسيس الثانى بعصر اإلمبراطورية الثانية ."],[75,"العصر المتأخر (األسرات من )30 : 21\nساد فيه حالة من الضعف أدت إلى تعرض الببلد لؤلطماع الخارجية ، انتهى بدخول اإلسكندر األكبر مصر .\n ما النتائج : دخول اإلسكندر األكبر مصر ؟\nأدى إلى : انتهى بذلك العصر المتأخر لتبدأ مرحلة جديدة في تاريخ مصر .\nعالقة مصر بإفريقيا فى عصر الدولة الحديثة :\n زاد النشاط التجارى بين مصر وإفريقيا بم تفسر؟\nبسبب اتساع اإلمبراطورية المصرية في عصر الدولة الحديثة .\n ومن أشهر الرحبلت التجارية فى عصر هذه الدولة البعثة التى أرسلتها الملكة حتشبسوت إلى ببلد بونت\nوصورتها على جدران معبد الدير البحرى .\n وُجد في المناطق التي ارتبطت مع مصر بعالقات سياسية وتجارية بعض مظاهر التأثر\nبالحضارة المصرية دلل؟ حيث :\nٔ) انتشرت بعض الطموس والعبادات المصرية .\nٕ) بنيت بعض المعابد واألعمدة على الطراز المصرى .\nٖ) ارتدى النببلء من مملكة كوش مبلبس مشابهة للمبلبس التي ترتديها النخبة المصرية .\nالعالقات المصرية اإلفريقية أثناء العصر المتأخر :\n اختلفت العالقات المصرية اإلفريقية في العصر المتأخر عن عصر الدولة الحديثة دلل ؟\nحيث اتسمت بالصراعات والحروب بين مصر وبعض المناطك اإلفريمية ففي :\n عصر األسرة الـ (ٕٔ) : فمدت مصر السيطرة على بعض المناطك اإلفريمية .\n عصر األسرة الـ (ٕٗ) : دار صراع بين المصريين والكوشيين ما النتائج؟\nوانتهى بسيطرة الملن الكوشي على معظم أرض مصر وتكوين األسرة الـ (ٕ٘) .\n ولكن في عصر األسرة الـ ( :)ٕٙ نجح ملوكها فى استعادة استمبلل مصر ومد نفوذها بإفريميا ."],[76,"س :1 أكمل العبارات اآلتية بما يناسبها :\n(ٔ) دعا الملن أمنحتب الرابع إلى عبادة إله واحد هو . ..................\n(ٕ) كانت فترة حكم الملن ...................... هو بداية لعصر الدولة الحديثة .\n(ٕ) بسط الملن أحمس األول نفوذه على السواحل الشرلية للبحر المتوسط باستيبلبه على . ....................\n(ٗ) كان معبد ..................... هو المعبد الربيسى لمدينة طيبة خبلل حكم الملن تحتمس األول .\n(ه) وصلت اإلمبراطورية المصرية أللصى اتساع لها جنوباا في عصر الدولة الحديثة أثناء فترة حكم . ........\n( )ٙ تزعم أمير ...................... حركات التمرد اآلسيوية ضد الملن تحتمس الثالث .\n( )۷ سمى عصر الملن رمسيس الثانى بعصر . .........................\n( )٨ تصدى رمسيس الثالث لـ .............. الذين هاجموا مصر من جهة الؽرب .\n( )۹ حظيت البعثات التجارية لببلد . ......................... .\n(ٓٔ) انتهى العصر المتؤخر بدخول .......................... إلى مصر .\nس :2 اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) الملن الذي يمكن اعتباره حلمة وصل بين عصر االضمحبلل الثانى وعصر الدولة الحديثة هو . ......\n(كامس - تحتمس األول - أحمس األول - تحتمس الثالث )\n(ٕ) أول التوسعات الخارجية للدولة المصرية فى عهد المل من األقدم لألحدث :\n كفاح كامس ضد الهكسوس\n سيطرة الكوشيين على معظم مصر .\n ثورة المصريين في أواخر عهد الملن بيبي الثاني ."],[81," بناء سد البلهون .\n تؤسيس مدينة (من - نفر) عاصمة لمصر .\n هزيمة شعوب البحر المتوسط على يد رمسيس الثالث .\nس :6 بم تفسر ... ؟\nٔ) تسمية عصر الدولة المديمة بعصر بناة األهرام .\nٕ) نجاح الهكسوس في غزو مصر .\nٖ) شهرة الملن توت عنخ آمون\nٗ) اصطحاب تحتمس الثالث أبناء أمراء آسيا إلى مصر .\nس :7 ما النتائج التي ترتبت على ... ؟\nٔ) ازدياد نفوذ كهنة اإلله (رع) في نهاية األسرة الرابعة .\nٕ) معركة لادش بين رمسيس الثاني والحيثيين .\nس :8 دلل على صحة أو خطأ كل عبارة فيما يلى :\nٔ) تشابهت اهتمامات الملن أمنحتب الرابع مع اهتمامات ملون الدولة الحديثة .\nٕ) اهتم الملن تحتمس األول باألمور الداخلية للببلد .\nٖ) لامت الملكة إياح حتب بدور مهم فى طرد الهكسوس من مصر .\nٗ) حكم الهكسوس الوجه المبلى في مصر المديمة .\nس :9 ماذا كان يحدث إذا ... ؟\nٔ) كان الملن بيبي الثاني من الملون األلوياء .\nٕ) لم ينمل أمنمحات األول عاصمة مصر إلى إثيت تاوى .\nس :10 أجب عما يلى :\n(ٔ) كيف ساهم حفر لناة سيزوستريس في تعزيز العبللات بين مصر والدول المجاورة ؟\n(ٕ) وضح كيف أثر سد البلهون على تنظيم وإدارة الموارد المابية والزراعة في مصر ."],[83,"خلك هللا - سبحانه وتعالى - األرض وما عليها بنظام محكم ودليك وسخرها لئلنسان ، وتستمر الحياة على\nما المقصود : النظام البيئي ؟\nمن خالل الصورة التالية يمثل النظام البيئى منطقة جغرافية متكاملة تضم مكونات حية\nوغير حية وهذه المكونات تتفاعل مع بعضها البعض وفق نظام دقيق للحفاظ على التوازن\nالبيئي واستدامة الحياة .\nمكونات النظام البيئي\nمكونات غيرحية\nمكونات حية\n)1 النباتات .\n)2 الحيوانات .\nٖ) الكابنات الدليمة ( كالفطريات والبكتريا وغيرها) .\nٔ) عناصر المناخ (الحرارة والرطوبة والرياح\nواألمطار) .\nٖ) التضاريس .\nٕ) المياه .\nٗ) التربة وغيرها ."],[84,"أنواع النظم البيئية تنقسم إلى :\nالنظم األرضية (البرية) مثل\n* الغابات .\n* الصحاري .\nالنظم البشرية مثل\nالنظم المائية مثل\n* الحشائش * . النظم البيئية للمياه العذبة .\n* المناطق العمرانية .\n* النظم البيئية للمياه المالحة * . األراضي الزراعية .\nحيث هناك :\n دلل : تتفاوت ( تختلف ) حجم النظم البيئية في العالم ؟\n• نظ اما بيبية صؽيرة المساحة مثل بركة المياه .\nمعلومة\n• نظما بيبية كبيرة المساحة مثل نظام الؽابات المدارية المطيرة .\nُيعد الغالف الحيوى\n خلق اهلل كافة النظم البيئية فى حالة توازن واستقرار .\nلألرض أكبر النظم\n بم تفسر : اختالل للنظام البيئي ألسباب طبيعية أو بشرية ؟\nالبيئية .\nبسبب أسباب طبيعية وأسباب بشرية :\nاألسباب الطبيعية مثل - : الزالزل .\n- الثورانات البركانية .\n- األعاصير\n- الحرابك الطبيعية .\nاألسباب البشرية مثل -: إزالة الؽابات .\n- الرعي الجابر .\n- استخدام المواد الكيماوية والمبيدات الحشرية .\n- التوسع العمراني - . التلوث المابي والهوابى .\n- الحروب الحديثة .\nما المقصود بـ : التوازن البيئي ؟ حالة من االستقرار تحدث داخل النظم البيئية عبر التفاعل\nبين مكوناتها الحية وغير الحية مما يمنع حدوث تغييرات جذرية وغير طبيعية فيها .\nالتدريب األول\nس :1 أكمل العبارات اآلتية بما يناسبها :\n(ٔ) يتكون النظام البيبي من مكونات ..................... و . ...........................\n(ٕ) يتفاوت حجم النظم البيبية فى العالم فمنها نظ اما بيبية صؽيرة المساحة مثل ....................... .\nوأخرى كبيرة المساحة مثل .................. . ويعد ...................... أكبرها .\n(ٖ) تنمسم النظم البيبية إلى النظم البشرية و ....................... و . .............................\n(ٗ) من عناصر المناخ الحرارة والرطوبة ....................... و . ...........................\nس :2 بم تفسر : إمكانية حدوث اختبلل للنظام البيبي في منطمة ما ؟"],[85,"النظم البيئية في إفريقيا تتنوع النظم البيئية الطبيعية في إفريقيا فمنها النظم األرضية\nوالنظم المائية وسوف نتعرف على كل نظام واألخطار التي يتعرض لها .\nنظم الغابات في إفريقيا :\nيقصد بالغابة : مساحة من األرض تزيد عن خمسة آالف متر مربع ،\nوتنمو فيها أشجار بأطوال ال تقل عن خمسة أمتار .\nمن نظم الغابات في إفريقيا :\nنظم الغابات المدارية المطيرة (االستوائية) . نظم غابات البحر المتوسط . وفيما يلي نتعرف عليها بشيء من التفصيل :\nأوالي : نظام الغابات املداريُ املطريَ (االستىائيُ)\n* يُعد نظام الغابات المدارية المطيرة من أكثر النظم البيئية تنوعاً بم تفسر؟\nألنه غنى بالتنوع الحيوى حيث يحتوى على آالف األنواع من النباتات والحيوانات .\nالموقع الفلكي :\n• يمتد بشكل ربيسي في لارة إفريميا بين دابرتي\n شمال حوض نهر الكونؽو بوسط المارة .\n ساحل غانا غرب المارة .\nالموقع الجغرافي :\n• يوجد في بعض المناطك البعيدة نسبيا عن دابرة االستواء ،\nكما في الجزء الشرلي من جزيرة مدغشمر ."],[86,"الخصائص المناخية :\nيتسم بـ :\nٕ) ارتفاع درجة الحرارة طوال العام ما النتائج؟\nترتب على ذلن انخفاض المدى الحرارى السنوى .\nٖ) انخفاض الضؽط الجوى بم تفسر ؟\nبسبب صعود الهواء إلى أعلى وسكون حركة الرياح نسبيا .\nٗ) ارتفاع الرطوبة النسبية بم تفسر؟\nبسبب كثرة التبخر .\nالخصائص النباتية :\n* تتميز الغابات المدارية المطيرة بأنها غابات كثيفة األشجار ومتشابكة األغصان ما النتائج؟\nأدى ذلك إلى : منع وصول الضوء إلى أرض الغابة ولذلك تكثر النباتات\nالمتسلقة والطفيلية بها .\n من أهم أشجارها : الماهوجني - األبنوس – المطاط - الكاكاو – الموز - المانجو .\n الحيوانات :\n* تتميز الغابات المدارية المطيرة بكثرة الحيوانات دلل؟ ، مثل :\n( التماسيح - األفاعي - النمور – القردة - الحشرات مثل النمل األبيض)\n* تندر بها الحيوانات الضخمة آكلة العشب بم تفسر ؟\nبسبب صعوبة الحركة بين أشجار الغابة الكثيفة .\nالتربة :\nتتسم بأنها :\n في معظمها ذات لون أحمر بم تفسر ؟ ألنها غنية بؤكسيد الحديد .\n فميرة في األمبلح المعدنية المابلة للذوبان .\nوبالرغم من ذ ن ذلك : تنمو النباتات واألشجار الكثيفة في تربة نظام الغابات المدارية\nالمطيرة بم تفسر ؟ بسبب غزارة األمطار وارتفاع درجة الحرارة .\n ما نتائج : غزارة األمطار وارتفاع درجة الحرارة؟\nتؤدي إلى سرعة التفاعبلت الكيميابية وتحلل المواد العضوية ."],[87,"أهمية نظام الغابات المدارية المطيرة :\nمصدرا للعديد من المواد الخام حيث تدخل فى عدة صناعات مثل : الصناعات الخشبية والمطاط\nا\nوصناعة األدوية .\nمصدرا مه اما للؽذاء والولود لعدد كبير من السكان .\nا\nٕ) أهمية سياحية كبيرة بم تفسر ؟ ألنها ممصد لعدد كبير من السابحين .\nٖ) أهمية بيئية كبيرة بم تفسر ؟ ألنها :\n- تعمل على تنمية البيبة من التلوث .\n- تحافظ على التوازن البيبي .\n تشير الدراسات الحديثة أن غابات حوض نهر الكونغو لها أهمية كبيرة بم تفسر؟\nألنها تمتص انبعاثات الكربون بكمية أكبر من الكمية الصادرة عن لارة إفريميا بؤكملها ،\nكما تنتج كميات كبيرة من األكسجين .\nالتدريب الثاني\nس :1 اكتب كلمة (صواب ) أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٕ) يرتفع المدى الحرارى السنوى فى نظام الؽابات المدارية المطيرة .\nس :2 بم تفسر ... ؟\nس :3 ما النتائج المترتبة على ... ؟\n(ٕ) كثافة األشجار وتشابكها في نظام الؽابات المدارية المطيرة بإفريميا .\n(ٖ) سرعة التفاعبلت الكيميابية وتحلل المواد العضوية في نظام الؽابات المدارية ."],[88,"ثانييا : نظام غابات الابحز املتىسط\n نظام غابات البحر المتوسط توجد في المناطق ذات مناخ البحر المتوسط .\nالموقع الفلكي :\nيمتد في لارة إفريميا بين دابرتى عرض ٖٓ ٗ٘ ، شماال ا وجنوباا حول سواحل البحر المتوسط وعلى السواحل الؽربية للمارات .\nالموقع الجغرافي :\nالمناطك الوالعة على طول الساحل الشمالي الؽربي للمارة . - منطمة الكاب فى ألصى جنوب غرب المارة .\nالخصائص المناخية :\nيتميز نظام غابات البحر المتوسط بـ :\nصيف حاروجاف . شتاء دافا ( معتدل ) وممطر .  بم تفسر : يُعد الشتاء فصل النمو الحقيقى للنباتات ؟\nبسبب سموط األمطار واعتدال درجة الحرارة .\nولذلك وبصفة عامة تقل كمية األمطار الساقطة على ساحل البحر المتوسط في قارة\nإفريقيا كلما اتجهنا شرقيا .\nالخصائص النباتية :\nتتسم أشجار غابات البحر المتوسط بأنها :\n- متوسطة إلى قصيرة الطول (من 20 - 5 مترا) ."],[89,"* أشجار غابات البحر المتوسط دائمة الخضرة طوال العام بم تفسر ؟\nلتمليل الفالد بالنتح من أشهر أشجارها - (: األرز - . الصنوبر .\n- البلوط الفليني ) .\nالحيوانات : تعيش فى غابات البحر المتوسط مثل :\nالتربة :\nتتسم تربة غابات البحر المتوسط بتعدد ألوانها ما بين األحمر والبنى واألسود ، بم تفسر ؟ تبعاا لــ :\nمكوناتها المعدنية والعضوية وظروف تكوينها ، وهى بشكل عام تربة خصبة صالحة للزراعة .\nأهمية نظام غابات البحر المتوسط :\n)1 ذات أهمية اقتصادية بم تفسر ؟ ألنها :\nمصدر للؽذاء حيث إنتاج الزيتون والموالح والعنب والتين .\nمصدر ربيسى للنباتات العطرية والطبية .\nيربى فيها األغنام والماعز .\n)2 أهمية سياحية بم تفسر ؟\nألنها تعد مناطك لبلستجمام والسياحة البيبية والصيد .\n)3 أهمية بيئية بم تفسر ؟\nألنها تساعد فى امتصاص كميات كبيرة من الكربون وتحسين جودة الهواء ."],[90,"األخطار التي تواجه نظم الغابات في قارة إفريقيا :\n* رغم أن قارة إفريقيا أقل القارات فى االنبعاثات الحرارية ، إال أن :\nقارة إفريقيا أكثر عرضة لتأثير التغير المناخى فى العالم ما النتائج؟ وقد ترتب على ذلك :\nٔ) نمص كبير في كميات األمطار .\nٕ) ارتفاعات واضحة في درجات الحرارة .\nٖ) زيادة معدالت الجفاف والتصحر .\nمما يهدد التنمية المستدامة في القارة اإلفريقية .\n* من األخطار التى تواجه الغابات في إفريقيا ما يلى :\n-1 إزالة الغابات :\nيتم قطع أشجار الغابات بم تفسر ؟ بهدف :\nبيع أخشابها و استخدامها كولود .\nتحويل أرض الؽابات إلى أرض زراعية .\nونتيجة لذلك : سجلت قارة إفريقيا أعلى معدل خسارة فى مساحة الغابات على مستوى\nالعالم .\n-2 الحرائق :\n بم تفسر : حدوث حرائق الغابات ؟\n-3 الجفاف :\n تتعرض غابات البحر المتوسط فى قارة إفريقيا للعديد من حاالت الجفاف بم تفسر ؟\nبسبب للة سموط األمطار في بعض السنوات ولد أدى ذلن إلى زيادة موت األشجار وتدهور التربة .\n-4 االنقراض :\nتتعرض أنواع كثيرة من الحيوانات بغابات إفريقيا لخطر االنقراض بم تفسر ؟\nبسبب التؽير المناخى والصيد الجابر والتوسع الزراعي والعمراني .\nويؤدى كل ما سبق إلى حدوث اختالل في النظام البيئي"],[91,"أضف إلى معلوماتك :\nيختلف لون التربة تبعا لمكوناتها ، فمثال :\nٔ) التربة السوداء : تربة خصبة الرتفاع نسبة المواد العضوية المتحللة .\nٕ) التربة الحمراء : غنية بؤكاسيد الحديد .\nٖ) التربة البنية : ترتفع بها نسبة المواد العضوية غير مكتملة التحلل .\nٗ) التربة البيضاء : ترتفع بها نسبة السيليكا والمواد الجيرية .\n ما النتائج على : سوء استغالل الغابات في قارة إفريقيا ؟\nأو\n ما النتائج على : قطع أشجار الغابات في قارة إفريقيا ؟\nترتب على ذلك :\n تسجيل لارة إفريميا أعلى معدل خسارة فى مساحة الؽابات على مستوى العالم .\n تعرض أنواع كثيرة من الحيوانات لخطر االنمراض مما يإثر على االستدامة ويإدى إلى اختبلل\nالتوازن البيبى .\n دلل : أثر التغير المناخى على نظام الغابات المدارية المطيرة في قارة إفريقيا ؟\nحيث :\n سجلت إفريميا أعلى معدل خسارة فى مساحات الؽابات على مستوى العالم .\nالمساحات المحترلة في العالم .\nالتدريب الثالث\nس :1 اكتب كلمة ( صواب) أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٔ) تُعد الفبران والسناجب من الموارض التى تعيش فى نظام غابات البحر المتوسط .\n(ٕ) تتعدد ألوان تربة غابات البحر المتوسط .\nس :2 بم تفسر ... ؟\n(ٔ) تميز أشجار غابات البحر المتوسط بالخضرة الدابمة طوال العام .\n(ٕ) تعرض غابات البحر المتوسط بمارة إفريميا لخطر الجفاف .\nس :3 ما النتائج المترتبة على ... ؟\n(ٔ) غنى تربة نظام غابات البحر المتوسط بالمواد المعدنية والعضوية ."],[92,"س :1 أمامك خريطة لقارة إفريقيا ، اكتب مدلول األرقام التي عليها :\nٔ) مسطح مابي . ................................\nٕ) المحيط . .......................................\nٖ) نظام الؽابات في حوض نهر . ....................\nٗ) نظام غابات . .................................\n٘) نظام غابات بساحل . ........................\n)ٙ خليج . ................................\n)۷ نظام غابات بمنطمة . ...........................\nس :2 أكمل العبارات اآلتية بكلمات مناسبة :\n(ٕ) تتميزترية الؽابات المدارية المطيرة باللون . ....................\n(ٖ) يمتد نظام غابات . بين دابرتي عرض ٖٓ ٗ٘ ، شماال وجنوباا فى السواحل الؽربية للمارات . ...........\n(ٗ) تعتبر األغنام من الحيوانات التي تعيش فى نظام غابات . ....................\nس :3 اختر اإلجابة الصحيحة من بين البدائل التالية :\n(ٔ) من األسباب الطبيعية لحدوث اختبلل للتوازن البيبى . ....................\n( الرعي الجابر - التوسع العمرانى - الثورانات البركانية - إزالة الؽابات )\n(ارتفاع درجة الحرارة طوال العام - ارتفاع المدى الحرارى السنوى - ندرة سموط األمطار صيفاا - غنى\nتربتها باألمبلح المعدنية )\n(ٖ) من األشجار التي تنمو فى نظام الؽابات المدارية المطيرة بإفريميا . ................... .\n( األبنوس - البلوط الفليني - الصنوبر - األرز )\n(ٗ) أى من األشجار اآلتية استطاعت التكيف مع ارتفاع الرطوبة النسبية ودرجة الحرارة طوال العام ؟ . ......\n( البلوط الفليني - األرز - الصنوبر - المطاط )\n(ه) يخلو الجزء الشرلى من جزيرة مدغشمر من أشجار . .................... .\n( الموز - الكاكاو - المطاط - األرز )"],[93,"( الماهوجني - المطاط - األبنوس - الصنوبر )\n( )۷ أي من األنهار اآلتية تساهم الؽابات التي تنمو حوله في امتصاص كمية أكبر من انبعاثات الكربون\nالصادرة عن المارة اإلفريمية بؤكملها ؟ . ....................\n( نهر النيل - نهر الكونؽو - نهر النيجر - نهر أورانج )\n( )٨ من الحيوانات التى تعيش بنظام غابات البحر المتوسط . .................... .\n( النمور - التماسيح - الماعز - المردة )\n( )۹ من أشجار نظام غابات البحر المتوسط ( . ............ البلوط الفليني - الماهوجني - المطاط - المانجو )\nإلى ٕٓٔ٨ م؟ . ....................\n( سوداء - حمراء - بنية - خضراء )\n(ٕٔ) التربة البيضاء هي التي ترتفع بها نسبة . ....................\n( أكسيد الحديد - المواد الجيرية - المواد المتحللة - المواد العضوية )\nس :4 اكتب كلمة (صواب ) أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٕ) تعد النباتات والحيوانات من المكونات الحية للنظام البيبي .\n(ٕ) تختلف مساحات النظم البيبية في العالم .\n(ٗ) يوجد بمارة إفريميا نظم أرضية متنوعة .\n(ه) يُعد الؽطاء النباتي أحد أمثلة النظم البيبية األرضية .\n( )ٙ إلماء مخلفات المصانع فى البحار أحد األسباب الطبيعية الختبلل التوازن البيبي .\n( ي )۷ متصر وجود نظام الؽابات المدارية المطيرة على وسط لارة إفريميا .\nمصدرا مه اما للؽذاء لعدد كبير من سكان إفريميا .\n( ي )٨ عتبر نظام الؽابات المدارية المطيرة\nا"],[94,"( ي )۹ تميز نظام الؽابات المدارية المطيرة بالتنوع الحيوى .\nدورا فى إعادة التوازن البيبى .\n(ٕٔ) تمل األمطار السالطة على نظام غابات البحر المتوسط بمارة إفريميا كلما اتجهنا غربا ا .\n(ٖٔ) يُعد فصل الصيف فصل النمو الحميمى ألشجار غابات البحر المتوسط .\n(ٗٔ) تتسم تربة نظام غابات البحر المتوسط بتعدد ألوانها ما بين األحمر والبني واألسود .\n(٘ٔ) تستخدم بعض نباتات غابات البحر المتوسط في صناعة األدوية .\n( )ٔ۹ تتعرض أنواع كثيرة من حيوانات إفريميا لخطر االنمراض بسبب التوسع العمراني .\nس :5 اكتب ما تشير إليه كل عبارة مما يأتي :\nدليك للحفاظ على التوازن البيبي واستدامة الحياة .\n(ٕ) حالة من االستمرار التى تحدث داخل مجتمع من الكابنات الحية بهدف الحفاظ على أعدادها وأنواعها دون\nحدوث تؽييرات جذرية وغير طبيعية فيها .\n(ٖ) مساحة من األرض تزيد عن خمسة آالف متر مربع وتنمو فيها أشجار بؤطوال ال تمل عن خمسة أمتار .\n(ٗ) الفرق بين متوسط درجة الحرارة بالنسبة ألعلى شهور السنة وأدنى شهور السنة حرارة .\n(ه) نسبة كمية بخار الماء الموجودة فى الهواء بالنسبة إلى كمية بخار الماء التي يستطيع\nالهواء أن يتحملها .\n( )۷ نظام الؽابات الذى يرتفع بها نسبة الرطوبة .\nس :6 بم تفسر ... ؟\n(ٕ) ندرة وجود الحيوانات الضخمة آكلة العشب فى نظام الؽابات االستوابية .\n(ٖ) تتميز ترية الؽابات المدارية المطيرة باللون األحمر .\n(ٗ) لدرة األشجار الكثيفة على النمو فى كل مكان بنظام الؽابات المدارية المطيرة ."],[95,"(ه) كثرة النباتات المتسلمة والطفيلية فى نظام الؽابات المدارية المطيرة .\n( )ٙ نمو النباتات في غابات البحر المتوسط فى فصل الشتاء .\n( )۷ أشجار غابات البحر المتوسط دابمة الخضرة طوال العام .\n( )٨ األهمية البيبية لؽابات البحر المتوسط .\n( )۹ إزالة الؽابات في لارة إفريميا .\nس :7 ما النتائج المترتبة على ... ؟\n(ٕ) كثافة أشجار الؽابات المدارية المطيرة وتشابن أغصانها بإفريميا .\n(ٖ) زيادة البخر فى نظام الؽابات المدارية .\n(ٗ) تعرض لارة إفريميا للتؽيرات المناخية .\n(ه) تعرض نظام غابات البحر المتوسط لملة سموط األمطار في بعض السنوات .\nس :8 قارن بين :\nنظام الؽابات المدارية المطيرة ، ونظام غابات البحر المتوسط ، من حيث * : التربة * . الخصابص النباتية .\nس :9 دلل جغرافييا على صحة كل عبارة من العبارات اآلتية :\n(ٔ) لئلنسان أثر سلبي على النظام البيبي .\n(ٕ) يتميز نظام الؽابات المدارية المطيرة بالتنوع الحيوي .\n(ٖ) كثافة أشجار الؽابات المدارية المطيرة وتشابن أغصانها .\n(ٗ) للؽابات المدارية المطيرة أهمية التصادية كبيرة .\n(٘) األهمية االلتصادية لؤلشجار فى نظام غابات البحر المتوسط .\n( )ٙ لنظام غابات البحر المتوسط أثر إيجابي على التنمية السياحية .\n( )۷ تساهم بعض عناصر النظم األرضية كالؽابات في إعادة التوازن البيبي .\nس :10 ما العالقة بين ... ؟\n(ٔ) األعاصير ، والنظام البيبي .\n(ٕ) الؽابات المدارية المطيرة ، والتوازن البيبي .\n(ٖ) ارتفاع الحرارة ، ونمص كمية األمطار فى إفريميا ."],[96,"امتحان على الدرس األول\nس ( :1 أ) استعن بخريطة قارة إفريقيا المقابلة ، وأجب عما يأتي :\n(ٔ) مدار السرطان يمثله الرلم . .............\n(ٕ) المحيط األطلنطى يمثله الرلم . ............. .\n(ٕ) غابات البحر المتوسط مشار إليها برلم . ...............\n(ٗ) الؽابات المدارية المطيرة مشار إليها برلم . ............. .\n(٘) الخليج الذى تنمو على سواحله أشجار مثل الماهوجني\nيشار إليه برلم . ............. .\n(ب) «أكدت الدراسات الحديثة أن الغابات لها أهمية كبيرة للحد من التغيرات المناخية» .\nفي ضوء العبارة السابقة ، وضح :\n(ٕ) الخصابص النباتية لؽابات البحر المتوسط .\n(ٖ) ممترحاتن لـ : مواجهة األخطار التي يتعرض لها نظام الؽابات في لارة إفريميا .\n(ج) ما األثر الناتج عن : ارتفاع درجة الحرارة طوال العام في نظام الؽابات المدارية المطيرة ؟\nس ( :2 أ) اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) من األسباب البشرية لحدوث اختبلل التوازن البيبي . ..............\n(الزالزل - الثورانات البركانية - الرعي الجابر - األعاصير)\n(ٕ) من الحيوانات التي تعيش بالؽابات المدارية المطيرة ( . ...... الثعالب - الذباب - األغنام - النمور)\n(ٖ) يخلو ألصى جنوب غرب لارة إفريميا من نمو أشجار ( ..... الصنوبر - البلوط الفليني - األرز - األبنوس )\n(ب) ما المقصود بـ ... ؟ (ٔ) الرطوبة النسبية .\n(ج) ما العالقة بين : نظام الؽابات االستوابية ، والنشاط الصناعي ؟\n(ٕ) الؽابة ."],[97,"نظام الحشائش في إفريقيا\nكلما ابتعدنا شماليا أو جنوبيا عن الغابات المدارية المطيرة يظهر نظام بيئى آخر مختلف\nيتميز بتنوعه البيولوجي والذي يدل على قدرة وإبداع اهلل(سبحانه وتعالى) وهو نظام\nحشائش السافانا ، يليه نظام الصحاري الحارة و نظام حشائش اإلستبس"],[98,"أوليا نظام احلشائش احلارَ (السافانا)\nما المقصود بـ : السافانا ؟\nعبارة عن غطاء نباتي كثيف من الحشائش تتداخل معها أشجار متنوعة ، تزداد كثافتها\nكلما اقتربنا من الغابات المدارية المطيرة .\nالموقع الجغرافي :\nا\nشماال أو جنوباا عن الؽابات المدارية المطيرة .\nيظهر نظام حشابش السافانا : كلما ابتعدنا\nيمع نظام الحشابش الحارة : في بيبة انتمالية بين الؽابات المدارية المطيرة ، والصحارى الحارة .\nالموقع الفلكي :\nدابرة االستواء ، حيث يمع في شمال وجنوب وشرق\nالؽابات المدارية المطيرة .\nالخصائص المناخية :\nيتسم نظام الحشائش الحارة بما يلى :\nصيفيا :\n ترتفع درجات الحرارة ارتفاعاً ملحوظيا ، حيث\nتكون أعلى من نظام الغابات المدارية المطيرة بم تفسر؟\nبسبب انخفاض كثافة النباتات فى حشابش السافانا عن الؽابات المدارية المطيرة .\n تسقط األمطار الصيفية التي تختلف كميتها وفترة سقوطها من مكان آلخر ما النتائج؟\nيإدى ذلن إلى تدرج حشابش السافانا في الطول بسبب اختبلف كمية سموط المطر .\nشتاءي : تميل درجات الحرارة إلى االعتدال ."],[99," ما النتائج على : الفرق الواضح بين درجات الحرارة صيفيا ودرجات الحرارة شتاء ؟\nبسبب : إن المدى الحرارى السنوى بها مرتفع .\nالخصائص النباتية :\n دلل : يختلف نوع السافانا باختالف كمية المطر وفترة سقوطه؟\nحيث ي : ختلف توزيع حشابش السافانا تبعا ا لنوعها على حسب كمية المطر كما يلي :\nالسافانا الغنية (البستانية)\n حشابش طويلة تتخللها\nاألشجار كؤشجار السنط .\n توجد بالمرب من الؽابات\nالمدارية الحارة\nالسافانا المكشوفة\nالسافانا الفقيرة\n حشابش طويلة ومتوسطة\nالطول وتمل بها األشجار .\n حشابش لصيرة الطول .\n توجد بالمرب من نظام\nالصحارى .\nالحيوانات :\n بم تفسر : يُطلق على نظام حشائش السافانا حديقة حيوان طبيعية ؟ ألن يعيش بها :\nحيوانات آكلة الحشابش : مثل : الفيل اإلفريمى والؽزالن والزرافات\nووحيد المرن والنعام والجاموس البرى والحمار الوحشي .\nحيوانات آكلة : مثل : األسود والنمور والضباع .\nالتربة :\n تتنوع التربة في نظام حشائش السافانا ، وتتسم باللون األسود بم تفسر؟\nلثرابها فى المكونات العضوية ، لذلن تصلح لزراعة الحبوب .\nمصدرا ربيسياا لؽذاء اإلنسان حيث :\nأهمية نظام حشائش السافانا بم تفسر ؟ تمثل\nا\nتربى فيها الماشية والتى تُعد ثروة حيوانية برية غنية .\nيستؽل نظام السافانا في إنتاج بعض المحاصيل كالذرة والبن ولصب السكر والمطن ."],[100,"األخطار التي تواجه نظام حشائش السافانا : ناتجة عن :\nبعض األنشطة البشرية : مثل :\n- تجريف التربة .\n- الرعي الجابر .\n- الصيد الجابر .\n- سوء إدارة أنشطة التعدين وغيرها .\nاألخطار الطبيعية : مثل :\nٔ) زيادة األمبلح في التربة .\nٕ) تجريف التربة بم تفسر؟ بسبب سموط األمطار بؽزارة في فصل الصيف .\nٖ) التعرض لموجات الجفاف .\nٗ) التعرض لموجات التصحر الذي يصيب مساحات واسعة من األراضي اإلفريمية ما النتائج؟\nيإدى ذلن إلى تدهور التربة وموت النباتات .\n٘) حدوث الفيضانات في بعض المناطك دلل؟ حيث تؤتى لارة إفريميا في المرتبة الثانية فى امتبلن أكثر\nتضررا من الفيضانات في العالم .\nالمناطك\nا\nكل هذه األخطار تؤثر سلبا على التوازن البيئي\nالتدريب األول\nس :1 أكمل العبارات اآلتية بما يناسبها :\n(ٔ) تزداد كثافة الحشابش الحارة كلما التربنا من . .................\n(ٕ) تمع حشابش السافانا في بيبة انتمالية بين ................. و . .................\n(ٖ) يتسم نظام الحشابش الحارة بسموط األمطار في فصل . .................\n(ٗ) تعدد أنواع حشابش السافانا ما بين ................. . و . ................. و .. .................\n(ه) من الحيوانات آكلة الحشابش التى تعيش فى نظام الحشابش الحارة ................. . و . ................. .\n( )ٙ تتسم ترية حشابش السافانا باللون .. .................\nس :2 بم تفسر ... ؟\n(ٕ) يُطلك على نظام حشابش السافانا حديمة حيوان طبيعية .\nس :3 دلل على صحة كل عبارة مما يأتي :\n(ٔ) تإثر بعض األنشطة االلتصادية البشرية سلباا على مساحة نظام حشابش السافانا .\nسا لؽذاء اإلنسان .\n(ٕ) تمثل حشابش السافانا\nمصدرا ربي ا\nا\nس :4 ما النتيجة المترتبة على ... ؟\n(ٔ) وجود فرق واضح بين درجات الحرارة صيفاا ودرجات الحرارة شتا اء في نظام حشابش (السافانا) .\n(ٕ) تعرض نظام حشابش السافانا لموجات التصحر ."],[101,"ثانياً : نظام احلشائش املعتدلُ (االستابس)\nالموقع الفلكي والجغرافي :\n يمتد نظام الحشائش المعتدلة في قارة إفريقيا\nفي شمال قارة آسيا وجنوب القارة في مناطق\nالمناخ المعتدل دلل ؟ حيث يوجد في :\nإفريميا وليسوتو .\nشمال القارة ي : شؽل مساحة ألل بين نظام غابات البحر المتوسط فى الشمال ونظام الصحارى الحارة في الجنوب .\nالخصائص المناخية يتسم مناخ نظام الحشائش المعتدلة ، بما يلي :\nصيفيا : اعتدال درجات الحرارة .\nوكثيرا ما تنخفض إلى دون الصفر المبوى .\nشتاء - : انخفاض درجات الحرارة\nا\n- سموط األمطار بكميات لليلة ومتفاوتة من مكان آلخر ومن عام آلخر ما النتائج؟\nمما يإثر ذلن بشكل كبير على الحياة النباتية والحيوانية والبشرية في هذا النظام .\nالخصائص النباتية :\n ما النتائج : تفاوت كمية المطر من مكان آلخر في نظام الحشائش المعتدلة؟\nأدى إلى :\nنموالحشابش واألعشاب في المناطك التي تتلمى كميات ألل من األمطار ، وذلن في معظم مناطك اإلستبس .\nنمو األشجار بالمرب من األنهار وعلى منحدرات الجبال التي تتلمى كمية أكبر من المطر ."],[102,"الحيوانات : تتنوع الحيوانات والطيور تنوعاا واض احا ومن أشهرها :\nالتربة : تتسم تربة اإلستبس بصفة عامة بؤنها :\n تربة طينية خصبة سوداء اللون بم تفسر ؟ ألنها غنية بالمواد العضوية والمعدنية\nمما يساعد على أن التربة صالحة لزراعة بعض المحاصيل مثل الحبوب الؽذابية .\nأهمية حشائش اإلستبس :\nألنها :\nٔ) تُعد مراعى طبيعية للحيوانات ، مثل : األغنام والماعز والماشية والخيل .\nٕ) تنتشر بها حرفة الصيد بم تفسر ؟ بسبب كثرة أعداد الحيوانات التي تعيش فيها .\nٖ) تربة صالحة لزراعة بعض المحاصيل مثل الحبوب الؽذابية .\nاألخطار التي تواجه نظام الحشائش المعتدلة (اإلستبس)\nٔ) تركز عدد كبير من السكان فى بيبة اإلستبس ويعمل معظمهم فى الرعى والزراعة حيث لاموا بــ :\n تحويل مساحات كبيرة من حشابش اإلستبس إلى أراض زراعية .\n تربية الماشية واألغنام بؤعداد كبيرة ألغراض تجارية .\nٕ) التعرض للحرابك بم تفسر؟ بسبب ارتفاع درجات الحرارة بوضوح في فصل الصيف (. خطر طبيعي)\n ما النتائج : تحويل مساحات كبيرة من حشائش اإلستبس إلى أراض زراعية ؟ أدى إلى :\nٕ) انمراض العديد من الحيوانات ( . خطر بشري)\nٖ) تدهور التربة ( . خطر بشري)\nكل هذه األخطار تؤثر سلباً على التوازن البيئي"],[103,"التدريب الثاني\nس :1 اكتب كلمة (صواب ) أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٕ) ترتفع درجات الحرارة في نظام حشابش اإلستبس في فصل الصيف .\n(ٖ) يتسم مناخ نظم الحشابش المعتدلة بسموط األمطار الؽزيرة في فصل الشتاء .\n(ٗ) تنمو األشجار بالمرب من األنهار وعلى منحدرات الجبال في نظام الحشابش المعتدلة .\n(ه) تعتبر حشابش اإلستبس مراعى طبيعية للعديد من الحيوانات مثل األغنام .\n( )ٙ تُعد حرفتى الزراعة والرعى حرف ربيسية لسكان بيبة حشابش اإلستبس .\nس :2 ما األثر الناتج عن ... ؟\n(ٔ) تفاوت كمية المطر من مكان إلى آخر في نظام الحشابش المعتدلة .\n(ٕ) تحويل مساحات كبيرة من حشابش اإلستبس إلى أراض زراعية .\nس :3 بم تفسر ... ؟\n(ٔ) تتميز التربة فى نظام حشابش اإلستبس باللون األسود .\n(ٕ) تنتشر حرفة الصيد بحشابش اإلستبس .\n(ٖ) تتعرض بعض المناطك في نظام حشابش اإلستبس للحرابك الطبيعية .\nثالجاً : نظام الصحاري احلارَ\nما المقصود بالصحراء ؟\nمنطقة تتسم بنقص أو\n تمثل الصحارى نحو ثلث مساحة اليابس .\nندرة في األمطار والنبات\n تتنوع النظم الصحراوية في العالم ما بين :\nالطبيعي والحيوان\nصحارى حارة .\nصحارى معتدلة .\nصحاري لطبية .\nواإلنسان وفقر التربة .\n تتسم جميع الصحارى بالجفاف وللة األمطار وارتفاع المدى الحرارى اليومي والسنوى .\n ورغم الظروف الماسية فى هذا النظام إال أنه توجد به نباتات وحيوانات لادرة على التكيف مما يدل على\nلدرة هللا - سبحانه وتعالى ."],[104,"الموقع الفلكي :\nتمع الصحاري الحارة اإلفريمية بين دابرتي عرض\nٖٓ ، ٔ٨ شماال ا وجنوباا .\nالموقع الجغرافي :\nتشمل مناطك :\nالصحراء الكبرى في شمال لارة إفريميا (تعد أكبر الصحاري الحارة في العالم) .\nصحراء كلهاری (جنوب إفريميا) - صحراء ناميبيا (جنوب إفريميا) .\nالخصائص المناخية :\nيتسم مناخ النظام الصحراوى الحار بالتطرف الشديد في درجات الحرارة دلل ؟ حيث :\nفي فصل الصيف : ترتفع درجات الحرارة نها ارا لتزيد على ٓٗ مبوية وتسجل في بعض األيام\nأعلى من ٓ٘ مبوية ، بينما تنخفض ليبل إلى نحو ٕ٘ مبوية .\nفي فصل الشتاء ي : تسم النهار بالدفء والليل بالبرودة وتصل درجات الحرارة في بعض المناطك\nالداخلية فى الشتاء إلى الصفر المبوى .\nلذلك يتسم نظام الصحارى الحارة بالمدى الحراري اليومى الكبير .\nاألمطار :\nأمطار هذا النظام نادرة الحدوث وكميتها لليلة جداا حتى أن المطر المليل الذى يسمط لد يتبخر لبل الوصول إلى\nأخطارا على األنشطة البشرية .\nسطح األرض ، ولد تسمط األمطار على هيبة سيول ما النتائج؟ تسبب\nا\nتذكر أن ي : شؽل نظام الصحاري الحارة معظم مساحة األراضى المصرية فيما عدا أطرافها الشمالية ."],[105,"الخصائص النباتية :\n تندر النباتات الطبيعية في نظام الصحاري الحارة بم تفسر ؟\nبسبب ندرة المياه وفمر التربة وارتفاع درجات الحرارة .\n منح هللا النباتات بنظام الصحارى الحارة لدرة على التكيف مع شدة الجفاف والحرارة دلل ؟ حيث :\n بعضها لها جذور تمتد إلى أعماق كبيرة ولمسافات واسعة تحت السطح لتصل إلى المياه الجوفية .\n بعضها صؽير األوراق حتى تملل من النتح ، وتستطيع أن تختزن كمية من المياه في سيمانها .\n من أهمها : أشجار السيال (األكاسيا ) - الصبار - التين الشوكي .\nالحيوانات :\nتمل الحيوانات بوضوح في نظام الصحاري الحارة .\nتعيش به حيوانات تتحمل الظروف الصحراوية الماسية :\nالتربة :\nيتسم نظام الصحاري الحارة بتربة منخفضة الخصوبة فقيرة فى المواد العضوية\nمثل التربة الحصوية والتربة الرملية .\nتوجد تربة خصبة في نظام الصحارى الحارة في مساحات صغيرة داخل الواحات\nمثل - : واحة سيوة بمصر .\n- واحة الكفرة بليبيا .\nأهمية نظام الصحاري الحارة :\nٔ) لها أهمية بالنسبة للنشاط التعديني بم تفسر؟ ألنها تحتوى الصحارى اإلفريمية على كثير من\nالثروات المعدنية والنفط والؽاز الطبيعي .\nٕ) تُعد مناطك رعى جيدة لئلبل والماعز .\nٖ) تنتشر بها حرفة الزراعة فى الواحات اعتماداا على المياه الجوفية ."],[106,"ٗ) تُعد الصحارى اإلفريمية بيبة مثالية لتوليد الطالة الشمسية بم تفسر؟ ألنها تتلمى كميات كبيرة من\nأشعة الشمس على مدار السنة .\n٘) تتميز بمناظر طبيعية فريدة ومعالم تاريخية وأثرية ما النتيجة ؟ مما يجعلها مناطك جذب سياحي .\nاألخطار الطبيعية التي تواجه نظام الصحاري الحارة : من أهمها :\nالصيد الجابر .\nزيادة حدة موجات الجفاف ما النتيجة ؟ التي تإدى إلى :\nٔ) ندرة النبات الطبيعي أو انعدامه في كثير من الصحارى اإلفريمية\nٕ) وبالتالي تمل كميات الؽذاء التي تحتاجها الكابنات الحية في هذا النظام .\nٖ) تعرض العديد من الحيوانات لخطر االنمراض مثل طابر الحباري الذي يعيش فى الصحراء الكبرى ،\nوأيضاا الؽزال المصرى .\nكل هذه األخطار تؤثر سلبيا على التوازن البيئي\nالتدريب الثالث\nس :1 اكتب كلمة (صواب ) أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٔ) تمثل الصحارى فى العالم حوالى ثلث مساحة اليابس .\n(ٕ) تمع الصحارى الكبرى جنوب لارة إفريميا .\n(ٖ) تعد صحراء كلهارى أكبر الصحاري الحارة في العالم .\n(ٗ) تعتبر اإلبل من الحيوانات التى تتكيف مع الظروف المناخية الماسية فى نظام الصحاري الحارة (.\nس :2 دلل على صحة كل عبارة مما يأتي :\n(ٔ) يتسم مناخ نظام الصحارى الحارة بالتطرف الشديد .\n(ٕ) لنظام الصحارى الحارة بمارة إفريميا أهمية التصادية .\nس :3 بم تفسر ... ؟\n(ٔ) تندر النباتات الطبيعية فى نظام الصحارى الحارة بمارة إفريميا .\n(ٕ) تُعد الصحارى الحارة بإفريميا مناطك جذب سياحي .\nس :4 حدد األثر الناتج عن :\n(ٔ) سموط األمطار على هيبة سيول في نظام الصحاري الحارة .\n(ٕ) حدة موجات الجفاف التي تتعرض لها نظام الصحاري الحارة بإفريميا ."],[107,"س :1 أمامك خريطة لقارة إفريقيا ، اكتب مدلول األرقام التي عليها :\n(ٔ) البحر . .....................\n(ٕ) دابرة عرض ربيسية . ..................... .\n(ٖ) صحراء .. .....................\n(ٗ) المحيط . ..................... .\n(ه) حشابش .. .....................\n( )ٙ إلليم . ..................... .\n( )۷ الصحراء . ..................... .\nس :2 أكمل العبارات اآلتية بما يناسبها :\n(ٔ) تنمو بالمرب من األطراف الجنوبية للصحراء الكبرى حشابش . ..................... .\n(ٕ) تتسم منطمة حشابش اإلستبس بوجود تربة .. .....................\n(ٗ) تنمسم النظم الصحراوية فى العالم إلى صحارى حارة و . ..................... .\n(ه) يمتصر وجود التربة الخصبة فى الصحراء الكبرى على بعض األراضى داخل .. .....................\n( )ٙ من الطيور المهددة باالنمراض وتعيش فى الصحراء الكبرى . ..................... .\nس :3 اختر اإلجابة الصحيحة من بين البدائل التالية :\n(انخفاض درجة الحرارة شتا اء - سموط األمطار الصيفية - انخفاض المدى الحرارى السنوى - فمر التربة )\n(ٕ) توجد حشابش السافانا البستانية بالمرب من الؽابات المدارية ويتخللها أشجار . .....................\n(األكاسيا - السنط - الصنوبر - األرز )\n(ٖ) يواجه نظام حشابش السافانا العديد من المخاطر البشرية ويخرج عنها . .....................\n(الرعي الجابر - الصيد الجابر - األنشطة التعدينية - الفيضانات )\n(ٗ) أى من المحاصيل اآلتية تصلح زراعتها في نظام الحشابش الحارة ؟ .. .....................\n(الممح واألرز - المطن والبن - الممح والبنجر - الفول والمطن )"],[108,"(ه) من الدول اإلفريمية التي تعتمد فى تربية الحيوانات على حشابش اإلستبس . ..................... .\n( مصر - السودان - جنوب إفريميا - ناميبيا )\n( ي )ٙ مع إلليم الفلد بمارة إفريميا بالجهة .. .....................\n(الشمالية - الجنوبية - الشرلية - الؽربية )\n( )۷ أكثر الحرف التي أثرت بالسلب على مساحات اإلستبس فى لارة إفريميا . ..................... .\n( الزراعة - الصناعة – التجارة - السياحة )\n( ي )٨ تشابه نظام الحشابش الحارة مع نظام الصحاري الحارة بمارة إفريميا . .....................\n(المولع الجؽرافي - المولع الفلكي - سموط األمطار الشتوية - التعرض لموجات جفاف)\n( )۹ تتسم صحراء كلهارى بالعديد من الخصابص منها . ..................... .\n(التطرف الشديد في درجة الحرارة - انخفاض المدى الحراري اليومي - خصوبة التربة - انعدام الثروات\nالمعدنية بها )\n(ٓٔ) من النباتات الصحراوية التي لها المدرة على تحمل شدة الحرارة والجفاف . ..................... .\n(الماهوجني - السنط - المطاط - السيال )\nس :4 اكتب كلمة (صواب) أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٔ) تتميز النظم البيبية بمارة إفريميا بالتنوع البيولوجي .\n(ٖ) تتسم تربة نظام حشابش السافانا باللون األسود لثرابها في مكوناتها العضوية .\n(ٗ) تعتبر الزرافات من الحيوانات التى تعيش فى نظام الصحاري الحارة .\n(ه) تؤتى لارة إفريميا فى المرتبة األولى بين أكثر المناطك تعرضاا للفيضانات في العالم .\n( )ٙ تإثر الفيضانات بالسلب على نظام حشابش السافانا .\n( ي )۷ نتشر نظام حشابش اإلستبس غرب جزيرة مدغشمر .\n( ي )٨ تباين النبات الطبيعى الذى ينمو فى نظام الحشابش المعتدلة باختبلف نسبة األمطار .\n( ي )۹ تسم نظام الحشابش المعتدلة بخصوبة التربة الصالحة لزراعة الحبوب الؽذابية .\n(ٓٔ) تتسم النظم الصحراوية في العالم بالجفاف وللة األمطار ."],[109,"س :5 بم تفسر ... ؟\n(ٔ) ارتفاع درجة حرارة نظم حشابش السافانا في فصل الصيف .\n(ٕ) تدرج حشابش السافانا فى الطول من مكان آلخر .\n(ٖ) لحشابش السافانا أهمية التصادية .\n(ٗ) ليام النشاط الزراعى فى منطمة نظام الحشابش المعتدلة .\n(ه) ندرة النباتات الطبيعية فى نظام الصحاري الحارة .\n( )ٙ تعتبر الصحارى اإلفريمية بيبة مثالية لتوليد الطالة الشمسية .\nس :6 ما النتائج المترتبة على ... ؟\n(ٔ) غنى تربة اإلستبس بالمواد العضوية والمعدنية .\n(ٕ) زيادة حدة موجات الجفاف فى مناطك الصحاري الحارة .\n(ٖ) وجود معالم تاريخية وأثرية في الصحارى اإلفريمية .\nس :7 دلل جغرافيا على صحة كل عبارة مما يأتي .. ؟\n(ٔ) يختلف نوع السافانا باختبلف كمية المطر وفترة سموطه .\n(ٕ) تستطيع النباتات الصحراوية التكيف مع شدة الجفاف والحرارة .\n(ٕ) تتعدد األخطار الطبيعية التى تواجه نظام الصحارى الحارة بإفريميا .\nس :8 حدد أوجه االختالف بين :\n(ٔ) السافانا البستانية ، والسافانا المكشوفة .\n(ٕ) نظام حشابش السافانا ، ونظام حشابش اإلستبس ، من حيث :\n*الحيوانات التي تعيش بها .\n* موسم سموط المطر .\nس (( :9 كلما زاد اإلنسان في استنزاف الموارد ، قلت فرص األجيال القادمة في االستمتاع\nبها )) في ضوء العبارة السابقة ، وضح :\n(ٔ) األنشطة البشرية التي تواجه نظام السافانا .\n(ٕ) الحيوانات والطيور التي تعرضت لبلنمراض في نظام الصحاري الحارة ."],[110,"امتحاي عمى الدرس الثاىي\nس ( :1 أ) أمامك خريطة لقارة إفريقيا ، اكتب مدلول األرقام التي عليها :\n(ٔ) إلليم . ..................\n(ٕ) خليـج . ..................\n(ٖ) الصحراء . ...............\n(ٗ) حشابش . .............. .\n(٘) مسطح مابي . .................. .\n(ب) اكتب كلمة ( صواب ) أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٕ) تنخفض درجة الحرارة شتا اء في بعض المناطك لما دون الصفر المبوى فى نظام حشابش السافانا ) (.\n(ٖ) تتسم تربة نظام حشابش اإلستبس بؽناها بالمواد العضوية والمعدنية .\n(ٗ) تحتوى الصحارى اإلفريمية على كثير من الثروات المعدنية .\nس ( :2 أ ) اختر اإلجابة الصحيحة مما بين القوسين :\n(غزارة األمطار صيفاا - انخفاض المدى الحرارى اليومى - اعتدال درجات الحرارة طوال العام - ندرة سموط\nاألمطار )\n(ٕ) من المخاطر الطبيعية التى يتعرض لها نظام الحشابش الحارة . ................. .\n(الصيد الجابر - النشاط التعديني - زيادة األمبلح في التربة - الرعي الجابر )\n(ٖ) تتشابه المناطك التي يمر بها مدار الجدى مع المناطك التي يمر بها مدار السرطان بمارة إفريميا في\n( نظام حشابش السافانا البستانية - حشابش السافانا المكشوفة - نظام\nوجود . .................\nالصحارى الحارة - نظام الؽابات المدارية المطيرة )\n(ب) بم تفسر ... ؟\n(ٕ) ارتفاع المدى الحرارى السنوى بنظام الحشابش الحارة .\n(جـ) دلل على صحة العبارة التالية :\nتتمتع النباتات الطبيعية في النظام الصحراوى الحار بسمات مميزة تمكنها من التكيف مع شدة الجفاف\nوالحرارة ."],[111,"وهب اهلل - سبحانه وتعالى - قارتنا اإلفريقية العديد من النظم المائية (العذبة والمالحة)\nالغنية بثرواتها الطبيعية وتنوعها البيولوجي ، إال أن هذه النظم تتعرض للعديد من األخطار .\nما املقصود بـ : اليظاو البيئي املائى ؟\nيوجد في المسطحات المائية أو على هوامشها\nويوجد به مكونات حية ومكونات غير حية تتفاعل مع\nبعضها البعض الستدامة الحياة في هذا النظام .\n بم تفسر : أهمية النظم البيئية المائية ؟ تتمثل في أنها :\nٔ) تموم بدور حيوى فى الحفاظ على التوازن البيبي والتنوع البيولوجى على كوكب األرض .\nمصدرا ربيسياا لؽذاء اإلنسان .\nٕ) تُعد\nا\nٖ) يُستخرج منها الطحالب التي تُستخدم في صناعة بعض األدوية ومواد التجميل واأللمشة وغيرها .\nٗ) تحتوى على العديد من مصادر الطالة الحفرية ( مثل البترول والؽاز الطبيعى ) والطالة الكهرومابية .\n٘) تحتوى على العديد من األمبلح والمعادن مثل الماغنيسيوم والنحاس والذهب .\n)ٙ توفر فرص العمل فى مجاالت عديدة منها النمل المابي وصيد األسمان والسياحة .\nثاىيا : أىواع اليظه البيئية املائية :\nتنقسم النظم البيئية المائية إلى نوعين رئيسيين تبعيا لنسبة األمالح في المياه ، وهما :\n)1 النظم البيئية للمياه العذبة .\n)2 النظم البيئية للمياه المالحة ."],[112,"أوالي : الهظم الابيئيُ للمياه العذبُ :\n تضم األنهار والبحيرات العذبة والبرك والمستنقعات المائية العذبة وما تحتويه من :\n األسمان والبرمابيات والحشرات .\n أنواع مختلفة من النباتات التي تنمو في داخل هذه النظم أو على هوامشها .\n تعمل النباتات فى هذه النظم على توفير األكسجين والغذاء للحيوانات التي تعيش فيها .\n تتعدد النظم البيئية للمياه العذبة في قارة إفريقيا ، وهى :\nالنظم النهرية\nالنظم البحيرية العذبة\nنظم األراضي الرطبة العذبة\nي  وجد في لارة إفريميا العديد من األنهار أهمها :\nنهر النيل ونهر الكونؽو ونهر النيجر ونهر الزمبيزى .\nي  تميز حوض نهر الكونؽو بالتنوع البيولوجي دلل؟ ،\nحيث يؤتى فى المرتبة الثانية بعد نهر األمازون في\nأمريكا الجنوبية من حيث الكابنات الحية التي تعيش فيه .\nي  وجد فى لارة إفريميا العديد من بحيرات المياه العذبة\nمثل : بحيرة فيكتوريا وبحيرة تنجانيما وبحيرة تشاد .\n تشتهر البحيرات اإلفريمية بـ - : تنوع األسمان .\n تتسم النظم البحيرية العذبة بالتنوع البيولوجي دلل؟\nحيث يوجد فيها مجموعة متنوعة من البلفماريات\nوالمشريات والرخويات والطحالب .\n تتعرض النظم البحيرية العذبة للتدهور ما النتيجة ؟\nمما أدى إلى انخفاض أعداد الحيوانات المرتبطة بها كما حدث في بحيرة فيكتوريا .\n شهدت بحيرة فيكتوريا أكبر انقراض جماعى لالفقاريات في العصر الحديث حيث\nتعرضت أنواع عديدة من األسماك لخطر االنقراض بم تفسر ؟\nنتيجة إدخال أنواع جديدة من األسماك إلى البحيرة ."],[113," تعرف بالنظم البرمابية بم تفسر ؟ ألنها تمع بين األنظمة البرية والمانية .\n تضم المستنمعات وهي األراضى المشبعة بالمياه بصورة دابمة أو موسمية .\n تمثل نحو ٔ % من مساحة لارة إفريميا .\nمن أهمها :\nٕ) المستنمعات المؽطاة بالنباتات مثل مستنمعات نبات البردى فى شرق ووسط وجنوب لارة إفريميا .\nٖ) المستنمعات المكشوفة ومن أشهرها مستنمعات السد في جنوب السودان .\nأهميتها :\n بم تفسر : لنظم األراضى الرطبة العذبة أهمية بيئية؟ ألن النبات الموجود بها :\nٔ) يمتص كميات كبيرة من ثانى أكسيد الكربون ، ويبطا من ظاهرة االحتباس الحراري .\nٕ) يعمل على تنمية المياه وتمليل كمية الرواسب المتجهة إلى البحيرات .\nٖ) يُعد حاجزا ا ضد تؤثيرات الفيضانات والجفاف مثلما يفعل السد .\n ما النتائج : تتعرض األراضي الرطبة العذبة للتجفيف وإزالة النباتات والتوسع الزراعى ؟\nتؤكل التربة . أدى ذلك إلى - : تدهور الحياة النباتية .\n- تعرض العديد من الحيوانات والطيور بها لخطر االنمراض .\nالتدريب األول\nس :1 اكتب كلمة (صواب )أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٔ) تحتوى النظم البيبية المابية على العديد من مصادر الطالة الحفرية .\n(ٕ) يؤتي نهر النيل في المرتبة الثانية عالمياا بعد نهر األمازون في التنوع الحيوي .\n(ٕ) تمثل نظم األراضي الرطبة العذبة حوالى ٔ ٪ من مساحة لارة إفريميا .\n(ٗ) من أشهر المستنمعات المكشوفة مستنمعات نبات البردي في جنوب السودان .\nبم تفسر ... ؟\n(ٔ) للنظم البيبية المابية بمارة إفريميا أهمية التصادية .\n(ٕ) تعرض أنواع عديدة من األسمان في بحيرة فيكتوريا لخطر االنمراض .\n(ٖ) لنظم األراضى الرطبة العذبة بمارة إفريميا أهمية بيبية .\nس :3 دلل على صحة العبارة التالية : تتسم النظم البحيرية العذبة بمارة إفريميا بالتنوع البيولوجي"],[114,"ثانياً : الهظم الابيئيُ للمياه املاحلُ\n تشمل البحار والمحيطات والبحيرات المالحة والشعاب المرجانية واألراضي الرطبة المالحة .\n تتسم بتنوع حيوى أكبر من النظم البيبية للمياه العذبة .\n ويوجد بقارة إفريقيا العديد من النظم البيئية للمياه المالحة ، ومنها :\nنظام المانجروف\nنظام الشعاب المرجانية\nنظم األراضي الرطبة المالحة\nي  تضمن نظام المانجروف أشجار وشجيرات تنمو فى المناطك الساحلية المدارية\nوشبه المدارية وعادة ما تنمو فى الشواطا الضحلة المحمية من حركة األمواج\nوعند داالت األنهار وعلى طول الخلجان والبحيرات الساحلية .\n تؤتى لارة إفريميا فى المرتبة الثانية بعد لارة آسيا من حيث مساحة المانجروف .\n توجد أشجار المانجروف بإفريقيا في :\nالسواحل الؽربية حيث تنتشر بشكل أكثر وضو احا عن السواحل الشرلية بم تفسر؟\nبسبب كثرة النظم النهرية وزيادة كمية األمطار .\nعدد من المناطك على سواحل البحر األحمر وسواحل جزيرة مدغشمر .\nتبلغ مساحة المانجروف في مصر نحو 5 كم ، 2 وتنمو أشجاره فى مساحات صغيرة على\nسواحل البحر األحمر وخليج العقبة ، وأعلنت جميع مناطقها فى مصر محميات طبيعية\nمثل : محميات نبق وعلبة وحماطة .\nأهمية أشجار المانجروف :\nٔ) يُعد نظام المانجروف موطنا للعديد من الكابنات البحرية ، مثل : األسمان والمشريات والرخويات .\nٕ) يعيش بها الطيور والزواحف والحشرات .\nٖ) تمثل محطة من المحطات التي تمف عندها الطيور المهاجرة .\nٗ) تعمل على حماية الشواطا من التآكل والتعرية .\n٘) تنمية الهواء من الكربون .\n)ٙ تعد واحدة من المناطك الجاذبة للنشاط السياحي ."],[115," بم تفسر : يتعرض نظام المانجروف للتدهور ؟ بسبب عدة عوامل :\nعوامل طبيعية ، مثل : التؽيرات المناخية ومنها زيادة درجات الحرارة ونمص األمطار .\nعوامل بشرية ، مثل : الصيد الجابر وإزالة مساحات منها ألغراض التنمية العمرانية والسياحية .\n بم تفسر : تنمو الشعاب المرجانية في معظم السواحل الشرقية لقارة إفريقيا ؟\nألن الشعاب المرجانية توجد فى السواحل التي يتوافر بها الظروف المبلبمة لنمو الكابنات البحرية\nالمسبولة عن تكوينها سواء من حيث المياه الدافبة وضوء الشمس الكافي والمياه النظيفة الصافية ودرجة\nالملوحة الثابتة والتيارات البحرية الهادبة .\n• مناطق انتشارها :\n معظم السواحل الشرلية لمارة إفريميا .\n سواحل جزر الممر وجزيرة مدغشمر .\n سواحل البحر األحمر فى مصر ، خاصة في منطمة الؽردلة ومحمية رأس دمحم ومنطمة دهب .\nُتعد الشعاب المرجانية واحدة من مناطق التنوع البيولوجى المهمة في البحار والمحيطات\nبم تفسر ؟ ألنها توفر المؤوى والؽذاء للعديد من الكابنات البحرية .\nتتعرض الشعاب المرجانية للعديد من التهديدات دلل ؟ حيث تتعرض لـ :\nالتهديدات الطبيعية ، مثل : التؽيرات المناخية . التهديدات البشرية ، مثل : التلوث واألنشطة السياحية والصيد باستخدام المتفجرات وردم الشواطا .  ما النتائج : تعرض الشواطئ لعمليات الردم ؟ مما يؤدى إلى تدمير الشعاب المرجانية .\nأضف إلى معلوماتك\n ما المقصود بـ الشعاب المرجانية ؟\nإفرازات لكائنات بحرية دقيقة أهمها حيوان المرجان .\n تعد محمية رأس محمد محمية تراث عالمى تشتمل على تنوع بيئي متميز من شعاب\nمرجانية ومانجروف ."],[116," تتمثل في البحيرات الساحلية والمستنمعات الساحلية والسبخات .\n توجد في هذه المناطك سهول طينية ما النتائج؟ تساعد على :\nنمو أعشاب بحرية ما النتائج؟ مما أدى إلى جعلها بيبة مناسبة لوجود\nاألسمان وسرطان البحر وغيرها .\n تمثل مؤوى للعديد من الطيور المستوطنة والمهاجرة .\n* مناطق انتشارها :\nالسواحل الؽربية والسواحل الشرلية للمارة .\nسواحل شمال دلتا النيل وما به من بحيرات ساحلية مثل بحيرة المنزلة .\nوسط ساحل شمال سيناء حيث بحيرة البردويل .\nمسطحات ملحية ترتكز فوق\nتكوينات من الصلصال\nوالطين ، وغالبا ما تؽطى\nبمشور ملحية يتحكم في\nمنسوبها مستوى الماء\nالجوفى .\n تُعد بعض نظم األراضى الرطبة محميات طبيعية دلل؟ ، مثل :\nصنّفت كمنطمة تراث عالمى من لبل اليونسكو .\nالمحمية الوطنية لحوض آركين فى موريتانيا والتى ُ - محمية الزرانيك والبردويل في مصر .\nثالثيا : الجهود اإلفريقية والمصرية للحفاظ على النظم البيئية والتنوع البيولوجي :\nنظرا لألخطار والتهديدات التي تتعرض لها النظم البيئية فى إفريقيا تبذل دول القارة\nالعديد من الجهود للحفاظ على هذه النظم ومن أهمها ما يلى :\nعلى المستوى اإلفريقى\nلمساعدة الدول اإلفريمية لمواجهة مشكلة التؽيرات المناخية .\nالظروف المناخية وذلن عن طريك اإلدارة المستدامة للموارد والحفاظ على النظم البيبية .\nٖ) مبادرة (إفريميا الستعادة المناظر الطبيعية للؽابات ) وبموجبها تلتزم ٕ۷ دولة إفريمية باستعادة"],[117,"ٗ) مبادرة (الشبكات الشمسية الصؽيرة لتوليد الكهرباء في إفريميا) التي أطلمها برنامج\nاألمم المتحدة اإلنمابي بم تفسر ؟ بهدف توسيع الحصول على الطالة الخضراء حتى عام ٖٕٓٓم .\n٘) مساعى دول إفريميا لبلستفادة من التكنولوجيا الحديثة فى مواجهة التؽير المناخى والحفاظ على التنوع\nالبيولوجي .\n ما العالقة بين : التكنولوجيا الحديثة و الحفاظ على النظم البيئية ؟ حيث :\nتساهم التكنولوجيا الحديثة فى مواجهة التؽير المناخى والحفاظ على التنوع البيولوجي وتساعد\nالتمنيات الحديثة في رسم الخرابط ورصد التؽيرات فى النظم البيبية .\nكما تساعد على إعادة تدوير النفايات مما يحد من اإلسراف فى الموارد الطبيعية ، باإلضافة الستخدام\nالتكنولوجيا في توليد الطالة المتجددة ، وفى إنشاء المدن الخضراء الذكية .\nعلى مستوى مصر :\nٔ) تموم مصر بدورها اإلفريمى من خبلل المشاركة فى جميع المإتمرات اإلفريمية والدولية .\nٕ) إصدار لوانين بشؤن حماية المحميات الطبيعية .\nٖ) إطبلق رإية مصر ٖٕٓٓم ، بم تفسر ؟ لتحميك أهداف التنمية المستدامة .\nٗ) تنفيذ العديد من المشروعات لمواجهة التؽير المناخي والتدهور في النظم .\n دلل : تقوم مصر بتنفيذ العديد من المشروعات لمواجهة التغير المناخي؟حيث قامت بـ :\nٔ) التوسع في إنتاج الطالة النظيفة بم تفسر ؟ لتجنب انبعاثات ثاني أكسيد الكربون .\nٕ) تطوير وتطهير بحيرات الساحل الشمالى وتعميمها .\nٖ) إعبلن عدد من المدن الصديمة للبيبة مثل :\nمدينة العلمين الجديدة والجبللة الجديدة والعاصمة اإلدارية الجديدة .\nالتدريب الثاني\nس :1 دلل جغرافييا على صحة كل عبارة مما يأتي :\n(ٔ) ألشجار المانجروف أهمية كبيرة .\n(ٕ) تُعد الشعاب المرجانية واحدة من مناطك التنوع البيولوجى المهمة في البحار والمحيطات .\nس :2 بم تفسر ... ؟\n(ٕ) تعرض نبات المانجروف للتدهور .\n(ٖ) تنمو الشعاب المرجانية فى معظم السواحل الشرلية لمارة إفريميا ."],[118,"س :1 أمامك خريطة لقارة إفريقيا اكتب ما تدل عليها األرقام اآلتية :\nٔ) بحيرة . ..........................\nٕ) بحيرة . ..........................\nٖ) نهر . .............................\nٗ) نهر . .............................\n٘) خليج . ..........................\n)ٙ خليج . ............................\n)۷ المحيط . ..........................\n)٨ المحيط . ..........................\n)۹ مدار . ............................\nٓٔ) مدار . ............................\nس :2 أكمل العبارات اآلتية بما يناسبها :\n(ٔ) تنمسم النظم المابية لنوعين ربيسيين تبعاا لنسبة األمبلح إلى النظم المابية ..................... .\nوالنظم المابية . ..........................\n(ٕ) البحيرة اإلفريمية العذبة التى شهدت أكبر انمراض جماعى للفماريات في العصر الحديث هي . ............\n(ٖ) تعرف نظم األراضي الرطبة العذبة بــ . ........................\n(ٗ) من المستنمعات المؽطاة بالنباتات وتمع شرق ووسط وجنوب لارة إفريميا . ......................... .\n(٘) تعمل أشجار المانجروف على حماية الشواطا من ..................... . و . .....................\n( )ٙ من األنشطة االلتصادية التى أثرت بالسلب على أشجار المانجروف . . .........................\n( )۷ من المحميات الطبيعية لنظم األراضى الرطبة المالحة الموجودة فى مصر محمية . .........................\n( )٨ من المدن الصديمة للبيبة التي أنشؤتها مصر مدينة ..................... و . ............................\nس :3 اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) حوض النهر الذي يؤتى فى المرتبة األولى عالمياا فى التنوع الجيولوجى يوجد بمارة . .............\n(أمريكا الشمالية - أمريكا الجنوبية - إفريميا - آسيا )"],[119,"(ٕ) من أمثلة النظم البيبية للمياه العذبة بمارة إفريميا بحيرة . .........\n( تنجانيما - المنزلة - البردويل - البرلس )\n(ٖ) من النظم المابية العذبة التي توجد بجنوب لارة إفريميا .........\n( نهر األورانج - بحيرة فيكتوريا - نهر النيجر - نهر الكونؽو )\n(ٗ) أكبر انتشار المستنمعات الؽابات في إفريميا يوجد في سهول نهر . ............. .\n( األورانج - الكونؽو - الزمبيزى - النيجر )\n(ه) تؤتى لارة إفريميا في المرتبة الثانية عالمياا في مساحة المانجروف بعد لارة .. .............\n(آسيا - أوروبا - أمريكا الشمالية - أمريكا الجنوبية )\n(ٔ) أكثر السواحل التي تنتشر بها أشجار المانجروف في لارة إفريميا بصورة واضحة هي .. .............\n( البحر المتوسط - البحر األحمر - المحيط الهندى - المحيط األطلنطي )\n( موريتانيا - المؽرب - الجزابر - مصر )\n( )۷ تمع محمية آركين فى دولة . ............. .\n( )٨ توجد الشعاب المرجانية فى معظم السواحل اإلفريمية .. .............\n(الشرلية - الؽربية - الشمالية - الجنوبية )\n( )۹ من المخاطر الطبيعية التى تواجه نظام الشعاب المرجانية . ............. .\n( ارتفاع درجات الحرارة - الصيد - عمليات الردم - التلوث )\nس :4 اكتب كلمة (صواب أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٔ) تنمسم النظم البيبية المابية إلى نوعين ربيسيين تبعا لنسبة األمبلح في المياه .\n(ٕ) تنمو أشجار المانجروف فى المناطك الساحلية المعتدلة .\n(ٖ) تنتشر أشجار المانجروف فى السواحل الشرلية بإفريميا بصورة أكبر عن السواحل الؽربية ( .\n(ٗ) تبلػ مساحة المانجروف في مصر نحو ه كم؟ .\n(ه) توجد الشعاب المرجانية على سواحل البحر المتوسط في مصر .\n( )ٙ تتمتع محمية رأس دمحم بتنوع بينى متميز من شعاب مرجانية والمانجروف .\n( )۷ تمثل نظم األراضي الرطبة المالحة مؤوى للعديد من الطيور المستوطنة والمهاجرة .\n( )٨ لامت مصر بالتوسع في إنتاج الطالة النظيفة لتجنب انبعاثات ثاني أكسيد الكربون .\n( )۹ لامت مصر بتنفيذ مشروع تطهير وتطوير بحيرات الساحل الشمالي .\nس :5 اكتب المصطلح الجغرافى الذى تشير إليه كل عبارة مما يأتي :\n(ٔ) نظام يوجد فى المسطحات المابية أو على هوامشها ويوجد به مكونات حية وغيرحية تتفاعل مع بعضها\nالبعض الستدامة الحياة في النظام .\n(ٕ) أراضى مشبعة بالمياه بصورة دابمة أو موسمية وتمثل نحو ٔ % من مساحة إفريميا .\n(ٖ) أشجار وشجيرات تنمو فى المناطك الساحلية المدارية وشبه المدارية عند داالت األنهار وعلى طول\nالخلجان والبحيرات الساحلية .\n(ٗ) إفرازات لكابنات بحرية دليمة أهمها حيوان المرجان ."],[120,"(ه) مسطحات ملحية ترتكز فوق تكوينات من الصلصال والطين وغالبا ما تؽطى بمشور ملحية يتحكم في\nمنسوبها مستوى الماء الجوفى .\nس :6 بم تفسر ... ؟\n(ٔ) تعرف نظم األراضي الرطبة العذبة بالنظم البرمابية .\n(ٕ) تعرض بعض الحيوانات والطيور لبلنمراض فى نظم األراضي الرطبة العذبة .\n(ٕ) األهمية البيبية ألشجار المانجروف .\n(ٗ) إطبلق األمم المتحدة البرنامج اإلنمابي لمبادرة الشبكات الشمسية الصؽيرة بمارة إفريميا .\nس :7 ما النتائج المترتبة على ... ؟\n(ٔ) إدخال أنواع جديدة من األسمان إلى بحيرة فيكتوريا بإفريميا .\n(ٕ) تعرض األراضي الرطبة العذبة بإفريميا إلى التوسع الزراعي وإزالة النباتات .\n(ٖ) انتشار السهول الطينية في نظم األراضي الرطبة .\n(ٗ) تعرض الشواطا لعمليات ردم .\nس :8 قارن بين : المانجروف ، والشعاب المرجانية ، من حيث :\n* المخاطر التي تهدد وجودها .\n*أماكن تواجدها .\nس :9 دلل جغرافييا على صحة كل عبارة مما يأتي :\n(ٔ) وجود العديد من المحميات الطبيعية في نظام األراضي الرطبة المالحة .\n(ٕ) تتعدد التهديدات البشرية التي تإثر سلباا على الشعاب المرجانية بمارة إفريميا .\nس :10 ماذا يحدث إذا اختفت النباتات من النظم البيبية المابية العذبة بمارة إفريميا ؟\nس :11 ما العالقة بين ... ؟\n(ٔ) األراضى الرطبة العذبة ، واالحتباس الحراري .\n(ٕ) التكنولوجيا الحديثة ، والحفاظ على النظم البيبية .\n«تعد إفريقيا من القارات الغنية بالنظم البيئية المائية التي تقوم بدور حيوي في الحفاظ\nعلى التوازن البيئي» . في ضوء العبارة السابقة :\n(ٔ) اذكر بعض الموارد الطبيعية التي تستخرج من النظم البيبية المابية .\n(ٕ) لماذا تعد النظم البيبية المابية ضرورية للحياة على كوكب األرض ؟\n(ٕ) وضح أهمية الطحالب التي تستخرج من النظم البيبية المابية ."],[121,"امتحان على الدرس الثالث\nس ( :1 أ) استعن بخريطة قارة إفريقيا التي أمامك\nوأجب عما يأتي :\n(ٔ) البحر . ..................\n(ٕ) بحيرة . .................. .\n(ٕ) نهر . ..................\n(ٗ) دابرة عرض . .................. .\n(٘) مستنمعات . .................. .\n(ب) صوب ما تحته خط :\n(ٔ) من أشهر المستنمعات المكشوفة مستنمعات نبات البردى فى شرق ووسط وجنوب إفريميا .\n(ٕ) تنمو الشعاب المرجانية عند داالت األنهار .\n(ٖ) تشمل النظم البيبية للمياه العذبة البحار والمحيطات .\n(ج) حدد وجه االرتباط بين : النظم البيبية المابية ، والبطالة .\nس ( :2 أ) اتجهت أنظار العالم إلى قارة إفريقيا عامة ومصر خاصة من خالل مؤتمر المناخ\n\" \"cop 27 حيث أصبحت مصر أيقونة العالم من خالل مبادرة \"اتحضر لألخضر\"» .\nفي ضوء العبارة السابقة ، أجب عن األسئلة اآلتية :\n(ٕ) فسر : تؤسيس الصندوق اإلفريمي عام ٕٗٔٓم .\n(ب) صنف النظم البيئية المائية اآلتية تبعيا لنسبة الملوحة :\n(ٔ) بحيرة تشاد .\n(ٕ) بحيرة البردويل .\n(ٖ) نهر الزمبيزي .\n(جـ) حدد أوجه الشبه بين : أشجار المانجروف ، والشعاب المرجانية ، من حيث األهمية .\n( د ) ما المقصود بـ : السبخات ؟"],[122,"س :1 اكتب ما يشير إليه مدلول االرقام التالية على الخريطة :\nٔ) إلليم تنمو به حشابش . .................\nٕ) حشابش . ................. .\nٖ) نهـر . ..................\nٗ) بحيرة . .................\n٘) نظام . .................\n)ٙ نظام غابات .. .................\n)۷ نهر . .................\n)٨ صحراء . ................. .\nس :2 اكتب كلمة (صواب) أ وكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\nٕ) تربى األغنام والماعز في غابات البحر المتوسط .\nٖ) يندر النبات والحيوان بشكل واضح في نظام الصحاري الحارة .\nٗ) تُعد حشابش اإلستبس أحد نظم الؽابات المدارية المطيرة .\n٘) يصنف نظام األراضى الرطبة ضمن النظم البيبية األرضية .\n)ٙ توفر الشعاب المرجانية غذاء ومؤوى للعديد من الكابنات البحرية .\n)۷ غابات البحر المتوسط دابمة الخضرة لسموط األمطار عليها طوال العام .\nس :3 اختر اإلجابة الصحيحة مما بين القوسين :\nٔ) أحد المكونات الحية في النظام البيبي ( . ................. . الحرارة - الرطوبة - الفطريات – األمطار)\nٕ) ينمو في نظام غابات البحر المتوسط أشجار ( . .............. الماهوجني - األبنوس - المطاط – الصنوبر)\nٖ) تنمو السافانا البستانية في مناطك ألرب إلى . ................. .\n(دابرة االستواء - مدار الجدى - مدار السرطان - الدابرة المطبية )\nٗ) يمكن إلامة مشروعات استؽبلل الطالة الشمسية في نظام . ................. .\n(الصحاري المعتدلة - الصحارى المطبية - الصحاري الحارة - حشابش اإلستبس)\n٘) أحد نظم المياه المالحة في إفريميا . ................. .\n( نهر النيجر - بحيرة تشاد - المستنمعات المؽطاة - الشعاب المرجانية )"],[123,"س :4 أكمل العبارات التالية بما يناسبها من كلمات :\nٔ) تعيش الموارض وطيور النورس فى نظام غابات . ................. .\nٕ) التطرف الشديد في درجات الحرارة أحد خصابص نظام . ................. .\nٖ) حدث أكبر انمراض جماعى للفماريات في العصر الحديث في بحيرة ... .................\nٗ) يؤتى نهر الكونؽو في المرتبة الثانية من حيث التنوع البيولوجي بعد نهر .. .................\nس :5 بم تفسر :\nٕ) ارتفاع الحرارة بشكل ملحوظ في نظام حشابش السافانا خاصة في فصل الصيف .\nٖ) األهمية االلتصادية لنظم الصحاري الحارة .\nٗ) تختفى الشعاب المرجانية من السواحل الشمالية لمصر .\nس :6 ما النتائج المترتبة على ... ؟\nٕ) التنوع الحيوى في نظام غابات البحر المتوسط .\nٖ) زيادة حدة موجات الجفاف فى نظام الصحاري الحارة في إفريميا .\nٗ) تعرض األراضي الرطبة العذبة للتجفيف وإزالة النباتات .\nس :7 دلل على صحة كل عبارة مما يلى؟\nٔ) تنمو نباتات في نظام الصحارى الحارة لادرة على تحمل الظروف المناخية الماسية .\nٕ) تتعدد أنواع األشجار التي تنمو في الؽابات المدارية .\nٖ) تتعدد العوامل التى تإدى إلى تدهور نظام المانجروف .\nٗ) تعمل مصر على التوسع فى إنشاء مدن صديمة للبيبة .\nس :8 أجب عما يلى :\nٔ) ما الممصود بالسافانا ؟\nٕ) حدد اثنين من األخطار التي تواجه نظام حشابش اإلستبس في إفريميا .\nٖ) الترح مجموعة من األفكار للحفاظ على نظام المانجروف في إفريميا ."],[125," ارتبط العرب بعالقات تجارية مع إفريقيا قديما قبل ظهور اإلسالم بم تفسر؟\nبسبب : القرب الجغرافي بين شبه الجزيرة العربية وشرق إفريقيا .\n عرفت إفريقيا اإلسالم ألول مرة عندما أشار النبي محمد اهلل على أصحابه بالهجرة إلى\nبالد الحبشة (إثيوبيا حالييا ) بم تفسر؟ فراريا من أذى قريش .\nأوليا : معابز انتكا اإلسالم إىل إفزيكيا\n وصل عرب شبه الجزيرة العربية إلى الساحل الشرلي إلفريميا عبر عدة معابر بؽرض التجارة ما النتائج ؟\nترتب على ذلك أن :\nاختلط العرب بؤهل الساحل وتزوجوا منهم . ألاموا محطات تجارية هنان .  كانت تلن المعابر بداية العبللات بين سكان شبه الجزيرة العربية وبين سكان شرق المارة اإلفريمية ، ولد\nمهد هذا األمر النتشار اإلسبلم فى تلن األماكن .\n لذلن كان شرق إفريميا أولى المناطك التي وصل إليها اإلسبلم بم تفسر؟ بحكم مولعه الجؽرافي .\nأهم معابر انتقال اإلسالم إلى إفريقيا :\n-1 المحيط الهندي ، ومضيق باب المندب :\nكانا معبران أساسيان النتقال اإلسالم إلى إفريقيا دلل ؟ حيث :\nبعد ظهور اإلسبلم :\n استخدمهما العرب لبل ظهور اإلسبلم للتجارة مع شرق إفريميا .\n استخدمهما المسلمون األوابل أثناء الهجرة إلى ببلد الحبشة .\n انتشر عن طريمهما اإلسبلم في شرق إفريميا ومنهما امتد إلى غربها ."],[126,"-2 شبه جزيرة سيناء :\n*بم تفسر : أهمية شبه جزيرة سيناء في نشر اإلسالم بإفريقيا؟\nألنها :\nتُعد المعبر البرى الوحيد الذي يربط شبه الجزيرة العربية بإفريميا ، وعبرت منها جيوش المسلمين لفتح شمال\nإفريميا ونشر اإلسبلم بها .\n-3 البحر األحمر :\n*دلل : كان له دور مهم في انتشار اإلسالم في شرق إفريقيا\nعبر الهجرات واألنشطة التجارية والدعوية ، ؟ حيث :\nاستخدمه المسلمون األوابل فى التنمل بين شبه الجزيرة العربية وإفريميا ثم أنشؤوا بعض المراكز اإلسبلمية\nعلى طول الساحل الشرلي اإلفريمي والتي أصبحت مراكز لنشر اإلسبلم في للب إفريميا .\n تم حفر قناة بعد الفتح اإلسالمى فى مصر عُرفت باسم خليج أمير المؤمنين بم تفسر؟\n(لتربط بين البحر األحمر ونهر النيل) التي ساعدت أيضيا على انتشار اإلسالم في إفريقيا .\nثان ًا : أساليب انتشار اإلسالم يف إفزيكيا\n*بم تفسر : انتشار الدين اإلسالمي في إفريقيا ؟\nبسبب :\nسماحة الدين اإلسبلمي ، ودعوته للعدل والمساواة ، مما جعل األفارلة يسارعون إلى اعتناله عن حب وطواعية .\nوقد ساهمت عدة أساليب فى هذا االنتشار فكانت فى مجملها تعتمد على\nاألسلوب السلمي في اإلقناع دلل؟ وتمثلت هذه األساليب في :\nأهم ألأساليب\nالدعاة\nالتج المس\nل\nم\nار ون\nالروأج والمصاهرة\nال\nهجرأت"],[127,"ما المقصود بـ : الدعاة ؟\n* قام الدعاة وعلماء الدين بدور بارز في نشر اإلسالم دلل ؟\nحيث كان لادة المبابل اإلسبلمية بإفريميا يرسلون الدعاة لنشر اإلسبلم\nبين بمية المبابل اإلفريمية ، وكان هإالء الدعاة يحظون بنوع من التمدير\nلدرا\nهم األفراد الذين تلموا ا\nمن العلوم الدينية التي\nتإهلهم لنشر اإلسبلم\nوتعاليمه بالطرق السلمية .\nواالحترام بين تلن المبابل .\n دلل : كان للتجار المسلمين دور بارز في نشر اإلسالم بإفريقيا ؟\nحيث :\n بشكل غير مباشر بم تفسر ؟ بسبب مظهرهم ومبلبسهم النظيفة المحتشمة ، وحسن أخبللهم\nواتســامهم بالصدق واألمانة ورفض التعامل بالربا أو الؽش .\n بشكل مباشر بم تفسر ؟ بسبب ليام بعض التجار المسلمين بتشييد المساجد في إفريميا وكانوا\nيختارون الطبلب المتميزين من السكان األصليين إلرسالهم إلى المعاهد العلمية بمصر أو شمال إفريميا\nبم تفسر ؟ لتلمى مزيد من العلم فيعودوا لادة للفكر اإلسبلمي في ببلدهم .\n تحولت العديد من الموانا والمراكز التجارية إلى مراكز ثمافية وعلمية بم تفسر ؟\nلنشر اإلسبلم مثل مدينة «كانو» في نيجيريا حاليا ا ، ومدينة «تمبكتو» في مالي حاليا ا .\n ما النتائج : زواج التجار المسلمين من النساء األفارقة ؟\nساعد ذلك على :\nتموية العبللات بين الطرفين .\nنمل العادات والتماليد اإلسبلمية إلى الشعوب اإلفريمية .\n كانت الهجرات اإلسبلمية إلى لارة إفريميا إحدى الوسابل المهمة النتشار اإلسبلم .\n توافدت هجرات المسلمين إلى المارة اإلفريمية منذ فجر اإلسبلم ، فعلى سبيل المثال :\n-1 هجرة الصحابة األوائل إلى بالد الحبشة :\n تعد ببلد الحبشة أولى المحطات التي وصل إليها اإلسبلم خارج شبه الجزيرة العربية .\n استمرت هجرة المسلمين فيما بعد إلى شرق إفريميا ما النتائج ؟ مما ساهم بشكل مباشر في انتشار\nاإلسبلم في إفريميا ونشؤة الممالن اإلسبلمية بها ."],[128,"-2 هجرات العرب المسلمين إلفريقيا بحثيا عن المعادن واالحجار الكريمة :\nصورا من الحضارة العربية إلى تلن الببلد التي هاجروا إليها ،\nحيث نملوا العرب المسلمون معهم\nا\nمثل : فن العمارة اإلسبلمية دلل؟ حيث أرسل الخليفة األموى عبد الملن بن مروان البنابين إلى الساحل\nالشرلي اإلفريمى ليساهموا في بناء المدن هنان .\n-3 فرار بني أمية وأنصارهم إلى داخل القارة اإلفريقية :\nفر الكثير من بني أمية بعد سموط الدولة األموية وليام الدولة العباسية إلى السودان ومناطك أخرى داخل\nالمارة اإلفريمية ما النتائج ؟ فكانوا عامبلا مه اما في نشر اإلسبلم واللؽة العربية بين أهل تلن الببلد .\nتوالت بعد ذلك العديد من هجرات المسلمين إلى وسط وغرب إفريقيا فى فترات مختلفة\nوكان لها تأثير قوى في نشر الحضارة اإلسالمية في إفريقيا .\nالتدريب األول\nس :1 اكتب كلمة (صواب ) أوكلمة (خطأ) أمام العبارة غير الصحيحة :\nدورا فى نشر اإلسبلم في إفريميا بشكل غير مباشر .\n(ٔ) لعب التجار المسلمون ا\n(ٕ) انتملت العادات والتماليد اإلسبلمية إلى الشعوب اإلفريمية عن طريك الزواج والمصاهرة .\nس :2 ما العالقة بين : البحر األحمر ، وانتشار اإلسبلم في شرق إفريميا ؟\nس :3 ما المقصود بـ : الدعاة ؟\nس :4 ما األثر الناتج عن : فرار بني أمية وأنصارهم إلى داخل المارة اإلفريمية ؟"],[129,"ثالجاً : الفتىحات اإلسالميُ يف مشا إفزيكيا\n* بدأ الفتح اإلسالمى لقارة إفريقيا منذ عهد الخلفاء الراشدين .\n-1 فتح مصر :\n كانت مصر أولى الدول اإلفريمية التي فتحها عمرو بن العاص\nفى عهد الخليفة عمر بن الخطاب ، ومنها انتشر اإلسبلم لدول إفريميا .\n-2 فتح برقة :\n بعد أن استمر األمر لعمرو بن العاص فى مصر سار بجيشه نحو إلليم برلة غربا ا بم تفسر؟\nلتؤمين الحدود المصرية ونشر اإلسبلم .\n تم فتح برلة سريعا ا حيث رحب أهلها بالفتح اإلسبلمي ، كما رحب به المصريون من لبل بم تفسر؟\nألنهم كانوا يعانون من مساوئ حكم الروم ."],[130,"-3 فتح طرابلس :\nبعد فتح برقة اتجه عمرو بن العاص نحو طرابلس بم تفسر ؟\nبسبب :\n أهميتها على الشاطا اإلفريمي .\n إحكام السيطرة على شمال إفريميا .\nذكاء القائد عمرو بن العاص في فتح طرابلس :\n دلل : فتحت طرابلس دون صعوبة رغم قوة أسوارها وحصونها ؟\nٔ) كانت طرابلس محاطة باألسوار إال من جهة البحر ، وألبل عمرو بن العاص بمواته من ناحية الشرق\nواستمر بجيشه في مولع مرتفع يشرف على المدينة وحاصرها لمدة شهر .\nٕ) انتظر عمرو بن العاص انحسار المياه عن شواطبها وفاجؤ الروم من جهة الساحل وسيطر على المدينة\nما النتائج ؟ مما أدى إلى هروب الروم وفرارهم نحو سفنهم .\n-4 فتح إفريقية تونس (حالياً) :\n أرسل عبد هللا بن أبى السرح الحمبلت االستطبلعية ألطراف إفريمية (تونس حالياا) بم تفسر ؟\nلمعرفة لدرة الروم على صد هجمات المسلمين .\n وبنا اء على ذلن أرسل للخليفة عثمان بن عفان يستؤذنه في فتح إفريمية .\n وافك الخليفة فخرج عبد هللا بن أبى السرح على رأس جيش المسلمين .\nاتخذ عبد اهلل بن أبى السرح الطريق الساحلى حتى وصل قرب سبيطلة ما النتائج ؟\nٔ) نشبت الحرب بينه وبين حاكم الروم ، وانتهت بانتصار المسلمين وهزيمة الروم .\nٕ) فتح مدينة سبيطلة (إحدى مدن إفريمية) .\nٖ) مهد فتح سبيطلة الطريك أمام المسلمين لفتح مدن وحصون أخرى في شمال إفريمية في\nعصر الدولة األموية فيما بعد بميادة لادة مسلمين كبار مثل : عمبة بن نافع ، وموسى بن نصير .\n* ما النتائج : فتح شمال إفريقيا (فتح بالد المغرب)؟ترتب على ذلك :\nٔ) إحكام سيطرة المسلمين على شمال إفريميا .\nٕ) تؤمين حدود الدولة اإلسبلمية من جهة الؽرب .\nٖ) دخول عدد كبير من سكان شمال إفريميا في اإلسبلم ."],[131,"رابعاً : تأثري اإلسالم يف إفزيكيا\nكان النتشار اإلسالم في إفريقيا أثر كبير فى حياة الشعوب اإلفريقية التي دخلت في\nاإلسالم .\n-۱ ظهور الممالك اإلسالمية في إفريقيا :\nتكونت مجموعات إسبلمية من المهاجرين العرب والمبابل اإلفريمية التي اعتنمت اإلسبلم .\nس ْل َطنات اإلسبلمية في مناطك مختلفة\nمع مرور الزمن نجحت تلن المجموعات فى تكوين الممالن وال َّ\nبالمارة اإلفريمية مثل : مملكة غانة (غانا) ، ومملكة مالي ، وغيرها من الممالن اإلسبلمية التي\nساهمت فى نشر اإلسبلم بإفريميا .\n-2 نشر اللغة العربية :\n بم تفسر : اتجاه القبائل اإلفريقية على تعلم اللغة العربية ؟ ألن :\nهي اللؽة التي نزل بها المرآن الكريم ، فكان على المبابل اإلفريمية تعلمها إللامة الشعابر اإلسبلمية ،\n دلل : ارتبط انتشار اإلسالم في إفريقيا بانتشار اللغة العربية ؟\nحيث أصبحت :\n-3 ازدهار الحركة العلمية :\nحرص أمراء وملوك الممالك اإلسالمية في إفريقيا على إقامة دور العلم والمساجد\nبم تفسر ؟ كان له دور كبير فى :\nنشر اللؽة العربية والثمافة اإلسبلمية في المجتمع اإلفريمي . - تخريج أعداد كبيرة من العلماء الذين ساهموا في ازدهار الحركة العلمية في المرن الثالث عشر الهجري ."],[132,"*من أهم العلوم التي انتشرت خالل هذه الفترة :\n( - الفقه - النحو والصرف - التفسير - علم الحديث - المنطق - . البالغة - علم الفلك) .\n* من أهم المساجد التي أُلقيت فيها الدروس بإفريقيا :\nجامع سنكورى في مدينة تمبكتو بدولة مالي .\nأهميته : حيث أُلميت فيه دروس في جميع العلوم اإلسبلمية ، وهو في الولت الحاضر ممر جامعة سنكورى .\n-4 الذوبان العرقى بين العرب وسكان إفريقيا :\nتعد المصاهرة والزواج بين الطرفين أحد أهم تأثيرات اإلسالم في إفريقيا شرقاً وغرباً\nما النتائج ؟\nمما أدى إلي :\nالذوبان العرق لكبل الطرفين ، والذى نتج عنه جيل جديد يحمل صفات األب العربي واألم اإلفريمية أو العكس\nوهذا الجيل الجديد يعتز بنسبه العربي وبؤصله اإلفريمي في نفس الولت .\n-5 العادات والتقاليد :\n• كان لإلسالم دور مهم فى تشكيل الهوية الثقافية واالجتماعية لشعوب إفريقيا ، دلل؟\nحيث قام اإلسالم بــ :\nٔ) الحفاظ على كثير من عاداتهم الطيبة التي ال تتنافى مع الشريعة اإلسبلمية مثل : إكرام الضيف ، ومساعدة\nالمحتاج ، والتضامن االجتماعي .\nٕ) ساهم اإلسبلم في تؽيير بعض العادات السلبية ما النتائج ؟ مما أدى إلى إصبلح شؤن المجتمعات اإلفريمية ،\nوذلك من خالل :\nتنظيم الزواج :\n* كانت عادات وتقاليد الزواج عند القبائل الوثنية غير مقبولة ما النتائج ؟ فقام اإلسالم بـ :\nتوضيح حموق الزوجين وواجباتهما ، وتنظيم العبللة بينهما .\nمنح المرأة حرية اختيار الزوج .\nحدد عدد الزوجات ."],[133,"تنظيم الحياة االجتماعية واألسرية :\n*دلل : كان لإلسالم دور مهم فى تنظيم الحياة االجتماعية واألسرية لشعوب إفريقيا؟\nحيث :\nٔ) اهتم اإلسبلم بالعبللات األسرية ودعم الروابط بين اآلباء واألبناء .\nٕ) منح اإلسبلم األم الحك في حضانة األطفال .\nٖ) أعطى اإلسبلم المرأة حك الميراث ومنع التفرلة العنصرية .\nٗ) حرم اإلسبلم شرب الخمر ودعا إلى العمل الخيرى التعاوني خاصة في إلامة دور رعاية األيتام والفمراء .\nمما أدى إلى بناء أسر متماسكة ومجتمعات لوية .\n* دلل : كان لإلسالم بعد انتشاره في قارة إفريقيا دوريا هاما في رفع شأن المرأة؟\nحيث :\nمنح اإلسبلم األم الحك في حضانة األطفال .\nأعطى اإلسبلم المرأة حك الميراث ومنع التفرلة العنصرية .\nمنح المرأة حرية اختيار الزوج .\nالتدريب الثاني\nس :1 اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) بعد أن استمر األمر لعمرو بن العاص فى مصر توجه بجيشه الستكمال الفتوحات جهة . .........\n(الشرق - الؽرب - الشمال - الجنوب )\n(ٕ) تم فتح سبيطلة على يد المابد . ............\n( عمرو بن العاص - عبد هللا بن أبي السرح - عمبة بن نافع - موسى بن نصير )\nس :2 بم تفسر : اتجاه المبابل اإلفريمية لتعلم اللؽة العربية بعد انتشار اإلسبلم بينهم ؟\nدورا هاما في رفع شؤن المرأة .\nس :3 دلل على صحة العبارة : كان لئلسبلم بعد انتشاره في لارة إفريميا ا\nس :4 ما النتائج التي ترتبت على : إتمام الجيوش اإلسبلمية فتح ببلد المؽرب ؟"],[134,"س :1 أكمل العبارات اآلتية بكلمات مناسبة :\n(ٔ) اتخذ عرب شبه الجزيرة لبل ظهور اإلسبلم .......... و ............. معابر للتجارة مع شرق لارة إفريميا .\n(ٕ) تعددت أساليب انتشار اإلسبلم فى إفريميا ومنها .\n(ٕ) من المدن اإلفريمية التي تحولت من ميناء تجارى
