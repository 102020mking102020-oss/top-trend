<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الخديوي – دراسات تالتة إعدادي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120608;--bg2:#1d0b0f;--ink:#fbf1dc;--mut:#d8b98a;--c:#2ee6c5;--card:#2b1218;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="dark"]){}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;line-height:1.7;overflow-x:hidden}
h1,h2,.k{font-family:'Reem Kufi',Tajawal,sans-serif}
.sea{position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 80% -10%,#7a142055,transparent),radial-gradient(700px 500px at 0% 100%,#d4a24c22,transparent),var(--bg)}
header{text-align:center;padding:28px 16px 8px}
.globe{width:190px;height:190px;margin:0 auto}
.globe .m{transform-origin:100px 100px;animation:sp 14s linear infinite}
.globe .o{transform-origin:100px 100px;animation:sp 6s linear infinite reverse}
@keyframes sp{to{transform:rotate(360deg)}}
h1{font-size:clamp(30px,8vw,54px);margin:6px 0;line-height:1.2;background:linear-gradient(90deg,#b8862f,#f7e3a1,#d4a24c);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{color:var(--mut);max-width:520px;margin:0 auto}
.score{display:flex;justify-content:center;gap:10px;margin:16px 0;flex-wrap:wrap}
.pill{background:#ffffff12;border:1px solid #ffffff22;border-radius:99px;padding:5px 16px;font-weight:700}
nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;max-width:900px;margin:12px auto;padding:0 14px}
nav button{all:unset;cursor:pointer;background:var(--card);border:2px solid transparent;border-radius:22px 22px 22px 6px;padding:14px;text-align:center;transition:.25s;position:relative}
nav button:focus-visible,.tabs button:focus-visible,.opt:focus-visible,.card:focus-visible{outline:3px solid #e8b64c}
nav button b{display:block;font-size:34px}nav button span{font-size:14px;font-weight:700}
nav button.on{border-color:var(--c);background:linear-gradient(160deg,var(--c)33,var(--card));transform:translateY(-4px)}
nav button i{position:absolute;top:8px;left:10px;font-style:normal;font-size:18px}
main{max-width:900px;margin:0 auto;padding:10px 14px 60px}
h2{font-size:26px;margin:12px 0 4px;color:var(--c)}
.tabs{display:flex;gap:8px;margin:12px 0 18px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0}
.tabs button{all:unset;flex:1;text-align:center;cursor:pointer;padding:10px 4px;border-radius:14px;background:#ffffff10;font-weight:700}
.tabs button.on{background:var(--c);color:#2a1400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{all:unset;cursor:pointer;perspective:900px;height:170px;display:block}
.card div{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.card.f div{transform:rotateY(180deg)}
.card p{position:absolute;inset:0;margin:0;padding:16px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:20px;backface-visibility:hidden;font-size:17px}
.card .a{background:linear-gradient(145deg,var(--c),#5a1520);color:#2a1400;font-weight:900;font-size:20px}
.card .b{background:#fff3d6;color:#3a1a08;transform:rotateY(180deg);font-weight:700}
.tl{position:relative;padding-right:30px}
.tl:before{content:"";position:absolute;right:11px;top:6px;bottom:6px;width:4px;border-radius:4px;background:linear-gradient(var(--c),#e8b64c,#b4232e)}
.ev{position:relative;background:var(--card);border-radius:16px;padding:12px 16px;margin-bottom:12px}
.ev:before{content:"";position:absolute;right:-27px;top:16px;width:16px;height:16px;border-radius:50%;background:var(--c);border:4px solid var(--bg)}
.ev b{color:#e8b64c;font-size:18px;display:block}
.q{background:var(--card);border-radius:24px;padding:20px}
.bar{height:8px;background:#ffffff18;border-radius:9px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--c);transition:width .4s}
.q h3{margin:0 0 14px;font-size:20px;line-height:1.6}
.opt{all:unset;display:block;cursor:pointer;width:100%;box-sizing:border-box;background:#ffffff12;border:2px solid transparent;padding:11px 14px;border-radius:14px;margin-bottom:9px;font-weight:700}
.opt:hover{background:#ffffff22}.opt.ok{background:#2f8f5b;border-color:#8af3c5}.opt.no{background:#a82a2a;animation:sh .35s}
@keyframes sh{25%{transform:translateX(7px)}75%{transform:translateX(-7px)}}
.exp{background:#e8b64c22;border-right:4px solid #e8b64c;border-radius:10px;padding:10px 14px;margin:10px 0}
.go{all:unset;cursor:pointer;background:#e8b64c;color:#3a2600;font-weight:900;padding:10px 26px;border-radius:99px;display:inline-block}
.res{text-align:center}.ring{width:150px;height:150px;margin:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}.chips button{all:unset;cursor:pointer;white-space:nowrap;padding:8px 16px;border-radius:99px;border:2px solid #ffffff30;font-weight:700}.chips button.on{background:var(--c);color:#2a1400;border-color:var(--c)}
.ln{font-size:20px;font-weight:900;margin:6px 0}.wy{background:#fff3d6;color:#3a1a08;border-radius:16px;padding:12px 16px;margin-top:8px}.wy summary{cursor:pointer;font-weight:900}.wy p{margin:8px 0 0;font-weight:700;color:#7a1420}
.ev:nth-child(even){margin-right:14px}
.fab{all:unset;cursor:pointer;position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:linear-gradient(135deg,#e8b64c,#b4232e);color:#2b1600;font-weight:900;padding:12px 20px;border-radius:99px;box-shadow:0 8px 24px #0008}
.fab[hidden],.pn[hidden]{display:none}
.pn{position:fixed;left:0;right:0;bottom:0;height:78%;max-height:640px;max-width:720px;margin:auto;z-index:30;background:#1b0b0e;border:1px solid #ffffff30;border-radius:26px 26px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.pn header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #ffffff20;text-align:start}.pn header b{font-size:18px}.pn header button{all:unset;cursor:pointer;font-size:22px;padding:0 6px}
#log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
#log div{max-width:88%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;line-height:1.7}
#log .me{align-self:flex-start;background:var(--c);color:#2a1400;font-weight:700;border-bottom-right-radius:4px}#log .bot{align-self:flex-end;background:#ffffff16;border-bottom-left-radius:4px}
.qk{display:flex;gap:6px;overflow-x:auto;padding:6px 12px}.qk button{all:unset;cursor:pointer;white-space:nowrap;border:1px solid #ffffff40;border-radius:99px;padding:6px 12px;font-size:14px;font-weight:700}
.in{display:flex;gap:8px;padding:8px 12px}.in input{flex:1;font:inherit;font-size:16px;background:#ffffff14;color:var(--ink);border:1px solid #ffffff30;border-radius:14px;padding:10px 12px;min-width:0}.in button{all:unset;cursor:pointer;background:#e8b64c;color:#3a2600;font-weight:900;border-radius:14px;padding:10px 16px}
.logo{width:170px;height:170px;border-radius:50%;border:3px solid #e8b64c;box-shadow:0 0 40px #e8b64c55;display:block;margin:0 auto}
.gr{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}.gr button{all:unset;cursor:pointer;padding:8px 16px;border-radius:99px;border:2px solid #e8b64c88;font-weight:900}.gr button.on{background:linear-gradient(135deg,#f7e3a1,#d4a24c);color:#2a1400}
.ct{max-width:560px;margin:8px auto 0;background:#b4232e33;border:1px solid #e8b64c66;border-radius:14px;padding:8px 14px;font-weight:700;font-size:14px}.ct a{color:#f7e3a1;margin:0 6px}
</style>
</head>

{n:"موقع ومظاهر سطح قارات العالم الجديد",p:[["أمريكا الشمالية","ثالث القارات مساحة؛ يحدها شمالًا المحيط المتجمد الشمالي، وشرقًا الأطلنطي، وغربًا الهادي، وجنوبًا البحر الكاريبي وأمريكا الجنوبية."],["أمريكا الجنوبية","رابع القارات مساحة، بين 12° شمالًا و56° جنوبًا، ويمر بها خط الاستواء ومدار الجدي."],["أستراليا وأنتاركتيكا","أستراليا أصغر القارات ويسودها المظهر الهضبي. أنتاركتيكا لا تُدرس لأنها متجمدة وغير مأهولة."],["مظاهر السطح","جبال الأنديز في غرب أمريكا الجنوبية، وجرينلاند أكبر جزر أمريكا الشمالية."]],w:["بم تفسر ضيق السهول الساحلية غرب أمريكا الجنوبية؟","لأن جبال الأنديز تمتد قريبة جدًا من ساحل المحيط الهادي."],q:[["أي القارات يمر بها خط الاستواء؟",["أمريكا الشمالية","أمريكا الجنوبية","أستراليا","أنتاركتيكا"],1,"يمر خط الاستواء بشمال أمريكا الجنوبية."],["تقع جبال الأنديز في شرق أمريكا الشمالية.",["صواب","خطأ"],1,"خطأ؛ تقع في غرب أمريكا الجنوبية."]]},
{n:"الحضارات القديمة في الأمريكتين",p:[["المايا","في المكسيك وأمريكا الوسطى. اهتموا بعلم الفلك والتقويم لارتباطهما بالزراعة، وعرفوا الكتابة التصويرية."],["الأزتك","أقاموا عاصمتهم تينوختيتلان في المكسيك وأبدعوا في الزراعة والعمارة."],["الإنكا","في جبال الأنديز بالبيرو. تقدموا في الهندسة والرياضيات وأقاموا الطرق والمدرجات الزراعية."],["الكيبو","حبال معقودة استخدمها الإنكا في الحساب وتسجيل المعلومات."]],w:["بم تفسر اهتمام المايا بعلم الفلك؟","لمعرفة مواسم المطر والزراعة وضبط التقويم."],q:[["أي حضارة اهتمت بعلم الفلك والتقويم؟",["الإنكا","المايا","الفراعنة","الرومان"],1,"حضارة المايا."],["تقدمت حضارة الإنكا في الهندسة والرياضيات.",["صواب","خطأ"],0,"صواب."]]},
{n:"الكشوف الجغرافية لقارات العالم الجديد",p:[["الدوافع","البحث عن طرق بحرية جديدة للتجارة مع الهند وآسيا في القرن الخامس عشر."],["العلم","البوصلة والأسطرلاب وتطور الخرائط وبناء السفن ساعدت على نجاح الكشوف."],["الرواد","كولومبوس 1492 بدعم إسبانيا، وماجلان أثبتت رحلته كروية الأرض."],["النتائج","هجرات أوروبية واسعة، واستغلال الثروات، وانخفاض أعداد السكان الأصليين."]],w:["بم تفسر رغبة أوروبا في طرق بحرية جديدة؟","لتجارة التوابل والحرير مع آسيا بعيدًا عن الطرق التقليدية."],q:[["اكتشف كولومبوس أستراليا.",["صواب","خطأ"],1,"خطأ؛ وصل إلى العالم الجديد (الأمريكتين) وظنه آسيا."],["أي أداة ساعدت الملاحين على تحديد الاتجاه؟",["البوصلة","المحراث","القلم","الشراع"],0,"البوصلة."]]}]},
{n:"الوحدة الثانية: مصر في عصر محمد علي وخلفائه",ic:"🏛️",c:"#e8b64c",L:[
{n:"تولية محمد علي حكم مصر",p:[["الفراغ السياسي","بعد خروج الفرنسيين ثم الإنجليز (صلح أميان 1802) تصارع المماليك والعثمانيون والألبان."],["ثورة 1804","ثار المصريون على ظلم البرديسي وضرائبه."],["1805م","اختار الشعب بقيادة عمر مكرم محمد علي واليًا على مصر."],["حملة فريزر 1807","حاولت احتلال الإسكندرية ورشيد ضده، لكنها فشلت."]],w:["بم تفسر ثورة المصريين ضد البرديسي؟","بسبب الظلم وفرض الضرائب الباهظة."],q:[["من قاد الشعب لاختيار محمد علي واليًا؟",["عمر مكرم","أحمد عرابي","الجبرتي","البرديسي"],0,"عمر مكرم."],["أُرسلت حملة فريزر لتثبيت حكم محمد علي.",["صواب","خطأ"],1,"خطأ؛ أُرسلت ضده وفشلت."]]},
{n:"محمد علي وبناء الدولة الحديثة",p:[["القلعة 1811","تخلص من المماليك في مذبحة القلعة."],["الجيش","التجنيد الإجباري والمدارس الحربية والأسطول."],["الزراعة","الترع والجسور، وأدخل القطن طويل التيلة."],["التعليم والثقافة","البعثات إلى فرنسا ومطبعة بولاق ومدارس جديدة."],["معاهدة لندن 1840","قلّصت جيشه وحدّت من طموحاته."]],w:["دلل: مشروعات محمد علي خدمت القوة العسكرية.","المصانع لإنتاج السلاح والزي، والمدارس لتخريج ضباط وأطباء للجيش."],q:[["أنشأ محمد علي المطبعة الأميرية في:",["الزمالك","القلعة","بولاق","العتبة"],2,"حي بولاق."],["أدخل محمد علي القطن طويل التيلة.",["صواب","خطأ"],0,"صواب."]]},
{n:"مصر في عصر خلفاء محمد علي",p:[["عباس الأول","أغلق معظم المدارس والمصانع وأهمل الجيش."],["سعيد باشا","امتياز قناة السويس 1854، واللائحة السعيدية 1858 (توريث الأرض)."],["إسماعيل","افتتح القناة 1869 وأنشأ مجلس شورى النواب، لكن الديون تفاقمت."],["صندوق الدين 1876","زاد التدخل الأجنبي، وعُزل إسماعيل 1879."]],w:["بم تفسر تفاقم الديون في عهد إسماعيل؟","للإسراف في المشروعات والقروض الأجنبية بفوائد مرتفعة."],q:[["من أصدر اللائحة السعيدية؟",["سعيد","عباس الأول","إسماعيل","توفيق"],0,"سعيد باشا."],["افتُتحت قناة السويس عام:",["1805","1840","1869","1882"],2,"1869 في عهد إسماعيل."]]}]},

var KB=[[[1,"........................................................................................"],[2,"الوحدة األولى\nالمالمح الطبيعية لقارة إفريقيا وحضاراتها القديمة\nالدرس األول\nقارة إفريقيا (الموقع والكشوف الجغرافية)\nالدرس الثاني\nمظاهر السطح لقارة إفريقيا\nالدرس الثالث\nنهر النيل والحضارات القديمة في إفريقيا\nتدريبات عامة على الوحدة\nالوحدة الثانية\nالحضارة المصرية وعالقتها بحضارات إفريقيا\nالدرس األول\nعصر الدولة القديمة (عصر بناة األهرامات)\nالدرس الثاني\nعصر الدولة الوسطى(عصر الرخاء االقتصادي)\nالدرس الثالث\nعصر الدولة الحديثة (عصر المجد الحربي)\nتدريبات عامة على الوحدة\nالوحدة الثالثة\nالنظم البيئية في إفريقيا\nالدرس األول\nنظم الغابات في إفريقيا\nالدرس الثاني\nنظم الحشائش في إفريقيا\nالدرس الثالث\nالنظم البيئية المائية في إفريقيا\nتدريبات عامة على الوحدة\nالوحدة الرابعة\nعالقة مصر بإفريقيا خالل العصور الوسطى\nالدرس األول\nانتشار اإلسالم في إفريقيا\nالدرس الثاني\nدور مصر الحضاري في إفريقيا\nتدريبات عامة على الوحدة"],[4,"الوحدة األولى\nالمالمح الطبيغية لقارة إفريقيا وحضارتها القديمة"],[5," تمهيد :\n* درست في السنوات السابقة أن العالم يتكون من سبع قارات :\n(آسيا – إفريقيا – أوروبا )\n(أمريكا الشمالية - أمريكا الجنوبية - أستراليا -\nالقارة القطبية الجنوبية «أنتاركتيكا »)\n أى أن قارتنا إفريقيا هي إحدى قارات العالم القديم ووطننا الحبيب مصر جزءاً منها .\nمساحة قارة إفريقيا :\n تُعد إفريميا ثاني أكبر لارات العالم من حيث المساحة بعد لارة آسيا .\n تبلػ مساحة إفريميا حوالى ٗ ٖٓ, مليون كمٕ وهي بذلن تمثل ٕٓ ٪\n(  أي خمس ) مساحة يابس الكرة األرضية .\nقبل أن نتعرف على موقع قارة إفريقيا يجب أن نتذكر :\nولكى تعرف الموقع الفلكى والجغرافي لقارة إفريقيا وتستنتج أهمية كل منهما\nعليك أن تتأمل جيديا الخريطتين التاليتين ...."],[7,"-1 الموقع الفلكي :\nتمتد قارة إفريقيا بين :\n دائرتى عرض ٖ۷ ٖٓ : شماال ا ٖٗ ٖٓ ، جنوباا (أى تمتد في أكثر من ٓ ۷ دابرة عرضية ) .\nيمر بقارة إفريقيا :\n خط الطول الربيسى جرينتش (في الؽرب) .\n ثبلث دوابر عرض ربيسية هي :\nٔ) مدار السرطان (في النصف الشمالي من لارة إفريميا) .\nٕ) دائرة االستواء (في الوسط تمريبا ا ) .\nٖ) مدار الجدى (في النصف الجنوب من لارة إفريميا) .\nوبذلك : تمتد إفريقيا بين نصفى الكرة األرضية الشمالي والجنوبي \"دلل\"؟\nحيث يمع نحو ثلثي مساحتها في النصف الشمالي ، والثلث اآلخر في النصف الجنوبي .\n-2 الموقع الجغرافي :\nتقع إفريقيا في وسط قارات العالم وتطل على مسطحات مائية مهمة\"دلل\"؟\nحيث يحدها :\nشماالي : البحر المتوسط (الذي يفصلها عن لارة أوروبا) .\nشرقاً : البحر األحمر والمحيط الهندى (اللذان يفصبلنها عن لارة آسيا) .\nغرباً : المحيط األطلنطى (الذي يفصلها عن لارتي أمريكا الشمالية وأمريكا الجنوبية) .\n-3 تقترب قارة إفريقيا من :\n قارة أوروبا ( : في الشمال) عند مضيك جبل طارق .\n قارة آسيا ( : في الشرق) عند مضيك باب المندب وتتصل بها بريا ا عن طريك شبه جزيرة سيناء\nالتي تُعد جزء غالى من وطننا الحبيب مصر الذي يمع في الركن الشمالي الشرلي من لارة إفريميا ."],[8,"لشبه جزيرة سيناء أهمية حضارية واستراتيجية كبيرة عبر العصور بم تفسر ؟\n حضارية : بسبب انتمال بعض الثمافات والحضارات عن طريمها من\nآسيا إلى إفريميا مثل الحضارة اإلسبلمية .\n استراتيجية : بسبب تعرض مصر للعديد من الحمبلت العسكرية\nمن خبلل شبه جزيرة سيناء .\nولذلك فإن الحفاظ على أمن شبه جزيرة سيناء ضرورة بم تفسر ؟\nللحفاظ على األمن القومى المصرى واإلفريقي .\nما المقصود بـ : الحضارة ؟\nمجموع اإلنتاج الثقافي مثل العادات و التقاليد والعلوم والفنون والقيم\nواإلنتاج المادي مثل القالع والمبانى والقصور ، وهو ما يميز مجتمعنا عن غيره .\nثاني ًا : أهميُ مىقع قارَ إفزيكيا\n دلل : تتمتع إفريقيا بموقع متميز له أهمية كبيرة ؟\nحيث تتمتع بأهمية استراتيجية وأهمية حضارية وأهمية اقتصادية .\n-1 األهمية االستراتيجية :\n(وهي األهمية وقت السلم والحروب واألزمات )\n بم تفسر : لموقع قارة إفريقيا أهمية استراتيجية ؟\nألنها : تشرف بحكم مولعها الجؽرافي على ممرات مابية مهمة\nمثل : مضيك جبل طارق ، ومضيك باب المندب ، ولناة السويس .\n-2 األهمية االقتصادية :\n بم تفسر : لموقع قارة إفريقيا أهمية اقتصادية ؟ بسبب :\n الموقع الجغرافى ما النتائج؟ أدى إلى تحكمها في أهم طرق المبلحة العالمية .\n الموقع الفلكي ما النتائج؟ أدى إلى تنوع مناخها وبالتالى تنوع النباتات الطبيعية والحيوانات\nوالمحاصيل الزراعية ."],[9,"-3 األهمية الحضارية :\n بم تفسر : لموقع قارة إفريقيا أهمية حضارية ؟ بسبب :\nنشؤة العديد من ألدم الحضارات فى العالم على أرضها ، مثل :\nحضارة كوش\nالحضارة المصرية\nحضارة أكسوم في\nفي السودان\nحضارة قرطاج\nإريتريا وإثيوبيا\nالقديمة في مصر\nفي تونس\nالتدريب األول\nس :1 اكتب كلمة (صواب ) ، وكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٔ) المسطحان المابيان اللذان يحدان أفريميا من الشرق هما المحيط األطلنطي والبحر األحمر .\n(ٕ) يمر مدار السرطان فى النصف الشمالي من لارة إفريميا .\n(ٖ) يفصل البحر األحمر بين لارة إفريميا ولارة أوروبا .\n(ٗ) يمرخط جرينتش غرب لارة إفريميا .\n(ه) يمع ثلثى مساحة لارة إفريميا في نصف الكرة األرضية الشمالي .\n( )ٙ انتملت الحضارة اإلسبلمية إلى لارة إفريميا عبر شبه جزيرة سيناء .\nس :2 أكمل العبارات اآلتية بما يناسبها :\n)1 تشرف لارة إفريميا على ممرات مابية هامة كمضيك جبل طارق و . ............\n)2 من ألدم الحضارات التي نشؤت على أرض لارة إفريميا حضارة كوش في . ...............\nٖ) نشؤت حضارة .................... . في إريتريا وإثيوبيا .\nس :3 بم تفسر : تحكم إفريميا فى أهم طرق المبلحة العالمية ؟\n...........................................................................................................................\n. ....................................................................................................... ................."],[10,"ثالجاً :\nالكشىف اجلغزافيُ لكارَ إفزيكيا\nبالرغم من أن قارة إفريقيا إحدى قارات العالم القديم إال أن كثيريا من أجزائها قد تأخر\nاستكشافها ، وفيما يلي نتعرف بعض من الكشوف الجغرافية لقارة إفريقيا .\n-1 دور مصر في اكتشاف قارة إفريقيا :\n كان لمصر دوريا مهميا فى اكتشاف قارة إفريقيا منذ القدم \"دلل\"؟\nففي عصر المصريين القدماء :\n-1 الرحالة \"حر – خوف\" :\nلام بؤربع رحبلت نحو الجنوب وكان من أوابل المصريين الذين اكتشفوا\nأجزاء من لارة إفريميا .\n-2 الملك نخاو الثانى :\nأرسل بعثة للدوران حول إفريميا ، بدأت من البحر األحمر وعادت عبر\nمضيك جبل طارق واستمرت الرحلة ثبلث سنوات .\nوقد ... وصل المصريون القدماء إلى السودان وبعض دول شرق إفريقيا (جيبوتي والصومال\nوإريتريا وإثيوبيا)وامتد التأثير الحضارى المصرى إلى غرب إفريقيا وأعالى منابع النيل\nاالستوائية .\nفي العصر الحديث : خالل حكم كل من :\n-1 محمد على باشا :\n دلل : كان لمحمد علي دوراً في اكتشاف منابع نهرالنيل؟\nحيث تم إرسال رحبلت الكتشاف منابع النيل عام ٔ٨ٖ۹ م \"ما النتائج\"؟ تربت على ذلك :\n- اكتشاف النيل األبيض .\n- رسم خريطة للنيل حتى جنوب السودان .\n-2 الخديو إسماعيل ( حفيد محمد على باشا) :\n دلل : سار الخديوي إسماعيل على خطى جده محمد علي في اكتشاف إفريقيا؟\nحيث : اهتم باكتشاف منابع النيل ووصل حكمه إلى جنوب دابرة االستواء ."],[11,"-2 دور العرب في اكتشاف قارة إفريقيا ( في العصور الوسطى)\nالجغرافيين والرحالة العرب :\nأسهموا من خالل رحالتهم فى الكشف عن أجزاء عديدة من إفريقيا ومنهم :\n-1 ابن بطوطة :\nلام برحبلت مهمة في شمال وغرب إفريميا ، واستطاع أن يخترق الصحراء الكبرى\nمن الشمال إلى الجنوب حتى وصل إلى مالى .\n-2 المسعودى : كان من أوابل الرحالة العرب الذين زاروا إفريميا وكتبوا عنها .\nالتجار العرب :\n دلل : كان للتجار العرب دوراً في اكتشاف القارة اإلفريقية؟\nحيث :\nوصلت لوافلهم إلى السودان وببلد الحبشة وجزر الممر وغيرها وساهموا في نشر اإلسبلم فتكونت :\n*العديد من الممالك اإلسالمية على السواحل الشرقية للقارة وامتدت إلى هضبة البحيرات\nاالستوائية ، كما تكونت بعض الممالك اإلسالمية في غرب إفريقيا .\n-3 دور األوروبيين في اكتشاف قارة إفريقيا :\nخالل القرن الـ 15 م :\n بدأ البرتؽاليون محاوالتهم الكتشاف إفريميا خبلل عهد األمير هنري المالح .\n دلل : استفاد األوروبيين من كتابات العرب الكتشاف قارة إفريقيا ؟ حيث\nاستفادوا مما كتبه العرب عن إفريميا فى رحبلتهم االستكشافية ونجحوا في اكتشاف طريك رأس الرجاء\nالصالح وحاولوا الوصول إلى الهند عن طريك الدوران حول إفريميا .\n ما النتائج : محاوالت البرتغاليين الكتشاف إفريقيا أواخر القرن الـ 15 ؟ أدى إلى :\nٔ) الوصول إلى الهند عن طريك الدوران حول إفريميا .\n)2 أسس البرتؽاليون الموانا والمراكز التجارية على طول طريك رأس الرجاء الصالح بم تفسر؟\nلتأمين المالحة والتجارة ."],[12,"في نهاية القرن الـ ۱۸ م وخالل القرن الـ 19 م :\n كان لؤلوروبيين دور بارز فى اكتشاف منابع نهر النيل .\n توالت الكشوف لمارة إفريميا من اإلنجليز والفرنسيين والهولنديين وغيرهم بم تفسر؟ من أجل\nالبحث عن موارد إفريقيا وثرواتها الطبيعية واستغاللها .\n ما النتائج : تصارعت الدول األوروبية االستعمارية على قارة إفريقيا لنهب خيراتها ؟\nوقد ترتب على ذلك :\nٔ) إلامة مستعمرات لها في كافة أنحاء المارة .\nٕ) تمسيم إفريميا لعدد كبير من الدول لضمان استمرار نفوذها واستؽبلل ثرواتها .\nأكد فهمك :\n بم تفسر : اهتمام أوروبا بالكشوف الجغرافية لقارة إفريقيا ؟ بهدف :\nٔ) الوصول إلى الهند عن طريك الدوران حول إفريميا .\nٕ) نهب خيرات إفريميا واستؽبلل ثرواتها .\n بم تفسر : تنقسم قارة إفريقيا إلى عدد كبير من الدول مختلفة المساحة ؟ بسبب :\nتصارع الدول االستعمارية عليها لنهب خيراتها واستؽبلل ثرواتها .\n ما النتائج : قيام الدول االستعمارية بتقسيم إفريقيا ونهب خيراتها ؟ مما أدى إلى :\nجعل إفريميا تعانى من الفمر رغم امتبلكها ثروات طبيعية متعددة .\nرابعيا : اخلزيطُ السياسيُ لكارَ إفزيكيا\nنستنتج من خريطة إفريقيا السياسية ما يلي - :\n تضم لارة إفريميا ٗ٘ دولة مختلفة المساحة .\n تعد الجزابر أكبر دول المارة اإلفريمية من حيث المساحة .\n تمع مصر في الركن الشمالي الشرلي من لارة إفريميا وتُعد من أكبر دول المارة مساحة .\nموريتانيا - جيبوتی - الصومال - جزر الممر) ."],[13,"تتنوع دول قارة إفريقيا إلى :\n-1 دول ساحلية :\nتطل على بحار ومحيطات مثل\nمصر والمغرب وموزمبيق و ليبيا\nو الجزائر وموريتانيا والصومال .\n(كل الدول العربية ساحلية)\n-2 دول حبيسة :\nال تطل على مسطحات مائية\n(البحار أو المحيطات) مثل\nتشاد والنيجر ومالي وإثيوبيا و\nجنوب السودان وزامبيا .\nالعالقات المصرية اإلفريقية :\nتعد مصر من أهم وأكبر دول المارة والتي تبذل جهوداا مكثفة لتعميك العبللات المصرية اإلفريمية ، بما يُسهم\nفي تحميك التنمية المستدامة .\n تم انتخاب مصر لرئاسة االتحاد اإلفريقي عام 2019 م ما النتائج ؟\nأدى ذلن إلى وجود فرصة لوية لتعميك دور مصر الريادى فى لارة إفريميا وتدعيم عبللاتها مع دول\nوشعوب المارة اإلفريمية .\nالتدريب الثاني\nس :1 صوب ما تحته خط :\nٔ) بدأت الرحلة التى أرسلها الملن نخاو الثانى للدوران حول إفريميا من المحيط األطلنطى .\nٕ) استطاع المسعودى أن يخترق الصحراء الكبرى من الشمال إلى الجنوب حتى وصل إلى مالي\nٖ) وصل النفوذ المصرى فى عهد دمحم على باشا إلى جنوب دابرة االستواء\nٗ) كان هنرى المبلح أول األمراء اإلنجليز المهتمون باكتشاف لارة إفريميا في المرن الـ ٘ٔم .\nس :2 ما العالقة بين ... ؟\nٔ) دمحم على ، ومنابع نهر النيل .\nٕ) الموارد الطبيعية لمارة إفريميا ، وأطماع الدول األوروبية االستعمارية ."],[14,"س :2 أكمل العبارات اآلتية بما يناسبها :\n(ٔ) يمع حوالى ثلثى مساحة لارة إفريميا في نصف الكرة األرضية . ...................\n(ٕ) نشؤت فى السودان حضارة . ...................\n(ٖ) اهتم الخديو إسماعيل باشا باكتشاف منابع النيل ووصل حكمه إلى جنوب . ...................\n(ٗ) نشؤت الممالن اإلسبلمية على السواحل الشرلية للمارة اإلفريمية وامتدت إلى هضبة . ..................."],[15,"س :3 اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) تمع لارة إفريميا إلى الجنوب من . ...............\n( البحر األحمر - المحيط الهندى - البحر المتوسط - المحيط األطلنطي )\n(ٕ) يحد المحيط األطلنطى لارة إفريميا من جهة . ...............\n( الشمال - الجنوب - الشرق - الؽرب )\n(ٖ) المسطح المابى الذى يفصل بين لارتى إفريميا وأوروبا هو . .................\n( البحر األحمر - البحر المتوسط - المحيط األطلنطي - المحيط الهندي )\n(ٗ) يصل مضيك جبل طارق بين البحر المتوسط و . ...................\n( المحيط األطلنطى - خليج عدن - المحيط الهادي - البحر األحمر )\n(ه) يصل مضيك باب المندب بين البحر األحمرو . ...................\n( المحيط األطلنطى - البحر المتوسط - خليج عدن - المحيط الهادي )\n( مضيك جبل طارق - مضيك باب المندب - رأس الرجاء الصالح - مضيك موزمبيك )\n( )۷ دخلت الحضارة اإلسبلمية إلى لارة إفريميا عبر . ................... .\n( مضيك جبل طارق - خليج غينيا - شبه جزيرة سيناء - مضيك موزمبيك )\n( السودان - تونس - مصر - إثيوبيا )\n( )٨ نشؤت حضارة لرطاج . ............\n( )۹ بدأت بعثة الملن نخاو الثانى للدوران حول إفريميا من البحر األحمر وعادت إلى مصر عبر . ...........\n( مضيك جبل طارق - مضيك باب المندب - لناة السويس - مضيك موزمبيك )\n(ٓٔ) في عهد دمحم على تم رسم خريطة للنيل حتى جنوب . ................\n( السودان - الصومال - النيجر - إثيوبيا )\n( مالي - نيجيريا - جزر الممر - إنجوال )\n(ٕٔ) من الدول العربية اإلفريمية دولة . ..................\n( جيبوتی – نيجيريا – موزمبيك – تشاد )\nس :4 اكتب كلمة (صواب ) ، أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٔ) تُعد لارة إفريميا أولى لارات العالم من حيث المساحة .\n(ٕ) تمثل لارة إفريميا ٕٓ ٪ من مساحة اليابس في العالم .\n(ٖ) تمر دابرة االستواء فى المسم الجنوبي من لارة إفريميا .\n(ٗ) يمرخط جرينتش بؤكبر الدول العربية اإلفريمية من حيث المساحة .\n(ه) تمع ثلث مساحة لارة إفريميا فى نصف الكرة األرضية الجنوبي .\n( )ٙ تمع لارة إفريميا وسط لارات العالم وتطل على مسطحات مابية مهمة ."],[16,"( ي )۷ فصل كل من البحر المتوسط والمحيط الهندى لارة إفريميا عن لارة آسيا .\n( ي )٨ فصل المحيط الهادى لارة إفريميا عن األمريكتين .\n( )۹ تمع مصر فى الركن الشمالي الؽربي من لارة إفريميا .\n(ٓٔ) تم الدوران حول إفريميا ألول مرة خبلل عصر المصريين المدماء .\n(ٕٔ) امتد التؤثير الحضارى المصرى إلى غرب إفريميا وأعالى منابع النيل االستوابية .\n(ٖٔ) المسعودى من أوابل الرحالة العرب الذين زاروا لارة إفريميا .\n(ٗٔ) وصلت الموافل العربية في العصور الوسطى إلى السودان وببلد الحبشة وجزر الممر (.\nس :5 لمن تنسب األعمال اآلتية ... ؟\n(ٔ) أحد الرحالة في عصر المصريين المدماء لام بؤربع رحبلت نحو الجنوب في إفريميا .\n(ٕ) حاكم مصر الذي وصلت الرحبلت االستكشافية إلفريميا فى عهده إلى اكتشاف النيل األبيض .\n(ٖ) وصلت في عهده الدولة المصرية أللصى اتساع لها من جهة الجنوب خبلل العصر الحديث .\nس :6 بم تفسر ... ؟\nٔ) مثلت شبه جزيرة سيناء أهمية استراتيجية لمصر .\nٕ) األهمية االستراتيجية المولع لارة إفريميا .\nٖ) األهمية االلتصادية المولع لارة إفريميا .\nٗ) تؤسيس البرتؽاليين الموانا والمراكز التجارية على السواحل اإلفريمية .\n٘) تمسيم الدول االستعمارية لارة إفريميا إلى عدد كبير من الدول .\nس :7 ما النتائج التي ترتبت على ... ؟\nٖ) االستعمار األوروبي لمارة إفريميا .\nس :8 دلل جغرافييا على صحة كل عبارة من العبارات اآلتية :\nٔ) لشبه جزيرة سيناء أهمية حضارية إلفريميا .\nٕ) لم يكن للبرتؽاليين السبك فى الدوران حول إفريميا .\nٖ) األهمية الحضارية المولع لارة إفريميا .\nٗ) كانت الدوافع االلتصادية المحرن األول الذي دفع البرتؽاليون الكتشاف إفريميا .\nس :9 ما المقصود بـ : الحضارة ؟"],[17,"امتحان على الدرس األول\nس ( :1 أ) أمامك خريطة لقارة إفريقيا\nاكتب مدلول األرقام الموقعة عليها :\n(ٔ) دولة عربية تطل على مسطحين مابيين . .............\n(ٕ) دابرة عرض ربيسية .. .............\n(ٖ) مضيك يصل بين البحر األحمر وخليج عدن . ............. .\n(ٗ) مسطح مابى يفصل لارة إفريميا عن أوروبا . .............\n(ه) ممرمانی مهم . .............\n( )ٙ مــدار . .............\n( )۷ مضيك . .............\n(ب) اختر اإلجابة الصحيحة مما بين القوسين :\n( السودان - إثيوبيا - تونس - مصر )\n(ٔ) نشؤت حضارة كوش فى . ............. .\n(ٕ) أي من الدول اإلفريمية التالية يمربها مدار الجدى ؟ . ............. .\n( موريتانيا - ليبيا - مدغشمر - الصومال )\n(ٖ) يحد لارة إفريميا من جهة الؽرب . ............. .\n( المحيط الهندى - المحيط األطلنطى - البحر األحمر - البحر المتوسط )\n(ٗ) تعرضت شعوب المارة اإلفريمية لبلستعمار من لبل دول لارة . .............\n( آسيا - أستراليا - أمريكا الشمالية - أوروبا )\n(جـ) بم تفسر ... ؟\n(ٔ) معاناة لارة إفريميا من الفمر بالرغم من امتبلكها للعديد من الثروات الطبيعية .\n(ٕ) تنوع المناخ والنبات الطبيعي في إفريميا .\nس (:1 أ) اكتب ما تشير إليه كل عبارة مما يأتي :\n(ٔ) دابرة عرض ربيسية تمر فى وسط المارة اإلفريمية تمريبا .\n(ٕ) منطمة ذات أهمية استراتيجية تمثل حلمة اتصال بين أكبر لارتين فى العالم من حيث المساحة .\n(ٖ) مضيك يصل بين البحر المتوسط والمحيط األطلنطى .\n(ب) ما النتائج التي ترتبت على :\nالبعثات االستكشافية فى عهد دمحم على ، والخديو إسماعيل للمارة اإلفريمية ؟\n(ج) ما مقترحاتك لـ : تعميك دور مصر الريادي في لارة إفريميا ؟"],[19,"أوليا : اهلضاب\nيسود سطح قارة إفريقيا الهضاب الواسعة ، والتي تتمثل في :\n-1 هضبة شمال إفريقيا :\n موقعها : تمع في شمال المارة وتعد مصر جزءأ منها وتمتد من :\nجبال البحر األحمر شرلاا ا إلى ساحل المحيط األطلنطى غربا ا .\nساحل البحر المتوسط شماال ا إلى وسط إفريميا جنوباا .\n تتميز بـ :\n- االتساع الكبير .\n- للة االرتفاع .\nاالنحدار تدريجياا نحو الشمال حتى تلتمى بسواحل البحر المتوسط .  أهم مظاهر السطح فوق الهضبة :\nدلل : تتعدد مظاهر السطح فوق هضبة شمال إفريقيا ؟\nحيث يوجد بها -:\nٔ) الصحراء الكبرى (أكبر صحارى العالم) .\nٕ) جبال مثل : جبل العوينات على الحدود بين مصر وليبيا والسودان .\nٖ) منخفضات مثل : منخفض المطارة .\nٗ) العديد من الواحات مثل - : واحة سيوة بمصر - . واحة الجوف بليبيا .\n-2 هضبة الحبشة (الهضبة اإلثيوبية) :\n موقعها : تمع فى الجزء الشرلي من المارة .\n تتميز بـ :\nشدة ارتفاعها فهى أعلى هضاب المارة .\nخصوبة التربة بم تفسر ؟ بسبب الطفوح البركانية .\n ما النتائج : خصوبة التربة ؟ ترتب على ذلك :\n- ليام حرفة الزراعة .\n- نشؤة الحضارات المديمة في إثيوبيا .\n تعد المنبع الموسمى لنهر النيل بم تفسر ؟ بسبب األمطار التي تسمط عليها في فصل الصيف .\n ما العالقة بين : التكوينات البركانية والنشاط الزراعى في شرق إفريقيا؟\nحيث أدت التكوينات البركانية إلى زيادة خصوبة التربة بشرق النيل مما جعلها مناسبة للزراعة ."],[20,"- 3 هضبة البحيرات االستوائية :\n موقعها : تمع فى وسط المارة وتمر بها دابرة االستواء .\n تتميز بـ :\nاالنحدار من الجنوب إلى الشمال (مثل هضبة شمال إفريميا) .\nكثرة البحيرات العذبة بها مثل : بحيرة فيكتوريا .\nوجود الممم الجبلية البركانية بها .\n تعد المنبع الدائم لنهر النيل بم تفسر ؟ بسبب سموط األمطار طوال العام .\n-4 الهضبة الجنوبية :\n موقعها : تمع في جنوب المارة .\n تتميز بـ :\nاالنحدار بشدة نحو السواحل الشرلية للمارة .\nيوجد بالجزء الشرلى منها األخدود اإلفريمي العظيم .\nاألخدود اإلفريقى العظيم :\n نشأته : عبارة عن مجموعة انكسارات طولية تتجه بشكل عام من الجنوب إلى الشمال .\n أهم ظواهره (نتائج امتداده) يُ : عد البحر األحمر وخليجا عدن والعمبة أجزاء منه .\n موقعه ي : متد شرق المارة لمسافة ٓٓ ٘ٙ كم تمريبا .\nالتدريب األول\nس :1 اكتب اسم الهضبة التي تدل عليها كل عبارة مما يأتى :\n(ٔ) تنحدر تدريجياا نحو الشمال حتى تلتمى بسواحل البحر المتوسط .\n(ٕ) تُعد أعلى هضاب لارة إفريميا .\n(ٖ) تعد المنبع الدابم لنهر النيل .\nس :2 صوب ما تحته خط :\n(ٔ) توجد واحة الجوف في دولة تونس .\n(ٕ) تسمط األمطار على هضبة الحبشة طوال العام .\n(ٖ) يُعد البحر المتوسط جز اءا من األخدود اإلفريمي العظيم .\nس :3 ما النتائج المترتبة على : الطفوح البركانية في هضبة الحبشة ؟"],[21,"ثانياً : اجلابا\nتتنوع الجبال بقارة إفريقيا (حسب تكوينها ) كما يلي :\n-1 الجبال االلتوائية :\nهي جبال نشأت نتيجة حدوث حركات باطنية\nتعرضت لها طبقات القشرة األرضية ، مثل :\n*جبال الكاب : جنوب المارة .\n*جبال أطلس :\n موقعها : تمتد على طول الساحل الشمالي الؽربي\nللمارة من جنوب المؽرب حتى تونس أى تمتد\nفي ثبلث دول هي (: المغرب - الجزائر - تونس)\n تتكون من : سبلسل جبلية منها سلسلتين متوازيتين هما -:\n( تحصران بينهما هضبة الشطوط بالجزائر )\n-2 الجبال االنكسارية :\nهي جبال نشأت نتيجة حركات باطنية أدت إلى حدوث انكسار\nفي طبقات القشرة األرضية مثل :\nجبال البحر األحمر :\n موقعها :\nتمتد فى شرق المارة على طول ساحل البحر األحمر في ثبلث دول هي ( : مصر – السودان - إريتريا )\n تعد جزءيا من األخدود اإلفريقي العظيم ."],[22,"-3 الجبال البركانية :\nهي جبال نشأت نتيجة الثورانات البركانية مثل :\nٔ) جبل كينيا ( : وسط المارة أعلى دابرة االستواء) .\nٕ) جبال دراكنزبرج ( : جنوب المارة ) .\nٖ) جبل كلمنجارو ( : وسط المارة أسفل دابرة االستواء ) الذي يُعد أعلى قمة جبلية بإفريقيا\nما النتائج ؟ ترتب على ذلك : تكون الجليد فوق لمته رغم ولوعه بالمنطمة االستوابية الحارة .\nاألهمية االقتصادية لجبال قارة إفريقيا :\n(بم تفسر)\nتساهم المناطق الجبلية بإفريقيا فى دعم العديد من األنشطة االقتصادية ، مثل :\nالتعدين و الصناعة\nالسياحة\nألنها تتميز بــ :\nألنها غنية بـ :\nمناظر طبيعية خبلبة تجذب السياح الذين يمارسون\nالثروات المعدنية المتنوعة التي تدخل في صناعات\nالعديد من األنشطة السياحية بالمناطك الجبلية .\nعديدة ، مثل : الحديد والذهب والفضة والنحاس\nوالفوسفات .\nالتدريب الثاني\nس :1 اختر اإلجابة الصحيحة مما بين القوسين :\n(المؽرب - السودان - الجزابر - تونس )\nتمع هضبة الشطوط فى دولة . ..............\nأعلى لمة بسبلسل جبال أطلس ( . ....... جبل العوينات - جبل توبمال - جبل شايب البنات - جبل كينيا )\nتمتد جبال البحر األحمر فى مصر والسودان . ...........\n( الجزابر - كينيا - إريتريا - المؽرب )\nس :2 اكتب كلمة (صواب ) أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\nتمتد جبال أطلس على طول الساحل الشمالي الؽربي لمارة إفريميا .\nيوجد جبل شايب البنات في دولة السودان .\nتُعد جبال در اكنز برج من الجبال االنكسارية .\nس :3 بم تفسر : أهمية جبال لارة إفريميا بالنسبة للنشاط الصناعي ؟\nس :4 قارن بين : جبال أطلس – جبال البحر األحمر - جبل كلمنجارو من حيث : النشؤة ."],[23,"ثانياً : السهى\nتمتلك قارة إفريقيا سهوليا متنوعة ، ومنها :\n-1 السهول الفيضية :\nيجرى فى لارة إفريميا عدد من األنهار ، مثل :\nنهر النيل ، ونهر النيجر ، ونهر الكونؽو ما النتائج؟\nولد ساعدت تلن األنهار على تكوين السهول الفيضية ،\nمثل : سهول وادى النيل في مصر والسودان .\nوالتي تتميز بخصوبة تربتها بم تفسر ؟\nألنها تكونت من الطمى الذى نملته مياه نهر النيل من\nهضبة الحبشة البركانية .\n-2 السهول الساحلية :\nيختلف اتساع السهول الساحلية بإفريقيا من منطقه األخرى بم تفسر ؟\nبسبب التراب أو ابتعاد المرتفعات من السواحل .\nتتمثل السهول الساحلية بإفريقيا في :\n*سهول البحر المتوسط :\n موقعها : تمع في شمال لارة إفريميا .\n تتميز بـ :\n االتساع فى شمال مصر بم تفسر ؟ لعدم وجود جبال أو مرتفعات .\n الضيق في بالد المغرب العربي بم تفسر ؟ بسبب التراب جبال أطلس من الساحل .\n سقوط األمطار الشتوية ما النتائج ؟ مما أدى إلى وجود النباتات الطبيعية ، والمحاصيل\nالزراعية التي تعتمد في زراعتها على األمطار الشتوية ."],[24,"*سهول البحر األحمر :\n موقعها : تمع فى شرق لارة إفريميا فى مصر والسودان وإريتريا .\n تتميز بـ : سهول ضيمة بم تفسر؟ بسبب التراب جبال البحر األحمر من الساحل .\n أهميتها االقتصادية : غنية بالثروات المعدنية ومصادر الطالة .\n*سهول المحيط الهندي :\n موقعها : تمع في شرق لارة إفريميا .\n تتميز بـ : تختلف من حيث االتساع \"دلل\"؟ ، حيث في :\n دولة تنزانيا : تتميز السهول الساحلية باتساعها .\n دولة كينيا : تكون عبارة عن شريط ضيك ينحصر بين الساحل وهضبة البحيرات االستوابية .\n*سهول المحيط األطلنطى :\n موقعها : تمع في غرب لارة إفريميا .\n أهميتها االقتصادية : سهول واسعة غنية بحمولها الزراعية ولذلن ترتفع بها الكثافة السكانية .\nمما سبق نجد ان :\nالمارة اإلفريمية تطل على ( بحار ومحيطات واسعة) تحتوى على العديد من الثروات الطبيعية وتحرص الدول\nاإلفريمية على استثمارها بشكل مستدام بما يحمك أهداف االلتصاد األزرق .\nما المقصود به االقتصاد األزرق ؟ استثمار الموارد المائية (البحار والمحيطات) بشكل\nمستدام لتحقيق التنمية المستدامة والقضاء على الفقر وتحقيق االكتفاء الذاتي من\nالغذاء مع المحافظة على النظام البيئي .\nباإلضافة إلى المظاهر التضاريسية السابقة ( الجبال - الهضاب - السهول )\nفإن قارة إفريقيا تتضمن عدديا من الجزر ، مثل :\nجزيرة مدغشقر ( : أكبر جزر المارة ) وتمع فى المحيط الهندى ويفصلها\nعن الساحل الشرلي للمارة مضيك موزمبيك .\nجزر القمر : التي تمع شمال غرب جزيرة مدغشمر ."],[26,"س :2 أكمل العبارات اآلتية بما يناسبها :\nٔ) تضم لارة إفريميا مجموعة من الجبال االلتوابية والجبال . ................ والجبال . .................\nٕ) تمتد جبال أطلس بمارة إفريميا على طول الساحل ................ للمارة .\nٖ) يجرى بمارة إفريميا العديد من األنهار المكونة للسهول الفيضية الخصبة ومنها نهر ........ ونهر . ..........\nٗ) تتشابه السهول الساحلية في ببلد المؽرب العربي من حيث الضيك مع السهول المطلة على . ...............\n٘) المضيك الذى يفصل جزيرة مدغشمر عن يابس المارة اإلفريمية . ...................\n)ٙ من أمثلة المنخفضات الموجودة بهضبة شمال إفريميا ........... في مصر .\nي )۷ وجد باألراضي الليبية عند حدودها الجنوبية الشرلية جبل . .............\nس :3 اختر اإلجابة الصحيحة مما بين القوسين :\nٔ) من أمثلة المنخفضات الموجودة بهضبة شمال إفريميا منخفض الجوف بـ . ..............\n( مصر - الجزابر - السودان - ليبيا )\nٕ) من الظواهر التضاريسية التى تمع فى الجزء الشرلى لمارة إفريميا . ........................\n( جبال الكاب - هضبة الحبشة - هضبة الشطوط - جبال أطلس )\nٖ) يمتد في شمال غرب لارة إفريميا ( . ........ جبل كينيا - جبال أطلس - جبال الكاب - جبال البحر األحمر )\nٗ) تمع هضبة الشطوط بين سبلسل جبال ( . ............... البحر األحمر - دراكنزبرج - الكاب - أطلس )\n٘) تظهر الجبال االنكسارية بمارة إفريميا في جزبها ( . ............ الشمالي - الجنوبي - الشرلي - الؽربي )\n)ٙ من أمثلة الجبال االلتوابية التي تمع جنوب لارة إفريميا . ...........\n( جبال البحر األحمر - جبال الكاب - جبل كينيا - جبل كلمنجارو )\n)۷ أعلى لمة جبلية بسبلسل جبال البحر األحمرلمة . ...............\n( جبل توبمال - جبل شايب البنات - جبل كينيا - جبال دراكنزيرج )\n)٨ من الجبال التي نشؤت نتيجة الثورانات البركانية . ...................\n( جبل كلمنجارو - جبل شايب البنات - جبل توبمال - جبال الكاب )\n( الشمال - الؽرب - الجنوب - الشرق )\n)۹ تمع جبال دراکنز برج بمارة إفريميا في جهة . ..............\nٓٔ) السهول الفيضية التي تخترق الصحراء الكبرى هى سهول نهر . ..........\n( الكونؽو - أورانج - النيل - الزمبيزى )\n( الكونؽو - النيجر - الزمبيزى - النيل )\nس :4 اكتب كلمة (صواب) أ وكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٔ) تتميز لارة إفريميا بمظاهر سطح متنوعة وغنية بالموارد والثروات الطبيعية .\n(ٕ) تنحدر هضبة شمال إفريميا تدريجياا نحو الشرق .\n(ٖ) يؽلب على سطح لارة إفريميا المظهر الهضبي .\n(ٗ) يوجد العديد من الواحات بهضبة شمال إفريميا ."],[27,"(ه) تُعد الهضبة الجنوبية أعلى هضاب لارة إفريميا .\n( )ٙ هنان ارتباط بين خصوبة تربة هضبة الحبشة ونشؤة الحضارات المديمة في إثيوبيا .\n( )۷ تسمط األمطار طوال العام على هضبة الحبشة .\n( )٨ تعلو الممم الجبلية البركانية هضبة البحيرات االستوابية .\n( ي )۹ وجد األخدود اإلفريمى العظيم فى الجزء الؽربي من الهضبة الجنوبية .\n(ٕٔ) تُعد جبال البحر األحمر من الجبال االنكسارية بمارة إفريميا .\n(ٖٔ) يمع جبل كلمنجارو بالمنطمة االستوابية الحارة .\n(ٗٔ) يتشابه جبل كلمنجارو فى تكويناته البركانية مع تكوينات هضبة الحبشة .\n(٘ٔ) تتميز سهول البحر المتوسط بوجود النباتات الطبيعية التي تعتمد على سموط األمطار الصيفية ) ( .\n( )ٔ۷ من السهول الساحلية فى لارة إفريميا سهول المحيط األطلنطى\nوالتي تتميز باتساعها وحمولها الزراعية .\n( )ٔ٨ تتشابه السهول الساحلية الشمالية بمصر مع سهولها الساحلية الشرلية من حيث االتساع ( .\n( )ٔ۹ تتميز السهول الساحلية بدولة تنزانيا بالضيك .\n(ٕٓ) تُعد جزيرة مدغشمر أكبر جزر لارة إفريميا .\nس :5 اكتب ما تشير إليه كل عبارة مما يأتي :\n(ٔ) هضبة عظيمة االتساع ولليلة االرتفاع يوجد بها الصحراء الكبرى أكبر صحارى العالم الحارة .\n(ٕ) الهضبة التي تمد نهر النيل بالمياه الموسمية والتربة الخصبة .\n(ٕ) الهضبة التي تعد المنبع الدابم لنهر النيل وتكثر بها البحيرات العذبة في لارة إفريميا .\n(ٗ) جبال تمتد من جنوب المؽرب حتى تونس .\n(٘) جبال تمع شرق لارة إفريميا وتعد جز اءا من األخدود اإلفريمي العظيم .\n( يُ )ٙ عد أعلى لمة جبلية بمارة إفريميا ويتكون الجليد فوق لمته .\n( )۷ سهول فيضية خصبة صالحة للزراعة تمتد في مصر و السودان .\n( )٨ دولة عربية تمع شمال غرب جزيرة مدغشمر ."],[28,"س :6 بم تفسر ... ؟\n(ٔ) تتميز هضبة الحبشة بخصوبة تربتها .\n(ٕ) تُعد هضبة الحبشة المنبع الموسمى لنهر النيل .\n(ٕ) تعرف هضبة البحيرات االستوابية بؤنها المنبع الدابم لنهر النيل .\n(ٖ) األهمية االلتصادية لجبال لارة إفريميا بالنسبة للصناعة والسياحة .\n(ه) خصوبة تربة وادى النيل في مصر والسودان .\n( )ٙ األهمية االلتصادية لسهول البحر األحمر .\nس :7 ما النتائج المترتبة على ... ؟\n(ٔ) خصوبة التربة في هضبة الحبشة .\n(ٕ) التراب الجبال من الساحل الشرلى فى كل من مصر والسودان وإريتريا .\n(ٖ) االرتفاع الشاهك لجبل كلمنجارو .\n(ٗ) التراب جبال أطلس من ساحل البحر المتوسط .\n(ه) سموط األمطار الشتوية على السهول الساحلية للبحر المتوسط .\nس :8 قارن بين :\nالهضبة الجنوبية ، وهضبة البحيرات االستوابية ، من حيث * : االنحدار .\n* أهم الظاهرات الجؽرافية بها .\nس :9 حدد وجه الشبه بين : جبال الكاب ، وجبال أطلس .\nس :10 ما وجه االختالف بين ... ؟\n(ٔ) جبال البحر األحمر ، وجبال أطلس ( من حيث النشؤة) .\n(ٕ) السهول الساحلية المطلة على المحيط الهندى فى كل من دولة تنزانيا ودولة كينيا من حيث االتساع .\nس :11 ماذا يحدث إذا : لم يمتد األخدود اإلفريمي العظيم في شرق إفريميا .\nس :12 ما العالقة بين : هضبة البحيرات االستوابية ونهر النيل ."],[29,"امتحان على الدرس الثاني\nس ( :1 أ) أمامك خريطة لقارة إفريقيا ، أجب حسب المطلوب :\n(ٔ) دابرة عرض ربيسية . ...............\n(ٕ) جبال . ...............\n(ٖ) الهضبة . ...............\n(ٗ) البحر . ...............\n(٘) جزيرة . ...............\n( )ٙ سهول . ...............\n(ب) صوب ما تحته خط :\n(ٔ) من الجبال البركانية بمارة إفريميا جبال أطلس .\n(ٕ) تُعد أكبر صحارى لارة إفريميا صحراء كلهاري .\n(جـ) في أى الدول تقع الظاهرات التضاريسية اآلتية ... ؟\n(ٔ) جبل العوينات .\n(ٕ) بحيرة فيكتوريا .\n(ٖ) واحة الجوف .\nس ( :2 أ ) اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) من الجبال االلتوابية التي توجد بمارة إفريميا . ............... .\n( جبل شايب البنات - جبل توبمال - جبال دراكنز برج - جبل كينيا )\n(ٕ) ترجع خصوبة سهول نهر النيل إلى الطمى الذى نملته مياه نهر النيل من . ...............\n(هضبة الحبشة - هضبة شمال إفريميا - الهضبة الجنوبية - هضبة الشطوط )\n(ٖ) أي من مظاهر السطح التالية تعد جز اءا من األخدود اإلفريمى العظيم ؟ . ...............\n( جبال البحر األحمر - جبال أطلس - جبال الكاب - جبال در اكنزبرج )\n(ٗ) تمع هضبة الشطوط بمارة إفريميا في جهتها . ...............\n(ب) بم تفسر : تكون الجليد فوق لمة جبل كلمنجارو رغم ولوعه بالمنطمة االستوابية الحارة ؟\n(ج) حدد أوجه االرتباط بين : الجبال في لارة إفريميا ، والتعدين ."],[31,"أوليا :\nنهز الهيل\nيُ عد نهر النيل أطول أنهار العالم ويشكل أهمية إلفريميا بشكل عام ومصر بشكل خاص .\nي نبع نهر النيل من وسط وشرق لارة إفريميا ويتجه شماال ا حتى يصل إلى مصبه\nفي البحر المتوسط بمصر .\nما الممصود\nبالنهر الدولي ؟\nالنهر الذي يمتد\nمجراه وروافده\nفي أكثر من دولة .\nيُ طلك على المساحة التى يجرى بها نهر النيل وروافده بحوض نهر النيل والذي يشؽل\nنحو ٓٔ % من مساحة لارة إفريميا .\n يُعد نهر النيل نهريا دولياً بم تفسر ؟ بسبب :\nامتداد مجراه وروافده داخل أراضى إحدى عشرة دولة ( دول حوض النيل ) ، هي :\nمصر - جمهورية السودان - جنوب السودان - إثيوبيا - إريتريا –\nجمهورية الكونؽو الديممراطية - أوغندا - رواندا - بروندى - كينيا - تنزانيا .\nما الممصود\nبحوض النهر ؟\nالمساحة التى\nيجرى بها نهر\nوروافده\n شكلت دول حوض النيل عام ۱۹۸۳ م تجمعا عُرف باسم األندوجو\n(اإلخاء باللغة السواحلية) ، وكانت مصر صاحبة فكرة إنشاء هذا التجمع .\nبهدف :\n بم تفسر : إنشاء مصر تجمع األندوجو؟\nٔ) التشاور والتنسيك ودعم التعاون بين دول حوض النيل .\nٕ) الحفاظ على المصالح المشتركة فيما بين دول حوض النيل .\n*منابع نهر النيل :\nأشار العالم جمال حمدان أن نهر النيل ثنائى المنبع ما النتائج؟\nمما أدى إلى استدامته ووصوله إلى مصر وهذين المنبعين هما :\nالمنابع الدائمة\nتمع في هضبة البحيرات االستوابية . أهم البحيرات : بحيرة فيكتوريا . - أهم الروافد : نهر كا جيرا .\nالمنابع الموسمية\nتمع في هضبة الحبشة . أهم الروافد : نهر السوباط والنيل األزرق ونهر عطبرة ."],[32,"وفيما يلي نتعرف منابع نهر النيل .\n-1 المنابع الدائمة :\n تقع في : وسط المارة في\nهضبة البحيرات االستوابية .\n تضم : عدد من البحيرات واألنهار أهمها :\nبحيرة فيكتوريا ( ثانى أكبر البحيرات الطبيعية العذبة في العالم) .\nنهر کاچيرا يعد من أهم مصادر مياه بحيرة فيكتوريا والذى يصب فيها من جهة الؽرب .\n تتميزبـ :\n- تدفق مياهها طوال العام بم تفسر ؟\nبسبب سموط األمطار الؽزيرة الدابمة .\n- قلة مساهمة المنابع الدائمة في\nمياه نهر النيل بمصر بم تفسر ؟\nبسبب المستنمعات وزيادة البخر (التبخر ) .\n-2 المنابع الموسمية :\n تقع في : هضبة الحبشة (شرق المارة) .\n تتميزبـ : سموط األمطار الموسمية الؽزيرة التى تسمط في فصل الصيف .\n تضم : مجموعة من الروافد أهمها :\nنهر السوباط : الذى يلتمى ببحر الجبل ويمده بمياهه فيسترد النيل لوته . - النيل األزرق .\n- نهر عطبرة .\n بم تفسر : أهمية نهر عطبرة والنيل األزرق بالنسبة لجريان نهر النيل؟\nألنهما :\nكبلهما يمد نهر النيل بالمياه مما يساعده على الجريان تجاه الشمال حتى المصب في البحر المتوسط ."],[33,"*االتفاقيات الدولية واإلقليمية للمياه الدولية :\nنظرا لمرور النهر الدولى فى أكثر من دولة تم وضع العديد من االتفاليات الدولية واإللليمية بم تفسر؟\nلتنظيم عمليات استخدام مياه هذا النهر .\nاالتفاقيات الدولية :\nوضعت منظمة األمم المتحدة اتفاقية (قانون تنظيم استخدام المجارى المائية فى األغراض\nبهدف :\nغير المالحية) ، بم تفسر؟\nٔ - تنظيم استخدام مياه األنهار وتنميتها .\nٕ - إدارة مياه األنهار وحمايتها .\nٖ - تحميك االنتفاع األمثل والمستدام بها لؤلجيال الحالية والممبلة .\nاالتفاقيات اإلقليمية :\nوضعت دول حوض النيل اتفاقيات تهدف إلى تنظيم وإدارة وتنمية مياه نهر النيل ، مثل :\nاتفاقية 1929 م :\nحيث نصت على التزام دول حوض النيل بعدم الميام\nبؤى مشروعات على نهر النيل بؽير اتفاق مسبك مع\nمصر .\nاتفاقية 2015 م :\nحيث اتفمت مصر وإثيوبيا والسودان على عدة مبادئ\nمنها التعاون والتنمية وعدم التسبب في ضرر\nواالستخدام المنصف \"العادل\" والمناسب لمياه نهر\nالنيل .\n*دور مصر في تحقيق التنمية المستدامة لمائية حوض النيل :\n تسعى مصر منذ المدم إلى تنمية واستثمار الموارد المابية لنهر النيل بشكل مستدام بم تفسر؟ بهدف - :\n- الحفاظ على البيبة .\n- ومراعاة حموق األجيال المادمة وذلن تحميماا لمبادئ االلتصاد األخضر .\nما المقصود باالقتصاد األخضر ؟ االقتصاد الصديق للبيئة الذي يستهدف تحقيق نمو\nاقتصادی مستدام مع الحفاظ على البيئة . وتحقيق العدالة االجتماعية والحد من الفقر\nوالبطالة ."],[34," بم تفسر : لمصر دوراً في تنمية مائية نهر النيل؟\nحيث قامت مصر بالعديد من\nالمشروعات بهدف استثمار الموارد المائية بشكل مستدام ومنها :\nٔ) إنشاء «خزان سنار» على النيل األزرق لصالح السودان .\nٕ) إنشاء سد «أوين» بؤوغندا .\nٖ) دفع تكاليف إنشاء خزان جبل األولياء فى السودان بم تفسر؟ لتوليد الطالة الكهربابية .\nٗ) تطهير بحيرة فيكتوريا وكيوجا من الحشابش والنباتات بم تفسر؟ لزيادة مابية البحيرتين .\n٘) حفر عشرات اآلبار في كينيا .\n)ٙ إنشاء مركز للبحوث المابية في تنزانيا .\nالتدريب األول\nس :1 اكتب كلمة ( صواب ) أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\nنهرا دولياا .\n(ٔ) يُعد نهر النيل ا\n(ٕ) يصب نهر كاجيرا فى بحيرة فيكتوريا من جهة الشرق .\n(ٖ) يمد نهر السوباط بحر الجبل بالمياه فتزداد لوة النيل ويتجه نحو الشمال .\n(ٗ) تُعد بحيرة تانا ثانى أكبر البحيرات الطبيعية العذبة في العالم .\n(ه) لامت مصر بإنشاء مركز للبحوث المابية في كينيا .\n( )ٙ ساهمت مصر فى تطهير بحيرة فيكتوريا وكيوجا من الحشابش والنباتات .\nس :2 بم تفسر : للة مساهمة المنابع الدابمة في مياه نهر النيل ؟\nس :3 حدد اثنين : من جهود مصر لتحميك التنمية المستدامة لمابية نهر النيل في دول حوض النيل .\nس :4 وضح : أهداف تجمع األندوجو .\nس :5 دلل على صحة العبارة اآلتية :\nلامت مصر ودول حوض النيل بعمد اتفاليات لتنظيم وتنمية إدارة مياه نهر النيل؟"],[35,"ثانييا : احلضارات الكدميُ يف إفزيكيا\n بم تفسر : ظهور العديد من الحضارات القديمة على أراضى قارة إفريقيا؟بسبب وجود :\n- المقومات الطبيعية :\nالمولع المتميز والثروات الطبيعية المتعددة من مياه عذبة ونباتات طبيعية وثروة حيوانية\nومعادن ومصادر طالة .\n- المقومات البشرية :\nكثرة عدد سكانها الذين استثمروا تلن الثروات الطبيعية فى إنشاء حضارات عريمة منذ آالف السنين ."],[36,"-1 الحضارة المصرية القديمة :\n لامت الحضارة المصرية المديمة بشمال شرق المارة اإلفريمية .\n دلل : كان لنهر النيل دوريا رئيسييا فى نشأة تلك الحضارة؟ حيث :\nاستمر المصرى المديم على ضفاف نهر النيل ما نتائج؟ وعرف حرفة الزراعة\nواستؤنس الحيوانات وأنشؤ المرى ثم المدن ثم األلاليم وبعد ذلن استطاع\nتوحيد الببلد وتكوين األسرات الحاكمة .\n شهدت الحضارة المصرية القديمة العديد من مراحل النهضة والتقدم\nفي شتى المجاالت دلل؟ حيث اهتم المصريون المدماء بالتعليم ، والفنون ، والعمارة ، واآلداب ،\nوالعلوم ، وإلامة المشروعات االلتصادية .\n حرص المصريون المدماء على توطيد العبللات التجارية مع الحضارات المجاورة لهم\nمثل حضارة كوش وببلد بونت .\n أثرت الحضارة المصرية المديمة على بعض الحضارات اإلفريمية فى المجاالت المختلفة .\n ولد ترن لنا المصريون المدماء تراثا ا حضاريا يدل على ليام حضارة عظيمة .\n-2 حضارة كوش :\n ألام الكوشيون دولة عظيمة ( مملكة كوش) ، امتدت شمال السودان\nحول نهر النيل وكانت في بدايتها متمركزة في نبتة ثم انتملت إلى مروى .\n عمل أهلها بحرفة :\n* التجارة : فاشتهرت بتجارة العاج ، البخور ، الحديد ، الذهب وكانت مركزا تجارياا وألامت عبللات تجارية\nمع - : مملكة أكسوم (شرلاا) .\n- مصر (شماال ا) .\n* الزراعة .\n* التعدين .\n برع الكوشيون في الرسم ، النحت ، العمارة .\n دلل : تأثر الكوشيين بالحضارة المصرية ؟ حيث تأثروا بـها :\n ثقافياً وفنياً : نحت التماثيل و بناء المعابد واألهرامات مثل أهرامات مروى التي أعلنتها اليونسكو\n دينياً : عبادة بعض المعبودات المصرية المديمة ، مثل : اإلله رع واإلله آمون واإلله أوزوريس\nواإللهة إيزيس بجانب معبوداتهم ."],[37,"-3 حضارة أَكْسُوم :\n امتدت مملكة أكسوم شرق إفريميا في إريتريا وإثيوبيا حاليا ا .\nدورا بارزا فى ليامها دلل؟ حيث كانت بمثابة\n لعب النشاط التجاري ا\nمركز تجارى لوى وملتمى للعديد من الطرق التجارية حيث كان الذهب\nوالعاج والعطوروالتوابل من أبرز صادراتها وأعبلها ليمة التصادية .\n اهتم السكان بالزراعة وتربية الحيوانات .\n اشتهرت أكسوم بصناعة الفخار وزخرفته وكذلن صناعة الزجاج .\n تتشابه حضارة أكسوم وكوش في تصدير كل من الذهب والعاج .\n ما النتائج : الموقع الجغرافي لحضارة أكسوم؟ ترتب على ذلك أن أصبحت :\n- مرکز تجاری لوي .\n- ملتمى للعديد من الطرق التجارية .\n-4 حضارة قرطاج :\n ظهرت على ساحل شمال إفريميا (تونس حالياا) مثل الحضارة المصرية .\n نشأتها :\nيرجع الفضل إلى الفينيقيين في تأسيس مدينة قرطاج على البحر المتوسط بم تفسر؟\nبهدف تؤمين رحبلتهم التجارية من فينيميا إلى إسبانيا .\n ما النتائج : الموقع االستراتيجي لمدينة قرطاج فى منتصف طريق التجارة بين مدن شرق\nوغرب البحر المتوسط؟ ترتب على ذلك أن :\nٔ) لويت مدينة لرطاج مع مرور الزمن واستملت عن فينيميا وكونت مملكة مستملة لوية .\nٕ) حکمت لرطاج معظم ساحل شمال إفريميا وبعض جزر البحر المتوسط بفضل مولعها االستراتيجي .\n دلل : اختلفت نشأة حضارة قرطاج عن حضارات مصر وأكسوم وكوش ؟\nحيث : ألنها لم ترتبط بنهر النيل وإنما لامت على التجارة على الساحل الشمالي للبحر المتوسط .\n دلل : لكل حضارة من حضارات إفريقيا تراث ثقافى يميزها عن غيرها؟ حيث : يتمثل\nفى الفنون والحرف التراثية والعادات والتقاليد والمالبس واألكالت الشعبية ة فى اتفالية ٕ٘ٔٓم بشؤن تنظيم وإدارة مياه نهر النيل ؟\n(ٖ) ما ممترحاتن لـ : الحفاظ على مياه النيل ؟"],[43,"س :1 اكتب ما يشير إليه مدلول األرقام التالية على الخريطة :\nٔ) جبال . .......................\nٕ) هضبة . .....................\nٖ) بحيرة . ................... .\nٗ) جزيرة .. ....................\n٘) النيل . .......................\n)ٙ مدار . .....................\n)۷ نهـر . ......................\n)٨ حضارة . ................ .\n)۹ جبال . .........................\nٓٔ) جزر . ................ .\nس :2 اكتب كلمة (صواب) أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\nٔ) لامت مصر بإنشاء خزان جبل األولياء فى أوغندا لتوليد الكهرباء .\nٕ) تمترب لارة إفريميا من لارة أوروبا عند مضيك موزمبيك .\nٖ) يسترد النيل لوته بعد التماء نهر السوباط ببحر الجبل .\nٗ) ظهرت حضارة أكسوم في غرب إفريميا .\n٘) تُعد هضبة الحبشة أكثر هضاب لارة إفريميا ارتفاعاا .\nي )ٙ كثر وجود المنخفضات فوق هضبة شمال إفريميا .\nس :3 اختر اإلجابة الصحيحة مما بين القوسين :\n) السودان - تونس - مصر – إثيوبيا)\nٔ) نشؤت حضارة لرطاج فى ( ............. حالياا ) .\nٖ) يُعد من أهم مصادر مياه بحيرة فيكتوريا نهر (. ......... كاجيرا - السوباط - النيل األبيض - النيل األزرق)\nٗ) يُطلك على دول حوض النيل اسم األندوجو ويعنى ( .. ................ المحبة - الصدق - اإلخاء - العهد )\nس :4 بم تفسر :\nٕ) أهمية النيل األزرق لمصر .\nٖ) األهمية االلتصادية لجبل كلمنجارو ."],[44,"س :5 دلل على كل عبارة مما يلى :\nٔ) األهمية الحضارية المولع لارة إفريميا .\nٕ) دور مصر فى تنمية مابية حوض النيل .\nٖ) األهمية االلتصادية للسهول الفيضية بمارة إفريميا .\nس :6 ما النتائج المترتبة على ما يلى ... ؟\nٔ) عدم وجود جبال على سواحل البحر المتوسط فى . مصر .\nٕ) سموط أمطار غزيرة دابمة على هضبة البحيرات االستوابية .\nٖ) المولع الجؽرافي لمارة إفريميا .\nس :7 ما العالقة بين كل من ... ؟\nٔ) مصر ، وتجمع األندوجو\nٕ) هضبة الحبشة ، وليام الزراعة فى مصر ."],[45,"الوحدة الثاهية\nاألول\nالحضارة المصرية القديمة وعالقتها بحضارات\nإفريقيا"],[46,"تعد وحدة الدولة واستقرارها السياسي العامل األساسى فى نهضتها\nوتقدمها ، فعندما اتحدث أقاليم مصر منذ القدم واستقرت أوضاعها الداخلية استطاعت\nأن تقدم للعالم حضارة عريقة تميزت بتقدمها المذهل في جميع المجاالت .\nعصور مصر القديمة من األقدم لألحدث :\nالفترة\nالعصر\nالعصر الحجري القديم\nمنذ خلق اهلل اإلنسان حتى معرفة\nالعصر الحجري الحديث\nاإلنسان الكتابة .\n(عصور ماقبل التاريخ)\nالعصر النحاسي\nعصر ماقبل األسرات\nالعصر العتيق\n( األسرات ) 2 ، 1\nمن القرن 29 : 31 ق م\nعصرالدولة القديمة\n( األسرات ) 6 : 3\nمن القرن 22 : 28 ق م\nعصراالضمحالل األول\n( األسرات ) 10 : 7\nمن القرن 21 : 22 ق م\nعصرالدولة الوسطى ( األسرات ) 12 : 11\nمن القرن 18 : 22 ق م\nعصراالضمحالل الثانى (األسرات ) 17 : 13\nمن القرن 17 : 18 ق م\nعصرالدولة الحديثة\n( األسرات ) 20 : 18\nمن القرن 11 : 16 ق م\nالعصر المتأخر\n( األسرات ) 30 : 21\nمن القرن 4 :11 ق م\n العصر العتيق هو عصر بداية األسرات و يشمل األسرتين األولى والثانية .\n يُعد العصر العتيق عصر البناء والتأسيس بم تفسر ؟\nألنه بدأ بتوحيد الملك نعرمر «مينا » لمملكتي الشمال والجنوب وتأسيس\nعاصمة مصر الموحدة مدينة «من - نفر» ."],[47,"أهم خصائص العصر العتيق :\n)1 اهتم ملوك العصر العتيق باالستقرار وتحقيق األمن بم تفسر ؟\nبسبب اهتمام ملون العصر العتيك بتؤمين حدود مصر وبناء الحصون .\n)2 اهتم ملوك العصر العتيق االهتمام باألنشطة االقتصادية وبخاصة التجارة دلل؟\nحيث اهتم ملوك هذا العصر بــ :\n الطرق الصحراوية لتؤمين التجارة المارة بها .\n السيطرة على المنطمة الوالعة بين جنوب الجندل األول من أجل التجارة .\n استؽبلل المناجم ومحاجر سيناء .\nٖ) اهتم ملوك العصر العتيق بالعمارة خاصة بناء مقابر الملوك دلل؟ حيث\nتحولت من مجرد حفرة في األرض إلى حجرة دفن من الحجر الجيري يعلوها جزء من\nالطوب اللبن يشبه المصطبة .\n يطلق على عصر الدولة القديمة (عصر بناة األهرام) .\n يشمل أربع أسرات ( من األسرة الثالثة إلى نهاية األسرة السادسة) .\n سمى عصر الدولة القديمة بعصر بناة األهرام بم تفسر ؟\nبسبب اهتمام ملوكه ببناء ممابرهم على شكل أهرامات .\nأهم خصائص عصر الدولة القديمة :\n)1 االستقرار .\nٕ) تطور فن العمارة دلل؟ ، حيث :\n تطور شكل المقبرة في عصر الدولة القديمة دلل؟ حيث : من حجرة يعلوها مصطبة ، إلى\nعدة مصاطب ، أخذت شكل هرم مدرج ، مثل : هرم زوسرثم وصلت إلى شكل الهرم الكامل في عهد\nالملن خوفو مما يدل على تمدم المصريين المدماء فى فن العمارة والهندسة والفلن .\n االهتمام ببناء المعابد مثل - : معابد اآللهة .\n- المعابد الجنائزية ."],[48,")3 براعة الفنان المصرى القديم في فن النحت دلل؟ حيث برع في :\nاستخدم المواد المختلفة فى النحت ، مثل ( : الحجر - العاج - الخشب) اهتم بنحت :  التماثيل الملكية بم تفسر؟ العتماده في لدسية الملن .\n تماثيل النببلء مثل : تمثال النبيل « كا عبر» ويعرف حالياا بتمثال شيخ البلد .\n تماثيل في وضعية جديدة مثل : تمثال الكاتب المصرى الجالس الذي أظهر دلة\nومهارة الفنان المصرى المديم وتمديره لمكانة الكاتب في المجتمع .\n)4 براعة الفنان المصرى القديم في فن النقش دلل؟\nحيث ظهرت النموش البارزة على األسطح الصلبة .\n)5 براعة الفنان المصرى القديم في فن الرسم دلل؟\nحيث استخدم األلوان لتصميم الصور الجدارية على جدران المعابد .\n)ٙ ازدهار األدب دلل؟ ، حيث : ازدهر األدب في عصر الدولة المديمة\nخاصة األدب الديني مثل : نصوص األهرام « متون األهرام» .\nنصوص األهرام\n«متون األهرام» ؟\nمجموعة نصوص دينية\nنمشت بالخط الهيروغليفي\nعلى جدران الحجرات\nالداخلية لئلهرام .\nأشهر ملوك عصر الدولة القديمة :\n الملن زوسر «مإسس األسرة الثالثة» .\n صاحب الهرم المدرج بسمارة الذي يتكون من ست مصاطب مختلفة الحجم (مدرجة) ،\n ويُعد أول بناء حجرى ضخم في التاريخ والذي لام بتشييده وزيره «إيمحوتب » .\n الملن سنفرو «مإسس األسرة الرابعة» .\n كان ملكا عظي اما عادال ا في رعيته ما النتائج؟ ج / لرلك لكب بـ « املمك احملطَ احملبوب » .\n ازدهرت مصر فى عهده اجتماعياا وتجارياا وفنياا وعمرانياا ."],[49,"أهم اعماله :\nٔ) أرسل حملة لببلد النوبة بم تفسر؟ ج / ليعيد األوَ إىل حدود وصس اجليوبية .\nٕ) أرسل أسطوال بحرياا مكونا من ٓٗ سفينة إلى فينيميا بم تفسر؟ ج / إلحضاز أخشاب شجس األزش .\n املمك خوفو« ثايى وموك األضسة السابعة»\n اهم اعماله :\nٔ) شيد الهرم األكبر على ِضبة اجليصة الذي يُعد عمبلا معماريا ا رابعا ا يده عمى عبمرية المصرى المديم .\nٕ) ازدهرت في عهده التجارة الخارجية لمصر خاصة مع فيييكيا وبرلك تشابْ وع املمك ضيفسو .\n الملن خفرع « أحد وموك األضسة السابعة» .\n اهم اعماله :\nٔ) صاحب الهرم األوسط .\nٕ) أمر بنحت تمثال أبو الهول الذى يظهر برأس إنسان بم تفسر؟ ليده عمى العكن واحلكىة\nوجسم أسد بم تفسر؟ ليده عمى الكوة .\n وصل فن النحت في عهد الملك خفرع إلى قمته دلل ؟ حيح اضتطاع الفياُ املصسى الكديي\nاضتخداً أصمب أيواع احلجس يف حنت التىاثين ، وجن حجس الديوزيت .\n بم تفسر : سقوط األسرة الرابعة ؟\nألنه فى نهاية األسرة الرابعة ازداد نفوذ كهنة إله الشىظ (زع) ما النتائج؟ حتى استطاع كبيرهم أوضسكاف\nالوصول إلى حكم مصر وسموط األسرة الرابعة .\nمعلومة إثرائية « - الملك منكاورع» : تولى الحكم بعد أبيه الملك خفرع وشيد الهرم األصغر (بجوار هرم خوفو وهرم خفرع)"],[50," الملن أوسركاف «وؤضظ األضسة اخلاوطة» .\n أهم أعماله ( : دلل : تعددت اإلنجازات المعمارية في عهده)\nحيث أمر بتشييد :\n- معابد الشمس المكشوفة في أبي صير بالجيزة .\n- العديد من المسبلت الضخمة .\n الملن أوناس «آخس وموك األضسة اخلاوطة» .\n أهم أعماله :\n ما العالقة بين : آخر ملوك االسرة الخامسة وازدهار األدب الديني؟\nيُعد أول من كتب نصوص األهرام على جدران حجرة الدفن داخل الهرم بم تفسر؟\nبّدف محاية املمك يف احلياة اآلخسة ثم انتشرت كتابة نصوص األهرام بعد ذلن بين الملون والملكات .\n بم تفسر : أهمية نصوص األهرام ؟\nألنها أمدتنا بالكثير من المعلومات المهمة عن المعتمدات الدينية للمصريين المدماء .\nنهاية عصر الدولة القديمة\nفي نهاية عصر األسرة السادسة ( يف أواخس عّد املمك بيبى الجايى ) تدهورت أحوال مصر االلتصادية\nواالجتماعي والسياسية وعمت الفوضى بم تفسر؟ لألضباب التالية :\nٔ) ضعف السلطة المركزية وازدياد نفوذ حكام األلاليم .\nٕ) تولف الحكومة عن تنفيذ المشروعات االلتصادية .\nٖ) زيادة األعباء على كاهل الفبلح المصرى .\nكن ذلك دفع المصريين للقيام بثورة عارمة وبذلك انتهى عصر الدولة القديمة وبدأ عصر\nاالضمحالل األول ."],[51,"التدريب األول\nس :1 كلمة (صواب ) أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٔ) لام الملن نعرمر (مينا) بتوحيد مملكتي الشمال والجنوب .\n(ٕ) يُعد عصر الدولة المديمة هو عصر البناء والتؤسيس .\n(ٖ) يُعد الملن زوسر مإسس األسرة الرابعة .\n(ٗ) يعتبر الهرم األكبر أول بناء حجرى ضخم في التاريخ .\n(ه) ازدهرت التجارة الخارجية لمصر في عهد الملن خوفو .\nس :2 اكتب ما تدل عليه كل عبارة مما يأتي :\n(ٔ) مدينة اتخذتها األسرة األولى عاصمة لمصر الموحدة .\n(ٕ) مجموعة نصوص دينية نُمشت بالخط الهيروغليفي على جدران الحجرات الداخلية لؤلهرام .\nس :3 بم تفسر : اهتمام المصريين المدماء بنحت التماثيل الملكية خبلل عصر الدولة المديمة .\nس :4 ما النتائج التي ترتبت على ... ؟\n(ٔ) اهتمام ملون العصر العتيك بتؤمين حدود مصر وبناء الحصون .\n(ٕ) زيادة نفوذ كهنة اإلله (رع) فى أواخر عصر األسرة الرابعة .\nس :5 أيد باألدلة التاريخية صحة كل عبارة مما يأتي :\n(ٔ) اهتم ملون مصر في العصر العتيك بالتجارة .\n(ٕ) وصل فن النحت في عهد الملن خفرع إلى لمته .\nعصر االضمحالل األول\n عصر االضمحبلل األول يعرف بــ(عصس الضعف األوه) .\nي  شمل أربع أسرات ( وَ األضسة الطابعة حتى األضسة العاشسة) .\n ما نتائج : تعرض مصر لعصر االضمحالل األول ؟\nعصر االضمحبلل ؟\nفترات زمنية في التاريخ\nالمصرى المديم سادت فيها\nالببلد حالة من ضعف سلطة\nالملن والحكومة المركزية ،\nوانتشرت فيها\nاالضطرابات السياسية\nوااللتصادية .\nتعرضت الببلد لبلنمسام والؽارات الخارجية ، وتولفت عجلة البناء والتطور الحضاري .\n اضتىس ِرا الضعف حتى ظّست األضسة احلادية عشسة ما النتائج؟\nعصرا جديداا من النهضة والتمدم هو عصر الدولة الوسطى .\nأعادت الببلد لوحدتها وبذلن بدأ\nا"],[52,"عالقة مصر بإفريقيا فى عصر الدولة القديمة\n اهتم ملوك عصر الدولة القديمة باكتشاف القارة اإلفريقية وتأمين الحدود الجنوبية كما\nاهتموا بفتح طرق للتجارة مع شعوب القارة دلل ؟\nحيث أرسل ملون األسرة الخامسة واألسرة السادسة الرحبلت التجارية واالستكشافية إلى إفريميا ،\nمثل رحبلت الرحالة «حر - خوف» نحو الجنوب في إفريميا .\n دلل : تأثر إفريقيا بالحضارة المصرية في عهد الدولة القديمة ؟\nحيث سادت الصداقة والتعاون والتبادل الثقافي عالقة مصر بإفريقيا ، ومن مظاهر التأثير :\nٔ) دينياً :\n انتشار بعض المعبودات المصرية فى أنحاء إفريميا مثل الصمر «المعبود حورس »\nشعارا لملون مصر وكذلن نجده عند ملون أوغندا .\nالذي كان\nا\n انتشار بعض العادات المصرية بين الشعوب اإلفريمية مثل التحنيط حيث تم تحنيط\nجثث ملون وأمراء الكونؽو وإن لم يعرفوا أسرار التحنيط كاملة .\nٕ) ثقافياً : انتشار اآلالت الموسيمية المصرية في غرب إفريميا .\nالتدريب الثاني\nس :1 صوب ما تحته خط :\nٔ) بدأ عصر االضمحبلل األول من األسرة السادسة حتى األسرة العاشر .\nٕ) انتشرت بعض المعبودات المصرية المديمة فى أنحاء إفريميا مثل الصمروالذى يشير إلى المعبود رع .\nس :2 اكتب ما تدل عليه العبارة اآلتية :\nفترة زمنية سادت فيها الببلد حالة من ضعف السلطة المركزية وانتشار االضطرابات .\nس :3 ما األثر الناتج عن : تعرض مصر لعصر االضمحبلل األول ؟\nس :4 دلل على صحة كل عبارة مما يأتي :\nٔ) تؤثرت بعض الدول اإلفريمية بالحضارة المصرية فى عصر الدولة المديمة فى النواحى الدينية .\nٕ) اهتم ملون عصر الدولة المديمة باكتشاف المارة اإلفريمية .\nٖ) تؤثرت بعض الدول اإلفريمية بالعادات المصرية خبلل عصر الدولة المديمة ."],[53,"س :1 أكمل العبارات اآلتية بما يناسبها :\n(ٔ) يشمل العصر العتيك األسرتين . ............... .\n(ٕ) يبدأ عصر الدولة المديمة باألسرة . ............... .\n(ٖ) يُعد ............... . أول بناء حجرى ضخم في التاريخ .\n(ٗ) أمر الملن ................ بنحت تمثال أبو الهول .\n(ه) استطاع المصرى المديم استخدام أصلب أنواع الحجر في نحت التماثيل مثل حجر . ...............\n( يُ )ٙ عد الملن ............... مإسس األسرة الخامسة .\nس :2 اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) تؤسست مدينة \"من - نفر\" لتكون عاصمة للببلد على يد الملن . ...............\n( نعرمر - زوسر - أوسركاف – أوناس )\n(ٕ) كانت ممابر الملون فى مصر لديما مصطبة واحدة خبلل عصر األسرة . ...............\n( الثانية - الثالثة - الرابعة - الخامسة )\n(ٖ) أول ملون مصر فى عصر بناة األهرام هو الملن . ............... .\n( خفرع - زوسر – أوسركاف – أوناس )\n(ٗ) يرجع الفضل فى بناء ............... إلى الوزير إيمحوتب .\n( الهرم المدرج – هرم خوفو – معابد الشمس – هرم خفرع )\n(٘) «ذهب أحمد في رحلة مدرسية إلى منطمة سمارة وشاهد بناء ضخم عبارة عن ست مصاطب فوق\nبعضها» . ما شاهده أحمد تم بناءه في عصر األسرة ( . ............... الثالثة - الرابعة - الخامسة - السادسة )\n( )ٙ أى من ملون الدولة المديمة أُطلك عليه لمب المحسن المحبوب . ...............\n( زوسر - سنفرو - خوفو - خفرع )\nا\nأسطوال بحرياا إلحضار أخشاب األرز من . ...............\n( )۷ أرسل الملن سنفرو\n( ببلد بونت - فينيميا - الكونؽو - أوغندا )\n( )٨ بلػ بناء الممابر الملكية لمة تطورها في عصر الدولة المديمة على يد الملن . ..............\n( أوناس - زوسر - سنفرو - خوفو )\n( )۹ صاحب الهرم األوسط هو الملن ( . ............... سنفرو - خوفو - خفرع - أوناس )\n(ٓٔ) سيطر رجال الدين بشكل كامل على مماليد الحكم خبلل عصر الدولة المديمة في عهد األسرة\n. ..................\n(الرابعة - الخامسة - السادسة - السابعة )"],[54,"( زوسر - سنفرو - أوناس - أوسركاف)\n(ٕٔ) انتهى عصر بناة األهرام بسموط األسرة . .................. .\n( الثالثة - الرابعة - الخامسة - السادسة )\n( السابعة - الثامنة - العاشرة - الحادية عشرة )\nس :3 اكتب كلمة (صواب ) أوكلمة (خطأ) أمام العبارة غير الصحيحة ، مع التصويب :\n(ٔ) نعمت مصر باالستمرار منذ عصر األسرة الثالثة حتى األسرة السادسة .\nتطورا للممابر خبلل عصر الدولة المديمة في بناء الهرم المدرج .\n(ٕ) تُمثل المرحلة األكثر\nا\n(ٖ) ت ُعد نصوص األهرام من األدب الديني .\n(ٗ) استخدم الفنان المصرى المديم األلوان لتصميم صور جدارية على جدران المعابد .\n(ه) ظل عصر بناة األهرام من أزهى عصور مصر المديمة حتى نهاية األسرة الخامسة .\n( يُ )ٙ عرف تمثال النبيل (كاعبر ) حالياا بتمثال شيخ البلد .\n( يُ )۷ عد نحت تمثال أبى الهول بجسم أسد دليبل على الحكمة .\n( )٨ خبل هرم زوسر المدرج من وجود متون األهرام على جدرانه .\n(ٔ) انتشرت كتابة نصوص األهرام بين ملون وملكات مصر بعد الملن أوناس .\n(ٓٔ) بدأ عصر الدولة الوسطى بظهور األسرة الحادية عشرة .\n(ٖٔ) انتشرت اآلالت الموسيمية المصرية المديمة في غرب إفريميا .\nس :4 من يكون ... ؟\n(ٔ) لام بتوحيد مملكتى الشمال والجنوب وكان عهده بداية لعصر جديد هوعصر األسرات .\n(ٕ) ثاني ملون األسرة الرابعة .\n(ٖ) أحد ملون األسرة السادسة وضعفت خبلل عهده سلطة الحكومة المركزية .\nس :5 رتب ملوك مصر الفرعونية التاليين من األقدم إلى األحدث في تولية الحكم :\n( )...... أوسركاف .\n( )...... خوفو .\n( )....... زوسر .\n( )...... خفرع .\n( )...... أوناس .\n( )...... سنفرو ."],[55,"س :6 رتب اآلثار التاريخية اآلتية من األقدم إلى األحدث :\n( )...... الهرم المدرج .\n( )...... معابد الشمس المكشوفة في أبي صير .\n( )...... الهرم األكبر .\n( )...... تمثال أبو الهول .\nس :7 بم تفسر ... ؟\n(ٔ) يُعد العصر العتيك عصر البناء والتؤسيس .\n(ٕ) ليام المصريين المدماء بنحت التماثيل الملكية خبلل عصر الدولة المديمة .\n(ٖ) لمب الملن سنفرو بالملن المحسن المحبوب .\n(ٗ) عُرف هرم سمارة بالهرم المدرج .\nا\nأسطوال بحرياا لفينيميا .\n(ه) إرسال الملن سنفرو\n( )ٙ سموط األسرة الرابعة فى عصر الدولة المديمة .\n( )۷ أهمية نصوص األهرام .\n( )٨ ضعف وسموط الدولة المديمة .\nس :8 ما النتائج التي ترتبت على ... ؟\n(ٔ) ضعف سلطة الملن بيبى الثانى أواخر عصر الدولة المديمة .\n(ٕ) ظهور األسرة الحادية عشرة في مصر المديمة .\nس :9 ما المقصود بـ ... ؟\n(ٕ) عصر االضمحبلل .\n(ٔ) نصوص األهرام .\nس :10 أيد باألدلة التاريخية صحة كل عبارة مما يأتي :\n(ٔ) اهتم ملون العصر العتيك باألنشطة االلتصادية .\n(ٕ) برع الفنان المصرى المديم خبلل عصر الدولة المديمة في فن النحت .\n(ٖ) تشابه كل من الملن سنفرو وابنه الملن خوفو فى اهتمامهما بالتجارة الخارجية .\n(ٗ) توجد عبللة بين آخر ملون األسرة الخامسة وازدهار األدب الديني .\n(ه) تنوعت اإلنجازات المعمارية في عهد الملن أوسركاف .\n( )ٙ تدهور أحوال مصر االلتصادية واالجتماعية والسياسية أواخر عصر األسرة السادسة .\n( )۷ اهتمام ملون عصر الدولة المديمة باكتشاف المارة اإلفريمية .\n( )٨ تؤثرت إفريميا بالحضارة المصرية في عصر الدولة المديمة ."],[56,"امتحاي عمى الدرس األول :\nس ( :1 أ) صوب ما تحته خط :\n(ٔ) أمر الملن أوسركاف بتشييد الهرم األوسط .\n(ٕ) ظهرت متون األهرام في عهد الملن خوفو .\n(ٕ) نجحت األسرة العاشرة في إعادة توحيد مصر مرة أخرى بعد فترة من االنمسام .\n(ب) رتب األحداث التاريخية اآلتية من القديم إلى الحديث :\n* تحت تمثال أبو الهول .\n* بناء الهرم األكبر .\n* تؤسيس عاصمة مصر الموحدة «من نفر» .\n* بناء الهرم المدرج .\n* توحيد الملن نعرمر لمملكتي الشمال والجنوب .\n(ج) ما العالقة بين : أواخر فترة حكم الملن بيبى الثانى وعصر الدولة المديمة ؟\nس ) i ( :2 اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) تدهورت أحوال مصر االلتصادية واالجتماعية والسياسية في نهاية عصر األسرة . ............\n(الرابعة - الخامسة - السادسة - الحادية عشرة )\n(ٕ) بنيت معابد الشمس المكشوفة فى أبى صير فى عهد األسرة . ...............\n(الثانية - الثالثة - الرابعة - الخامسة )\n(سنفرو - زوسر - نعرمر - أوسركاف )\n(ٖ) تؤسست األسرة الثالثة على يد الملن . ...............\n(ٗ) كانت ممبرة الملن نعرمر عبارة عن . ...............\n(هرم مدرج - ست مصاطب - هرم كامل - مصطبة واحدة )\n(ه) استطاع كبير كهنة إله الشمس (رع) إسماط األسرة ( . ......... الثالثة - الرابعة - الخامسة - السادسة )\n(ب) «يعتبر عصر بناة األهرام أحد عصور مصر القديمة حيث تميز باالستقرار وتطور فن\nالعمارة» في ضوء العبارة السابقة ، أجب عما يأتي :\n(ٔ) لماذا سمى عصر الدولة المديمة بعصر بناة األهرام ؟\n(ٕ) ما هدف الملن سنفرو من إرسال أسطول بحرى إلى فينيميا ؟"],[57,"عرفنا في الدرس السابق أن عصر الدولة القديمة أحد عصور مصر التاريخية الذى امتاز بالعديد\nمن اإلنجازات العظيمة ولكن في نهاية هذه الدولة وخاصة منذ نهاية األسرة السادسة\nضعفت الحكومة (السلطة ) المركزية وانقسمت البالد وانتشرت الفوضى واالضطرابات\nفكان عصر االضمحالل األول واستمر ذلك حتى ظهرت أسرة حاكمة قوية في طيبة\nاستطاعت توحيد البالد وأسست األسرة الحادية عشرة لتبدأ البالد عصريا جديديا من النهضة\nهو عصر الدولة الوسطى .\n يطلق على عصر الدولة الوسطى (عصر الرخاء االقتصادي) .\n يشمل األسرتان الحادية عشرة والثانية عشرة .\nأيه خصائص عصز الدولة الوسطى :\nشهد هذا العصر العديد من اإلنجازات أهمها :\nٔ) تؤمين الحدود دلل؟ من خبلل :\n توضيع حدود وصس اجليوبية .\n بياء احلصوُ بم تفسر ؟ لتأوني حدود وصس الشسقية واجليوبية .\nٕ) استمرار الحكم وازدياد لوة السلطة المركزية والتنظيم اإلدارى الجيد للببلد .\nٖ) النشاط المعمارى الكبير الذي ظهر في بناء الممابر والمعابد .\n)4 ازدهار األدب والفنون بم تفسر ؟ بطبب شيادة اإليتاج األدبى و التكدي فى الفيوُ ، وجن : فَ\nالسضي وفَ اليخت (أي شّدت يّضة يف اجملاه الجكايف) .\n بم تفسر : تسمية عصر الدولة الوسطى بعصر الرخاء االقتصادي ؟ بسبب :\n االهتمام بالتعدين دلل؟ من خبلل االستؽبلل الواسع للمحاجر والمناجم .\n زيادة النشاط التجارى دلل؟ مع الببلد المجاورة ، مثل • : فينيميا • . ببلد بونت .\n االهتمام بالمشروعات الزراعية دلل؟ من خبلل :\n توسيع مساحات األراضى الزراعية .\n إلامة السدود بم تفسر؟ لتخزين مياه الفيضان لبلستفادة منها في أولات الجفاف ."],[58,"أشهر ملوك عصر الدولة الوسطى\n أهم اعماله :\nسياسياً :\n بم تفسر : تُعد فترة حكم الملك منتوحتب الثاني بداية لمجد األسرة الحادية عشرة؟\nٔ) كان أول حاكم فى طيبة بعد عصر الدولة المديمة يسيطر على الوجه البحرى والوجه المبلى دلل؟\nحيث نجح في االنتصار على ملون اهناسيا فى الشمال ( ملون الوجه البحرى ) .\nٕ) أعاد السلطة المركزية الموية وأصلح النظام اإلداري في الدولة ونجح فى أن يحد من نفوذ حكام األلاليم .\nعمرانياً :\nٔ) اهتم بتجميل طيبة (األلصر حاليا ا) وأنشؤ المعابد فيها .\nٕ) لام بالتوسع جنوبا ا .\nمعناها القابضة على\nٖ) أرسل بعثة تجارية إلى ببلد بونت عبر الصحراء .\nاألرضين وحاليا هي\nإثيت تاوى\nقرية «اللشت»\nبمحافظة الجيزة .\n الملك أمنمحات األول «مؤسس األسرة الثانية عشرة» .\n بم تفسر : يرجع الفضل للملك أمنمحات األول في نهضة البالد؟\nألن أصبحت مصر فى عهده دولة لوية تميزت باالستمرار والتمدم في المجاالت االلتصادية والفنية واألدبية .\n أهم اعماله :\n أعمال إدارية :\n)1 نمل عاصمة الببلد من طيبة إلى إثيت تاوى بم تفسر؟\nلتكون في مولع متوسط بين الوجهين البحرى والمبلى حتى يسيطر على كل أنحاء الببلد .\nٕ) أخضع حكام األلاليم لسيطرته بمنحهم األلماب الرفيعة وتمريبهم منه (وهذا دليل على براعته اإلدارية) .\n أعمال عسكرية :\nٖ) لام بطرد المبابل اآلسيوية التي دخلت مصر عن طريك الشرق .\nٗ) وصلت حدود مصر الجنوبية فى عهده إلى الجندل الثاني .\n٘) تؤمين الحدود الؽربية للدلتا دلل؟"],[59," أهم اعماله :\n دلل : نجح الملك سنوسرت الثالث في تأمين حدود البالد؟ حيث :\nٔ) لام بتؤمين حدود مصر الشمالية والجنوبية والدفاع عنها فكان من أعظم الملون الذين\nلاموا بحمبلت عسكرية ناجحة لتؤمين الحدود .\nصا بالحدود الجنوبية دلل؟ حيث لام ببناء الحصون ،\nٕ) اهتم اهتما اما خا ا\nمثل : حصنى سمنة ولمنة عند الجندل الثاني .\nكتب سنوسرت الثالث على\nلوحة أقامها على حدود مصر\nٖ) أمر بحفر لناة مابية وعُرفت باسم لناة سيزوستريس بم تفسر؟\nالجنوبية عند الجندل الثاني :\nلتربط بين البحر األحمر والبحر المتوسط عن طريك نهر النيل .\n«أنه بريء من ابن يأتي بعده\n ما النتائج التي ترتبت على : حفر قناة سيزوستريس ؟\nوال يحافظ على تلك\nأدى ذلن إلى زيادة حركة التجارة بين مصر وجيرانها .\nالحدود» .\nمعلومة إثرائية «قناة السويس» :\n تم حفرها في العصر الحديث لتربط بين البحر األحمر والبحر المتوسط مباشرة\nوأصبحت من أهم الممرات المبلحية في العالم التي تربط بين الشرق والؽرب\nولد زادت أهميتها بعد أن لامت مصر بحفر لناة السويس الجديدة مما زاد\nمن عدد السفن المارة بالمناة بهدف تحميك االزدهار االلتصادي .\n وبذلك يكون الفرق بين القناتين هو أن قناة سيزوستريس تربط البحرين بطريقة غير مباشرة\nأما قناة السويس تربط بين البحرين بطريقة مباشرة .\n امتاز عهده بالسالم والتنمية االقتصادية دلل؟\nحيث اهتم باستثمار موارد مصر وظهر ذلن من خبلل أعماله وهي :\n أهم أعماله :\nٔ) اهتم بالنشاط التعديني دلل؟\nحيث أرسل نحو أربع وعشرين بعثة الستخراج المعادن\nولطع األحجار في شبه جزيرة سيناء ."],[60,"ٕ) اهتم بشئون الرى والزراعة دلل؟ حيث :\n ألام س ادا عظي اما «سد البلهون» عند مدخل بحيرة موريس بحيرة لارون حالياا بم تفسر؟\n لتخزين مياه الفيضان .\n حماية الببلد من المجاعة التي لد تصيبها نتيجة انخفاض منسوب مياه نهر النيل .\n التوسع في مساحات األراضى الزراعية .\n ألام مماييس للنيل عند الجندل الثاني بم تفسر ؟ لمرالبة ارتفاع منسوب مياه النيل .\n الملكة سبن نفرو آخر ملون « األسرة الثانية عشرة» .\n ابنة الملن «أمنمحات الثالث» تولت حكم مصر عمب وفاة «أمنمحات الرابع » .\n استمر حكمها للببلد لرابة أربع سنوات .\nس ِبن » رمز الموة لحاكم مصر .\n كانت أول حاكمة تم تسميتها على اسم اإلله « ُ\n أهم أعماله :\nٔ) أسست العديد من المعابد .\nٕ) استكملت بناء هرم والدها في منطمة هوارة .\nصا بها بالمرب من منطمة دهشور .\nٖ) أنشؤت هر اما خا ا\nضعف وسقوط الدولة الوسطى بم تفسر؟\nبسبب :\n)1 ضعف الملون الذين جاءوا بعد الملن أمنمحات الثالث .\nٕ) زيادة الصراعات بين حكام األلاليم على السلطة .\nمما أدى إلى تعرض البالد لألطماع الخارجية ووقوعها تحت سيطرة الهكسوس .\nالتدريب األول\nبم تفسر ... ؟\n(ٔ) بناء الحصون فى عصر الدولة الوسطى بمصر المديمة .\n(ٕ) اتخاذ الملن أمنمحات األول إثيت تاوى عاصمة جديدة للببلد .\n(ٖ) إلامة السدود خبلل عصر الدولة الوسطى بمصر المديمة .\n(ٗ) إلامة مماييس للنيل فى عهد الملن أمنمحات الثالث ."],[61,"عصز االضنحالل الثاىي (عصز الضعف الثاىي)\n شمل خمس أسرات ( من األسرة الثالثة عشرة إلى األسرة السابعة عشرة) .\n تعرضت الببلد فى هذا العصر لؽزو الهكسوس .\n استمر الهكسوس فى شرق الدلتا واتخذوا من أواريس عاصمة لهم وبذلن حكم الهكسوس الوجه البحرى .\n أما الوجه المبلى فكان يحكمه أمراء وطنيون اكتفى الهكسوس بمبول دفعهم للضرابب دون التدخل في\nشبونهم .\n دلل : أساء الهكسوس للمصريين؟\nالهكسوس\nحيث لاموا بـ :\nهم مجموعة من\n- تدمير المعابد .\n- االستيبلء بالموة على مدينة «من - نفر» .\nالقبائل التي جاءت\nمن وسط آسيا .\n- سلب ممتلكات المصريين وفرض الضرابب عليهم .\nكفاح املصزيني ضد اهلكسوس «حزب التحزيز»\nكان عصر األسرة السابعة عشرة عصر االنتفاضة ضد الهكسوس دلل ؟\nحيث عمل ملون هذه األسرة على تنظيم أمور مملكتهم فى طيبة وبث الشعور الوطنى\nوروح المماومة لدى المصريين لمواجهة الهكسوس .\nأشَز مموك طيبة الذيي واجَوا اهلكسوس :\nبدأ النضال الحميمي لتحرير الببلد من الهكسوس ، وساندته زوجته «إياح حتب» ولكنه لتل في ساحة المعركة .\n( ابن سقنن رع الثاني )\nحمل لواء الكفاح بعد مقتل أبيه ، وقاد المصريين فى حروبهم ضد الهكسوس حيث :\n)1 عمل على تؤمين حدود الببلد الجنوبية ، فمام بحملة مفاجبة على أرض «كوش» بم تفسر؟\nإلجبار أميرها على لطع اإلمدادات التي كانت تصل إلى الهكسوس عن طريك النيل (حصار التصادي)\nانتصارا عظي اما استطاع من خبلله تحرير أجزاء كبيرة من\nٕ) انطلك بجيشه نحو الشمال محمما\nا\nمصر الوسطى كانت تحت نفوذ الهكسوس ولكنه لُتل في حرب التحرير ."],[62,"أكمل الكفاح الذي بدأه والده سقنن رع الثاني وأخوه كامس دلل؟ حيث :\nٔ) اتجه بجيشه نحو الشمال وحاصر عاصمتهم مدينة أواريس حتى دخلها وفر الهكسوس إلى فلسطين .\nٕ) تعمب الهكسوس إلى فلسطين وحاربهم حتى لضى على خطرهم .\nوبعد أن حرر أحمس األول مصر تماما من الهكسوس وجه اهتمامه إلى إعادة تنظيم البالد\nوتأسيس الدولة الحديثة .\nقامت بدور مهم فى تحرير البالد من الهكسوس دلل؟ حيث :\n• شجعت ابنيها كامس وأحمس على االستمرار فى الكفاح بعد ممتل أبيهما سمنن رع الثاني .\n• تولت شبون الحكم أثناء الحرب ضد الهكسوس نيابة عنهم إلى حين عودتهم منتصرين .\n دلل : تعددت األدوار الوطنية التي قام بها حكام طيبة خالل األسرتين الحادية عشرة\nوالسابعة عشرة؟\nحيث :\nفي عهد األسرة الحادية عشرة :\nنجح منتوحتب الثانى أول حاكم فى طيبة بعد عصر الدولة المديمة توحيد مصر بعد\nأن استطاع السيطرة على الوجه البحرى والمبلى بعد االنتصار على ملون أهناسيا .\nفي عهد األسرة السابعة عشرة :\nلام ملون طيبة بمحاربة الهكسوس حتى استطاع أحمس األول تحرير الببلد منهم .\nمصز بإفزيقيا فى عصز الدولة الوسطى\nٔ) اهتم المصريون المدماء بتؤمين الحدود الجنوبية وإلامة الحصون بداية من\nالجندل األول حتى الجندل الثالث .\nٕ) حرص المصريون المدماء على إلامة عبللات تجارية مع العديد من الحضارات اإلفريمية مثل حضارة كوش\nدلل؟ حيث تم تبادل الحلى والمجوهرات والعطور والمعادن والعاج والتوابل والزيوت مثل : زيت الزيتون\nوزيت النخيل ."],[63,"ٖ) ألام المصريون المدماء مراكز ومحطات تجارية على طول نهر النيل جنو ابا بم تفسر؟\nلتستخدم فى تخزين وتوزيع السلع المستوردة والمصدرة .\nٗ) أرسل المصريون المدماء البعثات الستخراج المعادن ما النتائج؟ مما كان له أثره في تبادل الثمافات .\nوللداللة على عمق العالقات بين مصر وإفريقيا أشار الملك أمنمحات األول إلى أنه\nابن لسيدة من الجنوب وتحدث عن عظمتها ومكانتها .\nالتدريب الثاىي\nس :1 من هو .. ؟\n(ٔ) بدأ النضال الحميمى لتحرير الببلد من الهكسوس .\n(ٕ) استطاع تخليص أجزاء كبيرة من مصر الوسطى من نفوذ الهكسوس .\n(ٖ) استطاع المضاء على خطر الهكسوس في مصر .\nس :2 ما األثر الناتج عن .. ؟\nتعاون الكوشيين مع الهكسوس .\nس :3 ما تقييمك لمصداقية العبارة التالية .. ؟\nاستطاع الهكسوس السيطرة على كل أنحاء مصر .\nس :4 دلل على صحة كل عبارة مما يأتى ... ؟\n(ٔ) كان لزوجة سمنن رع دور فى بث روح المماومة ضد الهكسوس .\n(ٕ) وجود عبللات تجارية بين ملون مصر فى عصر الدولة الوسطى وحضارة كوش بإفريميا ."],[64,"س :1 أكمل العبارات اآلتية بما يناسبها :\n(ٔ) سمى عصر الدولة الوسطى بـ . ....................\n(ٕ) نجح الملن منتوحتب الثانى فى االنتصار على ملون ................... في الشمال .\n(ٕ) نمل الملن أمنمحات األول عاصمة الببلد من .................... إلى . .......................\n(ٗ) ألام الملن أمنمحات الثالث سد البلهون عند مدخل بحيرة . ....................... .\nس ِبن نفرو حكم مصر عمب وفاة الملن . ....................... .\n(ه) تولت الملكة ُ\n( )ٙ بدأت رحلة الكفاح ضد الهكسوس من مدينة . ....................... .\n( )۷ حرص ملون الدولة الوسطى على إلامة عبللات تجارية مع العديد من الحضارات اإلفريمية مثل\nحضارة . .......................\nس :2 اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) تؤسس عصر الرخاء االلتصادى على يد حكام مدينة . .......................\n(طيبة - أواريس - إثيت تاوى « - من - نفر» )\n(ٕ) اتسعت رلعة الدولة المصرية فى عهد الملن منتوحتب الثانى جهة . .......................\n( الشمال - الجنوب - الشرق - الؽرب )\n(ٖ) كانت عاصمة مصر فى عصر األسرة الثانية عشرة مدينة . ............
