(بالنسبة لنظم الغابات في العالم الجديد) .\nس 11 دلل على صحة العبارات اآلتية :\nٔ) تعد الغابات من أهم النظم البيبية على سطح األرض .\nٕ) تضم األمريكتين عدداا من نظم الغابات .\nا\nتميزا عن بالي الغابات المطيرة بالعالم .\nٖ) تتسم غابات األمازون بسمات تجعلها أكثر\nٗ) تختلف خصابص أشجار نظام الغابات المدارية المطيرة في األمريكتين .\n٘) يواجه نظام غابات البحر المتوسط في شيلي عدة أخطار .\n)ٙ تستحوذ لارة أمريكا الشمالية على مساحة كبيرة من الغابات النفضية .\n)۷ تتعدد األخطار التي تواجه نظم الغابات في العالم الجديد .\n)۸ تنوع نظم الغابات في لارة أستراليا رغم صغر مساحتها .\nس -12 ماذا يحدث إذا ... ؟\nٔ) امتدت لارات العالم الجديد في عدد لليل من دوابر العرض (بالنسبة للنظم البيبية) .\nٕ) سمطلت أمطار غزيرة طوال العام بنظام الغابات الموسمية .\nٖ) تم الحفاظ على مساحة نظام غابات البحر المتوسط بشيلي .\nٗ) لم يتعرض نظام الغابات المخروطية لألخطار البشرية ."],[114,"س -13 ما العالقة بين ... ؟\nٔ) التضاريس والنظم البيبية في أمريكا الجنوبية .\nٕ) الخصابص المناخية وتدهور نظم الغابات الموسمية .\nٖ) األنشطة البشرية والغابات النفضية بالعالم الجديد .\nٗ) نظام الغابات الصنوبرية بمارات العالم الجديد والصناعة .\nأسئلة الكتاب المدرسي\nس 1 اكتب مدلول األرقام التي على الخريطة المقابلة :\nٔ) نظام الغابات . .................... .\nٔ) نظام الغابات . .................... .\nٔ) نظام الحشابش . ....................\nٔ) نظام غابات . ....................\nٔ) نظام الغابات . ....................\nٔ) نظام حشابش . .................... .\nٔ) نظام الغابات . .................... .\nٔ) دابرة . ....................\nس 2 صوب ما تحته خط فيما يلي :\nٔ) تُعد غابات األمازون الموطن األصلي ألشجار الصبار .\nٕ) تمثل حشابش التندرا مناطك انتمالية بين الغابات المدارية المطيرة والصحاري الحارة الماحلة .\nٖ) تستحوذ أمريكا الجنوبية على نصف مساحة الغابات النفضوية في العالم .\nٗ) يوجد نظام غابات البحر المتوسط في لارة أمريكا الشمالية في غرب ولية نيويورن .\n٘) أحد أشهر الحيوانات في نظام السافانا بؤستراليا الفيل .\nي )ٙ ظهر في شمال كندا والسكا نظام الحشابش المعتدلة .\nس .3 ما العالقة بين :\nنظام الغابات الصنوبرية ، والصناعة؟\nس 4 بم تفسر ... ؟\nٔ) تتعرض نظم الغابات في لارات العالم الجديد لتملص مساحاتها .\nٕ) تُعد غابات األمازون «ربة العالم» ومنظ اما للمناخ العالمي ."],[115," تشهد قارات العالم الجديد تباينا طبيعييا بين النظم الصحراوية والنظم المائية دلل؟\nحيث يوجد فى قارات العالم الجديد :\n نظم بيبية صحراوية لاحلة تعانى العجز المابى والندرة النباتية .\n نظم بيبية مابية شاسعة غنية بالموارد الطبيعية .\n ويُظهر هذا التباين قدرة اهلل جل جلاله في تنوُع أساليب تكيُف الكائنات التي تعيش في\nهذه النُظُم بما يضمن استدامة التوازن البيئي ، وذلك على الرغم من التحديات التي تتعرض\nلها تلك النُظُم .\n ما النتائج : تباين أساليب تكيف الكائنات بالنظم البيئية الصحراوية في قارات العالم\nالجديد؟\nترتب على ذلك : ضمان استدامة التوازن البيئي .\nأوالي : اليُُّظُه البيئية الصحراوية -:\nتتنوع النُظُم البيئية الصحراوية في قارات العالم الجديد تنوُعيا واضحيا بم تفسر؟\nوفقيا لمواقعها الفلكية ما بين الصحاري الحارة والمعتدلة والباردة ."],[116,"-1 نظاما الصحاري الحارة والمعتدلة -:\n*قارة أمريكا الشمالية : يوجد في :\n دلل : يتأثر توزيع نظامى الصحارى الحارة\nوالمعتدلة في أمريكا الشمالية بالتضاريس؟\nحيث يمتد نظاما الصحارى الحارة والمعتدلة فى غرب\nالمارة بالمناطك الوالعة خلف المرتفعات الجبلية .\n*قارة أمريكا الجنوبية : يوجد في :\nالمناطك التي يسودها الجفاف ، مثل : صحراء «أتاكاما» ،\nالتي تُعد أكثر مناطك العالم جفافاا .\n*قارة أستراليا : يوجد في :\nمعظم األجزاء الوسطى من لارة أستراليا .\n*الخصائص النباتية الحيوانية :\n تتميز الحياة الطبيعية في هذه النطاقات\nالصحراوية بنباتات وحيوانات قادرة على\nالتكيف مع الجفاف دلل؟ حيث يوجد :\nنباتات طبيعية مثل : صبار الساجوارو والتين الشوكي .\nحيوانات برية مثل : السلحفاة الصحراوية .\n بم تفسر : قدرة بعض الكائنات الحية على الحياة\nفي النظم الصحراوية المتنوعة بقارات العالم الجديد؟\nبسبب امتالن هذه الكابنات أساليب متنوعة للتكيف مع\nالجفاف والندرة النباتية ."],[117,"-2 نظاما الصحاري الباردة -:\n يُعرَّف هذا النظام أيضيا باسم «الصحاري الجليدية» .\n دلل : لنظام الصحارى الجليدية توزيع جغرافي محدود بقارات العالم الجديد؟ حيث :\n*قارة أمريكا الشمالية : يوجد في :\nاألطراف الشمالية لمارة أمريكا الشمالية .\nجزيرة جرينالند .\n*قارة أمريكا الجنوبية : يوجد في :\nنطالات محدودة في لارة أمريكا الجنوبية .\n*قارة أستراليا : يوجد في :\nل ينتشر في لارة أستراليا .\n*الخصائص النباتية الحيوانية :\nيتسم بمناخ لارس البرودة ل يساعد على نمو أي نباتات .\n بم تفسر : صعوبة نمو النباتات الطبيعية فى\nنظام الصحارى الجليدية؟\nألن هذا النظام يتسم بمناخ لارس البرودة ل يساعد على نمو أى نباتات .\n تتعرض النُظُم الصحراوية في قارات العالم الجديد للتدهور بم تفسر؟\nبسبب عوامل طبيعية وبشرية .\nمعلومة إثرائية :\nتُعد القارة القطبية الجنوبية (أنتاركتيكا) أكثر الصحاري برودةً وجفافيا في العالم ،\nويغطي الجليد نحو :98 من مساحتها ، وتحتوي القارة على نحو :90 من الجليد الموجود\nفي العالم ."],[118,"التدريب األول\nس :1 أكمل العبارات اآلتية بكلمات مناسبة :\nٔ) تنوع أساليب تكيف الكابنات التى تعيش بالنظم البيبية الصحراوية يإدى إلى ضمان استدامة . .......\nٕ) تتنوع النظم البيبية الصحراوية فى العالم الجديد تنوعاا واض احا وفماا لـ . .......\nٖ) الصحراء التي تُعد أكثر مناطك العالم جفافاا وتمع فى أمريكا الجنوبية هى . .......\nٗ) تنمو بنظاما الصحارى الحارة والمعتدلة نباتات مثل التين الشوكى وصبار . .......\nس :2 اكتب كلمة ( صواب ) أوكلمة (خطأ) ، مع التصويب :\nٔ) يمتد نظام الصحارى الباردة فى األطراف الشمالية لمارة أمريكا الجنوبية .\nٕ) يوجد نظام الصحارى الحارة بمارة أستراليا في معظم األجزاء الوسطى من المارة ( .\nٖ) تتكيف السلحفاة الصحراوية مع البيبة ذات المناخ البارد .\nٗ) تتبع جزيرة جرينالند نظام الصحارى المعتدلة .\nس :3 بم تفسر ... ؟\nٔ) وجود نباتات مثل الصبار في الصحارى الحارة .\nٕ) صعوبة نمو النباتات فى الصحارى الباردة .\nس :4 دلل على صحة كل عبارة من العبارات اآلتية :\nٔ) يوجد تباين في النظم البيبية الصحراوية والمابية الموجودة بمارات العالم الجديد .\nٕ) يتؤثر توزيع نظاما الصحارى الحارة والمعتدلة في أمريكا الشمالية بالتضاريس .\nٖ) يختفى نظام الصحارى الباردة فى إحدى لارات العالم الجديد ."],[119,"ثاىييا : اليُُّظُه البيئية املائية -:\nتتنوع النُظُم البيئية المائية في قارات العالم الجديد ما بين النُظُم البيئية للمياه العذبة\nوالنُظُم البيئية للمياه المالحة .\nالنُظُم البيئية للمياه المالحة\nالنُظُم البيئية للمياه العذبة\n)1 النظم النهرية .\n)1 النظم البحرية .\n)2 النظم البحيرية العذبة .\n)2 نظم الشعاب المرجانية .\n)3 نظم األراضي الرطبة العذبة .\n)3 نظام المانجروف .\n)4 النظم البحيرية المالحة ."],[120,"ظمُ البيئية للمياه العذبة :\n)1 النُ ُ\nتتعدد النُظُمُ البيئية للمياه العذبة في قارات العالم الجديد ومن أهمها :\nأ - النُظُمُ النهرية في قارات العالم الجديد :\n*في األمريكتين :\n دلل : تتعدد النظم النهرية في األمريكتين؟\nحيث :\nحيث يوجد فى األمريكتين عديد من النظم النهرية التى تجرى في أحواض واسعة وتخترق الغابات\nوالسهول مثل :\n نهر المسيسبى فى أمريكا الشمالية .\n ونهر األمازون في أمريكا الجنوبية(أحد أطول أنهـار العالم وأكثرها ميا اها) .\nمعلومة إثرائية :\nنهر األمازون أكبر األنهار في العالم من حيث حجم التصريف المائي (حجم المياه التي\nتجري به)؛ حيث يجري به نحو خُمس المياه العذبة التي تجري في أنهار العالم ، ويأتي\nفي المرتبة الثانية من حيث الطول بعد نهر النيل .\n* قارة أستراليا :\n تعاني النُظُمُ النهرية بها تذبذُبَّ منسوب المياه ، مثل : نهر (دارلنج)بم تفسر؟ بسبب :\n- للة كمية األمطار .\n- وزيادة معدل البخر .\nب - النُظُمُ البحيرية العذبة في قارات العالم الجديد :\n بم تفسر : أهمية النظم البحيرية العذبة بقارات العالم الجديد؟ ألنها تعد من :\n أهم خزانات المياه العذبة السطحية فى العالم .\n تمثل نظا اما بيبيا فريداا يوفر موطناا آللف الكابنات الحية ."],[121,"*البحيرات العظمى الخمس :\n توجد البحيرات العظمى ال َخ ْمس في لارة أمريكا الشمالية .\n تُم ِث ّل أكبر نظام لبحيرات المياه العذبة في العالم .\nي  ضم بحيرات (إونتاريو – إيري – هورن – ميتشجن – سوبيريور) .\nي  ربط نهر سانت لورانس البحيرات العظمى بالمحيط األطلنطي .\n وجميعها تمر بها الحدود الدولية بين الوليات المتحدة وكندا ، عدا بحيرة ميتشجن ، التي تمع بالكامل\nفي الوليات المتحدة .\n دلل : معظم البحيرات العظمى بقارة أمريكا الشمالية تمربها حدود دولية؟\nحيث تمر بالبحيرات العظمى الخمس حدود دولية بين الوليات المتحدة وكندا عدا بحيرة ميتشجن التي\nتمع بالكامل في الوليات المتحدة .\n*بحيرة سوبيريور :\n وتُعَد بحيرة سوبيريور أكبر بحيرة عذبة في العالم من حيث المساحة .\nي  وجد بها نحو ٓٔۺ من إجمالي المياه العذبة السطحية غير المتجمدة في العالم .\nكثيرا ما تحدث بها أمواج يصل ارتفاعها إلى عدة أمتار في أثناء العواصف الشديدة بم تفسر؟\nا\nنظرا لتساع مساحة البحيرة .\nا"],[122," بم تفسر : األهمية االقتصادية لبحيرة سوبيريور؟\n تتميز بالمناظر الطبيعية الخالبة ما النتائج ؟ التى جعلتها وجهة سياحية رابعة الجمال .\n تتميز البحيرة بالتنوع البيولوجي دلل؟ حيث تضم أكثر من ٓ ۸ نوع من األسمان مثل سمن\nالسلمون والسمن األبيض .\n*بحيرة تيتكاكا :\n توجد في قارة أمريكا الجنوبية وتعد :\n أعلى بحيرة صالحة للمالحة في العالم .\n أكبر بحيرة عذبة من حيث المساحة .\n أهم مصدر مابي عذب في مرتفعات اإلنديز في دولتي بيرو وبوليفيا .\n وتتميز البحيرة بتنوعها الحيوي دلل؟ إذ تضم عديداا من النباتات\nوالكابنات المابية ، خاصةا بعض أنواع البرمابيات .\n بم تفسر : إقامة محمية طبيعية في منطقة بحيرة تيتكاكا؟\n- أهميتها البيبية .\nمن أجل :\nالحفاظ على مواردها الطبيعية . ظمُ البيئية للمياه المالحة :\n)1 النُ ُ\nأ - النُظُم البحرية :\n*قارة أمريكا الشمالية :\n كثرة الخلجان ، مثل :\nخلي َجي المكسين وهدسن .\n تطل على : البحر الكاريبي .\n*قارة أمريكا الجنوبية :\n تمل بها الخلجان ، ومن أهمها :\nخليج سان جورج .\n تطل على : البحر الكاريبي .\n*قارة أستراليا :\n ت ُ ِطل على : بحر أرافورا والخليج األسترالي الكبير ."],[123," تمر أمام سواحل قارات العالم الجديد العديد\nمن التيارأت البحرية الباردة والدافئة ما النتائج؟ مما ساهم في :\nتشكيل الخصابص المناخية والبيبية للسواحل ، وهو ما ينعكس إيجابييّا\nعلى ازدهار النُّ ُ\nظم البيبية الساحلية .\nب - نُظُم الشعاب المرجانية :\nالتيارات البحرية :\nهي تدفمات مستمرة ومنتظمة\nللمياه في البحار\nوالمحيطات ، تتحرن في\nمسارات ُمحدَّدة ،\nوتتنوع تبعاا لدرجة\nحرارتها .\n تنتشر في بعض المناطق المدارية بقارات العالم الجديد دلل؟ ، مثل :\nحاجز بليز المرجاني\n يقع على ساحل أقصى\nجنوب أمريكا الشمالية .\nالحاجز المرجاني العظيم\n يوجد في شرق أستراليا .\n بم تفسر : شهرة الحاجز المرجاني العظيم بشرق أستراليا؟\nيُ  عد ثاني أكبر حاجز مرجاني في ي  عد أكبر نظام مرجاني في العالم من حيث المساحة .\nتنوع للشُّعاب المرجانية في العالم .\nي  ضم أكبر ُّ\nالعالم .\nا\nموبال ربيسييّا للعديد من الكابنات المه َّددة\n ويُش ِ ّكل هذا النظام\nبالنمراض ، مثل : السالحف الخضراء .\nجـ - نظام المانجروف :\n*قارة أمريكا الشمالية ، : ينتشر على :\nسواحل ُج ُزر البحر الكاريبي ، وسواحل فلوريدا .\n*قارة أمريكا الجنوبية :\nيوجد بها أكبر امتداد للمانجروف في العالم دلل؟\nحيث ينتشر بشكل واسع على :\n طول السواحل الشرلية والشمالية والشمالية الغربية .\n عند مصب نهر األمازون .\n*قارة أستراليا :\nينتشر على السواحل الشمالية لمارة أستراليا ."],[124,"التدريب الثاني\nس :1 اكتب ما تشير إليه كل عبارة من العبارات اآلتية :\nالسطحية غير المتجمدة .\nٕ) أعلى بحيرة عذبة صالحة للمالحة في العالم .\nٖ) بحيرة عذبة تمع بالكامل فى الوليات المتحدة األمريكية .\nٗ) لارة ينتشر على سواحلها أكبر امتداد للمانجروف بالعالم .\nس :2 ما المقصود بـ : التيارات البحرية ؟\nس :3 بم تفسر ... ؟\nٔ) تذبذب منسوب المياه فى نهر دارلنج بؤستراليا .\nٕ) حدوث أمواج يصل ارتفاعها لعدة أمتار فى بحيرة سوبيريور ..\nٖ) تتميز بحيرة تيتكاكا بتنوعها الحيوى الفريد .\nٗ) إنشاء محمية بحيرة تيتكاكا الطبيعية .\nس :4 دلل على صحة كل عبارة من العبارات اآلتية :\nٔ) تمتلن أمريكا الشمالية نظا اما بحيرياا عذباا فريدا من نوعه عالمياا .\nٕ) تساهم التيارات البحرية فى ازدهار النظم البيبية الساحلية لمارات العالم الجـ\nٖ) تعد لارة أستراليا موطناا ألكبر النظم البيبية للشعاب المرجانية في العالم .\nٗ) للحاجز المرجاني العظيم بؤستراليا دور بارز فى حماية التنوع البيولوجى .\nس :5 قارن بين : حاجز بليز المرجاني ، والحاجز المرجاني العظيم ، من حيث :\n*المولع .\n*الترتيب العالمى فى المساحة ."],[125,"س 1 استعن بخريطة األمريكتين المقابلة ، وأجب حسب المطلوب :\nٔ) المحيط الهادى يمثله الرلم ( )\nٕ) البحر الكاريبى يمثله الرلم ( )\nٖ) خليج هدسن يمثله الرلم ( )\nٗ) نهر سانت لورانس يمثله الرلم ( )\n٘) نهر األمازون يمثله الرلم ( )\n)ٙ نهر المسيسبي يمثله الرلم ( )\n)۷ أعلى بحيرة عذبة صالحة للمالحة\nفي العالم يمثله الرلم ( )\n)۸ أكبر بحيرة عذبة في العالم من حيث المساحة\nيمثله الرلم ( )\n)۹ البحيرة التى تمع بالكامل في الوليات المتحدة\nاألمريكية تحمل الرلم ( )\nٓٔ) خليج سان جورج يمثله الرلم ( )\nس 2 أمامك خريطة لقارة أستراليا : ،\nٔ) نهر . ..................... :\nٕ) المحيط . .................... :\nٖ) المحيط . ...................... :\nٗ) إحدى نظم المياه المالحة . ............. :\nس 3 اختر اإلجابة الصحيحة مما بين القوسين :\nٔ) يمتد نظاما الصحارى الحارة والمعتدلة بمارة أمريكا الشمالية في جهتها . ........\n(الشمالية - الجنوبية - الشرلية - الغربية)\nٕ) تمتد صحراء أتاكاما في لارة .........\n(أمريكا الشمالية - أستراليا - أنتاركتيكا - أمريكا الجنوبية)\nٖ) يوجد نظاما الصحارى الحارة والمعتدلة بمارة أستراليا في .........\n(معظم أجزابها الوسطى - الساحل الشرلي للمارة - ألصى شمالها الشرلي - ألصى جنوبها الغربي)"],[126,"ٗ) أى من الحيوانات التالية تعيش بالنظام البيبى الذى يوجد غرب أمريكا الشمالية خلف المرتفعات\nالجبلية؟ ( ......... ثور المسن - السلحفاة الصحراوية - نسر اإلنديز - النمر األمريكي)\n٘) يعد نظام الصحارى الباردة من األنظمة البيبية التى ل تنتشر بمارة .........\n(أمريكا الشمالية - أمريكا الجنوبية - أستراليا - أنتاركتيكا)\n)ٙ أى من المناطك التالية يمكن مشاهدة النبات الموضح بالصورة (صبار الساجوارو) التي أمامن\nفيها؟ ( ... جنوب شرق أستراليا - جزيرة جرينالند - صحراء أتاكاما - األطراف الشمالية بمارة أمريكا\nالشمالية)\n)۷ تظهر الصحارى الجليدية بمارة أمريكا الشمالية في .........\n(السهول الوسطى - سواحل خليج المكسين - جزيرة جرينالند - صحراء أتاكاما)\n)۸ تنتشر نظم الشعب المرجانية بمارات العالم الجديد فى بعض المناطك .......................\n(المدارية - الجليدية - المعتدلة - الباردة)\nي )۹ متد حاجز بليز المرجاني على ساحل ألصى .......................\n(شمال أمريكا الشمالية - جنوب أستراليا - شمال أستراليا - جنوب أمريكا الشمالية)\nٓٔ) يمتد الحاجز المرجاني العظيم في أستراليا بجهتها .......................\n(الشمالية - الجنوبية - الشرلية - الغربية)\n(أستراليا - أمريكا الجنوبية - أمريكا الشمالية - أنتاركتيكا)\nٕٔ) ينتشر المانجروف على سواحل لارة أستراليا خاصة فى جهتها .......................\n(الشمالية - الجنوبية - الشرلية - الغربية)\nس :1 اكتب كلمة ( صواب ) أوكلمة (خطأ) ، مع التصويب :\nٔ) توجد في لارات العالم الجديد نظم بيبية بعضها صحراوية واخرى مابية أخرى غنية .\nٕ) تتكيف الكابنات التى تعيش بالنظم البيبية الصحراوية والمابية مع بيبتها بما يضمن استدامة التوازن\nالبيبي .\nٖ) يمتصر وجود نظم الصحارى بمارات العالم الجديد على الصحارى الباردة .\nٗ) يمتد نظاما الصحارى الحارة والمعتدلة خلف المرتفعات الشرلية بمارة أمريكا الشمالية .\n٘) ينتشر نظاما الصحارى الحارة والمعتدلة بمارة أستراليا .\nيُ )ٙ عرف اسم الصحارى الباردة باسم الصحارى الجليدية .\nي )۷ ظهر نظام الصحارى الباردة بنطالات محدودة من لارة أمريكا الجنوبية .\n)۸ تتميز الحياة الطبيعية في نظامى الصحارى الحارة والمعتدلة بوجود نباتات وحيوانات لادرة على\nالتكيف مع الجفاف .\n)۹ تتعرض النظم الصحراوية في لارات العالم الجديد للتدهور نتيجة عوامل طبيعية وبشرية .\nٓٔ) تضم بحيرة تيتيكاكا العديد من النباتات والكابنات المابية خاصة بعض أنواع البرمابيات ."],[127,"ٕٔ) للتيارات البحرية أمام سواحل لارات العالم الجديد دور فى ازدهار النظم البيبية الساحلية ) ( .\nٖٔ) يعد حاجز بليز المرجاني والحاجز المرجاني العظيم أشهر نظم الشعب المرجانية بمارات العالم\nالجديد .\nٗٔ) ينتشر نظام المانجروف بمارة أمريكا الجنوبية على سواحل فلوريدا .\nس 5 أكمل العبارات اآلتية بكلمات مناسبة :\nٔ) تعد النظم البيبية المابية بمارات العالم الجديد غنية بـ .......................................\nٕ) تتنوع النظم الصحراوية في لارات العالم الجديد بسبب مولعها .......................................\nٖ) تتمثل أهم النظم الصحراوية بمارات العالم الجديد في الصحارى الحارة و ............... و .............\nٗ) ينتشر نظاما الصحارى الحارة والمعتدلة بمارة أمريكا الجنوبية في المناطك التى يسودها\n....................... و .......................\n٘) تنمو النباتات الطبيعية بنظامى الصحارى الحارة والمعتدلة بمارة أمريكا الشمالية مثل\n....................... و .......................\n)ٙ من أهم خلجان لارة أمريكا الجنوبية خليج .......................................\n)۷ تمر أمام سواحل لارات العالم الجديد العديد من التيارات البحرية ................ و ...............\n)۸ من أمثلة الكابنات المهددة بالنمراض فى الحاجز المرجاني العظيم .......................\nو ....................... و .......................\nي )۹ نتشر نظام المانجروف بشكل واسع بمارة أمريكا الجنوبية على طول السواحل الشرلية\nو ....................... و .......................\nس 6 صوب ما تحته خط :\nٔ) يسود صحراء أتاكاما بمارة أستراليا نظاما الصحارى الحارة والمعتدلة .\nٕ) يعد التين الشوكى من أمثلة النباتات التي تنمو بنظام الصحارى الباردة .\nٖ) يمتد نظاما الصحارى والحارة والمعتدلة باألطراف الشمالية لمارة أمريكا الشمالية الشمالية .\nٗ) يتسم مناخ جزيرة جرينالند بالعتدال .\nس 7 اكتب ما تشير إليه كل عبارة مما يأتى :\nٔ) نظم بيبية لاحلة تعانى من العجز المابي والندرة النباتية .\nٕ) صحراء بؤمريكا الجنوبية تعد أكثر مناطك العالم جفافا ا .\nٖ) إحدى الجزر التابعة لمارة أمريكا الشمالية ويسودها نظام الصحارى الجليدية .\nٗ) أحد أنظمة الصحارى التي تتسم بمناخ لارس البرودة ل يساعد على نمو النباتات ."],[128,"س 8 بم تفسر ... ؟\nٔ) لدرة بعض الكابنات الحية على الحياة فى النظم الصحراوية المتنوعة بمارات العالم الجديد .\nٕ) لدرة صبار الساجوارو على النمو فى صحارى أمريكا الشمالية .\nٖ) صعوبة نمو النباتات الطبيعية فى نظام الصحارى الجليدية .\nٗ) أهمية بحيرة تيتيكاكا لدولتى بيرو وبوليفيا .\n٘) إلامة محمية طبيعية فى منطمة بحيرة تيتيكاكا .\n)ٙ ازدهار النظم البيبية الساحلية لمارات العالم الجديد .\n)۷ األهمية الحيوية للحاجز المرجاني العظيم .\nس 9 ما النتائج المترتبة على ... ؟\nٔ) تباين أساليب تكيف الكابنات بالنظم البيبية الصحراوية فى لارات العالم الجديد .\nٕ) وجود نظامى الصحارى الحارة والمعتدلة بغرب لارة أمريكا الشمالية (بالنسبة للتنوع الحيوي) .\nٖ) سيادة مناخ الصحارى الباردة فى جزيرة جرينالند (بالنسبة للنباتات) .\nٗ) سيادة الجفاف فى األجزاء الوسطى ألستراليا بالنسبة للنباتات الطبيعية .\n٘) تتميز بحيرة سوبيريور بالمناظر الطبيعية الخالبة .\n)ٙ األهمية البيبية لبحيرة تيتيكاكا .\n)۷ مرور التيارات البحرية الباردة والدافبة أمام سواحل لارات العالم الجديد .\nس 10 دلل على صحة العبارات اآلتية :\nٔ) تشهد لارات العالم الجديد تبايناا طبيعياا بين النظم الصحراوية والنظم المابية .\nٕ) تتنوع النظم البيبية الصحراوية بمارات العالم الجديد .\nٖ) توجد خصابص حيوية متميزة لنظاما الصحارى الحارة والمعتدلة .\nٗ) لنظام الصحارى الجليدية توزيع جغرافى محدود بمارات العالم الجديد .\n٘) التنوع الحيوى لبحيرة تيتيكاكا .\n)ٙ تحتوى بعض سواحل أمريكا الشمالية على إحدى الحواجز المرجانية .\n)۷ شهرة الحاجز المرجاني العظيم بشرق أستراليا .\n)۸ وجود نظام المانجروف بمارات العالم الجديد .\nس 11 ما العالقة بين ... ؟\nٔ) النظم البيبية الصحراوية ، والمولع الفلكى بمارات العالم الجديد .\nٕ) الحياة النباتية ، ومناخ نظام الصحارى الباردة .\nٖ) موارد بحيرة تيتيكاكا ، استدامة الموارد الطبيعية .\nٗ) التيارات البحرية ، وسواحل لارات العالم الجديد .\n٘) الكابنات المهددة بالنمراض ، والحاجز المرجانى العظيم .\n)ٙ نهر األمازون ، ونظام المانجروف ."],[129,"(أسئلة الكتاب المدرسي)\nس 1 اكتب مدلول األرقام التى على الخريطة المقابلة :\nٔ) نهر . ...................................... :\nٕ) صحراء . ...................................... :\nٖ) أحد النظم البحيرية العذبة . ................... :\nٗ) نظام الصحارى . ............................... :\n٘) المحيط . ...................................... :\n)ٙ المحيط . ...................................... :\n)۷ خليج . ...................................... :\nس 2 قارن بين :\nنهري المسيسبي ، واألمازون ، من حيث :\nالمارة التى ينتمى إليها كل منهما ، واتجاهه ، والمصب .\nس 3 صوب ما تحته خط :\nٔ) أشهر النظم النهرية بمارة أمريكا الشمالية نهر األمازون .\nٕ) أكبر بحيرة عذبة سطحية فى العالم من حيث المساحة هي بحيرة إيرى ( .\nٖ) أكبر امتداد لنظام المانجروف فى العالم يوجد بمارة أستراليا .\nٗ) البحيرة األولى عالمييّا من حيث الرتفاع والصالحية للمالحة هي متشجن ( .\n٘) ثانى أكبر حاجز مرجاني في العالم هو حاجز بحر المرجان .\nي )ٙ نتشر نظام المانجروف فى السواحل الجنوبية ألستراليا .\nس 4 بم تفسر ... ؟\nٔ) تذبذب منسوب المياه فى نهر دارلينج بؤستراليا .\nٕ) أهمية الحاجز المرجاني العظيم بمارة أستراليا .\nس 5 ما النتائج المترتبة على ... ؟\nٔ) مرور عديد من التيارات البحرية أمام سواحل لارات العالم الجديد .\nٕ) اتساع مساحة بحيرة سوبيريور ."],[130," شهد العالم منذ الثورة الصناعية األولى توسعيا كبيريا في األنشطة البشرية ، دلل؟ مثل :\n- التصنيع .\n- تطوير وسائل النقل .\n- إزالة الغابات .\n- حرق الوقود األحفوري .\n ما النتائج : التوسعيا الكبير في األنشطة البشرية ؟\nأدى إلى :\nزيادة انبعاثات الغازات المُسببة لالحتباس الحراري ، وبالتالي حدوث تغيرات مناخية عالمييا .\nأوالي : التغري املياخي -:\nأوليا : المقصود بالتغير المناخي :\nهو اختالل شامل وطويل األمد في مناخ األرض ، وخاصةً في درجات الحرارة وسقوط األمطار؛\nنتيجة تغيُر في تركيب الغالف الجوي ألسباب طبيعية وبشرية .\n ما النتائج : حدوث التغيرات المناخية بالنسبة لمناخ األرض ؟ ترتب على ذلك :\nاختالل شامل وطويل األمد في مناخ األرض ، وخاصةا في درجات الحرارة وسموط األمطار .\n ما العالقة بين : تركيب الغالف الجوي و التغير المناخي؟\nحيث يحدث التغير المناخى نتيجة حدوث تغيير فى تركيب الغالف الجوى وذلن عندما يزيد\nتركز الغازات الدفيبة عن معدلتها الطبيعية والتى تحدث ألسباب بشرية وطبيعية ."],[131,"ثاىييا : العوامل الرئيشية للتغري املياخي\n يحدث التغير المناخي نتيجة لعوامل بشرية وأخرى طبيعية دلل؟ ،\nوتتمثل العوامل البشرية فيما يلي :\n-1 العوامل البشرية -:\n-2 العوامل الطبيعية -:\n)1 انبعاث الغازات الدفيئة (غازات االحتباس الحراراي) .\n)1 الحرائق الطبيعية للغابات .\n)2 قطع األشجار الغابات .\n)2 النشاط البركاني .\n)3 التوسع الحضري وبناء مدن خرسانية طرق\n)3 ذوبان الجليد في القطبين .\n)4 تحلل الحيوان والنبات .\nأسفلتية .\n-1 العوامل البشرية -:\n-1 انبعاث الغازات الدفيئة (غازات االحتباس الحراري) -:\n خلق اهلل جل جلاله الغازات الدفيئة (مثل : ثاني أكسيد الكربون ، والميثان) في الغالف الجوي\nبنسب مُحدَّدة بم تفسر؟ لكي تحبس جز اءا من حرارة الشمس داخل األرض وتمنعها من التسرب إلى\nالفضاء؛ مما يُو ِفّر الدفء الالزم للحياة على كوكب األرض .\nأي أن : دون هذه الغازات كانت حرارة األرض ستنخفض إلى ما تحت الصفر المئوي .\nأثر األنشطة البشرية على نسب الغازات الدفيئة في الغالف الجوي :\n ما النتائج : التوسع الكبير في األنشطة البشرية منذ الثورة الصناعية األولى؟\nأدت إلى زيادة تركيزات الغازات الدفيبة في الغالف الجوي عن معدلتها الطبيعية؛ مما أدى إلى\nالحتفاظ بكميات أكبر من الحرارة في الغالف الجوي ، وبالتالي حدوث الحتباس الحراري الذي يُعد\nالمحرن األساسي للتغير المناخي .\n بم تفسر : حدوث ظاهرة االحتباس الحراري؟ بسبب : زيادة تركيزات الغازات الدفيبة في\nالغالف الجوي عن معدلتها الطبيعية؛ مما أدى إلى الحتفاظ بكميات أكبر من الحرارة في الغالف\nالجوي ."],[132,"من الشكل المقابل نالحظ -:\nأهم الغازات الدفيئة التي تؤثر في االحتباس الحراري وهي :\n غاز ثااني أكسد الكربون (المركز األول ) .\n غاز الميثان(المركز الثاني) .\n-2 قطع أشجار الغابات -:\n ما النتائج : قطع أشجار الغابات؟\nأدى إلى :\nزيادة نسبة غاز ثاني أكسيد الكربون في الغالف الجوي .\n-3 التوسع الحضري وبناء مدن خرسانية وطُرُق إسفلتية -:\n ما النتائج : التوسع الحضري وبناء مدن خرسانية وطُرُق إسفلتية ؟ أدى إلى :\nزيادة امتصاص الطالة الشمسية وإعادة إشعاعها في الغالف الجوي؛ مما أسهم في ارتفاع درجات\nالحرارة وتغيَُّر أنماط المناخ .\n-2 العوامل الطبيعية\n-1 الحرائق الطبيعية للغابات -:\n ما النتائج : الحرائق الطبيعية للغابات ؟\nأدى إلى :\nانبعاث كميات كبيرة من غاز ثاني أكسيد الكربون؛ مما يزيد من الحتباس الحراري .\n-2 النشاط البركاني -:\n ما النتائج : حدوث الثورانات البركانية بالنسبة للغالف الجوي؟ أدى إلى :\nغازات مختلفة منها ثاني أكسيد الكربون لكن إسهامها في الحتباس الحراري محدود جديّا ممارنةا\nباألنشطة البشرية .\n-3 تحلُل الحيوان والنبات -:\n ما النتائج : تحلُل الحيوان والنبات ؟ أدى إلى :\nتحلُّل الكابنات الحية بعد موتها إلى إطالق الغازات الدفيبة ، مثل : ثاني أكسيد الكربون ، والميثان ."],[133,"-4 ذوبان الجليد في القطبين -:\n ما النتائج : ذوبان الجليد في القطبين ؟ أدى إلى :\nتحلُّل المواد العضوية المـ ُ َخ َّزنة في التربة؛ مما يإدي إلى إطالق كميات كبيرة من َ\nغازي الميثان وثاني\nأكسيد الكربون .\nالتدريب األول\nس :1 أكمل العبارات اآلتية بكلمات مناسبة :\nكبيرا فى األنشطة البشرية مثل التصنيع ...... و . .......\nٔ) شهد العالم منذ الثورة الصناعية األولى توسعاا\nا\nٕ) يحدث التغير المناخى نتيجة تغير فى تركيب الغالف الجوى ألسباب ...... وأخرى . .......\nٖ) يإثر لطع األشجار سلباا على الغالف الجوى حيث يإدى إلى زيادة نسبة غاز . .............\nس :2 اكتب كلمة ( صواب ) أوكلمة (خطأ) ، مع التصويب :\nٔ) ترتب على التوسع باألنشطة الصناعية حدوث تغيرات مناخية عالمية .\nٕ) يساهم تحلل الحيوانات والنباتات بعد موتها في إطالق الغازات الدفيبة .\nس :3 بم تفسر ... ؟\nٔ) أهمية وجود الغازات الدفيبة بالغالف الجوى بنسب محددة .\nٕ) يإثر ذوبان الجليد فى حدوث تغيرات مناخية .\nس :4 ما المقصود بـ : التغير المناخي ؟\nس :5 ما النتائج المترتبة على ... ؟\nٔ) التوسع الحضرى وبناء المدن الخرسانية وطرق األسفلت\nٕ) حدوث الثورانات البركانية بالنسبة للغالف الجوى .\nس :6 ما العالقة بين : حرابك الغابات الطبيعية ، وغاز ثاني أكسيد الكربون ؟"],[134,"ثالجيا : تأثريات التغري املياخي\n يُؤثر التغير المناخي على كل من : النُظُم البيئية والموارد المائية والجوانب االقتصادية\nواالجتماعية كما يلي :\n-1 تأثيره على النُظُم البيئية والموارد المائية -:\n يُعد التغير المناخي من أكبر التهديدات التي تُواجه النُظُم البيئية والتنوع الحيوي في\nالعالم ، دلل؟ ويتضح ذلك فيما يلي :\nٔ) ارتفاع درجة حرارة مياه سطح المحيطات : ما النتائج؟ مما يؤدي إلى هجرة بعض الكابنات\nالبحرية نحو المناطك الباردة؛ مما تسبَّب في ضعف بعضها وموتها ، وهو ما يُإثّر سلباا على\nأنشطة الصيد والسياحة .\nٕ) حدوث موجات الحر والجفاف المتكررة : ما النتائج؟ تإدي إلى نمص الموارد المابية العذبة .\n-2 تأثيره على األنشطة االقتصادية -:\n*الزراعة ( : ما العالقة بين : التغير المناخي و األمن الغذائي)\n دلل : يؤثر التغير المناخي بالسلب على الزراعة؟ حيث يؤدي إلى :\n- انتشار اآلفات الزراعية .\nانخفاض إنتاجية بعض المحاصيل الزراعية . - تد ُهور التربة .\n- ترا ُجع إنتاج الثروة الحيوانية .\nمما يُهدد األمن الغذائي .\n*النقل والتجارة :\n تتعرض البنية التحتية للنقل والطاقة لمخاطر متزايدة بسبب التغير المناخي دلل؟ حيث :\n تؤدي حرائق الغابات إلى تعطيل ال ُّ\nطرق وشبكات الكهرباء .\n يؤدي ذوبان الجليد إلى تدمير ال ُّ\nطرق وخطوط األنابيب .\n يؤدي ارتفاع مستوى سطح البحر وزيادة شدة العواصف البحرية إلى :\n- تآكُل السواحل .\n- تعطيل حركة النمل البحري والجوي ."],[135,"-3 تأثير التغير المناخي على الجوانب االجتماعية -:\n* صحة اإلنسان :\n بم تفسر : يؤثر التغير المناخى على صحة اإلنسان ؟ ألن التغير المناخي يتسبب في :\nتدهور جودة الهواء مما يزيد من :\n انتشار عديد من األمراض مثل :\n- األمراض التنفسية .\n- األمراض المنمولة مثل المالريا .\n- األمراض المرتبطة بالحرارة .\n ارتفاع معدالت الوفيات .\n*النزوح السكاني :\n دلل : يؤثر التغير المناخى على النزوح السكاني ؟\nحيث أدى التغير المناخي وما نتج عنه من :\n- كوارث طبيعية .\n- تدهور األراضي الزراعية .\n- جفاف .\nإلى نزوح السكان من مناطقهم إلى مناطق أكثر أمانيا .\nمعلومة إثرائية : من المحتمل أن يؤدي ارتفاع مستوى سطح البحر بحلول عام 2050 م إلى\nإغراق مساحات من المناطق الساحلية المنخفضة ، ونزوح أكثر من 140 مليون شخص من المدن\nالساحلية إلى الداخل على مستوى العالم .\n*التراث الثقافي العالمي :\n دلل : يؤثر التغير المناخى التراث الثقافي العالمي ؟ حيث :\nتتعرض الموالع األثرية والتراثية لعدة مخاطر نتيجة التغيرات المناخية حيث تتعرض إلى :\n- خطر الفيضانات .\n- ارتفاع مستوى سطح البحر .\n بم تفسر : يتأثر قطاع السياحة بالتغير المناخ؟\n- العواصف .\nبسبب :\n تعرض الموالع األثرية والتراثية لخطر الفيضانات وارتفاع مستوى سطح البحروالعواصف .\n هجرة بعض الكابنات البحرية نحو المناطك الباردة بسبب ارتفاع حرارة مياه سطح المحيطات مما\nيإثر سلباا على السياحة ."],[136,"رابعيا : اجلَود الدولية للحد مي التغري املياخي\n دلل : تسعى الدول إلى الحد من التغير المناخي ؟ حيث من خالل :\n)1 التوسع في استخدام الطاقة المتجددة وحماية الغابات .\n)2 رفع الوعي البيئي .\n)3 تطبيق الزراعة الذكية مناخييا .\n)4 تطوير وسائل نقل صديقة للبيئة .\nولتحقيق ذلك عُقدت -:\n-1 االتفاقيات والمبادرات الدولية -:\n*تعددت االتفاقيات الدولية للحد من التغير المناخي وتأثيراته ، ومن أهمها :\nٔ) اتفاقية األمم المتحدة اإلطارية بشأن تغيُر المناخ ( 1992 م) بم تفسر؟ -:\n تهدف إلى : تثبيت تركيزات غازات الحتباس الحراري في الغالف الجوي .\nٕ) مبادرة التحالف الدولي للطاقة الشمسية \" -: شمس واحدة ، عالم واحد ، شبكة واحدة\" :\n تهدف إلى : ربط شبكات الكهرباء عبر المارات بم تفسر؟\nلضمان نمل الطالة الشمسية من المناطك التي تسطع فيها الشمس إلى المناطك المظلمة .\n الشعار ُ : مت َّ ِخذة شعار \"الشمس ل تغيب أ َبداا\" بم تفسر؟ لتمليل العتماد على الولود األحفوري .\n-2 المؤتمرات الدولية للمناخ -:\n دورة االنعقاد : تعقَّد سنوييا مؤتمرات األمم المتحدة لتغير المناخ « .»COP\n بم تفسر : عقَّد األمم المتحدة مؤتمرات سنوييا لتغير المناخ « »COP ؟ بهدف :\n الهدف : لمتابعة تنفيذ االتفاقيات الدولية للحد من التغير المناخي ."],[137,"مؤتمر شرم الشيخ للمناخ ( :)COP27\n اهتم بمضية «الخسابر واألضرار» التي تَلحك بالدول المتضررة من التغيرات المناخية .\n ما النتائج : عقد مؤتمر شرم الشيخ للمناخ ( )COP27 ؟\nترتب على ذلك إطالق مبادرات متعددة من أجل :\n التوسع في استخدام الطالة المتجددة .\n خفض انبعاثات غاز الميثان .\nلذا توجَّه العالم نحو التكيف مع التغير المناخي في تخطيط المدن الجديدة ، مثل : العاصمة\nاإلدارية الجديدة بمصر .\nخامشيا : دور الفرد للحد مي التغري املياخي\n يمكن للفرد اإلسهام في الحد من التغير المناخي باتباع بعض السلوكيات دلل؟ أهمها :\n)1 استخدام األجهزة المُوفرة للطاقة .\n)2 تركيب األلواح الشمسية المنزلية .\n)3 إطفاء األجهزة الكهربائية غير المُستخدَّمة .\n)4 االعتماد على وسائل النقل المستدامة والدراجات الهوائية والمشي .\n)5 تقليل استخدام البالستيك والتركيز على إعادة التدوير .\n)6 المشاركة في حمالت التشجير وتنظيف الشواطئ واألنهار والمبادرات المحلية\nللطاقة النظيفة .\n)7 المشاركة في نشر الوعي البيئي؛ من خالل المدارس ومُنظَّمات المجتمع المدني\nوالمنصات الرقمية ."],[138,"التدريب الثاني\nس :1 اكتب كلمة (صواب ) أوكلمة (خطأ) ، مع ذكر السبب في الحالتين :\nٔ) يإدى ارتفاع حرارة مياه سطح المحيطات إلى هجرة الكابنات البحرية إلى المناطك المدارية (.\nٕ) تإثر حرابك الغابات على النمل والطالة .\nٖ) تعمد مإتمرات األمم المتحدة الخاصة بتغير المناخ سنوياا .\nس :2 اختر اإلجابة الصحيحة مما بين القوسين :\nٔ) يإثر التغير المناخى على البنية التحتية للنمل من خالل . ...........\n( نمص المياه العذبة - ارتفاع مستوى سطح البحر - تدهور التربة - انتشار اآلفات)\nٕ) يظهر تؤثير التغير المناخى على الجوانب الجتماعية فى . ...........\n( تدهور التربة - انتشار األمراض - تآكل السواحل - تراجع اإلنتاج الحيواني)\nٖ) شعار «الشمس ل تغيب أبداا » يهدف لتمليل العتماد على . ...........\n( الولود األحفورى - الطالة الشمسية - طالة الرياح - الطالة الكهرومابية )\nس :3 ما النتائج المترتبة على ... ؟\nٔ) ذوبان الجليد في المناطك الباردة بالنسبة للنمل والتجارة .\nٕ) التغير المناخى بالنسبة للتراث الثمافي العالمي .\nٖ) عمد مإتمر شرم الشيخ للمناخ COP ٕ۷ في مصر .\nس :4 قارن بين : اتفالية األمم المتحدة ٕ ٔ۹۹ م اإلطارية بشؤن تغير المناخ ، ومبادرة التحالف الدولى\nللطالة الشمسية من حيث : الهدف .\nس :5 من وضح : دور الفرد للحد من التغير المناخى ."],[139,"س .1 اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) يظهر الختالل طويل األمد في مناخ األرض بشكل خاص في درجات الحرارة و . ...........\n(سرعة الرياح - حركة األمواج - سموط األمطار - الضغط الجوي)\n(ٕ) أي مما يلي يعد المحرن األساسي لحدوث التغير المناخي؟ ...........\n(الكابنات الحية - الثوران البركاني - التوسع الحضري - الحتباس الحراري)\n(ٖ) تُعد أكثر العوامل التي أدت إلى زيادة تركيزات الغازات الدفيبة في الغالف الجوي ...........\n(األنشطة الزراعية - بناء الطرق األسفلتية - األنشطة الصناعية - الثورات البركانية)\n(ٗ) من العوامل البشرية المسببة للتغير المناخي ...........\n(ذوبان الجليد في المطبين - تحلل الحيوان والنبات بعد موتها - انبعاثات الغازات من الصناعة - النشاط\nالبركاني)\n(٘) من العوامل الطبيعية التي تإثر في الحتباس الحراري وتكون مساهمتها محدودة جداا ممارنة\nباألنشطة البشرية ...........\n(حرابك الغابات - النشاط البركاني - ذوبان الجليد في المطبين - تحلل الحيوانات والنباتات)\n( )ٙ من العوامل الطبيعية المسببة للتغير المناخي وينتج عنها تحلل المواد العضوية المخزنة في التربة\n(الحرابك الطبيعية للغابات - النشاط البركاني - ذوبان الجليد في المطبين - التوسع الحضري)\n( ي )۷ ظهر أثر التغير المناخي في هجرة بعض الكابنات البحرية باتجاه المناطك ...........\n(المتجمدة - الباردة - الستوابية - المدارية)\n( يُ )۸ عد من تؤثيرات التغير المناخي على النظم البيبية ...........\n(موجات الجفاف المتكررة - نشاط البراكين - انتشار األمراض - النزوح السكاني)\n( )۹ أي مما يلي يعد من اآلثار السلبية للتغير المناخي على الزراعة؟ ...........\n(تهديد األمن الغذابي - زيادة المساحات الخضراء - تنوع المحاصيـل - تراجع انتشار اآلفات الزراعية)\n(ٓٔ) من المخاطر التي تواجه النمل البحري نتيجة التغير المناخي ...........\n(شدة العواصف - حرابك الغابات - تعطيل شبكات الكهرباء - تدمير خطوط األنابيب)\n(حرابك الغابات - نمص الموارد المابية - موجات الجفاف المتكررة - ارتفاع حرارة مياه سطح\nالمحيطات)\nس :2 اكتب كلمة ( صواب ) أوكلمة (خطأ) ، مع التصويب :\n(ٔ) زادت انبعاثات الغازات المسببة للحباس الحراري منذ الثورة الصناعية األولى .\n(ٕ) تموم الغازات الدفيبة بالغالف الجوي بدور إيجابي لكوكب األرض في حالة زيادة تركيزها عن\nالمعدل الطبيعي ."],[140,"(ٖ) تمنع الغازات الدفيبة تسرب جزء من حرارة الشمس إلى الفضاء الخارجي .\n(ٗ) يساهم بناء المدن الخرسانية والطرق األسفلتية في تغير أنماط المناخ بالعالم .\n(٘) يإدي لطع الغابات أو احترالها إلى زيادة نسبة غاز ثاني أكسيد الكربون بالغالف الجوي ) ( .\nا\nعامال بشرياا لحدوث الحتباس\n( ي )ٙ مثل إنتاج الغازات الدفيبة من تحلل الكابنات الحية بعد موتها\nالحراري .\n( يُ )۷ عد ذوبان الجليد عند المطبين أحد العوامل الطبيعية الذي ينتج عنه زيادة الحتباس الحراري ) ( .\n( ي )۸ حتل غاز الميثان المركز األول من حيث نسبة تؤثيره في إحداث الحتباس الحراري .\n( )۹ اهتم مإتمر شرم الشيخ للمناخ ( )COP ٕ۷ بالخسابر التي تلحك بالدول المتضررة من الحروب\nوالصراعات .\n(ٓٔ)التمليل من استخدام البالستين والتركيز على إعادة التدوير يساهم في الحد من التغير المناخي ) ( .\nس .3 أكمل العبارات اآلتية بكلمات مناسبة :\n(ٔ) يحدث التغير المناخي نتيجة لعوامل ........... وأخرى ...........\n(ٕ) تتمثل العوامل البشرية المسببة للتغير المناخي في انبعاثات الغازات الدفيبة و ........ و ...........\n(ٖ) من أمثلة الغازات الدفيبة الموجودة بالغالف الجوي ........... و ........... و ...........\n(ٗ) يساهم التوسع الحضري وبناء مدن خرسانية في ارتفاع ...........\nس .5 اكتب ما تشير إليه كل عبارة مما يأتي :\n(ٔ) نوع من الولود ساهم حرله في حدوث التغير المناخي .\n(ٕ) اختالل شامل وطويل األمد لمناخ األرض وخاصة في درجات الحرارة وسموط األمطار .\n(ٖ) يُعد المحرن األساسي للتغير المناخي .\n(ٗ) عملية طبيعية تحدث للحيوانات والنباتات عند موتها وينتج عنها غازات دفيبة .\n(٘) انتمال السكان من مناطمهم بسبب الكوارث الطبيعية والجفاف .\n( )ٙ ممارسات زراعية تهدف لمواجهة تملبات المناخ وحماية اإلنتاج .\n( )۷ اتفالية تهدف إلى تثبيت تركيزات غازات الحتباس الحراري في الغالف الجوي .\n( )۸ مدينة ألامتها مصر تو ّجهها نحو التكيف مع التغير المناخي .\n( )۹ مبادرة تهدف إلى ربط شبكات الكهرباء عبر المارات لنمل الطالة الشمسية للمناطك المظلمة .\nس .6 بم تفسر ... ؟\n(ٔ) حدوث ظاهرة الحتباس الحراري .\n(ٕ) حدوث التغير المناخي الذي أصاب كوكب األرض .\n(ٖ) يعتبر لطع األشجار أحد عوامل التغير المناخي ."],[141,"(ٗ) تموم الحرابك الطبيعية للغابات بدور كبير في التغير المناخي .\n(٘) عمد اتفالية األمم المتحدة اإلطارية بشؤن تغير المناخ (ٕ ٔ۹۹ م) .\n( )ٙ أهمية مبادرة التحالف الدولي للطالة الشمسية .\n( )۷ عمد األمم المتحدة سنوياا مإتمرات للتغير المناخي ( .)COP ٕ۷\nس .7 ما اأ :\nللفرد دور فعال في مواجهة التغير المناخي .\nس .4 ما النتائج المترتبة على :\nارتفاع مستوى سطح البحر؟\nس .5 ماذا يحدث إذا ... ؟\n(ٔ) نجح العالم في خفض انبعاثات ثاني أكسيد الكربون إلى صفر انبعاثات بحلول عام ٕٓ٘ٓم .\n(ٕ) لم يلتزم كل فرد باستخدام األجهزة الموفرة للطالة والنمل المستدام ."],[143,"س :1 الحظ خريطة أستراليا التى أمامك ، واكتب مدلول األرقام التي عليها :\nنظام غابات . ................\nنظام غابات . ................\nنظام غابات . ................\nنظام غابات . ................\nأكبر نظام مرجانى فى العالم من حيث المساحة . ............\nالمحيط . ...................\nنهرا . .......................\nس :2 اختر اإلجابة الصحيحة مما بين القوسين :\nٔ) لارة تستحوذ على نحو نصف إجمالي مساحة الغابات المدارية المطيرة في العالم . ..........\n(أمريكا الجنوبية - أمريكا الشمالية - أستراليا – أوروبا)\nٕ) ت ُ َع ُّد غابات األمازون الموطن األصلى ألشجار ( . .......... الزيتون المطاط - التين - الموالح )\nٖ) تنموغابات المانجروف بوضوح عند مصب نهر .......... في أمريكا الجنوبية .\n( بارانا - باراجواى - األمازون - سانت لورانس)\nٗ) يصب نهر المسيسبى فى . ..........\n(خليج المكسين - المحيط الهندى - المحيط الهادى - المحيط المطبي الشمالي)\n٘) من المإتمرات التي ركزت بشكل خاص على «الخسابر واألضرار » للدول المتضررة من التغير\n(كيوتو - باريس - شرم الشيخ - دبي )\nالمناخي مإتمر . ..........\nس :3 بم تفسر ... ؟\nٔ) تعد غابات األمازون ربة العالم .\nٕ) تعد بحيرة سوبيريور وجهة سياحية رابعة الجمال .\nس :4 ما النتائج المترتبة على ... ؟\nٔ) المتداد الشاسع لألمريكتين عبر دوابر العرض .\nٕ) تدهور مساحات واسعة من غابات البحر المتوسط في شيلي .\nس :5 ماذا يحدث إذا ... ؟\nٔ) سمطت أمطار غزيرة طوال العام في أستراليا ا\nبدل من وجود موسم جفاف .\nٕ) فمدت أمريكا الشمالية بحيرة سوبيريور\nٖ) فمد الغالف الجوي لألرض الغازات الدفيبة تما اما ."],[145,"أوالي : مصر يف عَد اخلديوي توفيل\n تولى الخديو توفيق حكم مصر سنة ۱۸۷۹ م بعد عزل والده الخديو إسماعيل بفرمان من\nالسلطان العثماني بم تفسر؟ استجابة لضغوط بريطانيا وفرنسا ، في وقت كانت فيه البالد\nتعاني أزمة مالية كبيرة .\n في بداية حكم توفيق ظهر التناقض بينه وبين شريف باشا (رئيس الورزاء) .\n*وزارة شريف باشا -:\n في بداية حكم الخديو توفيك طالب شريف باشا (ربيس الوزراء) بإنشاء نظام دستوري يجعل الوزارة\nمسبولة أمام مجلس تختاره األمة .\n لكن رفض الخديو توفيق مطالب شريف باشا بم تفسر؟ بحجة أن البالد لم تتهيؤ للحكم\nالدستوري؛ مما دفع شريف باشا إلى الستمالة .\n*وزارة رياض باشا :\nعين الخديو توفيق رياض باشا رئيسا للوزراء سنة ۱۸۷۹ م ، ما النتائج؟ مما أدى إلى :\nٔ) اتباع سياسة الحكم المطلك .\nٕ) التضيك على الصحافة .\nٖ) إعادة نظام المرالبة المالية الثنابية ، وزيادة نفوذها (من أخطر لرارات وزارة رياض باشا ) .\n دلل : إعادة نظام المراقبة المالية الثنائية من أخطر قرارات وزارة رياض باشا ؟\n دلل : زيادة نفوذ المراقبة المالية الثنائية خالل عهد وزارة رياض باشا ؟\nحيث كان الرقيبان الحق في -:\nٔ) الطالع على ميزانية الدولة .\nٕ) حضور جلسات مجلس الوزراء .\nوبذلك أصبح لألجانب نفوذ مباشر داخل إدارة الدولة .\nٖ) مرالبة المصالح الحكومية ."],[146," دلل : انحاز الخديو توفيق لألجانب منذ اللحظات األولى لتوليه الحكم؟ حيث :\nٔ) رفض الحكم الدستورى .\nسا للوزراء عام ٔ۸۷۹ م الذى اتبع سياسة الحكم المطلك .\nٕ) لام بتعيين رياض باشا ربي ا\nٖ) أعاد نظام المرالبة المالية الثنابية التى بها أصبح لألجانب نفوذ مباشر داخل إدارة الدولة .\nثاىييا : الجورة العرابية\n كانت الثورة العرابية حركة وطنية انبعثت في مصر خالل القرن التاسع عشر الميالدي ضد\n- االستبداد .\n- التدخل األجنبي .\n قد ارتبطت باسم قائدها البارز أحمد عرابي .\n*أحمد عرابي :\n ولد بمحافظة الشرقية في مارس عام 1841 م .\n تلقى تعليمه بالجامع األزهر .\n التحق بعد ذلك بالجيش وترقى في الرتب بفضل كفاءته واجتهاده .\n توفي في 21 سبتمبر عام 1911 م بالقاهرة .\n-1 األسباب العسكرية :\n عانى الضباط المصريون سوء المعاملة والتمييز والعنصرية داخل الجيش ، خاصة من\nوزير الحربية عثمان رفقي دلل؟ حيث :\nفضل الضباط األتران على الضباط المصريين ، بمنحهم الترليات وإسناد المناصب المهمة إليهم؛ مما زاد\nحالة الغضب والستياء داخل الجيش .\n-2 األسباب السياسية :\n ما العالقة بين : وضع مصر السياسي ، وقيام الثورة العرابية؟\nحيث أدت سيادة مظاهر الستبداد وغياب العدل وانعدام المساواة أمام المانون في مصر في بداية عهد\nالخديو توفيك إلى سخط الشعب على نظام الحكم وليام الثورة العرابية ."],[147,"-3 األسباب االقتصادية :\n تدهور الوضع االقتصادي بم تفسر؟ بسبب :\nتراكم الديون األجنبية .\nفرض الضرابب الباهظة على الفالحين .\n تقليص الحكومة المصرية عدد أفراد الجيش بم تفسر؟ تنفيذا لشروط المرالبة المالية األجنبية\nوتمليال للنفمات؛ فازداد غضب الشعب والجيش معاا .\n-4 األسباب االجتماعية :\n ظهور طبمة مثمفة أدركت معنى الحرية ورفضت الستبداد .\n ليام الصحافة بدور كبير في توعية الشعب وانتماد أخطاء الحكومة ، رغم تعرضها للمنع والتضييك .\nأ - حادثة قصر النيل (فبراير عام ٔ۸81 م) :\n أسبابها :\n بم تفسر : قيام حادثة قصر النيل ؟ بسبب :\nاشتد التذمر والغضب بين الضباط المصريين حين عرفوا أن وزير الحربية عثمان رفمي أخذ يفكر في\nعزل كبار الضباط أو إبعادهم عن مراكزهم ما النتائج؟ فاتفموا على عدد من المطالب ، كان أهمها :\n* عزل عثمان رفمي .\n* تعيين وزير وطني بدل منه .\n أحداثها :\nاختار الضباط المصريين أحمد عرابي لينوب عنهم في تقديم طلباتهم لرئيس الوزراء\nبم تفسر؟ لما عُرف عنه من :\n* الجرأة واإلخالص والصدق .\n* واعتزازه بمصريته و لوميته .\n موقف الخديوى توفيق :\nوبدل من الستجابة لمطالب الضباط ، أمر الخديو توفيك بالمبض على أحمد عرابي وبعض زمالبه\nومحاكمتهم عسكريا ا ما النتائج؟ أدى ذلن إلى تحرن الجنود إلى لصر النيل إلنماذ لادتهم ، ونجحوا في\nإخراجهم من السجن ."],[148," نتائجها :\n دلل : نجاح الجيش في فرض إرادته على الخديو توفيق في حادثة قصر النيل ؟\nحيث أجبر الخديو توفيق على :\n العفو عن أحمد عرابي وزمالبه ، وإعادتهم إلى مناصبهم .\n عزل عثمان رفمي ، وتعيين محمود سامي البارودي وزيرا للحربية .\nفازدادت شعبية أحمد عرابي بين الجنود والشعب .\nب - مظاهرة عابدين ( ۹ سبتمبر ۱۸۸۱ م) :\n أسبابها :\n بم تفسر : قيام مظاهرة عابدين ( ۹ سبتمبر ۱۸۸۱ م) ؟ بسبب :\nاستمرار سوء أحوال البالد لذلن اتفك زعماء الشعب على خروج الجيش في مظاهرة سلمية تؤييدا ا\nلمطالب األمة .\n أحداثها :\n دلل : كانت مظاهرة عابدين نموذجا رائعيا للتالحم الشعبى والعسكرى على هدف واحد؟\nحيث خرج أحمد عرابى على رأس الجيش إلى ميدان عابدين وتجمع وراء صفوف الجيش آلف من أهل\nالماهرة وكان هدفهم هو إزالة أسباب الفساد .\n مطالب الثوار :\nطالب عرابي باسم الجيش والشعب بما يلي -:\nٔ) عزل وزارة رياض باشا المستبدة .\nٕ) زيادة عدد الجيش إلى ٔ۸ ألف جندي .\nٖ) تشكيل مجلس نواب يُمثل األمة على النسك األوروبي .\nفكانت الثورة العرابية التقاء لجميع فئات الشعب على هدف واحد دلل؟ حيث كان هدفهم\nإزالة أسباب الفساد ، وصار عرابي زعيم المدنيين والعسكريين جميعا ا .\n نتائجها :\n دلل : حققت الثورة العرابية فى سبتمبر ۱۸۸۱ م مكاسب سياسية؟\nاضطر الخديو توفيق إلى تنفيذ مطالب الضباط فقام بـ :\n عزل وزارة رياض باشا ، وكلف شريف باشا بتشكيل وزارة جديدة ."],[149,"التدريب األول\nس :1 اكتب ما تشير إليه العبارتين التاليتين :\nٔ) نظام أعادته وزارة رياض باشا وكان من أخطر المرارات التي اتخذتها تلن الوزارة .\nس :2 صوب ما تحته خط :\nٔ) فضل وزير الحربية عثمان رفمى الضباط المصريين بمنحهم الترليات والمناصب المهمة .\nٖ) تم تعيين أحمد عرابى\nا\nس :3 ما تقييمك لمصداقية كل عبارة مما يلى ... ؟ مع ذكر السبب في الحالتين :\nٔ) لام السلطان العثمانى بعزل الخديو إسماعيل نتيجة للضغوط الخارجية .\nٕ) كان للرليبين األجنبيين فى عهد وزارة رياض باشا نفوذ واسع .\nس :4 بم تفسر ... ؟\nٔ) تمديم شريف باشا استمالته فى بداية حكم الخديو توفيك .\nٕ) تدهور الوضع اللتصادى فى مصر لبل اندلع الثورة العرابية .\nٖ) غضب الضباط المصريين داخل الجيش من وزير الحربية عثمان رفمى .\nٗ) ليام الحكومة المصرية بتمليص عدد أفراد الجيش في عهد الخديو توفيك .\nس :5 دلل على صحة العبارات اآلتية :\nٔ) تراجع الخديو توفيك عن لراراته العسكرية الصارمة أمام ضغط الجنود في حادثة لصر النيل .\nٕ) كانت الثورة العرابية فى مظاهرة عابدين نموذ اجا للتماء جميع فبات الشعب على هدف واحد .\nٖ) تحول الثورة العرابية من حركة عسكرية إلى حركة وطنية .\nس :6 حـدد األثر الناتج عن :\nانتشار مظاهر الستبداد وغياب العدل فى بدايات عهد الخديو توفيك ."],[150,"ثالجاً : التدخل األجييب يف شئوي مصر\n-1 المذكرة المشتركة األولى يناير ٕ ٔ۸۸ م -:\nأسبابها\nخوف بريطانيا وفرنسا من تصاعد الحركة الوطنية بقيادة أحمد عرابي .\nمحتواها\nأعلنت فيها كل من بريطانيا وفرنسا :\nتؤييدهما الكامل للخديو توفيك واستعداد الدولتين لمساندته .\nنتائجها\nٔ) أثار غضب الوطنيين وأعضاء مجلس النواب بم تفسر؟ ألنها مثلت تدخالا صري احا\nفي شبون مصر .\nٕ) إخفاق (فشل) كل من بريطانيا وفرنسا في إلغاء مجلس النواب .\nٖ) طالبت كل من بريطانيا وفرنسا بؤل تتضمن لبحة مجلس النواب حك المجلس في\nمنالشة الميزانية أو إلرارها بم تفسر؟ بحجة ارتباطها بالديون األجنبية .\n دلل : تعد المذكرة المشتركة األولى خطوة واضحة نحو التدخل األجنبي العلني في\nالشأن المصري ؟\nحيث :\nأعلنت فيها كل من بريطانيا وفرنسا تؤييدهما الكامل للخديو توفيك واستعداد الدولتين لمساندته ضد\nالحركة الوطنية .\n*موقف شريف باشا ومجلس النواب من مناقشة الميزانية :\n*شريف باشا -:\n اقترح شريف باشا على مجلس النواب تأجيل النظر في الميزانية بم تفسر؟\nحتى ل يمنح بريطانيا وفرنسا ذريعة للتدخل في الشؤن المصري .\n*مجلس النواب :\n تمسك المجلس بحقه في مناقشة الميزانية وإقرارها ما النتائج؟ ترتب على ذلك :\n استمالة شريف باشا في ٕ فبراير ٕ ٔ۸۸ م .\nوزيرا للحربية .\n تولى محمود سامي البارودي الوزارة وعين عرابي\nا"],[151," ما النتائج : تشكيل وزارة محمود سامى البارودى فى فبراير 1882 م؟ ترتب على ذلك :\n)1 تعيين أحمد عرابى وزيراً للحربية .\n)2 إقرار الوزارة :\n حك المجلس في منالشة الميزانية وما يتصل بالدين وبالتزامات الحكومة نحو األجانب .\n مسبوليتها أمام المجلس على أساس دستورى .\n-2 المذكرة المشتركة الثانية مايو ۱۸۸۲ م -:\nأسبابها\nتصاعد نفوذ الحركة الوطنية بقيادة أحمد عرابي ما النتائج؟ ترتب على ذلك :\n تحركت سفن من األسطولين الفرنسي والبريطاني نحو اإلسكندرية\n أرسلت بريطانيا وفرنسا المذكرة المشتركة الثانية إلى الخديو توفيك في مايو ٕ ٔ۸۸ م .\nمحتواها\n دلل : كانت المذكرة المشتركة الثانية اعتداءاً صارخاً على السيادة المصرية ؟\nحيث طالبت بريطانيا وفرنسا :\nٔ) استمالة وزارة البارودي .\nٕ) إبعاد أحمد عرابي عن منصبه ونفيه خارج البالد .\nٖ) تمليص نفوذ الجيش في السياسة .\nٗ) تؤكيد استعداد الدولتين لتخاذ إجراءات لحماية مصالحهما .\nنتائجها\nرفضت الحركة الوطنية هذه المطالب .\n-3 المواجهة العسكرية يوليو 1882 م -:\n انسحب األسطول الفرنسي وبقي األسطول البريطاني منفرديا .\n اتخذت بريطانيا بعض األحداث أو الحجج ذريعة لضرب اإلسكندرية دلل؟ حيث :\nٔ) ولعت مشاجرة بين أحد المصريين وأحد الرعايا األجانب في مدينة اإلسكندرية .\nٕ) وتطورت المشاجرة إلى اشتباكات واسعة بين بعض المصريين واألجانب ، وسمط عدد من المتلى\nوالجرحى من الجانبين .\nٖ) ادعت بريطانيا أن أرواح األجانب وممتلكاتهم أصبحت في خطر ."],[152,"*ضرب مدينة اإلسكندرية :\n أرسل قائد األسطول البريطاني إنذاريا للحكومة المصرية بم تفسر؟\nبهدف إجبار الحكومة المصرية على :\n ولف أعمال تحصين لالع اإلسكندرية .\n تسليم بعض الحصون والمدافع إلى األسطول البريطاني .\n*موقف الحكومة المصرية من اإلنذار :\n رفضت الحكومة المصرية اإلنذار البريطاني ما النتائج؟ ترتب على ذلك :\nٕ) دافع المصريون من الجنود واألهالي ببسالة عن المدينة .\n*نتائج ضرب مدينة اإلسكندرية في 11 يوليو ۱۸۸۲ م -:\n تمكنت الموات البريطانية من احتالل اإلسكندرية وإنزال لواتها بها .\n انسحب الجيش المصري بميادة أحمد عرابي إلى كفر الدوار بم تفسر؟ إلعادة تنظيم صفوفه .\nرد فعل الحكومة المصرية (نص إثرائي) :\nأرسلت الحكومة المصرية ردا ا تاريخيا ا أكدت فيه تمسكها بحمها في الدفاع عن الوطن ، وجاء فيه « : نحن\nهنا وفي بالدنا ، ومن حمنا ، بل من واجبنا أن نصونها ضد كل عدو يبادبنا بالعدوان ، إن مصر ، المحافظة\nعلى حمولها وعلى شرفها ، ل تستطيع أن تسلم أي مدفع أو أي للعة مهما تكن إل إذا اضطرتها الحرب ،\nإن مصر لتحتج على إرسالكم إنذارا ا اليوم ، وتلمي مسبولية تعدي األسطول وضرب اإلسكندرية ونتابجه\nالمباشرة وغير المباشرة على رأس الدولة التي تجرإ في وسط هذا السالم الشامل على لذف المنبلة\nاألولى ضد اإلسكندرية ، تلن المدينة المسالمة ، مستهترة بحموق األمم ولوانين الحرب» ."],[153,"*معركة كفر الدوار -:\n دارت بين الجيش المصري والموات البريطانية عدد\nمن المعارن تمكن خاللها الجيش المصري\nمن صدها في معركة كفر الدوار .\n ما النتائج : تمكن الجيش المصري من صد القوات\nالبريطانية في معركة كفر الدوار؟\nترتب على ذلك :\nليام الموات البريطانية بتغيير خطتها بالتفاق مع دليسبس\nالمسبول عن لناة السويس في تلن الفترة ، واللتفاف عبر لناة السويس لضرب الجيش من جهة الشرق .\n*معركة التل الكبير -:\n عبرت الموات البريطانية المناة وشنت هجوما ا مفاجبا ا على الجيش المصري عند التل الكبير\n ما النتائج : معركة التل الكبير ؟\n هزيمة الجيش المصري في المعركة .\n دخلت القوات البريطانية إلى القاهرة .\n بم تفسر : هزيمة الجيش المصري في معركة التل الكبير؟\nبسبب :\nٔ) خيانة دليسبس الذي تعهد لعرابي بعدم السماح باستخدام لناة السويس في الحرب .\nٕ) نمص الجنود والعتاد .\n*دخول القوات البريطانية القاهرة -:\n ما النتائج : دخول القوات البريطانية إلى القاهرة؟\nترتب على ذلك :\nٔ) المبض على أحمد عرابي وزعماء الثورة العرابية ، وحكم عليهم بالنفي المإبد إلى جزيرة سيالن .\nٕ) انتهت بذلن مرحلة الثورة العرابية ، وبدأ الحتالل البريطاني لمصر .\nرغم انتهاء الثورة باالحتالل البريطاني لمصر عام ۱۸۸۲ م ، فإنها مثلت خطوة مهمة في\nمسيرة الكفاح الوطني ، ومهدت الطريق لظهور حركات وطنية الحقة طالبت بالحرية\nواالستقالل ."],[154,"رابعيا : مصر حتت االحتالل الربيطاىي\nاالحتالل : هو سيطرة دولة على دولة أخرى بالقوة وفرض سياستها وقوانينها لصالحها .\nتأثرت مختلف جوانب الحياة في مصر تحت االحتالل البريطاني كالتالي -:\n-1 المجال العسكري :\n كانت أولى خطوات االحتالل البريطاني إحكام السيطرة على الجيش المصري ، دلل؟\nفعمل االحتالل البريطاني على :\nٔ) تمليص عدد الجيش .\nٕ) تسريح أعداد كبيرة من الضباط والجنود .\nٖ) وضع الجيش تحت إشراف ضباط بريطانيين .\nٗ) أصبح الجيش يعتمد كليا ا على األسلحة والذخيرة البريطانية .\n-2 المجال السياسي :\n دلل : فقد الخديوي توفيق سيادته على مصر منذ بداية االحتالل ؟ حيث أصبحت :\n السلطة الفعلية : في يد المعتمد البريطاني (ممثل السلطة البريطانية في مصر) .\n الخديوي توفيق : ظل مجرد منفذ ألوامر بريطانيا حتى وفاته في ي ۷ ناير ٕ ٔ۸۹ م .\n-3 المجال النيابي :\n دلل : قضت بريطانيا على الحياة النيابية الحقيقية في مصر ؟ حيث :\nألغت الحكومة البريطانية مجلس النواب المصري ، وأدخلت بدل ا منه هيبات تحت إشرافها ، مثل :\n- مجلس شورى الموانين .\nالجمعية العمومية . لتكون كل القرارات بيد بريطانيا فقط ."],[155,"-4 المجال االقتصادي :\nمستشارا ماليا ا بريطانيا ا بم تفسر؟ لإلشراف على\n ألغت برطانيا نظام المرالبة الثنابية ، وعينت\nا\nالشبون المالية .\n اهتمت بريطانيا بزراعة المطن بم تفسر؟ لخدمة المصانع البريطانية .\n فرضت بريطانيا ضرابب باهظة على الفالحين بم تفسر؟ لسداد الديون التي تراكمت منذ\nعهد الخديو إسماعيل؛ مما أدى إلى تدهور أحوالهم المعيشية وانتشار الفمر بينهم .\n دلل : توجيه االقتصاد المصري لخدمة االحتالل البريطاني؟ حيث :\nٔ) أهملت بريطانيا الصناعة الوطنية .\nٕ) سيطر األجانب على البنون والشركات الكبرى .\nٖ) سيطرت بريطانيا على كل من لناة السويس ، والسودان .\n-5 مجال التعليم والثقافة :\n دلل : تدهور مستوى التعليم وانتشار األمية في مصر أثناء االحتالل؟ حيث :\nسيطرت بريطانيا أيضيا على المدارس فقامت بــ :\nٔ) استمدام المعلمين اإلنجليز .\nٕ) فرضت اللغة اإلنجليزية في مراحل التعليم اإللزامي واإلعدادي .\nٖ) غيرت المناهج لتخدم أهداف الحتالل .\nٗ) خفضت ميزانية التعليم ، كما ألغت مجانية التعليم .\n٘) للصت عدد المدارس ، وأولفت إرسال البعثات العلمية .\n)ٙ عارضت التوسع في التعليم العالي .\nكل هذا أدى إلى :\n- تدهور مستوى التعليم .\n- انتشار األمية بين أبناء الشعب .\nوقد أدت سياسة االحتالل البريطاني في المجاالت السابقة إلى ظهور أصوات وطنية\nمناهضة لالحتالل ."],[156,"التدريب الثاني\nس :1 اكتب كلمة ( صواب ) أوكلمة (خطأ) ، مع التصويب :\nٔ) انسحب الجيش المصرى بميادة أحمد عرابى إلى كفر الدوار إلعادة تنظيم صفوفه .\nٕ) تم نفى عرابي وزمالبه إلى جزيرة سيالن .\nٖ) بعد الحتالل اإلنجليزى لمصر أصبحت السلطة الفعلية في يد الخديو توفيك .\nٗ) لام الحتالل البريطاني بالسيطرة على لناة السويس والسودان .\nس :2 من يكون ... ؟\nٕ) تولى الوزارة في فبراير ٕ ٔ۸۸ م وألر حك مجلس النواب في منالشة الميزانية .\nٖ) المسبول عن إدارة لناة السويس الذى لام بخيانة العهد مع أحمد عرابى وسمح للبريطانيين بالعبور .\nس :3 بم تفسر ... ؟\nٕ) التراح شريف باشا على مجلس النواب تؤجيل النظر في الميزانية .\nٖ) تحرن سفن األسطولين الفرنسى والبريطاني نحو اإلسكندرية فى مايو ٕ ٔ۸۸ م .\nمستشارا مال ايا تابع لها أثناء احتاللها لمصر .\n٘) إلغاء بريطانيا نظام المرالبة الثنابية وتعيين\nا\nس :4 دلل على صحة العبارات اآلتية :\nٔ) اتخذت بريطانيا بعض األحداث ذريعة لحتالل مدينة اإلسكندرية .\nٕ) لامت بريطانيا بعدة إجراءات إلحكام السيطرة على الجيش المصرى بعد احتاللها لمصر .\nس :5 ما المقصود بـ : الحتالل ؟"],[157,"س :1 أكمل العبارات اآلتية بكلمات مناسبة :\nسا للوزراء سنة ٔ۸۷۹ م ، واتبع في إدارته للبالد سياسة الحكم ...........\nٕ) ُ\nع يِّن رياض باشا ربي ا\nٖ) أعطى رياض باشا المرالبين الماليين حك حضور جلسات ........................\nٗ) من األسباب السياسية للثورة العرابية غياب ........................\nوزيرا للحربية .\n٘) بعد عزل عثمان رفمي أصبح ........................\nا\n)ٙ طالبت الثورة العرابية في مظاهرة عابدين بزيادة عدد الجيش إلى ........................ ألف جندي .\nس :2 اختر اإلجابة الصحيحة مما بين األقواس :\n(بريطانيا وإيطاليا - فرنسا وألمانيا - بريطانيا وفرنسا - روسيا والنمسا)\nٕ) أول المكاسب التي حممها العرابيون من الخديوي توفيك ........................\n(إسماط وزارة رياض - تشكيل مجلس النواب - عزل وزير الحربية - زيادة عدد الجيش)\nٖ) يعد تراكم الديون األجنبية وفرض الضرابب من األسباب ........................ للثورة العرابية .\n(السياسية - اللتصادية - الجتماعية - العسكرية)\nٗ) أصبح لألجانب نفوذ مباشر داخل اإلدارة المصرية بفضل أعمال ........................\n(شريف باشا - عثمان رفمى - رياض باشا - محمود سامي البارودي)\n٘) طالب العرابيون في أحداث لصر النيل بعزل ........................\n(شريف باشا - رياض باشا - البارودي - عثمان رفمى)\nوزيرا للجهادية في وزارة ........................\n)ٙ تم تعيين أحمد عرابى\nا\n(شريف - البارودي - رياض - عثمان رفمى)\n)۷ من األحداث التي انتهزتها بريطانيا لتمهيد لحتالل مصر الشتباكات بين المصريين واألجانب في ......\n(لصر النيل - اإلسكندرية - عابدين - لناة السويس)\n)۸ كان من مطالب بريطانيا وفرنسا في المذكرة المشتركة الثانية وزارة .................\n(شريف - راغب - البارودي - دمحم األلفى)\n)۹ تولى محمود سامى البارودي وزارة الحربية في وزارتي ........................\n(رياض وشريف - شريف ونوبار - شريف وراغب - رياض وإسماعيل)\nٓٔ) أنشؤ العرابيون بعد انسحابهم من اإلسكندرية استحكامات عند مدينة ......\n(اإلسماعيلية - كفر الدوار - الماهرة - المصاصين)"],[158,"(الفرنسية - العثمانية - الوطنية - البريطانية)\nالمصادر ........................\nٕٔ) تطلع الحتالل البريطاني من خالل سياسته الزراعية في مصر إلى تلبية احتياجات ..............\n(الفالحين المصريين - المصانع البريطانية - البنون األجنبية - البعثات العلمية)\nس :3 اكتب كلمة ( صواب ) أوكلمة (خطأ) ، مع التصويب :\nٔ) التصرت أسباب الثورة العرابية على األسباب العسكرية .\nٗ) يعد ظهور المثمفين من األسباب الجتماعية للثورة العرابية .\n٘) من مطالب الجيش واألمة في حادثة لصر النيل تشكيل مجلس نواب على النسك األوروبي ( .\n)ٙ أعلنت إنجلترا وفرنسا في المذكرة المشتركة األولى تؤييدهما للخديوي إسماعيل .\n)۷ حممت إنجلترا وفرنسا هدفهما من إرسال المذكرة المشتركة األولى .\n)۸ اتخذت بريطانيا من مشاجرة مدينة اإلسكندرية بين أحد المصريين واألجانب ذريعة لضرب المدينة .\n)۹ التزمت إدارة لناة السويس بميادة ديليسبس بعهودها مع عرابى ومنعت سفن بريطانيا من العبور .\nٓٔ) أصبحت السلطة الفعلية في مصر بعد الحتالل البريطاني في يد الخديوي توفيك .\nٕٔ) تم نفى أحمد عرابى ورفاله إلى جزيرة سيشيل .\nس :4 لمن تُنسب األعمال اآلتية ... ؟\nٔ) طالب بإنشاء نظام دستورى يجعل الوزارة مسبولة أمام مجلس ْ\nتختاره األمة ، ولدم استمالته بعد\nرفض الخديوي توفيك .\nٕ) أعطى األجانب نفوذا ا مباشرا ا داخل إدارة الدولة .\nٖ) طالب ضباط الجيش بإلالته في حادثة لصر النيل .\nٗ) تولى وزارة الحربية بعد حادثة لصر النيل .\n٘) لام بتشكيل الوزارة بعد مظاهرة عابدين .\n)ٙ اضطر لتنفيذ مطالب الضباط في حادثة لصر النيل ومظاهرة عابدين .\n)۷ حدث خالف بينه وبين مجلس النواب ولدم استمالته للمرة الثانية .\n)۸ تولى الوزارة في فبراير ٕ ٔ۸۸ م وألر حك مجلس النواب في منالشة الميزانية .\n)۹ وزير الحربية الذي لاد الجيش المصري في مماومة الحتالل البريطاني ."],[159,"س :5 رتب األحداث اآلتية من األقدم إلى األحدث :\nعزل وزارة رياض .\nإعادة نظام المرالبة الثنابية .\n) حادثة لصر النيل .\n) مظاهرة عابدين .\nس :6 بم تفسر ... ؟\nٔ) تعد وزارة رياض باشا خير أداة لزيادة النفوذ األجنبي في مصر .\nٕ) معاناة الضباط المصريين من وزير الحربية عثمان رفمى .\nٖ) اختيار الضباط المصريين ألحمد عرابى لينوب عنهم في عرض مطالبهم على رياض باشا .\n٘) حدوث خالف بين شريف باشا ومجلس النواب .\n)ٙ تمديم بريطانيا وفرنسا المذكرة المشتركة الثانية .\n)۷ انسحاب الجيش المصري من اإلسكندرية إلى كفر الدوار .\n)۸ ليام بريطانيا بإلغاء مجلس النواب بعد احتاللها لمصر .\n)۹ اهتمام الحتالل البريطاني بزراعة محصول المطن في مصر .\nس :7 ما النتائج التي ترتبت على ... ؟\nٔ) فرض الضرابب الباهظة على الفالحين لبيل الثورة العرابية .\nٗ) إرسال بريطانيا وفرنسا المذكرة المشتركة األولى .\n٘) الخالف بين شريف باشا ومجلس النواب .\n)ٙ لبض الحتالل البريطاني على أحمد عرابي ورفاله .\nس :8 دلل على صحة العبارتين اآلتيتين :\nٔ) اتباع رياض باشا سياسة الحكم المطلك .\nٕ) كانت الصحافة من األسباب الجتماعية الهامة للثورة العرابية .\nٖ) تمتع مجلس النواب بجميع سلطاته فترة تولى البارودي رباسة الوزارة .\nٗ) اتخذت بريطانيا من أحداث اإلسكندرية ذريعة لضربها في يوليو ٕ ٔ۸۸ م .\n٘) عمل الحتالل البريطاني على هدم التعليم في مصر ."],[160,"س :9 ما العالقة بين ... ؟\nٔ) الديون األجنبية وتدهور أحوال مصر اللتصادية .\nٕ) المذكرة المشتركة األولى والخالف الذي حدث بين شريف باشا ومجلس النواب .\nٖ) أحداث اإلسكندرية وليام الموات البريطانية بضربها .\nٗ) الحتالل البريطاني وتدهور األحوال المعيشية للفالحين بمصر .\n٘) طبمة المثمفين وليام الثورة العرابية .\nأسئلة الكتاب المدرسي\nس :1 اكتب كلمة ( صواب ) أوكلمة (خطأ) ، مع التصويب :\n(ٔ) ركز الحتالل البريطاني على تنمية الصناعة الثميلة .\n(ٕ) لامت الثورة العرابية نتيجة زيادة النفوذ األجنبي في مصر .\n(ٖ) طالبت الثورة العرابية بإلغاء الدستور .\n(ٗ) ولفت بريطانيا وفرنسا مولف الحياد تجاه الثورة العرابية .\nس 2 بم تفسر ... ؟\n(ٕ) إرسال بريطانيا وفرنسا المذكرة المشتركة األولى إلى مصر .\n(ٖ) استمالة شريف باشا عام ٕ ٔ۸۸ م .\n(ٗ) هزيمة الجيش المصري في معركة التل الكبير .\nس 3 دلل على صحة كل عبارة مما يأتي :\n(ٔ) لم تكن الثورة العرابية ثورة عسكرية فمط ، بل كانت ثورة وطنية .\n(ٕ) وجه اللتصاد المصري لخدمة بريطانيا .\nس 4 ما النتائج التي ترتبت على ... ؟\n(ٔ) مظاهرة عابدين .\n(ٕ) لصف بريطانيا لإلسكندرية .\n(ٖ) تولي محمود سامي البارودي رباسة الوزارة عام ٕ ٔ۸۸ م .\nس 5 قارن في الجدول التالي بين :\nاآلثار السياسية لالحتالل البريطانى في مصر ، والعسكرية لالحتالل البريطاني في مصر ."],[161," تمهيد :\n استمر كفاح الحركة الوطنية بعد نفي زعماء الثورة العرابية ، وظهر جيل جديد من الزعماء\nالوطنيين أدرك أن السالح وحده ال يكفي لتحرير البالد ، ولكن ال بد من سالح الوعي\nوالتعليم وتفعيل القانون .\n وكان من أبرز زعماء هذا الجيل - : مصطفى كامل .\n- محمد فريد .\n اللذان نجحا في مواجهة أكبر لوة استعمارية في العالم آنذان (بريطانيا) وتحويل المضية المصرية من\nمجرد \"أزمة داخلية\" إلى \"لضية دولية\" .\n*مصر في عهد الخديو عباس حلمي الثاني -:\n تولى عباس حلمي الثاني عرش مصر بعد وفاة والده الخديو توفيك بموجب فرمان ٕ ٔ۸۹ م .\nفي بداية حكمه :\n حاول مقاومة التدخل البريطاني وممارسة سلطاته بعيديا عن المعتمد البريطاني دلل؟\nحيث قام بـ :\nٔ) التحالف مع الحركة الوطنية .\nٕ) اختار مجموعة من الشباب الوطنيين أمثال مصطفى كامل بم تفسر؟ لمساعدتهم في استكمال\nدراستهم بالخارج .\nتحول موقفه :\n قام االحتالل بزيادة الضغط على الخديو عباس حلمي الثاني ، ما النتائج؟\nٔ) ضعف أمله في الجالء .\nٕ) فاتجه للتمرب إلى الحتالل .\nٖ) تخلى عن مساندة الحركة الوطنية ."],[162,"أوليا : مصطفى كامل (باعح احلركة الوطيية احلديجة)\n المولد -: ولد مصطفى كامل في الماهرة عام ٗ ٔ۸۷ م .\n التعليم -:\nسافر إلى فرنسا لستكمال دراسته في الحموق ، وحصل على شهادة الحموق الفرنسية عام ٗ ٔ۸۹ م .\n بداية كفاحه -:\nمبكرا أثناء دراسته بالمرحلة الثانوية ، حيث أسس جمعية أدبية وطنية هدفها\nبدأ كفاحه الوطني\nا\nتنمية الوعي الوطني بين الطالب وتشجيعهم على حب الوطن والدفاع عنه .\n-1 كفاح مصطفى كامل داخل مصر -:\n تنوعت األساليب التي استخدمها مصطفى كامل في مواجهة االحتالل البريطاني\nوإيقاظ روح المقاومة لدى المصريين ، دلل؟ حيث تمثلت تلك األساليب في :\nٔ) أنشأ جريدة «اللواء» (عام 1900 م) : بم تفسر؟ لنشر خطبه وممالته الوطنية التي ركز فيها\nعلى دعوة المصريين لمواجهة الحتالل .\nٕ) أسس «الحزب الوطني» (عام 1907 م) : واتخذ الجالء عن مصر مطلباا أساسياا للحزب .\nٖ) اهتم بالتعليم فدعا إلى تأسيس أول جامعة المصرية : والتي أُسست بتبرعات المصريين\nعام ٔ۹ٓ۸ م في عهد عباس حلمي التاني وسميت بـ «الجامعة المصرية» (جامعة الماهرة حالياا) .\nمقوالت الخالدة للزعيم مصطفى كامل -:\n«  ال معنى للحياة مع اليأس ، وال معنى لليأس مع الحياة» .\n«  لو لم أكن مصرييا ، لوددت أن أكون مصرييا» .\n«  التعليم هو أساس تقدم األمم» .\n«  الوطن فوق الجميع» .\n«  األمة التي ال تشعر بألم االستعباد ال تستحق الحرية» ."],[163,"-2 كفاح مصطفى كامل خارج مصر -:\n لم يقتصر كفاح مصطفى كامل على داخل مصر بل امتد للخارج بم تفسر؟ ألنه :\nأدرن أهمية كسب تؤييد الرأي العام األوروبي للمضية المصرية وفضح ممارسات الحتالل .\nوتمثلت جهوده خارج مصر فيما يلي :\n دلل : امتد نشاط مصطفى كامل إلى الساحة الدولية ولم يقتصر على النطاق المحلي؟\nٔ) االعتراض على اتفاقية الحكم الثنائي للسودان ( 1899 م) : بم تفسر؟ ألن التفالية التي\nولعتها مصر وبريطانيا نصت على اإلدارة المشتركة إلدارة السودان ، مما منح بريطانيا نفوذاا واسعاا\nفي السودان .\nٕ) سافر إلى فرنسا وألقى خطبيا أمام الرأي العام والنواب الفرنسيين : بم تفسر؟ للمطالبة\nبدعم المضية المصرية وانتمد سياسة الحتالل البريطاني .\n*االتفاق الودي وتغير الموقف الفرنسي :\n ما العالقة بين : المصالح االستعمارية والحركة الوطنية بمصر في عهد عباس حلمي الثاني؟\n بم تفسر : تخلت فرنسا عن مساندة الحركة الوطنية ومصطفى كامل بمصر ؟بسبب :\nعمد التفاق الودي بين فرنسا و إنجلترا عام ٗٓ ٔ۹ م ، والذي نص على اعتراف فرنسا بالنفوذ\nالبريطاني في مصر ممابل اعتراف بريطانيا بالنفوذ الفرنسي في المغرب .\nٖ) استغالل حادثة دنشواي ( 1906 م)في فضح وحشية االحتالل البريطاني بم تفسر؟ لكسب\nتؤييد الرأي العام األوروبي لبيان تعارض ممارساته مع مبادئ الحرية والعدالة واإلنسانية التي كانت\nالدول األوروبية تدعي الدفاع عنها ."],[164,"*حادثة دنشواي 1906 م (نص إثرائي) -:\nتفاصيل الحادثة -: أثناء صيد مجموعة من الضباط اإلنجليز للحمام في لرية دنشواي بالمنوفية ، أصابت\nرصاصة أحدهم امرأة مصرية وأشعلت النار في جرن لمح . طاردهم األهالي ، فهرب الضباط ومات أحدهم\nبضربة شمس . أُليمة محكمة خاصة حكمت باإلعدام على ٗ من األهالي ، وعلى آخرين باألشغال الشالة\nوالجلد أمام أسرهم .\nالنتائج المترتبة على الحادثة -:\nٔ) اشتداد كراهية المصريين لالحتالل وازدياد لوة الحركة الوطنية واتحاد كل التيارات الوطنية .\nٕ) تغيير سياسة الحتالل لتهدبة األوضاع ، وإسناد بعض المناصب المهمة للمصريين األكفاء (مثل\nتعيين سعد زغلول\nا\nٖ) استمالة المعتمد البريطاني اللورد كرومر عام ٔ۹ٓ۷ م وتعيين بديل عنه يتبع سياسة أكثر هدو اءا .\nالتدريب األول\nس :1 اكتب كلمة (صواب ) أوكلمة ( خطأ ) ، مع ذكر السبب في الحالتين :\nٔ) بعد نفى زعماء الثورة العرابية ظهر جيل جديد من الزعماء الوطنيين .\nس :2 بم تفسر ... ؟\nٔ) تخلى الخديو عباس حلمى الثانى عن مساندة الحركة الوطنية .\nٕ) تراجع فرنسا عن مساندة المضية المصرية عام ٗٓ ٔ۹ م .\nس :3 دلل على صحة كل عبارة مما يأتى :\nٔ) حاول الخديو عباس حلمى الثانى فى بداية حكمه مماومة التدخل البريطانى .\nٕ) منحت اتفالية الحكم الثنابى ٔ۸۹۹ م بريطانيا نفوذاا واسعاا في السودان .\nس :4 وضح : أهم األساليب التي اتبعها مصطفى كامل داخل مصر لمواجهة الحتالل البريطاني؟"],[165,"ثاىييا : حمند فريد (رمز اإلخالص والتضحية) ( 1919 - 1868 و)\n التعليم : تخرج في مدرسة الحموق الخديوية عام ٔ۸۸۷ م .\n وعيه السياسي : سافر إلى أوروبا واطلع على النظم السياسية\nوالفكرية الحديثة مما أسهم في تكوين وعيه الوطني والسياسي .\n*قيادته للحركة الوطنية -:\nتولى دمحم فريد رباسة الحزب الوطني بعد وفاة مصطفى كامل عام ٔ۹ٓ۸ م واستكمل مسيرة الكفاح ،\nوسار على نفس نهجه من أجل الحرية والستمالل .\n دلل : تولى محمد فريد قيادة الحركة الوطنية في ظروف صعبة ؟ حيث :\nٔ) تراجع دعم الخديو عباس حلمي الثاني للحركة الوطنية وتحوله لموالة الحتالل .\nلرارا بتمييد حرية الصحافة وفرض الرلابة عليها في مارس ٔ۹ٓ۹ م .\nٕ) إصدار الحكومة المصرية\nا\n*مظاهر كفاح محمد فريد -:\nٔ) عمل محمد فريد على نشر الوعي الوطني دلل؟ حيث ألمى ال ُخطب وكتب الممالت الداعية\nلالستمالل والحرية والمطالبة بالدستور .\nٕ) اهتم محمد فريد بالتعليم دلل؟ حيث أنشؤ مدارس ليلية لتعليم الفمراء والعمال مجاناا؛ إيماناا منه\nبؤن العامل المتعلم جندي لوي في معركة الستمالل .\nٖ) ساعد محمد فريد على إنشاء نقابات للعمال والصناع بم تفسر؟ لحماية حمولهم والعناية\nبشبونهم .\nٗ) مواجهة مشروع مد امتياز قناة السويس ( 1910 م) دلل؟ حيث لاد حملة وطنية شعبية نجحت في\nإجبار الحكومة على رفض طلب شركة لناة السويس بمد عمد المتياز ٓٗ عا اما إضافية ."],[166,"*الكفاح الدولي :\nازداد اضطهاد وتضييق الحكومة واالحتالل على محمد فريد والحركة الوطنية ما النتائج ؟\nسافر دمحم فريد إلى أوروبا وشارن في المإتمرات الدولية بم تفسر؟ لشرح المضية المصرية ، واستمر\n دلل : لم ينقطع كفاح ونضال محمد فريد برغم خروجه مضطريا خارج األراضى المصرية؟\nحيث شارك في المؤتمرات الدولية فى أوروبا لشرح القضية المصرية .\nالتدريب الثاني\nس :1 اكتب ما تشير إليه العبارات اآلتية :\nٕ) خديو مصر الذى تراجع عن دعم الحركة الوطنية بسبب ضغوط بريطانية .\nٖ) مدارس أنشؤها دمحم فريد لتعليم العمال والفمراء بالمجان دون ممابل .\nس :2 ما تقييمك لمصداقية كل عبارة مما يأتى ... ؟ مع ذكر السبب في الحالتين :\nٔ) أسهم سفر دمحم فريد إلى أوروبا فى خدمة المضية المصرية .\nٕ) لاد دمحم فريد الحركة الوطنية في ظروف صعبة .\nس :3 بم تفسر :\nساعد دمحم فريد على إنشاء نمابات للعمال والصناع ؟\nس :4 ما النتائج التي ترتبت على ... ؟\nٕ) زيادة اضطهاد الحكومة والحتالل البريطانى لدمحم فريد وتضييك الخناق عليه ."],[167,"س :1 أكمل العبارات اآلتية بكلمات مناسبة :\nٕ) سافر دمحم فريد إلى أوروبا وشارن في العديد من ....................... لشرح المضية المصرية .\nٗ) نص التفاق الودي على اعتراف بريطانيا بالنفوذ الفرنسي في . .......................\n٘) أنشؤ دمحم فريد ....................... لتعليم الفمراء والعمال مجاناا .\nس :1 اكتب كلمة ( صواب ) أوكلمة (خطأ) ، مع التصويب :\nٔ) تميزت فترة حكم عباس حلمي الثاني بالعداء الدابم للحركة الوطنية منذ البداية .\nٕ) أسست الجامعة المصرية بتبرعات من الحكومة البريطانية .\nٖ) تخلت فرنسا عن مساندة المضية المصرية بسبب مصالحها الستعمارية في المغرب .\nٗ) آمن دمحم فريد بؤن العامل المتعلم هو جندي لوى في معركة الستمالل .\n٘) نجحت شركة لناة السويس في مد عمد المتاز لمدة ٓٗ عا اما إضافية .\n)ٙ أيدت المضية المصرية حتى نالت مصر استماللها .\nلرارا بتمييد حرية الصحافة في مارس عام ٔ۹ٓ۹ م .\n)۷ أصدرت الحكومة المصرية\nا\nس :3 اختر اإلجابة الصحيحة مما بين األقواس :\n(األهرام - اللواء - المإيد - العروة الوثمى)\nٕ) تخلت فرنسا عن مساندة المضية المصرية بعد عمد ....................... عام ٗٓ ٔ۹ م .\n(معاهدة لندن - التفاق الودي - اتفالية السودان - صلح إميان)\nٖ) زاد النفوذ البريطاني في السودان خاصة بعد . .......................\n(حادثة دنشواي - التفاق الودي - اتفالية الحكم الثنابي - رفض مد امتياز المناة)\nٗ) الدولتان اللتان سلبت سيادتهما الوطنية بسبب عمد التفاق الودي عام ٗٓ ٔ۹ م هما . .....\n(إنجلترا وفرنسا - مصر والسودان - مصر والمغرب - فرنسا والمغرب)\n٘) استغل مصطفى كامل حادثة ....................... لفضح وحشية الحتالل البريطاني .\n(عابدين - دنشواي - المورة - فاشودة)\n)ٙ ليدت الحكومة المصرية حرية ....................... في فترة تولى دمحم فريد للحزب الوطني .\n(التجارة - التنمل - الصحافة - التعليم)"],[168,"« )۷ العامل المتعلم هو جندي لوى في معركة الستمالل» أي أعمال دمحم فريد التالية دعم هذه الفكرة ...\n(الحزب الوطني - النمابات العمالية - المدارس الليلية - المطالبة بالدستور)\nس :4 لمن تنسب األعمال التاريخية التالية :\nٕ) لُمّب بـ «باعث الحركة الوطنية الحديثة» وأسس جريدة اللواء .\nٖ) دعا لتؤسيس أول جامعة مصرية (جامعة الماهرة حال ا عن تؤييدها لمصطفى كامل والحركة الوطنية .\nس 3 دلل على صحة كل عبارة مما يلي :\n(ٔ) اهتم مصطفى كامل بالتعليم .\n(ٕ) تولى دمحم فريد ليادة الحركة الوطنية في ظروف صعبة .\nس 4 ما النتائج التي ترتبت على ... ؟\n(ٔ) التفاق الودي بين إنجلترا وفرنسا .\n(ٕ) سفر مصطفى كامل للدول األوروبية .\n(ٖ) رفض دمحم فريد مشروع مد امتياز لناة السويس ."],[170,"س :1 اكتب كلمة ( صواب ) أوكلمة (خطأ) ، مع التصويب :\nٔ) أرسلت بريطانيا وفرنسا كال من المذكرة المشتركة األولى والثانية إلى مصر؛ لتؤييد\nالحركة الوطنية .\nٕ) رفضت الحكومة المصرية تسليم الحصون لألسطول البريطاني في اإلسكندرية .\nٖ) كان وزير الحربية عثمان رفمى يفضل الضباط المصريين على األتران .\nٗ) ركز الحتالل البريطاني على تطوير الصناعة الوطنية فى مصر .\nس :2 أكمل العبارات التالية بكلمات مناسبة :\nٔ) الزعيم الوطنى الذى أنشؤ المدارس الليلية للفمراء والعمال بالمجان هو . ...........\nٕ) عمد التفاق الودى ٗٓ ٔ۹ م بين ............... و . ..............\nٖ) دعا مصطفى كامل لتؤسيس أول ................. بتبرعات المصريين .\nس :4 بم تفسر ... ؟\nٔ) تخلى الخديو عباس حلمى الثانى عن مساندة الحركة الوطنية .\nٕ) اعتراض مصطفى كامل على اتفالية الحكم الثنابى بالسودان .\nٖ) هزيمة الجيش المصرى عند التل الكبير .\nٗ) تحالف الخديو عباس حلمى الثانى مع الحركة الوطنية في بداية حكمه .\n٘) تدهور الوضع اللتصادى لبل الثورة العرابية .\n)ٙ أهمية الخطب التى ألماها مصطفى كامل .\n)۷ اهتمام دمحم فريد بتعليم العمال .\nس :5 ما النتائج المترتبة على ... ؟\nٔ) إصدار بريطانيا وفرنسا للمذكرة المشتركة األولى .\nٕ) توليع اتفالية الحكم الثنابى للسودان .\nٖ) الثورة العرابية .\nس :6 ما العالقة بين ... ؟\nٔ) وزارة رياض باشا واندلع الثورة .\nٕ) التدخل األجنبى والديون المصرية ."]],[[1,"........................................................................................\nت 01065626600/"],[2,"الوحدة األولى\nحضارة بالد العراق القديم و\nحضارة فينيقيا\nالدرس األول\nحضارة بالد العراق القديم\nالدرس الثاني\nحضارة فينيقيا\nالوحدة الثانية\nحضارة اليونان وحضارة الرومان\nالدرس األول\nالحضارة اليونانية(اإلغريقية)\nالدرس الثاني\nمصر تحت حكم البطالمة\nالدرس الثالث\nالحضارة الرومانية\nالدرس الرابع\nمصر ق القديم\nانقسمت إلى ثالثة مجاالت هي :\n-1 الزراعة :\n* عرف سكان بالد العراق القديم الزراعة منذ أقدم العصور بم تفسر؟\nٕ - ت ْٛ ثيي .ٜ\nبخالف الوضع في مصر القديمة حيث كان فرعون صاحب الملكية العامة لألرض .\n-2 الصناعة :\nاشتهر سكان بالد العراق القديم بالكثير من الصناعات المختلفة ، مثل صناعة :\n)۴ ث يّ٤ قز .\nت 01065626600/"],[8,"-3 التجارة : نشطت الرحالت التجارية إلى :\n- داله ثي ٕٙ و .\n- آّ ١ ج ثي ٚ غي .ٜ\n- داله فجيُ .\n.يِٚ -\n- داله ثيٖجَ ( أليح ثيق ٞ جيثس ييغيثق) .\nعرف العراقيون القدماء في تجارتهم المكاييل والموازين وهذا دليل على حرصهم على\nتطبيق العدالة والدقة .\n دلل : اعتبرت التجلرة مع بالد الشام تجارة خارجية للعراق في عصر الدويالت السومرية؟\nّٝ ش داله ثيٖجَ يييه صغو ثيضفجير ِغ داله ثيٖجَ ف ٝ ػ يُ٘ٚ صفجير هثمي ١ ز .\n ما العالقة بين : الصناعة و الزراعة في بالد العراق القديم؟\nالتواصل االقتصادى بين مصر وبالد العراق القديم :\nكانت هناك عالقات تجارية بين مصر وبالد العراق القديم دلل؟ ف ١ ظ ػُغي ف ِٕ ٝ طمز ؽيير\n-1 نظام الحكم «النظام السياسي» :\n دلل : الظام السياسي للمدن السومرية وتعدد اآللهة ؟ حيث\nت 01065626600/"],[9,"-2 الجيش :\nانقسم المجتمع فى بالد العراق القديم إلى ثالث طبقات ، هي :\n)1 الطبقة العليا\n)3 الطبقة الدنيا\n ونستنتج من ذلك :\nكان للدين تأثير عميق فى حياة سكان بالد العراق القديم دلل؟ حيث :\nاحتلت المعابد (الزاقورات ) أهمية خاصة في نفوسهم دلل؟ حيث كان يتم فيها :\n خصائصها ، تمثلت في :\nت 01065626600/"],[10," من أهم المعبودات :\nالتواصل الديني بين مصر وبالد العراق القديم :\n-1 الكتابة :\n*ثمضيع السومريون ٕىال مج ٙ ج ِٓ ثيىضجدز ّّ ١ ش بالكتابة المسمارية\n ونستنتج من ذلك :\n*يعد اختراع السومريون للكتابة المسمارية أبرز إنجازاتهم في الجانب الثقافي .\n* تعددت اآلثار التي ترتبت على اختراع السومريين للكتابة مثل زيادة وظائف الزاقورات .\n-2 األدب :\nترك سكان بالد ما بين النهرين تراثيا زاخريا من األدب ، تمثل في :\nت 01065626600/"],[11,"-2 العلوم :\n- ثيطخ .\n- ثي ٕٙ وّز .\nتمثلت في :\n-1 العمارة :\n- عصر اآلشوريين :\nعصر الدولة البابلية الحديثة : شيد الملك نبوخذ نصر الثاني كالي من :\nتميزفن النحت في بالد العراق القديم بالدقة والمهارة العالية ، ومن أمثلته :\nالثيران المجنحة\nصور الحيوانات\nثورا برأس\nالتى تصور ً\nإنسان ومزود باألجنحة تشبه\nتمثال أبو الهول رأس إنسان\nوجسم أسد .\nكاألسود والثيران المصممة\nبببلطات الماشانى الملونة .\n-3 الرسم و النقش :\nت 01065626600/"],[12,"التواصل الثقافى والفنى بين مصر وبالد العراق القديم :\n* أخذت بالد العراق القديم عن مصر :\nٕ  ىً ثي يَٙ ثيّويػ ف ٟ دٕجء ِغجدو٘ج .\n* أخذت مصر عن بالد العراق القديم :\n ثّضنوثَ ث ٤ مضجَ ِ ، غي :\nالعوامل المتشابهة فى قيام الحضارة بين كل من مصر وبالد العراق القديم :\nأهم السمات التى ظهرت بشكل واضح فى الدول التي قامت بالعراق القديم :\nفّ ًٛ ثد .)ٟ\nم ٞ غش يٕف ٛ ىُ٘ .\nثييْطز ثييّوَ ٠ ز .\nأوجه النقد لبعض الدول التي قامت في بالد العراق القديم :\nت 01065626600/"],[13,"دور حمورابى فى تطور نظم الحكم فى حضارة العراق القديم :\nالدروس المستفادة من سقوط الدولة اآلشورية :\n- صقم ١ ك ثيغوثيز ٠ ؤه ٜ إي ٝ ثالّضميثي .\nًيٚٝ - ر صطذ ١ ك ِذوأ ثيّٖجيوز ثيْ ١ جّ ١ ز .\nوجه االختالف بين ملكية األرض الزراعية بالعراق ومصر :\nأهم التغيرات التي حدثت بنظام التجنيد فى بالد العراق القديم أثناء عصر الدولة اآلشورية :\nالعالقة بين السياسة الخارجية لبالد العراق القديم وقاعدة الهرم االجتماعى فيها :\nأوجه الشبه واالختالف بين العقيدة العراقية والعقيدة المصرية القديمة :\n- صغوه ث يٙ٢ ز .\nت 01065626600/"],[23,"*تميزت بالد الشام بمولعها الجؽرافي ولامت بها حضارات عظيمة منذ ألدم السنين كالحضارة اآلرامية\nوالعمورية المديمة والفينيمية ، وكانت ببلد الشام مهديا للديانتين السماويتين اليهودية والمسيحية ، كما\nبارزا في نشر الدين اإلسبلمي .\nدورا\nلعبت ً\nوسنتعرف على الحضارة الفينيقية كنموذج من نماذج حضارات بالد الشام .\nالفينيقيون هم أول من استقروا على الشريط الساحلى لسوريا (لوفرة الغابات الطبيعية)\nوساحل فلسطين ولبنان فكانوا أول أمة بحرية في العالم .\n أطلك اإلغريك على الفينيميين اسم فينكس أى(الشعب األحمر اللون) ، وذلك نسبة إلى الصبؽة الحمراء\n( األرجوانية ) التي استخرجوها من الموالع البحرية التى تعيش لرب سواحلهم واشتهروا باستخدامها في\nصبػ المنسوجات(أي بسبب نشاطهم االلتصادي) .\nومن كلمة فينكس - - اشتك لفظ فينيميا والتي تعنى (األرض الحمراء اللون) .\nتدل تسمية الفينيميين بهذا االسم على التواصل الحضارى مع جنوب أوروبا .\nوقد تكونت ببلد فينيميا من عدة مدن منها : بعلبن ، بيروت ، عكا ، حيفا ، صيدا ، صور ، جبيل ، أوغاريت .\nت 01065626600/"],[24,"المدن الفينيقية\n-1 مدينة صيدا :\n احتلت مركز الزعامة بين المدن الفينيمية األخرى .\n أُليمت على لسان ممتد في الماء وتحيط بها عدة جزر صؽيرة .\n-2 مدينة أوغاريت\n نالت شهرة عظيمة في الفن والعمران وبذلن تشابهت مع مدينة طيبة .\n تمدمت تجارييا إذ كانت ميناء يمتلا بالبضابع التي تُصدر إلى كل الجهات .\n-3 مدينة صور\n تولت زعامة المدن الفينيمية بعد صيدا .\n أُحيطت بسور عظيم أكسبها مناعة ضد الؽزاة .\n-4 مدينة جبيل\n* تُعد من ألدم المدن الفينيمية وأوثمها صلة بمصر المديمة ، حيث عُثر بها على :\nكثير من التماثيل المصرية المديمة . أحجار عليها أسماء فراعنة مصريين . وهذا يدل على التواصل الحضاري بين مصر وفينيميا .\n* عُثر فيها على ألدم أبجدية في الوطن العربي (تواصل ثمافي والتصادي\nواجتماعي) .\nالفينيقيون وتوسعهم البحرى :\nأثرا واض ًحا في توجههم نحو البحر\n* كان لوجود الفينيميين على ساحل محدد تحيط به الجبال من الشرق ً\nطلبيا للرزق ، واستيطان مناطك جديدة ، خاصة على حوض البحر المتوسط ، ولد ساعدهم على ذلن\nمجموعة من الممومات تتمثل فيما يلي :\n- توافر األخشاب الصالحة لبناء السفن .\n- كثرة التعاريج الساحلية المهيبة لنشؤة الموانا .\nمولع الببلد المتوسط بين الشرق والؽرب . * ولد ازدهرت العديد من المستوطنات الفينيمية فى حوض البحر المتوسط وأهمها «لرطاجة» وذلن من\nأجل إلامة محطات تجارية .\nقرطاجة :\n أسسها الفينيميون بالمرب من مدينة تونس الحالية وتميزت بمولعها الجؽرافي المتميز .\n أخذت في التمدم واالزدهار حتى أصبحت تنافس المدن الفينيمية في التجارة والنشاط البحرى .\nي  وجد بها موانا ال تزال أطبللها المديمة لابمة حيث كان يوجد بها مرسى حربى ومرسى داخلی آخر .\nت 01065626600/"],[25," في القرن الـ 6 ق . م (بالد العراق) : حاول الملن البابلى نبوخذ نصر الثانى احتبلل فينيميا إال أن\nاألسوار المنيعة لبعض المدن منعته من احتبللها بسهولة .\n في عام 332 ق . م (بالد اإلغريق) : احتل اإلسكندر األكبر فينيميا ، وبعد وفاته حكمها\nالسليوليون لمدة ثبلثة لرون تمريبيا .\n في عام 64 ق . م سيطر الرومان : على فينيميا وأصبحت والية رومانية .\n في عام 634 م : دخلت الجيوش اإلسبلمية فينيميا وفتحتها دون مماومة تُذكر .\nثالجاً : مظاهر حضارة بالد فينيقيا\nاهتم الفينيقيون بالنواحى االقتصادية التى تتواكب مع بيئتهم الطبيعية كالتالي :\n-1 الزراعة :\nحيث استؽل الفينيميون كل المساحات التي يمكن زراعتها واستطاعوا تحويل سفوح جبال لبنان إلى\nمصاطب صالحة للزراعة وذلن بسبب ضيك مساحة السهول .\nمن أهم المحاصيل الزراعية :\n الحبوب : زرعت في السهول وبذلن نجحوا في تحميك األمن الؽذابي بزراعة المناطك السهلية .\n األشجار مثل :\n- النخيل .\n- العنب .\n- الرمان : وأدخلوه إلى شمال أفريميا .\n- الزيتون .\n-2 تربية الحيوان والصيد :\nحيث لاموا بتربية األبمار واألغنام والماعز ، كما اشتؽلوا بالصيد .\n-3 الصناعة :\nأدى موقع فينيقيا البحري المتوسط بين الشرق والغرب إلى االهتمام بالصناعة حيث\nتفوق الفينيقيون فى كثير من الصناعات ، أهمها :\nت 01065626600/"],[26,")1 صناعة الغزل والنسيج  : من أمثلتها : الصوف والحرير والمطن والكتان .\n)2 صناعة الثياب\nالمزخرفة :\n)3 الصناعات الزجاجية :\n)4 صناعة الفخار :\n)5 الصناعات المعدنية :\n)6 صناعة أدوات الزينة .\n استخدموا فى صباغتها مادة حمراء من أجسام بعض الموالع التي\nتعيش في البحر ولذلن تعد صناعة الصبؽة أكثر الصناعات شهرة في\nفينيميا .\n عرفوها من مصر وسرعان ما تفولوا فيها (. تواصل حضاري)\n التي تدل على وجود بيبة فيضية و تميزت بالدلة واالنسجام وحسن\nالذوق .\n استخدموا النحاس والبرونز ، والحديد ، والذهب والفضة في صناعة\nاألسلحة (. دليل على االهتمام بالموة العسكرية)\n)7 صناعة اآلالت الموسيقية .\nظهر تاثير الفينيقيين على الحضارات اآلخرى من خالل صناعة السفن .\n-4 التجارة :\nكانت التجارة المورد األساسى للفينيميين واحتلت الصدارة بين األنشطة االلتصادية فنهضوا بها نهضة\nكثيرا فى النمل التجارى بين\nالدول الكبرى المديمة ، مثل : مصر ، وببلد العراق المديم ببلد ما بين النهرين ) وببلد اليونان .\nوقد ظهر التخصص فى النقل التجارى حيث :\nتخصص سكان المدن الساحلية في النقل البحرى :\nمجاال لنشاطهم التجاري فؤلاموا موانا المدن عند الرإوس الداخلية من البحر المتوسط ،\nالذي اتخذوه\nوسيطروا على تجارة العالم البحرية آنذان .\nتخصص سكان المدن الداخلية في النقل البرى :\nفاحتكروا الموافل التجارية التي جلبت المنتجات اآلسيوية\nواألفريمية إلى البحر األبيض المتوسط مثل بعلبن وذلن من\nخبلل معابر التواصل الحضاري التالية :\nطريك شبه جزيرة سيناء . طريك ساحل البحر المتوسط . - طريك ساحل البحر األحمر .\nت 01065626600/"],[27,"* نتيجة لمولع فينيميا الجؽرافي والنشاط التجارى الضخم\nاحتل الفينيميون رأس المثلث الحضاري الذي يتكون\nضلعه األيمن من ببلد العراق المديم وضلعه األيسر\nمن ببلد النيل (مصر) ولاعدته شبه الجزيرة العربية\n(خاصة حضارة ببلد اليمن) ومن هذا المثلث خرجت\nحضارات إنسانية أشعت بنورها على العالم .\nتمثل العامل المشترك بين الحضارتين الفرعونية والفينيقية في لعب دور الوسيط الحضاري .\n دلل : كانت التجارة الخارجية للفينيقين خير شاهد على حسن استثمار مواردهم؟\nحيث قام الفينيقيون بتصدير :\n-1 المواد الخام ، مثل :\n- األخشاب من (جبل لبنان) .\n- المعادن ( من ألصى غرب الببلد) .\nاألصباغ األرجوانية المشهورة من (البحر) . -2 المصنوعات : من المنسوجات الدليمة واألوانى ، والمصنوعات المعدنية ، والمصنوعات من مواد خام\nأخرى فماموا بفتح أسواق جديدة بسبب مهاراتهم الصناعية .\n دلل : نجح الشعب الفينيقي في التغلب على وعورة مظاهر السطح لبالدهم؟\nحيث اهتم الفينيمين بالنواحي االلتصادية التي تتواكب مع بيبتهم الطبيعية فــ :\n استطاعوا تحويل سفوح جبال لبنان إلى مصاطب صالحة للزراعة .\n اشتؽلوا بالتجارة وذلن لوجود فينيميا ساحل محدد تحيط به الجبال من الشرق فتوجهوا نحوالبحر\nطلبا ً للرزق .\nالتواصل االقتصادي بين مصر وفينيقيا :\n*حرصت مصر على فتح أسواق فى فينيميا لبيع منتجاتها ، واالستيراد منها ففي :\n عصر الدولة القديمة : تم استيراد خشب األرز من فينيميا والذى استخدم فى ممابر الملون وصناعة السفن\nأسطوال بحرييا مكونا من 40\nفمد أشار «حجر بالرمو» أن الملن سنفرو (مإسس األسرة الرابعة) أرسل\nسفينة إلحضار خشب األرز من فينيميا .\n عصر الدولة الحديثة : زادت العبللات التجارية بين مصر وفينيميا خاصة في عهد الملن رمسيس الثاني .\n العصر المتأخــر : استعان الملن نخاو ببحارة فينيميين للدوران حول أفريميا الكتشاف أسواق جديدة\nواستمرت الرحلة ثبلث سنوات .\nت 01065626600/"],[28,"كانت المدن الفينيقية الشرقية :\n مستملة عن بعضها البعض من الناحية السياسية .\n تهتم كل منها بمصالحها الذاتية المباشرة فكان التنافس سابديا بينها .\nلذلك لم يستطع الفينيميون الشرليون تشكيل وحدة سياسية واحدة والسبب في ذلن سيطرة األفكار الفردية\nفكانوا يُفضلون األمان واالستمرارالسياسي .\nومن هنا اتخذ الفينيميون نظام حكم شبه ديممراطى حيث كان لكل مدينة حكومة خاصة بها يترأسها\nالحاكم أو الملن (. اختلفت مع الحضارة المصرية المديمة في نظام الحكم السابد)\nوفيما يلي نتعرف سلطات الحكم شبه الديمقراطي في فينيقيا -:\nالحاكم أو الملك ي : تولى الحكم بالوراثة ويرأس الحكومة وكانت سلطته مميدة\nإذ يساعده في إدارة الحكم كل من :\n)1 مجلس الشيوخ : هم هيبة من المشرعين .\n)2 مجلس النواب : تكون من طبمة األغنياء .\n)3 الكهنة : هم رجال الدين وكان لهم دور في إدارة شبون الحكم وبذلن لعب رجال الدين دورا ً إضافيا ً\nبجانب مهامهم الدينية .\nوقد عرفت بعض المدن الفينيمية النظام الجمهورى وخاصة لرطاجة التي اعتمدت على هذا النظام منذ\nنشؤتها واستمرت عليه حتى سمطت على يد «الرومان» وبذلن اختلفت عن المدن الفينيمية في السياسة .\nالتواصل السياسي والعسكرى بين مصر وفينيقيا :\n* أراد المصريون المدماء السيطرة على سوريا ولبنان وجعلها وحدة واحدة ليس استؽبلال لثروات تلن\nالببلد ولكن لتكون بمثابة خط الدفاع األول عن الحدود المصرية (دافع استراتيجي) حفاظا ً على األمن\nالمومى المصرى لذلن لام المصريون المدماء بـ :\n إرسال العديد من الحمبلت العسكرية .\n إنشاء العديد من المبلع والحصون الحربية بفينيميا .\n* في عهد الملك تحتمس الثالث ( األسرة الـ )18 اشترن الفينيميون مع المصريين فى (معركة مجدو)\nللمضاء على أعداء الملن .\nت 01065626600/"],[29," ما العالقة بين : الدعوة إلى الوحدانية بمصر خالل عصر الدولة الحديثة والسياسة\nالخارجية لمصر في فينيقيا؟ حيث :\n* في عهد الملك إخناتون وصل نفوذ مصر فى سوريا إلى الضياع تمريبيا وذلن النشؽاله بنشر الدعوة\nالدينية الخاصة به وترن الشبون السياسية .\n* في عهد الملك رمسيس الثانى (األسرة الـ )19 تم تعزيز النفوذ المصرى فى سوريا وبعد المعاهدة\nالتي عمدها الملن رمسيس الثانى مع ملن الحيثيين ظلت المدن الفينيمية تحت السيطرة المصرية وتدعمت\nالصبلت التجارية بين مصر وفينيميا وذلن لتؤمين حدود مصر الشمالية الشرلية .\n* تتمثل خصائص الديانة الفينيقية في :\n- عبادة الظواهر الطبيعية .\n- تمديس لوى الخصب والنماء .\nتصوير الظواهر واألشياء فى هيبة معبودات ذات صفة بشرية . من أهم المعبودات الفينيقية :\n)1 المعبود إيل : صاحب الكلمة األولى واألخيرة في شبون البشر الدينية .\n)2 المعبود بعل : رب الخصب والنماء الذي أصلح األرض .\n)3 المعبودة عشتار : ربة الخصب والنماء وزوجة اإلله بعل وكانت تشاركه في جميع أعماله .\n)4 المعبود أدونيس ( أذون ) ي : مثل الموة المتجددة فى الشمس بعد هزيمة الشتاء .\nالمعابد :\n اهتم الفينيميون ببناء الكثير من المعابد للمعبودات الخاصة بهم .\n كان المعبد بسي ً\nطا فى بادئ األمر ، ولكن بمرور الزمن تطور بناإه ليصبح\nغاية في الفن وروعة في البناء .\nمما سبق نستنتج ما يلي :\n ارتبط كل من اإلله بعل وعشتار بالنشاط الزراعي .\nي  مكن وصف األلهة عشتار بالمعبود العالمي .\n اشترن كل من حضارة العراق وفينيميا في عبادة اإللهة عشتار .\nت 01065626600/"],[30,"التواصل الديني بين مصر وفينيقيا :\n* تأثر الفينيقيون بأفكار المصريين ومعتقداتهم حيث ظهر ذلك في :\n عادات الدفن حيث وضعوا الطعام والشراب مع المتوفى كدليل على تؤثرهم بفكرة االعتماد فى البعث\nوالحياة بعد الموت .\n تصوير الفينيميين للصراع بين الخير والشر فى لصة اإلله بعل وهى تشبه لصة إيزيس\nوأوزوريس مع اإلله ست عند المصريين المدماء .\nانقسم المجتمع فى فينيقيا إلى ثالث طبقات ، هي :\n)1 الطبقة العليا\nشملت : الوزير ، والنببلء ، وكبار الكهنة ، والتجار ، واألغنياء .\n)2 الطبقة الوسطى شملت : أصحاب المهن والصناعات ، والموظفين .\n)3 الطبقة الدنيا\nشملت : الخدم ، والعبيد .\nتشابهت حضارة العراق وفينيقا في المكانة االجتماعية لكل من الموظفون والحرفيون .\n*نشأة الكتابة واختراع الحروف الهجائية :\nالحروف الهجابية عند الفينيميين\n* اخترع الفينيقيون حروفيا أبجدية بم تفسر؟ لحاجتهم إلى\nهي حروف اخترعها الفينيميون\nلتسهيل معامبلتهم التجارية\nمكونة من 22 حرفا التبسوها\nمن الكتابة المصرية المديمة .\nوسيلة سريعة لتسجيل ما يبيعونه وما يشترونه فى سجبلتهم فكانت\nأول أبجدية عرفها العالم في المرن الـ 14 ق . م (. هدف التصادي)\n ما العالقة بين : فينيقيا والثقافة األوروبية الحديثة؟\n* أخذ اإلغريق األبجدية عن الفينيميين بعد أن عدلوا فيها ، ثم أورثوها\nللرومان الذين نشروها في بمية األلطار األوروبية المديمة ، ومنها خرجت األبجدية األوروبية الحديثة .\nوكان ... الختراع األبجدية الفينيقية الفضل األكبر فى\nنشر الوعى والثقافة في شتى أ
