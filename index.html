n)۷ استخدمت حضارة اإلنكا الكتابة التصويرية .\nس :3 ما العالقة بين كل مما يلى ... ؟\nٔ) ماجالن وكروية األرض .\nٕ) شكل السواحل والموانا الطبيعية في أمريكا الشمالية .\nس :4 بم تفسر ... ؟\nٔ) ضيك السهول الساحلية فى غرب لارة أمريكا الجنوبية .\nٕ) انخفاض أعداد السكان األصليين في األمريكتين .\nٖ) اهتمام حضارة المايا بعلم الفلن .\nٗ) رغبة الدول األوروبية فى اكتشاف طرق بحرية جديدة خالل المرن الخامس عشر الميالدي ."],[50,"س :5 ما النتائج المترتبة على ... ؟\nٔ) حفر لناة بنما .\nٕ) اهتمام حضارة اإلنكا بالرياضيات .\nٖ) التراب سالسل الجبال الغربية من سواحل المحيط الهادى فى أمريكا الشمالية .\nٗ) هجرات األوروبيين إلى العالم الجديد من الناحية اللتصادية .\nس :7 دلل على صحة كل عبارة :\nٔ) تمدم حضارة اإلنكا في الهندسة .\nٕ) دور العلم فى نجاح الكشوف الجغرافية .\nٖ) سيادة المظهر الهضبي على سطح لارة أستراليا .\nٗ) التؤثير الجتماعى لهجرات األوروبيين على السكان األصليين لمارات العالم الجديد ."],[52," دلل : عانت مصر خالل الحكم العثمانى من الجمود والتأخر في شتى نواحى الحياة ؟\nحيث : عاشت مصر فترة مظلمة فكرييا وثقافييا وعلمييا واقتصادييا وبمجيء الحملة الفرنسية\nعلى مصر تراجعت سيطرة العثمانيين على حكم مصر .\nأوالي : أحوال مصر بعد خروج الحملة الفرنسية من مصر -:\n دلل : عاشت مصر فترة من الفوضى واالضطرابات بعد رحيل الحملة الفرنسية؟\n بم تفسر : عاشت مصر فترة من االضطرابات السياسية؟\nحيث :\nتصارع ثالث لوى هم اإلنجليز والممالين والعثمانيين للسيطرة على حكم مصر .\n ما النتائج : االضطرابات السياسية والتصارع على حكم مصر عقب خروج الحملة الفرنسية؟\nأدى ذلك إلى :\n- تدهور األحوال اللتصادية للبالد .\n- غياب الستمرار وانتشار الفوضى .\nوتمثلت القوي المتصارعة على حكم مصر في اآلتي -:\n-1 إنجلترا :\n لم تخرج القوات اإلنجليزية من مصر عقب خروج الفرنسيين ، ولكنها بقيت في\nاإلسكندرية بم تفسر؟ لحماية مصالحها وتؤمين طريك التجارة إلى الهند .\n ولكن بعد صُلْح أَّمْيان ما النتائج؟ انسحبت الموات اإلنجليزية وسلّمت اإلسكندرية ولالعها إلى\nالعثمانيين وغادرت البالد .\nملحوظة : وُقع صُلْح أَّمْيان عام 1802 م بين إنجلترا وفرنسا وانضمت إليهما قوى أوروبية\nأخرى إلنهاء الحرب بينهما ."],[53,"- 2 الدولة العثمانية :\n استعادت الدولة العثمانية سيطرتها على مصر بعد خروج الحملة الفرنسية ، دلل؟ حيث :\n حاولت المضاء على نفوذ الممالين .\n لامت بتعيين خسرو باشا والياا على مصر .\n دلل : تأثرت مصر بتدهور أحوال الدولة العثمانية بعد خروج الحملة الفرنسية ؟ حيث :\nكان تدهور أحوال الدولة العثمانية سببا ا في تؤخر إرسال مرتبات الحامية العثمانية ففرض الولة\nالعثمانيين الضرابب الباهظة على المصريين .\n ما النتائج : فرض الوالة العثمانيين الضرائب الباهظة على المصريين؟\nمما أدى إلى -: ثورة الشعب المصري ضدهم .\n ما النتائج : تأخر أو عجز الوالة العثمانيين في دفع مرتبات الجنود ؟\nمما أدى إلى -: قيام الجنود بـ :\n الثورة على الوالي وعزله أو الميام بمتله .\n نهب وتخريب البالد .\n-3 المماليك :\n رأى المماليك أحقيتهم في حكم مصر بم تفسر؟\nبسبب :\nما بذلوه من جهود في سبيل إجالء الفرنسيين عن مصر .\n ولكن .. ضعفت قوة المماليك العسكرية بم تفسر؟\nبسبب :\nخسابرهم المتكررة أمام الفرنسيين .\nانمسامهم إلى فِرق متنافسة ، األمر الذي زاد من ضعف لوتهم .\n وفي ظل هذا الصراع سيطر البرديسي (أحد زعماء المماليك) على حكم مصر .\n دلل : لم يكن هدف القوى المتصارعة على حكم مصر سوى تحقيق مصالحها الشخصية\nدون النظر لمصلحة الشعب المصرى؟ حيث تصارع على حكم مصر كل من :\n إنجلترا : من أجل حماية مصالحها وتؤمين طريك التجارة إلى الهند .\n الدولة العثمانية : من أجل الرغبة فى استعادة سيطرتها على مصر .\n المماليك : من أجل الوصول لحكم مصر"],[54,"ثانييا : ثورة الشعب المصري ( 1804 م) -:\nأسبابها\n بم تفسر : قيام الشعب المصري بثورة مارس 1804 م ؟\nبسبب فرض البرديسي الضرابب الباهظة على المصريين لدفع رواتب الجنود\nوجمعها منهم بالموة فثار المصريون عليه وتجمهروا في الجامع األزهر وحوله .\nأحداثها\n تدخَّل «محمد علي» وسار إلى الثوار ووعد العلماء بالسعي إللغاء\nمما أدى إلى :\nالضريبة المفروضة ما النتائج؟\n هدأت الثورة وعاد األهالي إلى منازلهم وهم يدعون لـ «دمحم علي» .\n توجه دمحم علي بجنوده لحصار دار البرديسي .\nنتائجها\n ما النتائج : قيام الشعب المصري بثورة مارس 1804 م ؟\nٕ - تعُ يِّن خورشيد باشا والياا على مصر .\n دلل : عمل «محمد على» على التقرب من الشعب المصرى أثناء ثورة 1804 م؟حيث :\nتدخل «دمحم على» إلى جانب الثوار ووعد العلماء بالسعى إللغاء الضريبة المفروضة ، كما حاصر دار\nالبرديسي مما اضطره لمغادرة الماهرة .\n دلل : تشابهت العوامل التي أدت إلى ثورة المصريين ضد الوالة العثمانيين والمماليك بعد\nرحيل الحملة الفرنسية ؟\nحيث : لام الولة العثمانيين والممالين بفرض الضرابب الباهظة على المصريين .\nمن هو محمد علي ؟\n«محمد علي» -:\n وُلد «محمد علي» في بلدة قولة بشمال اليونان .\n ضابط من أصل ألباني ، جاء إلى مصر ضمن\nفرقة عسكرية أرسلها السلطان العثماني لطرد الفرنسيين\nمن مصر ، ثم أصبح قائديا لهذه الفرقة ، وتمكَّن الحقيا من تولي حكم مصر عام 1805 م ."],[55,"التدريب األول\nس :1 أكمل العبارات اآلتية بكلمات مناسبة :\nٔ) بعد رحيل الحملة الفرنسية عن مصر تصارع على حكم مصركل من الدولة العثمانية ........ و . ........\nٕ) غادرت الموات اإلنجليزية مصر بعد صلح . .............\nٖ) ثار المصريون ضد البرديسى عام ٗٓ ٔ۸ م وتجمهروا في . ................\nس :2 ما تقييمك لمصداقية كل عبارة مما يأتى ... ؟ مع ذكر السبب في الحالتين :\nٔ) ضعفت لوة الممالين بعد خروج الحملة الفرنسية من مصر .\nٕ) اتبع البرديسى فى حكم مصر سياسة حكيمة أدت إلى استمرار األوضاع في البالد .\nٖ) نجح «دمحم على » فى تهدبة ثورة المصريين عام ٗٓ ٔ۸ م .\nس :3 من هو ... ؟\nٔ) أول والى عثمانى تولى حكم مصر بعد رحيل الحملة الفرنسية .\nٕ) حاكم مصر الذي اضطر لمغادرة الماهرة بعد ثورة الشعب ضده عام ٗٓ ٔ۸ م .\nٖ) تولى حكم مصر فى أعماب ثورة المصريين ٗٓ ٔ۸ م .\nٗ) ضابط من أصل ألباني جاء إلى مصر ضمن فرلة عسكرية لطرد الفرنسيين ثم أصبح لابدا لهذه الفرلة .\nس :4 دلل على صحة كل عبارة مما يأتي :\nٔ) هدفت الموى المتصارعة على حكم مصر بعد خروج الحملة الفرنسية تحميك مصالحها الشخصية .\nٕ) تشابهت العوامل التي أدت إلى ثورة المصريين ضد الولة العثمانيين والممالين بعد رحيل الحملة\nالفرنسية .\nس :5 من حدد العالقة بين : تدهورأحوال الدولة العثمانية ، وسياسة الولة تجاه المصريين"],[56,"ثالثاً : دور الشعب المصري في تولية «محمد علي» حكم مصر ( 1805 م) -:\n*أثناء والية خورشيد باشا :\n بعد تولية خورشيد باشا والية مصر لم تستقر األمور بم تفسر؟\nبسبب :\n ليامه بفرض الضرابب الباهظة على المصريين .\n انتشار جنوده في البالد ينهبون ويمتلون ويصادرون أموال الناس .\nونتج عن ذلك :\nازدادت أحوال مصر سوءاً واضطراب ًا وزاد غضب الشعب المصري على خورشيد باشا .\nموقف محمد علي :\n بم تفسر : تمسك الشعب المصري بـ\"محمد علي\" والياً على مصر؟\n بم تفسر : استطاع «محمد على» كسب ثقة المصريين أثناء والية خورشيد باشا؟حيث :\nحرص «دمحم علي» في تلن األثناء على الظهور بمظهر العادل الحكيم الرافض لسياسة الوالي وجنوده\nوأمر جنوده بــ :\nي - شاركوا في أعمال السلب والنهب .\n- أل يعتدوا على الشعب .\n* عزل خورشيد باشا وتولية محمد علي حكم مصر :\n لما اشتد ظُلم خورشيد باشا وجنوده للمصريين ما النتائج؟ مما أدى إلى :\nاجتمع المشايخ والعلماء في بيت الماضي ثم توجهوا إلى «دمحم علي» في منزله باألزبيكية وأخبروه\nبرغبتهم في :\n- عزل خورشيد باشا .\n- تولي دمحم علي فسه الولية لما وجدوا فيه من العدالة والخير .\nحديث المشايخ مع محمد علي :\nوقالوا له « : إننا ال نريد هذا الباشا حاكماً علينا ، وال بد من عزله من الوالية»؛ فقال « : ومَّن\nتريدون أن تولوا مكانه؟» قالوا « : ال نرضى إال بك والياً علينا بشروطنا؛ لما نتوسمه فيك من\nالعدالة والخير» ."],[57,"*موقف محمد علي من مطلبهم :\n رفض «دمحم علي» طلبهم في بداية األمر ثم وافمهم .\n ولام السيد عمر مكرم «نميب األشراف» والشيخ عبد هللا الشرلاوي وألبساه لفطان الولية .\n أرسل المشايخ والعلماء إلى خورشيد باشا يطلبون منه التنازل عن الولية فرفض ما النتائج؟\nحاصر «دمحم علي» خورشيد باشا في الملعة ثم أصدر السلطان العثماني فرمانا ا عام ٘ٓ ٔ۸ م تضمن\nتولية «دمحم علي» واليا ا على مصر وعزل خورشيد باشا وبذلن انتصرت إرادة الشعب المصري في\nاختيار «دمحم علي» .\n ما العالقة بين : اجتماع زعماء الشعب فى بيت القاضى ، والوضع السياسي لمصر؟\n دلل : نجحت الزعامة الشعبية في تغيير المشهد السياسي في مصر عام 1805 م؟\nحيث كان اجتماع زعماء الشعب فى بيت الماضى واختيارهم« دمحم على » والياا لمصر سبباا في إصدار\nالسلطان العثمانى فرماناا عام ٘ٓ ٔ۸ م بتعينه والياا على البالد وبالتالي تغيرالوضع السياسي لمصر .\nرابعاً : التحديات التي واجهت «محمد علي» بعد توليه حكم مصر\nواجه «محمد علي» بعد توليه حكم مصر عدة تحديات؛ كما يوضح الشكل التالي :\n-1 محاولة نقل «محمد علي» إلى والية سالونيك ( 1806 م) -:\n أصدر السلطان العثماني فرماناً عام 1806 م ما النتائج؟ تضمن :\n تعيين موسى باشا (والي سالونين) واليا ا على مصر بدل ا من «دمحم علي» .\n نمل «دمحم علي» إلى ولية سالونين .\n*موقف محمد علي من الفرمان :\n لم يستسلم «محمد علي» لقرار السلطان العثماني دلل؟\nحيث :\nطلب المساعدة من المشايخ والعلماء المصريين وحثهم على كتابة رسالة للسلطان العثماني يطالبون\nفيها بإنهاء هذا الفرمان واإلبماء عليه واليا ا على مصر .\n ما النتائج : وقوف الزعامة الشعبية بجانب محمد على » عام 1806 م؟ مما أدى إلى :\nتراجع السلطان عن لراره وأصدر مرسوما ا بتثبيت «دمحم علي» واليا ا على مصر ."],[58,"-2 حملة فريزر ( 1807 م) -:\nأرسلت إنجلترا حملة عسكرية على مصر بقيادة فريزر عام 1807 م .\nأسبابها\n بم تفسر : إرسال إنجلترا حملة بقيادة فريزر عام 187 م ؟\nأهدافها\nٔ - بهدف احتالل مصر .\nٕ - مساعدة دمحم بن األلفي (أحد زعماء الممالين الموالين لإلنجليز) إللامة حكم موال\nلها في مصر لكنه توفى لبل وصول الحملة .\nأحداثها\n نزلت الحملة إلى اإلسكندرية واحتلتها دون مماومة وكان األلفي لد مات لبل\nوصولها إلى مصر بشهرين .\n أرسل فريزر فرلتين عسكريتين إلى ك ّل من رشيد والحماد ولكنهما فشلتا في\nالسيطرة عليهما بم تفسر؟\nٔ - بسالة األهالي في الدفاع عنهما ( رشيد وحماد ) .\nٕ - انضمام جيش «دمحم علي» ألهالي الحماد .\nنتائجها\n ما النتائج : حملة فريزر عام 187 م ؟\nٔ - اضطر فريزر لالنسحاب إلى اإلسكندرية .\nٕ - انسحاب الحملة من مصر في نفس العام بعد فشلها في تحميك أهدافها .\n-3 الزعامة الشعبية ( 1809 م) -:\n واجه «محمد علي» أزمة مالية كبيرة عند توفير رواتب الجنود بم تفسر؟ بسبب :\nتدهور األوضاع اللتصادية في البالد ، فاتجه إلى :\n- فرض ضرابب جديدة .\n- ومصادرة بعض الممتلكات .\n دلل : سار «محمد علي » على خطى الوالة العثمانيين الذين سبقوه فى مواجهة\nاألزمات االقتصادية؟\nحيث لام «دمحم على » بفرض ضرابب جديدة ومصادرة بعض الممتلكات للشعب المصرى لمواجهة األزمة\nالمالية وتوفير رواتب الجنود ."],[59,"*موقف الزعامة الشعبية من إجراءات محمد علي :\n دلل : رفض الشعب المصرى سياسة «محمد على» فى فرض الضرائب؟ حيث :\nتضامن المشايخ والعلماء بزعامة نميب األشراف السيد «عمر مكرم» مع األهالى الذين تجمهروا فى\nالجامع األزهر احتجا اجا على فرض الضرابب واتفموا على الدفاع عن حموق الشعب .\n*موقف محمد علي من الزعامة الشعبية :\nفلما بلغ خبر اجتماعهم إلى «دمحم علي» أرسل إليهم يدعوهم لممابلته والتفاوض معه .\nولكن رفض العلماء والمشايخ دعوة محمد علي بم تفسر؟\nحتى يُلغي الضرابب التي أثملت كاهل األهالي .\nوهنا أدرك «محمد علي» خطورة الزعامة الشعبية على مكانته ما النتائج ؟\nمما أدى إلى : رغبته في التخلص منهم لالنفراد بحكم مصر فمام بــ :\n عزل عمر مكرم من منصبه وأصدر حكما ا بنفيه إلى دمياط عام ٔ۸ٓ۹ م .\n تعيين الشيخ السادات نميبا ا لألشراف .\n بم تفسر : رغبة «محمد على» فى التخلص من الزعامة الشعبية؟ بسبب :\nإدراكه خطورة الزعامة الشعبية على مكانته . رغبته فى النفراد بحكم . -4 خطر المماليك ( 1811 م) -:\n أدرك «محمد علي» أن المماليك يمثلون تهديداً لحكمه ما النتائج ؟ مما أدى إلى :\n- سعيه للتخلص منهم خالل عدة معارن .\n*مذبحة القلعة :\n ألام «دمحم علي» حفالا كبيرا ا في الملعة دعا إليه كبار رجال الدولة وأمراء الممالين .\n بعد انتهاء الحتفال أُغلمت أبواب الملعة وتخلَّص جنوده من أمراء الممالين وعُرفت هذه الحادثة\nباسم «مذبحة الملعة» .\n ثم أرسل «دمحم علي» لواته للصعيد بم تفسر؟ لمطاردة َمن تبمَّى من الممالين الذين لم يحضروا\nالحفل وكانوا في الصعيد حتى أجالهم بعيدا ا عن البالد ."],[60,"التدريب الثاني\nس :1 صوب ما تحته خط :\nٔ) اجتمع زعماء الشعب فى الملعة ثم توجهوا إلى «دمحم على وعرضوا عليه ولية مصر .\nٖ) تعد مدينة رشيد أول مدينة استولت عليها حملة فريزر عام ٔ۸ٓ۷ م .\nٗ) أصدر «دمحم على » حك اما عام ٔ۸ٓ۹ م بنفى الشيخ السادات إلى دمياط .\n٘) نجح « دمحم على» فى التخلص من الزعامة الشعبية بتدبير مذبحة الملعة لهم .\nس :2 بم تفسر ... ؟\nٔ) ليام الشعب المصرى بعزل خورشيد باشا من حكم مصر .\nٕ) تراجع السلطان العثمانى عن الفرمان الذى أصدره بنمل دمحم على » إلى ولية سالونين .\nٖ) ليام إنجلترا بإرسال حملة فريزر إلى مصر عام ٔ۸ٓ۷ م .\nس :3 ما النتائج التي ترتبت على :\nفرض «دمحم على » الضرابب ، ومصادرة بعض الممتلكات بعد توليه الحكم ؟\nس :4 دلل على صحة كل عبارة مما يأتي :\nٔ) استطاع «دمحم» على « كسب ثمة زعماء الشعب المصرى أثناء ولية خورشيد باشا .\nٕ) نجحت الزعامة الشعبية فى تغيير المشهد السياسي في مصر عام ٘ٓ ٔ۸ م ."],[61,"س .1 اختر اإلجابة الصحيحة مما بين القوسين :\nٔ) بمجيء الحملة الفرنسية على مصر تراجعت سيطرة . ..........\n(الممالين - العثمانيين - المصريين - العلماء)\nٕ) المدينة التي انسحبت منها الموات اإلنجليزية وسلمتها للعثمانيين بعد صلح أميان هي . ..........\n(الماهرة - اإلسكندرية - رشيد - دمياط)\nٖ) بعد استعادة الدولة العثمانية سيطرتها على مصر حاولت المضاء على نفوذ ..........\n(الزعامة الشعبية - الممالين - الفرنسيين - اإلنجليز)\nٗ) السبب الربيسي فى ثورة الشعب المصري ضد البرديسي عام ٗٓ ٔ۸ م ..........\n(ولء المصريين للعثمانيين - مساعدة اإلنجليز للبرديسي - رغبة المصريين فى تولية دمحم علي - فرض\nالضرابب الباهظة)\nدورا فى تهدبة المصريين أثناء ثورتهم عام ٗٓ ٔ۸ م . ..........\n٘) كان له ا\n(خورشيد - خسرو - دمحم علي - السلطان العثماني)\n)ٙ التمى المشايخ والعلماء بـ «دمحم علي» إلعالنه واليا ا فى منزله بـ . ..........\n(الملعة - األزبكية - رشيد - دمياط)\n(دمياط - اإلسكندرية - سالونين - الصعيد)\n(دمحم بن األلفي - السيد عمر مكرم - موسى باشا - عبد هللا الشرلاوي)\n)۹ أي من الشخصيات التالية حاولت إنجلترا عن طريمه إلامة حكم موال لها فى مصر لكنه توفى لبل\n(دمحم علي - البرديسي - موسى باشا - دمحم بن األلفي)\nوصول حملة فريزر . ..........\n(الممالين - المصريين - العثمانيين - الفرنسيين)\n(الماهرة - اإلسكندرية - الصعيد - رشيد)\nٕٔ) تجهيز الشعب المصري احتجاجا على فرض «دمحم علي» ضرابب جديدة فى . ..........\n(الملعة - الجامع األزهر - بيت الماضي - مدينة اإلسكندرية)\n(السعيد - دمياط - اإلسكندرية - الصعيد - رشيد)\nٗٔ) تخلص «دمحم علي» من الشروط التى فرضت عليه عند توليته عندما ..........\n٘ٔ) طاردت لوات «دمحم علي» الممالين الذين لم يحضروا حفل الملعة وكانوا فى ..........\n(اإلسكندرية - الصعيد - الماهرة - الحماد)"],[62,"س :2 اكتب كلمة ( صواب ) أوكلمة (خطأ) ، مع التصويب :\n(ٔ) عاشت مصر خالل الحكم العثماني فترة متطورة فكرياا وثمافياا .\n(ٕ) تصارع على حكم مصر بعد خروج الحملة الفرنسية ثالث لوى .\n(ٖ) كان هدف إنجلترا من البماء فى مصر بعد خروج الحملة الفرنسية تؤمين طرق تجارتها إلى\nاألمريكتين .\n(ٗ) غادرت الموات اإلنجليزية مصر بعد صلح أميان .\n(٘) بعد خروج الحملة الفرنسية من مصر رأى الممالين أن لهم الحك فى حكم مصر .\n( )ٙ بعد خروج الحملة الفرنسية كانت الدولة العثمانية تتؤخر فى إرسال مرتبات الحامية العثمانية فى\nمصر .\n( )۷ خسابر الممالين المتكررة أمام الفرنسيي )۹ إدران «دمحم علي» تهديد الممالين لحكمه .\nس .7 ما النتائج التى ترتبت على ... ؟\n(ٔ) الضطرابات السياسية والتصارع على حكم مصر عمب خروج الحملة الفرنسية .\n(ٕ) عمد صلح أميان «بالنسبة لمصر» .\n(ٖ) إرهاق الولة العثمانيين للمصريين بالضرابب .\n(ٗ) تؤخر الولة العثمانيين فى دفع مرتبات الحامية العثمانية .\n(٘) ثورة الشعب المصري ٗٓ ٔ۸ م .\n( )ٙ اشتداد ظلم خورشيد باشا وجنوده للمصريين .\n( )۷ رفض خورشيد باشا عام ٘ٓ ٔ۸ م التنازل عن الولية .\n( )۸ فشل حملة فريزر عام ٔ۸ٓ۷ م ."],[64,"س .8 دلل على صحة كل عبارة من العبارات اآلتية :\n(ٔ) عانت مصر خالل الحكم العثماني من الجمود والتؤخر فى شتى نواحي الحياة .\n(ٕ) عاشت مصر فترة من الفوضى والضطرابات بعد رحيل الحملة الفرنسية .\n(ٖ) عملت الدولة العثمانية على استعادة سيطرتها على مصر بعد خروج الحملة الفرنسية .\n(ٗ) تؤثرت مصر بتدهور أحوال العثمانية بعد خروج الحملة الفرنسية .\n(٘) عمل «دمحم علي» على التمرب من الشعب المصري أثناء ثورة ٗٓ ٔ۸ م .\n( )ٙ استطاع «دمحم علي» كسب ثمة المصريين أثناء ولية خورشيد باشا .\n( )۸ سار «دمحم علي» على خطى الولة العثمانيين الذين سبموه فى مواجهة األزمات اللتصادية .\n( )۹ رفض الشعب المصري سياسة «دمحم علي» فى فرض الضرابب .\nأسئلة الكتاب المدرسي :\nس .1 أكمل العبارات التالية بكلمات مناسبة :\n(ٔ) انسحبت الموات اإلنجليزية من مصر عمب خروج الحملة الفرنسية بموجب شروط صلح . ..........\n(ٕ) نُفى السيد «عمر مكرم» إلى .................... ولرروا عزل الوالي خورشيد باشا .\n(ٖ) اجتمع زعماء الشعب والعلماء فى .................... فرماناا بنمل «دمحم علي» إلى ولية . ..........\nس :2 اكتب كلمة ( صواب ) أوكلمة (خطأ) ، مع التصويب :\n(ٕ) تخلص «دمحم علي» من زعماء الممالين فى مذبحة الملعة .\n(ٖ) أيدت إنجلترا تعيين «دمحم علي» واليا على مصر منذ البداية لضمان مصالحها .\n(ٗ) عيُن دمحم بن األلفي نميبا ا لألشراف بعد عزل السيد «عمر مكرم» .\nس .2 بم تفسر ... ؟\n(ٕ) بماء الموات اإلنجليزية في مصر بعد رحيل الحملة الفرنسية .\n(ٖ) تُعد ثورة الشعب المصري عام ٗٓ ٔ۸ م نمطة تحول لصالح «دمحم علي» .\nس .4 دلل على صحة العبارتين التاليتين :\n(ٔ) لامت الزعامة الشعبية بدور تاريخي مهم فى حل بعض المشكالت التى واجهت «دمحم علي» .\n(ٕ) استطاع «دمحم علي» المضاء على الممالين لتثبيت حكمه ."],[65," يُعَّد عصر «محمد علي» ( 1848 - 1805 م) نقطة تحوُل كبرى في تاريخ مصر دلل؟ حيث :\nسس الدولة الحديثة بعد لرون من الفوضى والصراعات الداخلية .\n أ ّ\n اتخذ عدة سياسات وضعت الدولة على طريك التمدم اللتصادي والعلمي والعسكري ، وجعلتها لوة\nإلليمية ذات سيادة ونفوذ .\nأوالي : سياسة «حمند علي» الداخلية -:\n-1 اإلصالح اإلداري -:\n*تنظيم اإلدارة -:\nسم «دمحم علي» مصر إلى سبع مديريات ، ويتبع كل مديرية عدد من المراكز .\n ل ّ\n جعل الحكومة المركزية في الماهرة على رأس هذا النظام اإلداري بم تفسر؟ بهدف تسهيل\nسيطرته الكاملة على شبون البالد .\n* المجالس والدوواوين -:\n أنشؤ «دمحم علي» عدة مجالس ودواوين بم تفسر؟ لتُعَاونه في تسيير شبون البالد .\nومنها : مجلس المشورة -:\n دلل : اقتصرت عضوية مجلس المشورة على فئات مجتمعية معينة ؟ حيث :\nكان يتؤلف من كبار موظفي الحكومة واألعيان والعلماء ، وكان رأيه استشارياا فمط أما الرأي النهابي فهو\nلـ «دمحم علي» .\n دلل : حرص« محمد على» على اإلصالح اإلدارى لمصر؟\nحيث :\nٔ) لسم «دمحم علي» مصر إلى سبع مديريات ويتبع كل مديرية عدد من المراكز .\nٕ) كانت الحكومة المركزية فى الماهرة على رأس هذا النظام .\nٖ) أنشؤ عدة مجالس و دواوين ومنها مجلس المشورة ."],[66,"-2 اإلصالح العسكري -:\n*الـجـيـش -:\n بم تفسر : اهتمام«محمد على» بناء قوة عسكرية لمصر؟\n بم تفسر : كان للجيش أهمية كبيرة فى عهد «محمد على » ؟\nبهدف الحفاظ على حدود الدولة المصرية واستماللها .\n أدرك «محمد علي» أهمية الجيش في الحفاظ على حدود الدولة المصرية واستقاللها ،\nما النتائج؟ مما أدى إلى -:\nٔ) أنشؤ جيشاا نظامياا حديثاا من المصريين ودربه على األسلحة الحديثة؛بم تفسر؟ حيث أثبت\nالمصريون كفاءتهم وحربيتهم ونظامهم ولوة عزيمتهم .\nٕ) أرسل الضباط في بعثات إلى أوروبا بم تفسر؟ لتعلم الفنون العسكرية .\nٖ) أنشؤ المدارس العسكرية المتخصصة ، مثل : مدرسة الفرسان ، ومدرسة المشاة ، ومدرسة المدفعية .\nٗ) أنشؤ ترسانة لصنع األسلحة والمدافع بالملعة ، وأنشؤ ديوان الجهادية «وزارة الدفاع حالياا» .\n*األسـطـول -:\n- اهتم «محمد علي» بالبحرية المصرية دلل؟\nحيث -:\nٔ) فؤنشؤ ترسانة لصنع السفن في بولق ثم اإلسكندرية .\nٕ) أنشؤ إدارة خاصة لألساطيل المصرية التي كانت تعمل في البحرين األحمر والمتوسط .\nٖ) أنشؤ المدرسة البحرية .\nٗ) أرسل الضباط البحريين في بعثات علمية إلى أوروبا .\nالتدريب األول\nس :1 أكمل العبارات اآلتية بكلمات مناسبة :\nٔ) كانت الحكومة المركزية فى عهد «دمحم على» فى مدينة . ............\nٕ) أنشؤ «دمحم على » جيشاا نظامياا حديثاا من . ............\nٖ) أنشؤ «دمحم على » ترسانة لصناعة السفن في ............ ثم . .............\nس :2 دلل على صحة كل عبارة من العبارات اآلتية :\nٔ) اهتم «دمحم على » باإلصالح اإلدارى فى مصر .\nٕ) لم تكن لرارات مجلس المشورة الذي أنشؤه «دمحم على » نافذة المفعول .\nٖ) إنشاء «دمحم على» مجموعة من المدارس فى إطار إصالحاته العسكرية ."],[67,"-3 اإلصالح االقتصادي -:\nلجأ «محمد علي» إلى عدة وسائل لتوفير االحتياجات الالزمة للنهوض بالبالد في مختلف\nالمجاالت ، دلل؟ حيث كان من هذه الوسائل :\nٔ) إلغاء نظام اللتزام .\nنظام االحتكار\nٕ) وضع نظام الحتكار .\nوهو نظام التصادي\nجعل فيه «دمحم علي»\nالدولة هي المالن\nالوحيد لإلنتاج\nوالتجارة .\nٖ) الهتمام بجميع األنشطة اللتصادية للبالد من زراعة وصناعة وتجارة .\n-1 إلغاء نظام االلتزام : دلل؟\nحيث حلت الدولة مكان الملتزم وعادت إليها األموال التي كانت يُحصلها الملتزمون .\n-2 وضع نظام االحتكار :\n بم تفسر : وضع «محمد على » نظام االحتكار؟\nلتوفير الحتياجات الالزمة للنهوض بالبالد في مختلف المجالت .\n دلل : عملت الحكومة فى عهد «محمد على » على تطبيق نظام االحتكار في\nمختلف المجاالت االقتصادية؟\nحيث في :\nٔ) الزراعة : فرضت الحكومة على الفالحين زراعة محاصيل محددة (خاصة المطن ) ثم كانت\nتشتريها منهم بسعر محدد .\nٕ) الصناعة : أنشؤت الدولة مصانع حكومية تحت إدارتها المباشرة .\nٖ) التجارة : تولت بيع المنتجات داخلياا أو تصديرها للخارج لحساب الدولة .\n ما النتائج : تطبيق محمد علي نظام االحتكار؟\n دلل : نظام االحتكار الذى طبقه «محمد على » كان له مزايا وعيوب؟\nالمميزات\n زيادة دخل الدولة .\nالعيوب\n إرهاق الفالحين بم تفسر؟ بسبب انخفاض\n تمويل الجيش .\nأسعار المحاصيل المفروضة عليهم .\n تمويل المشروعات اللتصادية مما ساعد على  ضعف التجارة الحرة وهروب بعض التجار .\nحدوث تنمية التصادية بالدولة ."],[68,"*الزراعة :\n-1 ملكية األرض الزراعية -:\n وضع «محمد علي» يده على األراضي الزراعية دلل؟\nحيث :\nأصبح هو المالن ألراضي مصر باستثناء بعض األراضي الزراعية التي منحها لــ :\n- بعض الممربين إليه .\n- أفراد أسرته .\n دلل : لم يحصل الفالح المصرى على حقوقه كاملة فى األراضى الزراعية خالل حكم\nمحمد على؟\nحيث :\n عانى الفالح من انخفاض أسعار المحاصيل المفروضة عليه .\n وضع دمحم على يده على األراضى الزراعية وأعطى لكل فالح ٖ أو ٗ أفدنة لزراعتها ممابل دفع\nالمال الممرر عليها ولم تكن األرض تورث ومن الممكن أن تنمل ألبناء الفالح بعد وفاته إذا كانوا\nلادرين على زراعتها ودفع المال ما النتائج؟ فظل الفالح أجيرا ا في أرضه .\n-2 المحاصيل الزراعية -:\n أدخل «محمد علي» محاصيل جديدة لمصر وتوسع في زراعتها ، مثل :\nالقطن طويل التيلة ما النتائج؟ فؤصبحت مصر خالل سنوات لليلة من أهم الدول المنتجة له .\n-3 مشروعات الري -:\n- اهتم «محمد علي» بشؤون الري دلل؟\n حفر العديد من الترع ، مثل : ترعة المحمودية وألام الجسور .\n أنشؤ المناطر على الترع بم تفسر؟ لضبط مياهها وتسهيل عملية الري .\n بدأ في إنشاء المناطر الخيرية ما النتائج؟ ساعدت على تطبيك نظام الري الدابم .\n*الصناعة :\n اهتم «محمد علي» بالصناعة بم تفسر؟ بهدف -:\nٔ) سد احتياجات الجيش .\nٕ) تمليل العتماد على الواردات األوروبية ."],[69,"حيث قام بـ :\n دلل : أقام «محمد على » نهضة صناعية بمصر؟\nٔ) تطوير الصناعات المديمة التى كانت موجودة بمصر ، مثل : صناعة الغزل والنسيج وصناعة األواني\nالفخارية وغيرها .\nٕ) الستعانة بخبراء أوروبيين بم تفسر؟ لإلسهام في النهضة الصناعية .\nٖ) إنشاء عديد من المصانع الجديدة دلل؟ ومنها :\nمصانع غزل ونسج المطن والحرير . - مصانع األسلحة .\n- مصانع السكر ومضارب األرز .\n- مصانع المالبس .\n- مدابغ الجلود .\n*التجارة :\n ازدهرت التجارة الداخلية والخارجية لمصر في عصر «محمد علي» بم تفسر؟ بسبب :\nٔ) ازدهار الزراعة والصناعة واستمرار األمن الداخلي .\nٕ) تمهيد ال ُّ\nط ُرق البرية مثل : طريك (السويس - الماهرة) .\nٖ) شك الترع بم تفسر؟ للربط بين المدن المختلفة .\nٗ) إنشاء األسطول المصري في البحرين األحمر والمتوسط .\nمما أدى إلى ازدهار التجارة .\n-3 اإلصالح االجتماعي -:\n*العمران -:\n دلل : اهتم «محمد على» بالعمران؟\nحيث :\nٔ) شي َد «دمحم علي» الحصون والمالع على السواحل المصرية بم تفسر؟ لصد هجمات األعداء عليها .\nشيَّد العديد من السرايات (المصور) من أهمها :\nٕ) َ\n سراي رأس التين باإلسكندرية .\n سراي لصر النيل في الماهرة .\n*التعليم والثقافة :\n اهتم محمد علي بالتعليم والثقافة بم تفسر؟ ألن «محمد علي» أدرك حاجته إلى :\n موظفين في المصالح الحكومية .\n فنيين ومتخصصين في مختلف المجالت لسد احتياجات الجيش واألسطول ."],[70," دلل : عمل «محمد على» على تطوير الجانب الفكري والثقافى فى مصر؟\nحيث قام بـ :\nٔ) أنشأ المدارس العليا ، مثل : مدرسة الطب والصيدلة والزراعة والمهندسخانة .\nٕ) استعان ببعض األساتذة األجانب بم تفسر؟ للتدريس في المدارس العليا .\nٖ) أنشأ المدارس االبتدائية والتجهيزية بم تفسر؟إلعداد التالميذ لاللتحاق بالمدارس العليا .\nٗ) أرسل محمد علي البعثات العلمية في التخصصات المختلفة إلى أوروبا بم تفسر؟\n٘) إلعداد نخبة من المتعلمين والخبراء .\n)ٙ أنشأ مدرسة األلسن بم تفسر؟ بسبب نشاط حركة الترجمة من اللغات األوروبية إلى اللغة العربية .\n)۷ أنشأ ديوان المدارس «وزارة التربية والتعليم حالياا»\n)۸ أنشأ المطبعة األميرية في بوالق بم تفسر؟ لطبع الكتب والمنشورات الحكومية .\nالتدريب الثاني\nس :1 اكتب ما تشير إليه كل عبارة من العبارات اآلتية :\nٔ) أنشؤها «دمحم على » على الترع لضبط مياهها وتسهيل عملية الرى .\nٕ) مدرسة أنشؤها «دمحم على » بهدف تنشيط حركة الترجمة من اللغات األوروبية إلى اللغة العربية .\nٖ) مطبعة أنشؤها دمحم على» فى بولق لطبع الكتب واألوامر والمنشورات الحكومية .\nس :2 بم تفسر ... ؟\nٔ) لجوء «دمحم على » إلى تطبيك نظام الحتكار فى اللتصاد المصرى .\nٕ) اهتمام «دمحم» على « بالصناعة وتطويرها فى مصر .\nٖ) ازدهار حركة التجارة الداخلية والخارجية فى عهد دمحم على .\nٗ) اهتمام «دمحم» على « بالتعليم والثمافة .\nس :3 قارن بين :\nالمدارس العليا ، والمدارس البتدابية والتجهيزية فى عهد «دمحم على» ، من حيث : الهدف من إنشاءها .\nس :4 ما تقييمك لمصداقية كل عبارة مما يأتى ... ؟ مع ذكر السبب في الحالتين :\nٔ) لام «دمحم على» بتنظيم اللتصاد المصرى على أساس نظام اللتزام .\nأجيرا فى أرضه رغم التغيرات التي أحدثها «دمحم على» فى نظام الملكية الزراعية .\nٕ) ظل الفالح بمصر\nا"],[71,"ثاىييا : سياسة «حمند علي» اخلارجية -:\n خاض «محمد علي» كثيريا من الحروب باسم السلطان العثماني (حروب شبه الجزيرة\nالعربية و حرب المورة) ولكن طموحه في إقامة دولة قوية تكون له وألوالده من بعده\nدفعه لمحاربة السلطان العثماني نفسه وتوسيع حدود دولته .\n*أهم الحروب التي خاضها محمد علي -:\nأوالي : حروب باسم السلطان العثماني تمثلت في -:\n-1 حروب شبه الجزيرة العربية :\nاسبابها\nنتائجها\nاستعان السلطان العثماني بـ«دمحم علي» للمضاء على الوهابيين في شبه الجزيرة\nالعربية ، بعد أن توسع نفوذهم على حساب أراضي الدولة العثمانية؛ مما هدّد\nسلطتها الدينية والسياسية .\nٔ - نجح «دمحم علي» في هزيمة الوهابيين .\nٕ - سيطر «دمحم علي» على معظم شبه الجزيرة العربية .\n-2 حروب اليونان \" المورة \" -:\n بم تفسر : إرسال«محمد علي» أسطوالي لشبه جزيرة المورة؟ بسبب :\nاسبابها\nنتائجها\nاستعانة السلطان العثماني بـ«دمحم علي» إلخماد الثورة في شبه جزيرة المورة\nباليونان ، فؤرسل «دمحم علي» أسطول ا بميادة ابنه إبراهيم باشا .\nٔ - مساندة الدول األوروبية (تدخل أجنبي) (إنجلترا وفرنسا وروسيا) للثوار\nاليونانيين وإرسال أساطيلها إلى السواحل اليونانية ما النتائج؟\nتدمير األسطولين العثماني والمصري في معركة نافارين عام ٔ۸ٕ۷ م . - اضطرت الموات المصرية إلى النسحاب .\n ما النتائج : معركة نفارين عام 1827 م؟\nمما أدى إلى :\n- تدمير األسطولين العثماني والمصري .\n- اضطرت الموات المصرية إلى النسحاب ."],[72,"ثانياً : حروب برغبة محمد علي تمثلت في -:\n-1 حــرب السـودان -:\nأسبابها\nرغبة دمحم على فى تحميك مكاسب سياسية والتصادية وعسكرية .\nنتائجها\nمد النفوذ المصرى إلى جنوب السودان وإنشاء مدينة الخرطوم واكتشاف منابع نهر\nالنيل .\n-2 حـروب الــشـام -:\n*أسبابها :\nاألسباب الحقيقية :\nأرسل «محمد علي» قواته إلى الشام\nاألسباب الظاهرية :\n بم تفسر : كان والي عكا عامالي مساهماً\nبم تفسر؟ لعدة أسباب :\nفي قيام حروب الشام؟\nٔ) توسيع نفوذه السياسي .\nٕ) تحميك طموحه في بناء دولة لوية مستملة\nعن الدولة العثمانية .\nخالف دمحم علي مع عبد هللا باشا والي عكا بم تفسر؟ بسبب امتناع عبد هللا باشا عن إرسال\nاألخشاب الالزمة إلعادة بناء األسطول المصري\nالذي تحطم في معركة نافارين .\n*نتائجها -:\nبسبب :\n ما النتائج : حروب محمد علي بالشام ؟\n- أرسل «محمد علي» حملة برية وأخرى بحرية إلى الشام عام 1831 م ما النتائج؟\n السيطرة على مدن الشام الواحدة تلو األخرى .\n توغلت الموات المصرية في آسيا الصغرى مهددة األستانة عاصمة الدولة العثمانية .\n*أسبابها  : بم تفسر : عقد الدول األوروبية معاهدة لندن 1840 م؟\n خشيت الدول األوروبية من توسعات «دمحم علي» وزيادة نفوذه على مصالحها فعمدت مع السلطان\nالعثماني معاهدة لندن سنة ٓٗ ٔ۸ م ."],[73,"*شروطها :\n احتفاظ «دمحم علي» بحكم مصر وأن يكون الحكم وراثياا في أسرته بشرط أن تظل مصر ولية\nعثمانية وتدفع مبلغاا مالياا سنوياا للدولة العثمانية .\n احتفاظ «دمحم علي» بولية عكا مدى حياته .\n الموافمة على شروط المعاهدة خالل عشرة أيام .. وإل تُسحب منه ولية عكا .\n*موقف محمد علي من المعاهدة -:\nفي البداية -: رفض محمد علي شروط المعاهدة وكانت فرنسا تُشَّجعه على ذلك\nوتعده بالدعم ما النتائج؟\nٔ) أرسلت بريطانيا أسطولها لمطع التصال بين مصر والشام .\nٕ) اشترن األسطولن العثماني والبريطاني في ضرب بعض مواني الشام .\nٖ) أصدر السلطان العثماني فرماناا بعزل «دمحم علي» من ولية مصر .\nفي النهاية -: اضطر «محمد علي» للموافقة على شروط المعاهدة .\n*نتائج المعاهدة  -: ما النتائج : موافقة محمد علي على شروط المعاهدة؟\nٔ) فشل مشروع «دمحم علي» في الستمالل بحكم مصر .\nٕ) انسحاب دمحم علي من كل األراضي التي سيطر عليها .\nٖ) تمليل عدد الجيش المصري .\nٗ) إغالق عدد كبير من المدارس والمصانع .\n٘) تدهورت الصناعات الوطنية لرتباطها بحاجات الجيش .\nرغم فشل «محمد علي» في تحقيق مشروعه السياسي ، فإنه نجح في وضع قواعد الدولة\nالمصرية الحديثة على أُسُس راسخة .\n ما العالقة بين : معاهدة لندن 1840 م ، ونهضة محمد على االقتصادية؟\nأدى فرض معاهدة لندن ٓٗ ٔ۸ م إلى تراجع النهضة اللتصادية التي لام بها دمحم على ألن من نتابجها\nإغالق عدد كبير من المصانع وتدهور الصناعات الوطنية لرتباطها بحاجات الجيش المصرى ."],[74,"الحظ -: السياسة الدولية بين التحالف والعداء -:\nحينما رأت فرنسا توسعات «دمحم علي» ، التي لد تُش ِ ّكل خ َ\nط ارا عليها وعلى الدول األوروبية ، اتحدت مع\nإنجلترا ضده ، ولال المنصل الفرنسي ُمحا ِو ال تبرير تغيُر مولف دولته من «دمحم علي» « : إن المسؤلة\nليست مصرية بل شرلية وأوروبية أيضاا ، إن فرنسا أيدتن ولكنها لم تستطع أن تتحلل من روابط\nالسياسة التي تربطها بؤوروبا وإنجلترا خاصة» . فر َّد عليه «دمحم علي» ا\nلابال « : لست أطلب أن تتخلى\nفرنسا عن أحالفها لخاطري ، وإنما وددت لو لم تمف مني مولف العداء» .\nالحظ -: الجيش المصري درع الوطن -:\nيُعد الجيش المصري من أهم ركابز الدولة ، وهو من ألدم الجيوش النظامية ، حيث يجمع بين\nعرالة التاريخ ووحدة التنظيم ، ولد أثبت كفاءته في موالف تاريخية بارزة ، مثل حرب أكتوبر\nٖ ٔ۹۷ م ، ول يمتصر دوره على الدفاع العسكري فمط ، بل يمتد إلى دعم جهود التنمية ومساندة\nالدولة في مواجهة األزمات؛ مما يجعله ا\nرمزا للموة والستمرار في مصر .\nالحظ -: مراحل تكوين الجيش المصري في عصر «محمد علي» -:\nحاول «دمحم علي» في البداية العتماد على جنوده األلبان في بناء جيش نظامي وتدريبه\nبالطرق الحديثة ولكنه لم ينجح بسبب ت َم ُّردهم؛ فاتجه لتجنيد السودانيين حتى ل يإثر تجنيد\nالمصريين على الزراعة ولكن تلن التجربة لم تنجح؛ لعدم تؤللمهم مع مناخ مصر؛ فاتجه إلى\nتجنيد المصريين ، واستعان بؤحد الضباط الفرنسيين لتنظيم الجيش وتدريبه ، ولد استغرق\nتدريبهم نحو ثالث سنوات ، بعدها بدأ الضباط المصريون بتدريب الجنود ، وأصبح الجيش في\nعصر «دمحم علي» أداة لوية لتحصين السلطة المركزية والسيطرة على الفوضى الداخلية ."],[75,"س .1 اختر اإلجابة الصحيحة مما بين القوسين :\n(ٔ) كان ممر الحكومة المركزية المصرية في عهد «دمحم علي» بمدينة ..........\n(أسوان - اإلسكندرية - السويس - الماهرة)\n(ٕ) تؤلف مجلس المشورة من عدة فبات يخرج عنها ..........\n(كبار موظفي الحكومة - الفالحين - األعيان - العلماء)\n(ٖ) ثاني الترسانات البحرية التي أنشؤها «دمحم علي» لصناعة السفن كانت تمع في مدينة ..........\n(اإلسكندرية - السويس - الماهرة - أسوان)\n(ٗ) محصول تم عرضه على الفالحين لزراعته في عهد «دمحم علي» . ..........\n(الممح - البنجر - المطن - األرز)\n(٘) تعد من المصانع التمليدية التي كانت موجودة بمصر لبل لدوم دمحم علي ثم لام بتطويرها ..........\n(مصانع السكر - مدابغ الجلد - مضارب األرز - مصانع الغزل والنسيج)\n( )ٙ أنشؤ «دمحم علي» المطبعة األميرية في ( . ......... السويس - أسوان - بولق - اإلسكندرية)\n( )۷ أي مما يلي أنشؤه «دمحم علي» وكان له عاللة مباشرة بتظيم الجانب التعليمي لدولته ؟ ..........\n(ديوان الجهادية - مجلس المشورة - ديوان المدارس - السرايات)\n( )۸ تم إنشاإه في عهد «دمحم علي» لتحميك مهام عسكرية . .........\n(مجلس المشورة - الحصون والمالع - مدرسة األلسن - ديوان المدارس)\n( ) التعليم والثمافة في مصر .\n(ٕ) ازدهرت الزراعة في مصر في عهد «دمحم علي» .\n(ٖ) كانت لحروب «دمحم علي» على الشام أسباب ظاهرية وأخرى حميمية .\n(ٗ) أثر التدخل األوروبي سلبا ا على المشروع السياسي «لدمحم علي» .\nس .5 ما النتائج التي ترتبت على ... ؟\n(ٔ) نظام الحتكار .\n(ٕ) معاهدة لندن ٓٗ ٔ۸ م .\n(ٖ) معركة نافارين ٔ۸ٕ۷ م ."],[81,"بعد أن نجح «محمد علي» في وضع أُسس الدولة المصرية الحديثة تولى حكم مصر عدد\nمن أبنائه وأحفاده ، وشهدت مصر في عصرهم تطورات مهمة في العديد من المجاالت ،\nكما واجهت تحديات داخلية وخارجية أثرت على الدولة .\n*إبراهيم باشا (ابن محمد علي) -:\n دلل : تميز إبراهيم باشا ببراعته في المجال الحربي ؟ حيث :\n ساعد إبراهيم باشا والده «دمحم علي» في أعماله العسكرية .\n لاد الجيش المصري في كثير من المعارن .\nتولى حكم مصر بعد مرض والده ولكنه لم يبقَّ في الحكم إال عدة أشهر ومات قبل والده\nومن أبرز خلفاء «محمد علي» وأهم إنجازاتهم -:\nأوليا : عباس حلني باشا األول ( 1854 - 1848 و) -:\n اسمه -: هو عباس بن طوسون بن دمحم علي .\n وصوله للحكم -: تولى حكم مصر خلفاا لعمه إبراهيم باشا .\n فترتة حكمه -: واتسمت فترة حكمه التي ل تتجاوز ست سنوات بالرجعية والجمود .\n مميزات حكمه -:\n دلل : اهتم عباس باشا األول بتسهيل حركة التجارة؟\nحيث :\nٔ) أصلح الطريك البري بين الماهرة والسويس .\nٕ) بدأ في تنفيذ مشروع مد خط سكة حديد بين الماهرة واإلسكندرية .\nٖ) بدأ مد الخطوط التلغرافية ، بم تفسر؟ لتسهيل حركة التجارة .\n سلبيات حكمه -:\n دلل : اتسمت فترة حكم عباس باشا األول بالرجعية والجمود؟ حيث :\nٔ) أغلك معظم المدارس والمصانع التي أنشؤها «دمحم علي» .\nٕ) استدعى البعثات العلمية من فرنسا .\nٖ) أهمل الجيش والبحرية ."],[82,"ثاىييا : حمند سعيد باشا ( 1863 - 1854 و) -:\n اسمه -: هو دمحم سعيد بن دمحم علي .\n وصوله للحكم ، -: تولى حكم مصر بعد وفاة عباس حلمي باشا األول .\n مميزات عهده :\n-1 الزراعة -:\n دلل : حظيت الزراعة باهتمام كبير من جانب محمد سعيد ؟\n دلل : اهتم محمد سعيد بإصالح حال الفالحين ؟\nحيث :\nوحرا في\nٔ) أصدر الالبحة السعيدية ما النتائج؟ أصبح الفالح له حك في توريث األرض ألبنابه\nتصريف محاصيله الزراعية .\nٕ) خفف الضرابب وتجاوز عن المتؤخر منها .\nٖ) اهتم بتطهير ترعة المحمودية التي ُحفرت في عصر «دمحم علي» .\n-2 التجارة -:\n دلل : اهتم محمد سعيد بشركات المالحة النهرية والبحرية ؟\nحيث :\nٔ) أنشؤ شركة تجارية عن طريك النيل بم تفسر؟ لنمل المحاصيل الزراعية والمسافرين .\nٕ) أنشؤ شركات في البحرين المتوسط واألحمر بم تفسر؟ لتسيير البواخر في البحرين .\n-3 السكك الحديدية والتلغرافات -:\n دلل : اهتم محمد سعيد بالسكك الحديدية والتلغرافات ؟\nحيث :\nٔ) استكمل خط السكة الحديدية بين الماهرة واإلسكندرية (. الذي بدأه عباس حلمي باشا األول)\nٕ) مد خط سكة حديدية بين الماهرة والسويس .\nٖ) م ّد الخطوط التلغرافية بين اإلسكندرية والماهرة والسويس ."],[83,"-4 الجيش -:\n دلل : حقق محمد سعيد باشا العدالة االجتماعية في الجيش ؟\n بذل محمد سعيد باشا جهوديا كبيرة للنهوض بالجيش (الذي ضعف في عصر عباس\nحلمي باشا األول) دلل؟ حيث قام بـ :\nصير مدة الخدمة العسكرية إلى عام واحد وجعلها إجبارية على جميع المصريين .\nٔ) تم َّ\nٕ) فتح باب الترلي أمام الضباط المصريين .\n-5 الثقافة -:\n اهتم محمد سعيد باشا باآلثار المصرية دلل؟ حيث َ : ج َّهز مخازن في بولق لحفظ اآلثار .\n مساوئ عهده -:\n-1 التعليم -:\n استمر في عصره الجمود الذي أصاب التعليم في عصر عباس حلمي باشا األول دلل؟\nحيث - : ألغى ديوان المدارس (وزارة التربية والتعليم حالياا) .\n-2 القروض األجنبية -:\n فتح محمد سعيد باشا باب االستدانة من الدول األوروبية بم تفسر؟\n-3 امتياز قناة السويس -:\n عندما تولى محمد سعيد باشا حكم مصر عرض عليه ديليسبس فكرة مشروع قناة\nالسويس فوافق ومنحه عقد االمتياز األول عام 1854 م ، والذي كان من أهم بنوده ما يلي :\nٔ - منح ديليسبس حك تؤسيس شركة عالمية لحفر لناة تصل بين البحر المتوسط والبحر األحمر .\nٕ - تتولى الشركة حفر لناة السويس وترعة للمياه العذبة من نهر النيل إلى منطمة المناة .\nٖ - تحصل الشركة على امتياز استغالل المناة لمدة ۹۹ سنة تبدأ من تاريخ افتتاحها للمالحة .\n وفي عام 1856 م منح محمد سعيد باشا ديليسبس عقد االمتياز الثاني ما النتائج؟ الذي\nأُلزم مصر بأعباء فادحة ."],[84,"التدريب األول\nس :1 اختر اإلجابة الصحيحة مما بين القوسين :\nٔ) تولى عباس حلمى باشا األول حكم مصر خلفاا لعم . ........\n)طوسون باشا - إبراهيم باشا - سعيد باشا - دمحم على )\nٕ) بدأ مشروع مد خط سكة حديد بين الماهرة واإلسكندرية فى عهد . .........\n( عباس حلمى باشا األول - إبراهيم باشا - دمحم سعيد باشا - دمحم على )\nوحرا فى تصريف\nٖ) أي مما يلي أصبح بموجبه الفالح المصرى له حك توريث األرض ألبنابه\nا\nمحاصيله؟ ( ......... عمد المتياز األول - الالبحة السعيدية - عمد المتياز الثاني - فتح باب الستدانة )\nس :2 من أكون ... ؟\nٔ) ساعدتُ والدى دمحم على فى أعماله العسكرية ، ولدتُ الجيش المصرى في معارن كثيرة ، وتوفيت لبل\nوالدى .\nٕ) تم تطهير ترعة المحمودية في عهدى .\nٖ) لمتُ بإصالح الطريك البرى بين الماهرة والسويس .\nٗ) لمتُ بتمصير مدة الخدمة العسكرية إلى عام واحد وجعلتها إجبارية على جميع المصريين ، كما فتحت\nباب الترلى أمام الضباط المصريين .\n٘) عرضتُ على «دمحم سعيد باشا » فكرة مشروع حفر لناة السويس ، وحصلت منه على عمد المتياز\nاألول عام ٗ٘ ٔ۸ م .\nس :3 بم تفسر ... ؟\nٔ) اتسم عهد عباس حلمى باشا األول بالرجعية والجمود .\nٕ) فتح دمحم سعيد باشا باب الستدانة من الدول األوروبية .\nس :4 قارن بين : سياسة عباس حلمى باشا األول ، وسياسة دمحم سعيد باشا ، تجاه الجيش المصرى .\nس :5 حدد :\nأهم بنود عمد المتياز األول لحفر لناة السويس عام ٗ٘ ٔ۸ م"],[85,"ثالجيا : اخلديو إمساعيل ( 1879 - 1863 و) -:\n اسمه -: هو إسماعيل بن إبراهيم بن دمحم علي .\n وصوله للحكم -: تولى حكم مصر بعد وفاة عمه دمحم سعيد باشا .\n مميزات حكمه يُ : عد عصره من أكثر الفترات تمد اما وعمراناا في تاريخ مصر الحديث .\n ومن أهم أعماله في مصر :\n-1 الزراعة والري -:\n دلل : اهتم إسماعيل باشا بالري والزراعة ؟ حيث قام بـ :\nٔ) زيادة مساحة األراضي الزراعية .\nٕ) التوسع في زراعة بعض المحاصيل ، مثل : المطن ، ولصب السكر .\nٖ) الهتمام بمشروعات الري ، مثل : حفر ترعة اإلبراهيمية وترعة اإلسماعيلية .\n-2 الصناعة والتجارة -:\n دلل : اهتم إسماعيل باشا بالصناعة والتجارة ؟ حيث قام بـ :\nٔ) زيادة مصانع السكر .\nٕ) إعادة فتح المصانع التي أنشؤها «دمحم علي» مثل : مصانع النسيج والغزل والطوب والزجاج ، وغيرها .\nٖ) إنشاء شركة للمالحة التجارية .\nٗ) الهتمام بتطوير مينا َءي اإلسكندرية والسويس .\n-3 السكك الحديدية والبريد -:\n دلل : اهتم إسماعيل باشا بالسكك الحديدية والبريد ؟ حيث قام بـ :\nٔ) إنشاء عدة خطوط للسكن الحديدية .\nٕ) ُمدت الخطوط التلغرافية بين مختلف محافظات مصر وامتدت إلى السودان بم تفسر؟\nلربط مدن السودان بمصر .\nشب َت مصلحة البريد المصرية ومكاتبها الفرعية في اإلسكندرية والماهرة واأللاليم .\nٖ) أ ُ ْن ِ"],[86,"-4 النهضة الثقافية والعلمية -:\n دلل : اهتم إسماعيل باشا بالنهضة الثقافية والعلمية ؟ حيث قام بـ :\nٔ) مضاعفة ميزانية التعليم .\nٕ) إعادة فتح ديوان المدارس .\nسنيَِّة للبنات .\nٖ) إعادة فتح المدارس التي أُغلمت وإنشاء العديد من المدارس الجديدة ومنها : مدرسة ال َّ\nٗ) إرسال البعثات العلمية إلى الدول األوروبية .\n٘) إنشاء دار األوبرا ودار الرصد بالعباسية (المرصد الفلكي) والجمعية الجغرافية .\nلتجميع اآلثار العربية واإلسالمية والمحافظة عليها ثم افتتحها الخديو عباس حلمي الثاني\nوتعرف حالياا باسم «متحف الفن اإلسالمي» .\nعام ٖٓ ٔ۹ م\n-5 النهضة الصحية -:\n دلل : شهد عهد إسماعيل باشا نهضة في مجال الصحة ؟ حيث قام بـ :\nٔ) إنشاء عدة مستشفيات في الماهرة واإلسكندرية واأللاليم .\nٕ) بُ ِذ َلت جهود كثيرة لمكافحة األوببة ومماومة األمراض .\n-6 النهضة العمرانية -:\n دلل : شهد عهد إسماعيل باشا نهضة في مجال العمران؟ حيث قام بـ :\nالهتمام بتخطيط المدن وتنظيمها وتجميلها مثل مدينة الماهرة لام بـ :\nأُعيد تخطيط العديد من األحياء بها .\nشب َت بها أحياء جديدة مثل : حي عابدين .\nأ ُ ْن ِ\nشب َت عدة لصور مثل : لصر عابدين ولصر المبة .\nأ ُ ْن ِ\n-7 الجيش -:\n دلل : اهتم إسماعيل باشا بالجيش ؟ حيث قام بـ :\nٔ) إنشاء المدارس الحربية والستعانة بؤكفؤ المدرسين والضباط .\nٕ) تزويد الجيش باألسلحة الحديثة ."],[87,"-8 البحرية -:\n دلل : اهتم إسماعيل باشا بالبحرية ؟ حيث :\nٔ) أنشؤ عدة سفن حربية في ترسانات أوروبا .\nٕ) جدَّد المدرسة البحرية باإلسكندرية .\n* مجلس شورى النواب -:\n أنشأ الخديو إسماعيل مجلس شورى النواب في عام 1866 م وكان دوره استشارييا دلل؟\nحيث : كان للمجلس حك منالشة الموانين والضرابب من دون أن يكون له حك العتراض أو إصدار\nلرارات ُم ْل ِزمة .\n أهميته : رغم محدودية صالحياته إل أنه :\nأسهم في زيادة الوعي السياسي لدى المصريين .\nأتاح للمصريين حك التعبير عن مشكالتهم .\n كانت السياسة الخارجية التي اتبعها الخديو إسماعيل تهدف إلى :\n- زيادة نفوذ مصر .\n- تعزيز مكانتها الدولية .\n- االستقالل التام عن الدولة العثمانية .\n مساوئ عهده -:\n-1 أزمة الديون وزيادة التدخل األجنبي في شئون مصر -:\n لجأ إسماعيل إلى االقتراض من الدول األوروبية بم تفسر؟ بهدف -:\nٔ - دفع التعويضات الباهظة لشركة لناة السويس ممابل تعديل بعض شروط امتياز حفر المناة لصالح\nالمصريين .\nٕ - اإلنفاق على المشروعات وبناء المصور والحفالت ، مثل : حفل افتتاح لناة السويس الذي دعا فيه\nملون أوروبا وأمراءها وأنفك عليه أموال ا طابلة من خزينة الدولة .\nٖ - دفع كثير من األموال للسلطان العثماني بم تفسر؟ للحصول على لمب خديو ووراثة العرش في\nأبنابه .\n دلل : كانت الدولة العثمانية أحد أسباب األزمة المالية فى عهد الخديو إسماعيل؟\nحيث دفع الخديو إسماعيل للسلطان العثمانى الكثير من األموال التي كان يمترضهامن الدول األوروبية\nللحصول على لمب خديو ووراثة العرش في أبنابه ."],[88,"األزمة المالية -:\n بم تفسر : تعرضت مصر ألزمة ديون شديدة في عهد الخديو إسماعيل؟ بسبب :\nٔ) التوسع في اللتراض من الدول األوروبية ، خاصةا إنجلترا وفرنسا .\nٕ) ارتفاع فوابد الديون .\nٖ) سوء اإلدارة المالية .\n ما النتائج : تعرض مصر ألزمة ديون شديدة في عهد الخديو إسماعيل؟ أدى إلى :\nٔ) بيع الخديو إسماعيل نصيب مصر من أسهم شركة لناة السويس إلى إنجلترا؛ لسداد الديون .\nٕ) زيادة تد ُّخل الدول األوروبية في شبون مصر المالية؛ لضمان حمولها واتخذ هذا التدخل عدة أشكال .\nأشكال ومظاهر تدخُل الدول األوروبية في شئون مصر المالية -:\n-1 بعثة كيف ( 1875 م) :\nأرسلتها إنجلترا بم تفسر؟ لمساعدة وزير المالية المصري في إصالح الشبون المالية .\n-2 صندوق الدَّيْن ( 1876 م) :\n تكوينه : كان أعضاإه مندوبين عن الدول الدابنة .\n أهميته :\nبم تفسر : إنشاء صندوق الدين عام 1876 م؟ بهدف :\nالرلابة على إيرادات مصر لتسديد الديون المستحمة .\n ل يحك لمصر أخذ لرض إل بموافمة أغلبية أعضابه .\n-3 المراقبة الثنائية :\nعين مرالبان ماليان؛ أحدهما إنجليزي لمرالبة اإليرادات ، واآلخر فرنسي لمرالبة المصروفات .\n-4 لجنة التحقيق العليا األوروبية ( ۱۸۷۸ م) :\n سبب تشكيلها : بم تفسر : إنشاء لجنة التحقيق العليا األوروبية ( ٔ۸۷۸ م)؟\nلدراسة أسباب العجز المستمر في إيرادات الدولة المصرية ."],[89," نتائجها : ما النتائج : إنشاء لجنة التحقيق العليا األوروبية ( ٔ۸۷۸ م)؟\n طالبت اللجنة بـ -:\nٔ) ضرورة تنازل الخديو إسماعيل عن كل أمالكه وأمالن عابلته .\nٕ) يتنازل أيضاا عن سلطته المـُطلمة .\n موقف الخديوي إسماعيل من طلب اللجنة : قبل الخديو مطالب اللجنة .\n بم تفسر : يُعتبر عهد الخديو إسماعيل بداية لتقلص الحكم المطلق؟ بسبب :\nلجنة التحميك العليا األوروبية فى مصر والتى كانت من مطالبها تنازل الخديوإسماعيل عن سلطته\nالمطلمة ولد تم لبول الطلب .\n ما العالقة بين : لجنة التحقيق العليا األوروبية ، والوضع المالي والسياسي للخديو إسماعيل؟\nحيث جاء تمرير لجنة التحميك العليا األوروبية بضرورة تنازل الخديو إسماعيل عن أمالكه وأمالن عابلته\nوأيضاا التنازل عن سلطته المطلمة فمبل الخديو إسماعيل مطالب اللجنة .\n-5 الوزارة المختلطة -:\nتشكيلها : اتفمت إنجلترا وفرنسا على استبدال المرالبة الثنابية بتشكيل وزارة مختلطة\nبرباسة نوبار باشا عيُن وزيران أجنبيان فيها أحدهما إنجليزي للمالية واآلخر فرنسي لألشغال .\nسبب تشكيلها : بم تفسر : إنشاء الوزارة المختلطة ؟\nبهدف إصالح األحوال المالية واإلدارية .\nنتائج تشكيلها : ما النتائج : إنشاء الوزارة المختلطة ؟\nأدى وجود الوزراء األجانب في الحكومة المصرية أدى إلى زيادة النفوذ األجنبي والتدخل في شبون\nمصر؛ مما أثار استياء المصريين وأدى إلى سموط الوزارة .\nالحركة الوطنية في عصر الخديو إسماعيل -:\n ما النتائج : زيادة التدخل األجنبي في شئون مصر؟ مما أدى إلى :\nٔ) ازدادت لوة الحركة الوطنية .\nٕ) انحاز الخديو إسماعيل للحركة الوطنية بعد أن فمد كل ممتلكاته وسلطته .\n في مارس ۱۸۷۹ م اجتمع بعض أعضاء الحركة الوطنية ، ووضعوا الالئحة الوطنية ."],[90," بم تفسر : انحياز الخديو إسماعيل للحركة الوطنية في أواخر عهده؟ بسبب :\nٔ) زيادة التدخل األجنبي في شبون مصر .\nٕ) ازدياد لوة الحركة الوطنية بعد أن فمد إسماعيل كل ممتلكاته وسلطاته .\nالالئحة الوطنية -:\n مقترحاتها : ما النتائج : زيادة قوة الحركة الوطنية أواخر عهد إسماعيل؟\nٔ) طالبت بتشكيل وزارة وطنية مسبولة أمام مجلس نيابي حميمي مثل المجالس النيابية في أوروبا .\nٕ) أشارت إلى أن البالد ليست في حالة إفالس وأنها تستطيع الميام بتعهداتها المالية .\n موقف الخديو إسماعيل من مقترحات الالئحة :\n دلل : انحاز الخديو إسماعيل فى أواخر حكمه للحركة الوطنية؟\n بم تفسر : ضغط إنجلترا وفرنسا على السلطان العثماني لعزل إسماعيل؟\nبسبب قيام الخديو إسماعيل بـ :\nٔ) وافك على الالبحة الوطنية .\nٕ) كلف شريف باشا بتشكيل وزارة وطنية جديدة ليس فيها الوزيران األجنبيان .\nٖ) أصدر الخديو إسماعيل مرسو اما في إبريل ٔ۸۷۹ م بم تفسر؟\nبهدف وفماا لما لررته الالبحة الوطنية .\n موقف إنجلترا وفرنسا :\n ما النتائج : أصدر الخديو إسماعيل مرسوميا في إبريل ۱۸۷۹ م لتسوية الديون ؟\n ضغطت إنجلترا وفرنسا على الخديو إسماعيل ليتنازل عن العرش ولكنه رفض .\n فلجؤتا إلى الدولة العثمانية التي كانت معترضة على سياسة إسماعيل الستماللية ما النتائج؟\nفؤصدر السلطان العثماني مرسو اما بخلعه وتولية ابنه دمحم توفيك الحكم بدل ا منه وكان ذلن تمهيداا\nلالحتالل البريطاني لمصر ."],[91,"التدريب الثاني\nس :1 إلى من تنسب األعمال اآلتية ... ؟\nٕ) ربيس البعثة التي أرسلتها إنجلترا لمساعدة وزير المالية المصرى فى إصالح الشبون المالية .\nٖ) تولى رباسة أول وزارة مختلطة فى مصر عام ٔ۸۷۸ م ، والتي ضمت وزيرين أجنبيين .\nٗ) كلفه الخديو إسماعيل بتشكيل وزارة وطنية جديدة ( خالية من الوزراء األجانب) .\nس :2 أعد كتابة العبارات اآلتية بعد تصحيح ما بها من أخطاء :\nٔ) يُعد عهد الخديو إسماعيل من أكثر الفترات تراجعاا وضعفاا فى تاريخ مصر الحديث من الناحية\nالعمرانية .\nٕ) لام الخديو إسماعيل بتمليص ميزانية التعليم .\nٗ) رفض الخديو إسماعيل ممترحات الالبحة الوطنية في مارس ٔ۸۷۹ م .\nس :3 بم تفسر :\nٔ) مد الخديو إسماعيل للخطوط التلغرافية في بالد السودان .\nٖ) لجوء الخديو إسماعيل إلى اللتراض من الدول األوروبية فى بداية عهده .\nٗ) تشكيل لجنة التحميك العليا األوروبية عام ٔ۸۷۸ م .\nس :4 ما العالقة بين :\nالالبحة الوطنية مارس ( ٔ۸۷۹ م) ، وعزل الخديو إسماعيل ؟\nس :5 وضح :\nجهود الخديو إسماعيل إلحياء الصناعات التى بدأت في عهد جده دمحم على"],[92,"س .1 اختر اإلجابة الصحيحة مما بين القوسين :\nٔ ) تولى حكم مصر بعد مرض «دمحم علي» .........\n(إبراهيم باشا - عباس حلمي باشا األول - دمحم سعيد باشا - الخديوي إسماعيل)\nٕ ) أصلح عباس باشا األول الطريك البري بين الماهرة و . .........\n(اإلسكندرية - السويس - أسوان - العريش)\nٖ ) بدأ إنشاء أول خط حديدي في عهد عباس حلمي باشا األول بين .........\n(الماهرة والسويس - السويس واإلسكندرية - اإلسكندرية والعريش - الماهرة واإلسكندرية)\nٗ ) تولى دمحم سعيد باشا حكم مصر بعد وفاة .........\n(دمحم علي - إبراهيم باشا - عباس حلمي باشا األول - الخديوي إسماعيل)\n٘ ) جميع ما يلى من اهتمامات دمحم سعيد باشا بالجانب اللتصادي ويخرج عنها .........\n(تطهير ترعة المحمودية - إنشاء شركات المالحة - تخفيض الضرابب - تمصير مدة الخدمة العسكرية)\n) ٙ أي مما يلى يصنف كإصالح التصادي واجتماعي في آن واحد في عهد دمحم سعيد باشا ؟ .........\n(مد خطوط السكن الحديدية - ترلي الضباط المصريين - إصدار الالبحة السعيدية - جعل الخدمة\nالعسكرية إجبارية)\n) ۷ تم مد الخطوط التلغرافية بين المدن اآلتية في عهد دمحم سعيد باشا ، ويخرج عنها . .........\n(اإلسكندرية - الماهرة - أسوان - السويس)\n) ۸ اهتم دمحم سعيد باشا باآلثار المصرية وجهز مخازن لحفظها في . .........\n(اإلسكندرية - السويس - العريش - بولق)\n(الفرنسية - البريطانية - األلمانية - اإليطالية)\nس :1 اكتب كلمة ( صواب ) أوكلمة (خطأ) ، مع التصويب :\nٔ ) شهدت مصر في عهد خلفاء «دمحم علي» تطورات وتحديات مهمة .\nٕ ) لاد عباس حلمي باشا األول الجيش المصري في كثير من المعارن وتولى الحكم بعد مرض «دمحم\nعلي» .\nٖ ) لم تتجاوز فترة حكم عباس حلمي باشا األول لمصر سنتوات .\nٗ ) تؤثرت الموة العسكرية لمصر باإليجاب في عهد عباس حلمي باشا األول .\n٘ ) أصبح الفالح له الحك في توريث أرضه الزراعية ألبنابه خالل حكم إبراهيم باشا .\n) ٙ خفف دمحم سعيد باشا الضرابب وتجاوز عن المتؤخرين منها .\n) ۷ التصرت شركات المالحة التي أنشؤها دمحم سعيد باشا على النمل النهري ."],[93,") ۸ اختلفت نظرة دمحم سعيد باشا للجيش عن نظرة عباس حلمي باشا األول .\n) ۹ كانت الخدمة العسكرية إجبارية لجميع المصريين في عهد دمحم سعيد باشا .\nٓٔ ) أهمل دمحم سعيد باشا التعليم في مصر خالل حكمه .\nٕٔ ) تم منح ديليسبس حك تؤسيس شركة عالمية لحفر لناة تصل بين البحرين المتوسط واألحمر ( .\nٖٔ ) تولت شركة لناة السويس حفر ترعة مياة عذبة من النيل لمنطمة المناة .\nٗٔ ) كان عمد المتياز الثاني لمناة السويس لصالح مصر .\nس .3 أكمل العبارات اآلتية بكلمات مناسبة :\nٔ ) تولى حكم مصر من خلفاء دمحم علي لبل دمحم سعيد باشا ......... ثم .........\nٕ ) اتسمت فترة حكم عباس حلمي باشا األول بـ ......... و .........\nٖ ) أغلمت في عهد عباس حلمي باشا معظم ......... و ......... التي بناها «دمحم علي» .\nٗ ) اهتم دمحم سعيد باشا بتطهير ترعة .........\n٘ ) أنشؤ دمحم سعيد باشا شركة لتسير البواخر في البحرين ......... و .........\n) ٙ مد دمحم سعيد باشا خط سكة حديدية بين ......... و .........\n) ۷ حصلت شركة ديليسبس على امتياز استغالل لناة السويس لمدة ۹۹ سنة تبدأ من تاريخ .........\nس .4 صوب ما تحته خط :\nٔ ) استدعى إبراهيم باشا البعثات العلمية من فرنسا .\nٕ ) الطريك البري الذي تم إصالحه في عهد عباس حلمي باشا األول امتد بين السويس واإلسكندرية .\nٖ ) تم النتهاء من خط السكة الحديدية بين الماهرة واإلسكندرية في عهد عباس حلمي باشا األول .\nٗ ) اهتم دمحم سعيد باشا بتطهير ترعة المحمودية التي تم حفرها في عهد إبراهيم باشا .\n٘ ) الترض عباس حلمي باشا األول أول لرض من أحد البنون البريطانية .\nس .6 من هو ... ؟\nٔ ) لاد الجيش المصري في كثير من المعارن وتولى حكم مصر أثناء مرض «دمحم علي» .\nٕ ) تولى حكم مصر خلفا إلبراهيم باشا .\nٖ ) أصبح الفالح في عهده له الحك في توريث أرضه .\nٗ ) استكمل مد خط السكة الحديدية بين الماهرة واإلسكندرية .\n٘ ) عرض على «دمحم سعيد باشا» فكرة مشروع لناة تصل البحرين المتوسط واألحمر .\nس .7 في عهد من من حكام مصر ... ؟"],[94,"ٔ ) تم إغالق معظم المدارس والمصانع التي أنشؤها دمحم علي .\nٕ ) بدأ مد خطوط التلغراف في مصر .\nٖ ) تم إصدار لبحة تمكن الفالحين من تصريف محاصيلهم بحرية في عهده .\nٗ ) أصبحت مدة الخدمة العسكرية عام واحد إجباري على جميع المصريين .\n٘ ) تم عمد امتيازان لحفر لناة السويس مع ديليسبس .\nس .8 رتب األحداث اآلتية من األقدم إلى األحدث :\nٔ ) عمد المتياز األول لمناة السويس .\nٕ ) الترض أول لرض من البنون البريطانية .\nٖ ) وفاة إبراهيم باشا\nٗ ) تولى عباس حلمي باشا األول حكم مصر .\nٔ ) تولى دمحم سعيد باشا الحكم .\nٕ ) بدأ تنفيذ خط سكة حديد بين الماهرة واإلسكندرية .\nٖ ) عمد المتياز الثاني لحفرلناة السويس .\nٗ ) فتح باب الستدانة من أوروبا .\nس .9 بم تفسر ... ؟\nٔ ) تولفت حركة النهضة التي بدأت في عهد «دمحم علي» خالل عهد عباس حلمي باشا األول .\nٕ ) اهتمام عباس حلمي باشا ببعض مشروعات النمل والتصالت .\nٖ ) تحسنت أحوال الفالح المصري خالل عهد دمحم سعيد باشا .\nٗ ) استمرار الجمود في التعليم خالل عهد دمحم سعيد باشا .\n٘ ) فتح دمحم سعيد باشا باب الستدانة من الدول األوروبية .\n) ۷ انحياز الخديوي إسماعيل للحركة الوطنية في أواخر عهده .\n) ۸ ضغط إنجلترا وفرنسا على السلطان العثماني لعزل إسماعيل .\nس .10 ما النتائج التي ترتبت على ... ؟\nٔ ) رغبة عباس حلمي باشا األول في تسهيل حركة التجارة .\nٕ ) إصدار الالبحة السعيدية .\nٖ ) عدم وجود تمويل محلي كاف لمشروعات دمحم سعيد باشا .\nٗ ) عمد المتياز الثاني لمناة السويس .\n٘ ) زيادة لوة الحركة الوطنية في أواخر عهد الخديوي إسماعيل ."],[95,"س .11 دلل على صحة كل عبارة من العبارات اآلتية :\nٔ ) تميز إبراهيم باشا ببراعته في المجال الحربي .\nٕ ) شهدت فترة حكم عباس حلمي باشا األول لمصر بعض المزايا .\nٖ ) حظيت الزراعة باهتمام كبير من جانب دمحم سعيد باشا .\nٗ ) تحممت العدالة الجتماعية بالجيش المصري خالل عهد دمحم سعيد باشا .\n٘ ) اهتم دمحم سعيد باشا بحفظ التراث المديم لمصر .\n) ٙ حدث تمدم في وسابل النمل والتصال بعصر دمحم سعيد باشا .\n) ۷ اتبع دمحم سعيد باشا سياسة عباس حلمي باشا تجاه التعليم .\n) ۷ اهتم الخديوي إسماعيل بالجيش والبحرية .\n) ۸ كان لمجلس شورى النواب مهام استشارية .\n) ۹ تعددت صور التدخل األجنبي في مصر خالل عهد الخديوي إسماعيل .\nٓٔ ) انحياز الخديوي إسماعيل في أواخر حكمه للحركة الوطنية .\nس .12 ما العالقة بين ... ؟\nٔ ) عباس حلمي باشا األول ، والنهضة التعليمية التي ألامها «دمحم علي» .\nٕ ) دمحم سعيد باشا ، والفالحين المصريين .\nٖ ) دمحم سعيد باشا ، والمالحة البحرية المصرية .\nٗ ) دمحم سعيد باشا ، والبنون البريطانية .\n٘ ) عمد المتياز الثاني لمناة السويس ، والتصاد مصر .\n) ٙ الحركة الوطنية ، وديون مصر .\n) ۷ الالبحة الوطنية ، ونهاية حكم الخديوي إسماعيل على مصر ."],[96,"أسئلة الكتاب المدرسي\nس .1 لمن تنسب األعمال التاريخية التالية ... ؟\n(ٔ) بدأ فى مد خط سكة حديد بين الماهرة واإلسكندرية .\n(ٕ) صاحب فكرة مشروع لناة السويس .\n(ٖ) أسس مجلس شورى النواب .\n(ٗ) حفر ترعة اإلبراهيمية .\nس :2 اكتب كلمة ( صواب ) أوكلمة (خطأ) ، مع التصويب :\n(ٔ) هدفت سياسة الخديوي إسماعيل الخارجية إلى تعزيز نفوذ مصر\nوالستمالل عن الدولة العثمانية .\n(ٕ) الترض إبراهيم باشا أول لرض خارجي لمصر من الدول األوروبية .\n(ٖ) عاشت مصر فترة من الجمود الفكري والثمافي فى عهد عباس حلمي باشا األول .\n(ٗ) رفض الخديوي إسماعيل الالبحة الوطنية .\nس .3 بم تفسر ... ؟\n(ٔ) تعد فترة حكم عباس حلمي باشا األول لمصر من أسوأ فترات حكم أسرة «دمحم علي» .\n(ٕ) انحياز الخديوي إسماعيل للحركة الوطنية فى أواخر عهده .\n(ٖ) إنشاء صندوق الدين .\nس .4 ما النتائج التى ترتبت على ... ؟\n(ٔ) صدور الالبحة السعيدية .\n(ٕ) صدور الالبحة الوطنية .\n(ٖ) تشكيل الوزارة المختلطة .\nس .5 قارن بين :\nجهود كل من دمحم سعيد باشا ، والخديوي إسماعيل ، فى مجالي الزراعة والري ."],[97,"س :1 اكتب كلمة ( صواب ) أوكلمة (خطأ) ، مع التصويب :\nٔ) أرسلت إنجلترا حملة بميادة فريزر؛ لتثبيت حكم« دمحم على» في مصر .\nٕ) أسهم «دمحم على » في تهدبة ثورة المصريين ضد البرديسي عام ٗٓ ٔ۸ م .\nٖ) ا أدخل «دمحم على » زراعة المطن طويل التيلة إلى مصر .\nٗ) اتسم عصر عباس حلمى األول بالنهضة العلمية الكبرى وإرسال البعثات العلمية لفرنسا ( .\n٘) أصدر دمحم سعيد باشا « الالبحة السعيدية » التى جعلت الفالح له حك توريث األرض ألبنابه ) ( .\nي )ٙ عد عصر الخديو إسماعيل من أزهى الفترات وأكثرها تمد اما وعمرانا فى تاريخ مصر الحديث ) (.\nس :2 اختر اإلجابة الصحيحة مما بين القوسين :\nٔ) غادرت الموات اإلنجليزية مصر ، نتيجة صلح أميان وسلمت مدينة ......... ولالعها .\n(الماهرة - اإلسكندرية - السويس - دمياط )\nٕ) الموة التي بميت فى مصر بعد رحيل الفرنسيين لتؤمين طريك الهند كانت تابعة لـ . ......\n(الممالين - العثمانيين - اإلنجليز - األلبانيين )\nٗ) أنشؤ «دمحم على » المطبعة األميرية فى حى ( . ...... الزمالن - الملعة - بولق - العتبة )\n٘) أُغلمت معظم المدارس والمصانع وأهمل الجيش والبحرية في عصر . ......\n(عباس حلمى األول - دمحم سعيد باشا - الخديو إسماعيل - الخديو توفيك )\n(الفرنسية - األلمانية - البريطانية - األمريكية )\nس :3 ماذا كان سيحدث إذا ... ؟\nٔ) فشل «دمحم» على » فى التخلص من الممالين .\nٕ) دفعت مصر ألساط الديون المستحمة في عصر الخديو إسماعيل .\nٖ) رفض دمحم سعيد باشا شروط امتياز لناة السويس ."],[98,"س :4 بم تفسر ... ؟\nٕ) إنشاء صندوق الدين في عصر الخديو إسماعيل .\nٖ) تدهور أحوال التعليم في عصر عباس حلمى األول ودمحم سعيد باشا .\nٗ) تفالم أزمة الديون في عصر الخديو إسماعيل .\n٘) عمد معاهدة لندن الدولية عام ٓٗ ٔ۸ م .\n)ٙ انحياز الخديو إسماعيل للحركة الوطنية .\nس :5 دلل على صحة العبارات التالية :\nٔ) ازداد التدخل األجنبى فى شبون مصر فى عصر الخديو إسماعيل .\nٕ) كانت كل مشروعات «دمحم على تخدم بناء الموة العسكرية .\nٖ) اهتم دمحم سعيد باشا بالنمل والتصالت .\nس :6 ما النتائج المترتبة على ... ؟\nٔ) إصدار الالبحة السعيدية .\nٕ) حروب «دمحم على» فى اليونان (المورة) .\nس :7 قارن بين كل من :\nالجيش فى عصر «دمحم على» وعصردمحم سعيد باشا\nٕ التعليم في عصر دمحم على وعصر الخديو إسماعيل"],[100," تتنوع النُظُم البيئية في قارات العالم الجديد تنوعيا كبيريا بم تفسر؟ ويرجع ذلك إلى :\n المولع الجغرافي .\nعبْر عدد كبير من دوابر العرض .\n المتداد الفلكي َ\nتنوع مظاهر السطح (التضاريس) .\nُّ \n ومن بين هذه النُظُم البيئية نُظُم الغابات والحشائش التي تتعدد أنواعها وتختلف\nمساحتها وتوزيعها الجغرافي من قارة إلى أخرى .\nأوالي ُ : ىظُه الغابات بكارات العامل اجلديد -:\n تعَّد الغابات من أهم النُظُم البيئية على سطح األرض\"بم تفسر أو دلل\"؟ ألنها :\nتنوع حيوي هابل .\n- تتميز ب ُّ\n- تلعب دورا ا في تحميك التوازن البيبي العالمي .\n وتضم قارات العالم الجديد معظم أنواع الغابات الموجودة في العالم ، وتمتد نُظُم الغابات\nعبر نطاقات مناخية متعددة ."],[101,"-1 نظام الغابات المدارية المطيرة -:\nالموقع الجغرافي لها في قارات العالم الجديد -:\n*قارة أمريكا الشمالية :\n الموقع : ينتشر هذا النظام في :\nألصى جنوب أمريكا الشمالية .\nمعظم ُج ُزر البحر الكاريبي .\n الخصائص النباتية : تتسم أشجارها بأنها :\nألل كثافةا ممارنةا بغابات األمازون .\nأشجارها ألل ضخامةا وتشابكاا .\n*قارة أمريكا الجنوبية :\n تضم نحو نصف مساحة الغابات المدارية المطيرة\nفي العالم .\n الموقع :\nيتركز هذا النظام شمال المارة .\nخاصةا في حوض نهر األمازون .\n الخصائص النباتية : غابات األمازون التي تتسم بـ :\n- تُعد الموطن األصلي ألشجار المطاط .\nتُعد أكبر غابة مطيرة في العالم . - كما تُعد غابات األمازون رئة العالم بم تفسر؟\nألنها تُسهم بشكل كبير في إنتاج األكسجين وامتصاص غاز ثاني أكسيد الكربون (أهمية بيبية) .\n*قارة أستراليا :\n الموقع :\nيظهر فيها هذا النظام بشكل محدود ، ويتركز في :\nجزيرة نيو غينيا .\nشريط ضيك بمحاذاة الساحل الشمالي الشرلي للمارة ."],[102,"-2 نظام غابات البحر المتوسط -:\nالموقع\nالقارة\n*قارة أمريكا الشمالية :\n يوجد هذا النظام في : غرب ولية كاليفورنيا .\n*قارة أمريكا الجنوبية :\n يوجد هذا النظام : على طول ساحل وسط شيلي .\n*قارة أستراليا :\n يوجد هذا النظام في : األجزاء الجنوبية والجنوبية الغربية .\n*غابات البحر المتوسط في شيلي :\n بم تفسر : أهمية غابات البحر المتوسط في شيلي؟ ألنها :\nغابات البحر المتوسط في شيلي تصنَّف ضمن مناطك التنوع البيولوجي العالمية ذات األهمية البيبية الكبيرة .\n تُواجه غابات البحر المتوسط في شيلي في السنوات األخيرة تحديات خطيرة دلل؟\nحيث : تدهورت مساحتها بنسب وصلت إلى نحو ٓ ۹ ۺ في بعض المناطك ماالنتائج؟ مما أدى إلى فمدان\nالتنوع البيولوجي للحيوانات وانمراض بعض األنواع ."],[103,"-3 نظام الغابات الموسمية -:\n- ينتشر هذا النظام في العروض المدارية التي تتميز بـ :\n أمطار صيفية غزيرة .\nي  تميز بفصل جفاف يمتد من ٗ ٙ - أشهر .\nالموقع\nالقارة\n*قارة أمريكا الشمالية :\nي  وجد في مساحات محدودة في ألصى جنوب لارة أمريكا الشمالية .\n*قارة أمريكا الجنوبية :\n يوجد هذا النظام في : المناطك الشرلية من البرازيل .\n*قارة أستراليا :\n يوجد هذا النظام في :\n- بعض أجزاء جزيرة نيو غينيا .\n- شمال أستراليا .\n* األخطار التي تواجه هذا النظام :\nتتعرض بعض أشجاره إلى الحرائق خالل موسم الجفاف .  بم تفسر : صعوبة حدوث الحرائق فى الغابات الموسمية بفصل الصيف؟\nألن نظام الغابات الموسمية ينتشر فى العروض المدارية التى تتميز بسموط األمطارالصيفية الغزيرة .\n-4 نظام الغابات النفضية -:\n*قارة أمريكا الشمالية :\n تستحوذ لارة أمريكا الشمالية على نحو ٕ٘ % من\nإجمالي مساحة الغابات النفضية في العالم .\nي  وجد في نطاق متصل يمتد في المناطك الشرلية\nمن دولتا الوليات المتحدة وكندا .\n*قارة أمريكا الجنوبية :\nي  ظهر في الساحل الجنوبي لدولة شيلي .\n*قارة أستراليا :\n السواحل الجنوبية الشرلية للمارة .\n بعض ال ُج ُزر التابعة لها ."],[104,"* األخطار التي تواجه هذا النظام :\n- تقلصت مساحته بشكل ملحوظ بقارة أمريكا الشمالية بم تفسر؟\nبسبب األنشطة البشرية مثل : الزراعة والرعي .\n-5 نظام الغابات الصنوبرية (المخروطية) -:\nيوجد نظام الغابات الصنوبرية في األمريكتين بينما يكاد يختفي من قارة أستراليا . *قارة أمريكا الشمالية : ينتشر في مساحات كبيرة :\nفي األجزاء الشمالية والشمالية الغربية من المارة .\nكما يمتد فوق منحدرات جبال روكي .\n*قارة أمريكا الجنوبية : يوجد في :\nألصى جنوب المارة فوق منحدرات جبال اإلنديز .\n* األهمية االقتصادية للغابات الصنوبرية :\nمصدرا مه ًّما للمواد الخام وخاصةا األخشاب المستخدمة في البناء\nيُعَد نظام الغابات الصنوبرية ا\nوالصناعات الخشبية .\n* األخطار التي تواجه هذا النظام :\nواج ِه نحو ثُلث أشجار هذا النظام خطر التدهور والنمراض .\nتُ ِ  تتعرض نُظُم الغابات في العالم الجديد إلى تقلُص مساحاتها بم تفسر؟\nبسبب : بعض األخطار ، مثل - : حرابك الغابات .\n- الزحف العمراني والزراعي ."],[105,"التدريب األول\nس :1 أكمل العبارات اآلتية بكلمات مناسبة :\nٔ) تتعدد أنواع نظم الغابات والحشابش فى لارات العالم الجديد وتختلف من لارة ألخرى من\nحيث ................... و . .................\nٕ) الموطن األصلى ألشجار المطاط هو غابات حوض . .................\nٖ) يمتد نظام الغابات النفضية بؤمريكا الشمالية فى نطاق متصل بالمناطك الشرلية\nبدولتا ................. و . .................\nٗ) تكاد تخلو لارة أستراليا من أحد نظم الغابات الربيسية المتواجدة في األمريكتين وهو نظام . .....\nس :2 بم تفسر ... ؟\nٔ) التنوع الكبير للنظم البيبية بمارات العالم الجديد .\nٕ) تُعد الغابات من أهم النظم البيبية على سطح األرض .\nٖ) تسمية غابات األمازون بـ (ربة العالم) .\nٗ) تملص مساحة نظام الغابات النفضية فى أمريكا الشمالية بشكل ملحوظ .\nس :3 دلل على صحة كل عبارة مما يلى :\nٔ) يوجد تشابه بين توزيع الغابات الصنوبرية فى بعض المناطك باألمريكتين .\nٕ) تتنوع نظم الغابات في لارة أستراليا رغم صغر مساحتها .\nٖ) تتعدد المخاطر التي تتعرض لها نظم الغابات في العالم الجديد .\nٗ) تواجه نظم غابات البحر المتوسط فى شيلى تحديات خطيرة في السنوات األخيرة .\nس :4 قارن بين :\nنظام الغابات المدارية المطيرة ، ونظام غابات البحر المتوسط ، من حيث التوزيع الجغرافى فى األمريكتين ."],[106,"ثاىييا ُ : ىظُه احلصائض بكارات العامل اجلديد -:\nتضم قارات العالم الجديد أنواع متعددة من الحشائش مثل :\n الحشائش الحارة (السافانا) .\n الحشائش المعتدلة (اإلستبس - البراري) .\n الحشائش الباردة (التندرا) .\n-1 نظام الحشائش الحارة (السافانا) -:\n تُمثل السافانا مناطق انتقالية بين نظامين دلل؟\nحيث منطمة انتمالية بين الغابات المدارية المطيرة\nوالصحاري الحارة الماحلة .\n*قارة أمريكا الشمالية : يوجد في :\nمساحات صغيرة في جنوب المارة .\n*قارة أمريكا الجنوبية : يوجد في :\nشمال لارة أمريكا الجنوبية وفي هضبة البرازيل .\n*قارة أستراليا : يوجد في :\nمساحات واسعة في شمال لارة أستراليا .\n يتميز نظام السافانا بتنوُع بيولوجي كبير دلل؟\nحيث : من أشهر حيوانات السافانا -:\n النمر األمريكي في األمريكتين .\n تمساح المياه المالحة في أستراليا الذي يُعد من أكبر الزواحف في العالم .\n-2 نظام الحشائش المعتدلة (اإلستبس)\nالبراري)\nالمعتدلة في قارات العالم الجديد نوعين من الحشائش دلل؟ هما -:\nيضم نظام الحشائش  حشائش اإلستبس : هي حشابش خشنة يتخللها لليل من األشجار .\n حشائش البراري : تتميز بكثافتها وطولها عن اإلستبس وانتشار األشجار بها ."],[107,"ويمتد هذا النظام في العروض المعتدلة الوسطى بقارات العالم الجديد ويتوزع كالتالي -:\n*قارة أمريكا الشمالية : يوجد في :\nي  ظهر النوعان من الحشابش المعتدلة (البراري واإلستبس) في نطالين طولييَّْن متجاورين في\nالسهول الوسطى بم تفسر؟ ويرجع ذلن بسبب امتداد المارة في العروض المعتدلة .\n*قارة أمريكا الجنوبية :\nي  نتشر في مساحات شاسعة .\n*قارة أستراليا : يوجد في :\n األجزاء الداخلية السهلية .\n بعض المناطك من نيوزيلندا .\n-3 نظام الحشائش الباردة (التندرا)\nيوجد هذا النظام في األمريكتين كما يلي -:\n*قارة أمريكا الشمالية : يوجد في :\nشمال كندا وألسكا .\n*قارة أمريكا الجنوبية : يوجد في :\nالمرتفعات الجبلية شاهمة مثل : جبال اإلنديز بم تفسر؟\nبسبب شدة البرودة فوق المرتفعات .\n- من أهم الحيوانات التي تعيش في هذا النظام :\n ثور المسن (يملن أغلى صوف طبيعي في العالم) .\n نسر اإلنديز (من أكبر الطيور في العالم) ."],[108,"التدريب الثاني\nس :1 اختر اإلجابة الصحيحة مما بين القوسين :\nٔ) يشغل نظام الحشابش الحارة (السافانا ) مساحات صغيرة فى جنوب لارة . .........\n(أمريكا الجنوبية - أمريكا الشمالية - أستراليا - أنتاركتيكا )\nٕ) يوجد نظام الحشابش المعتدلة بمارة أستراليا في . .........\n( جزيرة نيوغينيا - هضبة غرب أستراليا - جزيرة نيوزيلندا - جبال الحاجز الكبير )\nٖ) يظهر نظام التندرا في أمريكا الجنوبية فوق سفوح جبال . .........\n( روكى - األبالش - اإلنديز - الحاجز الكبير )\nس :2 صوب ما تحته خط :\nٔ) نظام الحشابش المعتدلة
